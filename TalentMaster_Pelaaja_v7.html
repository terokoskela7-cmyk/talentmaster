<!doctype html>
<html lang="fi" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>TalentMaster™ — Pelaaja v4</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════
   TalentMaster™ — Design System tokens (colors_and_type.css inline)
   Dark theme · Player mobile · Standalone
═══════════════════════════════════════════════════════ */
:root {
  --carbon:    #1C1C1A;  --bone:   #F2EFE6;
  --teal:      #1A7A5E;  --teal-d: #28B090;
  --slate:     #585751;  --gold:   #B8860B;
  --fire:      #B85C38;
  --green-dim: rgba(26,122,94,.08);   --green-brd: rgba(26,122,94,.2);
  --amber-dim: rgba(122,90,16,.08);   --amber-brd: rgba(122,90,16,.2);
  --red-dim:   rgba(138,43,43,.08);   --red-brd:   rgba(138,43,43,.2);
  --font-d: 'Cormorant Garamond', Georgia, serif;
  --font-b: 'DM Sans', system-ui, sans-serif;
  --font-m: 'DM Mono', 'SF Mono', Menlo, monospace;
  --r-sm:6px; --r-md:10px; --r-lg:14px;
  /* dark theme */
  --bg:#111110; --bg2:#161614; --bg3:#1C1C1A; --surface:#1E1E1C; --surface2:#1A1A18;
  --border:rgba(242,239,230,.06); --border2:rgba(242,239,230,.12); --border3:rgba(242,239,230,.18);
  --text:#F2EFE6; --ink2:#A8A79F; --ink3:#8BA0BC;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{font-family:var(--font-b);font-size:14px;line-height:1.7;background:#0a0a08;color:var(--text);min-height:100dvh;overflow-x:hidden;width:100%;max-width:100%;}
button{font-family:var(--font-b);cursor:pointer}

/* Keyframes */
@keyframes flicker{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.85;transform:scale(1.05)}}
@keyframes cardPop{0%{opacity:0;transform:scale(.7)}100%{opacity:1;transform:scale(1)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes ripple{0%{transform:scale(1);opacity:.8}100%{transform:scale(5);opacity:0}}
@keyframes dotPop{0%{transform:scale(0)}60%{transform:scale(1.2)}100%{transform:scale(1)}}

/* Outer wrapper */
.wrap{max-width:100%;margin:0 auto;padding:12px 8px 40px;overflow-x:hidden;width:100%;}
.locale-bar{display:flex;justify-content:center;margin-bottom:8px;width:100%;max-width:100%;}
.locale-inner{display:inline-flex;gap:2px;background:rgba(242,239,230,.04);padding:2px;border-radius:4px}
.loc-btn{background:transparent;color:var(--ink3);border:none;padding:4px 8px;font-size:9px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;border-radius:3px;transition:background .12s,color .12s}
.loc-btn.on{background:var(--teal);color:var(--text)}
.scene-bar{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-bottom:10px;width:100%;max-width:100vw;box-sizing:border-box;}
.sp{background:rgba(242,239,230,.04);color:var(--ink3);border:.5px solid rgba(242,239,230,.1);padding:5px 9px;font-size:9px;letter-spacing:.18em;text-transform:uppercase;font-weight:500;border-radius:20px;transition:background .12s,color .12s,border-color .12s}
.sp.on{background:var(--teal);color:var(--text);border-color:var(--teal)}

/* Phone */
.phone{width:min(390px,100vw);height:min(780px,calc(100vh - 90px));margin:0 auto;background:var(--bg);border-radius:36px;border:1px solid #222;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 8px #1a1a1a;position:relative;font-family:var(--font-b);color:var(--text)}
.ph-status{height:42px;padding:14px 24px 0;display:flex;justify-content:space-between;align-items:flex-start;font-family:var(--font-m);font-size:12px;font-weight:500}
.ph-body{height:calc(min(780px,calc(100vh - 90px)) - 42px);overflow:hidden;overflow-y:auto;position:relative}
.scene{background:var(--bg);height:100%;animation:fadeUp .28s ease;position:relative;background:var(--bg)}
.scroll{height:100%;overflow-y:auto;padding-bottom:72px;-webkit-overflow-scrolling:touch}

/* Bottom tabs */
.tabs{position:absolute;bottom:0;left:0;right:0;background:var(--bg2);border-top:.5px solid var(--border2);display:flex;justify-content:space-around;padding:8px 0 14px;z-index:10}
.tb{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 12px;color:var(--ink3);position:relative;transition:color .12s}
.tb.on{color:var(--text)}
.tb svg{width:19px;height:19px;fill:none;stroke:var(--ink3);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;transition:stroke .12s}
.tb.on svg{stroke:var(--teal-d);stroke-width:1.8}
.tb-lbl{font-size:9px;font-weight:500;letter-spacing:.12em;text-transform:uppercase}
.tb-dot{position:absolute;top:-2px;width:3px;height:3px;border-radius:50%;background:var(--teal-d)}

/* Type */
.ey{font-size:9px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--ink3)}
.ey.ac{color:var(--teal-d)}
.sig{font-family:var(--font-d);font-weight:500;font-size:22px;line-height:1.3;color:rgba(242,239,230,.95)}
.kpi{font-family:var(--font-d);font-weight:300;line-height:1;color:var(--text)}
.meta{font-size:11px;color:var(--ink3)}

/* Cards */
.card{background:var(--surface);border:.5px solid var(--border);border-radius:var(--r-md)}
.card2{background:var(--surface2);border:.5px solid var(--border);border-radius:var(--r-md)}
.card-teal{background:linear-gradient(180deg,rgba(26,122,94,.12),rgba(26,122,94,.02));border:.5px solid rgba(26,122,94,.35);border-radius:var(--r-lg)}
.card-gold{background:linear-gradient(135deg,rgba(184,134,11,.1),rgba(184,134,11,.02));border:.5px solid rgba(184,134,11,.3);border-radius:var(--r-md)}

/* Buttons */
.btn-p{width:100%;background:var(--teal);color:var(--text);border:none;padding:16px;font-size:13px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;gap:10px;transition:background .12s}
.btn-p:active{background:#155f48}
.btn-g{background:rgba(242,239,230,.04);color:var(--text);border:.5px solid var(--border3);padding:10px 18px;font-size:10px;letter-spacing:.22em;text-transform:uppercase;font-weight:500;border-radius:20px;display:inline-flex;align-items:center;gap:8px}

/* Row */
.row{background:var(--surface2);border-radius:8px;border:.5px solid var(--border);padding:10px 14px;display:flex;align-items:center;gap:12px;margin-bottom:6px}

/* Section divider */
.sdiv{display:flex;align-items:center;gap:10px;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink3);margin-bottom:10px}
.sdiv::after{content:'';flex:1;height:.5px;background:var(--border2)}

/* KPI grid */
.kgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--border2);border:.5px solid var(--border2)}
.kcell{background:var(--bg2);padding:12px 10px}

/* PIN */
.pin-av{width:52px;height:52px;margin:0 auto;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(26,122,94,.25),rgba(26,122,94,.05));border:.5px solid rgba(26,122,94,.35);display:flex;align-items:center;justify-content:center;font-family:var(--font-b);font-weight:500;font-size:24px;color:var(--teal-d);letter-spacing:.05em}
.pin-dots{display:flex;gap:14px;justify-content:center}
.pd{width:12px;height:12px;border-radius:50%;background:transparent;border:1px solid rgba(242,239,230,.3);transition:background .12s,transform .12s}
.pd.on{background:var(--teal);transform:scale(1.1);animation:dotPop .2s ease}
.kpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.key{background:rgba(242,239,230,.04);border:.5px solid var(--border2);color:var(--text);padding:10px 0;font-size:18px;font-weight:400;border-radius:var(--r-sm);transition:background .12s,transform .08s}
.key:active{background:rgba(26,122,94,.12);transform:scale(.93)}

/* Training progress */
.prog3{display:flex;gap:6px;align-items:center}
.pseg{flex:1;height:3px;border-radius:2px;background:rgba(242,239,230,.08);position:relative;overflow:hidden}
.pseg.done{background:var(--teal)}
.pseg.act{background:rgba(26,122,94,.35)}
.pfill{position:absolute;left:0;top:0;bottom:0;background:var(--teal);transition:width 1s linear}

/* Card overlay */
.cov{position:absolute;inset:0;z-index:200;background:rgba(10,10,8,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;flex-direction:column;align-items:center;justify-content:center;animation:cardPop .45s cubic-bezier(.34,1.56,.64,1);}
.fw{width:240px;height:360px;position:relative}
.ff{position:absolute;inset:0;border-radius:16px;transition:opacity .4s ease,transform .6s cubic-bezier(.4,0,.2,1)}

/* Skeleton */
.skel{background:linear-gradient(90deg,rgba(242,239,230,.04),rgba(242,239,230,.1),rgba(242,239,230,.04));background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:4px}

/* Streak */
.streak-b{display:inline-flex;align-items:center;gap:6px;background:rgba(184,92,56,.12);border:.5px solid rgba(184,92,56,.3);padding:4px 10px;border-radius:20px}
.fl{animation:flicker 2s ease-in-out infinite}
.streak-n{font-family:var(--font-m);font-size:12px;font-weight:500;color:#B85C38}

/* XP bar */
.xpw{margin:0 20px}
.xpl{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);margin-bottom:6px}
.xpt{height:6px;background:rgba(242,239,230,.08);border-radius:3px;overflow:hidden}
.xpf{height:100%;background:linear-gradient(90deg,#1A7A5E,rgba(26,122,94,.6));border-radius:3px}

/* Day grid */
.dgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dc{border-radius:6px;padding:8px 4px;text-align:center;border:.5px solid var(--border);background:rgba(242,239,230,.04)}
.dc.dn{background:rgba(26,122,94,.15);border-color:rgba(26,122,94,.4)}
.dc.tm{background:var(--teal);border:none}

/* Ripple */
.rring{position:absolute;width:30px;height:30px;border-radius:50%;border:1px solid rgba(40,176,144,.6)}

@media(max-width:420px){
  .phone{width:100%;border-radius:0;border:none;box-shadow:none;height:100dvh}
  .wrap{padding:0}
  .scene-bar,.locale-bar{display:none}
}

/* ── FIFA CARD — overlay CSS ──────────────────────────────── */
.fc-ov{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.88);backdrop-filter:blur(14px);display:none;flex-direction:column;align-items:center;justify-content:center;animation:cardPop .4s cubic-bezier(.34,1.56,.64,1)}
.fc-ov.active{display:flex}
.fc-wrap{width:240px;height:360px;position:relative}
.fc-face{position:absolute;inset:0;border-radius:16px;transition:opacity .4s ease,transform .6s cubic-bezier(.4,0,.2,1);backface-visibility:hidden}
.fc-front{background:linear-gradient(135deg,#3A2800,#1A1200 45%,#0D0800);border:1px solid rgba(184,134,11,.4);box-shadow:0 20px 60px rgba(0,0,0,.8),inset 0 0 80px rgba(200,136,42,.1);padding:20px 18px;display:flex;flex-direction:column;color:#B8860B}
.fc-back{background:var(--surface);border:.5px solid var(--border2);padding:18px 18px 14px;display:flex;flex-direction:column;color:var(--text)}
.fc-flipped .fc-front{opacity:0;transform:scale(.9) rotateY(12deg);pointer-events:none}
.fc-flipped .fc-back{opacity:1!important;transform:scale(1) rotateY(0)!important;pointer-events:auto!important}
.fc-back{opacity:0;transform:scale(.9) rotateY(-12deg);pointer-events:none}
.fc-stats{display:grid;grid-template-columns:1fr 1fr;gap:2px 14px;font-size:10px;font-weight:500}
.fc-stat{display:flex;justify-content:space-between;color:rgba(184,134,11,.9)}
.fc-flip-btn{margin-top:22px;background:rgba(242,239,230,.05);border:.5px solid var(--border3);color:var(--text);padding:10px 20px;font-size:10px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;border-radius:20px;display:flex;align-items:center;gap:8px}


/* ── SAMSUNG / PIENI NÄYTTÖ (≤390px) ──────────────────── */
@media (max-width: 390px) {
  .phone {
    width: 100vw !important;
    height: calc(100vh - 90px) !important;
    border-radius: 0 !important;
  }
  .ph-body {
    height: calc(100vh - 90px - 42px) !important;
  }
  .wrap {
    width: 100vw;
    padding: 0;
  }
  .scene-bar {
    gap: 3px;
    padding: 4px 4px 0;
  }
  .sp {
    font-size: 9px !important;
    padding: 4px 7px !important;
  }
  .locale-inner {
    gap: 4px;
  }
  .loc-btn {
    padding: 3px 8px !important;
    font-size: 11px !important;
  }
}


/* ── v5 LISÄTYT TYYLIT ── */
@keyframes toastIn { from{transform:translateY(8px) translateX(-50%);opacity:0} to{transform:translateY(0) translateX(-50%);opacity:1} }
.streak-badge { display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:20px;
  background:rgba(40,176,144,.1);border:.5px solid rgba(40,176,144,.22);
  font-size:11px;font-weight:600;color:#28B090;letter-spacing:.06em; }
.rpe-btn { flex:1;min-width:44px;padding:9px 4px;border-radius:6px;
  border:.5px solid var(--border2);background:var(--surface);
  font-size:11px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;gap:2px;transition:all .12s; }
.rpe-btn:hover { transform:translateY(-2px); }
.flei-anim { transition:width .5s cubic-bezier(.4,0,.2,1); }
.sig-label { display:inline-flex;align-items:center;gap:6px;padding:4px 12px;
  border-radius:20px;font-size:11px;font-weight:600;margin-bottom:10px; }




/* Piilota scrollbar ph-bodyssä kaikissa selaimissa */
#phBody { -ms-overflow-style: none; scrollbar-width: none; }
#phBody::-webkit-scrollbar { display: none; width: 0; }
.scene { -ms-overflow-style: none; scrollbar-width: none; }
.scene::-webkit-scrollbar { display: none; width: 0; }
.scroll { -ms-overflow-style: none; scrollbar-width: none; }
.scroll::-webkit-scrollbar { display: none; width: 0; }

/* ═══ Scrollbar piiloon kaikkialla phone-framessa ═══ */
#phBody,
#phBody *,
.scroll,

  -ms-overflow-style: none !important;
  scrollbar-width: none !important;
}
#phBody::-webkit-scrollbar,
#phBody *::-webkit-scrollbar,
.scroll::-webkit-scrollbar,
.scene::-webkit-scrollbar {
  display: none !important;
  width: 0 !important;
  height: 0 !important;
}
</style>

<div class="wrap">

<div class="locale-bar">

<script>
'use strict';

/* ══════════════════════════════════════
   LOCALE
══════════════════════════════════════ */
const STR = {
  wBack:   {fi:'Tervetuloa takaisin',en:'Welcome back',sv:'Välkommen tillbaka',de:'Willkommen zurück'},
  today:   {fi:'Tänään',en:'Today',sv:'Idag',de:'Heute'},
  streak:  {fi:'Streak katkeamassa — tee 5 min tänään.',en:'Streak about to break — do 5 min today.',sv:'Streaken håller på att brytas — gör 5 min idag.',de:'Serie droht zu reißen — mach 5 Min heute.'},
  start5:  {fi:'Aloita · 5 min',en:'Start · 5 min',sv:'Starta · 5 min',de:'Starten · 5 Min'},
  xpHint:  {fi:'+40 XP · pitää liekin palamassa',en:'+40 XP · keeps the flame alive',sv:'+40 XP · håller lågan brinnande',de:'+40 XP · hält die Flamme'},
  speed:   {fi:'Nopeusketju kotona · 3 tehtävää · ~5 min',en:'Speed chain at home · 3 tasks · ~5 min',sv:'Snabbkedja hemma · 3 uppgifter · ~5 min',de:'Speed-Chain zu Hause · 3 Aufgaben · ~5 Min'},
  otherTdy:{fi:'Muuta tänään',en:'Other today',sv:'Övrigt idag',de:'Weiteres heute'},
  forgotPw:{fi:'Unohtuiko salasana?',en:'Forgot PIN?',sv:'Glömt PIN?',de:'PIN vergessen?'},
  back:    {fi:'Takaisin',en:'Back',sv:'Tillbaka',de:'Zurück'},
  start:   {fi:'Aloita',en:'Start',sv:'Starta',de:'Starten'},
  ready:   {fi:'Valmistaudu',en:'Get ready',sv:'Gör dig redo',de:'Mach dich bereit'},
  done:    {fi:'Valmis',en:'Done',sv:'Klar',de:'Fertig'},
  pause:   {fi:'Tauko',en:'Pause',sv:'Paus',de:'Pause'},
  resume:  {fi:'Jatka',en:'Resume',sv:'Fortsätt',de:'Weiter'},
  backHm:  {fi:'Takaisin kotiin',en:'Back home',sv:'Till startsidan',de:'Zurück'},
};
let loc = localStorage.getItem('tm_loc')||'fi';
const T = k => (STR[k]&&STR[k][loc])||k;
function setLoc(l){
  loc=l; localStorage.setItem('tm_loc',l);
  document.querySelectorAll('.loc-btn').forEach(b=>b.classList.toggle('on',b.textContent===l.toUpperCase()));
  draw();
}

/* ══════════════════════════════════════
   ICONS
══════════════════════════════════════ */
function ic(name,sz=20,col='currentColor',sw=1.5){
  const s=`width:${sz}px;height:${sz}px;stroke:${col};stroke-width:${sw};fill:none;stroke-linecap:round;stroke-linejoin:round`;
  const P={
    home:`<path d="M3 10L12 3L21 10V20a1 1 0 01-1 1H4a1 1 0 01-1-1Z"/><path d="M9 21V13H15V21"/>`,
    users:`<circle cx="9" cy="8" r="3.5"/><path d="M3 21v-1a6 6 0 0112 0v1"/><path d="M16 4a3.5 3.5 0 010 7"/><path d="M21 21v-1a6 6 0 00-4-5.65"/>`,
    zap:`<path d="M13 2L4 14H11L10 22L20 10H13Z"/>`,
    star:`<path d="M12 2L15 9L22 9.5L17 14.5L18.5 21.5L12 17.8L5.5 21.5L7 14.5L2 9.5L9 9Z"/>`,
    user:`<circle cx="12" cy="8" r="4"/><path d="M4 21v-1a7 7 0 0116 0v1"/>`,
    play:`<path d="M7 4L19 12L7 20Z" fill="${col}" stroke="none"/>`,
    pause:`<rect x="7" y="5" width="3.5" height="14" fill="${col}" stroke="none"/><rect x="13.5" y="5" width="3.5" height="14" fill="${col}" stroke="none"/>`,
    check:`<path d="M4 12L10 18L20 6"/>`,
    x:`<path d="M6 6L18 18"/><path d="M18 6L6 18"/>`,
    cR:`<path d="M9 5L16 12L9 19"/>`,
    aUp:`<path d="M12 20V4"/><path d="M5 11L12 4L19 11"/>`,
    flame:`<path d="M12 3c2 3 5 5 5 9a5 5 0 01-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-8z"/>`,
    rot:`<path d="M3 12a9 9 0 0115-6L21 9"/><path d="M21 3V9H15"/>`,
    back:`<path d="M15 5L8 12L15 19"/>`,
    circle:`<circle cx="12" cy="12" r="9"/>`,
  };
  return `<svg viewBox="0 0 24 24" style="${s}">${P[name]||''}</svg>`;
}

/* ══════════════════════════════════════
   STATE

let _sc='pin', _tab='koti', _cOpen=false;
let _tp='intro', _ts=0, _tsec=0, _tpause=false, _ttimer=null, _gsec=0;
let _pin='';
let _oMode='offline';
let _flip=false;
let _htimer=null;

function go(s){
  clearInterval(_ttimer);_ttimer=null;
  clearInterval(_htimer);_htimer=null;
  _tp='intro';_ts=0;_tsec=0;_tpause=false;_gsec=0;
  _pin='';_flip=false;
  _cOpen=(s==='card');
  _tdoneCalled=false;
  _sc=s;
  document.querySelectorAll('.sp').forEach(b=>b.classList.toggle('on',b.dataset.s===s));
  draw();
}

  {name:'Vauhti · lineaariset askeleet',dur:60,ico:'zap',hint:'Aja täydellä vauhdilla 10m — toista 6×'},

══════════════════════════════════════ */
const body=document.getElementById('phBody');

function draw(){
  const hideTabs=_sc==='pin'||_sc==='train';
  let html='';
  if(_sc==='pin')        html=rPin();
  else if(_sc==='train') html=rTrain();
  else if(_sc==='a2')    html=rA2();
  else if(_sc==='a3')    html=rA3();
  else if(_sc==='haptic')html=rHaptic();
  else if(_sc==='offline')html=rOffline();
  else if(_sc==='parent')html=rParent();
  else if(_sc==='vapaa') html=rVapaa();
  else if(_sc==='haaste')html=rHaaste();
  else                   html=rA1();
  const card=(_sc==='card'||_cOpen)?rCard():'';
  const tabs=hideTabs?'':rTabs();
  body.innerHTML=`<div class="scene">${html}${card}${tabs}</div>`;
  bind();
}

/* ──────────────────────────────────────
   BIND EVENTS
────────────────────────────────────── */
function bind(){
  // PIN keys
  body.querySelectorAll('.key').forEach(b=>{
    b.addEventListener('click',()=>{
      const k=b.dataset.k;
      if(k==='⌫'){_pin=_pin.slice(0,-1);}
      else if(_pin.length<4){_pin+=k;}
      if(_pin.length===4){setTimeout(()=>_kirjauduPinilla(_pin),280);}
      body.querySelectorAll('.pd').forEach((d,i)=>d.classList.toggle('on',i<_pin.length));
    });
  });
  // Tabs
  body.querySelectorAll('.tb').forEach(b=>b.addEventListener('click',()=>{_tab=b.dataset.t;draw();}));
  // Train
  const sb=body.querySelector('#sTrain'); if(sb)sb.addEventListener('click',()=>{_tp='go';_tsec=0;_gsec=0;draw();startGo();});
  const pb=body.querySelector('#pBtn');   if(pb)pb.addEventListener('click',()=>{_tpause=!_tpause;draw();if(!_tpause)startEx();else clearInterval(_ttimer);});
  const nb=body.querySelector('#nBtn');   if(nb)nb.addEventListener('click',()=>{clearInterval(_ttimer);if(_ts+1>=3){_tp='done';_tmKirjaa('T',true);draw();}else{_ts++;_tsec=0;_tp='ex';draw();startEx();}});
  const db=body.querySelector('#dBtn');   if(db)db.addEventListener('click',()=>{_tmKirjaa('T',true);go('a1');});
  body.querySelectorAll('[data-exit]').forEach(b=>b.addEventListener('click',()=>go('a1')));
  // Card
  const fl=body.querySelector('#flip');   if(fl)fl.addEventListener('click',()=>{_flip=!_flip;draw();});
  const cc=body.querySelector('#cClose'); if(cc)cc.addEventListener('click',()=>{_cOpen=false;if(_sc==='card')go('a1');else draw();});
  body.querySelectorAll('[data-card]').forEach(el=>el.addEventListener('click',()=>{_cOpen=true;draw();}));
  body.querySelectorAll('[data-train]').forEach(el=>el.addEventListener('click',()=>go('train')));
  // Offline toggle
  body.querySelectorAll('[data-om]').forEach(b=>b.addEventListener('click',()=>{_oMode=b.dataset.om;draw();}));
  // Haptics interval
  if(_sc==='haptic'&&!_htimer){_htimer=setInterval(()=>{},2000);}
  // Resume train if needed
  if(_sc==='train'&&_tp==='ex'&&!_tpause&&!_ttimer)startEx();
  if(_sc==='train'&&_tp==='go')startGo();
}

/* ──────────────────────────────────────
   TRAINING TIMERS
────────────────────────────────────── */
function startGo(){
  clearInterval(_ttimer);
  _ttimer=setInterval(()=>{
    _gsec++;
    const n=Math.max(0,4-_gsec);
    const el=body.querySelector('#goN');
    if(el){el.textContent=n>0?n:'Nyt';el.style.animation='none';el.offsetHeight;el.style.animation='cardPop .6s cubic-bezier(.34,1.56,.64,1)';}
    if(_gsec>3){clearInterval(_ttimer);_ttimer=null;_tp='ex';_tsec=0;draw();startEx();}
  },700);
}
function startEx(){
  clearInterval(_ttimer);
  _ttimer=setInterval(()=>{
    if(_tpause)return;
    _tsec++;
    const ex=EX[_ts];
    const pct=(_tsec/ex.dur)*100;
    const rem=ex.dur-_tsec;
    const ss=String(rem%60).padStart(2,'0');
    const r=100,c=2*Math.PI*r;
    const ring=body.querySelector('#tRing');
    const time=body.querySelector('#tTime');
    if(ring){ring.style.strokeDasharray=c;ring.style.strokeDashoffset=c*(1-pct/100);}
    if(time)time.textContent=`0:${ss}`;
    const fills=body.querySelectorAll('.pfill');
    if(fills[_ts])fills[_ts].style.width=pct+'%';
    if(_tsec>=ex.dur){
      clearInterval(_ttimer);_ttimer=null;
      if(_ts+1>=EX.length){_tp='done';draw();}
      else{_ts++;_tsec=0;draw();startEx();}
    }
  },1000);
}

function _toggleEmailLogin() {
  const form = document.getElementById('emailLoginForm');
  if (!form) return;
  form.style.display = form.style.display === 'none' ? 'block' : 'none';
  if (form.style.display === 'block') {
    setTimeout(() => document.getElementById('pinEmail')?.focus(), 100);
  }
}

async function _kirjauduEmaililla() {
  const email = document.getElementById('pinEmail')?.value?.trim();
  const pass  = document.getElementById('pinPassword')?.value;
  const errEl = document.getElementById('emailLoginErr');
  if (!email || !pass) {
    if (errEl) { errEl.textContent = 'Syötä sähköposti ja salasana.'; errEl.style.display = 'block'; }
    return;
  }
  if (errEl) errEl.style.display = 'none';
  const btn = document.querySelector('#emailLoginForm button:last-child');
  if (btn) btn.textContent = 'Kirjaudutaan...';
  try {
    await firebase.auth().signInWithEmailAndPassword(email, pass);
    // onAuthStateChanged hoitaa loput
  } catch(e) {
    const msg = e.code === 'auth/wrong-password' ? 'Väärä salasana.' :
                e.code === 'auth/user-not-found'  ? 'Sähköpostia ei löydy.' :
                e.code === 'auth/invalid-email'    ? 'Tarkista sähköposti.' :
                'Kirjautuminen epäonnistui.';
    if (errEl) { errEl.textContent = msg; errEl.style.display = 'block'; }
    if (btn) btn.textContent = 'KIRJAUDU SISÄÄN';
  }
}

/* ═══════════════════════════════════════════════════════════
   J – OMA TREENI (vapaa kirjaus)
   Käyttötarkoitus: pihapelit, kaverien kanssa pelailu, oma
   kehonpaino-treeni — kaikki se mitä 70/30-pakka EI kata.
   Ei kilpaile T/S-harjoitteen kanssa: saa puolet XP:tä,
   näkyy streakissä, valmentaja näkee "oma-merkinnän".
═══════════════════════════════════════════════════════════ */
let _vaTyyppi=null;  // pihapeli | kaveri | keho | pallo | muu
let _vaMin=20;
let _vaFiilis=null;  // 1-5
let _vaKavereita=0;
let _vaSaved=false;

function rVapaa(){
  if(_vaSaved) return rVapaaDone();
  const tyypit=[

    {k:'keho',    l:'Oma keho',s:'Juoksu, kuntopiiri',i:'zap'},
    {k:'pallo',   l:'Pallo yksin',s:'Pomputtelu, teknikka',i:'circle'},
    {k:'muu',     l:'Jotain muuta',s:'Uinti, tanssi, rullat',i:'star'},
  ];
  const fiilikset=[
    {n:1,e:'😐',l:'Kevyt'},
    {n:2,e:'🙂',l:'OK'},
    {n:3,e:'😊',l:'Hyvä'},
    {n:4,e:'💪',l:'Tiukka'},
    {n:5,e:'🔥',l:'Täysillä'},
  ];
  return `
<div class="scroll" style="background:var(--bg);padding:20px 18px 32px">
  <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px">
    <div>
      <div class="ey" style="margin-bottom:6px">Oma treeni</div>
      <div class="sig" style="font-size:26px;line-height:1.1">Mitä teit tänään?</div>
    </div>
    <button onclick="go('a1')" style="background:transparent;border:none;color:var(--ink3);font-size:22px;padding:4px 8px;margin-top:-4px">×</button>
  </div>

  <div style="padding:14px 16px;background:rgba(26,122,94,.08);border-left:2px solid var(--teal);border-radius:6px;margin-bottom:20px">
    <div style="font-size:12px;color:var(--text);line-height:1.55;font-weight:300">
      Pihapelit, kaverien kanssa ${'pelail'}u ja oma treeni lasketaan. Valmentaja näkee mitä teit — ei tarvitse olla täydellistä.
    </div>
  </div>

  <div class="ey" style="margin-bottom:10px">1. Minkälaista treeniä?</div>
  <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:24px">
    ${tyypit.map(t=>`
      <button onclick="_vaTyyppi='${t.k}';draw()" 
        style="padding:14px 12px;border-radius:10px;text-align:left;cursor:pointer;
        background:${_vaTyyppi===t.k?'rgba(26,122,94,.14)':'var(--surface)'};
        border:.5px solid ${_vaTyyppi===t.k?'rgba(26,122,94,.5)':'var(--border2)'};
        color:var(--text);display:flex;flex-direction:column;gap:4px;transition:all .12s">
        <div style="display:flex;align-items:center;gap:8px">
          ${ic(t.i,14,_vaTyyppi===t.k?'#28B090':'#A8A79F',1.6)}
          <div style="font-size:13px;font-weight:600">${t.l}</div>
        </div>
        <div style="font-size:10px;color:var(--ink3);letter-spacing:.02em">${t.s}</div>
      </button>
    `).join('')}
  </div>

  ${_vaTyyppi==='pihapeli'||_vaTyyppi==='kaveri'?`
    <div class="ey" style="margin-bottom:10px">Kaverit (ei pakollinen)</div>
    <div style="display:flex;gap:6px;margin-bottom:24px;align-items:center">
      ${[0,1,2,3,4,5].map(n=>`
        <button onclick="_vaKavereita=${n};draw()" 
          style="width:38px;height:38px;border-radius:50%;border:.5px solid ${_vaKavereita===n?'rgba(26,122,94,.5)':'var(--border2)'};
          background:${_vaKavereita===n?'rgba(26,122,94,.14)':'transparent'};color:${_vaKavereita===n?'#28B090':'var(--ink3)'};

    </div>
  `:''}

  <div class="ey" style="margin-bottom:10px">2. Paljonko aikaa?</div>
  <div style="padding:16px;background:var(--surface);border:.5px solid var(--border2);border-radius:10px;margin-bottom:24px">
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px">

    </div>
    <input type="range" min="5" max="120" step="5" value="${_vaMin}" 
      oninput="_vaMin=+this.value;document.getElementById('vaMinDisp').textContent=_vaMin" 
      style="width:100%;accent-color:var(--teal-d)">

      <span>5 min</span><span>120 min</span>

  <div class="ey" style="margin-bottom:10px">3. Miltä tuntui?</div>
  <div style="display:flex;gap:6px;margin-bottom:32px">

    color:var(--text);border:none;border-radius:10px;font-size:13px;font-weight:600;

  </div>
</div>`;

function rVapaaDone(){
  return `
<div style="padding:32px 24px;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background:var(--bg)">
  <div style="width:80px;height:80px;border-radius:50%;background:rgba(26,122,94,.14);border:.5px solid rgba(26,122,94,.45);display:flex;align-items:center;justify-content:center;margin-bottom:24px;animation:cardPop .4s ease">
    ${ic('check',34,'#28B090',2)}
  </div>

  <div style="font-family:var(--font-d);font-weight:300;font-size:34px;line-height:1.15;margin-bottom:12px;color:var(--text);max-width:280px">
    Hyvää työtä.<br>Liekki pysyy.
  </div>
  <div style="font-size:13px;color:var(--ink2);max-width:260px;line-height:1.55;margin-bottom:28px">
    ${_vaMin} min · ${_vaTyyppi==='pihapeli'?'pihapeli':_vaTyyppi==='kaveri'?'kaverin kanssa':_vaTyyppi==='keho'?'oma keho':_vaTyyppi==='pallo'?'pallo yksin':'muu treeni'}${_vaKavereita>0?` · ${_vaKavereita===5?'5+':_vaKavereita} kaveria`:''}
  </div>
  <div style="display:flex;gap:10px;align-items:center;margin-bottom:24px">
    <div style="padding:6px 12px;background:rgba(26,122,94,.1);border:.5px solid rgba(26,122,94,.3);border-radius:20px;font-size:11px;color:#28B090;font-weight:600">+${Math.round(_vaMin*0.5)} XP</div>
    <div style="padding:6px 12px;background:rgba(184,134,11,.1);border:.5px solid rgba(184,134,11,.3);border-radius:20px;font-size:11px;color:var(--gold);font-weight:600">🔥 Streak ${(_streak||0)+1}</div>
  </div>
  <button onclick="_vaReset();go('a1')" style="padding:12px 32px;background:transparent;color:var(--ink2);border:.5px solid var(--border2);border-radius:8px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;cursor:pointer">
    Takaisin
  </button>
</div>`;
}

function _tallennaVapaa(){
  if(!_vaTyyppi||!_vaFiilis) return;
  _vaSaved=true;
  // Firestore-kirjaus (demo-userille no-op)
  try{
    if(typeof _tmKirjaa==='function'){
      _tmKirjaa('oma_tyyppi', _vaTyyppi);
      _tmKirjaa('oma_min', _vaMin);
      _tmKirjaa('oma_fiilis', _vaFiilis);
      _tmKirjaa('oma_kavereita', _vaKavereita);
      if(typeof _kirjaaStreak==='function') _kirjaaStreak().catch(()=>{});
    }
  }catch(e){}
  // ── TMBus: julkaise ekosysteemille ──
  try{
    if(window.TMBus){
      const pid = (_pelaaja && _pelaaja.id) || window._tmPlayerId || 'eemeli';
      TMBus.publish('training', {
        playerId: pid,
        source: 'self',
        tyyppi: _vaTyyppi,
        minutes: _vaMin,
        fiilis: _vaFiilis,
        kavereita: _vaKavereita
      });
    }
  }catch(e){}
  draw();
}

function _vaReset(){
  _vaTyyppi=null;_vaMin=20;_vaFiilis=null;_vaKavereita=0;_vaSaved=false;
}

/* ══ LATAA FIREBASE PELAAJA — täysi v3-flow ══════════════════════
   Reitit: super_admin → URL-param+huoltaja → huoltajahaku → UID-haku
══════════════════════════════════════════════════════════════════ */
async function _lataaFirebasePelaaja(auth, db, user) {
  try {
    const tokenTulos = await user.getIdTokenResult(true);
    const claims = tokenTulos.claims || {};

    // ── Super admin ──────────────────────────────────────────────
    if (claims.super_admin || claims.superAdmin) {
      console.log('[v4] Super Admin Pelaaja-näkymässä');
      const saPelId = _URL.pelaajaId;
      const saSeura = _URL.seuraId || 'kpv';
      if (saPelId && saSeura) {
        try {
          const snap = await db.collection('seurat').doc(saSeura)
            .collection('pelaajat').doc(saPelId).get();
          if (snap.exists) {
            _pelaaja = { id: snap.id, seuraId: saSeura, ...snap.data() };
            window._seuraId = saSeura;
            _kaynnistaAppUI();
            return;
          }
        } catch(e) { console.warn('[SA URL]', e.message); }
      }
      // SA fallback: demo-pelaaja
      _isDemoUser = false;
      _pelaaja = { id: 'super_admin_view', etunimi: 'Super', sukunimi: 'Admin',
        seuraId: saSeura || 'kpv', syntymaVuosi: 2011,
        flei_viimeisin: 75, streak: 3, xp: 250, taso: 3,
        sbl:2.1, sfl:1.9, ll:1.8, diag:2.0, dfl:1.7 };
      window._seuraId = _pelaaja.seuraId;
      _kaynnistaAppUI();
      return;
    }

    const urlPelId = _URL.pelaajaId;
    const urlSeura = _URL.seuraId || claims.seuraId || 'kpv';
    window._seuraId = urlSeura;

    // ── Tapa 0: URL-param + huoltajaEmail tarkistus ──────────────
    if (urlPelId && urlSeura) {
      try {
        const snap = await db.collection('seurat').doc(urlSeura)
          .collection('pelaajat').doc(urlPelId).get();
        if (snap.exists) {
          const d = snap.data();
          const emailTasmaa = d.huoltajaEmail && user.email &&
            d.huoltajaEmail.toLowerCase() === user.email.toLowerCase();
          if (emailTasmaa || claims.super_admin) {
            _pelaaja = { id: snap.id, seuraId: urlSeura, ...d };
            _kaynnistaAppUI();
            return;
          }
        }
      } catch(e) { console.warn('[Tapa0]', e.message); }
    }

    // ── Tapa 1: Huoltajahaku emaililla ───────────────────────────
    if (user.email) {
      try {
        const hSnap = await db.collection('seurat').doc(urlSeura)
          .collection('pelaajat')
          .where('huoltajaEmail', '==', user.email.toLowerCase()).limit(1).get();
        if (!hSnap.empty) {
          _pelaaja = { id: hSnap.docs[0].id, seuraId: urlSeura, ...hSnap.docs[0].data() };
          window._seuraId = urlSeura;
          _kaynnistaAppUI();
          return;
        }
      } catch(e) { console.warn('[Tapa1]', e.message); }
    }

    // ── Tapa 2: UID-haku Custom Claimsista ──────────────────────
    const claimSeura = claims.seuraId || urlSeura;
    if (claimSeura) {
      try {
        const snap = await db.collection('seurat').doc(claimSeura)
          .collection('pelaajat').doc(user.uid).get();
        if (snap.exists) {
          _pelaaja = { id: snap.id, seuraId: claimSeura, ...snap.data() };
          window._seuraId = claimSeura;
          _kaynnistaAppUI();
          return;
        }
      } catch(e) { console.warn('[Tapa2]', e.message); }
    }

    // ── Ei löydy → kirjautumisruutu ─────────────────────────────
    console.warn('[v4] Pelaajaa ei löydy — näytetään PIN');
    go('pin');

  } catch(e) {
    console.warn('[_lataaFirebasePelaaja]', e.message);
    // Kirjataan virhe Firestoreen jos db käytettävissä
    if (window._db) {
      window._db.collection('errors').add({
        fn: '_lataaFirebasePelaaja', msg: e.message,
        ts: firebase.firestore.FieldValue.serverTimestamp(),
      }).catch(()=>{});
    }
    go('pin');
  }
}

async function _tarkistaPinSessio(auth, db) {
  try {
    const raw = localStorage.getItem('tm_pin_sessio');
    if (!raw) return false;
    const sessio = JSON.parse(raw);
    // Sessio vanhenee 30 päivässä
    if (!sessio.ts || Date.now() - sessio.ts > 30 * 86400000) {
      localStorage.removeItem('tm_pin_sessio');
      return false;
    }
    if (!auth.currentUser) {
      await auth.signInAnonymously().catch(()=>{});
    }
    // Lataa pelaaja sessiosta
    const snap = await db.collection('seurat').doc(sessio.seuraId)
      .collection('pelaajat').doc(sessio.pelaajaId).get();
    if (!snap.exists) return false;
    _pelaaja = { id: snap.id, seuraId: sessio.seuraId, ...snap.data() };
    window._seuraId = sessio.seuraId;
    _kaynnistaAppUI();
    return true;
  } catch(e) {
    console.warn('[pin-sessio]', e.message);
    return false;
  }
}

function _laskeStage(sy, phv) {
  if (phv === 'huippu') return '1_leikkija';
  const ika = new Date().getFullYear() - (sy || 2010);
  if (ika <= 12) return '1_leikkija';
  if (ika <= 15) return '2_rakentaja';
  return '3_showcase';
}

function _laskeFlei(p) {
  return {
    SBL:  Math.round((p.sbl  || 2.5) / 3 * 100),
    SFL:  Math.round((p.sfl  || 2.5) / 3 * 100),
    LL:   Math.round((p.ll   || 2.5) / 3 * 100),
    DIAG: Math.round((p.diag || 2.5) / 3 * 100),
    DFL:  Math.round((p.dfl  || 2.5) / 3 * 100),
  };
}

function _heikoinKetju() {
  if (!Object.keys(_flei).length) return 'SBL';
  return Object.entries(_flei).sort(([,a],[,b])=>a-b)[0][0];
}

async function _tmKirjaa(avain, arvo) {
  if (!_pelaaja?.id || !window._db) return;
  const pvm = new Date().toISOString().slice(0,10);
  const seuraId = window._seuraId || _pelaaja?.seuraId || null;

      ? window._db.collection('seurat').doc(seuraId)

          .collection('kirjaukset').doc(pvm)
      : window._db.collection('pelaajat').doc(_pelaaja.id)
          .collection('kirjaukset').doc(pvm); // fallback legacy
    await ref.set(
      { [avain]: arvo, paivitetty: firebase.firestore.FieldValue.serverTimestamp() },
      { merge: true }
    );
  } catch(e) {
    console.warn('[v4 kirjaus]', e.message);

/* ══ TALLENNA KIRJAUS — batch write (streak + XP atomisesti) ═════
   Polku: seurat/{seuraId}/pelaajat/{pid}/kirjaukset/{pvm}
═════════════════════════════════════════════════════════════════ */
async function _tallennaKirjaus(tyyppi, xp, kaikki) {
  if (_isDemoUser || !_pelaaja || !window._db) return;

  const sid = window._seuraId || _pelaaja.seuraId;
  const pid = _pelaaja.id;
  if (!sid || !pid || pid === 'super_admin_view') return;

  const pvm = new Date().toISOString().slice(0,10);
  const db  = window._db;
  const pelaajaDok  = db.collection('seurat').doc(sid).collection('pelaajat').doc(pid);
  const kirjausDok  = pelaajaDok.collection('kirjaukset').doc(pvm);
  const h = new Date().getHours();
  const aika = h < 11 ? 'aamu' : h < 17 ? 'paiva' : 'ilta';

  try {
    const batch = db.batch();

    // 1. Päiväkirjaus
    batch.set(kirjausDok, {
      tyyppi, tehty: true, xp, aika, pvm,
      paivitetty: firebase.firestore.FieldValue.serverTimestamp(),
    }, { merge: true });

    // 2. Pelaajadok: XP + streak (vain jos kaikki tehty)
    const paivitys = {
      xp: (_pelaaja.xp || 0) + (xp || 0),
    };
    if (kaikki) {
      _streak = (_streak || 0) + ((_streakLastDate === pvm) ? 0 : 1);
      paivitys.streak = _streak;
      paivitys.streak_paivitetty = pvm;
      _streakLastDate = pvm;
    }
    batch.update(pelaajaDok, paivitys);
    _pelaaja.xp = paivitys.xp;

    await batch.commit();
    console.log('[v4] Kirjaus tallennettu:', tyyppi, xp, 'XP');

  } catch(e) {
    console.warn('[v4 kirjaus]', e.message);
    // Ei näytetä virhettä — offline-tuki tulossa
  }
}

async function _kirjauduPinilla(pin) {

  if (!window._db || !window._auth) return;

  const db   = window._db;

      await auth.signInAnonymously().catch(e => console.warn('[anon]', e.message));
      _kirjautuminenKesken = false;

    const SEURAT = ['kpv','fcl','palloiirot','yvies','sjk','grifk','vifk'];

    let foundSeura = null;

      try {
        const snap = await db.collection('seurat').doc(seura)
          .collection('pelaajat')
          .where('pin', '==', pin).limit(1).get();
        if (!snap.empty) {

          foundSeura = seura;
          break;
        }
      } catch(e) { /* seura ei ole käytössä */ }

    if (!found) {
      // Näytä virhe PIN-ruudussa

      if (errEl) errEl.textContent = 'Virheellinen PIN. Tarkista koodi.';
      return;
    }

/* ══ TMBus-integraatio ══════════════════════════════════════
   Kuuntelee ekosysteemin tapahtumia — valmentajan reagoinnit
   ja viestit näytetään toast-ilmoituksina + tallennetaan
   näkyvään inboxiin.
══════════════════════════════════════════════════════════ */
function _initTMBus(){
  if(!window.TMBus) return;
  // Jos meillä ei ole pelaajaa (demo), asetetaan window._tmPlayerId URL-parametrista tai oletetaan eemeli
  try{
    const u = new URL(location.href);
    const qp = u.searchParams.get('pid');
    window._tmPlayerId = qp || 'eemeli';
  }catch(e){ window._tmPlayerId = 'eemeli'; }

  TMBus.subscribe((msg) => {
    if(!msg || msg.kind !== 'event' || !msg.evt) return;
    const evt = msg.evt;
    const myId = (_pelaaja && _pelaaja.id) || window._tmPlayerId;
    // Näytä vain MINUN tapahtumat
    if(evt.playerId !== myId) return;
    if(evt.type === 'coach_react' && evt.coachId){
      _tmToast(`${evt.emoji||'❤️'} Valmentaja reagoi kirjaukseesi`, 'coach_react');
    } else if(evt.type === 'coach_message' && evt.channel !== 'family'){
      _tmToast(`Uusi viesti valmentajalta`, 'coach_msg');
    } else if(evt.type === 'challenge' && evt.fromPlayerId && evt.status==='sent'){
      _tmToast(`Uusi haaste ${evt.fromPlayerId}:lta`, 'challenge');
    }
  });
}

function _tmToast(text, kind){
  let bar = document.getElementById('tmToast');
  if(!bar){
    bar = document.createElement('div');
    bar.id = 'tmToast';
    bar.style.cssText='position:fixed;left:50%;top:24px;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none';
    document.body.appendChild(bar);
  }
  const el=document.createElement('div');
  el.style.cssText='padding:12px 20px;background:rgba(26,122,94,.95);color:#fff;border-radius:24px;font-family:var(--font-b,system-ui);font-size:13px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:tmFadeIn .3s ease,tmFadeOut .4s ease 4s forwards;pointer-events:auto';
  el.textContent=text;
  bar.appendChild(el);
  setTimeout(()=>el.remove(),4500);
  if(!document.getElementById('tmToastCss')){
    const s=document.createElement('style');s.id='tmToastCss';
    s.textContent='@keyframes tmFadeIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}@keyframes tmFadeOut{to{opacity:0;transform:translateY(-8px)}}';
    document.head.appendChild(s);
  }
}

/* ═══════════════════════════════════════════════════════════
   70/30 HARJOITELOGIIKKA v5
   70% KOKONAISVALTAINEN (T-harjoite, kiertävä kaikista ketjuista)
   30% KOHDENNETTU (S-harjoite, aina heikoin ketju)
   D = dynaaminen lämmittely ennen kaikkea
   P = progressiivinen lajispesifinen (rakentaja+showcase)
   Invariantti: S kohdentuu AINA heikoimpaan, ei profiiliin
   T-harjoite joka päivä — myös lepopäivinä (Walker 2017)
═══════════════════════════════════════════════════════════ */
function _valitseHarjoite(ketju, tyyppi, stage) {
  const pool = ((window.PANKKI||{})[ketju]||{})[stage] || 
               ((window.PANKKI||{})[ketju]||{})[stage==='showcase'?'rakentaja':'leikkija'] || [];
  const filtered = pool.filter(h => h.tyyppi === tyyppi);
  if (!filtered.length) return null;
  // Deterministinen kierto päivän ja stage-tason mukaan
  const d = new Date();
  const idx = (d.getDate() + d.getDay()) % filtered.length;
  return filtered[idx];
}

function _luoOhjelma(pelaaja) {
  const flei = _laskeFlei(pelaaja);
  const heikoin = _heikoinKetju();  // käyttää globaalia _flei
  const stage = _laskeStage(pelaaja.syntymaVuosi, pelaaja.phv_tila);
  
  // T-ketju kiertää joka päivä kaikista 5 ketjusta (70% = kokonaisvaltainen)
  const tKierros = ['SBL','SFL','LL','DIAG','DFL'];
  const tKetju = tKierros[new Date().getDay() % 5];
  const tHarjoite = _valitseHarjoite(tKetju, 'T', stage);
  
  // S = aina heikoin (30% = kohdennettu)
  const sHarjoite = _valitseHarjoite(heikoin, 'S', stage);
  
  // D = dynaaminen lämmittely (ikäspesifinen)
  const dHarjoitteet = {
    leikkija: {nimi:'Liikeleikki-lämmittely', kuvaus:'5 min vapaata liikettä — pallolla tai ilman'},
    rakentaja:{nimi:'Dynaaminen venyttely', kuvaus:'Jalan heilautukset + lonkan kierto + askelkyykky-kävely'},
    showcase: {nimi:'Hermostollinen aktivointi', kuvaus:'A-skip + B-skip + seinäkiihdytys — 3×15 m'},
  };
  const dHarjoite = dHarjoitteet[stage] || dHarjoitteet['rakentaja'];
  
  return { heikoin, stage, flei, tHarjoite, sHarjoite, dHarjoite, tKetju };
}

// Päivitä EX-array harjoitelogiikasta
function _paivitaEXHarjoitelogiikasta() {
  const p = _pelaaja || {};
  const ohj = _luoOhjelma(p);
  
  const ketjuIko = {SBL:'⚡',SFL:'🦵',LL:'↔️',DIAG:'🔄',DFL:'🏗️'};
  const stageIko = {leikkija:'🟢',rakentaja:'🟡',showcase:'🔴'};
  
  if (ohj.tHarjoite) {
    EX[0] = {
      name: ohj.tHarjoite.nimi,
      dur: (ohj.tHarjoite.kesto || 8) * 6, // minuutit → sekunnit (max 8 min → 480s, näytetään 60s demo)
      ico: 'zap',
      hint: ohj.tHarjoite.kuvaus,
      ketju: ohj.tKetju,
      tyyppi: 'T',
      why: getWhy(ohj.tKetju, 'T', _stage),
    };
  }
  if (ohj.sHarjoite) {
    EX[1] = {
      name: ohj.sHarjoite.nimi,
      dur: (ohj.sHarjoite.kesto || 8) * 6,
      ico: 'target',
      hint: ohj.sHarjoite.kuvaus,
      ketju: ohj.heikoin,
      tyyppi: 'S',
      why: getWhy(ohj.heikoin, 'S', _stage),
    };
  }
  // D = dynaaminen aina ensimmäisenä
  EX[2] = {
    name: ohj.dHarjoite.nimi,
    dur: 60,
    ico: 'fire',
    hint: ohj.dHarjoite.kuvaus,
    tyyppi: 'D',
    why: 'Lämmittely valmistelee hermostoa ja faskiat harjoitukseen.',
  };
  // Järjestys: D → T → S
  EX.sort((a,b) => {const o={D:0,T:1,S:2};return (o[a.tyyppi]||3)-(o[b.tyyppi]||3);});
  console.log('[v5] Ohjelma päivitetty — stage:', ohj.stage, 'heikoin:', ohj.heikoin);
}

/* ═══════════════════════════════════════════════════════════
   STREAK-LOGIIKKA v5 — Firestore
   Lasketaan kirjaukset-kokoelmasta, ei localStoragesta
═══════════════════════════════════════════════════════════ */
let _streak = 0;
let _streakLastDate = null;
let _tdoneCalled   = false;

async function _lataaCStreak() {
  if (!_pelaaja?.id || !window._db) { _streak = 0; return; }
  const seuraId = window._seuraId || _pelaaja?.seuraId;
  if (!seuraId) return;
  try {
    const ref = window._db.collection('seurat').doc(seuraId)
      .collection('pelaajat').doc(_pelaaja.id)
      .collection('kirjaukset')
      .orderBy('paivitetty','desc').limit(30);
    const snap = await ref.get();
    
    // Laske putkessa olevat päivät
    const paivamaarat = snap.docs
      .map(d => d.id) // id = 'YYYY-MM-DD'
      .filter(d => /^\d{4}-\d{2}-\d{2}$/.test(d))
      .sort().reverse();
    
    let streak = 0;
    const today = new Date().toISOString().slice(0,10);
    let expected = today;
    
    for (const pvm of paivamaarat) {
      if (pvm === expected) {
        streak++;
        // seuraava odotettava päivä = edellisenä päivänä
        const d = new Date(expected + 'T12:00:00Z');
        d.setDate(d.getDate() - 1);
        expected = d.toISOString().slice(0,10);
      } else if (pvm < expected) {
        break; // aukko — putki katkeaa
      }
    }
    _streak = streak;
    _streakLastDate = paivamaarat[0] || null;
    draw(); // päivitä UI
  } catch(e) {
    console.warn('[v5 streak]', e.message);
  }
}

async function _kirjaaStreak() {
  // Kutsutaan kun harjoitus merkitään tehdyksi
  const pvm = new Date().toISOString().slice(0,10);
  await _tmKirjaa('tehty', true);
  await _tmKirjaa('streak_pvm', pvm);
  _streak = Math.max(_streak, 1);
  
  // Tarkista X-Factor (streak ≥ 7) ja Gem (3 kuukautta nousevaa FLEI:tä)
  _tarkistaSignaalit();
}

    {n:5,lbl:'Haastava',c:'#E0A653'},

  return `<div style="margin-top:20px">
    <div style="font-size:9px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;
                color:var(--ink3);margin-bottom:10px">Kuinka raskas harjoitus oli?</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap">
      ${vals.map(v=>`
        <button onclick="kirjaaRPE(${v.n})" style="flex:1;min-width:48px;padding:10px 4px;

          color:${v.c};font-size:11px;font-weight:600;cursor:pointer;

          <span style="font-size:9px;opacity:.7">${v.lbl}</span>
        </button>`).join('')}
    </div>
  </div>`;
}

function kirjaaRPE(arvo) {
  _tmKirjaa('rpe', arvo);
  _tmKirjaa('aika', new Date().getHours() < 12 ? 'aamu' : new Date().getHours() < 17 ? 'paiva' : 'ilta');
  // Visuaalinen palaute
  const toast = document.createElement('div');
  toast.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1a1a18;border:.5px solid rgba(40,176,144,.3);color:#28B090;padding:10px 20px;border-radius:8px;font-size:12px;font-weight:500;z-index:999;animation:toastIn .2s ease';
  toast.textContent = 'RPE ' + arvo + ' kirjattu ✓';
  document.body.appendChild(toast);
  setTimeout(()=>toast.remove(), 2500);
}

/* ═══════════════════════════════════════════════════════════
   SIGNAALILOGIIKKA v5
   X-Factor: streak ≥ 7 päivää peräkkäin
   Piilohelmi (Gem): FLEI noussut ≥3 pistettä kahdessa viikossa
   PHV: phv_tila='PHV' → kuorma max 60%, ei P-harjoitteita
═══════════════════════════════════════════════════════════ */
function _tarkistaSignaalit() {
  const signaalit = [];
  
  // X-Factor: streak ≥ 7
  if (_streak >= 7) signaalit.push({ tyyppi:'x-factor', teksti:'X-Factor — ${_streak} päivän putki', vari:'#28B090' });
  
  // PHV-varoitus
  if (_pelaaja?.phv_tila === 'PHV') {
    signaalit.push({ tyyppi:'phv', teksti:'PHV-kasvupyrähdys — kuorma max 60%', vari:'#D85A5A' });
  }
  
  // Tallenna signaalit pelaajan profiiliin
  if (signaalit.length && _pelaaja?.id) {
    _tmKirjaa('signaali', signaalit[0]?.tyyppi || null);
  }
  
  // Päivitä UI jos näkyvissä
  draw();
  return signaalit;
}

function _signaaliLabel() {
  // Palauta signaalipalikka rA1/rA3:a varten
  const s = _pelaaja?.signaali;
  if (s === 'x-factor') return '<div style="display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;background:rgba(40,176,144,.12);border:.5px solid rgba(40,176,144,.25);font-size:11px;font-weight:600;color:#28B090;margin-bottom:10px">⚡ X-Factor</div>';
  if (s === 'gem')      return '<div style="display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;background:rgba(184,134,11,.12);border:.5px solid rgba(184,134,11,.25);font-size:11px;font-weight:600;color:#B8860B;margin-bottom:10px">💎 Piilohelmi</div>';
  if (s === 'phv')      return '<div style="display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;background:rgba(216,90,90,.12);border:.5px solid rgba(216,90,90,.25);font-size:11px;font-weight:600;color:#D85A5A;margin-bottom:10px">⚠ PHV — kevennä kuormaa</div>';
  if (_streak >= 7)     return '<div style="display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;background:rgba(40,176,144,.12);border:.5px solid rgba(40,176,144,.25);font-size:11px;font-weight:600;color:#28B090;margin-bottom:10px">🔥 ' + _streak + ' pv putki</div>';
  return '';
}

/* ═══════════════════════════════════════════════════════════
   ADAR-NÄYTTÖ v5
   Awareness · Decision · Action · Reading
   Valmentajan kirjaamat pisteet 1–5 näkyy pelaajalle
═══════════════════════════════════════════════════════════ */
function rAdar() {
  const adar = _pelaaja?.adar || null;
  if (!adar) return '<div style="color:var(--ink3);font-size:12px;padding:12px 0">Ei ADAR-arviota vielä — valmentaja kirjaa havaintonsa harjoituksessa.</div>';
  
  const dims = [
    {k:'A', lbl:'Awareness', kuvaus:'Skannaat ennen — peliälytietoisuus'},
    {k:'D', lbl:'Decision',  kuvaus:'Oikea ratkaisu oikeaan aikaan'},
    {k:'A2',lbl:'Action',    kuvaus:'Toteutus paineen alla'},
    {k:'R', lbl:'Reading',   kuvaus:'Luet pelin kulun'},
  ];
  
  return '<div style="margin-top:8px">' +
    dims.map(d => {
      const val = adar[d.k.toLowerCase()] || 0;
      const pct = (val/5)*100;
      const c = val >= 4 ? '#28B090' : val >= 3 ? '#E0A653' : '#D85A5A';
      return `<div style="margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px">
          <div style="font-size:11px;font-weight:600;color:var(--ink2)">${d.lbl}</div>
          <div style="font-size:11px;font-family:var(--font-m);color:${c}">${val}/5</div>
        </div>
        <div style="height:4px;background:var(--border);border-radius:2px;overflow:hidden">
          <div style="height:100%;width:${pct}%;background:${c};border-radius:2px;transition:width .4s"></div>
        </div>
        <div style="font-size:10px;color:var(--ink3);margin-top:3px">${d.kuvaus}</div>
      </div>`;
    }).join('') + '</div>';
}
