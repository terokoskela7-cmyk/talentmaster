/* ═══════════════════════════════════════════════════════
   TalentMaster™ — Design System tokens (colors_and_type.css inline)
   Dark theme · Player mobile · Standalone
═══════════════════════════════════════════════════════ */
:root {
  --carbon:    #1C1C1A;  --bone:   #F2EFE6;
  --teal:      #1A7A5E;  --teal-d: #28B090;
  --slate:     #8C8B86;  --gold:   #B8860B;
  --fire:      #B85C38;
  --green-dim: rgba(26,122,94,.08);   --green-brd: rgba(26,122,94,.2);
  --amber-dim: rgba(122,90,16,.08);   --amber-brd: rgba(122,90,16,.2);
  --red-dim:   rgba(138,43,43,.08);   --red-brd:   rgba(138,43,43,.2);
  --font-d: 'Cormorant Garamond', Georgia, serif;
  --font-b: 'DM Sans', system-ui, sans-serif;
  --font-m: 'DM Mono', 'SF Mono', Menlo, monospace;
  --r-sm:6px; --r-md:10px; --r-lg:14px;
  /* dark theme */
  --bg:#111110; --bg2:#161614; --bg3:#1C1C1A; --surface:#1E1E1C; --surface2:#1A1A18;
  --border:rgba(242,239,230,.06); --border2:rgba(242,239,230,.12); --border3:rgba(242,239,230,.18);
  --text:#F2EFE6; --ink2:#A8A79F; --ink3:#8BA0BC;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{font-family:var(--font-b);font-size:14px;line-height:1.7;background:#0a0a08;color:var(--text);min-height:100dvh;overflow-x:hidden;width:100%;max-width:100%;}
button{font-family:var(--font-b);cursor:pointer}

/* Keyframes */
@keyframes flicker{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.85;transform:scale(1.05)}}
@keyframes cardPop{0%{opacity:0;transform:scale(.7)}100%{opacity:1;transform:scale(1)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes ripple{0%{transform:scale(1);opacity:.8}100%{transform:scale(5);opacity:0}}
@keyframes dotPop{0%{transform:scale(0)}60%{transform:scale(1.2)}100%{transform:scale(1)}}

/* Outer wrapper */
.wrap{max-width:100%;margin:0 auto;padding:12px 8px 40px;overflow-x:hidden;width:100%;}
.locale-bar{display:flex;justify-content:center;margin-bottom:8px;width:100%;max-width:100%;}
.locale-inner{display:inline-flex;gap:2px;background:rgba(242,239,230,.04);padding:2px;border-radius:4px}
.loc-btn{background:transparent;color:var(--ink3);border:none;padding:4px 8px;font-size:9px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;border-radius:3px;transition:background .12s,color .12s}
.loc-btn.on{background:var(--teal);color:var(--text)}
.scene-bar{display:none;flex-wrap:wrap;gap:5px;justify-content:center;margin-bottom:10px;width:100%;max-width:100vw;box-sizing:border-box;}
/* Takautuva-modaalin napit (3-tyyppi + 4-kesto -valinta) */
.tk-btn{background:rgba(242,239,230,.04);border:.5px solid rgba(242,239,230,.14);color:var(--ink2);padding:10px 6px;font-size:11px;font-weight:500;letter-spacing:.04em;border-radius:8px;cursor:pointer;text-align:center;line-height:1.4;transition:all .15s;font-family:inherit}
.tk-btn:hover{color:var(--text);border-color:rgba(40,176,144,.4)}
.tk-btn.on{background:rgba(40,176,144,.14);border-color:rgba(40,176,144,.6);color:var(--teal)}
.demo-mode .scene-bar{display:flex;}
.demo-mode .locale-bar{display:flex;}
.sp{background:rgba(242,239,230,.04);color:var(--ink3);border:.5px solid rgba(242,239,230,.1);padding:5px 9px;font-size:9px;letter-spacing:.18em;text-transform:uppercase;font-weight:500;border-radius:20px;transition:background .12s,color .12s,border-color .12s}
.sp.on{background:var(--teal);color:var(--text);border-color:var(--teal)}

/* Phone */
.phone{width:min(390px,100vw);height:min(780px,calc(100vh - 90px));margin:0 auto;background:var(--bg);border-radius:36px;border:1px solid #222;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 8px #1a1a1a;position:relative;font-family:var(--font-b);color:var(--text)}
.ph-status{height:42px;padding:14px 24px 0;display:flex;justify-content:space-between;align-items:flex-start;font-family:var(--font-m);font-size:12px;font-weight:500}
.ph-body{height:calc(min(780px,calc(100vh - 90px)) - 42px);overflow:hidden;overflow-y:auto;position:relative}
.scene{background:var(--bg);height:100%;animation:fadeUp .28s ease;position:relative;background:var(--bg)}
.scroll{height:100%;overflow-y:auto;padding-bottom:72px;-webkit-overflow-scrolling:touch}

/* Bottom tabs */
.tabs{position:absolute;bottom:0;left:0;right:0;background:var(--bg2);border-top:.5px solid var(--border2);display:flex;justify-content:space-around;padding:8px 0 14px;z-index:10}
.tb{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 12px;color:var(--ink3);position:relative;transition:color .12s}
.tb.on{color:var(--text)}
.tb svg{width:19px;height:19px;fill:none;stroke:var(--ink3);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;transition:stroke .12s}
.tb.on svg{stroke:var(--teal-d);stroke-width:1.8}
.tb-lbl{font-size:9px;font-weight:500;letter-spacing:.12em;text-transform:uppercase}
.tb-dot{position:absolute;top:-2px;width:3px;height:3px;border-radius:50%;background:var(--teal-d)}

/* Type */
.ey{font-size:9px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--ink3)}
.ey.ac{color:var(--teal-d)}
.sig{font-family:var(--font-d);font-weight:500;font-size:22px;line-height:1.3;color:rgba(242,239,230,.95)}
.kpi{font-family:var(--font-d);font-weight:300;line-height:1;color:var(--text)}
.meta{font-size:11px;color:var(--ink3)}
.miksi-kortti{margin-top:18px;padding:14px 16px;background:var(--surface);border:.5px solid var(--border)}
.miksi-kortti__otsikko{font-size:9px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--teal-d);margin-bottom:8px}
.miksi-kortti__teksti{font-size:12px;color:var(--text);line-height:1.6;margin:0 0 6px}
.miksi-kortti__teksti--tulevaisuus{color:var(--ink3);font-style:italic;margin-bottom:0}

/* Cards */
.card{background:var(--surface);border:.5px solid var(--border);border-radius:var(--r-md)}
.card2{background:var(--surface2);border:.5px solid var(--border);border-radius:var(--r-md)}
.card-teal{background:linear-gradient(180deg,rgba(26,122,94,.12),rgba(26,122,94,.02));border:.5px solid rgba(26,122,94,.35);border-radius:var(--r-lg)}
.card-gold{background:linear-gradient(135deg,rgba(184,134,11,.1),rgba(184,134,11,.02));border:.5px solid rgba(184,134,11,.3);border-radius:var(--r-md)}

/* Buttons */
.btn-p{width:100%;background:var(--teal);color:var(--text);border:none;padding:16px;font-size:13px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;gap:10px;transition:background .12s}
.btn-p:active{background:#155f48}
.btn-g{background:rgba(242,239,230,.04);color:var(--text);border:.5px solid var(--border3);padding:10px 18px;font-size:10px;letter-spacing:.22em;text-transform:uppercase;font-weight:500;border-radius:20px;display:inline-flex;align-items:center;gap:8px}

/* Row */
.row{background:var(--surface2);border-radius:8px;border:.5px solid var(--border);padding:10px 14px;display:flex;align-items:center;gap:12px;margin-bottom:6px}

/* Section divider */
.sdiv{display:flex;align-items:center;gap:10px;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink3);margin-bottom:10px}
.sdiv::after{content:'';flex:1;height:.5px;background:var(--border2)}

/* KPI grid */
.kgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--border2);border:.5px solid var(--border2)}
.kcell{background:var(--bg2);padding:12px 10px}

/* PIN */
.pin-av{width:52px;height:52px;margin:0 auto;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(26,122,94,.25),rgba(26,122,94,.05));border:.5px solid rgba(26,122,94,.35);display:flex;align-items:center;justify-content:center;font-family:var(--font-b);font-weight:500;font-size:24px;color:var(--teal-d);letter-spacing:.05em}
.pin-dots{display:flex;gap:12px;justify-content:center}
.pd{width:10px;height:10px;border-radius:0;background:transparent;border:1px solid rgba(242,239,230,.25);transition:background .12s}
.pd.on{background:#28B090;border-color:#28B090}
.kpad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.key{background:transparent;border:1px solid rgba(242,239,230,.08);color:#F2EFE6;height:44px;font-family:var(--font-b);font-size:18px;font-weight:500;border-radius:0;transition:background .12s,border-color .12s}
.key:hover,.key:active{background:rgba(40,176,144,.1);border-color:rgba(40,176,144,.3)}

/* Training progress */
.prog3{display:flex;gap:6px;align-items:center}
.pseg{flex:1;height:3px;border-radius:2px;background:rgba(242,239,230,.08);position:relative;overflow:hidden}
.pseg.done{background:var(--teal)}
.pseg.act{background:rgba(26,122,94,.35)}
.pfill{position:absolute;left:0;top:0;bottom:0;background:var(--teal);transition:width 1s linear}

/* Card overlay */
.cov{position:absolute;inset:0;z-index:200;background:rgba(10,10,8,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;flex-direction:column;align-items:center;justify-content:center;animation:cardPop .45s cubic-bezier(.34,1.56,.64,1);}
.fw{width:240px;height:360px;position:relative}
.ff{position:absolute;inset:0;border-radius:16px;transition:opacity .4s ease,transform .6s cubic-bezier(.4,0,.2,1)}

/* Skeleton */
.skel{background:linear-gradient(90deg,rgba(242,239,230,.04),rgba(242,239,230,.1),rgba(242,239,230,.04));background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:4px}

/* Streak */
.streak-b{display:inline-flex;align-items:center;gap:6px;background:rgba(184,92,56,.12);border:.5px solid rgba(184,92,56,.3);padding:4px 10px;border-radius:20px}
.fl{animation:flicker 2s ease-in-out infinite}
.streak-n{font-family:var(--font-m);font-size:12px;font-weight:500;color:#B85C38}

/* XP bar */
.xpw{margin:0 20px}
.xpl{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);margin-bottom:6px}
.xpt{height:6px;background:rgba(242,239,230,.08);border-radius:3px;overflow:hidden}
.xpf{height:100%;background:linear-gradient(90deg,#1A7A5E,rgba(26,122,94,.6));border-radius:3px}

/* Day grid */
.dgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dc{border-radius:6px;padding:8px 4px;text-align:center;border:.5px solid var(--border);background:rgba(242,239,230,.04)}
.dc.dn{background:rgba(26,122,94,.15);border-color:rgba(26,122,94,.4)}
.dc.tm{background:var(--teal);border:none}

/* Ripple */
.rring{position:absolute;width:30px;height:30px;border-radius:50%;border:1px solid rgba(40,176,144,.6)}

@media(max-width:420px){
  .phone{width:100%;border-radius:0;border:none;box-shadow:none;height:100dvh}
  .wrap{padding:0}
  .scene-bar,.locale-bar{display:none}
}

/* ── FIFA CARD v2 — 5D pikakentät · tier-paletit (mockup v3) · §5 design-tokenit (Cormorant/DM Sans) ── */
.fc-ov{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.9);backdrop-filter:blur(14px);display:none;flex-direction:column;align-items:center;justify-content:center;animation:cardPop .4s cubic-bezier(.34,1.56,.64,1);overflow-y:auto;padding:16px 0}
.fc-ov.active{display:flex}
.fc-wrap{width:286px;height:470px;position:relative;flex-shrink:0}
.fc-face{position:absolute;inset:0;border-radius:22px;transition:opacity .45s ease,transform .6s cubic-bezier(.4,0,.2,1);backface-visibility:hidden;overflow:hidden;animation:fcRise 1s cubic-bezier(.22,1,.36,1) both}
.fc-flipped .fc-front{opacity:0;transform:scale(.92) rotateY(12deg);pointer-events:none}
.fc-flipped .fc-back{opacity:1!important;transform:scale(1) rotateY(0)!important;pointer-events:auto!important}
.fc-back{opacity:0;transform:scale(.92) rotateY(-12deg);pointer-events:none;background:linear-gradient(168deg,#1C1C1A,#161614 55%,#111110);border:1px solid var(--cf-soft,rgba(242,239,230,.12));border-radius:22px;padding:18px 17px 14px;display:flex;flex-direction:column;color:var(--text)}
/* tier-paletit (CSS-muuttujat .fc-front:lle ja .fc-back:lle) */
.tier-starter{--cf-frame:linear-gradient(150deg,#5E86C9,#2A5DB0 38%,#16315E 70%,#3D6BBE);--cf-main:#9BB6E3;--cf-soft:rgba(155,182,227,.45);--cf-bg:radial-gradient(ellipse 110% 55% at 50% -4%,rgba(42,93,176,.20),transparent 58%);--cf-glow:0 0 26px rgba(42,93,176,.32),0 0 58px rgba(42,93,176,.14)}
.tier-sharp{--cf-frame:linear-gradient(150deg,#F0C883,#E0A040 28%,#9A6A1E 58%,#5F4112 80%,#C88A30 92%,#E8B45A);--cf-main:#EEC98A;--cf-soft:rgba(224,160,64,.50);--cf-bg:radial-gradient(ellipse 110% 58% at 50% -4%,rgba(224,160,64,.20),transparent 60%);--cf-glow:0 0 28px rgba(224,160,64,.34),0 0 62px rgba(224,160,64,.15)}
.tier-elite{--cf-frame:linear-gradient(150deg,#EEF1F8,#C6CEDF 30%,#828BA6 60%,#525A75 80%,#9097AE 92%,#D2D9E6);--cf-main:#E4E9F2;--cf-soft:rgba(206,214,229,.48);--cf-bg:radial-gradient(ellipse 110% 55% at 50% -4%,rgba(206,214,229,.13),transparent 56%);--cf-glow:0 0 28px rgba(190,200,222,.30),0 0 62px rgba(150,165,200,.14)}
.fc-front{padding:2.5px;border-radius:22px;background:var(--cf-frame);box-shadow:var(--cf-glow),0 24px 60px rgba(0,0,0,.7)}
.fc-body{position:relative;border-radius:20px;overflow:hidden;height:100%;display:flex;flex-direction:column;padding:15px 15px 13px;background:linear-gradient(168deg,#1C1C1A 0%,#161614 52%,#111110 100%)}
.fc-tint{position:absolute;inset:0;background:var(--cf-bg);pointer-events:none}
.fc-shim{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.fc-shim::after{content:'';position:absolute;top:0;bottom:0;left:-110%;width:62%;background:linear-gradient(105deg,transparent 22%,rgba(255,255,255,.05) 46%,rgba(255,255,255,.13) 50%,rgba(255,255,255,.05) 54%,transparent 78%);animation:fcShim 6s 1.8s ease-in-out infinite}
.fc-body>*{position:relative;z-index:2}
.fc-num{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:66px;line-height:.82;letter-spacing:-2px;color:var(--cf-main);text-shadow:0 0 22px var(--cf-soft),2px 2px 0 rgba(0,0,0,.5);animation:fcPop 1s .5s cubic-bezier(.34,1.56,.64,1) both}
.fc-numtag{font-family:'DM Sans',sans-serif;font-weight:600;font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--cf-soft);margin-top:4px;opacity:.7}
.fc-build{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:24px;line-height:1.05;color:var(--text)}
.fc-buildsub{font-family:'DM Sans',sans-serif;font-weight:500;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink2);margin-top:6px}
.fc-pill{display:inline-flex;align-items:center;gap:4px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:11px;letter-spacing:.05em;padding:4px 9px;border-radius:20px;border:1px solid var(--cf-soft);color:var(--cf-main);background:rgba(255,255,255,.03)}
.fc-tier{display:inline-block;font-family:'DM Sans',sans-serif;font-weight:600;font-size:9px;letter-spacing:.1em;padding:3px 9px;border-radius:5px;border:1px solid var(--cf-soft);color:var(--cf-main);background:rgba(255,255,255,.04);margin-top:5px}
.fc-meta{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:10.5px;letter-spacing:.04em;color:var(--ink3);margin-top:5px;display:flex;align-items:center;gap:5px;justify-content:flex-end}
.fc-flag{width:14px;height:10px;border-radius:1px;background:linear-gradient(90deg,#fff 38%,#003580 38%,#003580 50%,#fff 50%,#fff 56%,#003580 56%);position:relative;flex-shrink:0;border:.5px solid rgba(0,0,0,.3)}
.fc-flag::after{content:'';position:absolute;left:0;right:0;top:38%;height:24%;background:#003580}
.fc-av{width:62px;height:62px;border-radius:50%;border:1.5px solid var(--cf-soft);display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:24px;color:var(--cf-main);background:rgba(255,255,255,.04);box-shadow:inset 0 2px 12px rgba(0,0,0,.5),0 0 22px var(--cf-soft);animation:fcFloat 5s 1.3s ease-in-out infinite}
.fc-name{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:25px;letter-spacing:.3px;color:var(--cf-main);line-height:1.05;animation:fcSlide .9s .5s ease both}
.fc-namesub{font-family:'DM Sans',sans-serif;font-size:9px;color:var(--ink3);margin-top:2px}
.fc-div{height:1px;margin:9px 0;background:linear-gradient(90deg,transparent,var(--cf-soft) 22%,rgba(255,255,255,.35) 50%,var(--cf-soft) 78%,transparent)}
.fc-dream{border:1px solid var(--cf-soft);background:rgba(255,255,255,.03);border-radius:11px;padding:7px 10px;display:flex;align-items:center;gap:9px}
.fc-dream .di{width:24px;height:24px;border-radius:50%;border:1px solid var(--cf-soft);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;color:var(--cf-main)}
.fc-dream .dl{font-family:'DM Sans',sans-serif;font-weight:600;font-size:7px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink3)}
.fc-dream .dm{font-family:'Cormorant Garamond',serif;font-weight:600;font-style:italic;font-size:14px;color:var(--cf-main);margin-top:1px;line-height:1.15}
.fc-s5{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:9px}
.fc-st{text-align:center;padding:7px 1px 6px;border-radius:9px;border:1px solid rgba(242,239,230,.08);overflow:hidden}
.fc-st .sv{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:24px;line-height:1;color:var(--cf-main);text-shadow:0 0 10px var(--cf-soft)}

/* ──────────────────────────────────────
   BIND EVENTS
────────────────────────────────────── */
function bind(){
  // PIN keys
  body.querySelectorAll('.key').forEach(b=>{
    b.addEventListener('click',()=>{
      const k=b.dataset.k;
      if(k==='⌫'){_pin=_pin.slice(0,-1);}
      else if(_pin.length<4){_pin+=k;}
      if(_pin.length===4){setTimeout(()=>_kirjauduPinilla(_pin),280);}
      body.querySelectorAll('.pd').forEach((d,i)=>d.classList.toggle('on',i<_pin.length));
    });
  });
  // Tabs
  body.querySelectorAll('.tb').forEach(b=>b.addEventListener('click',()=>{_tab=b.dataset.t;draw();}));
  // Train
  const sb=body.querySelector('#sTrain'); if(sb)sb.addEventListener('click',()=>{_tp='go';_tsec=0;_gsec=0;draw();startGo();});
  const pb=body.querySelector('#pBtn');   if(pb)pb.addEventListener('click',()=>{_tpause=!_tpause;draw();if(!_tpause)startEx();else clearInterval(_ttimer);});
  const nb=body.querySelector('#nBtn');   if(nb)nb.addEventListener('click',()=>{clearInterval(_ttimer);if(_ts+1>=3){_tp='done';_tmKirjaa('T',true);draw();}else{_ts++;_tsec=0;_tp='ex';draw();startEx();}});
  const db=body.querySelector('#dBtn');   if(db)db.addEventListener('click',()=>{_tmKirjaa('T',true);go('a1');});
  body.querySelectorAll('[data-exit]').forEach(b=>b.addEventListener('click',()=>go('a1')));
  // Card
  const fl=body.querySelector('#flip');   if(fl)fl.addEventListener('click',()=>{_flip=!_flip;draw();});
  const cc=body.querySelector('#cClose'); if(cc)cc.addEventListener('click',()=>{_cOpen=false;if(_sc==='card')go('a1');else draw();});
  body.querySelectorAll('[data-card]').forEach(el=>el.addEventListener('click',()=>{if(typeof naytaFcOverlay==='function')naytaFcOverlay();}));
  body.querySelectorAll('[data-train]').forEach(el=>el.addEventListener('click',()=>go('train')));
  // Offline toggle
  body.querySelectorAll('[data-om]').forEach(b=>b.addEventListener('click',()=>{_oMode=b.dataset.om;draw();}));
  // Haptics interval
  if(_sc==='haptic'&&!_htimer){_htimer=setInterval(()=>{},2000);}
  // Resume train if needed
  if(_sc==='train'&&_tp==='ex'&&!_tpause&&!_ttimer)startEx();
  if(_sc==='train'&&_tp==='go')startGo();
}

/* ──────────────────────────────────────
   TRAINING TIMERS
────────────────────────────────────── */
function startGo(){
  clearInterval(_ttimer);
  _ttimer=setInterval(()=>{
    _gsec++;
    const n=Math.max(0,4-_gsec);
    const el=body.querySelector('#goN');
    if(el){el.textContent=n>0?n:'Nyt';el.style.animation='none';el.offsetHeight;el.style.animation='cardPop .6s cubic-bezier(.34,1.56,.64,1)';}
    if(_gsec>3){clearInterval(_ttimer);_ttimer=null;_tp='ex';_tsec=0;draw();startEx();}
  },700);
}
function startEx(){
  clearInterval(_ttimer);
  _ttimer=setInterval(()=>{
    if(_tpause)return;
    _tsec++;
    const ex=EX[_ts];
    const pct=(_tsec/ex.dur)*100;
    const rem=ex.dur-_tsec;
    const ss=String(rem%60).padStart(2,'0');
    const r=100,c=2*Math.PI*r;
    const ring=body.querySelector('#tRing');
    const time=body.querySelector('#tTime');
    if(ring){ring.style.strokeDasharray=c;ring.style.strokeDashoffset=c*(1-pct/100);}
    if(time)time.textContent=`0:${ss}`;
    const fills=body.querySelectorAll('.pfill');
    if(fills[_ts])fills[_ts].style.width=pct+'%';
    if(_tsec>=ex.dur){
      clearInterval(_ttimer);_ttimer=null;
      if(_ts+1>=EX.length){_tp='done';draw();}
      else{_ts++;_tsec=0;draw();startEx();}
    }
  },1000);
}

function _toggleEmailLogin() {
  const form = document.getElementById('emailLoginForm');
  if (!form) return;
  form.style.display = form.style.display === 'none' ? 'block' : 'none';
  if (form.style.display === 'block') {
    setTimeout(() => document.getElementById('pinEmail')?.focus(), 100);
  }
}

async function _kirjauduEmaililla() {
  const email = document.getElementById('pinEmail')?.value?.trim();
  const pass  = document.getElementById('pinPassword')?.value;
  const errEl = document.getElementById('emailLoginErr');
  if (!email || !pass) {
    if (errEl) { errEl.textContent = 'Syötä sähköposti ja salasana.'; errEl.style.display = 'block'; }
    return;
  }
  if (errEl) errEl.style.display = 'none';
  const btn = document.querySelector('#emailLoginForm button:last-child');
  if (btn) btn.textContent = 'Kirjaudutaan...';
  try {
    await firebase.auth().signInWithEmailAndPassword(email, pass);
    // onAuthStateChanged hoitaa loput
  } catch(e) {
    const msg = e.code === 'auth/wrong-password' ? 'Väärä salasana.' :
                e.code === 'auth/user-not-found'  ? 'Sähköpostia ei löydy.' :
                e.code === 'auth/invalid-email'    ? 'Tarkista sähköposti.' :
                'Kirjautuminen epäonnistui.';
    if (errEl) { errEl.textContent = msg; errEl.style.display = 'block'; }
    if (btn) btn.textContent = 'KIRJAUDU SISÄÄN';
  }
}

/* ══════════════════════════════════════════════════════════
   MINÄ-tab (v=25) — Profiili + 5 stub-korttia
   Brand: Cormorant Garamond otsikot, DM Sans meta/grid,
          Carbon (--bg3) kortit, Slate (#8C8B86) meta,
          ei border-radiusta päätason korteilla,
          EI XP-lukuja, progressbarseja eikä gamification-elementtejä.
   Render-pattern: jokainen aliosio palauttaa HTML-stringin,
   rMina() kokoaa kaikki + concatenation:ina (CLAUDE.md §17 #1).
   Datalähde: _pelaaja (local) — sisältää koko pelaajadokumentin.
   (window._p7Pelaaja sisältää vain { seuraId, pelaajaId } P6:ta varten.)
══════════════════════════════════════════════════════════ */

function rMinaProfiili() {
  const p = _pelaaja || {};
  const etunimi   = p.etunimi   || '';
  const sukunimi  = p.sukunimi  || '';
  const initialit = (etunimi[0] || '') + (sukunimi[0] || '');
  const syntymaVuosi = p.syntymaVuosi;
  const ikaluokka    = syntymaVuosi ? ('U' + (new Date().getFullYear() - syntymaVuosi)) : '—';
  const seura        = (p.seuraId || '—').toUpperCase();
  // Joukkue: viimeinen segmentti isoin kirjaimin. Splitataan VÄLILYÖNNILLE + alaviivalle
  // → toimii sekä "KPV U13"→"U13" (meidän data) että "kpv_u13"→"U13".
  const joukkueRaaka = p.joukkue || p.joukkueId || '';
  const joukkue      = joukkueRaaka ? String(joukkueRaaka).split(/[_ ]/).pop().toUpperCase() : '—';
  // PalloID: synonyymit (CLAUDE.md §10). Tyhjä → "Ei vielä" himmennettynä.
  const palloIDraaka = p.palloID || p.palloId || p.tunniste || null;
  const palloID      = palloIDraaka || 'Ei vielä';
  const pelipaikka   = p.pelipaikka || p.positio || '—';
  // Pelipaikka: POS (lyhenne→kokonimi) + POS_REV (kokonimi→lyhenne). Grid=kokonimi, chip=lyhenne.
  // Toimii sekä lyhenne- ("LH") että kokonimi-datalle ("Laitahyökkääjä", meidän tallennusmuoto).
  const POS = { KH:'Keskushyökkääjä', H:'Hyökkääjä', HM:'Hyökkäävä keskik.', KK:'Keskikenttä', KP:'Keskuspuolustaja', LP:'Laitapuolustaja', LH:'Laitahyökkääjä', MV:'Maalivahti', P:'Puolustaja' };
  const POS_REV = Object.fromEntries(Object.entries(POS).map(([k, v]) => [v, k]));
  const pelipaikkaPitka   = POS[pelipaikka] || pelipaikka;        // grid: kokonimi
  const pelipaikkaLyhenne = POS_REV[pelipaikka] || pelipaikka;    // chip: lyhenne

  // Apufunktio info-gridin solulle (label + value, DM Sans). muted=tyhjä arvo himmennetään.
  const cell = (label, value, muted) =>
    '<div style="background:var(--bg3);padding:14px 16px">' +
      '<div style="font-family:\'DM Sans\',sans-serif;font-size:9px;letter-spacing:.18em;color:#8C8B86;text-transform:uppercase;margin-bottom:4px">' + label + '</div>' +
      '<div style="font-family:\'DM Sans\',sans-serif;font-size:13px;color:' + (muted ? 'rgba(242,239,230,.35)' : 'var(--text)') + ';font-weight:500">' + value + '</div>' +
    '</div>';

  // Apufunktio chipille (ikäluokka/pelipaikka/seura nimen alla). accent=teal-korostus.
  const chip = (txt, accent) =>
    '<span style="font-family:\'DM Sans\',sans-serif;font-size:10px;font-weight:600;letter-spacing:.08em;padding:4px 9px;border-radius:4px;' +
      'background:' + (accent ? 'rgba(40,176,144,.12)' : 'rgba(242,239,230,.06)') + ';' +
      'border:.5px solid ' + (accent ? 'rgba(40,176,144,.3)' : 'rgba(242,239,230,.12)') + ';' +
      'color:' + (accent ? '#28B090' : 'rgba(242,239,230,.7)') + '">' + txt + '</span>';

  let h = '<div style="background:var(--bg3);padding:24px 20px;margin:14px 20px 0;border:.5px solid rgba(242,239,230,.08)">';

  // Avatar + nimi-blokki
  h += '<div style="display:flex;align-items:center;gap:18px;margin-bottom:20px">';
  h +=   '<div style="width:64px;height:64px;background:linear-gradient(135deg,#28B090,#1A7A5E);display:flex;align-items:center;justify-content:center;font-family:\'Cormorant Garamond\',serif;font-size:26px;font-weight:400;color:#F2EFE6">';
  h +=     initialit;
  h +=   '</div>';
  h +=   '<div style="flex:1;min-width:0">';
  h +=     '<div style="font-family:\'Cormorant Garamond\',serif;font-size:24px;font-weight:400;color:var(--text);line-height:1.1;letter-spacing:.02em">';
  h +=       '<span style="text-transform:uppercase">' + sukunimi + '</span>';
  h +=       (etunimi ? ' <span style="font-weight:300">' + etunimi + '</span>' : '');
  h +=     '</div>';
  h +=     '<div style="display:flex;gap:6px;margin-top:11px;flex-wrap:wrap">';
  h +=       chip(ikaluokka, true) + chip(pelipaikkaLyhenne) + chip(seura);
  h +=     '</div>';
  h +=   '</div>';
  h += '</div>';

  // Info-grid 2x2 — 1px hairline-jako solujen välillä, 4px ulkoreuna hyväksyttävä
  h += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:1px;background:rgba(242,239,230,.08);border-radius:4px;overflow:hidden">';
  h +=   cell('Seura',     seura);
  h +=   cell('Joukkue',   joukkue);
  h +=   cell('PalloID',    palloID, !palloIDraaka);
  h +=   cell('Pelipaikka', pelipaikkaPitka);
  h += '</div>';

  h += '</div>';
  return h;
}

// Kehitysvaihe-kortti — PHV (Mirwald) + biologinen ikä (KR tulossa myöhemmin)
// Lukee pelaajadokumentin pikakentät phv_tila + biologinenIka_viimeisin.
// Piilotetaan kokonaan jos kasvumittausta ei ole tehty (ei phv_tila).
function rMinaKehitysvaihe() {
  const p = _pelaaja || {};
  const koodi = p.phv_tila;
  if (!koodi) return '';  // ei kasvumittausta → ei tyhjää korttia

  // Koodit PRE/LAH/PH/POST/AN (tm_bioika §30) + vanha 'huippu'/'PHV' yhteensopivuus
  const phvHuom = 'Tärkeä vaihe — kerro valmentajallesi';
  const tilat = {
    PRE:    { vari:'#8C8B86', teksti:'Ennen kasvupyrähdystä' },
    LAH:    { vari:'#E0A040', teksti:'Lähestyy kasvupyrähdystä 🔶' },
    PH:     { vari:'#D85A5A', teksti:'Kasvupyrähdyksessä ⚠️', huom:phvHuom },
    POST:   { vari:'#28B090', teksti:'Kasvupyrähdyksen jälkeen' },
    AN:     { vari:'#5FB87A', teksti:'Kehittynyt vaihe' },
    huippu: { vari:'#D85A5A', teksti:'Kasvupyrähdyksessä ⚠️', huom:phvHuom },
    PHV:    { vari:'#D85A5A', teksti:'Kasvupyrähdyksessä ⚠️', huom:phvHuom }
  };
  const t = tilat[koodi] || { vari:'#8C8B86', teksti:'Kasvuvaihe mitattu' };
  const viim = p.biologinenIka_viimeisin || {};
  const mitattu = viim.mittauspaiva ? ('Mitattu ' + viim.mittauspaiva) : '';

  const lbl = (txt) => '<div style="font-family:\'DM Sans\',sans-serif;font-size:9px;letter-spacing:.18em;color:#8C8B86;text-transform:uppercase">' + txt + '</div>';

  let h = '<div style="background:var(--bg3);padding:20px;margin:14px 20px 0;border:.5px solid rgba(242,239,230,.08)">';
  h += '<div style="font-family:\'Cormorant Garamond\',serif;font-size:18px;font-weight:400;color:var(--text);margin-bottom:14px;letter-spacing:.01em">Kehitysvaihe</div>';

  // Kasvuvaihe (PHV)
  h += '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px">';
  h +=   lbl('Kasvuvaihe');
  h +=   '<div style="font-family:\'DM Sans\',sans-serif;font-size:13px;font-weight:600;color:' + t.vari + ';text-align:right">' + t.teksti + '</div>';
  h += '</div>';
  if (mitattu) h += '<div style="font-family:\'DM Sans\',sans-serif;font-size:10px;color:#8C8B86;text-align:right;margin-top:2px">' + mitattu + '</div>';
  h += '<div style="font-family:\'DM Sans\',sans-serif;font-size:10px;color:#8C8B86;text-align:right;margin-top:2px">±0.5 v epävarmuus</div>';
  if (t.huom) h += '<div style="font-family:\'DM Sans\',sans-serif;font-size:11px;color:' + t.vari + ';margin-top:10px;line-height:1.4">' + t.huom + '</div>';

  // Biologinen ikä (Khamis-Roche) — tulossa myöhemmin (kertoimet vahvistettava)
  h += '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;padding-top:14px;border-top:.5px solid rgba(242,239,230,.08)">';
  h +=   lbl('Biologinen ikä');
  h +=   '<div style="font-family:\'DM Sans\',sans-serif;font-size:12px;color:#8C8B86;font-style:italic;text-align:right">Tulossa myöhemmin</div>';
  h += '</div>';

  h += '</div>';
  return h;
}

// ── TEKNIIKKAPROFIILI — TKI + merkki + vahvuus/kehityskohde + lajipalkit + trendi ──
// Lukee pelaajan tekniikkakilpailutulokset Firestoresta (testitulokset-alikokoelma).
// Laskenta window.TM_TESTIT (docs/testit_indeksit.js, aikapohjainen).
let _tekniikkaData = null;
async function _lataaTekniikka() {
  try {
    if (!_pelaaja || !_pelaaja.seuraId || !_pelaaja.id || !window._db || !window.TM_TESTIT) return;
    const snap = await window._db.collection('seurat').doc(_pelaaja.seuraId)
      .collection('pelaajat').doc(_pelaaja.id).collection('testitulokset').get();
    const tk = snap.docs.map(d => ({ id: d.id, ...d.data() }))
      .filter(x => x.protokolla === 'tekniikkakilpailu')
      .sort((a, b) => String(a.testauspvm || a.id || '').localeCompare(String(b.testauspvm || b.id || '')));
    if (tk.length === 0) {
      // §30 joustava + §7.22: ei tekniikkakilpailua → fallback H-H syöttö/pujottelu LAPSEN KIELELLÄ (sekunnit, EI tasolukuja).
      const _hh = _pelaaja.hh_viimeisin || {};
      const _hhTekn = [];
      if (_hh.syotto != null)    _hhTekn.push({ laji: 'syotto',    nimi: 'Syöttö',    aika: _hh.syotto });
      if (_hh.pujottelu != null) _hhTekn.push({ laji: 'pujottelu', nimi: 'Pujottelu', aika: _hh.pujottelu });
      _tekniikkaData = { tyhja: true, hhTekn: _hhTekn.length ? _hhTekn : null };
      draw(); return;
    }
    const T = window.TM_TESTIT;
    const sp = (String(_pelaaja.sukupuoli || '').toUpperCase() === 'N') ? 'T' : 'P';
    const ikaPvm = (pvm) => {
      const y = parseInt(String(pvm || '').slice(0, 4));
      return (!isNaN(y) && _pelaaja.syntymaVuosi) ? (y - _pelaaja.syntymaVuosi) : null;
    };
    const viim = tk[tk.length - 1];
    const ika = ikaPvm(viim.testauspvm || viim.id) || (new Date().getFullYear() - (_pelaaja.syntymaVuosi || 2013));
    const kt = T.laskeKokonaistulos(viim.testit, ika, sp);
    const vk = T._laskeVahvuudetJaKehityskohteet(viim.testit, { ika: ika }, null);
    let trendi = null;
    if (tk.length >= 2) {
      const eka = tk[0];
      const ktEka = T.laskeKokonaistulos(eka.testit, ikaPvm(eka.testauspvm || eka.id) || ika, sp);
      if (ktEka != null && kt != null) {
        const ero = +(ktEka - kt).toFixed(1); // >0 = aika pienentynyt = parani
        if (Math.abs(ero) >= 1) trendi = { ero: Math.abs(ero), parani: ero > 0 };
      }
    }
    _tekniikkaData = {
      tki: (kt != null) ? T.tkLaskeTKI(kt, ika, sp) : null,
      merkki: (kt != null) ? T.tkLaskeMerkki(kt, ika, sp) : null,
      vahvuudet: vk.vahvuudet, kehityskohteet: vk.kehityskohteet,
      testit: viim.testit, trendi: trendi, kpl: tk.length
    };
    draw();
  } catch (e) { console.warn('[tekniikka]', e.message); }
}

// MAS-kortti — ikävaiheen kielellä (Leikkijä/Rakentaja/Showcase). Näkyy kun MAS-data olemassa.
function rMinaMAS() {
  if (!_pelaaja) return '';
  const hv = _pelaaja.hh_viimeisin || {};
  const masKmh = (_pelaaja.mas_kmh != null) ? _pelaaja.mas_kmh : (hv.mas != null ? hv.mas : null);
  if (masKmh == null) return '';
  const masMs = (_pelaaja.mas_ms != null) ? _pelaaja.mas_ms : Math.round((masKmh / 3.6) * 100) / 100;
  const sp = (String(_pelaaja.sukupuoli || '').toUpperCase() === 'N') ? 'T' : 'P';
  const ika = new Date().getFullYear() - (_pelaaja.syntymaVuosi || 2013);
  const taso = (typeof hhLaskeTaso === 'function') ? hhLaskeTaso('mas', masKmh, ika, sp) : null;
  const stage = (typeof _laskeStage === 'function') ? _laskeStage(_pelaaja.syntymaVuosi, _pelaaja.phv_tila) : '2_rakentaja';
  const r1 = function(x){ return Math.round(x * 10) / 10; };
  const box = function(inner){ return '<div style="background:var(--bg3);padding:20px;margin:14px 20px 0;border:.5px solid rgba(242,239,230,.08)">' + inner + '</div>'; };
  const ots = '<div style="font-family:\'Cormorant Garamond\',serif;font-size:18px;font-weight:400;color:var(--text);margin-bottom:12px;letter-spacing:.01em">Juoksumoottori</div>';

  if (stage === '1_leikkija') {  // U12 — leikkijä
    return box(ots
      + '<div style="display:flex;align-items:baseline;gap:10px">'
      + '<div style="font-family:\'Cormorant Garamond\',serif;font-size:40px;font-weight:300;color:#28B090;line-height:1">' + r1(masKmh) + '</div>'
      + '<div style="font-size:22px">⚡</div></div>'
      + '<div style="font-size:12px;color:var(--text);margin-top:10px">Mitä isompi luku, sitä pidempään jaksat juosta kovaa pelissä.</div>');
  }
  if (stage === '2_rakentaja') {  // U13–U15 — rakentaja
    return box(ots
      + '<div style="font-size:13px;color:var(--text);font-weight:600">Aerobinen kapasiteetti: taso ' + (taso != null ? taso : '–') + '/5</div>'
      + '<div style="font-size:11px;color:#8C8B86;margin-top:10px;font-weight:600">Harjoitteluvyöhykkeesi tänään</div>'
      + '<div style="font-size:12px;color:var(--text);margin-top:4px">🟢 Kevyt: alle ' + r1(masKmh * 0.75) + ' km/h</div>'
      + '<div style="font-size:12px;color:var(--text)">🟡 Kehittävä: ' + r1(masKmh * 0.80) + '–' + r1(masKmh * 0.90) + ' km/h</div>'
      + '<div style="font-size:12px;color:var(--text)">🔴 Kova: yli ' + r1(masKmh * 0.95) + ' km/h</div>');
  }
  // 3_showcase — U16+ täysi tekninen näkymä
  let trend = '';
  const hist = Array.isArray(_pelaaja.mas_historia) ? _pelaaja.mas_historia.filter(function(x){ return x != null; }) : [];
  if (hist.length >= 2) {
    const toMs = function(h){ return (h.ms != null) ? h.ms : (h.kmh != null ? h.kmh / 3.6 : null); };
    const a = toMs(hist[0]), b = toMs(hist[hist.length - 1]);
    if (a != null && b != null) {
      const dd = Math.round((b - a) * 100) / 100;
      trend = '<div style="font-size:12px;margin-top:10px;color:' + (dd > 0.05 ? '#28B090' : dd < -0.05 ? '#D4A017' : '#8C8B86') + '">'
        + (Math.abs(dd) < 0.05 ? '→ Ei muutosta — tarkista harjoitteluärsyke'
           : (dd > 0 ? '↑ +' : '↓ ') + dd.toFixed(2) + ' m/s — ' + (dd > 0 ? 'hyvä kehityssuunta' : 'lasku, tarkista kuormitus')) + '</div>';
    }
  }
  return box(ots
    + '<div style="display:flex;align-items:baseline;gap:10px">'
    + '<div style="font-family:\'Cormorant Garamond\',serif;font-size:40px;font-weight:300;color:#28B090;line-height:1">' + masMs.toFixed(2) + '</div>'
    + '<div style="font-size:11px;color:#8C8B86">m/s · ' + r1(masKmh) + ' km/h · taso ' + (taso != null ? taso : '–') + '/5</div></div>'
    + '<div style="font-size:11px;color:#8C8B86;margin-top:10px;font-weight:600">Harjoitteluvyöhykkeet</div>'
    + '<div style="font-size:12px;color:var(--text);margin-top:4px">🟢 Perus (65–75 %): ' + r1(masKmh * 0.65) + '–' + r1(masKmh * 0.75) + ' km/h</div>'
    + '<div style="font-size:12px;color:var(--text)">🟡 Kehitys (80–90 %): ' + r1(masKmh * 0.80) + '–' + r1(masKmh * 0.90) + ' km/h</div>'
    + '<div style="font-size:12px;color:var(--text)">🔴 Huippu (95–105 %): ' + r1(masKmh * 0.95) + '–' + r1(masKmh * 1.05) + ' km/h</div>'
    + trend);
}

// §5.3 tekniikkatavoite LAPSEN KIELELLÄ — luetaan pikakentistä (§26), tkLajiViite-vertailu (window.TM_TESTIT).
// §7.22 EHDOTON: ei XP/progressbar/loss aversion ("menetät/putoat/sulkeutuu"), ei vertailua muihin,
// ei sijoituksia, ei "indeksi/gap/viitetaso". TKI-laskua EI näytetä — vain abs-PARANNUS kun positiivinen.
// Yksi kehityskohde kerrallaan. String concatenation (§7.1). Fallback vanhaan dataan kun tk_lajit puuttuu.
function _minaTekLajiNimi(id) {
  const NIMI = { ponnauttelu: 'Ponnauttelu', syotto: 'Syöttö', pujottelu: 'Pujottelu', kuljetus_laukaus: 'Kuljetus-laukaus', pituuspotku_bonus: 'Pituuspotku' };
  return NIMI[id] || id;
}
// Välitavoite: saavutettava askel, ei koko matka. gap ≤ 3 s → viite.hyva; muuten arvo − 3 s (0.5 s tarkkuus).
function _minaValitavoite(arvo, viite, kaant) {
  const gap = kaant ? (viite.hyva - arvo) : (arvo - viite.hyva);
  let t = (gap <= 3) ? viite.hyva : (kaant ? (arvo + 3) : (arvo - 3));
  return Math.round(t * 2) / 2;
}
function _minaTavoiteRivit(p, d) {
  const lajit = p && p.tk_lajit_viimeisin;
  // Fallback: ei pikakenttä-lajidataa → vanhat yksinkertaiset rivit (nykyinen käytös säilyy)
  if (!lajit) {
    let h0 = '';
    const v0 = d && d.vahvuudet && d.vahvuudet[0];
    const k0 = d && d.kehityskohteet && d.kehityskohteet[0];
    if (v0) h0 += '<div style="font-size:13px;color:var(--text);margin-top:10px">⭐ <b>Vahvuutesi:</b> ' + v0.nimi + '<div style="font-size:12px;color:#8C8B86;margin-top:2px">' + v0.teksti + '</div></div>';
    if (k0) h0 += '<div style="font-size:13px;color:var(--text);margin-top:8px">🎯 <b>Seuraava askel:</b> ' + k0.nimi + '<div style="font-size:12px;color:#8C8B86;margin-top:2px">' + k0.teksti + '</div></div>';
    return h0;
  }
  const T = window.TM_TESTIT;
  const sp = (String(p.sukupuoli || '').toUpperCase() === 'N') ? 'T' : 'P';
  const ika = p.syntymaVuosi ? (new Date().getFullYear() - p.syntymaVuosi) : null;
  const viiteOf = function (laji) { return (T && T.tkLajiViite && ika != null) ? T.tkLajiViite(laji, ika, sp) : null; };
  let h = '';

  // ★ Vahvuus (pikakenttä) — AINA ensin. "kärkitasoa" vain jos taso erinomainen.
  if (p.tki_vahvuus && _minaTekLajiNimi(p.tki_vahvuus)) {
    const va = lajit[p.tki_vahvuus + '_s'];
    const vv = viiteOf(p.tki_vahvuus);
    const kaantV = (p.tki_vahvuus === 'pituuspotku_bonus');
    const karki = (vv && va != null && (kaantV ? va >= vv.erinomainen : va <= vv.erinomainen));
    h += '<div style="font-size:13px;color:var(--text);margin-top:10px">⭐ <b>Vahvuutesi:</b> ' + _minaTekLajiNimi(p.tki_vahvuus)
      + '<div style="font-size:12px;color:#8C8B86;margin-top:2px">' + (karki ? 'Olet tässä kärkitasoa — hieno juttu!' : 'Tämä on vahvin lajisi — pidä siitä kiinni!') + '</div></div>';
  }

  // 🎯 Seuraava askel (yksi kehityskohde) — saavutettava sekuntitavoite
  if (p.tki_kehityskohde && _minaTekLajiNimi(p.tki_kehityskohde)) {
    const kk = p.tki_kehityskohde;
    const arvo = lajit[kk + '_s'];
    const kv = viiteOf(kk);
    h += '<div style="font-size:13px;color:var(--text);margin-top:10px">🎯 <b>Seuraava askel:</b> ' + _minaTekLajiNimi(kk);
    if (arvo != null && kv) {
      const kaant = (kk === 'pituuspotku_bonus');
      const tavoite = _minaValitavoite(arvo, kv, kaant);
      const nyt = Math.round(arvo * 10) / 10;
      h += '<div style="font-size:12px;color:#8C8B86;margin-top:2px">Nyt: ' + nyt + ' s → Tavoite: ' + tavoite + ' s</div>'
        + '<div style="font-size:12px;color:#8C8B86">Pieni parannus joka treenissä riittää.</div>';
    }
    h += '</div>';
  }

  // 🏅 Mitali-juhla (pikakenttä) + matka seuraavaan VAIN positiivisena ja vain jos lähellä (≤ 15 s)
  if (p.tki_merkki) {
    const MN = { kulta: 'kultamerkki', hopea: 'hopeamerkki', pronssi: 'pronssimerkki' };
    h += '<div style="font-size:13px;color:#28B090;margin-top:10px;font-weight:600">🏅 Sinulla on ' + (MN[p.tki_merkki] || 'mitali') + '!</div>';
  }
  if (T && T.tkSekuntibudjetti && p.tk_kokonaistulos_viimeisin != null && ika != null) {
    const budj = T.tkSekuntibudjetti(p.tk_kokonaistulos_viimeisin, ika, sp);
    const MM = { kulta: 'kultaan', hopea: 'hopeaan', pronssi: 'pronssiin' };
    if (budj && budj.gap_s > 0 && budj.gap_s <= 15) {
      h += '<div style="font-size:12px;color:var(--text);margin-top:6px">Matka ' + (MM[budj.tavoite] || '') + ': ' + budj.gap_s + ' s — hyvällä tiellä! 💪</div>';
    }
  }

  // 📈 Parannus VAIN jos abs-delta > 0 (§3.2). Ei "et parantunut" -kehystä.
  if (p.tk_kokonaistulos_edellinen != null && p.tk_kokonaistulos_viimeisin != null) {
    const absD = Math.round((p.tk_kokonaistulos_edellinen - p.tk_kokonaistulos_viimeisin) * 10) / 10;
    if (absD > 0) h += '<div style="font-size:13px;color:#28B090;margin-top:10px">📈 Paransit kokonaisaikaasi ' + absD + ' sekuntia viime kerrasta!</div>';
  }

  // 🔥 Kultaikkuna lapsen kielellä, VAIN ≤ 12 v — EI uhkakehystä
  if (ika != null && ika <= 12) {
    h += '<div style="font-size:12px;color:#8C8B86;margin-top:10px">🔥 Nyt on paras ikä oppia uusia temppuja pallon kanssa!</div>';
  }
  return h;
}
// H-H/TSI lapsen kieli (§3.3). testinimet lapselle; arvo pikakentästä (sm_pallo erillinen pikakenttä).
const _MINA_HHNIMI = { lin30m:'Nopeus', lin10m:'Kiihdytys', cmj:'Ponnistusvoima', mas:'Kestävyys', kasirata:'Ketteryys', sm_pallo:'Vauhti pallon kanssa' };
function _minaHhArvo(p, testi) { return (testi === 'sm_pallo') ? p.sm_pallo_viimeisin : (p.hh_viimeisin ? p.hh_viimeisin[testi] : null); }

// TÄNÄÄN-T-harjoitteen saateteksti: TK-kehityskohde ensisijainen, fallback H-H-kehityskohde (VAIHE 3 osatehtävä B).
function _tekTavoiteSaate(p) {
  if (!p) return '';
  if (p.tki_kehityskohde && p.tk_lajit_viimeisin) {
    const kk = p.tki_kehityskohde;
    const nimi = _minaTekLajiNimi(kk);
    if (nimi !== kk) {
      const arvo = p.tk_lajit_viimeisin[kk + '_s'];
      const T = window.TM_TESTIT;
      const sp = (String(p.sukupuoli || '').toUpperCase() === 'N') ? 'T' : 'P';
      const ika = p.syntymaVuosi ? (new Date().getFullYear() - p.syntymaVuosi) : null;
      const viite = (T && T.tkLajiViite && ika != null && arvo != null) ? T.tkLajiViite(kk, ika, sp) : null;
      if (!viite || arvo == null) return 'Tämä vie sinua kohti tavoitettasi: ' + nimi.toLowerCase();
      const kaant = (kk === 'pituuspotku_bonus');
      return 'Tämä vie kohti tavoitettasi: ' + nimi.toLowerCase() + (kaant ? ' yli ' : ' alle ') + _minaValitavoite(arvo, viite, kaant) + ' s';
    }
  }
  // B — H-H-fallback (SJK: ei tki_kehityskohdetta). hh_kehityskohde on jo PHV-suodatettu.
  if (p.hh_kehityskohde === 'sm_pallo') return 'Tämä vie sinua kohti tavoitettasi: vauhtia pallon kanssa';
  if (p.hh_kehityskohde && _MINA_HHNIMI[p.hh_kehityskohde]) return 'Tämä vie sinua kohti tavoitettasi: ' + _MINA_HHNIMI[p.hh_kehityskohde].toLowerCase();
  return '';
}

// §3.3 — Vauhti & pallo -tavoiterivit (MINÄ). §7.22-kehys kuten tekniikkatavoite. hhSeuraavaTaso lib:stä (globaali).
function rMinaFyysinenTavoite() {
  const p = _pelaaja;
  if (!p || !p.hh_viimeisin) return '';                  // ei H-H-dataa → ei korttia
  const sp = (String(p.sukupuoli || '').toUpperCase() === 'N') ? 'N' : 'M';
  const ika = p.syntymaVuosi ? (new Date().getFullYear() - p.syntymaVuosi) : null;
  const box = function (inner) { return '<div style="background:var(--bg3);padding:20px;margin:14px 20px 0;border:.5px solid rgba(242,239,230,.08)">'
    + '<div style="font-family:\'Cormorant Garamond\',serif;font-size:18px;font-weight:400;color:var(--text);margin-bottom:12px;letter-spacing:.01em">Vauhti &amp; pallo</div>' + inner + '</div>'; };
  // saavutettava askel: aikalajit gap>0.4 → arvo∓0.4 (0.1 pyöristys); muuten seuraava kynnys
  const tavoiterivi = function (testi, ikoni, otsikko, label) {
    const arvo = _minaHhArvo(p, testi);
    if (arvo == null || typeof hhSeuraavaTaso !== 'function' || ika == null) return '';
    const st = hhSeuraavaTaso(testi, Number(arvo), ika, sp);
    if (!st || st.gap == null || st.gap <= 0) return '';   // jo huipulla → ei tavoitetta
    const nyt = Math.round(Number(arvo) * 10) / 10;
    const pienempi = (typeof HH_TESTI_MAP !== 'undefined' && HH_TESTI_MAP[testi]) ? HH_TESTI_MAP[testi].pienempi : true;
    let tav = (st.gap > 0.4 && st.yksikko === 's') ? Math.round((pienempi ? nyt - 0.4 : nyt + 0.4) * 10) / 10 : st.kynnys;
    return '<div style="font-size:14px;color:var(--text);margin-top:10px">' + ikoni + ' <b>' + otsikko + '</b>'
      + '<div style="font-size:13px;color:#8C8B86;margin-top:2px">' + label + ': ' + nyt + ' ' + st.yksikko + ' → Tavoite: ' + tav + ' ' + st.yksikko + '</div>'
      + '<div style="font-size:13px;color:#8C8B86">Pieni parannus joka treenissä riittää.</div></div>';
  };
  let h = '';
  // ⭐ Vahvuus ensin
  if (p.hh_vahvuus && _MINA_HHNIMI[p.hh_vahvuus]) {
    h += '<div style="font-size:14px;color:var(--text)">⭐ <b>' + _MINA_HHNIMI[p.hh_vahvuus] + '</b> on vahvuutesi!</div>';
  }
  // YKSI tavoite: hh_kehityskohde fyysinen → fyysinen; muuten (sm_pallo/null) → TSI jos palloa (turvallinen, §7.22)
  const kk = p.hh_kehityskohde;
  let tavoiteHtml = '';
  if (kk && kk !== 'sm_pallo' && _MINA_HHNIMI[kk]) tavoiteHtml = tavoiterivi(kk, '💨', _MINA_HHNIMI[kk], _MINA_HHNIMI[kk]);
  if (!tavoiteHtml && p.sm_pallo_viimeisin != null) tavoiteHtml = tavoiterivi('sm_pallo', '🎯', 'Pallo mukaan vauhtiin', 'SM-pallo');
  h += tavoiteHtml;
  // 📈 parannus VAIN positiivinen (hh_taso_edellinen — SJK tyhjä, syttyy 2. kierroksella, §3.2)
  if (p.hh_taso != null && p.hh_taso_edellinen != null && (p.hh_taso - p.hh_taso_edellinen) > 0) {
    h += '<div style="font-size:14px;color:#28B090;margin-top:10px">📈 Kehityit viime kerrasta — hienoa!</div>';
  }
  if (!h) h = '<div style="font-size:13px;color:var(--text)">⚽ Nopeustestit tulossa — silloin näet tuloksesi!</div>';
  return box(h);
}

function rMinaTekniikkaprofiili() {

  if (d.tyhja) {

    // näytä ne lapsen kielellä (sekunnit + ⚽, EI tasolukuja/vertailua) — muuten "kisa tulossa".
    let _body;

      + _body + '</div>';
  }
  const merkkiVari = { kulta: '#D4AF37', hopea: '#9AA0A6', pronssi: '#B87333' };
  const lajiNimi = { ponnauttelu: 'Ponnauttelu', syotto: 'Syöttö', pujottelu: 'Pujottelu', kuljetus_laukaus: 'Kuljetus-laukaus' };
  let h = '<div style="background:var(--bg3);padding:20px;margin:14px 20px 0;border:.5px solid rgba(242,239,230,.08)">';
  h += '<div style="font-family:\'Cormorant Garamond\',serif;font-size:18px;font-weight:400;color:var(--text);margin-bottom:12px;letter-spacing:.01em">Tekniikkaprofiili</div>';
  h += '<div style="display:flex;align-items:baseline;gap:10px;margin-bottom:4px">';

  h += '<div style="font-family:\'DM Sans\',sans-serif;font-size:11px;color:#8C8B86">TKI</div>';
  if (d.merkki) h += '<div style="margin-left:auto;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;background:' + (merkkiVari[d.merkki] || '#8C8B86') + '22;color:' + (merkkiVari[d.merkki] || '#8C8B86') + ';text-transform:capitalize">' + d.merkki + '</div>';
  h += '</div>';
  // §5.3 tavoiterivit (pikakentät) — korvaa vanhat yksinkertaiset vahvuus/kehityskohde-rivit; fallback sisällä
  h += _minaTavoiteRivit(_pelaaja, d);
  // Lajipalkit (aika sekunteina, lyhyempi = nopeampi)
  const lajit = ['ponnauttelu', 'syotto', 'pujottelu', 'kuljetus_laukaus'];
  const arvo = (id) => { const x = d.testit[id]; if (x == null) return null; if (typeof x === 'object') return (x.tulos != null ? x.tulos : x.paras); return x; };
  const vals = lajit.map(id => ({ id: id, val: parseFloat(arvo(id)) })).filter(x => !isNaN(x.val));
  if (vals.length) {
    const max = Math.max.apply(null, vals.map(x => x.val));
    // Palkin täyttö = HYVYYS (ei aika): täysi = eliittiviitteen erinomainen-taso, min 10 % (ettei katoa).
    // Pienempi aika → pidempi palkki. tkLajiViite window.TM_TESTIT:stä; ilman viitettä KÄÄNNETTY suhteutus (max−arvo).
    const T = window.TM_TESTIT;
    const sp = (String(_pelaaja && _pelaaja.sukupuoli || '').toUpperCase() === 'N') ? 'T' : 'P';
    const ika = (_pelaaja && _pelaaja.syntymaVuosi) ? (new Date().getFullYear() - _pelaaja.syntymaVuosi) : null;

    const tkiV = _pelaaja && _pelaaja.tki_vahvuus, tkiK = _pelaaja && _pelaaja.tki_kehityskohde;
    vals.forEach(x => {
      const viite = (T && T.tkLajiViite && ika != null) ? T.tkLajiViite(x.id, ika, sp) : null;
      const pct = (viite && viite.erinomainen && x.val > 0)
        ? Math.round(Math.max(10, Math.min(100, 100 * viite.erinomainen / x.val)))
        : Math.round(Math.max(10, Math.min(100, ((max - x.val) / max) * 100)));
      const onV = (x.id === tkiV) || (d.vahvuudet || []).some(z => z.laji === x.id);
      const onK = (x.id === tkiK) || (d.kehityskohteet || []).some(z => z.laji === x.id);
      const vari = onV ? '#28B090' : onK ? '#E0A040' : '#8C8B86';
      // §B: ★ vahvuuslajin riville, 🎯 kehityskohteen riville (pikakentistä). EI ↑-nuolta — ei per-laji-historiaa (§3.3.1 epävarma → ei nuolta).
      const mark = (x.id === tkiV) ? ' ★' : (x.id === tkiK) ? ' 🎯' : '';
      h += '<div style="display:flex;align-items:center;gap:8px">'
        + '<div style="width:96px;font-size:11px;color:#8C8B86;text-align:right">' + (lajiNimi[x.id] || x.id) + mark + '</div>'
        + '<div style="flex:1;background:rgba(242,239,230,.06);border-radius:3px;height:14px;overflow:hidden"><div style="width:' + pct + '%;height:100%;background:' + vari + '"></div></div>'
        + '<div style="width:42px;font-size:10px;color:var(--text);text-align:right">' + x.val.toFixed(1) + 's</div>'
        + '</div>';
    });

    h += '<div style="font-size:11px;color:' + (d.trendi.parani ? '#28B090' : '#E0A040') + ';margin-top:10px">' + tt + '</div>';
  }
  h += '</div>';
  return h;
}

];
var _MINA_D3_VAIHT = ['Harvoin', 'Joskus', 'Aika usein', 'Usein', 'Melkein aina']; // mapataan 1–5, numeroa EI näytetä
var _minaD3 = {};
function rMinaItsearvio() {
  var d = _pelaaja;
  if (d && d.d3_viimeisin && d.d3_viimeisin.pisteet) {
    _MINA_D3_KYS.forEach(function (k) {

  _MINA_D3_KYS.forEach(function (k) {
    h += '<div style="padding:12px 0;border-top:.5px solid rgba(242,239,230,.06)">';
    h += '<div style="font-size:14px;color:var(--text);margin-bottom:9px">' + k.q + '</div>';
    h += '<div style="display:flex;gap:5px;flex-wrap:wrap">';
    _MINA_D3_VAIHT.forEach(function (v, i) {
      var on = (_minaD3[k.key] === (i + 1));
      h += '<button onclick="_minaD3Valitse(\'' + k.key + '\',' + (i + 1) + ')" id="mia_' + k.key + '_' + (i + 1) + '" '

        + 'border-radius:8px;font-size:11px;font-family:\'DM Sans\',sans-serif;cursor:pointer">' + v + '</button>';
    });
    h += '</div></div>';
  });
  h += '<button onclick="_tallennaItsearvio()" style="display:block;width:100%;margin-top:16px;background:#28B090;color:#fff;border:none;border-radius:10px;padding:14px;font-size:15px;font-weight:600;cursor:pointer;min-height:48px;font-family:\'DM Sans\',sans-serif">Valmis! 🎉</button>';
  h += '</div>';
  return h;
}
function _minaD3Valitse(dim, n) {
  _minaD3[dim] = n;
  for (var i = 1; i <= 5; i++) {
    var b = document.getElementById('mia_' + dim + '_' + i);
    if (b) { var on = (i === n); b.style.background = on ? '#28B090' : 'transparent'; b.style.color = on ? '#fff' : 'var(--text)'; }
  }
}
async function _tallennaItsearvio() {
  if (!_pelaaja || !_pelaaja.id || !_pelaaja.seuraId || !window._db) return;
  var annettu = Object.keys(_minaD3).filter(function (k) { return _minaD3[k] != null; });
  if (!annettu.length) return;
  var pisteet = (_pelaaja.d3_viimeisin && _pelaaja.d3_viimeisin.pisteet)
    ? JSON.parse(JSON.stringify(_pelaaja.d3_viimeisin.pisteet)) : {};
  annettu.forEach(function (k) { pisteet[k] = pisteet[k] || {}; pisteet[k].pelaaja = _minaD3[k]; });
  // per-dim avg = saatavilla olevien valmentaja/pelaaja keskiarvo; d3_taso = avg-arvojen keskiarvo (1 desimaali)
  var avgs = [];
  Object.keys(pisteet).forEach(function (k) {
    var pt = pisteet[k], vals = [];
    if (pt.valmentaja != null) vals.push(pt.valmentaja);
    if (pt.pelaaja != null) vals.push(pt.pelaaja);
    if (vals.length) { pt.avg = Math.round(vals.reduce(function (a, b) { return a + b; }, 0) / vals.length * 10) / 10; avgs.push(pt.avg); }
  });
  var d3_taso = avgs.length ? Math.round(avgs.reduce(function (a, b) { return a + b; }, 0) / avgs.length * 10) / 10 : null;
  var onV = false, onP = false;
  Object.keys(pisteet).forEach(function (k) { if (pisteet[k].valmentaja != null) onV = true; if (pisteet[k].pelaaja != null) onP = true; });
  var lahteet = []; if (onV) lahteet.push('valmentaja'); if (onP) lahteet.push('pelaaja');
  var d3v = { pisteet: pisteet, pvm: new Date().toISOString().slice(0, 10), lahteet: lahteet };
  // d3_varmuus pikakenttä (§26) — 'itsearvio' kun vain pelaaja, 'trianguloitu' jos valmentaja jo arvioinut.
  // EI näytetä pelaajalle (§7.22); aikuisnäkymät (Master/VP) lukevat tästä.
  var d3_varmuus = (typeof d3Varmuus === 'function') ? d3Varmuus(lahteet)
    : (onV && onP ? 'trianguloitu' : onP ? 'itsearvio' : onV ? 'valmentaja' : null);
  try {
    await window._db.collection('seurat').doc(_pelaaja.seuraId)
      .collection('pelaajat').doc(_pelaaja.id)
      .set({ d3_viimeisin: d3v, d3_taso: d3_taso, d3_pvm: d3v.pvm, d3_varmuus: d3_varmuus }, { merge: true });
    _pelaaja.d3_viimeisin = d3v; _pelaaja.d3_taso = d3_taso; _pelaaja.d3_varmuus = d3_varmuus;
    alert('Kiitos! 🎉 Tallensin sinun ajatuksesi. Tämä auttaa valmentajaa tukemaan sinua.');
    if (typeof draw === 'function') draw();
  } catch (e) { console.warn('[itsearvio]', e && e.message); }
}
window.rMinaItsearvio = rMinaItsearvio;
window._minaD3Valitse = _minaD3Valitse;
window._tallennaItsearvio = _tallennaItsearvio;

function _tallennaVapaa(){
  if(!_vaTyyppi||!_vaFiilis) return;
  _vaSaved=true;

  // Bola Sempre: pihapeli/pallo/kaveri = T (pallokosketus), muut = vapaa
  const onT = ['pihapeli','pallo','kaveri'].includes(_vaTyyppi);
  const tyyppi = onT ? 'T' : 'vapaa';

  // XP: T-harjoite 0.5 XP/min, vapaa 0.3 XP/min
  const xp = Math.round(_vaMin * (onT ? 0.5 : 0.3));

  // Yksittäinen atominen write — AI-agentin lukema rakenne
  _tallennaKirjaus(tyyppi, xp, true, {
    kesto_min: _vaMin,
    fiilinki:  _vaFiilis,
    konteksti: _vaTyyppi,
  }).catch(e => console.warn('[vapaa kirjaus]', e.message));

  // ── TMBus: julkaise ekosysteemille ──
  try{
    if(window.TMBus){
      const pid = (_pelaaja && _pelaaja.id) || window._tmPlayerId || 'eemeli';
      TMBus.publish('training', {
        playerId: pid,
        source: 'self',

function _initFirebase() {
  if (_fbInited) return;
  firebase.initializeApp(_fbCfg);
  // _functions ladataan tarvittaessa myöhemmin
  _fbInited = true;

  const auth = firebase.auth();
  const db   = firebase.firestore();
  window._db   = db;
  window._auth = auth;

  // ══ AUTH STATE LISTENER — kaikki reitit (v3-logiikka) ══════════
  auth.onAuthStateChanged(async user => {
    if (_kirjautuminenKesken) return;

    // Manuaalisesti uloskirjautunut → älä kirjaudu automaattisesti
    if (_uloskirjautunut) {
      go('pin');
      return;
    }

    if (user) {
      _user = user;

      // Anonyymi käyttäjä → URL-param reitti
      if (user.isAnonymous) {
        if (_URL.pelaajaId && _URL.seuraId) {
          await _lataaProfiiliFirestore(db, _URL.pelaajaId);
        } else {
          go('pin');
        }
        return;
      }

      // Kirjautunut käyttäjä (email) → koko v3-auth-flow
      await _lataaFirebasePelaaja(auth, db, user);
      return;
    }

    // Ei kirjautumista
    if (_isDemoUser) return;

    // Kokeile PIN-sessiota
    const pinOk = await _tarkistaPinSessio(auth, db);
    if (pinOk) return;

    // Kokeile URL-parametreja
    if (_URL.pelaajaId && _URL.seuraId) {
      _kirjautuminenKesken = true;
      try { await auth.signInAnonymously(); } catch(e) { console.warn('[anon]', e.message); }
      _kirjautuminenKesken = false;
      return;
    }

    go('pin');
  });
}

async function _lataaProfiiliFirestore(db, uid) {
  try {
    // Hae seuraId Custom Claimsista (tokenista)
    let seuraId = null;
    try {
      const tokenResult = await firebase.auth().currentUser?.getIdTokenResult();
      seuraId = tokenResult?.claims?.seuraId || null;
    } catch(e) {}
    window._seuraId = seuraId;

    if (seuraId) {
      // Oikea polku: seurat/{seuraId}/pelaajat/{uid}
      const snap = await db.collection('seurat').doc(seuraId)
        .collection('pelaajat').doc(uid).get();
      if (snap.exists) {
        _pelaaja = { id: uid, seuraId, ...snap.data() };
        _stage = _laskeStage(_pelaaja.syntymaVuosi, _pelaaja.phv_tila);
        _flei  = _laskeFlei(_pelaaja);
        _paivitaDemoData();
        _lataaCStreak(); // Lataa streak Firestoreen
        _paivitaEXHarjoitelogiikasta(); // Päivitä harjoiteohjelma
        return;
      }
    }
    // Fallback: flat pelaajat/{uid} (legacy / URL-param reitti)
    const snap2 = await db.collection('pelaajat').doc(uid).get();
    if (snap2.exists) {
      _pelaaja = { id: uid, seuraId, ...snap2.data() };
      _stage = _laskeStage(_pelaaja.syntymaVuosi, _pelaaja.phv_tila);
      _flei  = _laskeFlei(_pelaaja);
      _paivitaDemoData();
    }
  } catch(e) {
    console.warn('[v4 profiili]', e.message);
  }
}

/* ══ LATAA FIREBASE PELAAJA — täysi v3-flow ══════════════════════
   Reitit: super_admin → URL-param+huoltaja → huoltajahaku → UID-haku
══════════════════════════════════════════════════════════════════ */
async function _lataaFirebasePelaaja(auth, db, user) {
  try {
    const tokenTulos = await user.getIdTokenResult(true);
    const claims = tokenTulos.claims || {};

    // ── Super admin ──────────────────────────────────────────────
    if (claims.super_admin || claims.superAdmin) {
      console.log('[v4] Super Admin Pelaaja-näkymässä');
      const saPelId = _URL.pelaajaId;
      const saSeura = _URL.seuraId || 'kpv';
      if (saPelId && saSeura) {
        try {
          const snap = await db.collection('seurat').doc(saSeura)
            .collection('pelaajat').doc(saPelId).get();
          if (snap.exists) {
            _pelaaja = { id: snap.id, seuraId: saSeura, ...snap.data() };
            window._seuraId = saSeura;
            _kaynnistaAppUI();
            return;
          }
        } catch(e) { console.warn('[SA URL]', e.message); }
      }
      // SA fallback: demo-pelaaja
      _isDemoUser = false;
      _pelaaja = { id: 'super_admin_view', etunimi: 'Super', sukunimi: 'Admin',
        seuraId: saSeura || 'kpv', syntymaVuosi: 2011,
        flei_viimeisin: 75, streak: 3, xp: 250, taso: 3,
        sbl:2.1, sfl:1.9, ll:1.8, diag:2.0, dfl:1.7 };
      window._seuraId = _pelaaja.seuraId;
      _kaynnistaAppUI();
      return;
    }

    const urlPelId = _URL.pelaajaId;
    const urlSeura = _URL.seuraId || claims.seuraId || 'kpv';
    window._seuraId = urlSeura;

    // ── Tapa 0: URL-param + huoltajaEmail tarkistus ──────────────
    if (urlPelId && urlSeura) {
      try {
        const snap = await db.collection('seurat').doc(urlSeura)
          .collection('pelaajat').doc(urlPelId).get();
        if (snap.exists) {
          const d = snap.data();
          const emailTasmaa = d.huoltajaEmail && user.email &&
            d.huoltajaEmail.toLowerCase() === user.email.toLowerCase();
          if (emailTasmaa || claims.super_admin) {
            _pelaaja = { id: snap.id, seuraId: urlSeura, ...d };
            _kaynnistaAppUI();
            return;
          }
        }
      } catch(e) { console.warn('[Tapa0]', e.message); }
    }

    // ── Tapa 1: Huoltajahaku emaililla ───────────────────────────
    if (user.email) {
      try {
        const hSnap = await db.collection('seurat').doc(urlSeura)
          .collection('pelaajat')
          .where('huoltajaEmail', '==', user.email.toLowerCase()).limit(1).get();
        if (!hSnap.empty) {
          _pelaaja = { id: hSnap.docs[0].id, seuraId: urlSeura, ...hSnap.docs[0].data() };
          window._seuraId = urlSeura;
          _kaynnistaAppUI();
          return;
        }
      } catch(e) { console.warn('[Tapa1]', e.message); }
    }

    // ── Tapa 2: UID-haku Custom Claimsista ──────────────────────
    const claimSeura = claims.seuraId || urlSeura;
    if (claimSeura) {
      try {
        const snap = await db.collection('seurat').doc(claimSeura)
          .collection('pelaajat').doc(user.uid).get();
        if (snap.exists) {
          _pelaaja = { id: snap.id, seuraId: claimSeura, ...snap.data() };
          window._seuraId = claimSeura;
          _kaynnistaAppUI();
          return;
        }
      } catch(e) { console.warn('[Tapa2]', e.message); }
    }

    // ── Ei löydy → kirjautumisruutu ─────────────────────────────
    console.warn('[v4] Pelaajaa ei löydy — näytetään PIN');
    go('pin');

  } catch(e) {
    console.warn('[_lataaFirebasePelaaja]', e.message);
    // Kirjataan virhe Firestoreen jos db käytettävissä
    if (window._db) {
      window._db.collection('errors').add({
        fn: '_lataaFirebasePelaaja', msg: e.message,

async function _tarkistaPinSessio(auth, db) {
  try {
    const raw = localStorage.getItem('tm_pin_sessio');
    if (!raw) return false;
    const sessio = JSON.parse(raw);
    // Sessio vanhenee 30 päivässä
    if (!sessio.ts || Date.now() - sessio.ts > 30 * 86400000) {
      localStorage.removeItem('tm_pin_sessio');
      return false;
    }
    if (!auth.currentUser) {
      await auth.signInAnonymously().catch(()=>{});
    }
    // Lataa pelaaja sessiosta
    const snap = await db.collection('seurat').doc(sessio.seuraId)
      .collection('pelaajat').doc(sessio.pelaajaId).get();
    if (!snap.exists) return false;
    _pelaaja = { id: snap.id, seuraId: sessio.seuraId, ...snap.data() };
    window._seuraId = sessio.seuraId;
    _kaynnistaAppUI();
    return true;
  } catch(e) {
    console.warn('[pin-sessio]', e.message);
    return false;
  }
}

function _onkoSynttari(p) {
  if (!p) return false;

    ? new Date(p.syntymaaika.seconds * 1000)
    : p.syntymaVuosi ? new Date(p.syntymaVuosi, 5, 15) : null;
  if (!pvm) return false;

function _synttariKonfetti() {
  var el = document.getElementById('synttari-konfetti');
  if (el) el.remove();
  var canvas = document.createElement('canvas');
  canvas.id = 'synttari-konfetti';
  canvas.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999;';
  document.body.appendChild(canvas);
  var ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  var V = ['#28B090','#2A5DB0','#E0A040','#D96060','#FFD700']; // canonical: teal, blue, amber
  var P = [];
  for (var k=0;k<60;k++) P.push({
    x:Math.random()*canvas.width, y:-10-Math.random()*100,
    w:6+Math.random()*8, h:3+Math.random()*5,
    vx:(Math.random()-.5)*3, vy:2+Math.random()*3,
    rot:Math.random()*360, vrot:(Math.random()-.5)*8,
    c:V[Math.floor(Math.random()*V.length)]
  });
  var f=0;
  function loop(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    f++;
    var fade = Math.max(0,1-(f-80)/40);
    P.forEach(function(p){
      p.x+=p.vx; p.y+=p.vy; p.rot+=p.vrot; p.vy+=0.08;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot*Math.PI/180);
      ctx.globalAlpha=f<80?1:fade; ctx.fillStyle=p.c;
      ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore();
    });
    if(f<120) requestAnimationFrame(loop); else canvas.remove();
  }
  requestAnimationFrame(loop);
}

/* ══════════════════════════════════════════════════════════
   _paivaIso — paikallinen aikavyöhyke YYYY-MM-DD
   Korvaa toISOString().slice(0,10):n joka käyttää UTC:tä ja
   aiheuttaa off-by-one -bugin keskiyön tienoilla EET/EEST.
══════════════════════════════════════════════════════════ */
function _paivaIso(d) {
  d = d || new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${dd}`;
}
window._paivaIso = _paivaIso;

/* ══════════════════════════════════════════════════════════
   _haeStreak — yksi totuus streak-arvolle
   _streak (Firestoresta laskettu) ensisijainen, _pelaaja.streak
   fallback (esim. demo-tila tai Firestore-haku kesken).
   Korjaa hdr() ↔ streakViesti -ristiriidan.
══════════════════════════════════════════════════════════ */
function _haeStreak() {
  return _streak || _pelaaja?.streak || 0;
}
window._haeStreak = _haeStreak;

/* ══════════════════════════════════════════════════════════
   _haeViikkoPaivat — aloitusnäytön viikkonauha (ma–su).
   Johdettu _haeStreak():sta: positiivinen putki = peräkkäisiä päiviä
   tähän/eiliseen asti → menneet viikonpäivät joiden etäisyys ≤ streak
   ovat tehtyjä. Tänään korostetaan erikseen ("kesken"), tulevat neutraaleja.
   (PIN-näkymä on pre-login → vain streak saatavilla, ei kirjauslokia.)
══════════════════════════════════════════════════════════ */
function _haeViikkoPaivat() {
  var labels = ['M','T','K','T','P','L','S'];   // ma..su
  var streak = (typeof _haeStreak === 'function') ? _haeStreak() : 0;
  var dow = new Date().getDay() || 7;            // ma=1 .. su=7
  var out = [];
  for (var i = 1; i <= 7; i++) {
    var daysAgo = dow - i;                        // >0 mennyt, 0 tänään, <0 tuleva
    out.push({ lbl: labels[i - 1], today: (i === dow), done: (daysAgo >= 1 && daysAgo <= streak) });
  }
  return out;
}
window._haeViikkoPaivat = _haeViikkoPaivat;

/* ══════════════════════════════════════════════════════════
   STREAK-VIESTI — positiivinen kehys (Seligman PERMA + Deci & Ryan SDT)
   Ei loss aversion -kieltä missään tilassa.
   Brand-päätös 2026-05-12.
══════════════════════════════════════════════════════════ */
function _streakViesti(streak) {
  if (!streak)      return 'Aloita tänään — ensimmäinen askel on tärkein.';
  if (streak <= 6)  return `🔥 ${streak} päivän putki — jatka huomenna!`;
  if (streak <= 13) return `🔥 ${streak} päivää — olet jo sitoutunut.`;
  return `🔥 ${streak} päivää — olet jo poikkeuksellinen.`;
}

function _laskeStage(sy, phv) {
  if (phv === 'huippu' || phv === 'PH') return '1_leikkija';  // PH = PHV-huippu (tm_bioika §30)
  const ika = new Date().getFullYear() - (sy || 2010);
  if (ika <= 12) return '1_leikkija';
  if (ika <= 15) return '2_rakentaja';
  return '3_showcase';
}

function _laskeFlei(p) {
  // Harjoitettavuuskartoitus käyttää asteikkoa 1-3 (Palloliiton manuaali 2026)
  // Normalisointi 0-100%: (arvo - 1) / (3 - 1) * 100
  // 1p = 0%, 2p = 50%, 3p = 100%
  // Defaultarvo 2.0 = 50% (ikäluokan normi kun dataa ei ole)
  const norm = v => Math.round(((v || 2.0) - 1) / 2 * 100);
  return {
    SBL:  norm(p.sbl),
    SFL:  norm(p.sfl),
    LL:   norm(p.ll),
    DIAG: norm(p.diag),
    DFL:  norm(p.dfl),
  };
}

function _heikoinKetju() {
  if (!Object.keys(_flei).length) return 'SBL';
  return Object.entries(_flei).sort(([,a],[,b])=>a-b)[0][0];
}

function _paivitaDemoData() {
  // Kun Firestore-data ladattu, draw() päivittää näkymän
  draw();
}

// Firestore-kirjaus — kutsu aina kun tehty-nappia painetaan
async function _tmKirjaa(avain, arvo) {
  if (_isDemoUser) return true;                        // demo: ei Firestore-kirjoitusta, UI reagoi silti
  if (!_pelaaja?.id || !window._db) return false;
  const pvm = _paivaIso();
  const seuraId = window._seuraId || _pelaaja?.seuraId || null;
  // Varmista tuore token ennen kirjoitusta (kuten _tallennaKirjaus) — vanhentunut sessio →
  // muuten permission-denied joka aiemmin niellettiin = valeonnistuminen (ks. silent-failure-muistiinpano).
  try {
    const u = window._auth?.currentUser || firebase.auth().currentUser;
    if (u) await u.getIdToken(true);
  } catch (_) { /* ei estä kirjausta */ }
  try {
    // Oikea polku: seurat/{seuraId}/pelaajat/{uid}/kirjaukset/{pvm}
    const ref = seuraId
      ? window._db.collection('seurat').doc(seuraId)
          .collection('pelaajat').doc(_pelaaja.id)
          .collection('kirjaukset').doc(pvm)
      : window._db.collection('pelaajat').doc(_pelaaja.id)
          .collection('kirjaukset').doc(pvm); // fallback legacy
    await ref.set(
      { [avain]: arvo, lahde: 'pelaaja', paivitetty: firebase.firestore.FieldValue.serverTimestamp() },
      { merge: true }
    );
    return true;
  } catch(e) {
    console.warn('[v4 kirjaus]', e.code || '', e.message);
    return false;   // älä niele — kutsuja näyttää toimintaohje-toastin
  }
}

/* ══ TALLENNA KIRJAUS — batch write (streak + XP atomisesti) ═════
   Polku: seurat/{seuraId}/pelaajat/{pid}/kirjaukset/{pvm}
═════════════════════════════════════════════════════════════════ */
async function _tallennaKirjaus(tyyppi, xp, kaikki, ekstra) {
  // ekstra: { rpe, fiilinki, kesto_min, konteksti } — AI-agentti lukee nämä myöhemmin
  if (_isDemoUser) return true;                 // demo: ei Firestore-kirjoitusta, UI reagoi silti
  if (!_pelaaja || !window._db) return false;

  const sid = window._seuraId || _pelaaja.seuraId;
  const pid = _pelaaja.id;
  if (!sid || !pid || pid === 'super_admin_view') return false;

  // Varmista tuore token ennen Firestore-kirjoitusta — sessio voi vanhentua
  // pitkän tauon jälkeen (esim. puhelimen nukkuessa). getIdToken(true) pakottaa
  // Firebase Auth:n hakemaan uuden tokenin palvelimelta.
  try {
    const u = window._auth?.currentUser || firebase.auth().currentUser;
    if (u) await u.getIdToken(true);
  } catch (_) { /* ei estä kirjausta */ }

  const pvm = _paivaIso();
  const db  = window._db;
  const pelaajaDok = db.collection('seurat').doc(sid).collection('pelaajat').doc(pid);
  const kirjausDok = pelaajaDok.collection('kirjaukset').doc(pvm);
  const h    = new Date().getHours();
  const aika = h < 11 ? 'aamu' : h < 17 ? 'paiva' : 'ilta';

  // Rakenne jonka AI-agentti lukee (Sprint 6-8):
  // tyyppi: 'T' | 'D' | 'S' | 'joukkue' | 'vapaa'
  // kesto_min: kokonaisminuutit
  // rpe: 1-10 (joukkuetreeni kuormitus) tai null (ei joukkuetreeniä)
  // fiilinki: 1-5 (päivittäinen emojifiilis, Leikkijä 1/3/5)
  // joukkuetreeni: true/false/null (oliko joukkuetreeni tänään)
  // aika: 'aamu' | 'paiva' | 'ilta'
  const kirjausData = {
    tyyppi,
    tehty: true,
    lahde: 'pelaaja',   // PÄÄTÖS 1: kirjauksen tekijä — pelaaja kirjaa itse PIN-tilassa
    xp: xp || 0,
    aika,
    pvm,
    kesto_min: ekstra?.kesto_min || null,
    rpe:       ekstra?.rpe       || null,
    fiilinki:  ekstra?.fiilinki  || null,
    joukkuetreeni: ekstra?.joukkuetreeni ?? null,
    konteksti: ekstra?.konteksti || null,
    kirjaustapa: 'heti',  // reaaliaikainen kirjaus — vrt. 'jalkikateen' (takautuva)
    luotu: firebase.firestore.Timestamp.fromDate(new Date(pvm)),   // A5: treenipäivä (idempotentti merge, kronologinen feed)
    paivitetty: firebase.firestore.FieldValue.serverTimestamp(),
  };
  kirjausData['tehty_' + tyyppi] = true;   // KORJAUS 1: tyyppikohtainen dedup-merkintä (päivädoc = yksi, merge)

  try {
    const batch = db.batch();

    // 1. Päiväkirjausdokumentti (id = 'YYYY-MM-DD', merge koska sama päivä voi olla useita)
    batch.set(kirjausDok, kirjausData, { merge: true });

    // 2. Pelaajadokumentti: XP + streak atomisesti samassa commitissa
    const paivitys = {
      xp: (_pelaaja.xp || 0) + (xp || 0),
    };
    if (kaikki) {
      // Ei lisätä streakia jos sama päivä on jo kirjattu
      const uusiStreak = (_streak || 0) + ((_streakLastDate === pvm) ? 0 : 1);
      _streak = uusiStreak;
      paivitys.streak            = uusiStreak;
      paivitys.streak_paivitetty = pvm;
      _streakLastDate            = pvm;
    }
    batch.update(pelaajaDok, paivitys);

    // Päivitä lokaalisti heti — UI päivittyy ennen Firestore-vahvistusta
    _pelaaja.xp = paivitys.xp;

    await batch.commit();
    console.log('[v5] Kirjaus OK:', tyyppi, xp, 'XP | streak:', _streak);
    return true;

  } catch(e) {
    console.warn('[v5 kirjaus virhe]', e.code || '', e.message);
    throw e;   // FIX 1: ÄLÄ niele — kutsuja näyttää pelaajalle toimintaohje-toastin
  }
}


/* ══ HARJOITE-KIRJAUS — KOTI-näkymän 3-kerros (D/S/T) ════════════
   D = pääohjelma _luoOhjelma:sta, 70%, +60 XP, konteksti 'paivan_ohjelma'
   S = kohdennettu kehitys heikoimpaan ketjuun, 30%, +30 XP
   T = Bola Siempre vakio (pallo joka päivä), +20 XP
   _tallennaKirjaus hoitaa demo-tarkistuksen + getIdToken(true) + batch-kirjoituksen.
═════════════════════════════════════════════════════════════════ */
async function _kirjaaHarjoite(tyyppi) {
  const xpMap        = { D: 60, S: 30, T: 20 };
  const kontekstiMap = { D: 'paivan_ohjelma', S: 'kohdennettu', T: 'bola_siempre' };
  const btnIdMap     = { D: 'dKirjausBtn',    S: 'sKirjausBtn',  T: 'tKirjausBtn' };
  if (!(tyyppi in xpMap)) return;
  // KORJAUS 1 — DEDUP: sama harjoite voidaan kirjata vain kerran/päivä → estää tuplakirjauksen + tupla-XP:n.
  if (await _onkoKirjattuTanaan(tyyppi)) {
    _naytaInfoToast('Tämä harjoite on jo kirjattu tänään.');
    _merkitseNappiTehdyksi(btnIdMap[tyyppi]);
    return;
  }
  try {
    const ok = await _tallennaKirjaus(tyyppi, xpMap[tyyppi], false, { konteksti: kontekstiMap[tyyppi] });
    if (ok) {
      _harjoiteVahvistus(btnIdMap[tyyppi]);
      // Päivitä streak (kirjaukset-kokoelmasta laskettu) viiveellä, jotta Firestore-write ehtii valmistua.
      if (typeof _lataaCStreak === 'function') setTimeout(_lataaCStreak, 400);
    } else {
      // Ei tallentunut (puuttuva istunto/seura) — kerro pelaajalle mitä tehdä.
      _naytaKirjausVirhe('Kirjausta ei voitu tallentaa — kirjaudu uudelleen PIN-koodilla.');
    }
  } catch (e) {
    console.warn('[kirjaaHarjoite]', tyyppi, e.code || '', e.message);
    // Rules sallivat anonyymin PIN-kirjauksen → permission-denied = istunto vanhentunut → kirjaudu uudelleen.
    _naytaKirjausVirhe((e && e.code === 'permission-denied')
      ? 'Kirjaus ei tallentunut — kirjaudu uudelleen PIN-koodilla.'
      : 'Kirjaus ei tallentunut — tarkista verkkoyhteys ja yritä uudelleen.');
  }
}

// Toimintaohje-toast kirjausvirheelle (sama tyyli kuin kirjaaRPE).
function _naytaKirjausVirhe(viesti) {
  const t = document.createElement('div');
  t.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);max-width:88vw;background:#1a1a18;border:.5px solid rgba(216,90,90,.4);color:#E07A5F;padding:11px 18px;border-radius:8px;font-size:12px;font-weight:500;line-height:1.4;text-align:center;z-index:999;animation:toastIn .2s ease';
  t.textContent = viesti;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 4000);
}

function _harjoiteVahvistus(btnId) {
  const btn = document.getElementById(btnId);
  if (!btn) return;
  btn.disabled = true;
  const etunimi = _pelaaja?.etunimi || '';
  btn.textContent = etunimi ? `✓ Tehty — hyvä työ, ${etunimi}!` : '✓ Tehty — hyvä työ!';
  btn.style.opacity = '0.55';
  btn.style.cursor = 'default';
  if (navigator.vibrate) navigator.vibrate(40);
}

/* ══ KORJAUS 1 — DEDUP-APURIT ═══════════════════════════════════
   Päiväkirjaus tallentuu yhteen doc:iin (id=pvm, merge). Tyyppikohtainen
   merkintä tehty_<tyyppi> kertoo onko D/S/T jo kirjattu tänään.
═════════════════════════════════════════════════════════════════ */
async function _onkoKirjattuTanaan(tyyppi) {
  if (_isDemoUser) return false;
  if (!_pelaaja?.id || !window._db) return false;
  const sid = window._seuraId || _pelaaja?.seuraId, pid = _pelaaja.id;
  if (!sid || !pid) return false;
  try {
    const snap = await window._db.collection('seurat').doc(sid)
      .collection('pelaajat').doc(pid).collection('kirjaukset').doc(_paivaIso()).get();
    return !!(snap.exists && snap.data() && snap.data()['tehty_' + tyyppi] === true);
  } catch (e) { console.warn('[dedup luku]', e.message); return false; }  // luku ei onnistu → ei estetä kirjausta
}

function _merkitseNappiTehdyksi(btnId) {
  const btn = document.getElementById(btnId);
  if (!btn) return;
  btn.disabled = true;
  btn.textContent = '✓ Tehty jo';
  btn.style.opacity = '0.55';
  btn.style.cursor = 'default';
}

// KOTI-latauksessa: merkitse tänään jo kirjatut napit "✓ Tehty jo" -tilaan (yksi doc-luku).
async function _paivitaTehtyNapit() {
  if (_isDemoUser) return;
  if (!_pelaaja?.id || !window._db) return;
  if (!document.getElementById('dKirjausBtn') && !document.getElementById('sKirjausBtn') && !document.getElementById('tKirjausBtn')) return;
  const sid = window._seuraId || _pelaaja?.seuraId, pid = _pelaaja.id;
  if (!sid || !pid) return;
  try {
    const snap = await window._db.collection('seurat').doc(sid)
      .collection('pelaajat').doc(pid).collection('kirjaukset').doc(_paivaIso()).get();
    if (!snap.exists) return;
    const d = snap.data() || {};
    [['D', 'dKirjausBtn'], ['S', 'sKirjausBtn'], ['T', 'tKirjausBtn']].forEach(function (p) {
      if (d['tehty_' + p[0]] === true) _merkitseNappiTehdyksi(p[1]);
    });
    // Säilytä tallennettu fiilinki-valinta: korosta vastaava emoji-nappi uudelleenlatauksessa.
    if (typeof d.fiilinki === 'number') {
      const fb = document.querySelectorAll('#fiiRow button')[d.fiilinki - 1];
      if (fb) { fb.style.background = 'rgba(26,122,94,.1)'; fb.style.border = '.5px solid rgba(26,122,94,.25)'; }
    }
  } catch (e) { console.warn('[tehty-napit]', e.message); }
}
