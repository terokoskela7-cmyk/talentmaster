/* ══════════════════════════════════════════════════════════
   TAKAUTUVA LIIKUNTAKIRJAUS — 'jalkikateen'-tyyppi
   Pelaaja voi lisätä menneitä päiviä (tänään - 30pv).
   Konflikti-strategia: jos pvm-doc on jo olemassa, lisätään
   'takautuva'-alikenttänä — alkuperäistä EI ylikirjoiteta.
══════════════════════════════════════════════════════════ */
async function _kirjaaTakautuva(pvm, tyyppi, kestoMin) {
  if (_isDemoUser || !_pelaaja || !window._db) return;
  const sid = window._seuraId || _pelaaja.seuraId;
  const pid = _pelaaja.id;
  if (!sid || !pid || !pvm || !tyyppi) return;

  try {
    const u = window._auth?.currentUser || firebase.auth().currentUser;
    if (u) await u.getIdToken(true);
  } catch(_) {}

  const ref = window._db.collection('seurat').doc(sid)
    .collection('pelaajat').doc(pid)
    .collection('kirjaukset').doc(pvm);

  try {
    const snap = await ref.get();
    if (snap.exists) {
      // Älä ylikirjoita olemassa olevaa kirjausta — tallenna takautuva alikenttänä
      await ref.set({
        takautuva: {
          tyyppi, kesto_min: kestoMin,
          lisatty: firebase.firestore.FieldValue.serverTimestamp()
        }
      }, { merge: true });
    } else {
      // Uusi dokumentti — täysi kirjaus
      await ref.set({
        tyyppi, tehty: true,
        kesto_min: kestoMin,
        kirjaustapa: 'jalkikateen',
        pvm,
        xp: 0,
        rpe: null, fiilinki: null, aika: null,
        lahde: 'pelaaja',   // PÄÄTÖS 1: tekijä = pelaaja (oli 'manuaalinen' = ei sallittu arvo)
        luotu: firebase.firestore.Timestamp.fromDate(new Date(pvm)),   // A5: takautuva treenipäivä → feed oikeaan kohtaan
        paivitetty: firebase.firestore.FieldValue.serverTimestamp()
      });
    }
    console.log('[takautuva] kirjattu:', pvm, tyyppi, kestoMin);
  } catch(e) {
    console.warn('[takautuva]', e.message);
  }
}

function _avaaTakautuvaModal() {
  const ov = document.getElementById('takautuvaOv');
  if (!ov) return;
  const today = new Date();
  const max = _paivaIso(today);
  const minDate = new Date(today.getTime() - 30*86400000);
  const min = _paivaIso(minDate);
  const inp = document.getElementById('takautuvaPvm');
  if (inp) { inp.min = min; inp.max = max; inp.value = max; }
  _takautuvaTyyppi = null;
  _takautuvaKesto = null;
  ov.querySelectorAll('[data-tk-tyyppi]').forEach(b => b.classList.remove('on'));
  ov.querySelectorAll('[data-tk-kesto]').forEach(b => b.classList.remove('on'));
  const kestoBlock = document.getElementById('takautuvaKesto');
  if (kestoBlock) kestoBlock.style.display = '';
  ov.style.display = 'flex';
}
window._avaaTakautuvaModal = _avaaTakautuvaModal;

function _suljeTakautuva() {
  const ov = document.getElementById('takautuvaOv');

}

function _valitseTakautuvaTyyppi(tyyppi, btn) {

  if (btn) btn.classList.add('on');

function _valitseTakautuvaKesto(kesto, btn) {
  _takautuvaKesto = kesto;

  if (btn) btn.classList.add('on');
}
window._valitseTakautuvaKesto = _valitseTakautuvaKesto;

async function _tallennaTakautuva() {
  const inp = document.getElementById('takautuvaPvm');
  const pvm = inp?.value;
  if (!pvm)              { alert('Valitse päivä'); return; }
  if (!_takautuvaTyyppi) { alert('Valitse mitä teit'); return; }
  // Lepopäivälle kesto = 0, muille pakollinen
  const kesto = _takautuvaTyyppi === 'lepo' ? 0 : _takautuvaKesto;
  if (_takautuvaTyyppi !== 'lepo' && !kesto) {
    alert('Valitse kesto'); return;
  }
  await _kirjaaTakautuva(pvm, _takautuvaTyyppi, kesto);
  _suljeTakautuva();
  if (typeof _lataaCStreak === 'function') setTimeout(_lataaCStreak, 400);
}
window._tallennaTakautuva = _tallennaTakautuva;


/* ══ PIN-KIRJAUTUMINEN FIRESTOREEN ══════════════════════════════ */
async function _kirjauduPinilla(pin) {
  if (!pin || pin.length !== 4) return;
  if (!window._db || !window._auth) return;

  const db   = window._db;
  const auth = window._auth;

  try {
    // Anonyymi auth tarvitaan Firestore-rules:ia varten
    if (!auth.currentUser) {
      _kirjautuminenKesken = true;
      await auth.signInAnonymously().catch(e => console.warn('[anon]', e.message));
      _kirjautuminenKesken = false;
    }

    // Hae PIN-hakemistosta (kaikki pilottiseurat)
    const SEURAT = ['kpv','fcl','palloiirot','yvies','sjk','grifk','vifk'];
    let found = null;
    let foundSeura = null;

    for (const seura of SEURAT) {
      try {
        const snap = await db.collection('seurat').doc(seura)
          .collection('pelaajat')
          .where('pin', '==', pin).limit(1).get();
        if (!snap.empty) {
          found = { id: snap.docs[0].id, seuraId: seura, ...snap.docs[0].data() };
          foundSeura = seura;
          break;
        }
      } catch(e) { /* seura ei ole käytössä */ }
    }

    if (!found) {
      // Fallback: tarkista demo-pelaajat (kehitys- ja demokäyttö)
      const DEMO_PINIT = {
        '1234': { etunimi:'Aleksi', sukunimi:'Mäkinen', pelaajaProfiili:'P14 · RAILGUN',
                  seuraId:'kpv', id:'demo_aleksi', _demo:true,
                  taso:7, xp:620, streak:14, flei_viimeisin:84, syntymaVuosi:2012,
                  pelipaikka:'KH', joukkueId:'KPV P14 Musta',
                  sbl:2.7, sfl:1.6, ll:2.3, diag:2.2, dfl:2.0 },
        '9012': { etunimi:'Anton',  sukunimi:'M',       pelaajaProfiili:'P14 · MUSTA',
                  seuraId:'kpv', id:'demo_anton',  _demo:true,
                  taso:7, xp:620, streak:14, flei_viimeisin:71, syntymaVuosi:2011,
                  pelipaikka:'P', joukkueId:'KPV P14 Musta',
                  sbl:2.1, sfl:1.8, ll:2.0, diag:1.5, dfl:2.2 },
        '5555': { etunimi:'Demo',   sukunimi:'Pelaaja', pelaajaProfiili:'Demo',
                  seuraId:'kpv', id:'demo_5555',   _demo:true,
                  taso:3, xp:180, streak:3, flei_viimeisin:60, syntymaVuosi:2012,
                  pelipaikka:'–', joukkueId:'Demo',
                  sbl:1.8, sfl:1.6, ll:1.7, diag:1.4, dfl:1.9 },
      };
      // Käytetään demoKirjaudu()-funktiota jossa on täydellinen pelaajadata (sbl/sfl/ll/diag/dfl)
      const DEMO_PIN_MAP = { '1234':'aleksi', '9012':'aleksi', '5555':'aleksi' };
      if (DEMO_PIN_MAP[pin]) {
        // Demo-paneeli vain ?demo=1:llä — demoKirjaudu() hoitaa loput
        demoKirjaudu(DEMO_PIN_MAP[pin]);
        return;
      }
      // Ei löydy mistään — näytä virhe
      const errEl = document.querySelector('.pin-err, #pinVirhe');
      if (errEl) errEl.textContent = 'Virheellinen PIN. Tarkista koodi.';
      else { _pin=''; draw(); } // resetoi PIN-ruutu
      return;
    }

    // Tallenna sessio localStorage:een (30 pv)
    localStorage.setItem('tm_pin_sessio', JSON.stringify({
      pelaajaId: found.id, seuraId: foundSeura,
      ts: Date.now()
    }));

    _pelaaja = found;
    window._seuraId = foundSeura;
    // P6 — havainto-kuuntelija käynnistyy _kaynnistaAppUI():n sisällä,
    // joka tarkistaa window._p7Pelaaja:n. Asetetaan se ennen kutsua,
    // jotta _p6KaynnistakuuntelIja saa oikeat tunnisteet.
    window._p7Pelaaja = { seuraId: foundSeura, pelaajaId: found.id };
    _kaynnistaAppUI();

  } catch(e) {
    console.warn('[PIN kirjautuminen]', e.message);
    const errEl = document.querySelector('.pin-err, #pinVirhe');
    if (errEl) errEl.textContent = 'Verkkovirhe — yritä uudelleen.';
  }
}

  DFL:{ T:{ 'leikkija':'Keskustassa asuu tasapaino. Siitä pysyy pystyssä yhdellä jalalla.', 'rakentaja':'Kontaktitilanteessa pysyt pystyssä ytimen ansiosta. Kaikki muu rakentuu tähän.', 'showcase':'Deep front line on postural kontrollin perusta. Vastaanotto, kontakti ja yhden jalan tarkkuus lepäävät tällä.' }, D:{ 'leikkija':'Syvät lihakset pitävät ryhdin koko päivän.', 'rakentaja':'Kun keskikeho ei tue, muut lihakset paikkaavat — ja väsyvät nopeammin. Tämä on perusta.', 'showcase':'DFL aktivoi kaiken muun. Kun ydin ei tue, voima vuotaa ennen kuin se saavuttaa jalkaa.' }, S:{ 'leikkija':'Vahva keskusta = koko peli ilman kipua.', 'rakentaja':'90 minuuttia kivutta alkaa keskikehon kestävyydestä. Tämä on vakuutus rasitusvammoja vastaan.', 'showcase':'Core endurance vähentää low back -rasitusvammojen ilmaantuvuutta. Pitkä ura alkaa täältä.' } },

function getWhy(ketju, tyyppi) {
  const ikaMap = {'1_leikkija':'leikkija','2_rakentaja':'rakentaja','3_showcase':'showcase'};
  return WHY?.[ketju]?.[tyyppi]?.[ikaMap[_stage]] ?? '';
}

/* ══ TMBus-integraatio ══════════════════════════════════════
   Kuuntelee ekosysteemin tapahtumia — valmentajan reagoinnit
   ja viestit näytetään toast-ilmoituksina + tallennetaan
   näkyvään inboxiin.
══════════════════════════════════════════════════════════ */
function _initTMBus(){
  if(!window.TMBus) return;
  // Jos meillä ei ole pelaajaa (demo), asetetaan window._tmPlayerId URL-parametrista tai oletetaan eemeli
  try{
    const u = new URL(location.href);
    const qp = u.searchParams.get('pid');
    window._tmPlayerId = qp || 'eemeli';
  }catch(e){ window._tmPlayerId = 'eemeli'; }

  TMBus.subscribe((msg) => {
    if(!msg || msg.kind !== 'event' || !msg.evt) return;
    const evt = msg.evt;
    const myId = (_pelaaja && _pelaaja.id) || window._tmPlayerId;
    // Näytä vain MINUN tapahtumat
    if(evt.playerId !== myId) return;
    if(evt.type === 'coach_react' && evt.coachId){
      _tmToast(`${evt.emoji||'❤️'} Valmentaja reagoi kirjaukseesi`, 'coach_react');
    } else if(evt.type === 'coach_message' && evt.channel !== 'family'){
      _tmToast(`Uusi viesti valmentajalta`, 'coach_msg');
    } else if(evt.type === 'challenge' && evt.fromPlayerId && evt.status==='sent'){
      _tmToast(`Uusi haaste ${evt.fromPlayerId}:lta`, 'challenge');
    }
  });
}

function _tmToast(text, kind){
  let bar = document.getElementById('tmToast');
  if(!bar){
    bar = document.createElement('div');
    bar.id = 'tmToast';
    bar.style.cssText='position:fixed;left:50%;top:24px;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none';
    document.body.appendChild(bar);
  }
  const el=document.createElement('div');
  el.style.cssText='padding:12px 20px;background:rgba(26,122,94,.95);color:#fff;border-radius:24px;font-family:var(--font-b,system-ui);font-size:13px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:tmFadeIn .3s ease,tmFadeOut .4s ease 4s forwards;pointer-events:auto';
  el.textContent=text;
  bar.appendChild(el);
  setTimeout(()=>el.remove(),4500);
  if(!document.getElementById('tmToastCss')){
    const s=document.createElement('style');s.id='tmToastCss';
    s.textContent='@keyframes tmFadeIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}@keyframes tmFadeOut{to{opacity:0;transform:translateY(-8px)}}';
    document.head.appendChild(s);
  }
}

function avaaKortti() {

function suljeKortti() {

function flipKortti() {
  const wrap = document.getElementById('fcWrap');
  if (!wrap) return;
  const flipped = wrap.classList.toggle('fc-flipped');
  const txt = document.getElementById('flipTxt');
  if (txt) txt.textContent = flipped ? 'Etupuoli' : 'Miksi?';
}

// FIFA-kortti v2 — 5D pikakentistä (§26, EI alikokoelmakyselyjä), data-aware OVR + RAE + PHV,
// U14-pelipaikkaportti (§7.1), journey/dream/goal (§7), §7.22-turvallinen (ei lasku/vertailu/XP).
function naytaFcOverlay() {
  const el = document.getElementById('fcOv');
  if (!el) return;
  const p = _pelaaja || {};
  const nyt = new Date();
  const norm5 = t => Math.round(((t - 1) / 4) * 99);
  // Ikä: syntymaVuosi tai joukkueen ikäluokasta (P15/T14)
  let ika = p.syntymaVuosi ? (nyt.getFullYear() - p.syntymaVuosi) : null;
  if (ika == null && p.joukkue) { const m = String(p.joukkue).match(/[PT](\d+)/i); if (m) ika = +m[1]; }
  const phvKasvu = (p.phv_tila === 'PRE' || p.phv_tila === 'LAH');

  // ── 5D ulottuvuudet pikakentistä ──
  const dims = [];
  // D1 FYS ← d1_taso (PHV-tietoinen §28: pre-PHV → kasvaa, ei punaista)
  // §28 OVR-lattia: PRE/LAH-tilassa raaka D1 ei saa vetää OVR:ää neutraalin (50) alle — pre-PHV
  // fyysinen ei rankaise late-developeria. Kortti näyttää yhä 🌱; vain OVR-osuus lattioidaan.
  if (p.d1_taso != null && phvKasvu) dims.push({ key:'FYS', lbl:'Kasvaa', val:null, state:'grow', w:.40, counts:true, ovrVal:Math.max(norm5(p.d1_taso), 50) });
  else if (p.d1_taso != null)        dims.push({ key:'FYS', lbl:'Voima', val:norm5(p.d1_taso), state:'measured', w:.40, counts:true });
  else                                dims.push({ key:'FYS', lbl:'Tulossa', val:null, state:'soon', w:.40, counts:false });
  // D2 TEK ← tki_viimeisin (0–99) || d2_taso
  const d2 = (p.tki_viimeisin != null) ? Math.round(p.tki_viimeisin) : (p.d2_taso != null ? norm5(p.d2_taso) : null);
  dims.push(d2 != null ? { key:'TEK', lbl:'Tekniikka', val:d2, state:'measured', w:.25, counts:true }
                       : { key:'TEK', lbl:'Tulossa', val:null, state:'soon', w:.25, counts:false });
  // D3 PSY ← d3_viimeisin || seura-lukko
  let d3ka = null;
  if (p.d3_viimeisin && p.d3_viimeisin.pisteet) {
    const a = Object.values(p.d3_viimeisin.pisteet).map(x => (x && x.avg != null) ? x.avg : x).filter(x => typeof x === 'number');
    if (a.length) d3ka = a.reduce((s,x)=>s+x,0)/a.length;
  }
  dims.push(d3ka != null ? { key:'PSY', lbl:'Pää', val:norm5(d3ka), state:'measured', w:.15, counts:true }
                         : { key:'PSY', lbl:'Seura avaa', val:null, state:'club', w:.15, counts:false });
  // D4 ÄLY ← adar_viimeisin.yht (0–12); luotettava vasta ≥3 havaintoa
  const ad = p.adar_viimeisin;
  if (ad && ad.yht != null) {
    const v = Math.round((ad.yht / 12) * 99), luot = (p.adar_havaintoja || 0) >= 3;
    dims.push({ key:'ÄLY', lbl: luot ? 'Peliäly' : 'varhainen', val:v, state: luot ? 'measured' : 'early', w:.10, counts:luot });
  } else dims.push({ key:'ÄLY', lbl:'Tulossa', val:null, state:'soon', w:.10, counts:false });
  // D5 SOS ← seura-lukko (ei mittaria)
  dims.push({ key:'SOS', lbl:'Seura avaa', val:null, state:'club', w:.10, counts:false });

  const mitatut = dims.filter(d => d.counts);
  const rakentuu = mitatut.length < 3;

  // ── OVR (data-aware + RAE, §2/§30) ──
  let ovr = null;
  if (!rakentuu) {
    let kk = null;
    if (p.syntymaaika && p.syntymaaika.toDate) kk = p.syntymaaika.toDate().getMonth() + 1;
    else if (p.syntymaaika && p.syntymaaika.seconds) kk = new Date(p.syntymaaika.seconds * 1000).getMonth() + 1;
    const rae = (kk != null) ? [.92,.96,1.02,1.06][Math.ceil(kk/3) - 1] : 1.0;  // vain kk → RAE; muuten 1.0
    let sum = 0, wsum = 0;
    dims.forEach(d => { if (!d.counts) return; const v = (d.ovrVal != null) ? d.ovrVal : d.val; if (v != null) { sum += v * d.w; wsum += d.w; } });
    ovr = wsum ? Math.round(rae * (sum / wsum)) : null;
  }
  const tier = rakentuu ? 'starter' : (mitatut.length >= 5 && ovr >= 75 ? 'elite' : 'sharp');
  const tierNimi = tier === 'elite' ? 'Elite' : tier === 'sharp' ? 'Sharp' : 'Starter';
  const seuraavaTier = tier === 'starter' ? 'Sharp' : tier === 'sharp' ? 'Elite' : 'Mestaruus';

  // ── Pelipaikkaportti (§7.1: U14+ vasta) ──
  const naytaPaikka = (ika != null && ika >= 14 && p.pelipaikka);
  // ── Idoli/unelma ──
  let idoli = 'Bellingham', idolTeema = 'rohkea joka paikassa';
  try { const vt = (window.TM && window.TM.microcycles && window.TM.microcycles.laskeViikkoTeema) ? window.TM.microcycles.laskeViikkoTeema() : null; if (vt && vt.idoliNimi) { idoli = vt.idoliNimi; idolTeema = vt.teema || idolTeema; } } catch(e){}
  // ── Avatar / nimi ──
  const ini = (((p.etunimi||'')[0]||'') + ((p.sukunimi||'')[0]||'')).toUpperCase() || 'TM';
  const nimi = (p.etunimi || 'Pelaaja') + (p.sukunimi ? (' ' + p.sukunimi[0] + '.') : '');
  // ── Oma tavoite (autonomia, localStorage — kevyt) ──
  const goalKey = 'tm_oma_tavoite_' + (p.id || p.pelaajaId || 'x');
  const goal = p.oma_tavoite || localStorage.getItem(goalKey) || '';
  // ── Synttäri ──
  const synttari = (typeof _onkoSynttari === 'function') ? _onkoSynttari(p) : false;
  // ── Traits olemassa olevista signaaleista ──
  const traits = [];
  if (p.tki_merkki) traits.push('🥇 Tekniikkamestari');
  if (p.tekninen_varhaiskehitys) traits.push('⚡ Varhaiskehittäjä');
  if (p.hidden_gem) traits.push('💎 Piilohelmi');
  const streak = (typeof _haeStreak === 'function') ? _haeStreak() : 0;
  if (streak >= 3) traits.push('🔥 ' + streak + ' pv putki');
  // ── Journey-delta (vain positiivinen, §7.22) ──
  let jDelta = '';
  if (p.tki_edellinen != null && p.tki_viimeisin != null) { const dd = Math.round(p.tki_viimeisin - p.tki_edellinen); if (dd > 0) jDelta = '↗ Tekniikka +' + dd; }

  // ── 5D-statti (etupuoli) ──
  const st = d => {
    if (d.state === 'measured') return '<div class="fc-st measured"><div class="sv">' + d.val + '</div><div class="sk">' + d.key + '</div><div class="sd">' + d.lbl + '</div></div>';
    if (d.state === 'grow')     return '<div class="fc-st grow"><div class="sv">🌱</div><div class="sk">' + d.key + '</div><div class="sd">' + d.lbl + '</div></div>';
    if (d.state === 'early')    return '<div class="fc-st early"><div class="sv">' + d.val + '</div><div class="sk">' + d.key + '</div><div class="sd">' + d.lbl + '</div></div>';
    return '<div class="fc-st locked"><div class="sv">🔒</div><div class="sk">' + d.key + '</div><div class="sd">' + d.lbl + '</div></div>';
  };
  // ── 5D-palkki (takapuoli) ──
  const bar = d => {
    if (d.state === 'club') return '<div class="fc-bar"><span class="bk">' + d.key + '</span><div style="grid-column:span 2;font-size:9px;color:var(--ink3)">Seurasi ei ole vielä avannut tätä</div></div>';
    if (d.state === 'soon') return '<div class="fc-bar"><span class="bk">' + d.key + '</span><div style="grid-column:span 2;font-size:9px;color:var(--ink3)">🔒 Tulossa — mittaus avaa</div></div>';
    const v = (d.ovrVal != null) ? d.ovrVal : d.val;
    const lbl = d.state === 'grow' ? '🌱' : v;
    return '<div class="fc-bar"><span class="bk">' + d.key + '</span><div class="bt"><div class="bf" style="width:' + (v||0) + '%"></div></div><span class="bv">' + lbl + '</span></div>';
  };

  const headHtml = rakentuu
    ? '<div class="fc-build">Kortti<br>rakentuu</div><div class="fc-buildsub">' + mitatut.length + '/5 avattu · hieno alku</div>'
    : '<div class="fc-num">' + ovr + '</div><div class="fc-numtag">OVR · ' + mitatut.length + ' osa-aluetta</div>';
  const posHtml = naytaPaikka
    ? '<div class="fc-pill">⚡ ' + p.pelipaikka + '</div>'
    : '<div class="fc-pill">🔥 Monipuolinen</div><div style="font-family:\'DM Sans\';font-size:8px;color:var(--ink3);margin-top:3px;text-align:right">kokeilee kaikkia paikkoja</div>';
  const ikaTxt = (ika != null ? ('U' + ika) : '') + (naytaPaikka ? '' : (ika != null && ika <= 13 ? ' · 8v8' : ''));

  el.innerHTML =
    '<div class="fc-wrap" id="fcWrap">' +
      '<div class="fc-face fc-front tier-' + tier + '">' +
        (synttari ? '<div class="fc-ribbon">Onnea!</div>' : '') +
        '<div class="fc-body">' +
          '<div class="fc-tint"></div><div class="fc-shim"></div>' +
          (synttari ? '<div class="fc-confetti" id="fcConfetti"></div>' : '') +
          '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">' +
            '<div>' + headHtml + '</div>' +
            '<div style="text-align:right">' + posHtml +
              '<div style="font-family:\'DM Sans\';font-size:8.5px;color:var(--ink3);margin-top:4px">' + ((p.seuraId||'').toUpperCase() + (ikaTxt?(' '+ikaTxt):'')) + '</div>' +
              '<div class="fc-tier">⭐ ' + tierNimi + '</div>' +
              '<div class="fc-meta"><span class="fc-flag"></span>FIN' + (ika!=null?(' · '+ika+' v'):'') + '</div>' +
            '</div>' +
          '</div>' +
          '<div style="display:flex;justify-content:center;margin-top:10px"><div class="fc-av">' + ini + '</div></div>' +
          '<div style="text-align:center"><div class="fc-name">' + nimi + '</div>' +
            '<div class="fc-namesub">' + (synttari ? '🎂 Hyvää syntymäpäivää!' : (naytaPaikka ? p.pelipaikka : 'pelaa joka paikassa')) + '</div></div>' +
          '<div class="fc-div"></div>' +
          '<div class="fc-dream"><div class="di">⭐</div><div><div class="dl">Unelma</div><div class="dm">Kuin <b>' + idoli + '</b> — ' + idolTeema + '</div></div></div>' +
          '<div class="fc-s5">' + dims.map(st).join('') + '</div>' +
          '<div class="fc-j"><div class="jt"><span class="jl">Sinun matkasi</span>' + (jDelta?('<span class="jd">'+jDelta+'</span>'):'') + '</div>' +
            '<div class="jp">' +
              '<div class="jn"><span class="jdot">✓</span><span class="jcap">Aloitit<b>' + Math.max(1,mitatut.length) + ' os.</b></span></div>' +
              '<div class="jline" style="background:linear-gradient(90deg,#2A5DB0,var(--cf-main))"></div>' +
              '<div class="jn now"><span class="jdot">★</span><span class="jcap">Tässä nyt<b>' + tierNimi + '</b></span></div>' +
              '<div class="jline" style="background:rgba(243,241,236,.08)"></div>' +
              '<div class="jn"><span class="jdot">🔒</span><span class="jcap">Seuraava<b>' + seuraavaTier + '</b></span></div>' +
            '</div>' +
            '<div class="jfoot">' + (rakentuu ? ('Hieno alku' + (p.etunimi?(', '+p.etunimi):'') + '! Jokainen treeni ja mittaus avaa korttiasi lisää.') : 'Vahvuutesi vie eteenpäin — kortti kirkastuu kun kehityt.') + '</div>' +
          '</div>' +
          '<div class="fc-goal" onclick="_fcAsetaTavoite()"><span style="font-size:13px">🎯</span><div><div class="gl">Minun tavoitteeni</div><div class="gm">' + (goal ? ('"' + goal + '"') : 'Kosketa ja kirjoita oma tavoitteesi') + '</div></div></div>' +
        '</div>' +
      '</div>' +
      '<div class="fc-face fc-back tier-' + tier + '">' +
        '<div style="font-family:\'DM Sans\';font-size:9px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--cf-main)">' + (rakentuu ? 'Miksi tämä kortti?' : ('Miksi ' + ovr + '?')) + '</div>' +
        '<div style="font-family:\'Cormorant Garamond\',serif;font-size:16px;font-style:italic;line-height:1.35;margin:7px 0 12px;color:var(--text)">' + (rakentuu ? 'Korttisi rakentuu mittaus kerrallaan — joka treeni avaa uuden osa-alueen. Tämä on sinun matkasi, ei kilpailu muita vastaan.' : 'Numero kertoo missä olet juuri nyt. Vahvuutesi vievät eteenpäin — kortti kirkastuu kun kehityt.') + '</div>' +

// Oma tavoite — autonomia (§7.5), kevyt localStorage-tallennus, ei pakollinen
function _fcAsetaTavoite() {
  const p = _pelaaja || {};
  const key = 'tm_oma_tavoite_' + (p.id || p.pelaajaId || 'x');
  const nyky = localStorage.getItem(key) || '';
  const uusi = window.prompt('Oma tavoitteesi (esim. "Opin syöttämään molemmilla jaloilla"):', nyky);
  if (uusi != null) { localStorage.setItem(key, uusi.trim()); naytaFcOverlay(); }
}


async function tmFiilinki(arvo, btn) {
  // Visuaalinen palaute
  document.querySelectorAll('#fiiRow button').forEach(b => {
    b.style.background = 'none';
    b.style.borderColor = 'transparent';
  });
  btn.style.background = 'rgba(26,122,94,.1)';
  btn.style.border = '.5px solid rgba(26,122,94,.25)';
  // Tallennetaan Firestoreen — näytä onnistuminen/epäonnistuminen (ei valeonnistumista)
  const ok = await _tmKirjaa('fiilinki', arvo);
  if (ok) {
    _naytaInfoToast('Fiilis tallennettu.');
  } else {
    btn.style.background = 'none'; btn.style.borderColor = 'transparent';   // peru korostus
    _naytaKirjausVirhe('Fiiliksen tallennus ei onnistunut — kirjaudu uudelleen PIN-koodilla.');

}

/* Joukkuetreeni-gate: näyttää kuormituskyselyn kun Kyllä */
function tmJoukkuetreeniGate(kylla) {
  var row = document.getElementById('kuormitusRow');
  var gateRow = document.getElementById('jtGateRow');
  if (!gateRow) return;
  // Korosta valittu nappi
  gateRow.querySelectorAll('button').forEach(function(b,i){
    if ((kylla && i===0) || (!kylla && i===1)) {
      b.style.background = 'rgba(40,176,144,.15)';
      b.style.borderColor = 'rgba(40,176,144,.5)';
    } else {
      b.style.background = i===0 ? 'rgba(40,176,144,.06)' : 'var(--surface)';
      b.style.borderColor = i===0 ? 'rgba(40,176,144,.3)' : 'var(--border2)';
    }
  });
  if (kylla) {
    if (row) row.style.display = 'block';
    _tmKirjaa('joukkuetreeni', true);
  } else {
    if (row) row.style.display = 'none';
    _tmKirjaa('joukkuetreeni', false);
    _tmKirjaa('rpe', null);          // nollaa mahdollinen aiempi kuormitusvalinta
    _naytaInfoToast('OK — ei joukkuetreeniä.');
  }
}

/* Kuormitus-emoji/RPE valinta (joukkuetreenin jälkeen) */
async function tmKuormitus(arvo, btn) {
  var row = document.getElementById('kuormitusRow');
  if (row) row.querySelectorAll('button').forEach(function(b){
    b.style.background = 'none'; b.style.borderColor = 'transparent';
  });
  if (btn) {
    btn.style.background = 'rgba(40,176,144,.1)';
    btn.style.border = '.5px solid rgba(40,176,144,.25)';
  }
  var ok = await _tmKirjaa('rpe', arvo);
  if (ok) {
    _naytaInfoToast('Kuormitus ' + arvo + ' kirjattu.');
  } else {
    if (btn) { btn.style.background = 'none'; btn.style.borderColor = 'transparent'; }
    _naytaKirjausVirhe('Kuormituksen tallennus ei onnistunut.');
  }
}

/* Joukkuetreenin kesto (Showcase) */
function tmJtKesto(val) {
  var mins = parseInt(val, 10) || null;
  _tmKirjaa('kesto_min', mins);
}


/* ══════════════════════════════════════════════════════════
   HARJOITE-INTEGRAATIO
   harjoitelogiikka_v4.js lataa PANKKI-objektin globaaliin
   Käytetään rTIntro():ssä EX[]-taulukon sijaan kun data on saatavilla
══════════════════════════════════════════════════════════ */
function _haeHarjoiteData(ketju) {
  // PANKKI = harjoitelogiikka_v4.js:n päärakenne
  try {
    if (window.PANKKI?.[ketju]?.length) {
      return window.PANKKI[ketju].map(h => ({
        name: h.nimi || h.name || ketju + '-harjoite',
        dur:  h.kesto || 60,
        hint: h.kuvaus || h.ohje || '',
      }));
    }
  } catch(e) {}
  return null;
}

function _paivitaEXHarjoitelogiikasta() {
  // Kutsutaan kun harjoitelogiikka on latautunut
  const heikoin = _heikoinKetju();
  const data = _haeHarjoiteData(heikoin);
  if (data?.length >= 3) {
    // Korvaa EX demo-harjoitteet oikeilla
    EX[0] = data[0];
    EX[1] = data[1] || data[0];
    EX[2] = data[2] || data[0];
    console.log('[v4] Harjoitteet ladattu PANKKI:sta:', heikoin, data.length, 'kpl');
  }
}

/* ═══════════════════════════════════════════════════════════
   70/30 HARJOITELOGIIKKA v5
   70% KOKONAISVALTAINEN (T-harjoite, kiertävä kaikista ketjuista)
   30% KOHDENNETTU (S-harjoite, aina heikoin ketju)
   D = dynaaminen lämmittely ennen kaikkea
   P = progressiivinen lajispesifinen (rakentaja+showcase)
   Invariantti: S kohdentuu AINA heikoimpaan, ei profiiliin
   T-harjoite joka päivä — myös lepopäivinä (Walker 2017)
═══════════════════════════════════════════════════════════ */
function _valitseHarjoite(ketju, tyyppi, stage) {
  const pool = ((window.PANKKI||{})[ketju]||{})[stage] || 
               ((window.PANKKI||{})[ketju]||{})[stage==='showcase'?'rakentaja':'leikkija'] || [];
  const filtered = pool.filter(h => h.tyyppi === tyyppi);
  if (!filtered.length) return null;
  // Deterministinen kierto päivän ja stage-tason mukaan
  const d = new Date();
  const idx = (d.getDate() + d.getDay()) % filtered.length;
  return filtered[idx];
}

function _luoOhjelma(pelaaja) {
  const flei = _laskeFlei(pelaaja);
  const heikoin = _heikoinKetju();  // käyttää globaalia _flei
  const stage = _laskeStage(pelaaja.syntymaVuosi, pelaaja.phv_tila);
  
  // T-ketju kiertää joka päivä kaikista 5 ketjusta (70% = kokonaisvaltainen)
  const tKierros = ['SBL','SFL','LL','DIAG','DFL'];
  const tKetju = tKierros[new Date().getDay() % 5];
  const tHarjoite = _valitseHarjoite(tKetju, 'T', stage);
  
  // S = aina heikoin (30% = kohdennettu)
  const sHarjoite = _valitseHarjoite(heikoin, 'S', stage);
  
  // D = dynaaminen lämmittely (ikäspesifinen)
  const dHarjoitteet = {
    leikkija: {nimi:'Liikeleikki-lämmittely', kuvaus:'5 min vapaata liikettä — pallolla tai ilman'},
    rakentaja:{nimi:'Dynaaminen venyttely', kuvaus:'Jalan heilautukset + lonkan kierto + askelkyykky-kävely'},
    showcase: {nimi:'Hermostollinen aktivointi', kuvaus:'A-skip + B-skip + seinäkiihdytys — 3×15 m'},
  };
  const dHarjoite = dHarjoitteet[stage] || dHarjoitteet['rakentaja'];
  
  return { heikoin, stage, flei, tHarjoite, sHarjoite, dHarjoite, tKetju };
}

// Päivitä EX-array harjoitelogiikasta
function _paivitaEXHarjoitelogiikasta() {
  const p = _pelaaja || {};
  const ohj = _luoOhjelma(p);
  
  const ketjuIko = {SBL:'⚡',SFL:'🦵',LL:'↔️',DIAG:'🔄',DFL:'🏗️'};
  const stageIko = {leikkija:'🟢',rakentaja:'🟡',showcase:'🔴'};
  
  if (ohj.tHarjoite) {
    EX[0] = {
      name: ohj.tHarjoite.nimi,
      dur: (ohj.tHarjoite.kesto || 8) * 6, // minuutit → sekunnit (max 8 min → 480s, näytetään 60s demo)
      ico: 'zap',
      hint: ohj.tHarjoite.kuvaus,
      ketju: ohj.tKetju,
      tyyppi: 'T',
      why: getWhy(ohj.tKetju, 'T', _stage),
    };
  }
  if (ohj.sHarjoite) {
    EX[1] = {
      name: ohj.sHarjoite.nimi,
      dur: (ohj.sHarjoite.kesto || 8) * 6,
      ico: 'target',
      hint: ohj.sHarjoite.kuvaus,
      ketju: ohj.heikoin,
      tyyppi: 'S',
      why: getWhy(ohj.heikoin, 'S', _stage),
    };
  }
  // D = dynaaminen aina ensimmäisenä
  EX[2] = {
    name: ohj.dHarjoite.nimi,
    dur: 60,
    ico: 'fire',
    hint: ohj.dHarjoite.kuvaus,
    tyyppi: 'D',
    why: 'Lämmittely valmistelee hermostoa ja faskiat harjoitukseen.',
  };
  // Järjestys: D → T → S
  EX.sort((a,b) => {const o={D:0,T:1,S:2};return (o[a.tyyppi]||3)-(o[b.tyyppi]||3);});
  console.log('[v5] Ohjelma päivitetty — stage:', ohj.stage, 'heikoin:', ohj.heikoin);
}

let _streak = 0;
let _streakLastDate = null;

/* ══ PERHEKEHU — vanhemman lähettämä kehu pelaajalle ═══════════════ */
async function _haePerhekehu() {
  if (_isDemoUser || !_pelaaja || !window._db) return;
  const db = window._db;
  const seuraId = _pelaaja.seuraId || window._seuraId;
  const uid = _pelaaja.id || _user?.uid;
  if (!seuraId || !uid) return;

  try {
    // Hae viimeisin kehu viimeiseltä 48 tunnilta
    // Yksinkertaistettu query: vain orderBy (ei composite indexiä), suodatus clientissa
    const raja = Date.now() - 48 * 60 * 60 * 1000;
    const snap = await db.collection('seurat').doc(seuraId)
      .collection('pelaajat').doc(uid)
      .collection('kehut')
      .orderBy('luotu', 'desc')
      .limit(10)
      .get();
    // Suodata clientissa: nahty==false ja luotu >= 48h sitten
    const docs = snap.docs.filter(function(d) {
      var data = d.data();
      if (data.nahty !== false) return false;
      var ts = data.luotu && data.luotu.toDate ? data.luotu.toDate().getTime() : 0;
      return ts >= raja;
    });

    if (docs.length > 0) {
      const d = docs[0].data();
      _viimeisinKehu = {
        id: docs[0].id,
        teksti: d.teksti || '❤️',
        lahettaja: d.lahettaja || 'Vanhempi',
        emoji: d.emoji || '❤️',
        aika: d.luotu?.toDate() || new Date(),
      };
      draw(); // Päivitä näkymä kehu-kortin kanssa
    }
  } catch(e) {
    console.warn('[kehut]', e.message);
  }
}

async function _kuittaaKehu() {
  if (!_viimeisinKehu?.id || !_pelaaja || !window._db) return;
  const db = window._db;
  const seuraId = _pelaaja.seuraId || window._seuraId;
  const uid = _pelaaja.id || _user?.uid;
  try {
    await db.collection('seurat').doc(seuraId)
      .collection('pelaajat').doc(uid)
      .collection('kehut').doc(_viimeisinKehu.id)
      .update({ nahty: true, nahtyKlo: firebase.firestore.FieldValue.serverTimestamp() });
    _viimeisinKehu = null;
    draw();
  } catch(e) { console.warn('[kuittaaKehu]', e.message); }
}

/* ══ OSA 2E — streak laskettuna kirjaushistoriasta (ei kenttää Firestoressa, Date.UTC) ══
   kirjaukset: array {pvm:'YYYY-MM-DD'} | {id} | 'YYYY-MM-DD'. Putki taaksepäin tästä päivästä.
   0 jos ei kirjauksia TAI eilinen puuttuu (tänään kesken sallitaan: putki säilyy eiliseen asti). */
function _laskeStreak(kirjaukset) {
  var pvmt = (kirjaukset || []).map(function(k){ return (typeof k === 'string') ? k : (k && (k.pvm || k.id)) || ''; })
                               .filter(function(s){ return /^\d{4}-\d{2}-\d{2}$/.test(s); });
  var setti = {}; pvmt.forEach(function(s){ setti[s] = true; });
  var DAY = 86400000;
  function iso(ms){ var d = new Date(ms); return d.getUTCFullYear() + '-' + String(d.getUTCMonth()+1).padStart(2,'0') + '-' + String(d.getUTCDate()).padStart(2,'0'); }
  var now = new Date();
  var cur = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate());
  if (!setti[iso(cur)]) {                  // ei kirjattu tänään
    if (setti[iso(cur - DAY)]) cur -= DAY; // mutta eilen on → putki elossa, tänään kesken
    else return 0;                         // ei tänään eikä eilen → ei putkea
  }
  var streak = 0;
  while (setti[iso(cur)]) { streak++; cur -= DAY; }
  return streak;
}

/* ══ OSA 2A — kirjausten kokonaismäärä (kompleksisuustasoa varten) ══ */
async function _laskePelaajanKirjaukset(seuraId, pelaajaId) {

}

/* ══ Omatoimi-alustus: yksi haku → streak + kirjausmäärä + kompleksisuustaso (1/2/3) ══ */
async function _alustaOmatoimi() {
  window._kompleksisuusTaso = 1;
  window._kirjauksiaYhteensa = 0;
  if (!_pelaaja || !_pelaaja.id || !window._db) { _streak = 0; return; }
  var seuraId = window._seuraId || _pelaaja.seuraId;
  if (!seuraId) return;
  try {
    var snap = await window._db.collection('seurat').doc(seuraId)
      .collection('pelaajat').doc(_pelaaja.id).collection('kirjaukset')
      .orderBy('paivitetty', 'desc').limit(60).get();
    var ids = snap.docs.map(function(d){ return d.id; });
    _streak = _laskeStreak(ids);
    _streakLastDate = ids.filter(function(s){ return /^\d{4}-\d{2}-\d{2}$/.test(s); }).sort().reverse()[0] || null;
    window._kirjauksiaYhteensa = snap.size;
    window._kompleksisuusTaso = snap.size < 7 ? 1 : snap.size < 14 ? 2 : 3;  // OSA 2: viikko 1 / 2 / 3+
    draw();
  } catch (e) { console.warn('[omatoimi alustus]', e.message); }
}

async function _lataaCStreak() {
  if (!_pelaaja?.id || !window._db) { _streak = 0; return; }
  const seuraId = window._seuraId || _pelaaja?.seuraId;
  if (!seuraId) return;
  try {
    const ref = window._db.collection('seurat').doc(seuraId)
      .collection('pelaajat').doc(_pelaaja.id)
      .collection('kirjaukset')
      .orderBy('paivitetty','desc').limit(30);
    const snap = await ref.get();
    
    // Laske putkessa olevat päivät
    const paivamaarat = snap.docs
      .map(d => d.id) // id = 'YYYY-MM-DD'
      .filter(d => /^\d{4}-\d{2}-\d{2}$/.test(d))
      .sort().reverse();
    
    let streak = 0;
    const today = _paivaIso();
    let expected = today;
    
    for (const pvm of paivamaarat) {
      if (pvm === expected) {
        streak++;
        // seuraava odotettava päivä = edellisenä päivänä
        const d = new Date(expected + 'T12:00:00Z');
        d.setDate(d.getDate() - 1);
        expected = _paivaIso(d);
      } else if (pvm < expected) {
        break; // aukko — putki katkeaa
      }
    }
    _streak = streak;
    _streakLastDate = paivamaarat[0] || null;
    draw(); // päivitä UI
  } catch(e) {
    console.warn('[v5 streak]', e.message);
  }
}

async function _kirjaaStreak() {
  // Suora kutsu vain legacy-poluille — päävirta kulkee _tallennaKirjaus():n kautta
  if (_isDemoUser || !_pelaaja?.id || !window._db) return;
  const pvm = _paivaIso();
  await _tmKirjaa('tehty', true);
  await _tmKirjaa('streak_pvm', pvm);
  _streak = Math.max(_streak, 1);

  // Tarkista X-Factor (streak ≥ 7) ja Gem (3 kuukautta nousevaa FLEI:tä)
  _tarkistaSignaalit();
}

/* ══════════════════════════════════════════════════════════
   PALLOLIITON VIIKKOSEURANTA
   Hakee viimeisten 52 viikon kirjaukset ja laskee viikot
   jolloin kaikki 7 päivää on merkitty. Kirjaustapa ei vaikuta —
   sekä 'heti', 'jalkikateen' että 'auto' kelpaavat viikkoon.
   Tavoite: 20 viikkoa/vuosi (kevyt: 12, deadlinet 2026).
══════════════════════════════════════════════════════════ */
async function laskePalloliittoViikot(pelaajaId) {
  pelaajaId = pelaajaId || _pelaaja?.id;
  if (!pelaajaId || !window._db) return null;
  const sid = window._seuraId || _pelaaja?.seuraId;
  if (!sid) return null;

  // 52 viikkoa = 364 päivää
  const raja = new Date();
  raja.setDate(raja.getDate() - 364);
  const rajaIso = _paivaIso(raja);

  try {
    const snap = await window._db.collection('seurat').doc(sid)
      .collection('pelaajat').doc(pelaajaId)
      .collection('kirjaukset')
      .where(firebase.firestore.FieldPath.documentId(), '>=', rajaIso)
      .get();

    // Set kirjattujen päivien (YYYY-MM-DD)
    const kirjattu = new Set();
    snap.docs.forEach(d => kirjattu.add(d.id));

    // ISO-viikko (Mon-Sun): laske tämän viikon maanantai
    const monday = (d) => {
      const day = d.getDay() || 7;  // Sun=0 → 7
      const m = new Date(d);
      m.setDate(d.getDate() - (day - 1));
      m.setHours(0, 0, 0, 0);
      return m;
    };

    const tama = monday(new Date());
    const tanaan = new Date();
    let hyvaksytyt = 0;

    for (let v = 0; v < 52; v++) {
      const viikkoStart = new Date(tama);
      viikkoStart.setDate(tama.getDate() - v * 7);
      let kaikki = true;
      for (let pv = 0; pv < 7; pv++) {
        const d = new Date(viikkoStart);
        d.setDate(viikkoStart.getDate() + pv);
        if (d > tanaan) break;  // tuleva päivä — älä laske vajaata viikkoa
        if (!kirjattu.has(_paivaIso(d))) { kaikki = false; break; }
      }
      if (kaikki) hyvaksytyt++;
    }

    return {
      hyvaksytyt,
      tavoite: 20,
      kevyt_tavoite: 12,
      deadline_kevyt: '2026-06-30',
      deadline_tavoite: '2026-12-31'
    };
  } catch (e) {
    console.warn('[palloliitto-viikot]', e.message);
    return null;
  }
}
window.laskePalloliittoViikot = laskePalloliittoViikot;

/* ═══════════════════════════════════════════════════════════
   SIGNAALILOGIIKKA v5
   X-Factor: streak ≥ 7 päivää peräkkäin
   Piilohelmi (Gem): FLEI noussut ≥3 pistettä kahdessa viikossa
   PHV: phv_tila='PHV' → kuorma max 60%, ei P-harjoitteita
═══════════════════════════════════════════════════════════ */
function _tarkistaSignaalit() {
  const signaalit = [];
  
  // X-Factor: streak ≥ 7
  if (_streak >= 7) signaalit.push({ tyyppi:'x-factor', teksti:'X-Factor — ${_streak} päivän putki', vari:'#28B090' });
  
  // PHV-varoitus — uusi koodi 'PH' (tm_bioika §30), vanha 'PHV' yhteensopivuus
  if (_pelaaja?.phv_tila === 'PH' || _pelaaja?.phv_tila === 'PHV') {
    signaalit.push({ tyyppi:'phv', teksti:'PHV-kasvupyrähdys — kuorma max 60%', vari:'#D85A5A' });
  }
  
  // Tallenna signaalit pelaajan profiiliin
  if (signaalit.length && _pelaaja?.id) {
    _tmKirjaa('signaali', signaalit[0]?.tyyppi || null);
  }
  
  // Päivitä UI jos näkyvissä
  draw();
  return signaalit;
}

function _signaaliLabel() {
  // Palauta signaalipalikka rA1/rA3:a varten
  const s = _pelaaja?.signaali;
  if (s === 'x-factor') return '<div style="display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;background:rgba(40,176,144,.12);border:.5px solid rgba(40,176,144,.25);font-size:11px;font-weight:600;color:#28B090;margin-bottom:10px">⚡ X-Factor</div>';
  if (s === 'gem')      return '<div style="display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;background:rgba(184,134,11,.12);border:.5px solid rgba(184,134,11,.25);font-size:11px;font-weight:600;color:#B8860B;margin-bottom:10px">💎 Piilohelmi</div>';
  if (s === 'phv')      return '<div style="display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;background:rgba(216,90,90,.12);border:.5px solid rgba(216,90,90,.25);font-size:11px;font-weight:600;color:#D85A5A;margin-bottom:10px">⚠ PHV — kevennä kuormaa</div>';
  if (_streak >= 7)     return '<div style="display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;background:rgba(40,176,144,.12);border:.5px solid rgba(40,176,144,.25);font-size:11px;font-weight:600;color:#28B090;margin-bottom:10px">🔥 ' + _streak + ' pv putki</div>';
  return '';
}

/* ═══════════════════════════════════════════════════════════
   ADAR-NÄYTTÖ v5
   Awareness · Decision · Action · Reading
   Valmentajan kirjaamat pisteet 1–3 näkyy pelaajalle
═══════════════════════════════════════════════════════════ */
function rAdar() {
  // ADAR-pikakenttä (kanoninen adar_viimeisin {a,d,ac,r,yht}); legacy _pelaaja.adar fallback.
  const av = _pelaaja?.adar_viimeisin || _pelaaja?.adar || null;
  const DIM_KEYS = ['a','d','ac','r'];
  // Tyhjätila: ei dataa TAI kaikki dimensiot arvioimatta (Taso 1/2 ennen täyttä kirjausta)
  if (!av || DIM_KEYS.every(k => av[k] == null)) return '<div style="color:var(--ink3);font-size:12px;padding:12px 0">Ei ADAR-arviota vielä — valmentaja kirjaa havaintonsa harjoituksessa.</div>';

  const dims = [
    {key:'a',  lbl:'Awareness', kuvaus:'Skannaat ennen — peliälytietoisuus'},
    {key:'d',  lbl:'Decision',  kuvaus:'Oikea ratkaisu oikeaan aikaan'},
    {key:'ac', lbl:'Action',    kuvaus:'Toteutus paineen alla'},
    {key:'r',  lbl:'Reading',   kuvaus:'Luet pelin kulun'},
  ];

  return '<div style="margin-top:8px">' +
    dims.map(d => {
      const val = av[d.key];
      const arvioitu = (val != null && !isNaN(val));
      // NULL-dimensio (osittainen kirjaus): neutraali — EI punaista "0/3" (§7.22)
      if (!arvioitu) {
        return `<div style="margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px">
          <div style="font-size:11px;font-weight:600;color:var(--ink2)">${d.lbl}</div>
          <div style="font-size:11px;font-family:var(--font-m);color:var(--ink3)">– ei vielä arvioitu</div>
        </div>
        <div style="height:4px;background:var(--border);border-radius:2px;overflow:hidden"></div>
        <div style="font-size:10px;color:var(--ink3);margin-top:3px">${d.kuvaus}</div>
      </div>`;
      }
      // ASTEIKKO 1–3: pct=(val/3)*100; >=3 teal · >=2 amber · else punainen
      const pct = (val/3)*100;
      const c = val >= 3 ? '#28B090' : val >= 2 ? '#E0A653' : '#D85A5A';
      return `<div style="margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px">
          <div style="font-size:11px;font-weight:600;color:var(--ink2)">${d.lbl}</div>
          <div style="font-size:11px;font-family:var(--font-m);color:${c}">${val}/3</div>
        </div>
        <div style="height:4px;background:var(--border);border-radius:2px;overflow:hidden">
          <div style="height:100%;width:${pct}%;background:${c};border-radius:2px;transition:width .4s"></div>
        </div>
        <div style="font-size:10px;color:var(--ink3);margin-top:3px">${d.kuvaus}</div>
      </div>`;
    }).join('') + '</div>';
}

/* ═══════════════════════════════════════════════════════════
   AIKAJANA v5 — kehityshistoria
   Näytetään rA3-näkymässä
═══════════════════════════════════════════════════════════ */
function rAikajana() {
  // Koostetaan demo-historia + Firestore-data myöhemmin
  const tapahtumat = _pelaaja?.aikajana || [
    { kk:'HELMI', txt:'IDP aktivoitu — DIAG-ketju fokukseen.' },
    { kk:'MAALIS', txt:'Kehon valmius nousi 61 % → 68 %. SFL edelleen heikoin.' },
    { kk:'HUHTI', txt:'Streak-ennätys: 14 päivää peräkkäin. X-Factor.' },
  ];
  
  if (!tapahtumat.length) return '<div style="color:var(--ink3);font-size:12px;padding:12px 0">Ei tapahtumia vielä.</div>';
  
  return '<div style="position:relative;padding-left:20px">' +
    '<div style="position:absolute;left:6px;top:8px;bottom:0;width:.5px;background:var(--border2)"></div>' +
    tapahtumat.map(t => `
      <div style="position:relative;margin-bottom:16px">
        <div style="position:absolute;left:-17px;top:4px;width:7px;height:7px;border-radius:50%;background:var(--teal);border:1.5px solid var(--bg)"></div>
        <div style="font-size:9px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);margin-bottom:3px">${t.kk}</div>
        <div style="font-size:12px;color:var(--ink2);line-height:1.5">${t.txt}</div>
      </div>`).join('') + '</div>';
}

draw();
</script>

<div class="fc-ov" id="fcOv"></div>

<script>
// ═══════════════════════════════════════════════════════════════════════
// P6 — VALMENTAJAN HAVAINTO → PELAAJAN NÄKYMÄ
// onSnapshot kuuntelee: seurat/{id}/pelaajat/{id}/havainnot
// Suodatin: tila=='valmis' AND pelaaja_lukenut==false
// Pelaaja näkee narratiivin + oppimisnäkökohdan — ei ADAR-pisteitä
// ═══════════════════════════════════════════════════════════════════════

// Globaali tila — käytetään myös KOTI-renderöinnissä (streak-badge vieressä)
window._havLkm = 0;
window._havData = [];
window._havUnsub = null;

// Apurakenne joka tallentaa pelaajan identiteetin kun se on selvinnyt.
// _kaynnistaAppUI() täyttää tämän, P6-koodi lukee siitä.
window._p7Pelaaja = window._p7Pelaaja || { seuraId: null, pelaajaId: null };

// Käynnistää onSnapshot-kuuntelijan. Kutsutaan _kaynnistaAppUI():sta
// heti kun seuraId ja pelaajaId ovat tiedossa.
function _p6KaynnistakuuntelIja(seuraId, pelaajaId) {
  // Pura vanha kuuntelija ensin (uudelleenkirjautuminen tms.)
  if (window._havUnsub) { window._havUnsub(); window._havUnsub = null; }

  const db = window._db;
  if (!db || !seuraId || !pelaajaId) return;

  // Tallennetaan identiteetti myöhempää käyttöä varten
  window._p7Pelaaja = { seuraId, pelaajaId };

  // Sentry-konteksti — VAIN pseudonyymit (uid=pelaajaId, ei nimeä/emailia)
  if (window.tmSentryContext) window.tmSentryContext({ seuraId: seuraId, uid: pelaajaId, rooli: 'pelaaja' });

  // AJOITUSKORJAUS (2026-06-16): varmista anon-token VALMIS ennen onSnapshot-tilausta.
  // Aiemmin listener käynnistyi heti signInAnonymously jälkeen ennen tokenin propagoitumista
  // → transientti permission-denied → listener kuoli (ei retryä) → havainnot eivät tavoittaneet pelaajaa.
  const auth = window._auth || (window.firebase && firebase.auth ? firebase.auth() : null);
  if (auth && auth.currentUser) {
    auth.currentUser.getIdToken().then(function(){ _p6Tilaa(seuraId, pelaajaId, 0); })
                                 .catch(function(){ _p6Tilaa(seuraId, pelaajaId, 0); });
  } else if (auth) {
    // currentUser ei vielä valmis → odota onAuthStateChanged (bounded ~3 s)
    var valmis = false;
    var unsub = auth.onAuthStateChanged(function(u){
      if (u && !valmis) { valmis = true; if (unsub) unsub();
        u.getIdToken().then(function(){ _p6Tilaa(seuraId, pelaajaId, 0); })
                      .catch(function(){ _p6Tilaa(seuraId, pelaajaId, 0); }); }
    });
    setTimeout(function(){ if (!valmis) { valmis = true; if (unsub) unsub(); _p6Tilaa(seuraId, pelaajaId, 0); } }, 3000);
  } else {
    _p6Tilaa(seuraId, pelaajaId, 0);
  }
}

// P6 onSnapshot-tilaus (eroteltu omaksi funktioksi retryä varten). yritys = retry-laskuri.
function _p6Tilaa(seuraId, pelaajaId, yritys) {
  const db = window._db;
  if (!db) return;
  if (window._havUnsub) { window._havUnsub(); window._havUnsub = null; }   // pura ennen uutta tilausta (retry)

  // reaaliaikainen kuuntelija — reagoi välittömästi kun valmentaja tallentaa
  // Yksinkertaistettu query: vain tila=='valmis' + limit (ei vaadi composite indexiä).
  // pelaaja_lukenut suodatetaan clientissa.
  window._havUnsub = db
    .collection('seurat').doc(seuraId)
    .collection('pelaajat').doc(pelaajaId)
    .collection('havainnot')
    .where('tila', '==', 'valmis')
    .limit(50)
    .onSnapshot(function(snap) {
      var lukemattomat = snap.docs.filter(function(d) {
        return d.data().pelaaja_lukenut === false;
      });
      window._havLkm  = lukemattomat.length;
      window._havData = lukemattomat.map(function(d) {
        return Object.assign({ _id: d.id }, d.data());
      });
      // Päivitä KOTI-näkymän merkki jos se on renderöitynä
      _p6PaivitaMerkki();
      // Värähtely kun uusi havainto saapuu (mobiili, reaaliajassa)
      if (snap.size > 0 && !snap.metadata.fromCache && document.visibilityState === 'visible') {
        if (navigator.vibrate) navigator.vibrate([50, 30, 50]);
      }
    }, function(err) {
      // Oikeusvirhe demo-tilassa tai jos Firestore-säännöt eivät salli — ohitetaan
      console.warn('[P6]', err.code, yritys ? ('(yritys ' + yritys + ')') : '');
      // Bounded retry transientille permission-deniedille (token-ajoitus) — max 3 yritystä, ei loopia
      if (err.code === 'permission-denied' && yritys < 3) {
        if (window._havUnsub) { window._havUnsub(); window._havUnsub = null; }
        setTimeout(function(){ _p6Tilaa(seuraId, pelaajaId, yritys + 1); }, 1500);
      }
    });
}

// Päivittää KOTI-näkymässä olevan havainto-merkin laskurin
function _p6PaivitaMerkki() {
  const el = document.querySelector('.hav-merkki');
  if (!el) return; // KOTI ei ole renderöitynä — ei tee mitään
  if (window._havLkm > 0) {
    el.style.display = 'inline-flex';
    const tekstiNode = el.lastChild;
    if (tekstiNode) tekstiNode.textContent = ' ' + window._havLkm + ' uutta';
  } else {
    el.style.display = 'none';
  }
}

// Avaa overlay jossa pelaaja lukee valmentajan havainnot.
// Pelaaja näkee narratiivin ja oppimisnäkökohdan — ei ADAR-pisteitä (numeroita).
// Tämä on pedagoginen valinta: palaute on tarina, ei arvosana.
function _avaaHavainnot() {
  if (!window._havData.length) return;
  const { seuraId, pelaajaId } = window._p7Pelaaja;

  const kortit = window._havData.map(function(h) {
    const pvm    = h.pvm || h.luotu || '';
    const tekija = h.tekija_nimi || h.valmentajaNimi || 'Valmentaja';
    const narr   = h.narratiivi || h.teksti || '';
    const oppim  = h.oppimisnakokohta || '';

    return '<div class="hav-card" id="hk-' + h._id + '">' +
      '<div class="hav-card-hdr">' +
        '<div class="hav-dot"></div>' +
        '<div class="hav-from">' + tekija + (pvm ? ' · ' + pvm : '') + '</div>' +
        '<div class="hav-badge">UUSI</div>' +
        '<button class="hav-close" onclick="_p6Luetuksi(\'' + h._id + '\',\'' + seuraId + '\',\'' + pelaajaId + '\')">&#215;</button>' +
      '</div>' +
      (narr ? '<div class="hav-narr">' + narr + '</div>' : '') +
      (oppim ? '<div class="hav-oppiminen"><strong>Mitä opit:</strong> ' + oppim + '</div>' : '') +
      '<button class="hav-luettu-btn" onclick="_p6Luetuksi(\'' + h._id + '\',\'' + seuraId + '\',\'' + pelaajaId + '\')">Merkitse luetuksi &#8594;</button>' +
    '</div>';
  }).join('');

  const ov = document.createElement('div');
  ov.className = 'hav-ov';
  ov.id = 'havOv';
  ov.innerHTML =
    '<div class="hav-ov-hdr">' +
      '<div class="hav-ov-title">Valmentajaltasi</div>' +
      '<button class="hav-ov-close" onclick="_suljeHavainnot()">&#215;</button>' +
    '</div>' + kortit;
  document.body.appendChild(ov);
}

// Merkitsee havainnon luetuksi Firestoreen (pelaaja_lukenut: true)
// ja poistaa sen overlaystä animaatiolla.
async function _p6Luetuksi(havId, seuraId, pelaajaId) {
  const db = window._db;
  if (!db) return;
  try {
    await db
      .collection('seurat').doc(seuraId)
      .collection('pelaajat').doc(pelaajaId)
      .collection('havainnot').doc(havId)
      .update({ pelaaja_lukenut: true });
    // Animoi poisto
    const el = document.getElementById('hk-' + havId);
    if (el) {
      el.style.cssText += 'transition:opacity .3s,transform .3s;opacity:0;transform:translateX(20px)';
      setTimeout(function() { el.remove(); }, 320);
    }
    // Sulje overlay automaattisesti kun kaikki on luettu
    setTimeout(function() {
      if (window._havLkm === 0) _suljeHavainnot();
    }, 400);
  } catch(e) {
    console.warn('[P6] luetuksi-virhe:', e.message);
  }
}

// Sulkee havainto-overlayN
function _suljeHavainnot() {
  const ov = document.getElementById('havOv');
  if (ov) ov.remove();
}
</script>
