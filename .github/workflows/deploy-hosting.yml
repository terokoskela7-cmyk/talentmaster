name: Deploy to Firebase Hosting

# Julkaisee mainin Firebase Hostingin LIVE-kanavalle → talentmaster-pilot.web.app +
# talentmaster-pilot.firebaseapp.com. Custom-domain talentmasterid.com liitetään Consolesta
# aliakseksi samaan siteen (V3b) — ei vaadi muutosta tähän workflow'hun.
#
# GitHub Pages JÄÄ RINNALLE fallbackiksi: deploy-pages.yml on koskematon, eikä tämä workflow
# vaikuta siihen millään tavalla. Kaksi originia rinnakkain on tarkoitus, ei ongelma.
#
# Tarjoiltavan joukon rajaa firebase.json:in "ignore" (mm. archive/**, src/**, tests/**) —
# siksi tässä EI ole Pagesin "rm -rf archive" -steppiä. Hosting kunnioittaa ignorea natiivisti;
# Pages ei, mikä on juuri se ero jonka V3a:n served-suljettu-portti vartioi.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Oma ryhmä, erillinen Pagesin "pages"-ryhmästä → workflowit eivät peruuta toisiaan.
# bump-version pushaa mergen jälkeen [skip ci]-commitin, joka EI laukaise tätä → ei
# kaksoisdeployta. cancel-in-progress suojaa nopeilta peräkkäisiltä mergeiltä.
concurrency:
  group: "hosting"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      # QG-2: ?v = sisällön tiiviste ja SW-cachenimet lasketaan tässä (repossa ei käsinumeroita). Sama komento kuin
      # deploy-pages.yml:ssä → sama tiiviste samasta sisällöstä. Epäonnistuminen kaataa deployn: ei julkaisua ilman tiivistettä.
      - name: Versiotiivisteet
        run: node scripts/versiotiiviste.js --kirjoita
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          # HUOM: _HOSTING-päätteinen secret on oma, vain Hostingiin scopattu service account.
          # FIREBASE_SERVICE_ACCOUNT (ilman päätettä) on eri ja laajempi — seed_kartoitukset.yml
          # käyttää sitä. Älä vaihda tätä siihen: pienin tarvittava oikeus, ei jaettua avainta.
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HOSTING }}
          projectId: talentmaster-pilot
          channelId: live

  # QG-3 · savutesti-kanava (.briefit/QG3_SAVUTESTI_VAIHE0.md S2 A): SAMA build myös esikatselukanavalle `savutesti`
  # (talentmaster-pilot--savutesti-<tiiviste>.web.app). Tuotantobackend (Firestore, Functions, Rules, liput) ja täsmälleen sama
  # julkaistu koodi (?v-tiivisteet) — vain host eroaa. Syy: App Check ENFORCE + headless-Chrome saa matalan reCAPTCHA-arvion, ja
  # debug-token toimii koodissa vain *--*.web.app-hosteilla (lib/tm_appcheck.js). Ei ohitusta tuotantohostille.
  # Oma job live-deployn jälkeen: kanavan virhe ei estä tuotantojulkaisua. Kanava deployataan jokaisella ajolla → 30 pv:n
  # vanheneminen siirtyy aina eteenpäin ja URL pysyy samana. URL artefaktiin `savutesti-kanava` (url.txt) → savutesti.yml lukee sen.
  savutesti-kanava:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Versiotiivisteet
        run: node scripts/versiotiiviste.js --kirjoita
      - id: savu
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HOSTING }}
          projectId: talentmaster-pilot
          channelId: savutesti
          expires: 30d
      - name: Kanavan URL artefaktiin
        env:
          KANAVA_URL: ${{ steps.savu.outputs.details_url }}
        run: |
          case "$KANAVA_URL" in
            https://talentmaster-pilot--savutesti-*.web.app*) ;;
            *) echo "::error::Odottamaton kanavan URL: '$KANAVA_URL'"; exit 1 ;;
          esac
          mkdir -p savutesti-kanava
          printf '%s\n' "${KANAVA_URL%/}" > savutesti-kanava/url.txt
          echo "Savutesti-kanava: ${KANAVA_URL%/}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: savutesti-kanava
          path: savutesti-kanava/url.txt
          retention-days: 30
