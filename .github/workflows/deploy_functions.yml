name: Deploy Firebase — Functions + Rules

on:
  workflow_dispatch:
    inputs:
      kohde:
        description: 'Mitä deployataan?'
        required: true
        default: 'kaikki'
        type: choice
        options:
          - kaikki
          - functions
          - rules

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Asenna Firebase CLI
        run: npm install -g firebase-tools

      - name: Asenna Functions-riippuvuudet
        working-directory: functions
        run: npm install

      - name: Kirjoita .env
        working-directory: functions
        run: |
          echo "SENDGRID_API_KEY=${{ secrets.SENDGRID_API_KEY }}" >> .env
          echo "SENDGRID_FROM_EMAIL=${{ secrets.SENDGRID_FROM_EMAIL }}" >> .env
          echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" >> .env

      - name: Tunnistaudu Firebase
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json" >> $GITHUB_ENV

      - name: Deploy kaikki (Functions + Rules)
        if: github.event.inputs.kohde == 'kaikki'
        run: firebase deploy --only functions,firestore:rules --project talentmaster-pilot --force

      - name: Deploy vain Functions
        if: github.event.inputs.kohde == 'functions'
        run: firebase deploy --only functions --project talentmaster-pilot --force

      - name: Deploy vain Rules
        if: github.event.inputs.kohde == 'rules'
        run: firebase deploy --only firestore:rules --project talentmaster-pilot --force

      - name: Siivoa
        if: always()
        run: rm -f /tmp/sa.json
