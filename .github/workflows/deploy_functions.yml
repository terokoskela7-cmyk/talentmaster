name: Deploy Firebase Functions

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - '.github/workflows/deploy_functions.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Asenna Firebase CLI
        run: npm install -g firebase-tools

      - name: Asenna Functions-riippuvuudet
        working-directory: functions
        run: npm install

      # API-avaimet (SENDGRID_API_KEY/OPENAI_API_KEY/ANTHROPIC_API_KEY) MIGRATOITU Secret Manageriin (2026-06-23):
      # ne tulevat ajonaikaiseen enviin runWith({secrets}):n kautta — EI enää .env-injektiota CI:ssä (ei plaintextia).
      # SENDGRID_FROM_EMAIL (ei-salainen) on committattu functions/.env:hen.

      - name: Tunnistaudu Firebase
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json" >> $GITHUB_ENV

      - name: Deploy Functions
        run: firebase deploy --only functions --project talentmaster-pilot --force
