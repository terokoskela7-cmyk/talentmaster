# QG-1b vaihe 0b (kertakäyttöinen, EI mergetä): mittaa test.yml:n chrome-osat-jaon CI:ssä (4 osaa, 52 tiedostoa). Laukeaa vain tämän haaran pushista.
name: QG-1b vaihe 0
on:
  push:
    branches: [qg-1b-vaihe0]
jobs:
  chrome-osat:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        osa: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Chrome-testit (osa ${{ matrix.osa }}/4)
        env:
          TM_CHROME_TESTS: '1'
        run: TM_CHROME_PATH="$(which google-chrome)" npx vitest run $(cat .github/chrome_testit.txt) --shard=${{ matrix.osa }}/4
