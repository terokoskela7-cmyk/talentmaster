name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Vain yksi Pages-deploy kerrallaan. Kun bump-version pushaa toisen commitin
# heti mergen jälkeen, käynnissä oleva merge-commitin deploy peruuntuu →
# ei "Multiple artifacts named github-pages" -törmäystä.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # archive/ EI julkaista Pagesiin (V2 App Check, päätös A). Yhdenmukaistaa
      # firebase.json:in "archive/**"-ignoren kanssa: retired app-versiot eivät ole
      # julkisesti ajettavia eivätkä koske backendiin → App Check -enforce ei riko niitä
      # eikä niihin tarvitse ylläpitää SDK:ta. Poisto kohdistuu VAIN CI:n efemeeriseen
      # checkoutiin — archive/ säilyy versionhallinnassa. Esiehto todennettu: 0 elävää
      # inbound-linkkiä arkistoon (viittaukset ovat arkiston sisäisiä tai docs-proosaa).
      - name: Rajaa archive/ pois julkaisusta
        run: rm -rf archive
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
