name: Deploy Firestore Rules

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tm_admin/firestore.rules
      - firebase.json

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Rules-testit (portti ennen deployta)
        run: npx firebase emulators:exec --only firestore 'npx vitest run tests/rules'
      - name: Autentikoi service accountilla
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SA_KEY }}
      - name: Deploy Firestore Rules
        run: npx firebase deploy --only firestore:rules --project talentmaster-pilot --non-interactive
