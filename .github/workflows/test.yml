name: KPI-yksikkötestit

# Sprint 6 / A2: ajaa KPI-laskennan yksikkötestit (node:test, nolla riippuvuutta)
# jokaisessa pushissa + PR:ssä. Estää KPI-logiikan hiljaiset regressiot ennen mergeä.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Ei riippuvuuksia asennettavana — testit ajetaan node:test:llä suoraan.
      - name: Aja KPI-yksikkötestit
        run: npm test
