# TalentMaster — CI: KPI-yksikkötestit + Firestore Rules -testit
# Ajetaan joka pushilla ja PR:llä. Rules-testit vaativat Java 21 (Firebase Emulator).

name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # KPI-yksikkötestit (nopea, ei emulaattoria)
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  # Firestore Security Rules -testit (vaatii emulaattorin)
  rules-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx firebase emulators:exec --only firestore 'npx vitest run tests/rules'
