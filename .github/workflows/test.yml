# TalentMaster — CI: KPI-yksikkötestit + Firestore Rules -testit
# Ajetaan joka pushilla ja PR:llä. Rules-testit vaativat Java 21 (Firebase Emulator).

name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # KPI-yksikkötestit (nopea, ei emulaattoria)
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  # #60 — ESLint no-undef -portti (defektiluokan vartija, esim. 'sp is not defined' -luokka).
  # VAIHE 1: EI estä mergeä — `lint`-step on continue-on-error (raportoi löydökset CI-lokiin, jobi vihreä).
  # VAIHE 2: poista step-tason continue-on-error kun 5 residuaali-löydöstä triagattu → uudet undefined-viittaukset kaatavat buildin.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: ESLint no-undef (raportoiva, ei estävä — VAIHE 1)
        continue-on-error: true
        run: npm run lint

  # Firestore Security Rules -testit (vaatii emulaattorin)
  rules-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx firebase emulators:exec --only firestore 'npx vitest run tests/rules'
