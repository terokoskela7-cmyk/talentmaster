# TalentMaster — CI: KPI-yksikkötestit + Firestore Rules -testit
# Ajetaan joka pushilla ja PR:llä. Rules-testit vaativat Java 21 (Firebase Emulator).

name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # KPI-yksikkötestit (nopea, ei emulaattoria)
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Chrome-selaintesti (kentta_k0) ajetaan omassa jobissaan (chrome-tests) — se ei kuulu vaadittavaan unit-tests-porttiin (flaky CI:ssä).
      - run: npm test
        env:
          TM_CHROME_TESTS: '0'

  # Functions-testit (functions/test, node --test). Ennen 1.10.2026 ne ajettiin VAIN deploy-functions.yml:n
  # porttina mainissa → #698 rikkoi ne (SA_UID poistettiin) eikä PR:n CI huomannut, deploy pysähtyi.
  # Sama Node 22 ja komennot kuin deploy-portissa.
  functions-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Asenna functions-riippuvuudet
        working-directory: functions
        run: npm ci
      - name: Funktiotestit
        working-directory: functions
        run: npm test

  # Oikean Chrome-selaimen testit (headless). PAKOLLINEN tarkistus (main-suojaus 2.11.2026): chrome-tests.
  # QG-1b: KAIKKI selaintestit (.github/chrome_testit.txt, vartija tests/chrome_testit_ci_vartija.test.js) neljänä rinnakkaisena osana → seinäkello alle 5 min.
  # Ennen QG-1b:tä ajettiin vain 15–17 käsin listattua tiedostoa; loput eivät ajautuneet missään.
  chrome-osat:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        osa: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Chrome-testit (osa ${{ matrix.osa }}/4)
        env:
          TM_CHROME_TESTS: '1'
        run: TM_CHROME_PATH="$(which google-chrome)" npx vitest run $(cat .github/chrome_testit.txt) --shard=${{ matrix.osa }}/4

  # Yksi tarkistus nimellä chrome-tests (pakollisen tarkistuksen nimi ei muutu) — vihreä vain kun kaikki neljä osaa ovat vihreitä.
  chrome-tests:
    runs-on: ubuntu-latest
    needs: chrome-osat
    if: always()
    steps:
      - name: Kaikki osat vihreinä
        run: test "${{ needs.chrome-osat.result }}" = success

  # sv-läpiajo (docs/CODE_BRIEF_I18N_SV_LAPIAJO.md): mittaa, paljonko suomea käyttäjä näkee sv-tilassa.
  # QG-1 · kielivartija: uusi käyttöliittymän suomi sv-tilassa (ui-luokka) KAATAA; data? raportoidaan. Kolme rinnakkaista osaa (≤ 5 min):
  # demo-1 + demo-2 = sovellusten oma demo-data (QG-1b: demo jaettu kahtia, CI:ssä 4 min 6 s → raja 4 min 30 s; jako tools/i18n/sv_lapiajo.mjs DEMO_OSAT)
  # fixtuuri = synteettinen QG FC -seura oikeilla sivuilla (tools/i18n/sv_fixtuuri.mjs, ei verkkoa).
  # Pakollisten tarkistusten nimet säilyvät: sv-lapiajo (demo) = yhteenveto demo-osista, sv-lapiajo (fixtuuri) = matriisin osa.
  # Baseline saa vain pienentyä: vartija omana workflowna (sv-baseline.yml, lukee PR-kuvauksen [baseline]-merkinnän).
  sv-lapiajo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        osa: [demo-1, demo-2, fixtuuri]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: sv-läpiajo (${{ matrix.osa }})
        run: |
          if [ "${{ matrix.osa }}" = "demo-2" ] && [ "${{ github.run_attempt }}" = "1" ]; then echo "TILAPÄINEN TESTIKAATUMINEN (poistetaan)"; exit 1; fi
          export TM_CHROME_PATH="$(which google-chrome)"
          set -o pipefail
          node tools/i18n/sv_lapiajo.mjs --osa=${{ matrix.osa }} --tarkista --kaada --ulos=sv_lapiajo_${{ matrix.osa }}.json | tee sv_lapiajo_${{ matrix.osa }}.log
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: sv-lapiajo-${{ matrix.osa }}
          path: |
            sv_lapiajo_${{ matrix.osa }}.json
            sv_lapiajo_${{ matrix.osa }}.log

  # Pakollinen tarkistus "sv-lapiajo (demo)": vihreä vain kun MOLEMMAT demo-osat ovat vihreitä. Matriisin kokonaistulos sisältää
  # myös fixtuurin, joten demo-osien tulos luetaan Actionsin API:sta (vain demo-1/demo-2), ei needs.result:sta.
  # HUOM (korjaus 9.11.2026): tulos haetaan KAIKILTA ajokerroilta (filter=all) ja kustakin osasta otetaan VIIMEISIN ajokerta.
  # Aiempi lukutapa (vain nykyinen run_attempt) kaatui "Re-run failed jobs" -uusinnassa: jo läpi menneet osat eivät kuulu uuteen
  # ajokertaan, joten lista oli vajaa ("success" eikä "success success"). Tarkistus vaatii silti täsmälleen kaksi tulosta.
  sv-lapiajo-demo:
    name: sv-lapiajo (demo)
    runs-on: ubuntu-latest
    needs: sv-lapiajo
    if: always()
    permissions:
      actions: read
    steps:
      - name: demo-1 ja demo-2 vihreinä
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tulos=$(gh api --paginate "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?filter=all&per_page=100" \
            | jq -rs '[.[].jobs[] | select(.name == "sv-lapiajo (demo-1)" or .name == "sv-lapiajo (demo-2)")]
                      | group_by(.name) | map(max_by(.run_attempt) | .conclusion) | join(" ")')
          echo "demo-osat (viimeisin ajokerta per osa): $tulos"
          test "$tulos" = "success success"

  # #60 — ESLint no-undef -portti (defektiluokan vartija, esim. 'sp is not defined' -luokka).
  # VAIHE 2: ESTÄVÄ — 5 residuaalilöydöstä triagattu+korjattu (0 jäljellä) → uudet undefined-viittaukset kaatavat buildin.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  # Riippuvuuksien haavoittuvuusnäkyvyys (turvallisuushygienia 2026-07-01).
  # EI-BLOKKAAVA aluksi (continue-on-error) — tavoite = näkyvyys high/critical-CVE:ihin, ei portti.
  # Kiristetään estäväksi erikseen kun tunnetut löydökset on triagattu.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: npm audit (high+)
        run: npm audit --audit-level=high
        continue-on-error: true

  # Firestore Security Rules -testit (vaatii emulaattorin)
  rules-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx firebase emulators:exec --only firestore,storage 'npx vitest run tests/rules'
