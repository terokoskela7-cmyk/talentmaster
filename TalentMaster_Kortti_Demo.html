<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TalentMaster Player Card™</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{
  min-height:100vh;background:#060402;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:36px 20px;
  font-family:'DM Sans',sans-serif;
  overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 80% 55% at 50% 38%,
    rgba(140,80,0,.32) 0%,transparent 65%);
}

/* ═══ KORTIN ULKOKUORI — kultainen kehys ═══ */
.card-wrap{
  position:relative;
  animation:rise 1s cubic-bezier(.22,1,.36,1) both;
}
@keyframes rise{
  from{opacity:0;transform:translateY(56px) scale(.9)}
  to  {opacity:1;transform:translateY(0) scale(1)}
}

.card-frame{
  width:300px;
  border-radius:26px;
  padding:3px;
  position:relative;
}

/* Sisäkortti */
.card-body{
  border-radius:24px;
  overflow:hidden;
  position:relative;
  padding:22px 20px 18px;
  display:flex;flex-direction:column;
  min-height:440px;
}

/* Shimmer pyyhkäisy */
.shimmer{
  position:absolute;inset:0;border-radius:24px;z-index:8;
  pointer-events:none;overflow:hidden;
}
.shimmer::after{
  content:'';position:absolute;
  top:0;bottom:0;left:-100%;width:60%;
  background:linear-gradient(105deg,
    transparent 20%,
    rgba(255,230,120,.08) 45%,
    rgba(255,230,120,.16) 50%,
    rgba(255,230,120,.08) 55%,
    transparent 80%
  );
  transform:skewX(-10deg);
  animation:shimmerSlide 5s 1.6s ease-in-out infinite;
}
@keyframes shimmerSlide{
  0%,100%{left:-100%;opacity:0}
  5%{opacity:1}
  40%,100%{left:140%;opacity:0}
}

/* ═══ YLÄRIVI ═══ */
.top-row{
  display:flex;align-items:flex-start;
  justify-content:space-between;
  position:relative;z-index:2;
  margin-bottom:0;
}

/* OVR numero */
.ovr-num{
  font-family:'Barlow Condensed',sans-serif;
  font-size:84px;font-weight:900;line-height:.82;
  letter-spacing:-5px;
  text-shadow:3px 3px 0 rgba(0,0,0,.7);
  animation:popIn 1s .65s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes popIn{
  from{opacity:0;transform:scale(.3) rotate(-10deg)}
  to  {opacity:1;transform:scale(1) rotate(0)}
}
.ovr-tag{
  font-size:9px;font-weight:700;letter-spacing:2.5px;
  text-transform:uppercase;margin-top:3px;margin-left:3px;
  opacity:.45;
}

.top-right{text-align:right}
.pos-text{
  font-family:'Barlow Condensed',sans-serif;
  font-size:24px;font-weight:900;
  letter-spacing:1.5px;line-height:1;
}
.seura-text{font-size:11px;margin-top:3px;opacity:.45;letter-spacing:.4px}
.taso-badge{
  display:inline-flex;align-items:center;gap:4px;
  margin-top:8px;
  border-radius:20px;padding:4px 12px;
  font-size:11px;font-weight:700;letter-spacing:.3px;
}

/* ═══ IKONI ISO ═══ */
.icon-zone{
  flex:1;display:flex;
  align-items:center;justify-content:center;
  position:relative;z-index:2;
  margin:2px 0;
}
.pos-icon{
  font-size:76px;line-height:1;
  animation:iconFloat 4s 1.2s ease-in-out infinite;
}
@keyframes iconFloat{
  0%,100%{transform:translateY(0) scale(1)}
  50%    {transform:translateY(-5px) scale(1.05)}
}

/* ═══ NIMI ═══ */
.player-name{
  text-align:center;
  font-family:'Barlow Condensed',sans-serif;
  font-size:42px;font-weight:900;
  letter-spacing:3.5px;text-transform:uppercase;
  line-height:1;
  text-shadow:2px 2px 0 rgba(0,0,0,.8);
  position:relative;z-index:2;
  animation:slideUp .9s .5s ease both;
}
@keyframes slideUp{
  from{opacity:0;transform:translateY(16px)}
  to  {opacity:1;transform:translateY(0)}
}

/* Viivaerottaja */
.divider{
  height:1px;margin:10px 10px 12px;
  position:relative;z-index:2;
}

/* ═══ STATS ═══ */
.stats-grid{
  display:grid;grid-template-columns:1fr 1fr 1fr;
  gap:5px;margin-bottom:10px;
  position:relative;z-index:2;
}
.stat{
  text-align:center;padding:7px 4px;
  border-radius:10px;
}
.stat-v{
  font-family:'Barlow Condensed',sans-serif;
  font-size:32px;font-weight:900;
  line-height:1;letter-spacing:-1px;
}
.stat-l{
  font-size:8px;font-weight:700;
  letter-spacing:1.2px;text-transform:uppercase;
  margin-top:2px;opacity:.45;
}

/* ═══ PROFIILILINJA ═══ */
.profile-row{
  text-align:center;font-size:10px;font-weight:700;
  letter-spacing:2px;text-transform:uppercase;
  margin-bottom:10px;opacity:.5;
  position:relative;z-index:2;
}

/* ═══ XP ═══ */
.xp-area{position:relative;z-index:2}
.xp-meta{
  display:flex;justify-content:space-between;
  font-size:10px;margin-bottom:5px;opacity:.45;
}
.xp-track{
  height:5px;border-radius:3px;overflow:hidden;
}
.xp-bar{
  height:100%;border-radius:3px;width:0%;
  transition:width 1.5s 2s cubic-bezier(.22,1,.36,1);
  box-shadow:0 0 10px currentColor;
}

/* ═══ BURST ═══ */
.burst{
  position:fixed;inset:0;z-index:50;pointer-events:none;
  background:radial-gradient(ellipse 70% 55% at 50% 40%,
    rgba(255,190,40,.62) 0%,rgba(200,110,0,.2) 35%,transparent 65%);
  opacity:0;animation:bIn 2.2s .8s ease both;
}
@keyframes bIn{0%{opacity:0}12%{opacity:1}100%{opacity:0}}

/* ═══ KONTROLLIT ═══ */
.controls{
  margin-top:28px;
  display:flex;flex-direction:column;gap:10px;
  align-items:center;width:100%;max-width:300px;
}
.ctrl-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.ctrl-lbl{font-size:10px;color:rgba(200,150,40,.4);letter-spacing:1.5px;text-transform:uppercase}
.c-btn{
  background:rgba(255,200,60,.07);
  border:1px solid rgba(255,200,60,.22);
  border-radius:9px;padding:8px 15px;
  color:rgba(255,200,60,.55);
  font-family:'DM Sans',sans-serif;
  font-size:12px;font-weight:600;cursor:pointer;
  transition:all .18s;
}
.c-btn:hover{background:rgba(255,200,60,.16);color:#FFE566;border-color:rgba(255,200,60,.5)}
.c-btn.on{background:rgba(255,200,60,.2);color:#FFE566;border-color:rgba(255,200,60,.55)}
</style>
</head>
<body>

<div class="burst"></div>
<div id="sparksHost" style="position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden"></div>

<div class="card-wrap" id="cardWrap">
  <div class="card-frame" id="cardFrame">
    <div class="card-body" id="cardBody">
      <div class="shimmer"></div>

      <div class="top-row">
        <div>
          <div class="ovr-num" id="ovrNum">77</div>
          <div class="ovr-tag" id="ovrTag">OVR</div>
        </div>
        <div class="top-right">
          <div class="pos-text" id="posText">KHK</div>
          <div class="seura-text" id="seuraText">KPV U13</div>
          <div class="taso-badge" id="tasoBadge">⭐⭐ Sharp</div>
        </div>
      </div>

      <div class="icon-zone">
        <div class="pos-icon" id="posIcon">⚡</div>
      </div>

      <div class="player-name" id="playerName">Mäkinen</div>
      <div class="divider" id="divider"></div>

      <div class="stats-grid" id="statsGrid">
        <div class="stat" id="s0"><div class="stat-v">80</div><div class="stat-l">Nopeus</div></div>
        <div class="stat" id="s1"><div class="stat-v">73</div><div class="stat-l">Tekniikka</div></div>
        <div class="stat" id="s2"><div class="stat-v">67</div><div class="stat-l">Peliäly</div></div>
        <div class="stat" id="s3"><div class="stat-v">84</div><div class="stat-l">Fysiikka</div></div>
        <div class="stat" id="s4"><div class="stat-v">60</div><div class="stat-l">Hallinta</div></div>
        <div class="stat" id="s5"><div class="stat-v">70</div><div class="stat-l">Räjähtävyys</div></div>
      </div>

      <div class="profile-row" id="profileRow">⚡ Nopea · Sharp-taso</div>

      <div class="xp-area">
        <div class="xp-meta" id="xpMeta">
          <span>20 / 100 XP</span><span>seuraavalle tasolle</span>
        </div>
        <div class="xp-track" id="xpTrack">
          <div class="xp-bar" id="xpBar"></div>
        </div>
      </div>

    </div>
  </div>
</div>

<div class="controls">
  <div class="ctrl-lbl">Korttityyppi</div>
  <div class="ctrl-row">
    <button class="c-btn" onclick="setV('starter',this)">⭐ Starter</button>
    <button class="c-btn on" onclick="setV('sharp',this)">⭐⭐ Sharp</button>
    <button class="c-btn" onclick="setV('elite',this)">⭐⭐⭐ Elite</button>
  </div>
  <div class="ctrl-lbl">Pelipaikka</div>
  <div class="ctrl-row">
    <button class="c-btn" onclick="setPos('HYÖ','⚽',this)">⚽ HYÖ</button>
    <button class="c-btn on" onclick="setPos('KHK','⚡',this)">⚡ KHK</button>
    <button class="c-btn" onclick="setPos('KK','⚙️',this)">⚙️ KK</button>
    <button class="c-btn" onclick="setPos('PUO','🛡️',this)">🛡️ PUO</button>
    <button class="c-btn" onclick="setPos('MV','🧤',this)">🧤 MV</button>
  </div>
</div>

<script>
/* ── VARIANTIT ── */
var V = {
  starter: {
    frame:   'linear-gradient(145deg,#7AABFF,#4A7ED9 40%,#1A3A80 70%,#4A7ED9)',
    bodyBg:  'radial-gradient(ellipse 100% 50% at 50% 0%,rgba(100,160,255,.2) 0%,transparent 55%),linear-gradient(175deg,#080F20,#050A16,#030710)',
    bodyBdr: 'inset 0 0 0 1.5px rgba(100,160,255,.25)',
    outerSh: 'drop-shadow(0 0 28px rgba(74,126,217,.58)) drop-shadow(0 0 60px rgba(40,80,200,.28)) drop-shadow(0 22px 50px rgba(0,0,0,.95))',
    main:    '#A0C8FF',
    dim:     'rgba(140,180,255,.45)',
    icon:    'drop-shadow(0 0 18px rgba(74,126,217,.95)) drop-shadow(0 0 36px rgba(74,126,217,.55))',
    xpGrad:  'linear-gradient(90deg,#1A3A80,#4A7ED9,#A0C8FF)',
    xpSh:    'rgba(74,126,217,.7)',
    statBg:  'rgba(80,130,255,.07)',
    statBdr: 'rgba(80,130,255,.14)',
    divBg:   'linear-gradient(90deg,transparent,rgba(100,160,255,.6) 20%,rgba(160,200,255,.9) 50%,rgba(100,160,255,.6) 80%,transparent)',
    taso:    '⭐ Starter',tasoBg:'rgba(80,130,255,.12)',tasoBdr:'rgba(80,130,255,.38)',
    profile: '⚙️ Aloittelija · Starter-taso',
  },
  sharp: {
    frame:   'linear-gradient(145deg,#FFE566,#F5B700 25%,#C88000 55%,#7A4D00 80%,#C88000 90%,#F5B700)',
    bodyBg:  'radial-gradient(ellipse 100% 55% at 50% 0%,rgba(255,180,40,.24) 0%,rgba(180,100,0,.08) 40%,transparent 60%),linear-gradient(175deg,#251200,#160900,#0D0500,#090300)',
    bodyBdr: 'inset 0 0 0 1.5px rgba(255,200,60,.2)',
    outerSh: 'drop-shadow(0 0 32px rgba(245,183,0,.58)) drop-shadow(0 0 70px rgba(200,130,0,.28)) drop-shadow(0 24px 56px rgba(0,0,0,.95))',
    main:    '#FFE566',
    dim:     'rgba(255,200,60,.45)',
    icon:    'drop-shadow(0 0 20px rgba(255,210,60,.95)) drop-shadow(0 0 40px rgba(245,183,0,.58))',
    xpGrad:  'linear-gradient(90deg,rgba(160,90,0,.8),#F5B700,#FFE566)',
    xpSh:    'rgba(255,210,60,.7)',
    statBg:  'rgba(255,180,40,.06)',
    statBdr: 'rgba(255,180,40,.13)',
    divBg:   'linear-gradient(90deg,transparent,rgba(255,200,60,.6) 20%,rgba(255,230,80,.9) 50%,rgba(255,200,60,.6) 80%,transparent)',
    taso:    '⭐⭐ Sharp',tasoBg:'rgba(255,200,60,.10)',tasoBdr:'rgba(255,200,60,.38)',
    profile: '⚡ Nopea · Sharp-taso',
  },
  elite: {
    frame:   'linear-gradient(145deg,#F0F2FF,#C8D0F0 30%,#8890C0 60%,#5060A0 80%,#9090C0 90%,#C8D0F0)',
    bodyBg:  'radial-gradient(ellipse 100% 50% at 50% 0%,rgba(200,210,255,.16) 0%,transparent 55%),linear-gradient(175deg,#10102A,#080818,#050510)',
    bodyBdr: 'inset 0 0 0 1.5px rgba(180,200,255,.2)',
    outerSh: 'drop-shadow(0 0 32px rgba(180,190,255,.58)) drop-shadow(0 0 70px rgba(140,160,240,.28)) drop-shadow(0 24px 56px rgba(0,0,0,.95))',
    main:    '#E8EEFF',
    dim:     'rgba(200,215,255,.45)',
    icon:    'drop-shadow(0 0 18px rgba(200,210,255,.95)) drop-shadow(0 0 36px rgba(160,180,255,.55))',
    xpGrad:  'linear-gradient(90deg,#404080,#8890C0,#E8EEFF)',
    xpSh:    'rgba(180,190,255,.7)',
    statBg:  'rgba(180,200,255,.06)',
    statBdr: 'rgba(180,200,255,.13)',
    divBg:   'linear-gradient(90deg,transparent,rgba(180,200,255,.55) 20%,rgba(220,230,255,.9) 50%,rgba(180,200,255,.55) 80%,transparent)',
    taso:    '⭐⭐⭐ Elite',tasoBg:'rgba(180,200,255,.09)',tasoBdr:'rgba(180,200,255,.38)',
    profile: '✨ Huipputaso · Elite',
  }
};

function applyVariant(key) {
  var v = V[key];
  var wrap = document.getElementById('cardWrap');
  var frame = document.getElementById('cardFrame');
  var body = document.getElementById('cardBody');

  frame.style.background = v.frame;
  wrap.style.filter = v.outerSh;
  body.style.background = v.bodyBg;
  body.style.boxShadow = v.bodyBdr;

  // Värit
  var elems = ['ovrNum','posText','playerName'];
  elems.forEach(function(id){
    document.getElementById(id).style.color = v.main;
  });
  document.getElementById('ovrNum').style.textShadow =
    '0 0 24px '+v.dim+', 0 0 48px '+v.dim+', 3px 3px 0 rgba(0,0,0,.7)';
  document.getElementById('ovrTag').style.color = v.dim;
  document.getElementById('seuraText').style.color = v.dim;
  document.getElementById('posIcon').style.filter = v.icon;
  document.getElementById('playerName').style.textShadow =
    '0 0 18px '+v.dim+', 2px 2px 0 rgba(0,0,0,.8)';

  var badge = document.getElementById('tasoBadge');
  badge.textContent = v.taso;
  badge.style.background = v.tasoBg;
  badge.style.borderColor = v.tasoBdr;
  badge.style.color = v.main;

  document.getElementById('profileRow').textContent = v.profile;
  document.getElementById('profileRow').style.color = v.dim;

  document.getElementById('divider').style.background = v.divBg;

  document.querySelectorAll('.stat').forEach(function(el){
    el.style.background = v.statBg;
    el.style.borderColor = v.statBdr;
    el.querySelector('.stat-v').style.color = v.main;
    el.querySelector('.stat-v').style.textShadow = '0 0 10px '+v.dim;
    el.querySelector('.stat-l').style.color = v.dim;
  });

  var xpBar = document.getElementById('xpBar');
  xpBar.style.background = v.xpGrad;
  xpBar.style.boxShadow = '0 0 10px '+v.xpSh;
  document.querySelectorAll('#xpMeta span').forEach(function(el){el.style.color=v.dim});
  document.getElementById('xpTrack').style.background = 'rgba(255,255,255,.06)';
}

/* ── INIT: Sharp ── */
setTimeout(function(){
  applyVariant('sharp');
  document.getElementById('xpBar').style.width = '20%';
}, 100);

/* ── KIPINÄT ── */
function sparks(){
  var host = document.getElementById('sparksHost');
  var rect = document.getElementById('cardWrap').getBoundingClientRect();
  var cx = rect.left + rect.width/2;
  var cy = rect.top + rect.height*0.38;
  for(var i=0;i<30;i++){
    (function(i){
      setTimeout(function(){
        var el = document.createElement('div');
        var angle = Math.random()*Math.PI*2;
        var r = 60+Math.random()*180;
        var sz = 1.5+Math.random()*3.5;
        el.style.cssText =
          'position:absolute;border-radius:50%;'
          +'left:'+cx+'px;top:'+cy+'px;'
          +'width:'+sz+'px;height:'+sz+'px;'
          +'background:'+(Math.random()>.4?'#FFE566':'#F5B700')+';';
        host.appendChild(el);
        el.animate([
          {opacity:1,transform:'translate(0,0) scale(1)'},
          {opacity:0,transform:'translate('+(Math.cos(angle)*r)+'px,'+(Math.sin(angle)*r)+'px) scale(0)'}
        ],{duration:600+Math.random()*600,easing:'cubic-bezier(.22,1,.36,1)',fill:'both'});
        setTimeout(function(){el.remove()},1400);
      }, i*38);
    })(i);
  }
}
setTimeout(sparks, 820);

/* ── SETTERS ── */
function setV(key, btn){
  document.querySelectorAll('.ctrl-row .c-btn').forEach(function(b){
    if(['⭐ Starter','⭐⭐ Sharp','⭐⭐⭐ Elite'].some(function(t){return b.textContent.includes(t.replace('⭐ ','').replace('⭐⭐ ','').replace('⭐⭐⭐ ',''))}))
      b.classList.remove('on');
  });
  btn.classList.add('on');
  applyVariant(key);
  // XP reset
  var xp = document.getElementById('xpBar');
  xp.style.transition='none'; xp.style.width='0%';
  setTimeout(function(){ xp.style.transition='width 1.5s ease'; xp.style.width='20%'; },50);
  sparks();
}

function setPos(pos, icon, btn){
  document.getElementById('posText').textContent = pos;
  document.getElementById('posIcon').textContent = icon;
  var posButtons = Array.from(document.querySelectorAll('.ctrl-row')).pop().querySelectorAll('.c-btn');
  posButtons.forEach(function(b){b.classList.remove('on')});
  btn.classList.add('on');
}
</script>
<script>
// ── Solo: näytä pelaajan OMA kortti (localStorage tm_solo_profiili, Solo_Profiili kirjoittaa save-hetkellä).
// Johdettu OVR/statsit DETERMINISTISESTI (ikä + pelipaikka + vahvuus/kehityskohde) — EI satunnaislukuja,
// EI vertailua muihin (§7.22): kortti on lapsen oma. Tyhjä data → jätetään demo (standalone-katselu).
(function(){
  function set(id,t){ var e=document.getElementById(id); if(e) e.textContent=t; }
  function start(){
    // Takaisin-linkki (lapsi voi palata muokkaamaan)
    var back=document.createElement("a");
    back.href="TalentMaster_Solo_Profiili.html"; back.textContent="\u2190 Takaisin";
    back.style.cssText="position:fixed;top:14px;left:14px;z-index:300;color:#cdd6e8;background:rgba(0,0,0,.38);padding:8px 14px;border-radius:20px;text-decoration:none;font:600 14px/1 -apple-system,system-ui,sans-serif;backdrop-filter:blur(4px)";
    document.body.appendChild(back);

    var P; try { P=JSON.parse(localStorage.getItem("tm_solo_profiili")||"null"); } catch(e){ P=null; }
    if(!P || !P.nimi) return;   // ei Solo-dataa → demo jää näkyviin
    var nyt=new Date().getFullYear();
    var ika = P.synVuosi ? (nyt - P.synVuosi) : 12;
    var ovr = Math.max(42, Math.min(62, Math.round(42 + (ika-8)*1.5)));
    var keys=["Nopeus","Tekniikka","Peliäly","Fysiikka","Hallinta","Räjähtävyys"];
    var v={}; keys.forEach(function(kk){ v[kk]=ovr; });
    var tilt=({ hyokkaaja:{Nopeus:2,"Räjähtävyys":1}, keskikentta:{Tekniikka:2,"Peliäly":1}, puolustaja:{Fysiikka:2,Hallinta:1}, maalivahti:{Fysiikka:2} })[P.pp]||{};
    Object.keys(tilt).forEach(function(kk){ v[kk]+=tilt[kk]; });
    var SKILL={ sbl:"Nopeus", sfl:"Räjähtävyys", dfl:"Fysiikka", ll:"Hallinta", diag:"Tekniikka" };
    if(P.vahvuus && SKILL[P.vahvuus]) v[SKILL[P.vahvuus]]+=2;
    if(P.ketju && SKILL[P.ketju]) v[SKILL[P.ketju]]-=1;
    keys.forEach(function(kk){ v[kk]=Math.max(40, Math.min(70, v[kk])); });
    var taso=P.kortti_taso||"starter";
    var tasoTxt=({ starter:"\u2B50 Starter", sharp:"\u2B50\u2B50 Sharp", elite:"\u2B50\u2B50\u2B50 Elite" })[taso]||"\u2B50 Starter";
    var posTxt=({ hyokkaaja:"HY\u00d6", keskikentta:"KK", puolustaja:"PUO", maalivahti:"MV" })[P.pp]||"\u2014";
    var posIco=({ hyokkaaja:"\u26BD", keskikentta:"\uD83C\uDFAF", puolustaja:"\uD83D\uDEE1\uFE0F", maalivahti:"\uD83E\uDDE4" })[P.pp]||"\u26A1";
    set("ovrNum", ovr); set("playerName", P.nimi); set("posText", posTxt); set("posIcon", posIco);
    set("seuraText", localStorage.getItem("tm_player_code")||"Solo Player");
    set("tasoBadge", tasoTxt);
    ["s0","s1","s2","s3","s4","s5"].forEach(function(id,i){ var e=document.getElementById(id); if(e){ var sv=e.querySelector(".stat-v"); if(sv) sv.textContent=v[keys[i]]; } });
    set("profileRow", P.nimi + " \u00b7 " + tasoTxt.replace(/^[\u2B50 ]+/,"") + "-taso");
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", start); else start();
})();
</script>
