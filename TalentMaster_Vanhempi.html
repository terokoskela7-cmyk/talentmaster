<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>TalentMaster™ — Vanhemman sivu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:     #0A0A0A;
  --bg2:    #111111;
  --bg3:    #1A1A1A;
  --card:   #1E1E1E;
  --border: rgba(255,255,255,0.07);
  --teal:   #00D4AA;
  --blue:   #4A7ED9;
  --amber:  #FFA502;
  --green:  #2ED573;
  --red:    #FF4757;
  --purple: #A855F7;
  --gold:   #F5B700;
  --ink:    #F0F0F0;
  --ink2:   #AAAAAA;
  --ink3:   #666666;
  --r:      12px;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--ink); font-family:'DM Sans',sans-serif; min-height:100vh; }

/* ── LOGIN ── */
#sLogin {
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  background: radial-gradient(ellipse at 30% 20%, rgba(0,212,170,0.08) 0%, transparent 60%), var(--bg);
}
.login-box { width:100%; max-width:400px; padding:40px 32px; background:var(--bg2); border:1px solid var(--border); border-radius:20px; margin:20px; }
.login-logo { font-family:'Barlow Condensed',sans-serif; font-size:28px; font-weight:900; color:var(--teal); margin-bottom:4px; }
.login-sub { font-size:13px; color:var(--ink3); margin-bottom:24px; }
.login-info { background:rgba(0,212,170,0.08); border:1px solid rgba(0,212,170,0.2); border-radius:8px; padding:12px 14px; font-size:13px; color:var(--ink2); margin-bottom:20px; line-height:1.5; }
.login-label { font-size:11px; font-weight:600; color:var(--ink3); text-transform:uppercase; letter-spacing:.8px; margin-bottom:6px; }
.login-input { width:100%; padding:12px 14px; background:var(--bg3); border:1px solid var(--border); border-radius:8px; color:var(--ink); font-family:'DM Sans',sans-serif; font-size:15px; margin-bottom:16px; transition:border-color .2s; }
.login-input:focus { outline:none; border-color:var(--teal); }
.login-btn { width:100%; padding:14px; background:var(--teal); color:#000; border:none; border-radius:8px; font-family:'DM Sans',sans-serif; font-size:15px; font-weight:700; cursor:pointer; transition:opacity .2s; }
.login-btn:hover { opacity:.9; }
.login-error { font-size:13px; color:var(--red); margin-top:10px; min-height:18px; }

/* ── APP ── */
#sApp { display:none; }

/* Topbar */
.topbar { position:sticky; top:0; z-index:100; background:rgba(10,10,10,0.95); backdrop-filter:blur(12px); border-bottom:1px solid var(--border); display:flex; align-items:center; gap:12px; padding:12px 20px; }
.topbar-logo { font-family:'Barlow Condensed',sans-serif; font-size:20px; font-weight:900; color:var(--teal); }
.topbar-badge { font-size:11px; font-weight:700; padding:2px 8px; border-radius:10px; background:rgba(0,212,170,0.15); color:var(--teal); text-transform:uppercase; letter-spacing:.5px; }
.topbar-spacer { flex:1; }
.topbar-nimi { font-size:13px; font-weight:600; }
.topbar-out { font-size:12px; color:var(--ink3); cursor:pointer; padding:6px 10px; border-radius:6px; border:1px solid var(--border); transition:all .2s; }
.topbar-out:hover { border-color:var(--red); color:var(--red); }

/* Main */
.main { max-width:780px; margin:0 auto; padding:24px 20px 60px; }

/* Banner */
.banner { background:linear-gradient(135deg, rgba(0,212,170,0.06) 0%, rgba(74,126,217,0.04) 100%); border:1px solid rgba(0,212,170,0.15); border-radius:20px; padding:28px; margin-bottom:24px; }
.banner-badge { display:inline-block; font-size:11px; font-weight:700; color:var(--teal); text-transform:uppercase; letter-spacing:1px; margin-bottom:10px; }
.banner h1 { font-family:'Barlow Condensed',sans-serif; font-size:34px; font-weight:700; line-height:1.1; margin-bottom:10px; }
.banner h1 span { color:var(--teal); }
.banner p { font-size:14px; color:var(--ink2); line-height:1.6; }

/* Korttiruudukko */
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px; }
@media(max-width:600px){ .grid2 { grid-template-columns:1fr; } }
.grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin-bottom:16px; }
@media(max-width:600px){ .grid3 { grid-template-columns:1fr; } }

/* Kortit */
.kortti { background:var(--bg2); border:1px solid var(--border); border-radius:var(--r); padding:20px; margin-bottom:16px; }
.kortti-otsikko { font-size:13px; font-weight:700; color:var(--ink3); text-transform:uppercase; letter-spacing:.7px; margin-bottom:14px; }

/* Pelaaja-kortti */
.pelaaja-kortti { display:flex; gap:16px; align-items:flex-start; }
.fifa-mini { background:linear-gradient(155deg, #1a1400, #0d0d00); border:1px solid var(--gold); border-radius:10px; padding:12px 10px; text-align:center; min-width:80px; flex-shrink:0; }
.fifa-mini-num { font-family:'Barlow Condensed',sans-serif; font-size:38px; font-weight:900; color:var(--gold); line-height:1; }
.fifa-mini-label { font-size:8px; color:rgba(245,183,0,.7); font-weight:700; letter-spacing:1px; margin-top:2px; }
.fifa-mini-profiili { font-size:9px; color:var(--gold); font-weight:700; margin-top:4px; text-transform:uppercase; letter-spacing:.5px; }
.pelaaja-info { flex:1; }
.pelaaja-nimi { font-family:'Barlow Condensed',sans-serif; font-size:26px; font-weight:700; line-height:1; margin-bottom:4px; }
.pelaaja-meta { font-size:12px; color:var(--ink3); margin-bottom:10px; }
.pelaaja-kuvaus { font-size:13px; color:var(--ink2); line-height:1.6; }

/* Vahvuudet */
.vahvuus-lista { list-style:none; }
.vahvuus-lista li { padding:7px 0; border-bottom:1px solid var(--border); font-size:13px; color:var(--ink2); display:flex; align-items:center; gap:8px; }
.vahvuus-lista li:last-child { border-bottom:none; }
.kehitys-kohde { margin-top:12px; padding:10px 14px; background:rgba(255,165,2,0.08); border-left:3px solid var(--amber); border-radius:0 6px 6px 0; font-size:13px; color:var(--ink2); line-height:1.5; }
.kehitys-kohde strong { color:var(--amber); }

/* FLEI */
.flei-numero { font-family:'Barlow Condensed',sans-serif; font-size:52px; font-weight:900; line-height:1; }
.flei-taso { font-size:11px; font-weight:700; padding:3px 10px; border-radius:20px; display:inline-block; margin-top:4px; }
.flei-selitys { font-size:13px; color:var(--ink2); line-height:1.6; margin-top:12px; }
.flei-bar-bg { height:8px; background:var(--bg3); border-radius:4px; overflow:hidden; margin:10px 0; }
.flei-bar-fill { height:100%; border-radius:4px; transition:width 1.2s ease; }

/* PHV-banneri */
.phv-info { background:rgba(255,165,2,0.06); border:1px solid rgba(255,165,2,0.2); border-radius:8px; padding:12px 14px; font-size:13px; color:var(--ink2); line-height:1.5; margin-top:12px; }
.phv-info strong { color:var(--amber); }

/* Kotitehtävät */
.tehtava { background:var(--bg3); border-radius:8px; padding:14px; margin-bottom:10px; }
.tehtava-otsikko { font-size:13px; font-weight:700; margin-bottom:6px; display:flex; align-items:center; gap:8px; }
.tehtava-kuvaus { font-size:13px; color:var(--ink2); line-height:1.6; }
.tehtava-aika { font-size:11px; color:var(--ink3); margin-top:6px; }

/* Roolisi tukijana */
.tuki-banneri { background:linear-gradient(135deg, rgba(74,126,217,0.08) 0%, rgba(0,212,170,0.05) 100%); border:1px solid rgba(74,126,217,0.2); border-radius:var(--r); padding:18px; margin-top:16px; }
.tuki-otsikko { font-size:14px; font-weight:700; color:var(--blue); margin-bottom:8px; }
.tuki-teksti { font-size:13px; color:var(--ink2); line-height:1.7; }
.tuki-teksti em { color:var(--ink); font-style:normal; font-weight:600; }

/* Valmentajan havainto */
.havainto-card { background:var(--bg3); border-radius:8px; padding:16px; }
.havainto-meta { font-size:12px; color:var(--ink3); margin-bottom:8px; }
.havainto-lainaus { font-size:14px; color:var(--ink); line-height:1.6; font-style:italic; border-left:3px solid var(--teal); padding-left:12px; margin-bottom:12px; }
.havainto-selitys { font-size:13px; color:var(--ink2); line-height:1.6; }
.havainto-selitys strong { color:var(--ink); font-style:normal; }

/* Kehityskaari */
.kehitys-kaari { display:flex; gap:10px; align-items:center; margin-bottom:12px; }
.kehitys-num { font-family:'Barlow Condensed',sans-serif; font-size:32px; font-weight:900; }
.kehitys-arrow { font-size:20px; color:var(--ink3); }
.kehitys-bar { display:flex; gap:6px; margin-bottom:8px; }
.bar-item { flex:1; }
.bar-label { font-size:11px; color:var(--ink3); margin-bottom:3px; }
.bar-bg { height:6px; background:var(--bg3); border-radius:3px; overflow:hidden; }
.bar-fill { height:100%; border-radius:3px; background:var(--teal); transition:width 1s ease; }

/* Kalenteri */
.kalenteri-item { display:flex; gap:14px; padding:12px 0; border-bottom:1px solid var(--border); align-items:flex-start; }
.kalenteri-item:last-child { border-bottom:none; }
.kalenteri-kk { font-size:11px; font-weight:700; color:var(--teal); text-transform:uppercase; letter-spacing:.5px; min-width:70px; padding-top:2px; }
.kalenteri-nimi { font-size:14px; font-weight:600; margin-bottom:3px; }
.kalenteri-kuvaus { font-size:12px; color:var(--ink2); line-height:1.5; }

/* Koulutusmateriaali */
.koulutus-item { display:flex; align-items:center; gap:12px; padding:12px 14px; background:var(--bg3); border-radius:8px; margin-bottom:8px; cursor:pointer; transition:background .15s; }
.koulutus-item:hover { background:rgba(255,255,255,0.05); }
.koulutus-ikoni { font-size:20px; flex-shrink:0; }
.koulutus-nimi { font-size:13px; font-weight:600; }
.koulutus-kuvaus { font-size:12px; color:var(--ink3); }
.koulutus-nuoli { margin-left:auto; color:var(--ink3); font-size:14px; }

/* Tallennusohje */
.tallennusohje { background:rgba(0,212,170,0.06); border:1px solid rgba(0,212,170,0.15); border-radius:8px; padding:14px; margin-bottom:20px; font-size:13px; color:var(--ink2); line-height:1.6; }
.tallennusohje strong { color:var(--teal); display:block; margin-bottom:4px; }

/* Spinner */
.spinner { width:28px; height:28px; border:3px solid var(--border); border-top-color:var(--teal); border-radius:50%; animation:spin .8s linear infinite; margin:40px auto; }
@keyframes spin { to { transform:rotate(360deg); } }

/* Toast */
#toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(80px); background:var(--teal); color:#000; font-weight:700; font-size:13px; padding:10px 20px; border-radius:20px; transition:transform .3s ease; z-index:1000; pointer-events:none; }
#toast.vis { transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- ── KIRJAUTUMINEN ── -->
<div id="sLogin">
  <div class="login-box">
    <div class="login-logo">TalentMaster™</div>
    <div class="login-sub">Vanhemman sivu</div>
    <div class="login-info" id="loginInfo">
      Kirjaudu sähköpostillasi nähdäksesi lapsesi kehitystiedot.
    </div>
    <div class="login-label">Sähköposti</div>
    <input class="login-input" type="email" id="loginEmail" placeholder="sinä@esimerkki.fi" autocapitalize="none">
    <div class="login-label">Salasana</div>
    <input class="login-input" type="password" id="loginPass" placeholder="••••••••" onkeydown="if(event.key==='Enter')kirjauduSisaan()">
    <button class="login-btn" onclick="kirjauduSisaan()">Kirjaudu sisään</button>
    <div class="login-error" id="loginVirhe"></div>
    <div style="margin-top:14px;text-align:center">
      <span style="font-size:12px;color:var(--ink3);cursor:pointer" onclick="lahetaSalasana()">Unohtuiko salasana? →</span>
    </div>
  </div>
</div>

<!-- ── SISÄLTÖ ── -->
<div id="sApp">
  <div class="topbar">
    <div class="topbar-logo">TM™</div>
    <div class="topbar-badge" id="topbarSeura">—</div>
    <div class="topbar-spacer"></div>
    <div class="topbar-nimi" id="topbarNimi">—</div>
    <div class="topbar-out" onclick="kirjauduUlos()">Kirjaudu ulos</div>
  </div>

  <div class="main" id="mainSisalto">
    <div class="spinner"></div>
  </div>
</div>

<div id="toast"></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey:            "AIzaSyAp471lOIntzP33p9bIW3y4KbeEyBt5kIo",
  authDomain:        "talentmaster-pilot.firebaseapp.com",
  projectId:         "talentmaster-pilot",
  storageBucket:     "talentmaster-pilot.firebasestorage.app",
  messagingSenderId: "872561784446",
  appId:             "1:872561784446:web:05c4c7996dfd46ddd14a2f",
});
var _auth = firebase.auth();
var _db   = firebase.firestore();

var _user = null, _pelaaja = null, _seuraId = null, _pelaajaId = null;
var _kirjautuminenKesken = false;

var _params    = new URLSearchParams(location.search);
var _urlPelId  = _params.get('pelaajaId');
var _urlSeura  = _params.get('seuraId') || 'kpv';
var _urlEtu    = _params.get('etunimi') || '';
var _urlSuku   = _params.get('sukunimi') || '';

// ── Näkymät ──────────────────────────────────────────────────────
function nayta(id) {
  document.getElementById('sLogin').style.display = id === 'sLogin' ? 'flex' : 'none';
  document.getElementById('sApp').style.display   = id === 'sApp'   ? 'block' : 'none';
}

// ── Auth ──────────────────────────────────────────────────────────
_auth.onAuthStateChanged(async function(user) {
  if (_kirjautuminenKesken) return;
  if (!user) {
    _esitaytaLogin();
    nayta('sLogin');
    return;
  }
  _user = user;
  await _lataaData(user);
});

function _esitaytaLogin() {
  var infoEl = document.getElementById('loginInfo');
  var emailEl = document.getElementById('loginEmail');
  if (_urlEtu && infoEl) {
    infoEl.innerHTML = 'Kirjaudu nähdäksesi <strong style="color:var(--teal)">' + _urlEtu + ' ' + _urlSuku + '</strong> kehitystiedot.';
  }
  // Ei esitäytetä sähköpostia — tietoturvasyistä
}

// ── Datan lataus ──────────────────────────────────────────────────
async function _lataaData(user) {
  try {
    var token = await user.getIdTokenResult(true);
    var claims = token.claims || {};
    var isSuperAdmin = claims.super_admin || claims.superAdmin;

    // Tapa 1: URL-parametri + sähköposti täsmää
    if (_urlPelId && _urlSeura) {
      var snap = await _db.collection('seurat').doc(_urlSeura)
        .collection('pelaajat').doc(_urlPelId).get();
      if (snap.exists) {
        var d = snap.data();
        if (isSuperAdmin || (d.huoltajaEmail && d.huoltajaEmail.toLowerCase() === user.email.toLowerCase())) {
          _pelaaja = Object.assign({ id: snap.id }, d);
          _seuraId = _urlSeura; _pelaajaId = _urlPelId;
          _renderSivu();
          return;
        }
      }
    }

    // Tapa 2: Hae huoltajaEmail:lla
    var seurat = ['kpv','fcl','palloiirot','yvies','sjk','grifk'];
    for (var i = 0; i < seurat.length; i++) {
      try {
        var s = await _db.collection('seurat').doc(seurat[i])
          .collection('pelaajat').where('huoltajaEmail','==',user.email).limit(1).get();
        if (!s.empty) {
          _pelaaja = Object.assign({ id: s.docs[0].id }, s.docs[0].data());
          _seuraId = seurat[i]; _pelaajaId = s.docs[0].id;
          _renderSivu();
          return;
        }
      } catch(e2) {}
    }

    // Ei löydy
    nayta('sLogin');
    document.getElementById('loginVirhe').textContent = 'Tiliä ei löydy. Ota yhteyttä seuraan.';
  } catch(e) {
    console.error('[Vanhempi]', e);
    nayta('sLogin');
  }
}

// ── Renderöi sivu ─────────────────────────────────────────────────
async function _renderSivu() {
  nayta('sApp');
  var p = _pelaaja;
  var etunimi = p.etunimi || p.nimi || 'Pelaaja';
  var seuraNimi = (p.seura || _seuraId || '').toUpperCase();

  document.getElementById('topbarSeura').textContent = seuraNimi;
  document.getElementById('topbarNimi').textContent = etunimi + ' ' + (p.sukunimi || '');

  // Hae viimeisin kartoitus
  var kartoitus = null;
  try {
    var kSnap = await _db.collection('seurat').doc(_seuraId)
      .collection('kartoitukset').where('pelaajaId','==',_pelaajaId)
      .orderBy('luotu','desc').limit(1).get();
    if (!kSnap.empty) kartoitus = kSnap.docs[0].data();
  } catch(e) {}

  // Laske OVR ja FLEI
  var yh = (kartoitus && kartoitus.yhteenveto) || {};
  var fleiPct = yh.fleiPisteet && yh.pisteetMaksimi
    ? Math.round(yh.fleiPisteet / yh.pisteetMaksimi * 100) : (p.flei_pct || null);
  var ovr = yh.ovrPct ? Math.round(yh.ovrPct) : (p.ovr || null);
  var phvTila = (kartoitus && kartoitus.phvTila) || p.phv_tila || 'AN';
  var profiili = p.pelaajaProfiili || p.profiili || '';
  var profiiliKuvaus = _profiiliKuvaus(profiili);

  // Ketjupisteet
  var kp = (kartoitus && kartoitus.ketjupisteet) || {};
  var dimPct = {
    nopeus:  _pct(kp.sbl || p.sbl),
    ketteryys: _pct(kp.ll || p.ll),
    tekniikka: _pct(kp.fl || p.fl),
    voima:   _pct(kp.dfl || p.dfl),
    kestävyys: _pct(kp.sfl || p.sfl),
  };

  // Kotitehtävät (placeholder — tulisi Firestoresta)
  var kotitehtavat = p.kotitehtavat || _oletusKotitehtavat(profiili);

  // Valmentajan havainto
  var havainto = null;
  try {
    var hSnap = await _db.collection('seurat').doc(_seuraId)
      .collection('havainnot').where('pelaajaId','==',_pelaajaId)
      .orderBy('luotu','desc').limit(1).get();
    if (!hSnap.empty) havainto = hSnap.docs[0].data();
  } catch(e) {}

  // Seuraavat tapahtumat
  var tapahtumat = [];
  try {
    var tSnap = await _db.collection('seurat').doc(_seuraId)
      .collection('tapahtumat').where('pvm','>',new Date())
      .orderBy('pvm','asc').limit(3).get();
    tapahtumat = tSnap.docs.map(function(d){ return d.data(); });
  } catch(e) {}

  var html = '';

  // ── Tallennusohje (ensimmäisellä kerralla) ──
  var banKey = 'tm_van_welcomed_' + _pelaajaId;
  if (!localStorage.getItem(banKey)) {
    localStorage.setItem(banKey, '1');
    var ua = navigator.userAgent;
    var ohje = /iPad|iPhone|iPod/.test(ua)
      ? '<strong>📱 Tallenna sivu iPhoneen:</strong> Paina Jaa-painiketta → Lisää Koti-näyttöön'
      : /Android/.test(ua)
      ? '<strong>📱 Tallenna sivu Androidiin:</strong> Paina ⋮-valikkoa → Lisää aloitusnäyttöön'
      : '<strong>💻 Tallenna kirjanmerkki:</strong> Paina Ctrl+D tallentaaksesi sivun';
    html += '<div class="tallennusohje">' + ohje + '<br><span style="font-size:12px">Kirjaudu aina sähköpostilla ' + (user ? user.email : '') + ' ja omalla salasanallasi.</span></div>';
  }

  // ── Banneri ──
  html += '<div class="banner">' +
    '<div class="banner-badge">Vanhemman sivu</div>' +
    '<h1>' + etunimi + ' kehittyy <span>' + _kehitysLause(fleiPct) + '</span></h1>' +
    '<p>Tällä sivulla näet yksinkertaisesti, miten ' + etunimi + 'in jalkapalloura etenee — mitä hän harjoittelee, missä hän on hyvä ja miten voit tukea kotona. Ei teknistä jargonaa.</p>' +
    '</div>';

  // ── Pelaaja-kortti + Vahvuudet ──
  html += '<div class="grid2">';

  // Pelaaja-kortti
  html += '<div class="kortti">' +
    '<div class="kortti-otsikko">⚽ ' + etunimi + ' pelaajana</div>' +
    '<div class="pelaaja-kortti">' +
      '<div class="fifa-mini">' +
        '<div class="fifa-mini-num">' + (ovr || '—') + '</div>' +
        '<div class="fifa-mini-label">PISTEET</div>' +
        '<div style="font-size:16px;margin:4px 0">' + _profiiliEmoji(profiili) + '</div>' +
        '<div class="fifa-mini-profiili">' + (profiili || '—') + '</div>' +
      '</div>' +
      '<div class="pelaaja-info">' +
        '<div class="pelaaja-nimi">' + etunimi + ' ' + (p.sukunimi || '') + '</div>' +
        '<div class="pelaaja-meta">' + seuraNimi + ' · ' + (p.joukkueNimi || p.joukkue || '—') + '</div>' +
        '<div class="pelaaja-kuvaus">' + profiiliKuvaus + '</div>' +
      '</div>' +
    '</div>';

  if (dimPct.nopeus || dimPct.tekniikka) {
    html += '<div style="margin-top:14px">' +
      Object.entries(dimPct).filter(function(e){ return e[1] !== null; }).map(function(e) {
        return '<div class="bar-item" style="margin-bottom:6px">' +
          '<div style="display:flex;justify-content:space-between;margin-bottom:3px">' +
            '<span style="font-size:11px;color:var(--ink3)">' + e[0].charAt(0).toUpperCase() + e[0].slice(1) + '</span>' +
            '<span style="font-size:11px;color:var(--ink2)">' + e[1] + '%</span>' +
          '</div>' +
          '<div class="bar-bg"><div class="bar-fill" style="width:0%" data-w="' + e[1] + '%"></div></div>' +
        '</div>';
      }).join('') + '</div>';
  }

  html += '</div>';

  // Vahvuudet
  html += '<div class="kortti">' +
    '<div class="kortti-otsikko">✓ ' + etunimi + 'in vahvuudet</div>' +
    '<ul class="vahvuus-lista">' +
    _vahvuudetHtml(kartoitus, profiili, etunimi) +
    '</ul>';

  if (yh.heikoinKetju) {
    html += '<div class="kehitys-kohde">→ <strong>Harjoittelemme nyt:</strong> ' + _ketjuSelitys(yh.heikoinKetju) + ' — tähän kotitehtävät juuri nyt kohdistuvat.</div>';
  }
  html += '</div>';
  html += '</div>'; // grid2

  // ── FLEI ──
  var fleiVari = fleiPct >= 70 ? 'var(--green)' : fleiPct >= 50 ? 'var(--amber)' : 'var(--red)';
  var fleiTaso = fleiPct >= 70 ? 'HYVÄ TASO' : fleiPct >= 50 ? 'KEHITYSVAIHE' : 'TARVITSEE TUKEA';
  var fleiTasoVari = fleiPct >= 70 ? 'background:rgba(46,213,115,.12);color:var(--green)' :
    fleiPct >= 50 ? 'background:rgba(255,165,2,.12);color:var(--amber)' :
    'background:rgba(255,71,87,.12);color:var(--red)';

  html += '<div class="kortti">' +
    '<div class="kortti-otsikko">💪 ' + etunimi + 'in keho harjoitteluvalmiudessa</div>' +
    '<div style="display:flex;gap:20px;align-items:flex-start">' +
      '<div>' +
        '<div class="flei-numero" style="color:' + fleiVari + '">' + (fleiPct !== null ? fleiPct + '%' : '—') + '</div>' +
        '<span class="flei-taso" style="' + fleiTasoVari + '">' + fleiTaso + '</span>' +
      '</div>' +
      '<div style="flex:1">' +
        '<div class="flei-bar-bg"><div class="flei-bar-fill" id="fleiPalkki" style="width:0%;background:' + fleiVari + '"></div></div>' +
        '<div class="flei-selitys">' + _fleiSelitys(fleiPct, etunimi) + '</div>' +
      '</div>' +
    '</div>' +
    _phvInfo(phvTila, etunimi) +
    '</div>';

  // ── Kotitehtävät ──
  html += '<div class="kortti">' +
    '<div class="kortti-otsikko">🏠 Miten voit auttaa kotona tänään?</div>' +
    '<p style="font-size:13px;color:var(--ink2);margin-bottom:14px;line-height:1.5">' +
    etunimi + 'in valmentaja on antanut tämän viikon kotitehtävän. Harjoitteet kestävät yhteensä noin <strong style="color:var(--ink)">15 minuuttia</strong> — kaikki onnistuu kotipihalla tai olohuoneessa.</p>';

  kotitehtavat.forEach(function(t) {
    html += '<div class="tehtava">' +
      '<div class="tehtava-otsikko"><span>' + t.ikoni + '</span> ' + t.nimi + ' <span style="font-size:11px;color:var(--ink3);font-weight:400">(' + t.aika + ')</span></div>' +
      '<div class="tehtava-kuvaus">' + t.kuvaus + '</div>' +
    '</div>';
  });

  html += '<div class="tuki-banneri">' +
    '<div class="tuki-otsikko">💡 Sinun roolisi tukijana</div>' +
    '<div class="tuki-teksti">Kysy ' + etunimi + 'ilta illalla <em>"miten treeni meni?"</em> tai <em>"pystyitkö parantamaan aikaasi?"</em> — älä kommentoi suorituksia, vaan osoita kiinnostusta. Tutkimusten mukaan tämä yksinkertainen kysymys on yksi tärkeimmistä motivaattoreista nuorille urheilijoille.</div>' +
    '</div>' +
    '</div>';

  // ── Valmentajan havainto ──
  if (havainto && havainto.teksti) {
    html += '<div class="kortti">' +
      '<div class="kortti-otsikko">💬 Valmentajan havainto viime harjoituksesta</div>' +
      '<div class="havainto-card">' +
        '<div class="havainto-meta">' + (havainto.valmentaja || 'Valmentaja') + ' · ' + _pvmStr(havainto.luotu) + '</div>' +
        '<div class="havainto-lainaus">"' + havainto.teksti + '"</div>' +
        (havainto.selitys ? '<div class="havainto-selitys"><strong>Mitä tämä tarkoittaa?</strong><br>' + havainto.selitys + '</div>' : '') +
      '</div>' +
    '</div>';
  }

  // ── Seuraavat tapahtumat ──
  if (tapahtumat.length > 0) {
    html += '<div class="kortti">' +
      '<div class="kortti-otsikko">📅 Mitä seuraavaksi tapahtuu</div>';
    tapahtumat.forEach(function(t) {
      var pvmD = t.pvm ? t.pvm.toDate() : null;
      html += '<div class="kalenteri-item">' +
        '<div class="kalenteri-kk">' + (pvmD ? pvmD.toLocaleDateString('fi', {month:'long',year:'numeric'}) : '—') + '</div>' +
        '<div>' +
          '<div class="kalenteri-nimi">' + (t.nimi || t.tyyppi || '—') + '</div>' +
          '<div class="kalenteri-kuvaus">' + (t.kuvaus || '') + '</div>' +
        '</div>' +
      '</div>';
    });
    html += '</div>';
  }

  // ── Koulutusmateriaali ──
  html += '<div class="kortti">' +
    '<div class="kortti-otsikko">📚 Vanhemman opas</div>' +
    '<p style="font-size:13px;color:var(--ink2);margin-bottom:14px;line-height:1.5">Tutkimuspohjaista tietoa siitä, miten tukea nuorta urheilijaa parhaiten.</p>' +
    _koulutuslistaHtml() +
    '</div>';

  document.getElementById('mainSisalto').innerHTML = html;

  // Animoi palkit
  setTimeout(function() {
    var fb = document.getElementById('fleiPalkki');
    if (fb && fleiPct) fb.style.width = fleiPct + '%';
    document.querySelectorAll('.bar-fill[data-w]').forEach(function(el) {
      el.style.width = el.getAttribute('data-w');
    });
  }, 100);
}

// ── Apufunktiot ───────────────────────────────────────────────────
function _pct(arvo) {
  if (!arvo && arvo !== 0) return null;
  var v = parseFloat(arvo);
  return Math.round(v > 1 ? v : v * 100);
}

function _kehitysLause(flei) {
  if (!flei) return 'hyvässä vauhdissa.';
  if (flei >= 70) return 'hienosti.';
  if (flei >= 50) return 'kovaa töissä.';
  return 'oikeaan suuntaan.';
}

function _profiiliEmoji(p) {
  var e = { Railgun:'⚡', Maestro:'🎭', Shadowstep:'👁️', Titan:'🏗️' };
  return e[p] || '⚽';
}

function _profiiliKuvaus(p) {
  var k = {
    Railgun: 'Nopea, räjähtävä pelaaja jolla on hyvä pelinlukutaito. Pääsee nopeasti liikkeelle ja näkee tilanteet ennen muita.',
    Maestro: 'Teknisesti lahjakas pelaaja joka hallitsee palloa erinomaisesti. Pelaa rauhallisesti paineen alla.',
    Shadowstep: 'Ketterä ja ovela pelaaja. Löytää tilaa sieltä missä muut eivät näe ja toimii nopeasti pienissä tiloissa.',
    Titan: 'Fyysisesti vahva ja kestävä pelaaja. Pitää alueen hallinnassa ja tukee joukkuetta rakenteellisesti.',
  };
  return k[p] || 'Monipuolinen pelaaja joka kehittyy tasaisesti kaikilla osa-alueilla.';
}

function _fleiSelitys(pct, nimi) {
  if (!pct) return nimi + 'in harjoitettavuuskartoitus tehdään pian. Valmentaja ottaa yhteyttä.';
  if (pct >= 70) return nimi + 'in keho on hyvin valmis harjoitteluun. Harjoittelu tuottaa tulosta ja loukkaantumisriski on pieni.';
  if (pct >= 50) return nimi + 'in kehossa on parannettavaa. Valmentaja on antanut kohdennettuja harjoitteita juuri tähän.';
  return 'Harjoittelemme ensin ' + nimi + 'in kehon kuntoon ennen täyttä ohjelmaa. Tämä on täysin normaalia kasvavalla urheilijalla.';
}

function _phvInfo(tila, nimi) {
  if (tila === 'PH' || tila === 'KV') {
    return '<div class="phv-info"><strong>📏 Tiedoksi:</strong> ' + nimi + ' on juuri nyt kasvupyrähdysvaiheessa. Harjoittelukuormaa on pienennetty hieman — tämä on tärkeää loukkaantumisten ehkäisemiseksi. Jos hän tuntee kipuja, se on normaalia. Mainitse valmentajalle.</div>';
  }
  return '<div class="phv-info" style="border-color:rgba(46,213,115,.2);background:rgba(46,213,115,.04)">Hyvä tietää: ' + nimi + ' ei tällä hetkellä ole kasvupyrähdyksessä, joten harjoittelu voi jatkua normaalisti. Jos hän alkaa kasvaa nopeasti, saat siitä tiedon.</div>';
}

function _vahvuudetHtml(k, profiili, nimi) {
  if (!k) return '<li>⚽ ' + nimi + 'in vahvuudet kartoitetaan pian.</li>';
  var kp = k.ketjupisteet || {};
  var KT = {sbl:'⚡ Vauhti','ll':'↔️ Suunnanmuutos',sfl:'🦵 Lähtövoima',dfl:'🏗️ Kehonhallinta',sl:'🔄 Kierto'};
  var arvot = Object.entries(KT).map(function(e) {
    return { key: e[0], label: e[1], arvo: parseFloat(kp[e[0]] || 0) };
  }).filter(function(x){ return x.arvo > 0; }).sort(function(a,b){ return b.arvo - a.arvo; });
  if (arvot.length === 0) return '<li>⚽ ' + nimi + 'in vahvuudet kartoitetaan pian.</li>';
  return arvot.slice(0,3).map(function(v) {
    return '<li>' + v.label + ' — ' + _tasoSana(v.arvo) + '</li>';
  }).join('');
}

function _tasoSana(arvo) {
  if (arvo >= 2.5) return 'erinomainen';
  if (arvo >= 2.0) return 'hyvä';
  if (arvo >= 1.5) return 'kehittyvä';
  return 'harjoitellaan';
}

function _ketjuSelitys(ketju) {
  var k = {
    sbl: 'juoksuvauhti ja liikkuvuus',
    ll:  'suunnanmuutos pallon kanssa',
    sfl: 'lähtönopeus ja räjähtävyys',
    dfl: 'kehonhallinta ja tasapaino',
    sl:  'kiertovoima ja löyntivoima',
    fl:  'pallon käsittely',
  };
  return k[ketju] || ketju;
}

function _oletusKotitehtavat(profiili) {
  return [
    { ikoni:'⚽', nimi:'Pallollinen', aika:'10 min',
      kuvaus:'Kolme merkkiä kotipihalla. Kuljeta palloa niiden välistä mahdollisimman nopeasti — viisi kierrosta, laske aika. Paranna joka kierros.' },
    { ikoni:'💪', nimi:'Kehoa vahvistava', aika:'5 min',
      kuvaus:'Yhden jalan seisonta: seiso yhdellä jalalla 30 sekuntia, sitten vaihda. 3 kertaa kummallakin. Ei välineitä tarvita — toimii olohuoneessa.' },
  ];
}

function _pvmStr(ts) {
  if (!ts) return '—';
  var d = ts.toDate ? ts.toDate() : new Date(ts);
  var diff = Math.floor((Date.now() - d.getTime()) / 86400000);
  if (diff === 0) return 'tänään';
  if (diff === 1) return 'eilen';
  if (diff < 7) return diff + ' päivää sitten';
  return d.toLocaleDateString('fi');
}

function _koulutuslistaHtml() {
  var items = [
    { ikoni:'🧠', nimi:'Miten puhua lapselle urheilusta', kuvaus:'Motivoiva ja turvallinen kommunikaatio', viesti:'Kerro lisää siitä, miten puhua lapselle urheilusta motivoivasti' },
    { ikoni:'😴', nimi:'Uni ja palautuminen', kuvaus:'Miksi uni on tärkein harjoitus', viesti:'Kerro nuoren urheilijan unen ja palautumisen merkityksestä' },
    { ikoni:'🥗', nimi:'Ravinto harjoituspäivinä', kuvaus:'Mitä syödä ennen ja jälkeen treenin', viesti:'Kerro nuoren urheilijan ravitsemuksesta harjoituspäivinä' },
    { ikoni:'📏', nimi:'Kasvupyrähdys ja urheilu', kuvaus:'Mitä tapahtuu ja miten voit tukea', viesti:'Kerro kasvupyrähdyksen vaikutuksesta nuoreen urheilijaan' },
    { ikoni:'🎯', nimi:'Sisäinen motivaatio', kuvaus:'Ilo ennen tuloksia — pitkän tähtäimen kehitys', viesti:'Kerro sisäisen motivaation tärkeydestä nuoressa urheilijassa' },
  ];
  return items.map(function(item) {
    return '<div class="koulutus-item" onclick="sendPrompt(\'' + item.viesti + '\')">' +
      '<span class="koulutus-ikoni">' + item.ikoni + '</span>' +
      '<div><div class="koulutus-nimi">' + item.nimi + '</div><div class="koulutus-kuvaus">' + item.kuvaus + '</div></div>' +
      '<span class="koulutus-nuoli">→</span>' +
    '</div>';
  }).join('');
}

function sendPrompt(teksti) {
  toast('Avaa TalentMaster-chat kysyäksesi tästä aiheesta');
}

// ── Kirjautuminen ─────────────────────────────────────────────────
function kirjauduSisaan() {
  var email = (document.getElementById('loginEmail').value || '').trim();
  var pass  = document.getElementById('loginPass').value || '';
  var virheEl = document.getElementById('loginVirhe');
  if (!email || !pass) { virheEl.textContent = 'Syötä sähköposti ja salasana.'; return; }
  virheEl.textContent = '';
  _kirjautuminenKesken = true;
  _auth.signInWithEmailAndPassword(email, pass)
    .then(function(c) { _kirjautuminenKesken = false; _lataaData(c.user); })
    .catch(function(e) {
      _kirjautuminenKesken = false;
      virheEl.textContent = (e.code === 'auth/wrong-password' || e.code === 'auth/user-not-found')
        ? 'Väärä sähköposti tai salasana.' : 'Virhe: ' + e.message;
    });
}

function kirjauduUlos() {
  _auth.signOut().then(function() {
    _user = null; _pelaaja = null;
    _esitaytaLogin();
    nayta('sLogin');
  });
}

function lahetaSalasana() {
  var email = (document.getElementById('loginEmail').value || '').trim();
  if (!email) { toast('Syötä ensin sähköpostiosoite'); return; }
  _auth.sendPasswordResetEmail(email)
    .then(function() { toast('Salasanalinkki lähetetty: ' + email); })
    .catch(function(e) { toast('Virhe: ' + e.message, false); });
}

// ── Toast ──────────────────────────────────────────────────────────
function toast(msg, ok) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.style.background = ok === false ? 'var(--red)' : 'var(--teal)';
  el.classList.add('vis');
  setTimeout(function() { el.classList.remove('vis'); }, 3200);
}
</script>
