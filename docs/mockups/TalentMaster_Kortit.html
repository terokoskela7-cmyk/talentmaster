<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TalentMaster™ — Keräilykortit</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #06090F;
  --bg2: #0D1220;
  --bg3: #151C2E;
  --gold: #F5B700;
  --silver: #B4C8DC;
  --teal: #3EC9A7;
  --blue: #4A7ED9;
  --ink: #F0F0F0;
  --ink2: #888888;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
  padding: 0 0 60px;
}

/* Header */
.header {
  background: linear-gradient(180deg, rgba(245,183,0,.06) 0%, transparent 100%);
  border-bottom: 1px solid rgba(255,255,255,.06);
  padding: 28px 40px 20px;
  display: flex;
  align-items: flex-end;
  gap: 16px;
  flex-wrap: wrap;
}
.logo {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 32px;
  font-weight: 900;
  color: var(--teal);
}
.logo span { color: var(--gold); }
.header-sub {
  font-size: 13px;
  color: var(--ink2);
  padding-bottom: 4px;
}

/* Legend */
.legend {
  display: flex;
  gap: 16px;
  padding: 12px 40px;
  flex-wrap: wrap;
  border-bottom: 1px solid rgba(255,255,255,.04);
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--ink2);
}
.legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
}

/* Sections */
.section { padding: 28px 40px 0; }
.section-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.section-badge {
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 20px;
  font-family: 'DM Sans', sans-serif;
  font-weight: 600;
  text-transform: none;
  letter-spacing: 0;
}

/* Grid */
.kortit-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 14px;
}

/* Kortit */
.kortti {
  border-radius: 12px;
  overflow: hidden;
  cursor: pointer;
  border: 1px solid rgba(255,255,255,.08);
  background: #080810;
  transition: transform .2s, box-shadow .2s;
  position: relative;
  animation: revealCard .5s ease both;
}
.kortti:hover { transform: translateY(-6px) scale(1.04); }

/* Glow animations */
@keyframes glowGold {
  0%,100%{ box-shadow: 0 0 10px 2px rgba(245,183,0,.4), 0 0 30px 6px rgba(245,183,0,.12); border-color: rgba(245,183,0,.4); }
  50%{ box-shadow: 0 0 20px 5px rgba(245,183,0,.7), 0 0 50px 12px rgba(245,183,0,.25); border-color: rgba(245,183,0,.6); }
}
@keyframes glowSilver {
  0%,100%{ box-shadow: 0 0 10px 2px rgba(180,200,220,.35), 0 0 30px 6px rgba(180,200,220,.1); border-color: rgba(180,200,220,.35); }
  50%{ box-shadow: 0 0 18px 5px rgba(180,200,220,.6), 0 0 45px 12px rgba(180,200,220,.2); border-color: rgba(180,200,220,.5); }
}
@keyframes glowTeal {
  0%,100%{ box-shadow: 0 0 10px 2px rgba(62,201,167,.3), 0 0 25px 5px rgba(62,201,167,.1); border-color: rgba(62,201,167,.3); }
  50%{ box-shadow: 0 0 16px 4px rgba(62,201,167,.55), 0 0 40px 10px rgba(62,201,167,.18); border-color: rgba(62,201,167,.45); }
}
@keyframes glowBlue {
  0%,100%{ box-shadow: 0 0 8px 2px rgba(74,126,217,.3), 0 0 20px 4px rgba(74,126,217,.08); border-color: rgba(74,126,217,.3); }
  50%{ box-shadow: 0 0 14px 4px rgba(74,126,217,.5), 0 0 35px 8px rgba(74,126,217,.15); border-color: rgba(74,126,217,.45); }
}
@keyframes shimmer {
  0%{ transform: translateX(-100%) skewX(-15deg); }
  100%{ transform: translateX(200%) skewX(-15deg); }
}
@keyframes revealCard {
  from { opacity: 0; transform: rotateY(60deg) scale(.9); }
  to   { opacity: 1; transform: rotateY(0deg) scale(1); }
}
@keyframes fadeInScale {
  from { opacity: 0; transform: scale(.88); }
  to   { opacity: 1; transform: scale(1); }
}

.kortti.gold   { animation: glowGold   2.5s ease-in-out infinite, revealCard .5s ease both; }
.kortti.silver { animation: glowSilver 3s   ease-in-out infinite, revealCard .5s ease both; }
.kortti.teal   { animation: glowTeal   2.8s ease-in-out infinite, revealCard .5s ease both; }
.kortti.blue   { animation: glowBlue   3.2s ease-in-out infinite, revealCard .5s ease both; }

.kortti-top {
  padding: 10px 10px 6px;
  position: relative;
  overflow: hidden;
  min-height: 90px;
}
.shimmer {
  position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.07), transparent);
  animation: shimmer 2.5s ease-in-out infinite;
  pointer-events: none;
}
.kortti-ovr {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 30px; font-weight: 900; line-height: 1;
  position: absolute; top: 7px; left: 8px;
}
.kortti-pos {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 12px; font-weight: 700;
  position: absolute; top: 38px; left: 8px; opacity: .7;
}
.kortti-avatar {
  width: 58px; height: 58px; border-radius: 50%;
  margin: 0 auto;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 21px; font-weight: 900;
  border: 2px solid currentColor;
}
.kortti-badge {
  position: absolute; top: 5px; right: 5px;
  font-size: 8px; font-weight: 700; padding: 2px 4px;
  border-radius: 3px; text-transform: uppercase; letter-spacing: .4px;
}
.kortti-nimi {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 14px; font-weight: 700;
  text-align: center; padding: 4px 6px 1px;
  color: #f0f0f0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.kortti-seura {
  font-size: 10px; text-align: center;
  padding-bottom: 5px; color: #777;
}
.kortti-stats {
  display: grid; grid-template-columns: 1fr 1fr 1fr;
  border-top: 1px solid rgba(255,255,255,.06);
  padding: 6px 8px; gap: 2px; background: #040408;
}
.stat { text-align: center; }
.stat-val {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 15px; font-weight: 700; line-height: 1;
}
.stat-lbl {
  font-size: 8px; opacity: .5;
  text-transform: uppercase; letter-spacing: .3px; color: #aaa;
}
.lukittu-overlay {
  position: absolute; inset: 0; border-radius: 12px;
  background: rgba(0,0,0,.78); backdrop-filter: blur(3px);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 4px;
}
.lukittu-icon { font-size: 24px; opacity: .5; }
.lukittu-txt { font-size: 9px; color: #666; text-transform: uppercase; letter-spacing: .5px; }

/* Popup */
.popup-bg {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.88);
  display: flex; align-items: center; justify-content: center;
  z-index: 9999;
  animation: fadeInScale .2s ease;
  padding: 20px;
}
.popup-card {
  width: 300px; border-radius: 18px; overflow: hidden;
  background: #070710;
  position: relative;
}
.popup-card.gold   { box-shadow: 0 0 60px 12px rgba(245,183,0,.45), 0 0 120px 24px rgba(245,183,0,.18); border: 1px solid rgba(245,183,0,.45); }
.popup-card.silver { box-shadow: 0 0 60px 12px rgba(180,200,220,.4), 0 0 120px 24px rgba(180,200,220,.15); border: 1px solid rgba(180,200,220,.4); }
.popup-card.teal   { box-shadow: 0 0 50px 10px rgba(62,201,167,.35), 0 0 100px 20px rgba(62,201,167,.12); border: 1px solid rgba(62,201,167,.35); }
.popup-card.blue   { box-shadow: 0 0 40px 8px rgba(74,126,217,.35), 0 0 90px 18px rgba(74,126,217,.12); border: 1px solid rgba(74,126,217,.35); }
.popup-card.gray   { box-shadow: 0 0 30px 6px rgba(120,120,140,.25); border: 1px solid rgba(255,255,255,.1); }

.popup-top {
  padding: 22px 16px 12px;
  position: relative; overflow: hidden; min-height: 150px;
}
.popup-shimmer {
  position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.05), transparent);
  animation: shimmer 2s ease-in-out infinite; pointer-events: none;
}
.popup-ovr {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 56px; font-weight: 900; line-height: 1;
  position: absolute; top: 14px; left: 16px;
}
.popup-pos {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 20px; font-weight: 700;
  position: absolute; top: 70px; left: 16px; opacity: .65;
}
.popup-avatar {
  width: 96px; height: 96px; border-radius: 50%;
  margin: 0 auto;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 36px; font-weight: 900;
  border: 3px solid currentColor;
}
.popup-badge {
  position: absolute; top: 12px; right: 12px;
  font-size: 10px; font-weight: 700; padding: 3px 7px;
  border-radius: 4px; text-transform: uppercase; letter-spacing: .4px;
}
.popup-nimi {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 24px; font-weight: 900;
  text-align: center; padding: 8px 12px 2px; color: #f0f0f0;
}
.popup-seura { font-size: 12px; text-align: center; padding-bottom: 8px; color: #777; }
.popup-stats {
  display: grid; grid-template-columns: repeat(3,1fr);
  border-top: 1px solid rgba(255,255,255,.07);
  border-bottom: 1px solid rgba(255,255,255,.07);
  padding: 10px 12px; gap: 4px; background: #040408;
}
.popup-stat { text-align: center; }
.popup-stat-val {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 26px; font-weight: 900; line-height: 1;
}
.popup-stat-lbl {
  font-size: 10px; opacity: .45;
  text-transform: uppercase; letter-spacing: .3px; color: #aaa; margin-top: 2px;
}
.popup-desc {
  font-size: 12px; color: #aaa;
  padding: 10px 16px 6px; line-height: 1.65; text-align: center;
}
.popup-avain {
  margin: 6px 12px 10px; padding: 8px 12px;
  border-radius: 8px; background: rgba(255,255,255,.03);
  border: 1px solid rgba(255,255,255,.07);
  font-size: 11px; color: #777; text-align: center;
}
.popup-avain strong { font-size: 12px; display: block; margin-bottom: 2px; }
.popup-unlock-info {
  margin: 6px 12px 10px; padding: 10px 12px;
  border-radius: 8px; text-align: center;
  background: rgba(245,183,0,.05); border: 1px solid rgba(245,183,0,.15);
  font-size: 11px; color: #888;
}
.popup-unlock-info strong { font-size: 13px; color: var(--gold); display: block; margin-bottom: 3px; }
.popup-share {
  display: flex; gap: 8px; padding: 0 12px 14px;
}
.share-btn {
  flex: 1; padding: 9px 0; border-radius: 8px;
  font-size: 12px; font-weight: 600; cursor: pointer;
  border: none; font-family: 'DM Sans', sans-serif;
  transition: opacity .15s;
}
.share-btn:hover { opacity: .85; }
.popup-sulje {
  position: absolute; top: 8px; left: 8px;
  width: 26px; height: 26px; border-radius: 50%;
  background: rgba(255,255,255,.1); border: none;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; cursor: pointer; color: #fff; line-height: 1;
}

/* Paljastusanimaatio */
@keyframes cardRevealBig {
  0%  { transform: rotateY(180deg) scale(.5); opacity: 0; }
  50% { transform: rotateY(-10deg) scale(1.1); opacity: 1; }
  100%{ transform: rotateY(0deg) scale(1); opacity: 1; }
}
.popup-card.reveal { animation: cardRevealBig .6s cubic-bezier(.16,1,.3,1) both; }

/* Responsive */
@media(max-width:600px){
  .section { padding: 20px 16px 0; }
  .header { padding: 20px 16px 14px; }
  .legend { padding: 10px 16px; }
  .kortit-grid { grid-template-columns: repeat(3,1fr); gap: 10px; }
}
</style>
</head>

function korttiHTML(p, delay) {
  const badge = p.badge
    ? `<div class="kortti-badge" style="background:${p.badgeBg};color:${p.badgeColor}">${p.badge}</div>` : '';
  const overlay = p.lukittu
    ? `<div class="lukittu-overlay"><div class="lukittu-icon">🔒</div><div class="lukittu-txt">Lukittu</div></div>` : '';
  return `
    <div class="kortti ${p.glow}" style="animation-delay:${delay}s" onclick="avaaPopup('${p.nimi}')">
      <div class="kortti-top" style="background:${p.topBg}">
        <div class="shimmer"></div>
        ${badge}
        <div class="kortti-ovr" style="color:${p.color}">${p.ovr}</div>
        <div class="kortti-pos" style="color:${p.color}">${p.pos}</div>
        <div class="kortti-avatar" style="color:${p.color}">${p.initials}</div>
      </div>
      <div class="kortti-nimi">${p.nimi}</div>
      <div class="kortti-seura">${p.seura}</div>
      <div class="kortti-stats">
        ${p.stats.map(s=>`
          <div class="stat">
            <div class="stat-val" style="color:${p.color}">${s.v}</div>
            <div class="stat-lbl">${s.l}</div>
          </div>`).join('')}
      </div>
      ${overlay}
    </div>`;
}

// Renderöi kaikki
['huuhkajat','helmarit','veikkausliiga'].forEach(sarja => {
  const el = document.getElementById(sarja);
  if (el) el.innerHTML = KORTIT[sarja].map((p,i) => korttiHTML(p, i*.08)).join('');
});

// Kaikki pelaajat yhdessä listassa popup-hakua varten
function kaikkiPelaajat() {
  return [...KORTIT.huuhkajat, ...KORTIT.helmarit, ...KORTIT.veikkausliiga];
}

function avaaPopup(nimi) {
  const p = kaikkiPelaajat().find(x => x.nimi === nimi);
  if (!p) return;

  const badge = p.badge
    ? `<div class="popup-badge" style="background:${p.badgeBg};color:${p.badgeColor}">${p.badge}</div>` : '';

  const avainHTML = p.lukittu
    ? `<div class="popup-unlock-info">
        <strong>🔒 Lukittu kortti</strong>
        Avautuu kun <em style="color:#ddd">${p.avain}</em> ylittää ${p.raja} pistettä kartoituksessa
       </div>`
    : `<div class="popup-avain" style="border-color:${p.color}22">
        <strong style="color:${p.color}">Avainaominaisuus</strong>${p.avain}
       </div>`;

  const glowClass = p.lukittu ? 'gray' : p.glow;

  document.getElementById('popup-root').innerHTML = `
    <div class="popup-bg" onclick="suljePopup(event)">
      <div class="popup-card ${glowClass} reveal" onclick="event.stopPropagation()">
        <button class="popup-sulje" onclick="suljePopup()">✕</button>
        <div class="popup-top" style="background:${p.topBg}">
          <div class="popup-shimmer"></div>
          ${badge}
          <div class="popup-ovr" style="color:${p.color}">${p.ovr}</div>
          <div class="popup-pos" style="color:${p.color}">${p.pos}</div>
          <div class="popup-avatar" style="color:${p.color}">${p.initials}</div>
        </div>
        <div class="popup-nimi">${p.nimi}</div>
        <div class="popup-seura">${p.seura}</div>
        <div class="popup-stats">
          ${p.stats.map(s=>`
            <div class="popup-stat">
              <div class="popup-stat-val" style="color:${p.color}">${s.v}</div>
              <div class="popup-stat-lbl">${s.l}</div>
            </div>`).join('')}
        </div>
        <div class="popup-desc">${p.desc}</div>
        ${avainHTML}
        ${!p.lukittu ? `
        <div class="popup-share">
          <button class="share-btn" style="background:${p.color};color:#000" onclick="jaaPelaaja('${p.nimi}')">
            Jaa kortti
          </button>
          <button class="share-btn" style="background:rgba(255,255,255,.07);color:#ddd;border:1px solid rgba(255,255,255,.12)" onclick="suljePopup()">
            Sulje
          </button>
        </div>` : `
        <div class="popup-share">
          <button class="share-btn" style="background:rgba(255,255,255,.07);color:#888;border:1px solid rgba(255,255,255,.1);cursor:default">
            🔒 Saavuta ensin kynnysarvo
          </button>
        </div>`}
      </div>
    </div>`;
}

function suljePopup(e) {
  if (!e || e.target.classList.contains('popup-bg')) {
    document.getElementById('popup-root').innerHTML = '';
  }
}

function jaaPelaaja(nimi) {
  const teksti = `Avaan juuri ${nimi} -kortin TalentMaster™ keräilykorteissa! ⚽🏆 #TalentMaster #Huuhkajat #Helmarit`;
  if (navigator.share) {
    navigator.share({ title: 'TalentMaster™ Kortti', text: teksti });
  } else if (navigator.clipboard) {
    navigator.clipboard.writeText(teksti).then(() => alert('Teksti kopioitu! Liitä someen.'));
  }
}

// Paina Esc sulkeaksesi
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.getElementById('popup-root').innerHTML = '';
});
</script>
