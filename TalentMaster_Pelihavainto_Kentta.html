    } catch (e) { /* privaattitila / kiintiö täynnä: kirjaus jatkuu muistissa */ }
  }
  function lataaLuonnos(avain) {
    try {
      var raaka = localStorage.getItem(avain || luonnosAvain());
      if (!raaka) return false;
      var d = JSON.parse(raaka);
      if (!d || !Array.isArray(d.merkinnat)) return false;
      S.merkinnat = d.merkinnat;
      S.seq = d.seq || d.merkinnat.reduce(function (a, m) { return Math.max(a, m.id || 0); }, 0);
      S.seisoo = d.seisoo || S.seisoo;
      S.puoliaika = d.puoliaika || S.puoliaika;
      S.otteluAvain = d.otteluAvain || S.otteluAvain;
      S.pelimuoto = d.pelimuoto || S.pelimuoto;
      S.vastustaja = d.vastustaja || '';
      S.kalenteriId = d.kalenteriId || null;
      S.alkoi = d.alkoi || Date.now();
      S.alkoi2 = d.alkoi2 || null;
      if (d.pelipaikka != null) asetaPohja(d.pelipaikka);
      if (Array.isArray(d.kirjattavat)) {
        K = {};
        d.kirjattavat.forEach(function (x) { K[x] = true; });
      }
      return true;
    } catch (e) { return false; }
  }
  function poistaLuonnos() {
    try { localStorage.removeItem(luonnosAvain()); } catch (e) { /* ei kriittinen */ }
  }
  window._phLuonnosApi = { tallenna: tallennaLuonnos, lataa: lataaLuonnos, poista: poistaLuonnos, avain: luonnosAvain };

  /* ── TALLENNUS FIRESTOREEN ─────────────────────────────────────────
     Dokumentti-id on IDEMPOTENTTI: {pvm}_{puoliaika}_{valmentajaUid}. Sama puoliaika
     tallennetaan samaan dokumenttiin, joten verkkokatkon jälkeen uudelleentallennus päivittää
     eikä kahdenna. Rules sallii päivityksen vain dokumentin omalle kirjoittajalle.

     KIELLETYT KENTÄT (§5.6): `pisteet` kääntäisi Masterin ADAR-pikakenttälaskennan lukemaan
     tämän ADAR-pisteinä, ja `narratiivi`/`teksti`/`oppimisnakokohta` päätyisi Pelaaja_v7:n
     näkymään lapselle. Niitä ei kirjoiteta, ja Rules torjuu ne myös palvelinpuolella. */
  /* Id = OTTELU + valmentaja. Puoliaika ei ole osa identiteettiä (ks. otteluAvainNyt).
     Valmentaja on mukana, jotta kaksi tarkkailijaa samasta ottelusta eivät törmää — ja koska
     Rules sallii päivityksen vain dokumentin omalle kirjoittajalle. */
  function tarkkailuId() {
    /* uid EI saa muuntua: Rules vaatii id:n paattyvan RAAKAAN request.auth.uid:hen (v3.20 id-lukko),
       joten siivottu uid katkaisisi luonnin. Firebase-uid on joka tapauksessa aakkosnumeerinen.
       otteluAvain on siivottu jo syntyessaan. */
    return S.otteluAvain + '_' + String(S.uid || 'tuntematon');
  }
  /* SYVA PUHDISTUS: yksikin undefined missa tahansa kentassa hylkaa koko set()-kutsun.
     Tama on VARAKAISTA — kirjoituskohdat eivat saa tuottaa undefinedia, mutta yksi unohdus
     ei saa kaataa kokonaisen ottelun tallennusta. Sentinel (serverTimestamp) lisataan VASTA
     puhdistuksen jalkeen, koska se on olio jota ei saa purkaa. */
  function phPuhdista(v) {
    if (Array.isArray(v)) return v.map(phPuhdista).filter(function (x) { return x !== undefined; });
    if (v && typeof v === 'object' && Object.getPrototypeOf(v) === Object.prototype) {
      var out = {};
      Object.keys(v).forEach(function (k) {
        var p2 = phPuhdista(v[k]);
        if (p2 !== undefined) out[k] = p2;
      });
      return out;
    }
    return v;
  }
  window._phPuhdista = phPuhdista;

  function tarkkailuPayload() {
    var d = dokumentti();
    return phPuhdista({
      tyyppi: 'kenttatarkkailu',
      palloId: (S.pelaaja && (S.pelaaja.tunniste || S.pelaaja.palloID)) || null,
      pelaajaId: S.pelaajaId, seuraId: S.seuraId, valmentajaUid: S.uid,
      tila: 'valmis',
      /* pvm on ALOITUSpäivä paikallisena — ei tallennushetki eikä UTC. */
      ottelu: Object.assign({ pvm: paikallinenPvm(S.alkoi), otteluAvain: S.otteluAvain }, d.ottelu),
      puoliajat: puoliajatMerkinnoista(d.merkinnat),
      suunta: { hyokkaysOikealle: S.puoliaika !== 2, seisoo: S.seisoo },
      ikataso: S.ikataso,
      pelipaikka: S.pelipaikka || null,
      kirjattavat: d.kirjattavat,
      jaksofokus: S.jaksofokus || null,
      malli: { xt: xtMalliId(), xg: PH.PH_XG_OLETUS || null, boksi: PH.PH_BOKSI_OLETUS || null },
      /* Array ei kestä serverTimestamp():ia (§7.6) — aika on sekunteina ottelun alusta. */
      merkinnat: d.merkinnat,
      lahde: 'live',                 // videolta tehty kirjaus merkitään myöhemmin 'video'
      paivitetty: new Date().toISOString(),
    });
  }
  function xtMalliId() {
    try {
      var XT = window.TM_XT;
      var prof = XT && XT.xtProfiili ? XT.xtProfiili(S.pelimuoto) : null;
      return (prof && prof.malli) || null;
    } catch (e) { return null; }
  }
  window._phTarkkailuPayload = tarkkailuPayload;
  window._phTarkkailuId = tarkkailuId;

  /* LUONNOS POISTETAAN VAIN LOPETUKSESSA (`opts.lopullinen`). Välitallennus — "Tallenna"-nappi ja
     puoliajan vaihto — synkkaa pilveen mutta JÄTTÄÄ luonnoksen laitteelle: kesken ottelun tehty
     onnistunut synkka ei saa viedä mahdollisuutta jatkaa, jos välilehti latautuu uudelleen, akku
     loppuu tai selain tappaa taustavälilehden. Ilman tätä 2. puoliaika alkoi tyhjästä uudella
     otteluAvaimella, koska luonnos oli juuri pyyhitty. Sama otteluAvain → sama dokumentti
     (tarkkailuId), joten jatkaminen päivittää eikä kahdenna. */
  async function tallennaFirestoreen(opts) {
    var btn = q('btnTallenna');
    if (btn) btn.disabled = true;
    try {
      var cu = _auth.currentUser;
      if (cu) await cu.getIdToken(true);                       // §7.2 tuore token ennen kirjoitusta
      var ref = _db.collection('seurat').doc(S.seuraId).collection('pelaajat').doc(S.pelaajaId)
        .collection('kenttatarkkailut').doc(tarkkailuId());
      var data = tarkkailuPayload();
      /* `luotu` VAIN luonnissa (A5 + Rules-vartija): uudelleentallennus ei saa nollata
         alkuperäistä aikaleimaa. */
      var snap = await ref.get();
      if (!snap.exists) data.luotu = firebase.firestore.FieldValue.serverTimestamp();
      await ref.set(data, { merge: true });
      if (opts && opts.lopullinen) poistaLuonnos();              // vain ottelun lopetus siivoaa laitteen
      asetaTallennustila('verkossa');
      return true;
    } catch (e) {
      /* KOKO virhe konsoliin — kentalla ei ole konsolia, mutta jalkikateen se on ainoa
         tapa selvittaa syy. Kayttajalle naytetaan SYY, ei pelkka yleisteksti: aiempi
         "kirjaukset ovat tallessa laitteella" ei kertonut, onko kyse oikeuksista vai datasta. */
      console.error('[pelihavainto] tallennus epaonnistui', e);
      var _te = q('tallennusteksti');
      if (_te) {
        _te.textContent = (e && e.code === 'permission-denied')
          ? phT('Ei oikeutta tallentaa tälle pelaajalle — ota yhteys seuran pääkäyttäjään')
          : (phT('Tallennus epäonnistui') + ' (' + ((e && e.code) || 'virhe') + ') — '
             + phT('kirjaukset ovat tallessa laitteella'));
      }
      /* Luonnos SÄILYY: kentällä epäonnistunut synkka ei saa hävittää kirjauksia. */
      return false;
    } finally {
      if (btn) btn.disabled = false;
    }
  }

  /* ── ASETUSRIVI ────────────────────────────────────────────────────── */
  function piirraAsetukset() {
    var TT = window.TM_TT_API || window;
    var h = '';
    h += '<div class="grp"><span class="lbl">' + esc(phT('Puoliaika')) + '</span><span class="seg">'
      + '<button type="button" data-puoliaika="1" aria-pressed="' + (S.puoliaika === 1) + '">1.</button>'
      + '<button type="button" data-puoliaika="2" aria-pressed="' + (S.puoliaika === 2) + '">2.</button></span></div>';
    h += '<div class="grp"><span class="lbl">' + esc(phT('Seison')) + '</span><span class="seg">'
      + '<button type="button" data-seisoo="lahi" aria-pressed="' + (S.seisoo === 'lahi') + '">' + esc(phT('lähilaita')) + '</button>'
      + '<button type="button" data-seisoo="kauko" aria-pressed="' + (S.seisoo === 'kauko') + '">' + esc(phT('vastalaita')) + '</button></span></div>';
    h += '<div class="grp"><span class="lbl">' + esc(phT('Pelimuoto')) + '</span><span class="seg">'
      + ['5v5', '8v8', '11v11'].map(function (pm) {
        return '<button type="button" data-pelimuoto="' + pm + '" aria-pressed="' + (S.pelimuoto === pm) + '">' + pm + '</button>';
      }).join('') + '</span></div>';

    var ppNimi = '';
    if (S.pelipaikka && TT.TM_TT_PELIPAIKAT && TT.TM_TT_PELIPAIKAT[S.pelipaikka]) {
      var v = TT.TM_TT_PELIPAIKAT[S.pelipaikka];
      ppNimi = String((v && v.nimi) || v || S.pelipaikka);
    }
    h += '<div class="grp"><span class="lbl">' + esc(phT('Pohja')) + '</span>'
      + '<span style="font-size:12px;color:var(--ink2)">' + esc(phT('Pelaajatarkkailu'))
      + (ppNimi ? ' · ' + esc(ppNimi) : '') + '</span>'
      + '<button type="button" class="linkbtn" id="btnMuokkaa">' + esc(phT('Muokkaa')) + '</button></div>';

    h += '<div class="grp"><span class="lbl">' + esc(phT('Vastustaja (valinnainen)')) + '</span>'
      + '<input type="text" id="inVastustaja" value="' + esc(S.vastustaja) + '"></div>';

    h += '<div class="rastit" id="rastit">';
    h += '<div class="grp" style="width:100%"><span class="lbl">' + esc(phT('Pelipaikka (valinnainen)')) + '</span>'
      + '<select id="selPelipaikka"><option value="">' + esc(phT('— ei pelipaikkaa —')) + '</option>'
      + Object.keys((TT.TM_TT_PELIPAIKAT || {})).map(function (k) {
        var val = TT.TM_TT_PELIPAIKAT[k];
        var nimi = String((val && val.nimi) || val || k);
        return '<option value="' + esc(k) + '"' + (S.pelipaikka === k ? ' selected' : '') + '>' + esc(nimi) + '</option>';
      }).join('') + '</select></div>';
    (PH.PH_KIRJATTAVAT || []).forEach(function (avain) {
      h += '<button type="button" class="rasti" data-rasti="' + esc(avain) + '" aria-pressed="' + (!!K[avain]) + '">'
        + esc(phT(RASTI_NIMI[avain] || avain)) + '</button>';
    });
    h += '</div>';
    q('asetukset').innerHTML = h;

    q('asetukset').querySelectorAll('[data-puoliaika]').forEach(function (b) {
      b.onclick = function () {
        S.puoliaika = Number(b.getAttribute('data-puoliaika'));
        piirraAsetukset(); paivitaPalkki(); piirra();
        /* Sama ottelu, sama luonnos — vaihto vain kirjaa puoliajan, ei vaihda dokumenttia. */
        tallennaLuonnos();
      };
    });
    q('asetukset').querySelectorAll('[data-seisoo]').forEach(function (b) {
      b.onclick = function () { S.seisoo = b.getAttribute('data-seisoo'); piirraAsetukset(); paivitaPalkki(); piirra(); };
    });
    q('asetukset').querySelectorAll('[data-pelimuoto]').forEach(function (b) {
      b.onclick = function () { S.pelimuoto = b.getAttribute('data-pelimuoto'); piirraAsetukset(); piirra(); tallennaLuonnos(); };
    });
    q('asetukset').querySelectorAll('[data-rasti]').forEach(function (b) {
      b.onclick = function () {
        var a = b.getAttribute('data-rasti'); K[a] = !K[a];
        b.setAttribute('aria-pressed', String(!!K[a]));
        piirra(); tallennaLuonnos();
      };
    });
    var btnM = q('btnMuokkaa');
    if (btnM) btnM.onclick = function () { q('rastit').classList.toggle('auki'); };
    var inV = q('inVastustaja');
    if (inV) inV.onchange = function () { S.vastustaja = inV.value; tallennaLuonnos(); };
    var selP = q('selPelipaikka');
    if (selP) selP.onchange = function () { asetaPohja(selP.value); piirraAsetukset(); q('rastit').classList.add('auki'); piirra(); tallennaLuonnos(); };
  }
  var RASTI_NIMI = {
    syotto: 'Syötöt', kuljetus: 'Kuljetukset', v1: '1v1', laukaus: 'Omat laukaukset',
    riisto: 'Riistot', menetys: 'Menetykset', juoksu: 'Juoksut ilman palloa',
    reaktio: 'Reaktiokysely', vastustajan_laukaus: 'Vastustajan laukaukset',
  };

  /* Pelaajasiru yläpalkissa: numero, nimi ja merkintöjen määrä. Siru on myös reitti
     asetuksiin, jottei kenttätilassa tarvita erillistä valikkoa. */
  function paivitaPalkki() {
    var p = S.pelaaja || {};
    var nimi = ((p.etunimi || '') + ' ' + (p.sukunimi || '')).trim() || phT('Pelaaja');
    var juuria = S.merkinnat.filter(function (m) { return m.ketju == null; }).length;
    var chip = q('pchip');
    if (chip) {
      /* ⚙ kertoo että sirusta pääsee asetuksiin — aiemmin siinä luki vain "— 0",
         eikä mikään vihjannut että sieltä vaihdetaan esimerkiksi seisomapaikka. */
      chip.innerHTML = '<span class="nro">' + esc(p.pelinumero != null ? '#' + p.pelinumero : '–') + '</span>'
        + '<span class="nm">' + esc(nimi) + '</span>'
        + '<span class="c">' + juuria + '</span>'
        + '<span class="c" aria-hidden="true">⚙</span>';
    }
    var lkm = q('merkintaLkm');
    if (lkm) lkm.textContent = String(juuria);
    paivitaSuuntamerkki();
  }

  /* ── KÄYNNISTYS ────────────────────────────────────────────────────── */
  function param(nimi) {
    try { return new URLSearchParams(window.location.search).get(nimi); } catch (e) { return null; }
  }
  function virhe(t) { q('porttiVirhe').textContent = phT(t); }

  async function lataaPelaaja() {
    var snap = await _db.collection('seurat').doc(S.seuraId).collection('pelaajat').doc(S.pelaajaId).get();
    if (!snap.exists) throw new Error('pelaajaa ei löydy');
    var p = snap.data() || {};
    p.id = snap.id;
    S.pelaaja = p;
    /* Pikakentät pelaajadokumentista — EI alikokoelmakyselyjä (§26). */
    S.pelipaikka = '';
    S.jaksofokus = p.jaksofokus || (p.jaksofokus_avain || null);
    var ika = null;
    if (p.syntymaVuosi) ika = new Date().getFullYear() - Number(p.syntymaVuosi);
    S.ikataso = PH.phIkataso ? PH.phIkataso(ika) : 'u812';
    S.pelimuoto = oletusPelimuoto(S.ikataso);
    asetaPohja(p.pelipaikka || '');
    try {
      var ssnap = await _db.collection('seurat').doc(S.seuraId).get();
      S.seura = ssnap.exists ? ssnap.data() : null;
    } catch (e) { S.seura = null; }
  }

  /* LUKU-TILA: Masterin "Ottelutarkkailut" avaa tallennetun tarkkailun samaan läpikäyntiin.
     Sama renderöintipolku kuin kirjauksessa — erillinen katselunäkymä ajautuisi erilleen ja
     näyttäisi eri luvut kuin työkalu. Kentällä ei ole eleitä eikä tallennusta. */
  async function lataaTarkkailu(id) {
    var snap = await _db.collection('seurat').doc(S.seuraId).collection('pelaajat').doc(S.pelaajaId)
      .collection('kenttatarkkailut').doc(id).get();
    if (!snap.exists) throw new Error('tarkkailua ei löydy');
    var d = snap.data() || {};
    S.merkinnat = Array.isArray(d.merkinnat) ? d.merkinnat : [];
    S.seq = S.merkinnat.reduce(function (a, m) { return Math.max(a, m.id || 0); }, 0);
    S.puoliaika = d.puoliaika || 1;
    S.seisoo = (d.suunta && d.suunta.seisoo) || 'lahi';
    S.pelimuoto = (d.ottelu && d.ottelu.pelimuoto) || S.pelimuoto;
    S.vastustaja = (d.ottelu && d.ottelu.vastustaja) || '';
    S.ikataso = d.ikataso || S.ikataso;
    S.jaksofokus = d.jaksofokus || S.jaksofokus;
    if (d.pelipaikka != null) asetaPohja(d.pelipaikka);
    if (Array.isArray(d.kirjattavat)) {
      K = {};
      d.kirjattavat.forEach(function (x) { K[x] = true; });
    }
    S.otteluAvain = (d.ottelu && d.ottelu.otteluAvain) || id;
    S.alkoi = null;
    S.lukutila = true;
  }

  /* Uusi ottelu: tunniste syntyy NYT, ja se on sama koko istunnon ajan (myös puoliajan vaihdon
     ja välilehden uudelleenlatauksen yli, koska se tallentuu luonnokseen). */
  function aloitaUusiOttelu() {
    S.alkoi = Date.now();
    S.merkinnat = []; S.seq = 0; S.viimeisinId = null; S.puoliaika = 1;
    S.otteluAvain = otteluAvainNyt(S.alkoi, S.kalenteriId);
  }
  function jatkaLuonnoksesta(l) {
    S.otteluAvain = l.otteluAvain;
    if (!lataaLuonnos(l.avain)) aloitaUusiOttelu();
  }

  /* KESKENERÄINEN LUONNOS: tuore (≤ 3 h) jatkuu suoraan — tauko, välilehden lataus tai akun
     loppuminen ei saa vaatia valintaa. Vanhempi kysytään: 21 h vanha luonnos jatkui aiemmin ja
     kello näytti 1267 min. Merkintöjä EI poisteta kysymättä — "Tallenna ja aloita uusi" vie vanhan
     ottelun ensin pilveen ja aloittaa uuden vasta onnistuneen tallennuksen jälkeen. */
  var LUONNOS_TUORE_MS = 3 * 60 * 60 * 1000;
  function luonnosOnTuore(l, nyt) {
    var alkoi = l && l.data ? l.data.alkoi : null;
    return typeof alkoi === 'number' && ((nyt == null ? Date.now() : nyt) - alkoi) <= LUONNOS_TUORE_MS;
  }
  window._phLuonnosOnTuore = luonnosOnTuore;   // testivartija

  function naytaJatkaValinta(luonnokset) {
    var l = luonnokset[0];
    var pvm = l.data.alkoi ? new Date(l.data.alkoi) : null;
    var kuvaus = (pvm ? pvm.toLocaleDateString('fi-FI', { weekday: 'short', day: 'numeric', month: 'numeric' }) : l.otteluAvain)
      + (l.data.vastustaja ? ', ' + phT('vastustaja') + ' ' + l.data.vastustaja : '');
    naytaPortti(phT('Keskeneräinen ottelu') + ' (' + kuvaus + ').',
      '<button type="button" id="btnJatka">' + esc(phT('Jatka')) + '</button>'
      + '<button type="button" id="btnUusi" style="background:transparent;border:.5px solid var(--border);color:var(--ink2)">'
      + esc(phT('Tallenna ja aloita uusi')) + '</button>');
    return new Promise(function (resolve) {
      q('btnJatka').onclick = function () { jatkaLuonnoksesta(l); resolve(); };
      q('btnUusi').onclick = async function () {
        var b = q('btnUusi'); if (b) b.disabled = true;
        virhe('');
        jatkaLuonnoksesta(l);                                    // vanha ottelu tilaan → tallennus sen avaimella
        var ok = await tallennaFirestoreen({ lopullinen: true });
        if (!ok) {
          /* Tallennus epäonnistui: vanha luonnos SÄILYY laitteella, eikä uutta aloiteta. */
          virhe('Tallennus epäonnistui — keskeneräinen ottelu on tallessa laitteella. Yritä uudelleen tai jatka sitä.');
          if (b) b.disabled = false;
          return;
        }
        /* Uusi ottelu ei peri vanhan puoliaikaa, toisen puoliajan alkua eikä vastustajaa. */
        S.alkoi2 = null; S.vastustaja = ''; S.paattynyt = false; S.kelloPysahtyi = 0;
        aloitaUusiOttelu();
        asetaTallennustila('');
        resolve();
      };
    });
  }

  async function kaynnista() {
    if (!S.lukutila && !S.otteluAvain) {
      var kesken = keskeneraisetLuonnokset();
      if (kesken.length && luonnosOnTuore(kesken[0])) jatkaLuonnoksesta(kesken[0]);
      else if (kesken.length) await naytaJatkaValinta(kesken);
      else aloitaUusiOttelu();
    }
    svg = q('pitch');
    laatikko = q('kenttalaatikko');
    piirraKentta();
    if (!S.lukutila) alustaEleet();
    piirraAsetukset();
    paivitaPalkki();
    piirra();
    q('portti').style.display = 'none';
    q('sovellus').style.display = '';
    if (typeof tmLokalisoiCommon === 'function') tmLokalisoiCommon(document, null);

    if (S.lukutila) {
      ['btnKumoa', 'btnHetki', 'btnTallenna'].forEach(function (id) {
        var b = q(id); if (b) { b.disabled = true; b.style.display = 'none'; }
      });
      asetaTallennustila('luku');
    }
    q('btnKumoa').onclick = kumoa;
    q('btnHetki').onclick = function () { suljeValitsin(false); lisaa({ tyyppi: 'hetki' }); };
    q('btnUlkotila').onclick = function () {
      var on = document.body.classList.toggle('ulkotila');
      q('btnUlkotila').setAttribute('aria-pressed', String(on));
    };
    q('btnTallenna').onclick = function () {
      tallennaLuonnos();                                        // laite ensin, sitten verkko
      asetaTallennustila('laitteella');
      tallennaFirestoreen();                                    // välitallennus: luonnos EI poistu
    };
    /* Silta pikakorttiin: valmentaja kirjoittaa varsinaisen pelihavainnon samalle pelaajalle. */
    q('btnPikakortti').onclick = function () {
      var url = 'TalentMaster_ADAR_Pikakortti.html?seuraId=' + encodeURIComponent(S.seuraId || '')
        + '&pelaajaId=' + encodeURIComponent(S.pelaajaId || '');
      window.open(url, '_blank');
    };
    alustaKenttatila();
  }

  /* ══ KENTTÄTILA ═══════════════════════════════════════════════════
     Aloitusruutu → kenttätila. Asetukset ovat aloitusruudussa, ja kenttätilassa näkyy pelkkä
     kenttä. Tallennettu luonnos avautuu suoraan kenttätilaan (kesken oleva ottelu jatkuu). */
  var wakeLock = null;

  /* Koko näyttö ja näytön valveilla pito ovat MUKAVUUKSIA: hylkäys ei saa kaataa kirjaamista,
     ja iOS:ssä requestFullscreen puuttuu kokonaan. Siksi molemmat try/catch + .catch. */
  function kokoNaytto() {
    var d = document.documentElement;
    try {
      var r = d.requestFullscreen || d.webkitRequestFullscreen;
      if (r) Promise.resolve(r.call(d)).catch(function () {});
    } catch (e) { /* ei tuettu */ }
    pyydaWakeLock();
  }
  function pyydaWakeLock() {
    try {
      if (navigator.wakeLock && navigator.wakeLock.request) {
        navigator.wakeLock.request('screen').then(function (w) { wakeLock = w; }).catch(function () {});
      }
    } catch (e) { /* ei tuettu */ }
  }

  function onKenttatilassa() { return document.body.classList.contains('kenttatilassa'); }

  function avaaKenttatila() {
    q('aloitus').style.display = 'none';
    q('kenttatila').style.display = '';
    document.body.classList.add('kenttatilassa');
    asettele(); piirraKentta(); piirra(); paivitaPalkki();
  }
  function avaaAsetukset() {
    suljeValitsin(false); suljeLehti();
    q('aloitus').style.display = '';
    q('kenttatila').style.display = 'none';
    document.body.classList.remove('kenttatilassa');
    piirraAsetukset();
    /* Kesken ottelun asetukset ovat paneeli, ei aloitus — painike vie takaisin kentälle. */
    var b = q('btnAloita'), lead = q('aloitusLead');
    if (b) b.textContent = phT('Jatka');
    if (lead) lead.textContent = phT('Muuta asetuksia. Merkinnät säilyvät.');
  }

  function avaaLehti() {
    suljeValitsin(false);
    piirra();
    q('sheet').classList.add('auki');
    q('scrim').classList.add('auki');
  }
  function suljeLehti() {
    q('sheet').classList.remove('auki');
    q('scrim').classList.remove('auki');
  }

  /* Yläpalkissa PELKKÄ IKONI: ● = tallessa laitteella (ei vielä verkossa) · ✓ = tallennettu verkkoon.
     Teksti näkyy napautuksella toastina (ks. alustaKenttatila) ja lehden alaosassa. */
  function asetaTallennustila(tila) {
    var el = q('tallennustila'), teksti = q('tallennusteksti');
    var sanat = { laitteella: 'Tallessa laitteella', verkossa: 'Tallennettu', luku: 'vain luku' };
    var s = phT(sanat[tila] || '');
    if (el) {
      el.classList.toggle('odottaa', tila === 'laitteella');
      el.classList.toggle('verkossa', tila === 'verkossa');
      el.setAttribute('aria-label', s || phT('Tallennustila'));
      el.setAttribute('data-teksti', s);
    }
    var ikoni = q('tallennusikoni');
    if (ikoni) ikoni.textContent = (tila === 'verkossa') ? '✓' : (tila === 'luku' ? '👁' : '●');
    var merkki = q('tallennusmerkki');
    if (merkki) merkki.textContent = s;
    if (teksti) teksti.textContent = s;
  }

  /* Kello alkaa kenttätilaan siirryttäessä ja näyttää kuluneen ajan (ei kellonaikaa):
     valmentaja tarvitsee sen merkinnän ajankohtaan, ei aikatauluun. */
  function kaynnistaKello() {
    if (window._phKelloAjastin) clearInterval(window._phKelloAjastin);
    var el = q('kello');
    /* Yli 120 min → "120+": kello ei saa näyttää mahdottomia lukuja (vanha luonnos näytti 1267 min). */
    var piirraKello = function () { if (el) el.textContent = kelloNaytto(kelloSekunnit()); };
    piirraKello();
    window._phKelloAjastin = setInterval(piirraKello, 1000);
  }

  /* ══ OTTELUN KULKU ══════════════════════════════════════════════════
     Aiemmin puoliajan vaihto oli piilossa (pelaajasiru → aloitusruutu → "2." → Jatka), eikä
     ottelua voinut lopettaa lainkaan. Nyt Merkinnät-lehden pääpainike kertoo, mitä seuraavaksi
     tapahtuu, ja vahvistus kertoo mitä se tarkoittaa. */
  function paivitaVaihepainike() {
    var b = q('btnVaihe');
    if (!b) return;
    if (S.lukutila) { b.style.display = 'none'; return; }
    b.style.display = '';
    b.textContent = (S.puoliaika === 2) ? phT('Lopeta ottelu') : (phT('Päätä 1. puoliaika') + ' →');
    var siru = q('pasiru');
    if (siru) {
      siru.textContent = S.puoliaika + '. ' + phT('pa');
      siru.classList.toggle('toinen', S.puoliaika === 2);
    }
  }

  function tyhjennaVahvistus() {
    var v = q('vaiheVahvistus');
    if (v) v.innerHTML = '';
    var b = q('btnVaihe');
    if (b) b.style.display = S.lukutila ? 'none' : '';
  }

  function naytaVahvistus(teksti, nappiTeksti, fn) {
    var v = q('vaiheVahvistus');
    if (!v) return;
    q('btnVaihe').style.display = 'none';
    v.innerHTML = '<div class="rivi">' + esc(teksti)
      + '<div class="napit"><button class="tbtn" type="button" id="vahvOk">' + esc(nappiTeksti) + '</button>'
      + '<button class="tbtn sec" type="button" id="vahvEi">' + esc(phT('Takaisin')) + '</button></div></div>';
    q('vahvOk').onclick = fn;
    q('vahvEi').onclick = tyhjennaVahvistus;
  }

  function vaihePainettu() {
    if (S.puoliaika === 2) {
      naytaVahvistus(phT('Ottelu tallennetaan ja kello pysähtyy.'), phT('Lopeta ottelu'), lopetaOttelu);
    } else {
      naytaVahvistus(phT('2. puoliaika alkaa. Hyökkäyssuunta kääntyy.'),
        phT('Päätä 1. puoliaika'), paataPuoliaika);
    }
  }

  async function paataPuoliaika() {
    tyhjennaVahvistus();
    S.puoliaika = 2;
    S.alkoi2 = Date.now();
    S.viimeisinId = null;                 // kumoa ei ylitä rajaa
    piilotaKumoa();
    tallennaLuonnos();                    // laitteelle: puoliaika 2 + alkoi2 talteen
    /* Synkka yritetään, mutta EI estä jatkamista: tauko on lyhyt eikä verkko ole varma.
       Välitallennus → luonnos säilyy, joten tauolla tapahtuva uudelleenlataus jatkaa
       2. puoliaikaa samalla otteluAvaimella. */
    tallennaFirestoreen();
    suljeLehti();
    asettele(); piirraKentta(); piirra();
    paivitaVaihepainike();
    var nuoli = PYSTY ? '↓' : '←';
    naytaToast(phT('2. puoliaika') + ' · ' + phT('hyökkäys') + ' ' + nuoli);
  }

  /* Kevyt toast: kenttätilassa ei ole muuta ilmoituskanavaa. */
  function naytaToast(teksti) {
    var el = document.createElement('div');
    el.className = 'toast';
    el.textContent = teksti;
    laatikko.appendChild(el);
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 2600);
  }

  async function lopetaOttelu() {
    tyhjennaVahvistus();
    var ok = await tallennaFirestoreen({ lopullinen: true });
    if (!ok) {
      /* Ottelu PYSYY AUKI ja luonnos säilyy — uusi yritys on yksi painallus. */
      naytaVahvistus(phT('Tallessa laitteella — yritä uudelleen.'), phT('Yritä uudelleen'), lopetaOttelu);
      return;
    }
    S.paattynyt = true;
    S.kelloPysahtyi = kelloSekunnit();
    if (window._phKelloAjastin) { clearInterval(window._phKelloAjastin); window._phKelloAjastin = null; }
    vapautaNaytto();
    suljeLehti();
    naytaLoppunakyma();
  }

  function vapautaNaytto() {
    try { if (wakeLock && wakeLock.release) wakeLock.release(); } catch (e) { /* ei tuettu */ }
    wakeLock = null;
    try {
      if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(function () {});
      else if (document.webkitFullscreenElement && document.webkitExitFullscreen) document.webkitExitFullscreen();
    } catch (e) { /* ei tuettu */ }
  }

  function naytaLoppunakyma() {
    /* Sama tilastonäkymä kuin läpikäynnissä — ei omaa yhden rivin koostetta. */
    var juuria = S.merkinnat.filter(function (m) { return m.ketju == null; }).length;
    q('loppuOtsikko').textContent = phT('Ottelu tallennettu');
    q('loppuLuvut').textContent = juuria + ' ' + phT('tilannetta')
      + (S.vastustaja ? ' · ' + phT('vastustaja') + ' ' + S.vastustaja : '');
    piirraTilastot(q('loppuTilastot'));
    var virhe = q('loppuVirhe');
    if (virhe) { virhe.textContent = ''; virhe.className = 'fine'; }
    q('kenttatila').style.display = 'none';
    q('loppu').style.display = '';
    document.body.classList.remove('kenttatilassa');
  }

  function alustaKenttatila() {
    var aloita = q('btnAloita');
    if (aloita) aloita.onclick = function () {
      /* requestFullscreen vaatii käyttäjän eleen — tämä painallus on se ele. */
      kokoNaytto();
      avaaKenttatila();
      kaynnistaKello();
    };
    var chip = q('pchip');
    if (chip) chip.onclick = avaaAsetukset;
    var fs = q('btnFs');
    if (fs) fs.onclick = kokoNaytto;
    var lista = q('btnLista');
    if (lista) lista.onclick = function () { q('sheet').classList.contains('auki') ? suljeLehti() : avaaLehti(); };
    var scrim = q('scrim');
    if (scrim) scrim.onclick = suljeLehti;

    /* Puoliaikasiru vie suoraan läpikäyntiin — se on tauolla ensimmäinen asia jota tarvitaan. */
    var siru = q('pasiru');
    if (siru) siru.onclick = function () { avaaLehti(); };
    /* Tallennustila on ikoni; teksti tulee napautuksella. */
    var tila = q('tallennustila');
    if (tila) tila.onclick = function () {
      naytaToast(tila.getAttribute('data-teksti') || phT('Ei vielä tallennettu'));
    };
    var vaihe = q('btnVaihe');
    if (vaihe) vaihe.onclick = vaihePainettu;
    paivitaVaihepainike();

    var lPk = q('loppuPikakortti');
    if (lPk) lPk.onclick = function () {
      window.open('TalentMaster_ADAR_Pikakortti.html?seuraId=' + encodeURIComponent(S.seuraId || '')
        + '&pelaajaId=' + encodeURIComponent(S.pelaajaId || ''), '_blank');
    };
    var lUusi = q('loppuUusi');
    if (lUusi) lUusi.onclick = function () {
      /* UUSI OTTELU = uusi otteluAvain. Vanha on jo tallennettu ja sen luonnos poistettu. */
      S.merkinnat = []; S.seq = 0; S.viimeisinId = null; S.odottaa = null;
      S.puoliaika = 1; S.alkoi = Date.now(); S.alkoi2 = null;
      S.paattynyt = false; S.kelloPysahtyi = 0;
      S.otteluAvain = otteluAvainNyt(S.alkoi, S.kalenteriId);
      q('loppu').style.display = 'none';
      asetaTallennustila('');
      avaaAsetukset();
    };
    var lSulje = q('loppuSulje');
    if (lSulje) lSulje.onclick = function () { q('loppu').style.display = 'none'; };

    /* Kenttä seuraa puhelimen asentoa. Valitsin suljetaan ENNEN uudelleenasettelua, jottei se
       jää roikkumaan väärään kohtaan käännön jälkeen. Merkinnät eivät katoa: ne ovat
       kanonisessa muodossa (len/wid), ja vain piirto lasketaan uudelleen. */
    var uudelleen = function () {
      if (!onKenttatilassa()) return;
      suljeValitsin(false);
      asettele(); piirraKentta(); piirra();
    };
    window.addEventListener('resize', uudelleen);
    window.addEventListener('orientationchange', uudelleen);
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible' && onKenttatilassa()) pyydaWakeLock();
    });

    /* iOS-Safari ei tue requestFullscreen-kutsua — CSS-tila riittää, mutta selaimen palkit
       jäävät. Kerrotaan kerran, miten ne saa pois. */
    var vihjeEl = q('aloitusVihje');
    if (vihjeEl) {
      var iOS = /iPad|iPhone|iPod/.test(navigator.userAgent || '');
      var nahty = false;
      try { nahty = localStorage.getItem('tm_ph_ios_vihje') === '1'; } catch (e) { /* ei tuettu */ }
      if (iOS && !nahty) {
        vihjeEl.className = 'fine vihje';
        vihjeEl.textContent = phT('Lisää kotivalikkoon, niin selaimen palkit katoavat.');
        try { localStorage.setItem('tm_ph_ios_vihje', '1'); } catch (e) { /* ei tuettu */ }
      }
    }

    /* Kesken oleva ottelu: luonnos avautuu suoraan kenttätilaan. */
    if (S.merkinnat.length) { avaaKenttatila(); kaynnistaKello(); }
  }

  function naytaPortti(viesti, kentat) {
    q('portti').style.display = '';
    q('porttiTeksti').textContent = phT(viesti);
    q('porttiKentat').innerHTML = kentat || '';
  }

  async function alusta() {
    S.seuraId = param('seuraId');
    S.pelaajaId = param('pelaajaId');
    _auth.onAuthStateChanged(async function (u) {
      if (!u) {
        naytaPortti('Kirjaudu seuran tunnuksella.',
          '<input type="email" id="inEmail" placeholder="' + esc(phT('sähköposti')) + '">'
          + '<input type="password" id="inSalasana" placeholder="' + esc(phT('salasana')) + '">'
          + '<button type="button" id="btnKirjaudu">' + esc(phT('Kirjaudu')) + '</button>');
        var b = q('btnKirjaudu');
        if (b) {
          b.onclick = function () {
            virhe('');
            _auth.signInWithEmailAndPassword(q('inEmail').value.trim(), q('inSalasana').value)
              .catch(function (e) { virhe('Kirjautuminen epäonnistui.'); console.warn('[pelihavainto]', e && e.code); });
          };
        }
        return;
      }
      S.uid = u.uid;
      try {
        var tok = await u.getIdTokenResult(true);
        S.rooli = (tok.claims && tok.claims.rooli) || null;
        S.superAdmin = (S.rooli === 'super_admin' || S.rooli === 'superadmin');
        if (!S.seuraId) S.seuraId = (tok.claims && tok.claims.seuraId) || null;
      } catch (e) { /* claimit puuttuvat → seuravalitsin */ }

      /* SA:lla ei ole seuraId-claimia → seuravalitsin on AINA pakollinen (§3): automaattinen
         haku palauttaisi satunnaisen seuran. */
      if (!S.seuraId) { await naytaSeuraValitsin(); return; }
      if (!S.pelaajaId) { await naytaPelaajaValitsin(); return; }
      try { await lataaPelaaja(); } catch (e) {
        naytaPortti('Pelaajan tietoja ei saatu haettua.', '');
        virhe('Tarkista linkki.');
        return;
      }
      var tid = param('tarkkailuId');
      if (tid) {
        try { await lataaTarkkailu(tid); } catch (e) {
          naytaPortti('Tarkkailua ei saatu haettua.', '');
          virhe('Tarkista linkki.');
          return;
        }
      }
      await kaynnista();
    });
  }

  async function naytaSeuraValitsin() {
    naytaPortti('Valitse seura.', '<select id="selSeura"></select><button type="button" id="btnSeura">'
      + esc(phT('Jatka')) + '</button>');
    try {
      var snap = await _db.collection('seurat').get();
      var sel = q('selSeura');
      snap.docs.forEach(function (d) {
        var o = document.createElement('option');
        o.value = d.id; o.textContent = (d.data() || {}).nimi || d.id;
        sel.appendChild(o);
      });
    } catch (e) { virhe('Seuroja ei saatu haettua.'); }
    q('btnSeura').onclick = function () {
      S.seuraId = q('selSeura').value;
      if (!S.pelaajaId) { naytaPelaajaValitsin(); return; }
      lataaPelaaja().then(kaynnista).catch(function () { virhe('Pelaajan haku epäonnistui.'); });
    };
  }

  /* Pelaajahaku joukkueen listasta. §18: joukkuejäsenyys on KAHDESSA kentässä, joten kysely on
     kaksoiskysely rinnakkain ja tulokset yhdistetään doc-ID:n perusteella. */
  async function haeJoukkueenPelaajat(joukkueNimi, joukkueId) {
    var col = _db.collection('seurat').doc(S.seuraId).collection('pelaajat');
    var kyselyt = [];
    if (joukkueNimi) kyselyt.push(col.where('joukkue', '==', joukkueNimi).get());
    if (joukkueId) kyselyt.push(col.where('joukkueet', 'array-contains', joukkueId).get());
    if (!kyselyt.length) kyselyt.push(col.limit(300).get());
    var tulokset = await Promise.all(kyselyt);
    var kartta = new Map();
    tulokset.forEach(function (s) {
      s.docs.forEach(function (d) { kartta.set(d.id, Object.assign({ id: d.id }, d.data())); });
    });
    return Array.from(kartta.values());
  }
  window._phHaeJoukkueenPelaajat = haeJoukkueenPelaajat;

  async function naytaPelaajaValitsin() {
    naytaPortti('Valitse pelaaja.', '<select id="selPelaaja"></select><button type="button" id="btnPelaaja">'
      + esc(phT('Jatka')) + '</button>');
    try {
      var pelaajat = await haeJoukkueenPelaajat(param('joukkue'), param('joukkueId'));
      pelaajat.sort(function (a, b) { return String(a.sukunimi || '').localeCompare(String(b.sukunimi || '')); });
      var sel = q('selPelaaja');
      pelaajat.forEach(function (p) {
        var o = document.createElement('option');
        o.value = p.id;
        o.textContent = ((p.etunimi || '') + ' ' + (p.sukunimi || '')).trim() + (p.joukkue ? ' · ' + p.joukkue : '');
        sel.appendChild(o);
      });
      if (!pelaajat.length) virhe('Joukkueesta ei löytynyt pelaajia.');
    } catch (e) { virhe('Pelaajia ei saatu haettua.'); }
    q('btnPelaaja').onclick = function () {
      S.pelaajaId = q('selPelaaja').value;
      lataaPelaaja().then(kaynnista).catch(function () { virhe('Pelaajan haku epäonnistui.'); });
    };
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', alusta);
  else alusta();
})();
</script>
