<!DOCTYPE html>
<!-- TalentMaster · KOHDENNETTU PELIHAVAINTO — kenttätyökalu (tuotanto).
     Käynnistys: ?seuraId=&pelaajaId=  (SA: seuravalitsin, §3).
     UX-referenssi: docs/prototyypit/pelihavainto_kenttatyokalu_v6.html (mockup, EI koodipohja).
     LASKENTA TULEE VAIN lib/tm_pelihavainto.js:STÄ — sivulla ei ole omaa xT-taulukkoa, xG-kaavaa
     eikä boksirajoja. Kopio ajautuisi erilleen libistä eikä kalibrointi enää näkyisi (§5.6).
     Datamuoto = tallennettava muoto (§5.6): tyyppi/alku/loppu/piste/t. Laskettuja arvoja ei
     tallenneta. Tallennus: seurat/{sid}/pelaajat/{pid}/kenttatarkkailut/{pvm}_{puoliaika}_{uid}
     (OMA kokoelma, ei `havainnot` — ks. Rules v3.20 -perustelu). -->
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Kohdennettu pelihavainto · TalentMaster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-check-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="lib/tm_appcheck.js?v=1"></script>
<script src="lib/tm_lang.js?v=14"></script>
<script src="lib/tm_i18n_common.js?v=10"></script>
<script src="lib/tm_xt.js?v=1"></script>                     <!-- xT-ruudukko: tm_pelihavainto käyttää, EI kopiota -->
<script src="lib/tm_pelihavainto.js?v=5"></script>           <!-- KANONINEN laskenta (§5.6). NOSTA ?v KUN LIB MUUTTUU: vanha lib + uusi sivu = pystyasennon napautus tallentuisi vaakakaavalla vaaraan kohtaan ILMAN virheilmoitusta (§27.4 CDN-cache). -->
<script src="lib/tm_teknistaktiset.js?v=1"></script>         <!-- pelipaikkalista (TM_TT_PELIPAIKAT) asetuksissa. Konseptivalinta EI ole tässä työkalussa: se tehdään pikakortissa. -->
<script src="lib/tm_joukkue.js?v=3"></script>                <!-- §18 joukkuejäsenyys -->

<style>
  /* Design-tokenit (CLAUDE.md §5). EI #3EC9A7, EI #4A7ED9, EI #06090F, EI Playfair Display. */
  :root{
    --font-serif:'Cormorant Garamond',Georgia,serif;
    --font-sans:'DM Sans',system-ui,sans-serif;
    --font-mono:'DM Mono',ui-monospace,monospace;
    --bg:#111110; --surface:#161614; --surface2:#1C1C1A; --surface3:#141413;
    --ink:#F2EFE6; --ink2:#C9C6BC; --ink3:#8B887F;
    --border:rgba(242,239,230,.12); --border2:rgba(242,239,230,.07);
    --accent:#28B090; --blue:#2A5DB0; --amber:#E0A040; --red:#C94040; --violet:#9A86C8;
    --teal-dim:rgba(40,176,144,.10); --teal-brd:rgba(40,176,144,.30);
    --blue-dim:rgba(42,93,176,.14); --blue-brd:rgba(42,93,176,.40);
    --amber-dim:rgba(224,160,64,.12); --amber-brd:rgba(224,160,64,.32);
    --red-dim:rgba(201,64,64,.12); --red-brd:rgba(201,64,64,.34);
    --violet-dim:rgba(154,134,200,.12); --violet-brd:rgba(154,134,200,.34);
    --pitch:#1A2320; --pitch-line:rgba(242,239,230,.30);
    color-scheme:dark;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#F2EFE6; --surface:#FBFAF6; --surface2:#EDEAE0; --surface3:#E4E0D3;
      --ink:#1C1C1A; --ink2:#3E3C37; --ink3:#7A776E;
      --border:rgba(28,28,26,.14); --border2:rgba(28,28,26,.08);
      --pitch:#E3E8DF; --pitch-line:rgba(28,28,26,.35);
      color-scheme:light;
    }
  }
  :root[data-theme="light"]{
    --bg:#F2EFE6; --surface:#FBFAF6; --surface2:#EDEAE0; --surface3:#E4E0D3;
    --ink:#1C1C1A; --ink2:#3E3C37; --ink3:#7A776E;
    --border:rgba(28,28,26,.14); --border2:rgba(28,28,26,.08);
    --pitch:#E3E8DF; --pitch-line:rgba(28,28,26,.35);
    color-scheme:light;
  }
  /* Ulkotila: aurinko kentällä — korkeampi kontrasti, ei uusia sävyjä vaan tummempi muste. */
  body.ulkotila{
    --surface:#FFFFFF; --surface2:#EDEAE0; --surface3:#D9D5C8;
    --ink:#111110; --ink2:#1C1C1A; --ink3:#4A4843;
    --border:rgba(17,17,16,.35); --border2:rgba(17,17,16,.18);
    --pitch:#F4F6F0; --pitch-line:rgba(17,17,16,.75);
    color-scheme:light;
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-weight:300;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
  button{font-family:inherit}
  button:focus-visible, select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .wrap{max-width:1180px;margin:0 auto;padding:16px 14px 40px}
  h1{font-family:var(--font-serif);font-weight:300;font-size:26px;margin:0}
  .eyebrow{font-size:9.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}

  /* ── portti ─────────────────────────────────────────────────────────── */
  .gate{max-width:440px;margin:12vh auto;padding:26px 24px;background:var(--surface);border:.5px solid var(--border);border-radius:12px}
  .gate h1{margin-bottom:6px}
  .gate p{color:var(--ink2);font-size:13px}
  .gate input, .gate select{width:100%;margin-top:8px;padding:10px 12px;background:var(--surface2);border:.5px solid var(--border);border-radius:8px;color:var(--ink);font-size:14px;font-family:inherit}
  .gate button{width:100%;margin-top:12px;padding:11px;border:none;border-radius:8px;background:var(--accent);color:#08110E;font-size:14px;font-weight:600;cursor:pointer}
  .virhe{color:var(--red);font-size:12.5px;margin-top:8px;min-height:16px}

  /* ── asetusrivi ─────────────────────────────────────────────────────── */
  .setup{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;margin:12px 0 14px;padding:12px 14px;border:.5px solid var(--border);background:var(--surface);border-radius:10px}
  .setup .grp{display:flex;flex-direction:column;gap:5px;min-width:0}
  .setup .lbl{font-size:9px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3)}
  .seg{display:inline-flex;border:.5px solid var(--border);border-radius:7px;overflow:hidden}
  .seg button{font-size:11.5px;padding:7px 11px;background:transparent;border:0;color:var(--ink2);cursor:pointer;border-right:.5px solid var(--border)}
  .seg button:last-child{border-right:0}
  .seg button[aria-pressed="true"]{background:var(--teal-dim);color:var(--accent);font-weight:500}
  .setup input[type=text]{padding:7px 9px;background:var(--surface2);border:.5px solid var(--border);border-radius:7px;color:var(--ink);font-size:12px;font-family:inherit;max-width:180px}
  .setup select{padding:7px 9px;background:var(--surface2);border:.5px solid var(--border);border-radius:7px;color:var(--ink);font-size:12px;font-family:inherit}
  .linkbtn{background:none;border:0;color:var(--accent);font-size:11.5px;cursor:pointer;padding:4px 0;text-decoration:underline}
  .rastit{display:none;flex-wrap:wrap;gap:6px;width:100%;padding-top:10px;border-top:.5px solid var(--border2)}
  .rastit.auki{display:flex}
  .rasti{font-size:11px;padding:6px 10px;border-radius:14px;border:.5px solid var(--border);background:transparent;color:var(--ink2);cursor:pointer}
  .rasti[aria-pressed="true"]{background:var(--teal-dim);border-color:var(--teal-brd);color:var(--accent);font-weight:500}

  /* ── KENTTÄTILA — kenttä täyttää näytön (2A-ulkoasu) ────────────────
     Kaksi vaihetta: aloitusruutu (asetukset) → kenttätila (pelkkä kenttä).
     Kenttä SEURAA puhelimen asentoa: pystyssä kenttä pystyssä (hyökkäys ylös),
     vaakana vaakana (hyökkäys sivulle). Kumpikin asento on täysiarvoinen
     käyttötila — suuntaa EI lukita eikä pystyssä näytetä "käännä puhelin".
     Turva-alueet (env(safe-area-inset-*)) huomioidaan, jotta lovi ja
     kotipalkki eivät syö kenttää. */
  :root{
    --sat:env(safe-area-inset-top,0px); --sar:env(safe-area-inset-right,0px);
    --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px);
  }
  body.kenttatilassa{overflow:hidden;overscroll-behavior:none;height:100%}
  html{height:100%}
  .app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);
       padding:var(--sat) var(--sar) var(--sab) var(--sal);z-index:5}

  .sbar{display:flex;align-items:center;gap:8px;padding:4px 8px;border-bottom:.5px solid var(--border);
        background:var(--surface);height:44px;flex:none;min-width:0}
  .pchip{flex:0 1 auto;min-width:0;display:flex;align-items:center;gap:6px;border:.5px solid var(--border);
         background:var(--surface2);color:var(--ink2);border-radius:20px;padding:5px 11px 5px 6px;
         font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;height:34px;overflow:hidden}
  .pchip .nro{font-family:var(--font-mono);font-size:11px;min-width:24px;height:24px;border-radius:12px;
              display:flex;align-items:center;justify-content:center;background:var(--surface3);color:var(--ink2);padding:0 5px;flex:none}
  .pchip .nm{overflow:hidden;text-overflow:ellipsis}
  .pchip .c{font-family:var(--font-mono);font-size:10.5px;color:var(--ink3);flex:none}
  .sbar .sp{flex:1 1 0}
  /* Tallennustila on PELKKÄ IKONI (● laitteella · ✓ verkossa); teksti näkyy napautuksella toastina.
     Teksti vei pystyasennossa tilan ja leikkasi kellon oikeasta reunasta. */
  .saved{display:flex;align-items:center;justify-content:center;width:26px;height:34px;padding:0;border:0;
         background:transparent;font-family:var(--font-mono);font-size:13px;color:var(--ink3);flex:none;cursor:pointer}
  .saved .ico{color:var(--ink3);line-height:1}
  .saved.odottaa .ico{color:var(--amber)}
  .saved.verkossa .ico{color:var(--accent)}
  .saved .lbltxt{display:none}
  .pasiru{font-size:11.5px;font-weight:600;letter-spacing:.06em;padding:6px 10px;border-radius:7px;
          border:.5px solid var(--border);background:var(--surface2);color:var(--ink2);cursor:pointer;
          font-family:var(--font-sans);flex:none}
  .pasiru.toinen{border-color:var(--teal-brd);background:var(--teal-dim);color:var(--accent)}
  #vaiheVahvistus{width:100%;font-size:12px;color:var(--ink2);line-height:1.5}
  #vaiheVahvistus .rivi{padding:10px 12px;border:.5px solid var(--amber-brd);background:var(--amber-dim);border-radius:8px;margin-bottom:8px}
  #vaiheVahvistus .napit{display:flex;gap:8px;margin-top:10px}
  #loppuVirhe.virhe{color:var(--amber)}
  .clock{font-family:var(--font-mono);font-size:14px;color:var(--ink);display:flex;align-items:center;gap:7px;
         font-variant-numeric:tabular-nums;flex:none;background:var(--surface2);border:.5px solid var(--border);
         padding:5px 9px;border-radius:7px}
  .clock .dot{width:7px;height:7px;border-radius:50%;background:var(--red)}
  .iconbtn{font-size:14px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;
           border:.5px solid var(--border);background:transparent;color:var(--ink2);border-radius:8px;cursor:pointer;flex:none}
  .iconbtn[aria-pressed="true"]{color:var(--amber);border-color:var(--amber-brd);background:var(--amber-dim)}

  /* Vaaka: kenttä vasemmalla, palkki oikeassa reunassa. Pysty: palkki alhaalla (ks. media). */
  .field{display:grid;grid-template-columns:minmax(0,1fr) 82px;flex:1 1 auto;min-height:0}
  .pitchbox{position:relative;display:flex;align-items:center;justify-content:center;
            padding:4px 2px 4px 6px;touch-action:none;user-select:none;-webkit-user-select:none;
            min-height:0;min-width:0;overflow:hidden}
  .dir{position:absolute;top:8px;left:50%;transform:translateX(-50%);font-size:11.5px;color:var(--ink2);
       pointer-events:none;z-index:2;display:flex;align-items:center;gap:8px;background:var(--surface);
       border:.5px solid var(--border);padding:3px 11px;border-radius:20px;white-space:nowrap;opacity:.94}
  .dir b{font-weight:600;color:var(--ink)}
  .dir .arr{color:var(--accent);font-size:14px;font-weight:600}
  #pitch{display:block;background:var(--pitch);touch-action:none;border-radius:6px}
  .rail{display:flex;flex-direction:column;gap:6px;padding:6px 6px 6px 2px}
  .railbtn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
           border:.5px solid var(--border);background:var(--surface2);color:var(--ink2);border-radius:12px;
           cursor:pointer;font-size:11px;font-weight:500;min-height:58px;position:relative;font-family:inherit}
  .railbtn .ic{font-size:20px;line-height:1}
  .railbtn.pin{border-color:var(--amber-brd);background:var(--amber-dim);color:var(--amber)}
  .railbtn.list{color:var(--ink)}
  .railbtn:disabled{opacity:.35;cursor:default}
  .railbtn .cnt{position:absolute;top:5px;right:6px;font-family:var(--font-mono);font-size:10px;
                background:var(--accent);color:#08110E;border-radius:10px;padding:1px 6px;font-weight:500}

  /* ── valitsin: pysyy kentän sisällä, napit umpinaiset, merkinnät himmenevät ── */
  .chooser{position:absolute;z-index:20;pointer-events:none}
  .chooser .cbtn{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;min-width:82px;height:62px;
                 padding:0 8px;border-radius:12px;border:.5px solid var(--border);background:var(--surface);
                 color:var(--ink);font-size:12px;font-weight:500;cursor:pointer;box-shadow:0 6px 22px rgba(0,0,0,.45);
                 display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;white-space:nowrap}
  .chooser .cbtn .sub{font-size:8.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
  .chooser .cbtn .ic{font-size:18px;line-height:1}
  .chooser .cbtn.teal{border-color:var(--teal-brd);color:var(--accent)}
  .chooser .cbtn.blue{border-color:var(--blue-brd);color:var(--blue)}
  .chooser .cbtn.amber{border-color:var(--amber-brd);color:var(--amber)}
  .chooser .cbtn.red{border-color:var(--red-brd);color:var(--red)}
  .chooser .cbtn.x{min-width:38px;width:38px;height:38px;border-radius:50%;font-size:13px;color:var(--ink3)}
  .chooser .cd{position:absolute;transform:translate(-50%,-50%);font-family:var(--font-mono);font-size:11px;color:var(--ink3)}
  /* Valitsimen ollessa auki merkinnät himmenevät → vaihtoehdot erottuvat kentän viivoista. */
  .pitchbox.valitsee #pitch .ents{opacity:.25;transition:opacity .12s}

  .hintbar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:15;font-size:12.5px;
           font-weight:500;padding:8px 14px;border-radius:20px;background:var(--surface);
           border:.5px solid var(--teal-brd);color:var(--accent);pointer-events:none;white-space:nowrap}
  .toast{position:absolute;top:8px;right:10px;z-index:18;display:flex;align-items:center;gap:10px;font-size:12.5px;
         padding:6px 7px 6px 13px;border-radius:20px;background:var(--surface);border:.5px solid var(--teal-brd);
         color:var(--ink);box-shadow:0 6px 22px rgba(0,0,0,.35);white-space:nowrap}
  .toast button{font-size:12px;padding:6px 11px;border-radius:14px;border:.5px solid var(--border);
                background:var(--surface2);color:var(--ink);cursor:pointer;font-weight:500}
  .react{position:absolute;left:12px;right:12px;bottom:12px;z-index:19;max-width:520px;margin:0 auto;
         padding:12px 14px;border-radius:14px;background:var(--surface);border:.5px solid var(--amber-brd);
         box-shadow:0 8px 28px rgba(0,0,0,.4)}
  .react .q{font-size:13.5px;color:var(--ink);display:flex;justify-content:space-between;gap:8px;margin-bottom:9px}
  .react .q span{font-family:var(--font-mono);font-size:10.5px;color:var(--ink3)}
  .react .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .react .opts button{padding:14px 6px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;
                      border:.5px solid var(--border);background:transparent;color:var(--ink2);font-family:inherit}
  .react .opts .yes{border-color:var(--teal-brd);color:var(--accent);background:var(--teal-dim)}
  .react .bar{height:3px;background:var(--border);margin-top:10px;border-radius:2px;overflow:hidden}
  .react .bar i{display:block;height:100%;width:100%;background:var(--amber)}

  /* ── merkinnät alalehtenä: ei vie tilaa kentältä ───────────────────── */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:29;display:none}
  .scrim.auki{display:block}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);
         border-top:.5px solid var(--border);border-radius:18px 18px 0 0;max-height:82vh;display:flex;
         flex-direction:column;transform:translateY(105%);transition:transform .26s cubic-bezier(.2,.8,.2,1);
         box-shadow:0 -10px 40px rgba(0,0,0,.45);padding-bottom:var(--sab)}
  .sheet.auki{transform:translateY(0)}
  .sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--border);margin:8px auto 0}
  .sheet .sh{display:flex;gap:12px;align-items:baseline;padding:6px 14px 8px}
  .sheet .sh h2{margin:0;font-family:var(--font-serif);font-weight:400;font-size:22px}
  .sheet .body{overflow-y:auto;padding:4px 14px 10px;-webkit-overflow-scrolling:touch;flex:1 1 auto}
  .sheet .foot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 14px 14px;
               border-top:.5px solid var(--border)}
  .tbtn{font-size:13px;padding:12px 16px;border-radius:10px;border:.5px solid var(--teal-brd);
        background:var(--teal-dim);color:var(--accent);font-weight:600;cursor:pointer;font-family:inherit}
  .tbtn.sec{border-color:var(--border);background:transparent;color:var(--ink2);font-weight:500}
  #tallennusteksti{font-size:11.5px;color:var(--ink3)}

  /* ── aloitusruutu / asetuspaneeli ──────────────────────────────────── */
  .overlay{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;
           padding:calc(14px + var(--sat)) 14px calc(20px + var(--sab))}
  .overlay .card{width:100%;max-width:760px;margin:0 auto}
  .overlay h1{margin:6px 0 4px}
  .overlay .lead{color:var(--ink2);font-size:13.5px;margin:0 0 14px;line-height:1.5}
  .primary{width:100%;margin-top:6px;border:none;background:var(--accent);color:#08110E;border-radius:13px;
           padding:16px;font-size:15.5px;font-weight:600;cursor:pointer;font-family:inherit}
  .primary:disabled{opacity:.4;cursor:default}
  .fine{font-size:11.5px;color:var(--ink3);text-align:center;margin-top:10px;line-height:1.45}
  .fine.vihje{border:.5px solid var(--border);background:var(--surface);border-radius:10px;padding:10px 12px;text-align:left}

  /* ── läpikäynti ─────────────────────────────────────────────────────── */
  .panel{background:var(--surface);border:.5px solid var(--border);border-radius:12px;padding:12px 14px}
  .panel h2{font-family:var(--font-serif);font-weight:400;font-size:18px;margin:0 0 2px}
  .pmeta{font-family:var(--font-mono);font-size:10px;color:var(--ink3);margin-bottom:8px}
  .entry{padding:8px 0;border-bottom:.5px solid var(--border2)}
  .entry.linked{padding-left:14px;border-left:1.5px solid var(--teal-brd);margin-left:4px}
  .erow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:8px;align-items:start}
  .et{font-family:var(--font-mono);font-size:10px;color:var(--ink3);padding-top:2px}
  .type{font-size:11.5px;font-weight:500}
  .type.syotto{color:var(--accent)} .type.syotto-x{color:var(--amber)}
  .type.kuljetus,.type.etenee{color:var(--accent)} .type.juoksu{color:var(--violet)}
  .type.riisto{color:var(--blue)} .type.laukaus{color:var(--accent)}
  .type.vlaukaus{color:var(--red)} .type.menetys{color:var(--amber)}
  .type.v1-ok{color:var(--accent)} .type.v1-x{color:var(--amber)}
  .type.v1-def{color:var(--blue)} .type.v1-beaten{color:var(--red)} .type.v1-neutral{color:var(--ink2)}

     -peilausta eikä pystyasennon kiertoa itse, jottei tallennettu piste voi kääntyä eri tavalla
     kuin se luetaan. `pysty` on libin parametri, ei sivun oma laskenta. */
  function kaantoOpts() { return { puoliaika: S.puoliaika, seisoo: S.seisoo, pysty: PYSTY }; }
  function ruudulle(p) {
    var n = PH.phNaytolle(p, kaantoOpts());
    return n ? { x: PX + n.x / 100 * IW, y: PY + n.y / 100 * IH } : null;
  }
  function kentalle(sx, sy) {
    return PH.phNaytolta((sx - PX) / IW * 100, (sy - PY) / IH * 100, kaantoOpts());
  }

  function piirraKentta() {
    if (!svg) return;
    svg.innerHTML = '';
    var g = luo('g', {});
    var L = { fill: 'none', stroke: 'var(--pitch-line)', 'stroke-width': 1.2 };
    luo('rect', { x: 0, y: 0, width: W, height: H, fill: 'var(--pitch)', rx: 6 }, g);
    luo('rect', Object.assign({ x: PX, y: PY, width: IW, height: IH }, L), g);
    if (!PYSTY) {
      luo('line', Object.assign({ x1: W / 2, y1: PY, x2: W / 2, y2: H - PY }, L), g);
      luo('ellipse', Object.assign({ cx: W / 2, cy: H / 2, rx: IW * 9.15 / 105, ry: IH * 9.15 / 68 }, L), g);
      var bw = IW * 16.5 / 105, bh = IH * 40.3 / 68, gw = IW * 5.5 / 105, gh = IH * 18.3 / 68;
      [PX, W - PX].forEach(function (x0, i) {
        luo('rect', Object.assign({ x: i ? x0 - bw : x0, y: H / 2 - bh / 2, width: bw, height: bh }, L), g);
        luo('rect', Object.assign({ x: i ? x0 - gw : x0, y: H / 2 - gh / 2, width: gw, height: gh }, L), g);
      });
    } else {
      luo('line', Object.assign({ x1: PX, y1: H / 2, x2: W - PX, y2: H / 2 }, L), g);
      luo('ellipse', Object.assign({ cx: W / 2, cy: H / 2, rx: IW * 9.15 / 68, ry: IH * 9.15 / 105 }, L), g);
      var bw2 = IW * 40.3 / 68, bh2 = IH * 16.5 / 105, gw2 = IW * 18.3 / 68, gh2 = IH * 5.5 / 105;
      [PY, H - PY].forEach(function (y0, i) {
        luo('rect', Object.assign({ x: W / 2 - bw2 / 2, y: i ? y0 - bh2 : y0, width: bw2, height: bh2 }, L), g);
        luo('rect', Object.assign({ x: W / 2 - gw2 / 2, y: i ? y0 - gh2 : y0, width: gw2, height: gh2 }, L), g);
      });
    }
    luo('circle', { cx: W / 2, cy: H / 2, r: 2, fill: 'var(--pitch-line)' }, g);
    kerrosMerkinnat = luo('g', { 'class': 'ents' }, g);
    kerrosLive = luo('g', {}, g);
    paivitaSuuntamerkki();
  }

  /* Suuntamerkki kentän PÄÄLLÄ, ei palkissa: kenttätilassa palkkia ei aina näy,
     ja suunta on se tieto jota ilman merkintä menee väärään päähän. */
  function paivitaSuuntamerkki() {
    var el = q('suuntamerkki');
    if (!el) return;
    var kaksi = S.puoliaika === 2;
    var nuoli = PYSTY ? (kaksi ? '↓' : '↑') : (kaksi ? '←' : '→');
    var p = S.pelaaja || {};
    var lead = (p.pelinumero != null) ? ('<b>#' + esc(String(p.pelinumero)) + '</b>') : '';
    el.innerHTML = lead + '<span>' + esc(phT('hyökkäys')) + '</span><span class="arr">' + nuoli + '</span>';
  }

  function variMerkinnalle(m) {
    if (m.tyyppi === 'laukaus_vastaan') return 'var(--red)';
    if (m.tyyppi === 'juoksu') return 'var(--violet)';
    if (m.tyyppi === 'riisto') return 'var(--blue)';
    if (m.tyyppi === 'menetys') return 'var(--amber)';
    if (m.tyyppi === 'syotto' && m.perilla === false) return 'var(--amber)';
    if (m.tyyppi === 'kaksinpeli') {
      if (onHyokkays1v1(m)) return m.tulos === 'ei_ohittanut' ? 'var(--amber)' : 'var(--accent)';
      return m.tulos === 'ohitettiin' ? 'var(--red)' : 'var(--blue)';
    }
    return 'var(--accent)';
  }

  /* HÄIVYTYS: kentällä näkyvät vain N viimeisintä TILANNETTA (juurta) ketjuineen. Aiemmin
     kaikki merkinnät piirrettiin, jolloin pieni kenttä täyttyi sotkusta ("merkinnät leviää").
     Vanhemmat eivät katoa — ne ovat Merkinnät-lehdessä. */
  var NAKYVIA_JUURIA = 3;

  function juuriMerkinnalle(m, kartta) {
    var r = m, kierros = 0;
    while (r && r.ketju != null && kierros < 12) { var v = kartta[r.ketju]; if (!v) break; r = v; kierros++; }
    return r;
  }

  function piirraMerkinnat() {
    if (!kerrosMerkinnat) return;
    kerrosMerkinnat.innerHTML = '';
    var kartta = {};
    S.merkinnat.forEach(function (m) { kartta[m.id] = m; });

    var puoliajalta = S.merkinnat.filter(function (m) { return m.puoliaika === S.puoliaika; });
    var juuret = puoliajalta.filter(function (m) { return m.ketju == null; });
    var sija = {}, numero = {};
    juuret.forEach(function (r, i) { numero[r.id] = i + 1; });
    juuret.slice().reverse().forEach(function (r, i) { sija[r.id] = i; });   // 0 = uusin

    puoliajalta.forEach(function (m) {
      if (m.eiSijaintia || m.tyyppi === 'hetki') return;
      var juuri = juuriMerkinnalle(m, kartta);
      var rk = sija[juuri.id];
      if (rk == null || rk >= NAKYVIA_JUURIA) return;      // vanhat vain listassa
      var vari = variMerkinnalle(m);
      var onJuuri = m.ketju == null;
      if (m.alku && m.loppu) {
        var a = ruudulle(m.alku), b = ruudulle(m.loppu);
        if (!a || !b) return;
        luo('line', {
          x1: a.x, y1: a.y, x2: b.x, y2: b.y, stroke: vari, 'stroke-width': m.tyyppi === 'kuljetus' ? 2.8 : 2.2,
          'stroke-dasharray': (m.tyyppi === 'juoksu' ? '2 4' : (m.perilla === false ? '6 4' : '')),
          'stroke-linecap': 'round',
        }, kerrosMerkinnat);
        luo('circle', { cx: b.x, cy: b.y, r: 4.5, fill: vari }, kerrosMerkinnat);
        if (onJuuri) merkkiPallo(a, numero[juuri.id], vari, true);
      } else if (m.piste) {
        var pp = ruudulle(m.piste);
        if (!pp) return;
        if (m.tyyppi === 'laukaus' || m.tyyppi === 'laukaus_vastaan') {
          luo('circle', { cx: pp.x, cy: pp.y, r: 14, fill: 'none', stroke: vari, 'stroke-width': 1.3 }, kerrosMerkinnat);
        }
        if (m.tyyppi === 'kaksinpeli') {
          luo('rect', {
            x: pp.x - 13, y: pp.y - 13, width: 26, height: 26, fill: 'none', stroke: vari,
            'stroke-width': 1.6, transform: 'rotate(45 ' + pp.x + ' ' + pp.y + ')',
          }, kerrosMerkinnat);
        }
        if (onJuuri) merkkiPallo(pp, numero[juuri.id], vari, m.tyyppi !== 'laukaus' && m.tyyppi !== 'laukaus_vastaan');
      }
    });
  }

  /* Numeroitu merkki: valmentaja tunnistaa tilanteen kentältä ja listasta samalla numerolla. */
  function merkkiPallo(p, nro, vari, taytetty) {
    luo('circle', {
      cx: p.x, cy: p.y, r: 10.5, fill: taytetty ? vari : 'var(--surface)', stroke: vari, 'stroke-width': 1.6,
    }, kerrosMerkinnat);
    var teksti = luo('text', {
      x: p.x, y: p.y + 3.7, 'text-anchor': 'middle', 'font-family': 'DM Mono, monospace',
      'font-size': 10.5, 'font-weight': 600, fill: taytetty ? 'var(--pitch)' : vari,
    }, kerrosMerkinnat);
    teksti.textContent = nro == null ? '' : String(nro);
  }

  /* ── VALITSIN ──────────────────────────────────────────────────────── */
  var valitsin = null;
  function svgPiste(ev) {
    var pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
    var r = pt.matrixTransform(svg.getScreenCTM().inverse());
    return { x: r.x, y: r.y };
  }
  function laatikkoPos(p) {
    var pt = svg.createSVGPoint(); pt.x = p.x; pt.y = p.y;
    var c = pt.matrixTransform(svg.getScreenCTM());
    var br = laatikko.getBoundingClientRect();
    return { x: c.x - br.left, y: c.y - br.top };
  }
  function suljeValitsin(peru) {
    if (laatikko) laatikko.classList.remove('valitsee');
    if (!valitsin) return;
    var v = valitsin; valitsin = null; clearInterval(v.timer); v.el.remove();
    if (!peru && v.aikakatkaisu) v.aikakatkaisu();
  }
  function naytaValitsin(sp, items, ikkunaMs, aikakatkaisu) {
    suljeValitsin(true);
    var pos = laatikkoPos(sp), bw = laatikko.clientWidth, bh = laatikko.clientHeight;
    var ylos = pos.y > bh * 0.45 ? -1 : 1;
    var el = document.createElement('div'); el.className = 'chooser';
    el.style.left = pos.x + 'px'; el.style.top = pos.y + 'px';
    el.innerHTML = ikkunaMs ? '<div class="cd"></div>' : '';
    var n = items.length, sade = Math.min(92, Math.max(66, bh * 0.24));
    /* RAJAUS LAATIKKOON: nappi on 82×62 px, joten reunamarginaali on sen puolikas. Ilman tätä
       valikko leikkautui kentän reunalla. Pystyasennossa neljä vaihtoehtoa ei mahdu kaarelle
       — ne asetellaan kahteen sarakkeeseen, kuten 2A:ssa. */
    var MX = 46, MY = 34;
    items.forEach(function (it, i) {
      var dx, dy;
      if (PYSTY && n > 3) {
        var sar = i % 2, rivi = Math.floor(i / 2);
        dx = sar ? 50 : -50;
        dy = (sade * 0.85 + rivi * 70) * ylos;
      } else {
        var levitys = n > 3 ? 80 : 70, rr = n > 3 ? sade * 1.25 : sade;
        var kulma = n === 1 ? 0 : (-levitys + 2 * levitys * i / (n - 1));
        var rad = kulma * Math.PI / 180;
        dx = Math.sin(rad) * rr * (n > 3 ? 1.6 : 1);
        dy = Math.cos(rad) * rr * ylos;
      }
      var b = document.createElement('button'); b.type = 'button'; b.className = 'cbtn ' + (it.cls || '');
      b.innerHTML = (it.sub ? '<span class="sub">' + esc(phT(it.sub)) + '</span>' : '')
        + (it.ic ? '<span class="ic">' + it.ic + '</span>' : '') + esc(phT(it.t));
      b.style.left = (klamppi(pos.x + dx, MX, Math.max(MX, bw - MX)) - pos.x) + 'px';
      b.style.top = (klamppi(pos.y + dy, MY, Math.max(MY, bh - MY)) - pos.y) + 'px';
      b.addEventListener('pointerdown', function (ev) { ev.stopPropagation(); });
      b.addEventListener('click', function (ev) {
        ev.stopPropagation();
        var v = valitsin; valitsin = null;
        if (v) { clearInterval(v.timer); v.el.remove(); }
        it.fn();
      });
      el.appendChild(b);
    });
    var x = document.createElement('button'); x.type = 'button'; x.className = 'cbtn x';
    x.textContent = '✕'; x.title = phT('Peru');
    x.style.left = '0px'; x.style.top = (-44 * ylos) + 'px';
    x.addEventListener('pointerdown', function (ev) { ev.stopPropagation(); });
    x.addEventListener('click', function (ev) { ev.stopPropagation(); suljeValitsin(true); });
    el.appendChild(x);
    laatikko.appendChild(el);
    laatikko.classList.add('valitsee');
    valitsin = { el: el, aikakatkaisu: aikakatkaisu, timer: null };
    if (ikkunaMs) {
      var alku = Date.now(), cd = el.querySelector('.cd');
      valitsin.timer = setInterval(function () {
        var jaljella = ikkunaMs - (Date.now() - alku);
        if (cd) cd.textContent = Math.max(0, Math.ceil(jaljella / 1000));
        if (jaljella <= 0) suljeValitsin(false);
      }, 100);
    }
  }

  /* ── ELEET (kolme: napautus · pyyhkäisy · pito) ────────────────────── */
  var LIIKE_RAJA_PX = 10;   // alle tämän liike on napautus (sormi ei pysy paikallaan)
  var veto = null;
  function alustaEleet() {
    svg.addEventListener('pointerdown', function (ev) {
      if (valitsin) suljeValitsin(false);
      if (reaktioEl) paataReaktio('ei');
      try { svg.setPointerCapture(ev.pointerId); } catch (e) { /* ei kriittinen */ }
      var p = svgPiste(ev);
      /* Napautuksen ja pyyhkäisyn raja mitataan RUUDUN pikseleissä, ei SVG-yksiköissä:
         sama sormen liike tarkoittaisi eri asiaa eri kokoisella kentällä. */
      veto = { alku: p, ruutuAlku: { x: ev.clientX, y: ev.clientY }, liikkui: false, pito: false, viiva: null };
      veto.ajastin = setTimeout(function () {
        if (veto && !veto.liikkui && K.juoksu) {
          veto.pito = true; varise(8);
          luo('circle', { cx: p.x, cy: p.y, r: 14, fill: 'none', stroke: 'var(--violet)', 'stroke-width': 1.5 }, kerrosLive);
        }
      }, 380);
    });
    svg.addEventListener('pointermove', function (ev) {
      if (!veto) return;
      var p = svgPiste(ev);
      var rdx = ev.clientX - veto.ruutuAlku.x, rdy = ev.clientY - veto.ruutuAlku.y;
      if (!veto.liikkui && Math.sqrt(rdx * rdx + rdy * rdy) > LIIKE_RAJA_PX) {
        veto.liikkui = true; clearTimeout(veto.ajastin);
      }
      if (veto.liikkui) {
        var c = veto.pito ? 'var(--violet)' : 'var(--accent)';
        if (!veto.viiva) {
          veto.viiva = luo('line', {
            x1: veto.alku.x, y1: veto.alku.y, x2: p.x, y2: p.y, stroke: c,
            'stroke-width': 2.5, 'stroke-dasharray': veto.pito ? '2 4' : '6 4',
          }, kerrosLive);
        }
        veto.viiva.setAttribute('x2', p.x); veto.viiva.setAttribute('y2', p.y);
      }
    });
    svg.addEventListener('pointerup', paataVeto);
    svg.addEventListener('pointercancel', paataVeto);
  }
  function paataVeto(ev) {
    if (!veto) return;
    clearTimeout(veto.ajastin);
    var d = veto; veto = null;
    if (kerrosLive) kerrosLive.innerHTML = '';
    if (ev.type === 'pointercancel') return;
    var p = svgPiste(ev);
    if (d.liikkui) {
      var alku = kentalle(d.alku.x, d.alku.y), loppu = kentalle(p.x, p.y);
      if (d.pito && K.juoksu) { lisaa({ tyyppi: 'juoksu', alku: alku, loppu: loppu }); return; }
      if (S.odottaa) {
        var w = S.odottaa; S.odottaa = null; vihje(null);
        if (w.laji === 'syotto') { kysySyotonTulos(p, { tyyppi: 'syotto', alku: alku, loppu: loppu, ketju: w.juuriId }); return; }
        var k = lisaa({ tyyppi: 'kuljetus', alku: alku, loppu: loppu, ketju: w.juuriId });
        kysyKuljetuksenLoppu(p, k); return;
      }
      kysySiirronTyyppi(p, alku, loppu);
    } else if (!d.pito) {
      avaaNapautusvalikko(d.alku);
    }
  }

  /* NAPAUTUSVALIKKO — enintään NELJÄ vaihtoehtoa (§0.1). Omalla kolmanneksella oma laukaus
     vaihtuu vastustajan laukaukseen: sieltä ei ammuta kohti vastustajan maalia. */
  /* YKSI LÄHDE: valikon SISÄLTÖ päätetään täällä ja DOM rakennetaan siitä. Erillinen replika
     testejä varten olisi voinut ajautua erilleen — silloin vartija olisi vartioinut kopiota. */
  /* JARJESTYS ON TIETOINEN, EI SATTUMA (§0b: enintaan 4 vaihtoehtoa).
     Omassa paassa yleisimmat tilanteet ovat riisto, 1v1 ja menetys — vastustajan laukaus on
     harvinaisin. Aiemmin se oli ensimmaisena, isoimmalla paikalla ja punaisena, mika nayttaytyi
     kentalla siten etta "omassa puolustuspaassa se ehdotti laukauksen blokkaamista". Kyse ei ole
     suuntabugista: kaanto ja kolmannestunnistus ovat oikein, vain jarjestys oli vaara.
     Muualla kentalla jarjestys sailyy ennallaan (laukaus ensin = oma maalipaikka). */
  function napautusvalikonAvaimet(piste, rastit) {
    var r = rastit || K, out = [];
    var v = PH.phVyohyke ? PH.phVyohyke(piste) : null;
    var omaKolmannes = !!(v && v.kolmannes === 'puolustus');
    if (omaKolmannes) {
      if (r.riisto) out.push('riisto');
      if (r.v1) out.push('v1');
      if (r.menetys) out.push('menetys');
      /* Laukaisuvaihtoehto on omalla kolmanneksella VIIMEISENA — se on harvinaisin.
         Korvaussaanto sailyy: vastustajan laukaus syrjayttaa oman, mutta jos rastia ei ole,
         oma laukaisu on yha tarjolla (puolustaja voi laukoa myos omalla puoliskolla). */
      if (r.vastustajan_laukaus) out.push('vastustajan_laukaus');
      else if (r.laukaus) out.push('laukaus');
      return out;
    }
    if (r.laukaus) out.push('laukaus');
    if (r.riisto) out.push('riisto');
    if (r.menetys) out.push('menetys');
    if (r.v1) out.push('v1');
    return out;
  }
  window._phNapautusvalikkoItems = napautusvalikonAvaimet;

  function avaaNapautusvalikko(sp) {
    var piste = kentalle(sp.x, sp.y);
    var TEOT = {
      vastustajan_laukaus: { cls: 'red', ic: '⚠', t: 'Vastustaja laukoi', fn: function () { kysyVastustajanLaukaus(sp, piste); } },
      laukaus: { cls: 'teal', ic: '🎯', t: 'Laukaisu', fn: function () { kysyLaukaus(sp, piste, null); } },
      riisto: { cls: 'blue', ic: '🛡️', t: 'Riisto', fn: function () { var e = lisaa({ tyyppi: 'riisto', piste: piste }); kysyRiistonJatko(sp, e); } },
      menetys: { cls: 'amber', ic: '↩', t: 'Menetys', fn: function () { lisaa({ tyyppi: 'menetys', piste: piste }); } },
      v1: { cls: '', ic: '⚔', t: '1v1', fn: function () { kysy1v1(sp, piste); } },
    };
    var items = napautusvalikonAvaimet(piste).map(function (a) { return TEOT[a]; });
    if (!items.length) return;
    naytaValitsin(sp, items, 0, null);
  }

  function kysyVastustajanLaukaus(sp, piste) {
    var mk = function (t) { return function () { lisaa({ tyyppi: 'laukaus_vastaan', piste: piste, tulos: t }); }; };
    naytaValitsin(sp, [
      { cls: 'blue', t: 'Blokattu', fn: mk('blokattu') },
      { cls: '', t: 'Torjuttu', fn: mk('torjuttu') },
      { cls: 'red', t: 'Maali', fn: mk('maali') },
      { cls: '', t: 'Ohi', fn: mk('ohi') },
    ], PH.PH_VALINTA_IKKUNA_MS, function () { lisaa({ tyyppi: 'laukaus_vastaan', piste: piste, tulos: null }); });
  }
  function kysy1v1(sp, piste) {
    var mk = function (rooli, tulos) {
      return function () {
        var e = lisaa({ tyyppi: 'kaksinpeli', rooli: rooli, tulos: tulos, piste: piste });
        if (rooli === 'hyokkays' && tulos === 'ohitti') kysyOhituksenJatko(sp, e);
        if (rooli === 'puolustus' && tulos === 'voitti') kysyRiistonJatko(sp, e);
      };
    };
    naytaValitsin(sp, [
      { cls: 'teal', sub: 'Hyökkäys', t: 'Ohitti ✓', fn: mk('hyokkays', 'ohitti') },
      { cls: 'amber', sub: 'Hyökkäys', t: 'Ei ohittanut', fn: mk('hyokkays', 'ei_ohittanut') },
      { cls: 'blue', sub: 'Puolustus', t: 'Voitti pallon', fn: mk('puolustus', 'voitti') },
      { cls: '', sub: 'Puolustus', t: 'Viivytti', fn: mk('puolustus', 'viivytti') },
      { cls: 'red', sub: 'Puolustus', t: 'Ohitettiin', fn: mk('puolustus', 'ohitettiin') },
    ], 0, null);
  }
  function kysyRiistonJatko(sp, e) {
    naytaValitsin(sp, [
      { cls: 'teal', ic: '↗', t: 'Syöttö', fn: function () { e.jatko = 'syotto'; odotaPyyhkaisya(e.piste, e.id, 'syotto'); } },
      { cls: 'teal', ic: '➜', t: 'Kuljetus', fn: function () { e.jatko = 'kuljetus'; odotaPyyhkaisya(e.piste, e.id, 'kuljetus'); } },
      { cls: 'blue', ic: '●', t: 'Säilyi omilla', fn: function () { e.jatko = 'sailyi'; piirra(); } },
      { cls: '', ic: '⤴', t: 'Selvitys', fn: function () { e.jatko = 'selvitys'; piirra(); } },
      { cls: 'amber', ic: '↩', t: 'Menetys', fn: function () { e.jatko = 'menetys'; lisaa({ tyyppi: 'menetys', piste: e.piste, ketju: e.id }); } },
      { cls: 'blue', ic: '⚑', t: 'Rikottiin', fn: function () { e.jatko = 'rikottiin'; piirra(); } },
    ], PH.PH_VALINTA_IKKUNA_MS, function () { piirra(); });
  }
  function kysyOhituksenJatko(sp, e) {
    naytaValitsin(sp, [
      { cls: 'teal', ic: '↗', t: 'Syöttö', fn: function () { e.jatko = 'syotto'; odotaPyyhkaisya(e.piste, e.id, 'syotto'); } },
      { cls: 'teal', ic: '➜', t: 'Kuljetus', fn: function () { e.jatko = 'kuljetus'; odotaPyyhkaisya(e.piste, e.id, 'kuljetus'); } },
      { cls: 'teal', ic: '🎯', t: 'Laukaisu', fn: function () { e.jatko = 'laukaus'; piirra(); kysyLaukaus(sp, e.piste, e.id); } },
      { cls: 'amber', ic: '↩', t: 'Menetys', fn: function () { e.jatko = 'menetys'; lisaa({ tyyppi: 'menetys', piste: e.piste, ketju: e.id }); } },
      { cls: '', ic: '●', t: 'Säilyi', fn: function () { e.jatko = 'sailyi'; piirra(); } },
    ], PH.PH_VALINTA_IKKUNA_MS, function () { piirra(); });
  }
  function odotaPyyhkaisya(piste, juuriId, laji) {
    if (!K[laji]) { piirra(); return; }        // rasti pois: lopputulos kirjataan, pyyhkäisyä ei pyydetä
    S.odottaa = { len: piste.len, wid: piste.wid, juuriId: juuriId, laji: laji };
    vihje(laji === 'syotto' ? 'Pyyhkäise syöttö' : 'Pyyhkäise kuljetus');

  }
  function kysySiirronTyyppi(sp, alku, loppu) {
    if (!K.syotto && !K.kuljetus) return;
    if (!K.syotto) { var ek = lisaa({ tyyppi: 'kuljetus', alku: alku, loppu: loppu }); kysyKuljetuksenLoppu(sp, ek); return; }
    var items = [
      { cls: 'teal', ic: '✓', t: 'Syöttö perille', fn: function () { lisaa({ tyyppi: 'syotto', alku: alku, loppu: loppu, perilla: true }); } },

    if (K.kuljetus) items.push({ cls: 'teal', ic: '➜', t: 'Kuljetus', fn: function () { var e = lisaa({ tyyppi: 'kuljetus', alku: alku, loppu: loppu }); kysyKuljetuksenLoppu(sp, e); } });
    naytaValitsin(sp, items, PH.PH_VALINTA_IKKUNA_MS, function () {

  }
  function kysySyotonTulos(sp, pohja) {

  }
  function kysyKuljetuksenLoppu(sp, e) {
    naytaValitsin(sp, [
      { cls: 'teal', ic: '↗', t: 'Syöttö', fn: function () { e.lopputuote = 'syotto'; odotaPyyhkaisya(e.loppu, e.id, 'syotto'); } },
      { cls: 'teal', ic: '🎯', t: 'Laukaisu', fn: function () { e.lopputuote = 'laukaus'; piirra(); kysyLaukaus(sp, e.loppu, e.id); } },
      { cls: 'amber', ic: '↩', t: 'Menetys', fn: function () { e.lopputuote = 'menetys'; lisaa({ tyyppi: 'menetys', piste: e.loppu, ketju: e.id }); } },

  }
  function kysyLaukaus(sp, piste, juuri) {
    /* `ketju` KIRJOITETAAN VAIN JOS SE ON. Aiemmin tassa oli `ketju: juuri || undefined`, ja
       Firestore compat -SDK hylkaa KOKO set()-kutsun jos yhdessakin kentassa on undefined
       ("Unsupported field value: undefined ... merkinnat.N.ketju"). Luonnos (JSON) pudottaa
       kentan pois, joten vika katosi sivunlatauksen jalkeen — siksi se nayttaytyi satunnaisena
       "tallennus epaonnistui — kirjaukset ovat tallessa laitteella". */
    var mk = function (t) {
      return function () {
        var m = { tyyppi: 'laukaus', piste: piste, tulos: t };
        if (juuri) m.ketju = juuri;

      };
    };
    naytaValitsin(sp, [
      { cls: 'teal', t: 'Maali', fn: mk('maali') },
      { cls: 'teal', t: 'Torjuttu', fn: mk('torjuttu') },
      { cls: '', t: 'Ohi', fn: mk('ohi') },
      { cls: '', t: 'Blokattu', fn: mk('blokattu') },
    ], PH.PH_VALINTA_IKKUNA_MS, function () {
      var m = { tyyppi: 'laukaus', piste: piste, tulos: null };
      if (juuri) m.ketju = juuri;
      lisaa(m);
    });
  }

  var vihjeEl = null;
  function vihje(t) {
    if (vihjeEl) { vihjeEl.remove(); vihjeEl = null; }
    if (!t) return;
    vihjeEl = document.createElement('div'); vihjeEl.className = 'hintbar';
    vihjeEl.textContent = phT(t);
    laatikko.appendChild(vihjeEl);
  }
  function varise(ms) { try { if (navigator.vibrate) navigator.vibrate(ms || 15); } catch (e) { /* ei tuettu */ } }

  /* ── MERKINNÄN LISÄYS ──────────────────────────────────────────────── */
  function lisaa(m) {
    m.id = ++S.seq;
    m.puoliaika = S.puoliaika;
    m.t = kelloSekunnit();
    S.merkinnat.push(m);
    S.viimeisinId = m.id;
    varise(15);
    piirra();
    naytaKumoa(m);
    tallennaLuonnos();
    if (vaatiiReaktion(m) && K.reaktio) kysyReaktio(m);
    return m;
  }
  /* Kello näyttää KULUVAN PUOLIAJAN ajan nollasta. Merkinnän `t` on sekunteja oman puoliajan
     alusta, ja `puoliaika`-kenttä erottaa ne — muuten 2. puoliajan merkinnät saisivat ajat,
     jotka jatkuvat ensimmäisestä ja näyttäisivät vääriltä läpikäynnissä. */
  function puoliajanAlku() {
    if (S.puoliaika === 2) return S.alkoi2 || S.alkoi;
    return S.alkoi;
  }
  function kelloSekunnit() {
    var alku = puoliajanAlku();
    if (!alku) return 0;
    if (S.paattynyt) return S.kelloPysahtyi || 0;
    return Math.max(0, Math.round((Date.now() - alku) / 1000));
  }

  var kumoaEl = null, kumoaAjastin = null;
  function naytaKumoa(m) {
    piilotaKumoa();
    kumoaEl = document.createElement('div'); kumoaEl.className = 'toast';
    var s = document.createElement('span');
    s.textContent = nimiMerkinnalle(m) + ' · ' + kelloTeksti(m.t);
    kumoaEl.appendChild(s);
    var b = document.createElement('button'); b.type = 'button'; b.textContent = phT('Kumoa');
    b.onclick = kumoa;
    kumoaEl.appendChild(b);
    laatikko.appendChild(kumoaEl);
    q('btnKumoa').disabled = false;
    kumoaAjastin = setTimeout(function () { piilotaKumoa(); q('btnKumoa').disabled = true; }, 5000);
  }
  function piilotaKumoa() {
    clearTimeout(kumoaAjastin);
    if (kumoaEl) { kumoaEl.remove(); kumoaEl = null; }
  }
  function kumoa() {
    if (S.viimeisinId == null) return;
    var id = S.viimeisinId;
    /* PUOLIAJAN RAJA: 1. puoliajan merkintää ei saa kumota 2. puoliajalla. Kumoa on
       "viimeisin virhe pois", ei yleinen poistotoiminto — tauon jälkeen edellinen merkintä
       ei ole enää se, jonka valmentaja luulee kumoavansa. */
    var kohde = S.merkinnat.filter(function (x) { return x.id === id; })[0];
    if (kohde && kohde.puoliaika !== S.puoliaika) { S.viimeisinId = null; piilotaKumoa(); return; }
    S.merkinnat = S.merkinnat.filter(function (x) { return x.id !== id; });
    if (S.odottaa && S.odottaa.juuriId === id) { S.odottaa = null; vihje(null); }
    S.viimeisinId = null; piilotaKumoa();
    if (reaktioEl) paataReaktio(null, true);
    suljeValitsin(true);
    q('btnKumoa').disabled = true;
    varise(30); piirra(); tallennaLuonnos();
  }

  /* ── REAKTIOKYSELY ─────────────────────────────────────────────────── */
  var reaktioEl = null, reaktioAjastin = null, reaktioKohde = null;
  function kysyReaktio(m) {
    if (reaktioEl) paataReaktio('ei');
    reaktioKohde = m;
    var ohitettu = onPuolustus1v1(m);
    reaktioEl = document.createElement('div'); reaktioEl.className = 'react';
    reaktioEl.innerHTML = '<div class="q">'
      + esc(phT(ohitettu ? 'Palautuiko heti ohituksen jälkeen?' : 'Reagoiko heti menetyksen jälkeen?'))
      + '<span>5 s</span></div><div class="opts">'
      + '<button type="button" class="yes">✓ ' + esc(phT(ohitettu ? 'Palautui' : 'Reagoi heti')) + '</button>'
      + '<button type="button" class="no">✗ ' + esc(phT('Jäi')) + '</button></div>'
      + '<div class="bar"><i></i></div>';
    laatikko.appendChild(reaktioEl);
    var bar = reaktioEl.querySelector('.bar i'), sek = reaktioEl.querySelector('.q span'), alku = Date.now();
    reaktioAjastin = setInterval(function () {
      var jaljella = 5000 - (Date.now() - alku);
      bar.style.width = Math.max(0, jaljella / 50) + '%';
      sek.textContent = Math.ceil(Math.max(0, jaljella) / 1000) + ' s';

    }, 100);
    reaktioEl.querySelector('.yes').onclick = function () { varise(15); paataReaktio('heti'); };
    reaktioEl.querySelector('.no').onclick = function () { varise(15); paataReaktio('jai'); };
  }
  function paataReaktio(v, hiljaa) {

  }

  /* ── ARVOT LIBISTÄ ─────────────────────────────────────────────────── */
  /* LUVUT NAKYVAT AINA. Tama on VALMENTAJAN ja VP:n tyokalu — ei pelaajan. Aiemmin sivu kutsui
     libin `phNaytaLuvut(ikataso)`:a, jolloin alle 13-vuotiaan (ja jokaisen pelaajan, jolta
     puuttuu syntymaVuosi → ikataso 'u812') kohdalla jokaisen merkinnan arvo oli "· ei lukuja"
     ja yhteenvedon tilalla luki "Alle 13-vuotiaille ei nayteta lukuja". Laskenta toimi koko
     ajan; vain naytto oli estetty, eika seura nahnyt omaa dataansa.
     Pelaajan ja perheen saanto EI muutu: se on libissa `phNaytaLuvutPelaajalle`, eika tama
     sivu kutsu sita. (Tuotepaatos 28.9.2026, Tero.) */
  function naytaLuvut() { return true; }

  function tiedot(m) {
    var o = { kuvaus: '', arvo: '', ala: '', hi: false };
    if (m.eiSijaintia && m.tyyppi !== 'hetki') {
      o.kuvaus = phT('Täydennetty tauolla, ilman sijaintia'); o.arvo = '—'; return o;
    }
    if (m.tyyppi === 'hetki') { o.kuvaus = phT('📌 Merkitty nopeasti. Täydennä tyyppi.'); o.arvo = '—'; return o; }

    var a = PH.phArvo ? PH.phArvo(m, S.pelimuoto) : null;
    /* Kuvaus on UI:n asia; ARVO tulee aina libistä. Taso- ja luokka-avaimet käännetään tässä. */
    if (m.tyyppi === 'syotto') {
      o.kuvaus = (m.perilla === false)
        ? (phT('Kohti:') + ' ' + vyohykeTeksti(m.loppu) + '. ' + phT('Ei perillä.'))
        : (vyohykeTeksti(m.alku) + ' → ' + vyohykeTeksti(m.loppu) + (m.perilla == null ? ' ' + phT('(perillä?)') : ''));
    } else if (m.tyyppi === 'kuljetus' || m.tyyppi === 'etenee') {
      o.kuvaus = vyohykeTeksti(m.alku) + ' → ' + vyohykeTeksti(m.loppu) + (m.ohitus ? ' · ' + phT('sisälsi ohituksen') : '');
    } else if (m.tyyppi === 'juoksu') {
      o.kuvaus = phT('Juoksu tilaan, pallo ei tullut:') + ' ' + vyohykeTeksti(m.loppu);
    } else if (m.tyyppi === 'riisto') {
      o.kuvaus = (m.tapa ? phT(TXT_TAPA[m.tapa]) + ': ' : phT('Voitti pallon') + ': ') + vyohykeTeksti(m.piste)
        + (m.jatko ? ' → ' + phT(TXT_JATKOD[m.jatko]) : '');
    } else if (m.tyyppi === 'laukaus' || m.tyyppi === 'laukaus_vastaan') {
      var vastaan = m.tyyppi === 'laukaus_vastaan';
      o.kuvaus = (vastaan ? phT('Vastustajan laukaus') : phT('Laukaisu')) + ' · '
        + (m.tulos ? phT(TXT_VLAUK[m.tulos] || m.tulos) : phT('tulos puuttuu'))
        + (vastaan && m.tulos === 'blokattu' && m.itse ? ' · ' + phT('pelaaja blokkasi') : '');
    } else if (m.tyyppi === 'menetys') {
      o.kuvaus = phT('Menetti pallon:') + ' ' + vyohykeTeksti(m.piste);
    } else if (m.tyyppi === 'kaksinpeli') {
      o.kuvaus = vyohykeTeksti(m.piste) + (m.jatko ? ' → ' + phT(TXT_JATKOD[m.jatko] || TXT_JATKO[m.jatko] || m.jatko) : '');
    }

    if (!a) { o.arvo = '—'; }
    else if (a.laji === 'uhka' || a.laji === 'potentiaali') {
      o.arvo = uhkaTeksti(a.pisteet);
      o.ala = phT(a.laji === 'uhka' ? 'uhka-arvo' : 'potentiaali');
    } else if (a.laji === 'puolustus') {
      o.arvo = uhkaTeksti(a.pisteet); o.ala = phT('puolustusarvo');
    } else if (a.laji === 'menetysriski' || a.laji === 'tilanteen_vaara') {
      o.arvo = phT(a.taso || ''); o.ala = phT(a.laji === 'menetysriski' ? 'menetysriski' : 'tilanteen vaara');
      o.hi = (a.taso === 'korkea');
    } else if (a.laji === 'xg' || a.laji === 'xg_vastaan') {
      o.arvo = a.pisteet.toFixed(2).replace('.', ',');
      o.ala = (m.tulos === 'blokattu' && m.itse) ? phT('estetty xG')
        : phT(a.laji === 'xg' ? 'maaliodotusarvo' : 'xG vastaan');
    }
    /* §5.5 / §7.22: U8–12 ei näe lukuja lainkaan — ei työkalussakaan, ettei valmentaja lue niitä
       ääneen lapselle. Tilanteet ja 1v1-tulokset näkyvät, luvut eivät. */
    return o;
  }

  function tyyppiLuokka(m) {
    if (m.tyyppi === 'syotto' && m.perilla === false) return 'syotto-x';
    if (m.tyyppi === 'laukaus_vastaan') return 'vlaukaus';
    if (m.tyyppi === 'kaksinpeli') {
      if (onHyokkays1v1(m)) return m.tulos === 'ei_ohittanut' ? 'v1-x' : 'v1-ok';
      return m.tulos === 'voitti' ? 'v1-def' : (m.tulos === 'ohitettiin' ? 'v1-beaten' : 'v1-neutral');
    }
    return m.tyyppi;
  }

  /* KONSEPTIVALINTA EI OLE TÄSSÄ TYÖKALUSSA (Tero 29.9.2026, Android-testi): se toi kentälle vain
     hämmennystä, ja pikavalinta tuotti vääriä konsepteja (puolustuksen 1v1 "ohitettiin" → Y-H5
     Pallon suojaaminen). Konsepti valitaan pikakortissa, kun tarkkailusta tehdään pelihavainto.
     Vanhojen dokumenttien `m.konsepti` saa jäädä — kukaan ei lue sitä. */

  /* ── LÄPIKÄYNTI ────────────────────────────────────────────────────── */
  function lab(p, t) { var l = document.createElement('span'); l.className = 'lab'; l.textContent = phT(t); p.appendChild(l); }
  function vipu(parent, otsikko, opts, m, avain) {
    lab(parent, otsikko);
    opts.forEach(function (o) {
      var b = document.createElement('button'); b.type = 'button'; b.className = 'chip ' + (o[2] || '');
      b.setAttribute('aria-pressed', m[avain] === o[0] ? 'true' : 'false');
      b.textContent = phT(o[1]);
      b.onclick = function () { m[avain] = (m[avain] === o[0]) ? null : o[0]; piirra(); tallennaLuonnos(); };
      parent.appendChild(b);
    });
  }

  /* KYTKIN, joka kirjoittaa kentän VAIN arvolla true ja poistaa sen muuten (`delete`). Firestore
     compat hylkää koko set()-kutsun, jos jossakin kentässä on undefined (sama syy kuin `ketju`-
     kentän ehdollisessa kirjoituksessa, ks. kysyLaukaus), ja false/null olisi turha kenttä. */
  function kytkin(parent, otsikko, m, avain) {
    var b = document.createElement('button'); b.type = 'button'; b.className = 'chip';
    b.setAttribute('aria-pressed', m[avain] === true ? 'true' : 'false');
    b.textContent = phT(otsikko);
    b.onclick = function () {
      if (m[avain] === true) delete m[avain]; else m[avain] = true;
      piirra(); tallennaLuonnos();
    };
    parent.appendChild(b);
  }
  window._phKytkin = kytkin;   // testivartija

  function piirra() {
    piirraMerkinnat();
    paivitaPalkki();
    if (typeof paivitaVaihepainike === 'function') paivitaVaihepainike();
    var juuret = S.merkinnat.filter(function (m) { return m.ketju == null; });
    q('rmeta').textContent = juuret.length + ' ' + phT('tilannetta');

    var lista = q('merkinnat'); lista.innerHTML = '';
    var nakyy = S.merkinnat.slice().sort(function (a, b) {
      return (a.puoliaika - b.puoliaika) || (a.t - b.t) || (a.id - b.id);
    });
    if (!nakyy.length) {
      lista.innerHTML = '<div class="tyhja">' + esc(phT('Ei vielä merkintöjä. Napauta, pyyhkäise tai pidä pohjassa.')) + '</div>';
    }
    nakyy.forEach(function (m) {
      var o = tiedot(m);
      var d = document.createElement('div'); d.className = 'entry' + (m.ketju ? ' linked' : '');
      d.innerHTML = '<div class="erow"><div class="et">'
        + (m.ketju ? '↳' : (m.puoliaika === 2 ? '2. ' : '') + kelloTeksti(m.t)) + '</div>'
        + '<div><span class="type ' + tyyppiLuokka(m) + '">' + esc(nimiMerkinnalle(m)) + '</span>'
        + '<div class="edesc">' + esc(o.kuvaus) + '</div></div>'
        + '<div class="ev' + (o.hi ? ' hi' : '') + '">' + esc(o.arvo)
        + (o.ala ? '<small>' + esc(o.ala) + '</small>' : '') + '</div></div>';
      var chips = document.createElement('div'); chips.className = 'chips';

      if (m.tyyppi === 'hetki') {
        lab(chips, 'Tyyppi');
        [['syotto', 'Syöttö'], ['kuljetus', 'Kuljetus'], ['riisto', 'Riisto'], ['laukaus', 'Laukaisu'],
          ['menetys', 'Menetys'], ['v1a', '1v1 hyökkäys'], ['v1d', '1v1 puolustus']].forEach(function (t) {
          var b = document.createElement('button'); b.type = 'button'; b.className = 'chip';
          b.textContent = phT(t[1]);
          b.onclick = function () {
            if (t[0] === 'v1a') { m.tyyppi = 'kaksinpeli'; m.rooli = 'hyokkays'; m.tulos = null; }
            else if (t[0] === 'v1d') { m.tyyppi = 'kaksinpeli'; m.rooli = 'puolustus'; m.tulos = null; }
            else m.tyyppi = t[0];
            m.eiSijaintia = true; piirra(); tallennaLuonnos();
          };
          chips.appendChild(b);
        });
      } else {
        if (m.tyyppi === 'etenee') {
          lab(chips, 'Mikä?');
          [['syotto', 'Syöttö'], ['kuljetus', 'Kuljetus']].forEach(function (o2) {
            var b = document.createElement('button'); b.type = 'button'; b.className = 'chip';
            b.textContent = phT(o2[1]);
            b.onclick = function () { m.tyyppi = o2[0]; if (o2[0] === 'syotto') m.perilla = true; piirra(); tallennaLuonnos(); };
            chips.appendChild(b);
          });
        }
        if (m.tyyppi === 'kaksinpeli') {
          var opts = onHyokkays1v1(m)
            ? [['ohitti', 'Ohitti'], ['ei_ohittanut', 'Ei ohittanut'], ['rikottiin', 'Rikottiin']]
            : [['voitti', 'Voitti'], ['viivytti', 'Viivytti'], ['ohitettiin', 'Ohitettiin']];
          vipu(chips, 'Tulos', opts, m, 'tulos');
        }
        if (m.tyyppi === 'laukaus_vastaan') {
          vipu(chips, 'Tulos', [['blokattu', 'Blokattu'], ['torjuttu', 'Torjuttu'], ['maali', 'Maali'], ['ohi', 'Ohi']], m, 'tulos');
          if (m.tulos === 'blokattu') vipu(chips, 'Pelaaja blokkasi', [[true, '✓', '']], m, 'itse');
        }
        if (m.tyyppi === 'riisto') vipu(chips, 'Miten', [['katkaisu', 'Katkaisu'], ['taklaus', 'Taklaus'], ['irtopallo', 'Irtopallo']], m, 'tapa');
        if (m.tyyppi === 'riisto' || (onPuolustus1v1(m) && m.tulos === 'voitti')) {
          vipu(chips, 'Riiston jälkeen', Object.keys(TXT_JATKOD).map(function (k) {
            return [k, TXT_JATKOD[k].charAt(0).toUpperCase() + TXT_JATKOD[k].slice(1)];
          }), m, 'jatko');
        }

  /* ══ TILASTONÄKYMÄ ══════════════════════════════════════════════════
     YKSI renderöijä kolmelle paikalle: puoliajan läpikäynti, loppunäkymä ja Masterin lukunäkymä
     (sama sivu lukutilassa). Kaikki luvut tulevat libistä (phYhteenveto · phKarttaPisteet);
     sivu vain piirtää. Järjestys: pääluvut → kartta → lista → huomautus.
     KIRJAAMATON EI NÄY: rastittamaton lähde on libissä null, eikä sille piirretä riviä, saraketta
     eikä karttavälilehteä — viiva tai nolla väittäisi mittausta, jota ei tehty.
     NÄKYVYYS: vain valmentaja ja VP (tämä sivu). Pelaajan ja perheen näkymiin tämä ei tule. */
  var karttaTab = null;

  function xgTeksti(v) { return (typeof v === 'number' && isFinite(v)) ? v.toFixed(2).replace('.', ',') : '—'; }
  function luku(v) { return (typeof v === 'number' && isFinite(v)) ? v.toFixed(2) : '0'; }

  function tilastoPaaluvut(L) {

    if (L.luotuUhka) sar.push({ v: uhkaTeksti(L.luotuUhka.pisteet), k: 'luotu uhka' });
    if (!sar.length) return '';
    return '<div class="tv-paa" style="--sarakkeet:' + sar.length + '">' + sar.map(function (c) {
      return '<div class="pl"><div class="v' + (c.vastaan ? ' vastaan' : '') + '">' + esc(c.v) + '</div>'
        + '<div class="k">' + esc(phT(c.k)) + '</div></div>';

  /* Välilehdet VAIN sille, jolle on dataa. */
  function karttaValilehdet(kp) {
    var pit = function (x) { return !!(x && x.length); };

    if (pit(kp.laukaukset) || pit(kp.vastaan)) out.push(['laukaukset', 'Laukaukset']);
    if (pit(kp.syotot)) out.push(['syotot', 'Syötöt']);

    return out;

  /* Kartta: hyökkäys YLÖSPÄIN (sama kuin työkalun "hyökkäys ↑", 1. puoliaika lähilaidalta),
     viewBox pelimuodon METREISSÄ, jotta mittasuhteet ovat oikeat. Kääntö libin phNaytolle:lla. */
  function karttaSvg(kp, tab, pelimuoto) {
    var XT = window.TM_XT;
    var prof = (XT && XT.xtProfiili ? XT.xtProfiili(pelimuoto) : null) || { pituus: 105, leveys: 68 };
    var Lm = prof.pituus, Wm = prof.leveys, M = 2;
    var sk = Wm / 68;                                   // viivojen ja merkkien mittakaava
    var xy = function (p) {
      var n = PH.phNaytolle(p, { puoliaika: 1, seisoo: 'lahi', pysty: true });
      return n ? { x: n.x / 100 * Wm, y: n.y / 100 * Lm } : null;
    };
    var viiva = 'fill="none" stroke="var(--pitch-line)" stroke-width="' + luku(0.35 * sk) + '"';
    var h = '<svg class="tv-kartta" viewBox="' + luku(-M) + ' ' + luku(-M) + ' ' + luku(Wm + 2 * M) + ' ' + luku(Lm + 2 * M)
      + '" role="img" aria-label="' + esc(phT('Kartta')) + '">';
    h += '<rect x="0" y="0" width="' + luku(Wm) + '" height="' + luku(Lm) + '" ' + viiva + '/>';
    h += '<line x1="0" y1="' + luku(Lm / 2) + '" x2="' + luku(Wm) + '" y2="' + luku(Lm / 2) + '" ' + viiva + '/>';
    h += '<circle cx="' + luku(Wm / 2) + '" cy="' + luku(Lm / 2) + '" r="' + luku(9.15 * sk) + '" ' + viiva + '/>';
    var bw = 40.3 * sk, bd = 16.5 * Lm / 105, gw = 18.3 * sk, gd = 5.5 * Lm / 105;
    [0, 1].forEach(function (i) {
      var y0 = i ? Lm - bd : 0, y1 = i ? Lm - gd : 0;
      h += '<rect x="' + luku((Wm - bw) / 2) + '" y="' + luku(y0) + '" width="' + luku(bw) + '" height="' + luku(bd) + '" ' + viiva + '/>';
      h += '<rect x="' + luku((Wm - gw) / 2) + '" y="' + luku(y1) + '" width="' + luku(gw) + '" height="' + luku(gd) + '" ' + viiva + '/>';
    });
    var r0 = 1.1 * sk;

    if (tab === 'laukaukset') {
      var laukaus = function (p, vastaan) {
        var c = xy(p); if (!c) return '';
        var r = (typeof p.xg === 'number' && p.xg > 0) ? Math.max(r0, 6 * sk * Math.sqrt(p.xg)) : r0 * 1.3;
        var vari = vastaan ? 'var(--red)' : 'var(--accent)';
        var op = vastaan ? 0.6 : 1;
        var sw = luku(0.45 * sk);
        var ymp = function (fill, stroke, o) {
          return '<circle cx="' + luku(c.x) + '" cy="' + luku(c.y) + '" r="' + luku(r) + '" fill="' + fill
            + '" stroke="' + stroke + '" stroke-width="' + sw + '" opacity="' + o + '"/>';
        };
        if (p.tulos === 'maali') return ymp(vari, vari, op);
        if (p.tulos === 'torjuttu') return ymp('none', vari, op);
        if (p.tulos === 'ohi') return ymp('none', vari, op * 0.4);
        if (p.tulos === 'blokattu') {
          var d = r * 0.75;
          return ymp('none', vari, op * 0.35)
            + '<path d="M' + luku(c.x - d) + ' ' + luku(c.y - d) + 'L' + luku(c.x + d) + ' ' + luku(c.y + d)
            + 'M' + luku(c.x + d) + ' ' + luku(c.y - d) + 'L' + luku(c.x - d) + ' ' + luku(c.y + d)
            + '" stroke="' + vari + '" stroke-width="' + luku(0.6 * sk) + '" opacity="' + op + '"/>';
        }
        /* Tulos puuttuu → himmeä ympyrä (laukaus ei katoa kartalta). */
        return '<circle cx="' + luku(c.x) + '" cy="' + luku(c.y) + '" r="' + luku(r) + '" fill="var(--ink3)" fill-opacity=".18" stroke="var(--ink3)" stroke-width="' + sw + '" stroke-dasharray="' + luku(0.8 * sk) + ' ' + luku(0.6 * sk) + '"/>';
      };
      (kp.vastaan || []).forEach(function (p) { h += laukaus(p, true); });
      (kp.laukaukset || []).forEach(function (p) { h += laukaus(p, false); });
    } else if (tab === 'syotot') {
      /* Järjestys: tavalliset alle, avainsyötöt päällimmäisiksi. */
      var jarj = (kp.syotot || []).slice().sort(function (a, b) {
        var w = function (x) { return x.avain ? 3 : (x.murtava ? 2 : (x.perilla ? 1 : 0)); };
        return w(a) - w(b);
      });
      jarj.forEach(function (sy) {
        var a = xy(sy.alku), b = xy(sy.loppu); if (!a || !b) return;
        var vari = !sy.perilla ? 'var(--amber)' : ((sy.avain || sy.murtava) ? 'var(--accent)' : 'var(--ink3)');
        var lev = sy.avain ? 0.95 : (sy.murtava ? 0.6 : 0.4);
        var op = (sy.perilla && !sy.avain && !sy.murtava) ? 0.55 : 1;
        var dash = (sy.murtava && !sy.avain) ? ' stroke-dasharray="' + luku(1.6 * sk) + ' ' + luku(1 * sk) + '"' : '';
        var dx = b.x - a.x, dy = b.y - a.y, pit = Math.sqrt(dx * dx + dy * dy) || 1;
        var ux = dx / pit, uy = dy / pit, kr = (1.4 + lev) * sk;
        var kx = b.x - ux * kr, ky = b.y - uy * kr;
        h += '<line x1="' + luku(a.x) + '" y1="' + luku(a.y) + '" x2="' + luku(kx) + '" y2="' + luku(ky)
          + '" stroke="' + vari + '" stroke-width="' + luku(lev * sk) + '" stroke-linecap="round" opacity="' + op + '"' + dash + '/>';
        h += '<path d="M' + luku(b.x) + ' ' + luku(b.y) + 'L' + luku(kx - uy * kr * 0.55) + ' ' + luku(ky + ux * kr * 0.55)
          + 'L' + luku(kx + uy * kr * 0.55) + ' ' + luku(ky - ux * kr * 0.55) + 'Z" fill="' + vari + '" opacity="' + op + '"/>';
      });
    } else if (tab === 'pallo') {
      (kp.menetykset || []).forEach(function (p) {
        var c = xy(p); if (!c) return;
        var r = (p.taso === 'korkea') ? 1.9 * sk : 1.1 * sk;
        h += '<circle cx="' + luku(c.x) + '" cy="' + luku(c.y) + '" r="' + luku(r) + '" fill="var(--amber)" opacity=".9"/>';
      });
      (kp.riistot || []).forEach(function (p) {
        var c = xy(p); if (!c) return;
        var d = 1.5 * sk;
        h += '<path d="M' + luku(c.x) + ' ' + luku(c.y - d) + 'L' + luku(c.x + d) + ' ' + luku(c.y) + 'L' + luku(c.x) + ' ' + luku(c.y + d)
          + 'L' + luku(c.x - d) + ' ' + luku(c.y) + 'Z" fill="var(--blue)"/>';
      });
      (kp.ohitettiin || []).forEach(function (p) {
        var c = xy(p); if (!c) return;
        h += '<circle cx="' + luku(c.x) + '" cy="' + luku(c.y) + '" r="' + luku(1.7 * sk) + '" fill="none" stroke="var(--red)" stroke-width="' + luku(0.5 * sk) + '"/>';
      });
    }
    return h + '</svg>';
  }

  /* Selite YHDELLÄ rivillä 360 px:llä: symboli värillisenä (sama väri kuin kartalla) + lyhyt sana. */
  function karttaSelite(tab, kp) {

      return '<span>' + (o[0] ? '<b style="color:' + o[2] + ';font-weight:400">' + esc(o[0]) + '</b> ' : '') + esc(phT(o[1])) + '</span>';

      rivi('Kaksinkamppailut', (H.onnistui + P.voitti) + '/' + (H.yritykset + P.kaikki), [
        H.yritykset ? phT('hyökkäys') + ' ' + H.onnistui + '/' + H.yritykset : null,

  /* PIENKENTTÄ- JA KALIBROINTIHUOMAUTUS yhtenä rivinä; pitkä teksti avautuu napautuksella. */
  function tilastoHuomio(pelimuoto) {

  /* Piirtää tilastonäkymän elementtiin ja kytkee välilehdet (delegointi: innerHTML vaihtuu). */

  /* ── LUONNOS (offline-first) ───────────────────────────────────────── */
  var LUONNOS_ETULIITE = 'tm_ph_luonnos_';
  function luonnosEtuliite() { return LUONNOS_ETULIITE + S.seuraId + '_' + S.pelaajaId + '_'; }
  /* Avaimessa EI ole puoliaikaa: sama ottelu = sama luonnos, molemmat puoliajat yhdessä. */
  function luonnosAvain() { return luonnosEtuliite() + S.otteluAvain; }

  /** Tämän pelaajan tallentamattomat luonnokset, uusin ensin. Myös eiliset löytyvät. */
  function keskeneraisetLuonnokset() {
    var out = [];
    try {
      var etu = luonnosEtuliite();
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (!k || k.indexOf(etu) !== 0) continue;
        var d = JSON.parse(localStorage.getItem(k) || 'null');
        if (!d || !Array.isArray(d.merkinnat) || !d.merkinnat.length) continue;
        out.push({ avain: k, otteluAvain: k.slice(etu.length), data: d });
      }
    } catch (e) { return []; }
    out.sort(function (a, b) { return (b.data.alkoi || 0) - (a.data.alkoi || 0); });
    return out;
  }
  window._phKeskeneraiset = keskeneraisetLuonnokset;
  function tallennaLuonnos() {
    try {
      localStorage.setItem(luonnosAvain(), JSON.stringify({
        merkinnat: S.merkinnat, seq: S.seq, puoliaika: S.puoliaika, seisoo: S.seisoo,
        otteluAvain: S.otteluAvain,
        pelimuoto: S.pelimuoto, pelipaikka: S.pelipaikka, kirjattavat: rastitListaksi(),
        vastustaja: S.vastustaja, kalenteriId: S.kalenteriId, alkoi: S.alkoi, alkoi2: S.alkoi2 || null,
      }));
