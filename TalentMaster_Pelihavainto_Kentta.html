<style>

  .chooser .cbtn.amber{border-color:var(--amber-brd);background:var(--amber-dim);color:var(--amber)}
  .chooser .cbtn.red{border-color:var(--red-brd);background:var(--red-dim);color:var(--red)}
  .chooser .cbtn.x{min-width:0;padding:5px 9px;color:var(--ink3)}
  .chooser .cd{position:absolute;transform:translate(-50%,-50%);font-family:var(--font-mono);font-size:11px;color:var(--ink3)}
  .hintbar{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:15;font-size:11.5px;padding:6px 12px;border-radius:14px;background:var(--surface);border:.5px solid var(--teal-brd);color:var(--accent)}
  .toast{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:18;display:flex;align-items:center;gap:10px;font-size:11.5px;padding:7px 10px;border-radius:9px;background:var(--surface);border:.5px solid var(--border);color:var(--ink2);box-shadow:0 6px 20px rgba(0,0,0,.3)}
  .toast button{font-size:11px;padding:4px 9px;border-radius:6px;border:.5px solid var(--border);background:transparent;color:var(--accent);cursor:pointer}
  .react{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:19;width:min(300px,86%);padding:10px 12px;border-radius:10px;background:var(--surface);border:.5px solid var(--amber-brd);box-shadow:0 8px 26px rgba(0,0,0,.36)}
  .react .q{font-size:12px;color:var(--ink);display:flex;justify-content:space-between;gap:8px}
  .react .q span{font-family:var(--font-mono);font-size:10.5px;color:var(--ink3)}
  .react .opts{display:flex;gap:8px;margin-top:8px}
  .react .opts button{flex:1;font-size:12px;padding:8px;border-radius:7px;border:.5px solid var(--border);background:transparent;color:var(--ink2);cursor:pointer}
  .react .opts .yes{border-color:var(--teal-brd);color:var(--accent);background:var(--teal-dim)}
  .react .bar{height:2px;background:var(--border2);margin-top:8px;border-radius:2px;overflow:hidden}
  .react .bar i{display:block;height:100%;width:100%;background:var(--amber)}

  /* ── läpikäynti ─────────────────────────────────────────────────────── */
  .panel{background:var(--surface);border:.5px solid var(--border);border-radius:12px;padding:12px 14px}
  .panel h2{font-family:var(--font-serif);font-weight:400;font-size:18px;margin:0 0 2px}
  .pmeta{font-family:var(--font-mono);font-size:10px;color:var(--ink3);margin-bottom:8px}

  .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;align-items:center}
  .lab{font-size:8.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink3);margin-right:2px}
  .chip{font-size:10.5px;padding:4px 8px;border-radius:12px;border:.5px solid var(--border);background:transparent;color:var(--ink2);cursor:pointer}

  .chip.bad[aria-pressed="true"]{background:var(--amber-dim);border-color:var(--amber-brd);color:var(--amber)}
  select.konsepti{font-size:10.5px;padding:4px 7px;border-radius:7px;border:.5px solid var(--border);background:var(--surface2);color:var(--ink2);font-family:inherit;max-width:100%}
  .sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin-top:10px}
  .sumcell{padding:8px 9px;border:.5px solid var(--border2);border-radius:8px;background:var(--surface2)}
  .sumcell .v{font-family:var(--font-mono);font-size:15px;color:var(--ink)}

  .ketju{font-size:11.5px;color:var(--ink2);padding:5px 0;border-bottom:.5px solid var(--border2)}
  .ketju b{color:var(--accent);font-weight:500}
  .ketju.menetetty b{color:var(--amber)}
  .tyhja{font-size:12px;color:var(--ink3);padding:10px 0}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .tbtn{font-size:12px;padding:9px 14px;border-radius:8px;border:.5px solid var(--teal-brd);background:var(--teal-dim);color:var(--accent);font-weight:500;cursor:pointer}
  .tbtn.sec{border-color:var(--border);background:transparent;color:var(--ink2)}
  #tallennustila{font-size:11px;color:var(--ink3);align-self:center}

  /* YKSI @media(max-width:768px) per tiedosto (§6) — älä lisää toista lohkoa. */
  @media (max-width:768px){
    .wrap{padding:10px 10px 30px}
    .cols{grid-template-columns:minmax(0,1fr);gap:12px}
    h1{font-size:21px}
    .setup{gap:10px 14px;padding:10px}
    .erow{grid-template-columns:38px minmax(0,1fr) auto}
    .sum{grid-template-columns:repeat(auto-fit,minmax(88px,1fr))}
  }
</style>
</head>

  function kysyKuljetuksenLoppu(sp, e) {

      { cls: 'teal', ic: '↗', t: 'Syöttö', fn: function () { e.lopputuote = 'syotto'; odotaPyyhkaisya(e.loppu, e.id, 'syotto'); } },

      { cls: 'amber', ic: '↩', t: 'Menetys', fn: function () { e.lopputuote = 'menetys'; lisaa({ tyyppi: 'menetys', piste: e.loppu, ketju: e.id }); } },
      { cls: 'blue', ic: '⚑', t: 'Rikottiin', fn: function () { e.lopputuote = 'rikottiin'; piirra(); } },

  function kysyLaukaus(sp, piste, juuri) {

    ], PH.PH_VALINTA_IKKUNA_MS, function () { lisaa({ tyyppi: 'laukaus', piste: piste, tulos: null, ketju: juuri || undefined }); });

  var vihjeEl = null;
  function vihje(t) {
    if (vihjeEl) { vihjeEl.remove(); vihjeEl = null; }

    vihjeEl = document.createElement('div'); vihjeEl.className = 'hintbar';
    vihjeEl.textContent = phT(t);
    laatikko.appendChild(vihjeEl);
  }
  function varise(ms) { try { if (navigator.vibrate) navigator.vibrate(ms || 15); } catch (e) { /* ei tuettu */ } }

  /* ── MERKINNÄN LISÄYS ──────────────────────────────────────────────── */
  function lisaa(m) {
    m.id = ++S.seq;
    m.puoliaika = S.puoliaika;
    m.t = kelloSekunnit();
    if (m.konsepti == null) m.konsepti = '';
    S.merkinnat.push(m);
    S.viimeisinId = m.id;
    varise(15);
    piirra();
    naytaKumoa(m);
    tallennaLuonnos();
    if (vaatiiReaktion(m) && K.reaktio) kysyReaktio(m);
    return m;
  }
  function kelloSekunnit() {
    if (!S.alkoi) return 0;
    return Math.max(0, Math.round((Date.now() - S.alkoi) / 1000));
  }

  var kumoaEl = null, kumoaAjastin = null;
  function naytaKumoa(m) {
    piilotaKumoa();
    kumoaEl = document.createElement('div'); kumoaEl.className = 'toast';
    var s = document.createElement('span');
    s.textContent = nimiMerkinnalle(m) + ' · ' + kelloTeksti(m.t);
    kumoaEl.appendChild(s);
    var b = document.createElement('button'); b.type = 'button'; b.textContent = phT('Kumoa');
    b.onclick = kumoa;
    kumoaEl.appendChild(b);
    laatikko.appendChild(kumoaEl);
    q('btnKumoa').disabled = false;
    kumoaAjastin = setTimeout(function () { piilotaKumoa(); q('btnKumoa').disabled = true; }, 5000);
  }
  function piilotaKumoa() {
    clearTimeout(kumoaAjastin);
    if (kumoaEl) { kumoaEl.remove(); kumoaEl = null; }
  }
  function kumoa() {
    if (S.viimeisinId == null) return;
    var id = S.viimeisinId;
    S.merkinnat = S.merkinnat.filter(function (x) { return x.id !== id; });
    if (S.odottaa && S.odottaa.juuriId === id) { S.odottaa = null; vihje(null); }
    S.viimeisinId = null; piilotaKumoa();
    if (reaktioEl) paataReaktio(null, true);
    suljeValitsin(true);
    q('btnKumoa').disabled = true;
    varise(30); piirra(); tallennaLuonnos();
  }

  /* ── REAKTIOKYSELY ─────────────────────────────────────────────────── */
  var reaktioEl = null, reaktioAjastin = null, reaktioKohde = null;
  function kysyReaktio(m) {
    if (reaktioEl) paataReaktio('ei');
    reaktioKohde = m;
    var ohitettu = onPuolustus1v1(m);
    reaktioEl = document.createElement('div'); reaktioEl.className = 'react';
    reaktioEl.innerHTML = '<div class="q">'
      + esc(phT(ohitettu ? 'Palautuiko heti ohituksen jälkeen?' : 'Reagoiko heti menetyksen jälkeen?'))
      + '<span>5 s</span></div><div class="opts">'
      + '<button type="button" class="yes">✓ ' + esc(phT(ohitettu ? 'Palautui' : 'Reagoi heti')) + '</button>'
      + '<button type="button" class="no">✗ ' + esc(phT('Jäi')) + '</button></div>'
      + '<div class="bar"><i></i></div>';
    laatikko.appendChild(reaktioEl);
    var bar = reaktioEl.querySelector('.bar i'), sek = reaktioEl.querySelector('.q span'), alku = Date.now();
    reaktioAjastin = setInterval(function () {
      var jaljella = 5000 - (Date.now() - alku);
      bar.style.width = Math.max(0, jaljella / 50) + '%';
      sek.textContent = Math.ceil(Math.max(0, jaljella) / 1000) + ' s';
      if (jaljella <= 0) paataReaktio('ei');
    }, 100);
    reaktioEl.querySelector('.yes').onclick = function () { varise(15); paataReaktio('heti'); };
    reaktioEl.querySelector('.no').onclick = function () { varise(15); paataReaktio('jai'); };
  }
  function paataReaktio(v, hiljaa) {
    clearInterval(reaktioAjastin);
    if (reaktioKohde && v) reaktioKohde.reaktio = v;
    reaktioKohde = null;
    if (reaktioEl) { reaktioEl.remove(); reaktioEl = null; }
    if (!hiljaa) { piirra(); tallennaLuonnos(); }
  }

  /* ── ARVOT LIBISTÄ ─────────────────────────────────────────────────── */
  function naytaLuvut() { return PH.phNaytaLuvut ? PH.phNaytaLuvut(S.ikataso) : true; }

  function tiedot(m) {
    var o = { kuvaus: '', arvo: '', ala: '', hi: false };
    if (m.eiSijaintia && m.tyyppi !== 'hetki') {
      o.kuvaus = phT('Täydennetty tauolla, ilman sijaintia'); o.arvo = '—'; return o;
    }
    if (m.tyyppi === 'hetki') { o.kuvaus = phT('📌 Merkitty nopeasti. Täydennä tyyppi.'); o.arvo = '—'; return o; }

    var a = PH.phArvo ? PH.phArvo(m, S.pelimuoto) : null;
    /* Kuvaus on UI:n asia; ARVO tulee aina libistä. Taso- ja luokka-avaimet käännetään tässä. */
    if (m.tyyppi === 'syotto') {
      o.kuvaus = (m.perilla === false)
        ? (phT('Kohti:') + ' ' + vyohykeTeksti(m.loppu) + '. ' + phT('Ei perillä.'))
        : (vyohykeTeksti(m.alku) + ' → ' + vyohykeTeksti(m.loppu) + (m.perilla == null ? ' ' + phT('(perillä?)') : ''));
    } else if (m.tyyppi === 'kuljetus' || m.tyyppi === 'etenee') {
      o.kuvaus = vyohykeTeksti(m.alku) + ' → ' + vyohykeTeksti(m.loppu) + (m.ohitus ? ' · ' + phT('sisälsi ohituksen') : '');
    } else if (m.tyyppi === 'juoksu') {
      o.kuvaus = phT('Juoksu tilaan, pallo ei tullut:') + ' ' + vyohykeTeksti(m.loppu);
    } else if (m.tyyppi === 'riisto') {
      o.kuvaus = (m.tapa ? phT(TXT_TAPA[m.tapa]) + ': ' : phT('Voitti pallon') + ': ') + vyohykeTeksti(m.piste)
        + (m.jatko ? ' → ' + phT(TXT_JATKOD[m.jatko]) : '');
    } else if (m.tyyppi === 'laukaus' || m.tyyppi === 'laukaus_vastaan') {
      var vastaan = m.tyyppi === 'laukaus_vastaan';
      o.kuvaus = (vastaan ? phT('Vastustajan laukaus') : phT('Laukaisu')) + ' · '
        + (m.tulos ? phT(TXT_VLAUK[m.tulos] || m.tulos) : phT('tulos puuttuu'))
        + (vastaan && m.tulos === 'blokattu' && m.itse ? ' · ' + phT('pelaaja blokkasi') : '');
    } else if (m.tyyppi === 'menetys') {
      o.kuvaus = phT('Menetti pallon:') + ' ' + vyohykeTeksti(m.piste);
    } else if (m.tyyppi === 'kaksinpeli') {
      o.kuvaus = vyohykeTeksti(m.piste) + (m.jatko ? ' → ' + phT(TXT_JATKOD[m.jatko] || TXT_JATKO[m.jatko] || m.jatko) : '');
    }

    if (!a) { o.arvo = '—'; }
    else if (a.laji === 'uhka' || a.laji === 'potentiaali') {
      o.arvo = num(Math.round(a.pisteet * 1000) / 10, true);
      o.ala = phT(a.laji === 'uhka' ? 'uhka-arvo' : 'potentiaali');
    } else if (a.laji === 'puolustus') {
      o.arvo = num(Math.round(a.pisteet * 1000) / 10, true); o.ala = phT('puolustusarvo');
    } else if (a.laji === 'menetysriski' || a.laji === 'tilanteen_vaara') {
      o.arvo = phT(a.taso || ''); o.ala = phT(a.laji === 'menetysriski' ? 'menetysriski' : 'tilanteen vaara');
      o.hi = (a.taso === 'korkea');
    } else if (a.laji === 'xg' || a.laji === 'xg_vastaan') {
      o.arvo = a.pisteet.toFixed(2).replace('.', ',');
      o.ala = (m.tulos === 'blokattu' && m.itse) ? phT('estetty xG')
        : phT(a.laji === 'xg' ? 'maaliodotusarvo' : 'xG vastaan');
    }
    /* §5.5 / §7.22: U8–12 ei näe lukuja lainkaan — ei työkalussakaan, ettei valmentaja lue niitä
       ääneen lapselle. Tilanteet ja 1v1-tulokset näkyvät, luvut eivät. */
    if (!naytaLuvut()) { o.arvo = '·'; o.ala = phT('ei lukuja'); o.hi = false; }
    return o;
  }

  function tyyppiLuokka(m) {
    if (m.tyyppi === 'syotto' && m.perilla === false) return 'syotto-x';
    if (m.tyyppi === 'laukaus_vastaan') return 'vlaukaus';
    if (m.tyyppi === 'kaksinpeli') {
      if (onHyokkays1v1(m)) return m.tulos === 'ei_ohittanut' ? 'v1-x' : 'v1-ok';
      return m.tulos === 'voitti' ? 'v1-def' : (m.tulos === 'ohitettiin' ? 'v1-beaten' : 'v1-neutral');
    }
    return m.tyyppi;
  }

  /* ── KONSEPTIT (seuran nimet ja piilotukset huomioiden) ────────────── */
  function konseptiRyhmat() {
    var TT = window.TM_TT_API || window;
    var sid = S.seuraId;
    var listaa = function (items) {
      return (typeof tmKonseptiListaa === 'function') ? tmKonseptiListaa(items || [], sid) : (items || []);
    };
    var ryhmat = [];
    if (S.jaksofokus) {
      var jf = (typeof tmKonseptiResolvoi === 'function') ? tmKonseptiResolvoi(S.jaksofokus, sid) : null;
      if (jf && !(typeof tmKonseptiOnPiilotettu === 'function' && tmKonseptiOnPiilotettu(S.jaksofokus, sid))) {
        ryhmat.push([phT('📍 Jaksofokus'), [jf]]);
      }
    }
    /* Pelipaikan fundamentit VAIN jos pelipaikka on valittu — pelipaikka on valinnainen (§0.1). */
    var fundamentit = S.pelipaikka ? ((TT.TM_TT_FUNDAMENTIT || {})[S.pelipaikka] || null) : null;
    if (fundamentit) {
      var nimi = (TT.TM_TT_PELIPAIKAT && TT.TM_TT_PELIPAIKAT[S.pelipaikka]
        && (TT.TM_TT_PELIPAIKAT[S.pelipaikka].nimi || TT.TM_TT_PELIPAIKAT[S.pelipaikka])) || S.pelipaikka;
      ryhmat.push([String(nimi), listaa(fundamentit)]);
    }
    if (TT.TM_TT_YOUTH) ryhmat.push([phT('Yksilökonseptit (kaikki ikäluokat)'), listaa(TT.TM_TT_YOUTH)]);
    if (TT.TM_TT_JOUKKUE) ryhmat.push([phT('Joukkue · siirtymät'), listaa(TT.TM_TT_JOUKKUE)]);
    /* Jaksofokus ei saa toistua alempana — se on jo omana ryhmänään. */
    return ryhmat.map(function (g, i) {
      if (i === 0 && S.jaksofokus) return g;
      return [g[0], (g[1] || []).filter(function (c) { return c && c.avain !== S.jaksofokus; })];
    }).filter(function (g) { return (g[1] || []).length; });
  }
  window._phKonseptiRyhmat = konseptiRyhmat;   // testivartija

  /* ── LÄPIKÄYNTI ────────────────────────────────────────────────────── */
  function lab(p, t) { var l = document.createElement('span'); l.className = 'lab'; l.textContent = phT(t); p.appendChild(l); }
  function vipu(parent, otsikko, opts, m, avain) {
    lab(parent, otsikko);
    opts.forEach(function (o) {
      var b = document.createElement('button'); b.type = 'button'; b.className = 'chip ' + (o[2] || '');
      b.setAttribute('aria-pressed', m[avain] === o[0] ? 'true' : 'false');
      b.textContent = phT(o[1]);
      b.onclick = function () { m[avain] = (m[avain] === o[0]) ? null : o[0]; piirra(); tallennaLuonnos(); };
      parent.appendChild(b);
    });
  }

  function piirra() {
    piirraMerkinnat();
    var juuret = S.merkinnat.filter(function (m) { return m.ketju == null; });
    q('rmeta').textContent = juuret.length + ' ' + phT('tilannetta');

    var lista = q('merkinnat'); lista.innerHTML = '';
    var nakyy = S.merkinnat.slice().sort(function (a, b) {
      return (a.puoliaika - b.puoliaika) || (a.t - b.t) || (a.id - b.id);
    });
    if (!nakyy.length) {
      lista.innerHTML = '<div class="tyhja">' + esc(phT('Ei vielä merkintöjä. Napauta, pyyhkäise tai pidä pohjassa.')) + '</div>';
    }
    nakyy.forEach(function (m) {
      var o = tiedot(m);
      var d = document.createElement('div'); d.className = 'entry' + (m.ketju ? ' linked' : '');
      d.innerHTML = '<div class="erow"><div class="et">'
        + (m.ketju ? '↳' : (m.puoliaika === 2 ? '2. ' : '') + kelloTeksti(m.t)) + '</div>'
        + '<div><span class="type ' + tyyppiLuokka(m) + '">' + esc(nimiMerkinnalle(m)) + '</span>'
        + '<div class="edesc">' + esc(o.kuvaus) + '</div></div>'
        + '<div class="ev' + (o.hi ? ' hi' : '') + '">' + esc(o.arvo)
        + (o.ala ? '<small>' + esc(o.ala) + '</small>' : '') + '</div></div>';
      var chips = document.createElement('div'); chips.className = 'chips';

      if (m.tyyppi === 'hetki') {
        lab(chips, 'Tyyppi');
        [['syotto', 'Syöttö'], ['kuljetus', 'Kuljetus'], ['riisto', 'Riisto'], ['laukaus', 'Laukaisu'],
          ['menetys', 'Menetys'], ['v1a', '1v1 hyökkäys'], ['v1d', '1v1 puolustus']].forEach(function (t) {
          var b = document.createElement('button'); b.type = 'button'; b.className = 'chip';
          b.textContent = phT(t[1]);
          b.onclick = function () {
            if (t[0] === 'v1a') { m.tyyppi = 'kaksinpeli'; m.rooli = 'hyokkays'; m.tulos = null; }
            else if (t[0] === 'v1d') { m.tyyppi = 'kaksinpeli'; m.rooli = 'puolustus'; m.tulos = null; }
            else m.tyyppi = t[0];
            m.eiSijaintia = true; piirra(); tallennaLuonnos();
          };
          chips.appendChild(b);
        });
      } else {
        if (m.tyyppi === 'etenee') {
          lab(chips, 'Mikä?');
          [['syotto', 'Syöttö'], ['kuljetus', 'Kuljetus']].forEach(function (o2) {
            var b = document.createElement('button'); b.type = 'button'; b.className = 'chip';
            b.textContent = phT(o2[1]);
            b.onclick = function () { m.tyyppi = o2[0]; if (o2[0] === 'syotto') m.perilla = true; piirra(); tallennaLuonnos(); };
            chips.appendChild(b);
          });
        }
        if (m.tyyppi === 'kaksinpeli') {
          var opts = onHyokkays1v1(m)
            ? [['ohitti', 'Ohitti'], ['ei_ohittanut', 'Ei ohittanut'], ['rikottiin', 'Rikottiin']]
            : [['voitti', 'Voitti'], ['viivytti', 'Viivytti'], ['ohitettiin', 'Ohitettiin']];
          vipu(chips, 'Tulos', opts, m, 'tulos');
        }
        if (m.tyyppi === 'laukaus_vastaan') {
          vipu(chips, 'Tulos', [['blokattu', 'Blokattu'], ['torjuttu', 'Torjuttu'], ['maali', 'Maali'], ['ohi', 'Ohi']], m, 'tulos');
          if (m.tulos === 'blokattu') vipu(chips, 'Pelaaja blokkasi', [[true, '✓', '']], m, 'itse');
        }
        if (m.tyyppi === 'riisto') vipu(chips, 'Miten', [['katkaisu', 'Katkaisu'], ['taklaus', 'Taklaus'], ['irtopallo', 'Irtopallo']], m, 'tapa');
        if (m.tyyppi === 'riisto' || (onPuolustus1v1(m) && m.tulos === 'voitti')) {
          vipu(chips, 'Riiston jälkeen', Object.keys(TXT_JATKOD).map(function (k) {
            return [k, TXT_JATKOD[k].charAt(0).toUpperCase() + TXT_JATKOD[k].slice(1)];
          }), m, 'jatko');
        }
        if (m.tyyppi === 'syotto') vipu(chips, 'Perillä', [[true, '✓', ''], [false, '✗', 'bad']], m, 'perilla');
        if (m.tyyppi === 'kuljetus') {
          vipu(chips, 'Lopputuote', Object.keys(TXT_LOPPU).map(function (k) { return [k, TXT_LOPPU[k]]; }), m, 'lopputuote');
          var juuriOn1v1 = m.ketju && S.merkinnat.some(function (x) { return x.id === m.ketju && x.tyyppi === 'kaksinpeli'; });
          if (!juuriOn1v1) vipu(chips, 'Ohitti matkalla', [[true, '✓', '']], m, 'ohitus');
        }
        if (vaatiiReaktion(m)) {
          vipu(chips, onPuolustus1v1(m) ? 'Palautui' : 'Reaktio', [['heti', '✓ Heti', ''], ['jai', '✗ Jäi', 'bad']], m, 'reaktio');
        }
        if ((m.tyyppi === 'syotto' || m.tyyppi === 'kuljetus') && !m.ketju) {
          vipu(chips, 'Skannasi', [[true, '✓', ''], [false, '✗', 'bad']], m, 'skannasi');
        }
        if (!m.ketju) {
          var sel = document.createElement('select'); sel.className = 'konsepti';
          sel.setAttribute('aria-label', phT('Konsepti'));
          var op0 = document.createElement('option'); op0.value = ''; op0.textContent = phT('Konsepti…');
          sel.appendChild(op0);
          konseptiRyhmat().forEach(function (g) {
            var og = document.createElement('optgroup'); og.label = g[0];
            (g[1] || []).forEach(function (c) {
              var op = document.createElement('option');
              op.value = c.avain;                      // KANONINEN avain, ei näyttönimi
              op.textContent = (c.koodi ? c.koodi + ' ' : '') + (c.nimi || c.avain);
              if (c.avain === m.konsepti) op.selected = true;
              og.appendChild(op);
            });
            sel.appendChild(og);
          });
          sel.onchange = function () { m.konsepti = sel.value; tallennaLuonnos(); };
          chips.appendChild(sel);
        }
      }
      if (chips.childNodes.length) d.appendChild(chips);
      lista.appendChild(d);
    });

    piirraKetjut();
    piirraYhteenveto();
  }

  function dokumentti() {
    return {
      ottelu: { pelimuoto: S.pelimuoto, vastustaja: S.vastustaja || null, kalenteriId: S.kalenteriId || null },
      ikataso: S.ikataso,
      kirjattavat: rastitListaksi(),
      merkinnat: S.merkinnat,
    };
  }

  function piirraKetjut() {
    var el = q('ketjut');
    var ketjut = PH.phKetjut ? PH.phKetjut(dokumentti()) : [];
    if (!ketjut.length) { el.innerHTML = ''; return; }
    var byId = {};
    S.merkinnat.forEach(function (m) { byId[m.id] = m; });
    var h = '<div class="pmeta" style="margin-top:10px">' + esc(phT('Ketjut')) + '</div>';
    ketjut.forEach(function (k) {
      var osat = (k.jasenet || []).map(function (id) {
        var m = byId[id];
        var avain = (m && PH.phKetjuNimi) ? PH.phKetjuNimi(m, S.pelimuoto) : null;
        return esc(phT(TXT_KETJU[avain] || avain || ''));
      }).filter(Boolean);
      h += '<div class="ketju' + (k.menetetty ? ' menetetty' : '') + '">' + osat.join(' → ')
        + (naytaLuvut() ? ' <b>' + esc(num(Math.round(k.uhka * 100) / 10, true)) + '</b>' : '') + '</div>';
    });
    el.innerHTML = h;
  }

  /* Yhteenveto tulee KOKONAAN phYhteenveto:sta. Rastittamaton lähde on null, ja null renderöityy
     viivana — nolla väittäisi mittausta jota ei tehty. */
  function piirraYhteenveto() {
    var el = q('yhteenveto');
    var y = PH.phYhteenveto ? PH.phYhteenveto(dokumentti()) : null;
    if (!y) { el.innerHTML = ''; return; }
    if (!naytaLuvut()) {
      el.innerHTML = '<div class="pmeta" style="margin-top:12px">' + esc(phT('Yhteenveto')) + '</div>'
        + '<div class="tyhja">' + esc(phT('Alle 13-vuotiaille ei näytetä lukuja — tilanteet riittävät.')) + '</div>';
      return;
    }
    var L = y.luvut || {};
    var solu = function (arvo, avain) {
      return '<div class="sumcell"><div class="v">' + esc(arvo == null ? '—' : arvo) + '</div>'
        + '<div class="k">' + esc(phT(avain)) + '</div></div>';
    };
    var suhde = function (o, a, b) { return o ? (o[a] + '/' + o[b]) : null; };
    var h = '<div class="pmeta" style="margin-top:12px">' + esc(phT('Yhteenveto')) + '</div><div class="sum">';
    h += solu(L.syotot ? suhde(L.syotot, 'perille', 'yhteensa') : null, 'syötöt perille');
    h += solu(L.kuljetukset ? L.kuljetukset.n : null, 'kuljetukset');
    h += solu(L.tulot && L.tulot.hyokkayskolmannes ? L.tulot.hyokkayskolmannes.yhteensa : null, 'tulot hyökkäyskolmannekselle');
    h += solu(L.tulot && L.tulot.boksi ? L.tulot.boksi.yhteensa : null, 'tulot boksiin');
    h += solu(L.luotuUhka ? num(Math.round(L.luotuUhka.pisteet * 100) / 10, true) : null, 'luotu uhka');
    h += solu(L.xg ? L.xg.summa.toFixed(2).replace('.', ',') : null, 'xG');
    h += solu(L.ykkosetHyokkays ? suhde(L.ykkosetHyokkays, 'onnistui', 'yritykset') : null, '1v1 hyökkäys');
    h += solu(L.ykkosetPuolustus ? suhde(L.ykkosetPuolustus, 'voitti', 'kaikki') : null, '1v1 puolustus');
    h += solu(L.riistot ? L.riistot.n : null, 'riistot');
    h += solu(L.vastaprassi ? L.vastaprassi.riistot : null, 'vastaprässiriistot');
    h += solu(L.menetykset ? L.menetykset.n : null, 'menetykset');
    h += solu(L.vastustaja ? L.vastustaja.laukauksia : null, 'vastustajan laukaukset');
    h += '</div>';
    el.innerHTML = h;
  }

  /* ── LUONNOS (offline-first) ───────────────────────────────────────── */
  function luonnosAvain() {
    var pvm = new Date().toISOString().slice(0, 10);
    return 'tm_ph_luonnos_' + S.seuraId + '_' + S.pelaajaId + '_' + pvm + '_' + S.puoliaika;
  }
  function tallennaLuonnos() {
    try {
      localStorage.setItem(luonnosAvain(), JSON.stringify({
        merkinnat: S.merkinnat, seq: S.seq, puoliaika: S.puoliaika, seisoo: S.seisoo,
        pelimuoto: S.pelimuoto, pelipaikka: S.pelipaikka, kirjattavat: rastitListaksi(),
        vastustaja: S.vastustaja, kalenteriId: S.kalenteriId, alkoi: S.alkoi,
      }));
      q('tallennustila').textContent = phT('tallennettu laitteelle');
    } catch (e) { /* privaattitila / kiintiö täynnä: kirjaus jatkuu muistissa */ }
  }
  function lataaLuonnos() {
    try {
      var raaka = localStorage.getItem(luonnosAvain());
      if (!raaka) return false;
      var d = JSON.parse(raaka);
      if (!d || !Array.isArray(d.merkinnat)) return false;
      S.merkinnat = d.merkinnat;
      S.seq = d.seq || d.merkinnat.reduce(function (a, m) { return Math.max(a, m.id || 0); }, 0);
      S.seisoo = d.seisoo || S.seisoo;
      S.pelimuoto = d.pelimuoto || S.pelimuoto;
      S.vastustaja = d.vastustaja || '';
      S.kalenteriId = d.kalenteriId || null;
      S.alkoi = d.alkoi || Date.now();
      if (d.pelipaikka != null) asetaPohja(d.pelipaikka);
      if (Array.isArray(d.kirjattavat)) {
        K = {};
        d.kirjattavat.forEach(function (x) { K[x] = true; });
      }
      return true;
    } catch (e) { return false; }
  }
  function poistaLuonnos() {
    try { localStorage.removeItem(luonnosAvain()); } catch (e) { /* ei kriittinen */ }
  }
  window._phLuonnosApi = { tallenna: tallennaLuonnos, lataa: lataaLuonnos, poista: poistaLuonnos, avain: luonnosAvain };

  /* ── ASETUSRIVI ────────────────────────────────────────────────────── */
  function piirraAsetukset() {
    var TT = window.TM_TT_API || window;
    var h = '';
    h += '<div class="grp"><span class="lbl">' + esc(phT('Puoliaika')) + '</span><span class="seg">'
      + '<button type="button" data-puoliaika="1" aria-pressed="' + (S.puoliaika === 1) + '">1.</button>'
      + '<button type="button" data-puoliaika="2" aria-pressed="' + (S.puoliaika === 2) + '">2.</button></span></div>';
    h += '<div class="grp"><span class="lbl">' + esc(phT('Seison')) + '</span><span class="seg">'
      + '<button type="button" data-seisoo="lahi" aria-pressed="' + (S.seisoo === 'lahi') + '">' + esc(phT('lähilaita')) + '</button>'
      + '<button type="button" data-seisoo="kauko" aria-pressed="' + (S.seisoo === 'kauko') + '">' + esc(phT('vastalaita')) + '</button></span></div>';
    h += '<div class="grp"><span class="lbl">' + esc(phT('Pelimuoto')) + '</span><span class="seg">'
      + ['5v5', '8v8', '11v11'].map(function (pm) {
        return '<button type="button" data-pelimuoto="' + pm + '" aria-pressed="' + (S.pelimuoto === pm) + '">' + pm + '</button>';
      }).join('') + '</span></div>';

    var ppNimi = '';
    if (S.pelipaikka && TT.TM_TT_PELIPAIKAT && TT.TM_TT_PELIPAIKAT[S.pelipaikka]) {
      var v = TT.TM_TT_PELIPAIKAT[S.pelipaikka];
      ppNimi = String((v && v.nimi) || v || S.pelipaikka);
    }
    h += '<div class="grp"><span class="lbl">' + esc(phT('Pohja')) + '</span>'
      + '<span style="font-size:12px;color:var(--ink2)">' + esc(phT('Pelaajatarkkailu'))
      + (ppNimi ? ' · ' + esc(ppNimi) : '') + '</span>'
      + '<button type="button" class="linkbtn" id="btnMuokkaa">' + esc(phT('Muokkaa')) + '</button></div>';

    h += '<div class="grp"><span class="lbl">' + esc(phT('Vastustaja (valinnainen)')) + '</span>'
      + '<input type="text" id="inVastustaja" value="' + esc(S.vastustaja) + '"></div>';

    h += '<div class="rastit" id="rastit">';
    h += '<div class="grp" style="width:100%"><span class="lbl">' + esc(phT('Pelipaikka (valinnainen)')) + '</span>'
      + '<select id="selPelipaikka"><option value="">' + esc(phT('— ei pelipaikkaa —')) + '</option>'
      + Object.keys((TT.TM_TT_PELIPAIKAT || {})).map(function (k) {
        var val = TT.TM_TT_PELIPAIKAT[k];
        var nimi = String((val && val.nimi) || val || k);
        return '<option value="' + esc(k) + '"' + (S.pelipaikka === k ? ' selected' : '') + '>' + esc(nimi) + '</option>';
      }).join('') + '</select></div>';
    (PH.PH_KIRJATTAVAT || []).forEach(function (avain) {
      h += '<button type="button" class="rasti" data-rasti="' + esc(avain) + '" aria-pressed="' + (!!K[avain]) + '">'
        + esc(phT(RASTI_NIMI[avain] || avain)) + '</button>';
    });
    h += '</div>';
    q('asetukset').innerHTML = h;

    q('asetukset').querySelectorAll('[data-puoliaika]').forEach(function (b) {
      b.onclick = function () { S.puoliaika = Number(b.getAttribute('data-puoliaika')); piirraAsetukset(); paivitaPalkki(); piirra(); };
    });
    q('asetukset').querySelectorAll('[data-seisoo]').forEach(function (b) {
      b.onclick = function () { S.seisoo = b.getAttribute('data-seisoo'); piirraAsetukset(); paivitaPalkki(); piirra(); };
    });
    q('asetukset').querySelectorAll('[data-pelimuoto]').forEach(function (b) {
      b.onclick = function () { S.pelimuoto = b.getAttribute('data-pelimuoto'); piirraAsetukset(); piirra(); tallennaLuonnos(); };
    });
    q('asetukset').querySelectorAll('[data-rasti]').forEach(function (b) {
      b.onclick = function () {
        var a = b.getAttribute('data-rasti'); K[a] = !K[a];
        b.setAttribute('aria-pressed', String(!!K[a]));
        piirra(); tallennaLuonnos();
      };
    });
    var btnM = q('btnMuokkaa');
    if (btnM) btnM.onclick = function () { q('rastit').classList.toggle('auki'); };
    var inV = q('inVastustaja');
    if (inV) inV.onchange = function () { S.vastustaja = inV.value; tallennaLuonnos(); };
    var selP = q('selPelipaikka');
    if (selP) selP.onchange = function () { asetaPohja(selP.value); piirraAsetukset(); q('rastit').classList.add('auki'); piirra(); tallennaLuonnos(); };
  }
  var RASTI_NIMI = {
    syotto: 'Syötöt', kuljetus: 'Kuljetukset', v1: '1v1', laukaus: 'Omat laukaukset',
    riisto: 'Riistot', menetys: 'Menetykset', juoksu: 'Juoksut ilman palloa',
    reaktio: 'Reaktiokysely', vastustajan_laukaus: 'Vastustajan laukaukset',
  };

  function paivitaPalkki() {
    var p = S.pelaaja || {};
    var nimi = ((p.etunimi || '') + ' ' + (p.sukunimi || '')).trim() || phT('Pelaaja');
    var h = '<span class="nimi">' + esc(nimi) + '</span>';
    if (p.pelinumero != null) h += '<span class="num">#' + esc(p.pelinumero) + '</span>';
    if (S.jaksofokus) {
      var jf = (typeof tmKonseptiResolvoi === 'function') ? tmKonseptiResolvoi(S.jaksofokus, S.seuraId) : null;
      if (jf) h += '<span class="fokus">' + esc((jf.koodi ? jf.koodi + ' ' : '') + (jf.nimi || S.jaksofokus)) + '</span>';
    }
    h += '<span class="sp"></span><span class="dir">' + esc(S.puoliaika === 2 ? '← ' + phT('HYÖKKÄYS') : phT('HYÖKKÄYS') + ' →') + '</span>';
    q('pbar').innerHTML = h;
  }

  /* ── KÄYNNISTYS ────────────────────────────────────────────────────── */
  function param(nimi) {
    try { return new URLSearchParams(window.location.search).get(nimi); } catch (e) { return null; }
  }
  function virhe(t) { q('porttiVirhe').textContent = phT(t); }

  async function lataaPelaaja() {
    var snap = await _db.collection('seurat').doc(S.seuraId).collection('pelaajat').doc(S.pelaajaId).get();
    if (!snap.exists) throw new Error('pelaajaa ei löydy');
    var p = snap.data() || {};
    p.id = snap.id;
    S.pelaaja = p;
    /* Pikakentät pelaajadokumentista — EI alikokoelmakyselyjä (§26). */
    S.pelipaikka = '';
    S.jaksofokus = p.jaksofokus || (p.jaksofokus_avain || null);
    var ika = null;
    if (p.syntymaVuosi) ika = new Date().getFullYear() - Number(p.syntymaVuosi);
    S.ikataso = PH.phIkataso ? PH.phIkataso(ika) : 'u812';
    S.pelimuoto = oletusPelimuoto(S.ikataso);
    asetaPohja(p.pelipaikka || '');
    try {
      var ssnap = await _db.collection('seurat').doc(S.seuraId).get();
      S.seura = ssnap.exists ? ssnap.data() : null;
    } catch (e) { S.seura = null; }
  }

  async function kaynnista() {
    svg = q('pitch');
    laatikko = q('kenttalaatikko');
    piirraKentta();
    alustaEleet();
    if (!lataaLuonnos()) S.alkoi = Date.now();
    piirraAsetukset();
    paivitaPalkki();
    piirra();
    q('portti').style.display = 'none';
    q('sovellus').style.display = '';
    if (typeof tmLokalisoiCommon === 'function') tmLokalisoiCommon(document, null);

    q('btnKumoa').onclick = kumoa;
    q('btnHetki').onclick = function () { suljeValitsin(false); lisaa({ tyyppi: 'hetki' }); };
    q('btnUlkotila').onclick = function () {
      var on = document.body.classList.toggle('ulkotila');
      q('btnUlkotila').setAttribute('aria-pressed', String(on));
    };
    q('btnTallenna').onclick = function () {
      tallennaLuonnos();
      q('tallennustila').textContent = phT('tallennettu laitteelle');
    };
    /* Wake lock on valinnainen mukavuus: hylkäys ei saa kaataa kirjaamista. */
    try {
      if (navigator.wakeLock && navigator.wakeLock.request) navigator.wakeLock.request('screen').catch(function () {});
    } catch (e) { /* ei tuettu */ }
  }

  function naytaPortti(viesti, kentat) {
    q('portti').style.display = '';
    q('porttiTeksti').textContent = phT(viesti);
    q('porttiKentat').innerHTML = kentat || '';
  }

  async function alusta() {
    S.seuraId = param('seuraId');
    S.pelaajaId = param('pelaajaId');
    _auth.onAuthStateChanged(async function (u) {
      if (!u) {
        naytaPortti('Kirjaudu seuran tunnuksella.',
          '<input type="email" id="inEmail" placeholder="' + esc(phT('sähköposti')) + '">'
          + '<input type="password" id="inSalasana" placeholder="' + esc(phT('salasana')) + '">'
          + '<button type="button" id="btnKirjaudu">' + esc(phT('Kirjaudu')) + '</button>');
        var b = q('btnKirjaudu');
        if (b) {
          b.onclick = function () {
            virhe('');
            _auth.signInWithEmailAndPassword(q('inEmail').value.trim(), q('inSalasana').value)
              .catch(function (e) { virhe('Kirjautuminen epäonnistui.'); console.warn('[pelihavainto]', e && e.code); });
          };
        }
        return;
      }
      S.uid = u.uid;
      try {
        var tok = await u.getIdTokenResult(true);
        S.rooli = (tok.claims && tok.claims.rooli) || null;
        S.superAdmin = (S.rooli === 'super_admin' || S.rooli === 'superadmin');
        if (!S.seuraId) S.seuraId = (tok.claims && tok.claims.seuraId) || null;
      } catch (e) { /* claimit puuttuvat → seuravalitsin */ }

      /* SA:lla ei ole seuraId-claimia → seuravalitsin on AINA pakollinen (§3): automaattinen
         haku palauttaisi satunnaisen seuran. */
      if (!S.seuraId) { await naytaSeuraValitsin(); return; }
      if (!S.pelaajaId) { await naytaPelaajaValitsin(); return; }
      try { await lataaPelaaja(); } catch (e) {
        naytaPortti('Pelaajan tietoja ei saatu haettua.', '');
        virhe('Tarkista linkki.');
        return;
      }
      await kaynnista();
    });
  }

  async function naytaSeuraValitsin() {
    naytaPortti('Valitse seura.', '<select id="selSeura"></select><button type="button" id="btnSeura">'
      + esc(phT('Jatka')) + '</button>');
    try {
      var snap = await _db.collection('seurat').get();
      var sel = q('selSeura');
      snap.docs.forEach(function (d) {
        var o = document.createElement('option');
        o.value = d.id; o.textContent = (d.data() || {}).nimi || d.id;
        sel.appendChild(o);
      });
    } catch (e) { virhe('Seuroja ei saatu haettua.'); }
    q('btnSeura').onclick = function () {
      S.seuraId = q('selSeura').value;
      if (!S.pelaajaId) { naytaPelaajaValitsin(); return; }
      lataaPelaaja().then(kaynnista).catch(function () { virhe('Pelaajan haku epäonnistui.'); });
    };
  }

  /* Pelaajahaku joukkueen listasta. §18: joukkuejäsenyys on KAHDESSA kentässä, joten kysely on
     kaksoiskysely rinnakkain ja tulokset yhdistetään doc-ID:n perusteella. */
  async function haeJoukkueenPelaajat(joukkueNimi, joukkueId) {
    var col = _db.collection('seurat').doc(S.seuraId).collection('pelaajat');
    var kyselyt = [];
    if (joukkueNimi) kyselyt.push(col.where('joukkue', '==', joukkueNimi).get());
    if (joukkueId) kyselyt.push(col.where('joukkueet', 'array-contains', joukkueId).get());
    if (!kyselyt.length) kyselyt.push(col.limit(300).get());
    var tulokset = await Promise.all(kyselyt);
    var kartta = new Map();
    tulokset.forEach(function (s) {
      s.docs.forEach(function (d) { kartta.set(d.id, Object.assign({ id: d.id }, d.data())); });
    });
    return Array.from(kartta.values());
  }
  window._phHaeJoukkueenPelaajat = haeJoukkueenPelaajat;

  async function naytaPelaajaValitsin() {
    naytaPortti('Valitse pelaaja.', '<select id="selPelaaja"></select><button type="button" id="btnPelaaja">'
      + esc(phT('Jatka')) + '</button>');
    try {
      var pelaajat = await haeJoukkueenPelaajat(param('joukkue'), param('joukkueId'));
      pelaajat.sort(function (a, b) { return String(a.sukunimi || '').localeCompare(String(b.sukunimi || '')); });
      var sel = q('selPelaaja');
      pelaajat.forEach(function (p) {
        var o = document.createElement('option');
        o.value = p.id;
        o.textContent = ((p.etunimi || '') + ' ' + (p.sukunimi || '')).trim() + (p.joukkue ? ' · ' + p.joukkue : '');
        sel.appendChild(o);
      });
      if (!pelaajat.length) virhe('Joukkueesta ei löytynyt pelaajia.');
    } catch (e) { virhe('Pelaajia ei saatu haettua.'); }
    q('btnPelaaja').onclick = function () {
      S.pelaajaId = q('selPelaaja').value;
      lataaPelaaja().then(kaynnista).catch(function () { virhe('Pelaajan haku epäonnistui.'); });
    };
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', alusta);
  else alusta();
})();
</script>
</body>
