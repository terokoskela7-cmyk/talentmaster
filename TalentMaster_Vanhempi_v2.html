<style>
:root {
  --carbon:#1C1C1A; --bone:#F2EFE6;
  --teal:#1A7A5E; --teal-d:#28B090;
  --slate:#585751; --gold:#B8860B; --fire:#B85C38;
  --font-d:'Cormorant Garamond',Georgia,serif;
  --font-b:'DM Sans',system-ui,sans-serif;
  --font-m:'DM Mono',Menlo,monospace;
  --bg:#111110; --bg2:#161614; --surface:#1E1E1C; --surface2:#1A1A18;
  --border:rgba(242,239,230,.06); --border2:rgba(242,239,230,.12);
  --text:#F2EFE6; --ink2:#A8A79F; --ink3:#8BA0BC;
  /* D10: Kenttä-tokenit · D11: näyttöfontti (huoltajan näkymä noudattaa mockupia 09) */

}
/* D10 (lukittu 5.10.2026): Kenttä-tokenit molempiin teemoihin. Vaalea teema on tässä appissa vielä lepotilassa (data-theme="light" ei käytössä) — arvot valmiina 09:n mukaan. */

/* Kenttä-komponentin SISÄISET tokenit (D10-täydennys): .kt-elementin sisällä, EI :rootissa — appien omat --amber/--blue/--teal-dim (tai niiden puute) pysyvät ennallaan,
   joten vanhojen elementtien värit eivät muutu. Eivät ole globaaleja. Vaalea teema lepotilassa (data-theme="light" ei käytössä tässä appissa). */
.kt { --amber:#E0A040; --blue:#7FA6DE; --teal-dim:rgba(40,176,144,.16); --ink:var(--text); }
:root[data-theme="light"] .kt { --amber:#9A6512; --blue:#3D6AA8; --teal-dim:rgba(26,122,94,.12); }
/* D11 (lukittu 5.10.2026): pelaaja-appin näyttöfontti Archivo — OMALTA palvelimelta (@fontsource-variable/archivo), ei Google Fontsista. K0: määritelty, EI vielä käytössä

@font-face { font-family:'Archivo Variable'; font-style:normal; font-display:swap; font-weight:100 900; font-stretch:62% 125%;

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-b);background:#0a0a08;color:var(--text);min-height:100dvh;overflow-x:hidden;font-size:14px;line-height:1.7}
button{font-family:var(--font-b);cursor:pointer}

.wrap{max-width:100%;margin:0 auto;padding:14px 8px 40px;text-align:center}

/* Switcher */
.age-bar{display:inline-flex;gap:3px;background:rgba(242,239,230,.04);padding:3px;border-radius:20px;margin-bottom:10px}
.age-btn{background:transparent;color:var(--ink3);border:none;padding:6px 14px;font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;border-radius:18px;cursor:pointer;transition:all .15s}
.age-btn.on{background:var(--teal);color:var(--text)}

.scene-bar{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-bottom:10px}
.sp{background:rgba(242,239,230,.04);color:var(--ink3);border:.5px solid rgba(242,239,230,.1);padding:4px 9px;font-size:9px;letter-spacing:.16em;text-transform:uppercase;font-weight:500;border-radius:14px;cursor:pointer;transition:all .12s}
.sp.on{background:var(--teal);color:var(--text);border-color:var(--teal)}

.hint{font-size:10px;color:var(--ink3);margin-bottom:10px;letter-spacing:.04em;max-width:540px;margin-left:auto;margin-right:auto;line-height:1.55}
/* Dev-chrome (otsikko/hint/ikä-bar/scene-bar) — piilossa tuotannossa, näkyy vain ?demo=1 */
#devChrome{display:none}
body.demo-mode #devChrome{display:block}

/* Phone */
.phone{width:min(390px,100vw);margin:0 auto;background:var(--bg);border-radius:36px;border:1px solid #222;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 8px #1a1a1a;position:relative;overflow:hidden;text-align:left}
.ph-status{height:42px;padding:14px 24px 0;display:flex;justify-content:space-between;font-family:var(--font-m);font-size:12px;font-weight:500}
.ph-body{height:700px;overflow-y:auto;position:relative}
.scroll{padding:10px 18px 90px}

.tabs{position:sticky;bottom:0;background:var(--bg2);border-top:.5px solid var(--border2);display:flex;justify-content:space-around;padding:8px 0 14px}
.tb{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 12px;color:var(--ink3)}
.tb.on{color:var(--text)}
.tb svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tb.on svg{stroke:var(--teal-d);stroke-width:1.8}
.tb-lbl{font-size:9px;font-weight:500;letter-spacing:.12em;text-transform:uppercase}

.ey{font-size:9px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--ink3)}
.ey.ac{color:var(--teal-d)}

.card{background:var(--surface);border:.5px solid var(--border);border-radius:10px;padding:14px}
.card2{background:var(--surface2);border:.5px solid var(--border);border-radius:10px;padding:14px}
.card-warm{background:linear-gradient(180deg,rgba(184,134,11,.1),rgba(184,134,11,.02));border:.5px solid rgba(184,134,11,.28);border-radius:14px}
.card-teal{background:linear-gradient(180deg,rgba(26,122,94,.12),rgba(26,122,94,.02));border:.5px solid rgba(26,122,94,.3);border-radius:14px}

@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes heartbeat{0%,20%{transform:scale(1)}10%{transform:scale(1.15)}}
.scene{animation:fadeUp .28s ease}

/* Week dots */
.week-dots{display:flex;gap:4px}
.wd{flex:1;height:26px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;letter-spacing:.08em;color:var(--ink3);background:var(--surface2);border:.5px solid var(--border)}
.wd.done{background:rgba(26,122,94,.12);border-color:rgba(26,122,94,.35);color:#28B090}
.wd.miss{opacity:.45}
.wd.today{border-color:var(--teal-d)}

/* Streak flame */
.flame-dot{width:8px;height:8px;border-radius:50%;background:#B85C38;animation:heartbeat 2s ease infinite}

.divider{height:.5px;background:var(--border);margin:18px -2px}

/* Live-tila */
.live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#28B090;animation:heartbeat 2s ease infinite;margin-right:6px}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:9999;padding:11px 18px;background:rgba(26,122,94,.95);color:#fff;border-radius:22px;font-size:12px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:fadeUp .3s ease}

/* ── Tervetulo-overlay (Aloita tästä, Vaihe 2) — slide-in transformilla (§6: ei display:none-bugia) ── */
.vth-ov{position:fixed;inset:0;z-index:9500;background:rgba(6,9,15,.78);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .3s ease}
.vth-ov.vth-auki{opacity:1}
.vth-panel{background:var(--bg2);border:1px solid rgba(40,176,144,.35);border-radius:18px 18px 0 0;width:100%;max-width:480px;padding:22px 20px 26px;transform:translateY(100%);transition:transform .34s cubic-bezier(.34,1.4,.5,1);max-height:92vh;overflow-y:auto}
.vth-ov.vth-auki .vth-panel{transform:translateY(0)}
.vth-otsikko{font-family:'Cormorant Garamond',serif;font-size:25px;color:var(--text);margin-bottom:8px}
.vth-johdanto{font-size:14px;color:var(--text);line-height:1.5;margin-bottom:14px}
.vth-kultainen{background:rgba(224,160,64,.1);border:.5px solid rgba(224,160,64,.4);border-radius:12px;padding:13px 15px;font-size:13px;color:var(--text);line-height:1.5;margin-bottom:16px}
.vth-kultainen b{color:#E0A040}
.vth-listaots{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);margin-bottom:8px}
.vth-rivi{display:flex;align-items:center;gap:12px;width:100%;background:var(--surface);border:.5px solid var(--border2);border-radius:10px;padding:13px 14px;margin-bottom:8px;cursor:pointer;text-align:left;color:var(--text)}
.vth-tick{flex-shrink:0;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ink3);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--ink3)}
.vth-tick.vth-on{background:var(--teal-d);border-color:var(--teal-d);color:#fff}
.vth-rivi-txt{flex:1;font-size:13.5px;line-height:1.35}
.vth-arrow{color:var(--ink3);font-size:18px}
.vth-napit{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.vth-selva{width:100%;background:var(--teal-d);color:#fff;border:none;border-radius:10px;padding:14px;font-size:15px;font-weight:600;cursor:pointer;min-height:44px}
.vth-ohita{width:100%;background:transparent;color:var(--ink2);border:none;padding:8px;font-size:13px;cursor:pointer;min-height:44px}
@media(max-width:768px){
  .vth-panel{max-width:100%;border-radius:16px 16px 0 0}
  .vth-otsikko{font-size:23px}
}

<script>
// FIX 3: dev-chrome (otsikko/hint/ikä-bar/scene-bar) näkyy vain ?demo=1 — muuten piilossa.
try { if (new URLSearchParams(location.search).get('demo') === '1') document.body.classList.add('demo-mode'); } catch(e) {}
/* ════════════════════════════════════════════════
   IKÄ-ADAPTIIVISUUS
   U12: Agentti — voi kirjata, lämmin tone, pallopelit
   U15: Tuki     — näkee, rohkaisee, ei kirjaa
   U19: Vieras   — viikkokooste, kepeä kieli
════════════════════════════════════════════════ */
// Demo-OLETUKSET (ikävaihekehys). Nimi/ryhmä/hero/ika ylikirjoitetaan oikealla
// pelaajadatalla _kasitteleLapsi():ssä. valmentaja ei käytössä (haetaan Firestoresta).
// vinkki = yleinen ohje vanhemmalle (ei pelaajakohtaista keksittyä dataa).
const IKA = {
  u12: {
    nimi:'Pelaaja', ika:11, ryhma:'Joukkue',
    otsikko:(e)=>_genetiivi(e)+' viikko',
    hero: { t:'vanhempi.hero_tervetuloa', s:'vanhempi.koti_treenitiedot_tyhja' },
    vinkki: 'vanhempi.vinkki_u12',
    kirjaaNakyva: true,
    valmentaja: '',
  },
  u15: {
    nimi:'Pelaaja', ika:14, ryhma:'Joukkue',

    hero: { t:'vanhempi.hero_tervetuloa', s:'vanhempi.koti_treenitiedot_tyhja' },
    vinkki: 'vanhempi.vinkki_u15',
    kirjaaNakyva: false,

  u19: {

    valmentaja: '',

};

// Suomen genetiivi etunimelle (esim. -s → -ksen, vokaali → -n, konsonantti → -in)
function _genetiivi(nimi) {
  if (!nimi) return '';
  const n = nimi.trim();
  const viim = n[n.length-1].toLowerCase();
  if (viim === 's') return n.slice(0,-1) + 'ksen';     // päättyy s:ään → -ksen
  if ('aeiouäöy'.includes(viim)) return n + 'n';        // päättyy vokaaliin → -n
  return n + 'in';                                       // konsonantti → -in
}

let _age='u12';
let _sc='login';  // Avataan aina login-näkymästä

// Firebase
let _db = null;
let _auth = null;

function setAge(a){
  _age=a;
  document.querySelectorAll('.age-btn').forEach(b=>b.classList.toggle('on',b.dataset.age===a));
  // kirjaa-tab piilotetaan paitsi u12:lla
  const kBtn = document.querySelector('[data-s="kirjaa"]');
  if(kBtn) kBtn.style.display = a==='u12' ? '' : 'none';
  if(_sc==='kirjaa' && a!=='u12') _sc='koti';
  draw();
}

function go(s){
  if(s==='kirjaa' && _age!=='u12') return;
  _sc=s;
  document.querySelectorAll('.sp').forEach(b=>b.classList.toggle('on',b.dataset.s===s));
  draw();
}

/* ══ LOGIN — sähköpostikirjautuminen vanhemmalle ════════════════════ */
let _loginEmail = '';
let _loginPass  = '';
let _loginErr   = '';
let _loginLng   = false; // loading

function rLogin() {
  return `
<div class="scroll" style="display:flex;flex-direction:column;min-height:100%;justify-content:center;padding:0 24px 40px">

  <!-- Logo + otsikko -->
  <div style="text-align:center;margin-bottom:32px;padding-top:40px">
    <div style="font-family:var(--font-d);font-weight:300;font-size:32px;color:var(--text);letter-spacing:-.5px;line-height:1.1">
      TalentMaster
    </div>
    <div style="font-size:11px;letter-spacing:.22em;color:var(--ink3);margin-top:6px;text-transform:uppercase">
      ${t('vanhempi.perhe_kirjautuminen')}
    </div>
  </div>

  <!-- V1-B — kielivalitsin kirjautumisessa (GDPR/perhe: kieli valittavissa aina) -->
  <div style="margin-bottom:22px">${_vanhKieliValitsinHTML()}</div>

  <!-- Lomake -->
  <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:20px">
    <input
      id="loginEmail"
      type="email"
      placeholder="${t('auth.sahkoposti')}"
      autocomplete="username"
      value="${_loginEmail}"
      oninput="_loginEmail=this.value"
      style="width:100%;padding:13px 14px;background:var(--surface);border:.5px solid ${_loginErr?'rgba(184,92,56,.6)':'var(--border2)'};
             border-radius:10px;color:var(--text);font-family:var(--font-b);font-size:14px;
             box-sizing:border-box;outline:none;transition:border .15s"
    />
    <input
      id="loginPass"
      type="password"
      placeholder="${t('auth.salasana')}"
      autocomplete="current-password"
      oninput="_loginPass=this.value"
      onkeydown="if(event.key==='Enter')_teeSisaankirjautuminen()"
      style="width:100%;padding:13px 14px;background:var(--surface);border:.5px solid ${_loginErr?'rgba(184,92,56,.6)':'var(--border2)'};
             border-radius:10px;color:var(--text);font-family:var(--font-b);font-size:14px;
             box-sizing:border-box;outline:none;transition:border .15s"
    />
    ${_loginErr ? `<div style="font-size:11px;color:#E05C38;text-align:center;padding:4px 0">${_loginErr}</div>` : ''}
  </div>

  <!-- Kirjaudu-nappi -->
  <button
    onclick="_teeSisaankirjautuminen()"
    ${_loginLng ? 'disabled' : ''}
    style="width:100%;padding:14px;background:${_loginLng?'rgba(26,122,94,.4)':'var(--teal)'};
           color:var(--text);border:none;border-radius:10px;font-size:12px;
           font-weight:600;letter-spacing:.18em;text-transform:uppercase;
           cursor:${_loginLng?'default':'pointer'};transition:background .2s"
  >
    ${_loginLng ? t('vanhempi.login_lataus') : t('vanhempi.login_otsikko')}
  </button>

  <!-- Apuviesti -->
  <div style="text-align:center;margin-top:20px;font-size:11px;color:var(--ink3);line-height:1.6">
    ${t('vanhempi.tunnukset_saat_seuran_toimistosta')}<br>
    ${t('vanhempi.login_ohje')}
  </div>

  <!-- Salasana unohtunut -->
  <button
    onclick="_lahetaSalasananpalautus()"
    style="margin-top:12px;background:transparent;border:none;
           color:rgba(26,122,94,.7);font-size:11px;letter-spacing:.1em;
           cursor:pointer;text-decoration:underline;text-underline-offset:3px"
  >
    ${t('vanhempi.unohtuiko_salasana')}
  </button>

</div>`;
}

async function _teeSisaankirjautuminen() {
  const email = _loginEmail.trim();
  const pass  = _loginPass;

  if (!email || !pass) {
    _loginErr = t('vanhempi.login_syota');
    draw(); return;
  }

  _loginLng = true;
  _loginErr = '';
  draw();

  try {
    await tmYritaUudelleenVerkkokatkossa(() => _auth.signInWithEmailAndPassword(email, pass));   // verkkokatko → 1 uusi yritys
    // onAuthStateChanged hoitaa loput — siirtyy kotiin automaattisesti
    _loginPass = '';  // älä säilytä salasanaa muistissa
  } catch(e) {
    _loginLng = false;
    if (tmOnVerkkokatko(e)) tmRaportoiVerkkokatko('vanhempiKirjautuminen');
    _loginErr =
      tmOnVerkkokatko(e)                  ? tmVerkkoViesti() :
      e.code === 'auth/wrong-password'    ? t('vanhempi.login_vaara_salasana') :
      e.code === 'auth/user-not-found'    ? t('vanhempi.login_ei_sahkopostia') :
      e.code === 'auth/invalid-email'     ? t('vanhempi.login_tarkista_sahkoposti') :
      e.code === 'auth/too-many-requests' ? t('vanhempi.login_liikaa') :
      e.code === 'auth/invalid-credential'? t('vanhempi.login_vaara_tunnus') :
      t('vanhempi.login_epaonnistui');
    draw();
  }
}

async function _lahetaSalasananpalautus() {
  const email = _loginEmail.trim();
  if (!email) {
    _loginErr = t('vanhempi.login_kirjoita_email');
    draw(); return;
  }
  try {
    await _auth.sendPasswordResetEmail(email);
    _loginErr = '';
    _toast(t('vanhempi.toast_reset_linkki'));
  } catch(e) {
    _loginErr = t('vanhempi.login_ei_jarjestelmassa');
    draw();
  }
}

function _renderLiveFeed(){
  if(!window.TMBus) return '';
  const evts=TMBus.getEventsFor(_childId).slice(-5).reverse();
  if(!evts.length) return '';
  const fmtTime=(ts)=>{
    const diff=Date.now()-ts;
    if(diff<60000) return t('vanhempi.aika_juuri_nyt');
    if(diff<3600000) return t('vanhempi.aika_min_sitten').replace('{n}', Math.floor(diff/60000));
    if(diff<86400000) return t('vanhempi.aika_h_sitten').replace('{n}', Math.floor(diff/3600000));
    return t('vanhempi.aika_pv_sitten').replace('{n}', Math.floor(diff/86400000));
  };
  return `
  <div style="margin:14px 0 18px">
    <div class="ey" style="margin-bottom:10px;display:flex;align-items:center;gap:6px"><span class="live-dot"></span>${t('vanhempi.viim_tapahtumat')}</div>
    <div style="display:flex;flex-direction:column;gap:8px">
      ${evts.map(e=>{
        if(e.type==='coach_message'){
          return `<div style="padding:11px 13px;background:rgba(26,122,94,.08);border-left:2px solid var(--teal);border-radius:6px">
            <div style="font-size:10px;color:#28B090;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px">${t('vanhempi.valmentajalta')} · ${fmtTime(e.at)}</div>
            <div style="font-size:12px;color:var(--text);line-height:1.55">${e.text||''}</div>
          </div>`;
        }
        if(e.type==='training'){
          const src=e.source==='parent'?t('vanhempi.src_kirjasit'):(e.source==='coach'?t('vanhempi.src_joukkue'):t('vanhempi.src_omatoimi'));
          return `<div style="padding:11px 13px;background:var(--surface);border:.5px solid var(--border2);border-radius:6px;display:flex;justify-content:space-between;align-items:center">
            <div>
              <div style="font-size:11px;color:var(--text);font-weight:500">${src} · ${e.tyyppi || t('vanhempi.tyyppi_treeni')}</div>
              <div style="font-size:10px;color:var(--ink3);margin-top:2px">${fmtTime(e.at)}${e.minutes?' · '+e.minutes+' min':''}</div>
            </div>
            ${e.fiilis?`<div style="font-size:18px">${['','🤕','😴','😐','😊','💪'][e.fiilis]||'😊'}</div>`:''}
          </div>`;
        }
        if(e.type==='coach_react'){
          return `<div style="padding:9px 13px;background:rgba(242,239,230,.03);border-radius:6px;font-size:11px;color:var(--ink2)">
            ${t('vanhempi.valmentaja_reagoi').replace('{emoji}', e.emoji||'❤️')} · ${fmtTime(e.at)}
          </div>`;
        }
        return '';
      }).join('')}
    </div>
  </div>`;
}

    : ((v && v.luotu && v.luotu.toDate) ? v.luotu.toDate().getTime() : 0);
  return ms > 0 && ms > _vViimeksiNahty();
}

function _valmentajaUusinHtml(){

    return `<div class="card2" style="padding:16px;text-align:center">
      <div style="font-size:12px;color:var(--ink3);line-height:1.6">${t('vanhempi.koti_valmentaja_tyhja')}</div>

function _valmentajaListaHtml(){
  if (!_valmentajaViestit || _valmentajaViestit.length === 0) {
    return `<div class="card" style="padding:24px 18px;text-align:center">
      <div style="font-size:13px;color:var(--ink3);line-height:1.6">${t('vanhempi.koti_valmentaja_tyhja')}</div>
    </div>`;
  }
  /* UUSI-merkki on VIIVA, ei sana: uusi käyttöliittymäteksti vaatisi uuden i18n-avaimen, ja
     sv-pariteettiportti hylkäisi fi-avaimen ilman ruotsia — ruotsia ei kirjoiteta tässä PR:ssä
     (sanktiointi kulkee Geminin kautta). Sama koskee tekstia "Pelihavainto, jonka valmentaja
     jakoi {nimi}:lle": se lisätään i18n-vaiheessa. Toiminnallisuus (perhe näkee samat tekstit
     kuin pelaaja) on tässä kokonaan. */
  const h = _valmentajaViestit.map(function(v){
    const pvm = _vViestiPvm(v);
    const uusi = _vOnUusi(v);
    const tekija = v.tekija ? _vEsc(v.tekija) : '';
    return `<div class="card2" style="padding:14px;margin-bottom:8px${uusi ? ';border-left:2px solid var(--teal-d)' : ''}">
      <div style="font-size:10px;color:var(--teal-d);letter-spacing:.12em;font-weight:600;margin-bottom:6px">${tekija}${tekija && pvm ? ' · ' : ''}${pvm}</div>
      <div style="font-size:12px;color:var(--ink2);line-height:1.55">${_vEsc(_vViestiTeksti(v))}</div>
    </div>`;
  }).join('');
  /* Lista nähtiin → seuraavalla avauksella "uusi" koskee vain tämän jälkeen tulleita. */
  _vMerkitseNahdyksi();
  return h;
}

/* Toggle monivalinnassa — lisää tai poista tyyppi */
function _toggleTyyppi(k) {
  if (_pTyypit.has(k)) {
    _pTyypit.delete(k);
  } else {
    _pTyypit.add(k);
  }
  draw();
}

async function _perheKirjaa(){
  if(_pTyypit.size===0 || !_pFiilis || !_pMinuutit) return;

  const fiilisMap = {vasynyt:2, iloinen:4, innoissaan:5, loukkasi:1};
  const tyypit    = [..._pTyypit];
  // Onko pallokosketusta mukana — pihapeli tai leikkiä pallolla
  const onT       = tyypit.some(t => t==='pihapeli' || t==='pallo');
  const paatyyppi = onT ? 'T' : 'vapaa';   // T = tallentuu streakiin

  // Pvm tänään muodossa YYYY-MM-DD
  const nyt = new Date();
  const pvm = tmPaivaIso(nyt);   // kirjaukset/{pvm}: paikallinen päivä (sama kuin Pelaaja_v7:n _paivaIso → yksi dokumentti/päivä)

  // ── TMBus: demo-moodi & valmentajan live-feed ──────────────────────
  if (window.TMBus) {
    TMBus.publish('training', {
      playerId:  _childId,
      source:    'parent',
      tyyppi:    paatyyppi,
      tyypit:    tyypit,            // kaikki valitut aktiviteetit
      minutes:   _pMinuutit,        // oikea aika
      fiilis:    fiilisMap[_pFiilis] || 4,
      note:      _pTeksti || ''
    });
  }

  // ── Firestore: tallenna oikea kirjaus pelaajan kokoelmaan ──────────
  // Lapsenvaihdin (1.10.2026): kohde = VALITTU lapsi (_lapsiTunnisteet), ei URL — URL:n lapsi voi olla eri
  // kuin valintarivillä valittu, ja ilman linkkiä tultaessa URL:ssa ei ole lasta lainkaan.
  const _tt = window._lapsiTunnisteet || {};
  const urlSeura = _tt.seuraId || null;
  const urlUid   = _tt.pelaajaId || null;

  if (_db && urlSeura && urlUid) {
    // Reaalitila: tallenna Firestoreen. Epäonnistuminen EI saa näkyä hiljaa (oli aiemmin
    // pelkkä console.warn → "treeni kirjattu" -toast valehteli vaikka mitään ei tallentunut).
    try {
      await _db.collection('seurat').doc(urlSeura)
        .collection('pelaajat').doc(urlUid)
        .collection('kirjaukset').doc(pvm)
        .set({
          tyyppi:     paatyyppi,        // 'T' tai 'vapaa'
          tyypit:     tyypit,           // ['pihapeli','pallo'] jne.
          kesto_min:  _pMinuutit,       // kesto minuutteina (nappivalinta 15–120)
          fiilis:     fiilisMap[_pFiilis] || 4,
          lahde:      'vanhempi',       // kuka kirjasi
          teksti:     _pTeksti || null,
          luotu:      firebase.firestore.FieldValue.serverTimestamp(),
          tehty:      true,
        }, { merge: true });
    } catch(e) {
      console.warn('[perheKirjaa Firestore]', e.code, e.message);
      _toast(e.code === 'permission-denied'
        ? t('vanhempi.kirjaa_virhe_oikeus')
        : t('vanhempi.kirjaa_virhe_verkko'));
      return;   // ÄLÄ tyhjennä lomaketta — vanhempi voi yrittää uudelleen
    }
  } else if (_db && (!urlSeura || !urlUid)) {
    // Firestore käytössä mutta linkin parametrit puuttuvat → ei voida tallentaa
    _toast(t('vanhempi.kirjaa_toast_virhe'));
    return;   // ÄLÄ tyhjennä lomaketta
  }
  // else: demo-tila (ei _db) → TMBus-julkaisu hoiti, jatketaan vahvistukseen

  // Onnistui (tai demo) — tyhjennä tila + vahvista
  _pTyypit   = new Set();
  _pFiilis   = null;
  _pTeksti   = '';
  _pMinuutit = null;
  _viimeisinKirjaus = null; // pakottaa uuden haun KOTI:ssa
  _kehuLahetetty    = false;

  _sc = 'koti';
  document.querySelectorAll('.sp').forEach(b=>b.classList.toggle('on',b.dataset.s==='koti'));
  draw();
  _toast(t('vanhempi.toast_treeni_kirjattu') + (onT ? t('vanhempi.toast_pallo_ok') : '') + '!');
}

   Data pelaajadokumentin pikakentistä (window._lapsi, §26). tkLajiViite/tkSekuntibudjetti window.TM_TESTIT:stä. */
// V4-B: arvot = tm_lang-avaimet (module-const → arvot evaluoituvat kerran latauksessa; kieli valitaan käyttöhetkellä t():llä)
const _VANH_LAJINIMI = { ponnauttelu:'vanhempi.laji_ponnauttelu', syotto:'vanhempi.laji_syotto', pujottelu:'vanhempi.laji_pujottelu', kuljetus_laukaus:'vanhempi.laji_kuljetus_laukaus', pituuspotku_bonus:'vanhempi.laji_pituuspotku' };
// V4-B: arvot = tm_lang-avaimet (module-const → käännös käyttöhetkellä t():llä)

function _vanhValitavoite(arvo, viite, kaant) {

function rVanhempiTekniikka(){
  const L = window._lapsi || {};
  const nimi = (IKA[_age] && IKA[_age].nimi) || L.etunimi || 'lapsesi';
  const lajit = L.tk_lajit_viimeisin;
  const box = (inner) => `<div class="card2" style="padding:16px;margin-bottom:12px">
    <div class="ey ac" style="margin-bottom:10px">${t('vanhempi.tek_profiili')}</div>${inner}</div>`;
  // Tyhjätila (positiivinen, §7.22) — ei TK-dataa
  if (!lajit || L.tki_viimeisin == null) {
    return box(`<div style="font-size:12px;color:var(--ink2);line-height:1.6">${t('vanhempi.tek_mittaukset_tulossa').replace('{gen}', _genetiivi(nimi))}</div>`);
  }
  const T = window.TM_TESTIT;
  const sp = (String(L.sukupuoli || '').toUpperCase() === 'N') ? 'T' : 'P';
  const ika = L.syntymaVuosi ? (new Date().getFullYear() - L.syntymaVuosi) : null;
  const viiteOf = (laji) => (T && T.tkLajiViiteLapsi && ika != null) ? T.tkLajiViiteLapsi(laji, ika, sp) : null;   // PR G: huoltajan tavoite — hyvä = lievempi alue/finaali (päätös 4.10.2026), ei aluetta → null
  const arvoOf = (id) => { const x = lajit[id + '_s']; return (x == null || isNaN(x)) ? null : Number(x); };
  const merkkiVari = { kulta:'#D4AF37', hopea:'#9AA0A6', pronssi:'#B87333' };
  let inner = '';
  // 1. Mitali (ansaittu) + mitattu pvm. §7.22/§16: TKI-lukua EI näytetä vanhemmallekaan (indeksi = tasoluku).
  if (L.tki_merkki) inner += `<div style="display:flex;margin-bottom:4px"><div style="margin-left:auto;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;background:${(merkkiVari[L.tki_merkki]||'#8C8B86')}22;color:${merkkiVari[L.tki_merkki]||'#8C8B86'};text-transform:capitalize">${L.tki_merkki}</div></div>`;
  if (L.tk_lajit_pvm) inner += `<div style="font-size:10px;color:var(--ink3);margin-bottom:6px">${t('vanhempi.tek_mitattu').replace('{pvm}', L.tk_lajit_pvm)}</div>`;
  // 2. Vahvuus ensin (prosessikehu)
  if (L.tki_vahvuus && _VANH_LAJINIMI[L.tki_vahvuus]) {
    inner += `<div style="font-size:13px;color:var(--text);margin-top:10px">⭐ <b>${t('vanhempi.tek_vahvuus')}</b> ${t(_VANH_LAJINIMI[L.tki_vahvuus])}

  }
  // 3. Seuraava askel — yksi kehityskohde + saavutettava välitavoite
  if (L.tki_kehityskohde && _VANH_LAJINIMI[L.tki_kehityskohde]) {

    if (_tv != null) {   // ei luotettavaa viitettä / taso jo saavutettu / väärä mittakaava → EI arvattua lukua huoltajalle

    }
    inner += `</div>`;
  }
  // 4. Mitalimatka — vain ≤15 s, positiivisesti
  if (T && T.tkSekuntibudjetti && L.tk_kokonaistulos_viimeisin != null && ika != null) {
    const budj = T.tkSekuntibudjetti(L.tk_kokonaistulos_viimeisin, ika, sp);

  // 5. Lajit sekunteina — §7.22: EI palkkeja (täyttö oli suhde eliittiviitteeseen = normivertailu). ★ vahvuus · 🎯 seuraava askel.
  const LAJIT = ['ponnauttelu','syotto','pujottelu','kuljetus_laukaus'];
  const vals = LAJIT.map(id => ({ id, val: arvoOf(id) })).filter(x => x.val != null);
  if (vals.length) {
    inner += `<div style="margin-top:12px;display:flex;flex-direction:column">`;
    vals.forEach(x => {

        <div style="font-size:12px;color:var(--text)">${x.val.toFixed(1)} s</div></div>`;
    });
    inner += `</div>`;
  }
  // 6. 💛 Miten tukea kotona — näkymän ydin (kehityskohteen mukaan) + pysyvä periaaterivi
  const tukiKey = (L.tki_kehityskohde || '').replace('_bonus','');

  return box(inner);

// KORTTI 1c — Omat ennätykset vanhemmalle (pikakenttä ennatykset, §26). NEUTRAALI (§7.22 + perheviestintä §16):
// arvo + päivä, vertailu vain lapsen omiin aiempiin tuloksiin — EI tasolukuja, EI vertailua muihin, EI edellistä
// tulosta/deltaa (painostusmekanismi), EI juhlaa vanhemman paineeksi. Ei ennätyksiä → kortti piilossa.
const _VANH_ENN = {
  lin5m:['vanhempi.enn_t_lin5m','s'], lin10m:['vanhempi.enn_t_lin10m','s'], lin30m:['vanhempi.enn_t_lin30m','s'],
  cmj:['vanhempi.enn_t_cmj','cm'], mas:['vanhempi.enn_t_mas','km/h'], kasirata:['vanhempi.enn_t_kasirata','s'],
  sm_juoksu:['vanhempi.enn_t_sm_juoksu','s'], sm_pallo:['vanhempi.enn_t_sm_pallo','s'],
  ponnauttelu:['vanhempi.laji_ponnauttelu','s'], syotto:['vanhempi.laji_syotto','s'], pujottelu:['vanhempi.laji_pujottelu','s'],
  kuljetus_laukaus:['vanhempi.laji_kuljetus_laukaus','s'], pituuspotku_bonus:['vanhempi.laji_pituuspotku','s'], flei:['vanhempi.enn_t_flei','']
};
function _vanhEnnArvo(paras, yks) {
  const v = Number(paras);
  return ((yks === 's') ? v.toFixed(2).replace(/0$/, '') : String(Math.round(v * 10) / 10)) + (yks ? ' ' + yks : '');
}
function _vanhEnnPvm(iso) { const m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? (Number(m[3]) + '.' + Number(m[2]) + '.' + m[1]) : ''; }
function rVanhempiEnnatykset(){
  const L = window._lapsi || {};
  // PR D2: rivi per (testi, alusta) JAETUSTA lib/tm_ennatykset.js:stä (sama kuin Pelaaja) — pääalusta (Mondo) ensin,
  // muut alustat omina riveinään ilman vertailua. Varalla (lib lataamatta) vanha yksi rivi per testi.
  const _TE = window.TM_ENNATYKSET;
  const E = (L.ennatykset && typeof L.ennatykset === 'object') ? L.ennatykset : {};
  const _jr = (_TE && typeof _TE.tmEnnatysRivit === 'function') ? _TE.tmEnnatysRivit(L) : null;
  const kaikki = Array.isArray(_jr) ? _jr : Object.keys(E).map(k => Object.assign({ avain: k, testi: k }, E[k]));
  const rivitData = kaikki.filter(r => _VANH_ENN[r.testi] && r.paras != null && !isNaN(Number(r.paras)));
  if (!rivitData.length) return '';
  const _ak = (a) => (typeof tmAlustaKoodi === 'function') ? tmAlustaKoodi(a) : (a || 'tuntematon');
  const tanaan = (typeof tmPaivaIso === 'function') ? tmPaivaIso(new Date()) : null;   // paikallinen päivä (ei UTC)
  const tuore = (e) => { if (!tanaan || e.edellinen == null || !e.pvm) return false; const d = (Date.parse(tanaan) - Date.parse(String(e.pvm).slice(0, 10))) / 864e5; return d >= 0 && d <= 30; };
  const rivit = rivitData.map(e => {
    const m = _VANH_ENN[e.testi], ak = _ak(e.alusta);
    const alustaTxt = (ak !== 'tuntematon') ? ` <span style="font-size:10px;color:var(--ink3)">· ${_vEsc(t('alusta.' + ak))}</span>` : '';
    return `<div style="display:flex;align-items:baseline;gap:8px;padding:6px 0;border-bottom:.5px solid var(--border)">
      <div style="flex:1;font-size:12px;color:var(--text)">${_vEsc(t(m[0]))}${alustaTxt}${tuore(e) ? ` <span style="font-size:10px;color:#28B090">· ${_vEsc(t('vanhempi.enn_uusi'))}</span>` : ''}</div>

      <div style="width:72px;font-size:10px;color:var(--ink3);text-align:right">${_vEsc(_vanhEnnPvm(e.pvm))}</div></div>`;
  }).join('');
  return `<div class="card2" style="padding:16px;margin-bottom:12px">
    <div class="ey ac" style="margin-bottom:4px">🏅 ${_vEsc(t('vanhempi.enn_otsikko'))}</div>

      document.getElementById('_tmPwaSulje').onclick = function () { sulje(true); };

      if (lisaa) lisaa.onclick = function () {

        sulje(false);

    } catch (e) {}
  };
  _auth.onAuthStateChanged(async (user) => {
    if (user && !user.isAnonymous) {
      // Sentry-konteksti — VAIN pseudonyymit (uid, rooli; seuraId best-effort). EI displayName/email.
      if (window.tmSentryContext) window.tmSentryContext({ uid: user.uid, rooli: 'vanhempi', seuraId: (window._lapsi && window._lapsi.seuraId) || undefined });
      // Oikea, tunnistettu käyttäjä → siirry kotiin

      if (_sc === 'login') {

        setTimeout(function () { _tmPwaKehote(t('vanhempi.pwa_vanhempi_sivu')); }, 1500);   // kirjautumisen jälkeen, ei login-ruudussa
      }
      await _haeViimeisinKirjaus();
    } else {
      // Ei sessiota TAI anonyymi sessio → pysy login-näkymässä
      // Anonyymi on vain Firestore-rules-apuri, ei oikea kirjautuminen
      if (_sc === 'login') draw(); // renderöi login jos ei vielä renderöity
    }
  });
} catch(e) {

/* ══════════════════════════════════════════════════════════
   Tervetulo-overlay (Aloita tästä, Vaihe 2/Vanhempi) — lämmin sävy (§7.22/§34).
   Sisältö: johdanto + kultainen sääntö + kevyt "Näin olet mukana" -lista (klikattava → vie näkymään).
   EI tasoja/lukuja/vertailua. Gating: localStorage tm_vanhempi_aloitettu_<pelaajaId>. String concat §7.1.
══════════════════════════════════════════════════════════ */
function _vthEsc(s){ return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
/* Lapsenvaihdin (1.10.2026): tervetulo näytetään kerran per HUOLTAJA (auth-uid), ei jokaisen lapsen kohdalla.
   Vanha lapsikohtainen avain (_vthAvainLapsi) luetaan siirtymänä: jo nähnyt ei näe opasta uudelleen. */
function _vthAvain(){
  var u = _auth && _auth.currentUser;
  if (u && u.uid) return 'tm_vanhempi_aloitettu_h_' + u.uid;
  return _vthAvainLapsi();
}
function _vthAvainLapsi(){
  var L = window._lapsi || {};
  var qs = new URLSearchParams(location.search);
  var pid = L.uid || L.id || qs.get('pelaajaId') || qs.get('uid') || L.pin || '';
  return pid ? ('tm_vanhempi_aloitettu_' + pid) : '';
}
function _naytaVanhTervetulo(){
  var L = window._lapsi; if (!L) return;
  var avain = _vthAvain(); if (!avain) return;
  try {
    if (localStorage.getItem(avain)) return;
    var vanha = _vthAvainLapsi();
    if (vanha && vanha !== avain && localStorage.getItem(vanha)) { localStorage.setItem(avain, '1'); return; }
  } catch (e) { return; }
  if (document.getElementById('vanhTervetuloOv')) return;
  var nimi = _vthEsc(L.etunimi || '');
  var gen = (nimi && typeof _genetiivi === 'function') ? _vthEsc(_genetiivi(L.etunimi)) : (nimi || 'lapsesi');
  var alle13 = (_age === 'u12');   // Kirjaa-kohta vain alle 13-vuotiaan vanhemmalle
  var kehuTehty = (typeof _kehuLahetetty !== 'undefined' && _kehuLahetetty === true);
  var kirjausTehty = (typeof _viimeisinKirjaus !== 'undefined' && !!_viimeisinKirjaus);
  function tick(done){ return done ? '<span class="vth-tick vth-on">✓</span>' : '<span class="vth-tick">○</span>'; }
  function rivi(done, txt, nakyma){ return '<button class="vth-rivi" onclick="_vthMene(\'' + nakyma + '\')">' + tick(done) + '<span class="vth-rivi-txt">' + txt + '</span><span class="vth-arrow">›</span></button>'; }
  // V1-B2 i18n: nimen taivutus poistettu — toimintorivit ilman nimen taivutusta (robusti, kestää mielivaltaiset nimet; ei suomen taivutushelperiä).
  var lista = rivi(kehuTehty, t('vanhempi.tervetulo_kehu'), 'koti')

    + (alle13 ? rivi(kirjausTehty, t('vanhempi.tervetulo_kirjaa'), 'kirjaa') : '');
  var ov = document.createElement('div');

  // V1-B2 i18n: johdanto ilman nimen taivutusta ("lapsesi" / "ditt barns" / "your child's") → ei {gen}-substituutiota.
  ov.innerHTML = '<div class="vth-panel" role="dialog" aria-label="' + t('vanhempi.hero_tervetuloa') + '">'
    + '<div class="vth-otsikko">' + t('vanhempi.tervetulo_hei') + '</div>'

    + lista
    + '<div class="vth-napit"><button class="vth-selva" onclick="_suljeVanhTervetulo()">' + t('vanhempi.selva') + '</button><button class="vth-ohita" onclick="_suljeVanhTervetulo()">' + t('vanhempi.ohita') + '</button></div>'
    + '</div>';
  document.body.appendChild(ov);

}
window._vthMene = function (nakyma){ window._suljeVanhTervetulo(); if (typeof go === 'function') go(nakyma); };
window._suljeVanhTervetulo = function (){

window._naytaVanhOpasUudelleen = function (){

/* ── P3/Bug2: käsittele ladattu pelaajadokumentti (nimi/ryhmä/hero + synttäri) ──
   Ajetaan AINA kun lapsi on ladattu — sekä suoralla uid-reitillä että huoltajaEmail-haulla. */
function _kasitteleLapsi(lapsi) {
  if (!lapsi) return;
  window._lapsi = lapsi;
  // V4-A3 Osa B: sovella seuran oletuskieli lapsen pelaajadokin kieli-kentästä (denormalisoitu, reitti 1).
  // tmKieliInitSeura: käyttäjän manuaalivalinta (localStorage['tm_kieli']) VOITTAA yhä seura-oletuksen.
  if (typeof tmKieliInitSeura === 'function') tmKieliInitSeura(lapsi && lapsi.kieli ? lapsi.kieli : null);
  if (typeof draw === 'function') draw();
  // P7-c-fix (A): kalenterilataus saattoi bailata ennen _lapsi/auth-valmiutta (ei latchattu) → yritä nyt.
  window._vanhKalLadattu = false; if (typeof _vanhLataaKalenteri === 'function') _vanhLataaKalenteri();
  // P7-c.4a: sama uudelleenyritys notifeille.
  window._vanhNotifLadattu = false; if (typeof _vanhLataaNotif === 'function') _vanhLataaNotif();
  const ika = new Date().getFullYear() - (lapsi.syntymaVuosi || 2012);
  _age = ika <= 12 ? 'u12' : ika <= 15 ? 'u15' : 'u19';
  const _realNimi = lapsi.etunimi || IKA[_age].nimi;
  IKA[_age].nimi  = _realNimi;
  IKA[_age].ika   = ika;
  IKA[_age].ryhma = lapsi.joukkue || lapsi.joukkueNimi || IKA[_age].ryhma;
  // Hero-fallback (näkyy vain kun ei vielä kirjausta): neutraali tervetuloa — EI keksittyä aktiviteettia.
  IKA[_age].hero = {
    t: t('vanhempi.hero_tervetuloa_app').replace('{nimi}', _realNimi),
    s: t('vanhempi.hero_tyhja').replace('{gen}', _genetiivi(_realNimi))
  };
  setAge(_age);
  draw();
  // Vaihe 2 — tervetulo-overlay ensimmäisellä kirjautumisella (localStorage-gating, §7.22/§34-turvallinen).
  setTimeout(function () { _naytaVanhTervetulo(); }, 500);
  // ── Syntymäpäiväviesti vanhemmalle — synttäri TÄLLÄ VIIKOLLA (ma–su) ──
  if (lapsi.syntymaaika) {
    const syn = lapsi.syntymaaika.toDate ? lapsi.syntymaaika.toDate() : new Date(lapsi.syntymaaika);
    const nyt = new Date();
    const synTanaVuonna = new Date(nyt.getFullYear(), syn.getMonth(), syn.getDate());
    const _viikonAlku = function(d) {
      const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      x.setDate(x.getDate() - ((x.getDay() + 6) % 7));  // ma = viikon alku
      x.setHours(0, 0, 0, 0);
      return x;
    };
    const onTanaan        = synTanaVuonna.getMonth() === nyt.getMonth() && synTanaVuonna.getDate() === nyt.getDate();
    const onTallaViikolla = _viikonAlku(synTanaVuonna).getTime() === _viikonAlku(nyt).getTime();
    if (onTanaan || onTallaViikolla) {
      const ikaluku = nyt.getFullYear() - syn.getFullYear();
      _toast(onTanaan
        ? (t('vanhempi.synttari_tanaan').replace('{gen}', _genetiivi(_realNimi)).replace('{n}', ikaluku))
        : (t('vanhempi.synttari_viikolla').replace('{gen}', _genetiivi(_realNimi)).replace('{n}', ikaluku)),
        6000);
    }
  }
}

/* ══ LAPSENVAIHDIN (1.10.2026) ══════════════════════════════════════════════════════════════
   Huoltajalla voi olla useita lapsia (myös eri seuroissa). haeLapsiHuoltajalle palauttaa ne järjestyksessä
   (vanhin ensin); 2+ lasta → valintarivi sivun yläosaan. Valinta muistetaan laitteella huoltajan uid:n mukaan.
   Linkkireitti (?uid=&seura= / ?pelaajaId=&seuraId=): URL:n lapsi on oletusvalinta, lista haetaan silti.

   _vaihdaLapsi nollaa KAIKEN lapsikohtaisen tilan (_lapsiTilaNollaa) ja lataa uuden lapsen. Pyyntötunniste
   _lapsiPyynto: myöhässä saapuva edellisen lapsen vastaus hylätään ennen piirtoa (ei vuotoa lapselta toiselle).
   Kalenteri/ilmoitukset vertaavat lisäksi window._lapsi-viitettä ennen kirjoitusta (omat loaderinsa). */
window._lapsetLista = [];
let _lapsiPyynto = 0;
function _lapsiValintaAvain() {
  var u = _auth && _auth.currentUser;
  return (u && u.uid) ? ('tm_vanhempi_lapsi_' + u.uid) : '';
}
function _lapsiValintaLue() {
  var a = _lapsiValintaAvain(); if (!a) return null;
  try { var v = JSON.parse(localStorage.getItem(a) || 'null'); return (v && v.seura && v.uid) ? v : null; } catch (e) { return null; }
}
function _lapsiValintaTallenna(seuraId, pelaajaId) {
  var a = _lapsiValintaAvain(); if (!a) return;
  try { localStorage.setItem(a, JSON.stringify({ seura: seuraId, uid: pelaajaId })); } catch (e) { /* ei localStoragea → ei muistia */ }
}
function _lapsiTilaNollaa() {
  window._lapsi = null;
  window._lapsiTunnisteet = null;
  _viimeisinKirjaus = null;
  _viikkoKirjaukset = [];
  _valmentajaViestit = [];
  _kehuLahetetty = false;
  window._vanhKalenteri = null; window._vanhKalLadattu = false;
  window._vanhNotif = null; window._vanhNotifLadattu = false;
  // Kesken jäänyt Kirjaa-lomake kuului edelliselle lapselle → tyhjäksi
  _pTyypit = new Set(); _pFiilis = null; _pTeksti = ''; _pMinuutit = null;
}
/* Etunimi; jos kahdella lapsella sama etunimi → perään joukkue. */
function _lapsiNimiRivilla(l, lista) {
  var nimi = l.etunimi || '?';
  var sama = lista.filter(function (x) { return (x.etunimi || '') === (l.etunimi || ''); }).length > 1;
  return (sama && l.joukkueNimi) ? (nimi + ' · ' + l.joukkueNimi) : nimi;
}
function _lapsiValitsinHTML() {
  var lista = window._lapsetLista || [];
  if (lista.length < 2) return '';
  var tt = window._lapsiTunnisteet || {};
  var nappi = function (l) {
    var on = (l.seura === tt.seuraId && l.uid === tt.pelaajaId);
    return '<button type="button" role="tab" aria-selected="' + on + '" onclick="_vaihdaLapsiKlik(\'' + _vthEsc(l.seura) + '\',\'' + _vthEsc(l.uid) + '\')" style="flex-shrink:0;padding:7px 14px;border-radius:999px;border:.5px solid ' + (on ? 'var(--teal-d)' : 'var(--border2)') + ';background:' + (on ? 'var(--teal-d)' : 'transparent') + ';color:' + (on ? '#fff' : 'var(--ink2)') + ';font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;white-space:nowrap">' + _vthEsc(_lapsiNimiRivilla(l, lista)) + '</button>';
  };
  return '<div role="tablist" aria-label="' + _vthEsc(t('vanhempi.lapsi_valitse')) + '" style="display:flex;gap:6px;overflow-x:auto;padding:12px 18px 2px;-webkit-overflow-scrolling:touch">' + lista.map(nappi).join('') + '</div>';
}
window._vaihdaLapsiKlik = function (seuraId, pelaajaId) {
  var tt = window._lapsiTunnisteet || {};
  if (tt.seuraId === seuraId && tt.pelaajaId === pelaajaId) return;
  // URL:n lapsi ei saa voittaa käyttäjän valintaa seuraavalla latauksella → poista lapsiparametrit osoitteesta.
  try {
    var u = new URL(location.href);
    ['uid', 'seura', 'pelaajaId', 'seuraId'].forEach(function (k) { u.searchParams.delete(k); });
    history.replaceState(null, '', u.toString());
  } catch (e) { /* ei estä vaihtoa */ }
  _vaihdaLapsi(seuraId, pelaajaId);
};
/* S1.1 Käyttöaste — huoltajan käynti palvelimelle (kirjaaHuoltajaKaynti): kerran päivässä per lapsi, vain sähköpostilla kirjautunut huoltaja (anonyymi/linkkikäyntiä ei lasketa).
   Best-effort: virhe ei näy käyttäjälle eikä estä mitään. Päivämäärä, ei sisältöä; palvelin tarkistaa huoltajaEmail:n ja kirjoittaa kentän (Rules: client ei voi). */
function _kirjaaHuoltajaKaynti(seuraId, pelaajaId) {
  try {
    const u = _auth && _auth.currentUser;
    if (!u || !u.email || !seuraId || seuraId === 'demo' || !pelaajaId || !window._fbApp) return;
    const paiva = tmPaivaIso(), avain = 'tm_hk_kaynti_' + seuraId + '_' + pelaajaId;
    try { if (localStorage.getItem(avain) === paiva) return; } catch (e) { /* ei LS → kutsu, palvelin rajaa kerran päivässä */ }
    window._fbApp.functions('europe-west1').httpsCallable('kirjaaHuoltajaKaynti')({ seuraId: seuraId, pelaajaId: pelaajaId })
      .then(function () { try { localStorage.setItem(avain, paiva); } catch (e) { /* ok */ } })
      .catch(function () { /* best-effort */ });
  } catch (e) { /* ei kaada lapsen avausta */ }
}
async function _vaihdaLapsi(seuraId, pelaajaId) {
  if (!_db || !seuraId || !pelaajaId) return;
  const pyynto = ++_lapsiPyynto;
  const ajantasalla = function () { return pyynto === _lapsiPyynto; };
  _lapsiTilaNollaa();
  window._lapsiTunnisteet = { seuraId: seuraId, pelaajaId: pelaajaId };
  if (typeof draw === 'function') draw();
  let pd;
  try {
    pd = await _db.collection('seurat').doc(seuraId).collection('pelaajat').doc(pelaajaId).get();
  } catch (e) {
    if (!ajantasalla()) return;
    console.warn('[Perhe] pelaajalataus epäonnistui:', e.code || '', e.message);
    _toast(t('vanhempi.toast_lapsi_haku_virhe'));
    return;
  }
  if (!ajantasalla()) return;
  if (!pd.exists) { _toast(t('vanhempi.toast_lapsi_haku_virhe')); return; }
  _lapsiValintaTallenna(seuraId, pelaajaId);
  _kirjaaHuoltajaKaynti(seuraId, pelaajaId);
  // id + seuraId polusta (dokumentissa ei välttämättä ole niitä) → kalenteri, ilmoitukset ja RSVP osuvat oikeaan lapseen.
  _kasitteleLapsi(Object.assign({}, pd.data(), { id: pelaajaId, seuraId: seuraId }));
  await _lataaLapsenData(seuraId, pelaajaId, ajantasalla);
}

/* ── Hae huoltajan lapset + avaa valittu (kirjautumisen jälkeen) ── */
async function _haeViimeisinKirjaus() {
  if (!_db) return;
  // Bug 1: hyväksy molemmat param-nimet — reset-linkki emittoi pelaajaId/seuraId, legacy uid/seura.
  const _qs = new URLSearchParams(location.search);
  const urlUid   = _qs.get('uid')   || _qs.get('pelaajaId') || null;
  const urlSeura = _qs.get('seura') || _qs.get('seuraId') || (urlUid ? 'kpv' : null);

  // Lista haetaan AINA kun huoltaja on kirjautunut — myös linkkireitillä (valintarivi näkyy).
  // Client EI voi hakea tätä itse: Rules estävät cross-seura-haun eikä huoltajalla ole seuraId-claimia.
  // CF (Admin SDK) palauttaa VAIN ne lapset, joiden huoltajaEmail == kutsujan autentikoitu email.
  const user = _auth && _auth.currentUser;
  let lapset = [];
  if (user && user.email) {
    try {
      const haeLapsi = window._fbApp.functions('europe-west1').httpsCallable('haeLapsiHuoltajalle');
      const res = await haeLapsi();
      lapset = (res.data && res.data.lapset) || [];
    } catch (e) {
      console.warn('[Perhe] lapsi-haku epäonnistui:', e.code || '', e.message);
      if (!urlUid) { _toast(t('vanhempi.toast_lapsi_haku_virhe')); return; }
    }
  }
  window._lapsetLista = lapset;

  if (urlUid && urlSeura) { await _vaihdaLapsi(urlSeura, urlUid); return; }
  if (!lapset.length) {
    if (user && user.email) { console.warn('[Perhe] Ei löydy pelaajaa huoltajaEmail:lla'); _toast(t('vanhempi.toast_ei_lasta')); }
    return;
  }
  const muistettu = _lapsiValintaLue();
  const valittu = (muistettu && lapset.find(function (l) { return l.seura === muistettu.seura && l.uid === muistettu.uid; })) || lapset[0];
  await _vaihdaLapsi(valittu.seura, valittu.uid);
}

/* ── Lapsen kirjaukset + valmentajan viestit. ajantasalla() = false → lapsi vaihtui, tulos hylätään. ── */
async function _lataaLapsenData(urlSeura, urlUid, ajantasalla) {
  try {
    // Viimeisin kirjaus
    const snap = await _db.collection('seurat').doc(urlSeura)
      .collection('pelaajat').doc(urlUid)
      .collection('kirjaukset')
      .orderBy('luotu', 'desc')
      .limit(1)
      .get();
    if (!ajantasalla()) return;

    if (!snap.empty) {
      const d = snap.docs[0].data();
      _viimeisinKirjaus = {
        id:       snap.docs[0].id,
        tyyppi:   d.tyyppi || 'T',
        konteksti: d.konteksti || '',
        kesto_min: d.kesto_min || 0,
        fiilis:   d.fiilis || null,
        luotu:    d.luotu?.toDate() || new Date(),
        pvm:      snap.docs[0].id,
        uid:      urlUid,
        seura:    urlSeura,
      };
    }

    // Viikon kirjaukset tarina-generaattorille
    const viikkoSitten = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000);
    const viikkoSnap = await _db.collection('seurat').doc(urlSeura)
      .collection('pelaajat').doc(urlUid)
      .collection('kirjaukset')
      .where('luotu', '>=', firebase.firestore.Timestamp.fromDate(viikkoSitten))
      .orderBy('luotu', 'desc')
      .limit(14)
      .get();
    if (!ajantasalla()) return;

    _viikkoKirjaukset = viikkoSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    _kehuLahetetty = false;

    // Valmentajan viestit (havainnot, tyyppi:'valmentaja_viesti'). Suodatus client-puolella
    // (ei vaadi composite-indeksiä); järjestys luotu desc.
    //
    // ⚠ `nakyvyys`-ehto on PAKOLLINEN, ei valinnainen suodatin: tämä näkymä lukee
    // anonyymina (r.1443), ja Rules v3.22 sallii anonyymille vain `nakyvyys=='pelaaja'`.
    // Rules ei suodata kyselyä — ilman ehtoa KOKO kysely hylätään (permission-denied),
    // jolloin Viestit-välilehti tyhjenisi myös vanhoista viesteistä. Kaksi
    // yhtäsuuruusehtoa + limit ei vaadi komposiitti-indeksiä.
    /* PERHE NÄKEE SAMAT TEKSTIT KUIN PELAAJA (päätös 28.9.2026): myös pelaajalle jaetut
       PELIHAVAINNOT, ei vain `valmentaja_viesti`-tyyppiä. Ne ovat samaa palautetta.
       Kysely rajaa `tila` + `nakyvyys` (kaksi yhtäsuuruusehtoa, ei komposiitti-indeksiä):
         · `nakyvyys` on PAKKO olla, koska Rules ei suodata — ilman sitä koko kysely hylätään
         · `tila=='valmis'` pudottaa perutut automaattisesti pois
       Järjestys tulee jaetusta kirjastosta, jotta perhe näkee rivit samassa järjestyksessä
       kuin pelaaja ja valmentaja. */
    try {
      const vSnap = await _db.collection('seurat').doc(urlSeura)
        .collection('pelaajat').doc(urlUid).collection('havainnot')
        .where('tila', '==', 'valmis')
        .where('nakyvyys', '==', 'pelaaja').limit(50).get();
      if (!ajantasalla()) return;
      const docs = vSnap.docs.map(d => ({ id: d.id, ...d.data() }));
      _valmentajaViestit = (typeof tmHhRivit === 'function')
        ? tmHhRivit(docs).filter(function (r) { return r.teksti; })
        : docs.sort(function (a, b) {
          const ta = (a.luotu && a.luotu.toDate) ? a.luotu.toDate().getTime() : 0;
          const tb = (b.luotu && b.luotu.toDate) ? b.luotu.toDate().getTime() : 0;
          return tb - ta;
        });
    } catch(e) { if (!ajantasalla()) return; console.warn('[valmentajaViestit]', e.message); _valmentajaViestit = []; }

    draw();
  } catch(e) {
    console.warn('[haeKirjaus]', e.message);
  }
}

window._vKp = window._vKp || { ladattu: 0, lapsi: null, ketjut: null, valittu: null, valinta: '', kuittaa: false, tallentaa: false };

function _vKpT(k) { const lib = (typeof window.tmLibT === 'function') ? window.tmLibT(k) : undefined; if (lib !== undefined) return lib; /* jaettu libikartta (lib/tm_lib_i18n.js, sv) ensin */ const v = t(k); return (v === k) ? k : v; }   // puuttuva tm_lang-avain → avain → libin fi-oletus
function _vEsc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
async function _vKpLataa(pakota) {

  if (P.lapsi !== L.id) { P.lapsi = L.id; P.ketjut = null; P.valittu = null; P.valinta = ''; P.kuittaa = false; }   // lapsi vaihtui → tyhjennä
  if (!pakota && P.ketjut && nyt - P.ladattu < 180000) return; P.ladattu = nyt;
  try {
    const col = _db.collection('seurat').doc(L.seuraId).collection('viestit'), kysy = n => col.where('pelaajaId', '==', L.id).where('nakyvyys', '==', n).get();   // kaksi yhtäsuuruuskyselyä (Rules todistaa kummankin), yhdistetään id:llä
    const [a, b] = await Promise.all([kysy('pelaaja'), kysy('huoltaja')]), kartta = new Map();
    a.docs.concat(b.docs).forEach(d => kartta.set(d.id, Object.assign({ id: d.id }, d.data())));
    P.ketjut = window.TM_KLIPPI_PERHE.kpKetjut(Array.from(kartta.values()), { nyt: new Date(), pelaajaId: L.id });

function _vKpHTML() { if (!window.TM_KLIPPI_PERHE || !window._lapsi) return ''; _vKpLataa(false); return '<div id="vKpKortti">' + _vKpSisalto() + '</div>'; }

/* ── Tarina-generaattori — muuntaa kirjauksen kertomukseksi ── */
function _tarinaOtsikko(k) {
  const nimi = IKA[_age].nimi;
  const minSitten = Math.round((Date.now() - k.luotu.getTime()) / 60000);
  const aikaStr = minSitten < 5 ? t('vanhempi.aika_juuri_nyt') :
                  minSitten < 60 ? t('vanhempi.aika_min_sitten').replace('{n}', minSitten) :
                  minSitten < 120 ? t('vanhempi.aika_tunnin_sitten') : t('vanhempi.aika_tanaan');

  // Kontekstikohtainen otsikko
  const kontekstiOtsikot = {
    pihapeli: t('vanhempi.nimi_pelasi_pihalla_aika', { nimi: nimi, aika: aikaStr }),
    kaveri:   t('vanhempi.nimi_harjoitteli_kaverin_kanssa_ai', { nimi: nimi, aika: aikaStr }),
    aamu:     t('vanhempi.nimi_teki_aamuharjoitteen_aika', { nimi: nimi, aika: aikaStr }),
    valitunti:t('vanhempi.nimi_treenasi_valitunnilla_aika', { nimi: nimi, aika: aikaStr }),
    ilta:     t('vanhempi.nimi_teki_iltatreenin_aika', { nimi: nimi, aika: aikaStr }),
    oma:      t('vanhempi.nimi_harjoitteli_itsekseen_aika', { nimi: nimi, aika: aikaStr }),
  };
  if (k.konteksti && kontekstiOtsikot[k.konteksti]) return kontekstiOtsikot[k.konteksti];

  const tyypit = {
    T: t('vanhempi.nimi_treenasi_aika', { nimi: nimi, aika: aikaStr }),
    D: t('vanhempi.nimi_teki_kehonhuollon_aika', { nimi: nimi, aika: aikaStr }),
    S: t('vanhempi.nimi_teki_lihaskuntoharjoitteen_ai', { nimi: nimi, aika: aikaStr }),
    P: t('vanhempi.nimi_pelasi_aika', { nimi: nimi, aika: aikaStr }),
    jalkapallo: t('vanhempi.nimi_treenasi_jalkapalloa_aika', { nimi: nimi, aika: aikaStr }),
    muu_urheilu: t('vanhempi.nimi_urheili_aika', { nimi: nimi, aika: aikaStr }),
    lepo: t('vanhempi.nimi_piti_lepopaivan_aika', { nimi: nimi, aika: aikaStr }),
  };
  return tyypit[k.tyyppi] || t('vanhempi.nimi_treenasi_aika', { nimi: nimi, aika: aikaStr });
}

function _tarinaKuvaus(k) {
  const nimi = IKA[_age].nimi;
  const osat = [];

  // Kesto
  if (k.kesto_min >= 30) osat.push(t('vanhempi.osat_pisin').replace('{n}', k.kesto_min));
  else if (k.kesto_min > 0) osat.push(t('vanhempi.osat_minuuttia').replace('{n}', k.kesto_min));

  // Konteksti — kasvutarina-sävy
  const kontekstiKuvaukset = {
    pihapeli: 'vanhempi.mikro_ulkoilu',
    kaveri:   'vanhempi.mikro_sosiaalinen',
    aamu:     'vanhempi.mikro_bola',
    valitunti:'vanhempi.mikro_valitunti',
  };
  if (k.konteksti && kontekstiKuvaukset[k.konteksti]) osat.push(t(kontekstiKuvaukset[k.konteksti]));

  // Viikon tilanne
  const tehdytPvt = _viikkoKirjaukset.filter(p => p.tyyppi === 'T' || p.tyyppi === 'vapaa').length;
  if (tehdytPvt >= 5) osat.push(t('vanhempi.osat_kirjaus_n').replace('{n}', tehdytPvt));
  else if (tehdytPvt === 1) osat.push(t('vanhempi.osat_ensimmainen'));

  return osat.join(' ') || t('vanhempi.osat_hyvaa_tyota');
}

    const evt=msg.evt;

    if(evt.type==='coach_message' && (evt.channel==='family'||evt.channel==='player')){

function _toast(text){
  const el=document.createElement('div');
  el.className='toast';
  el.textContent=text;
  document.body.appendChild(el);
  setTimeout(()=>el.style.opacity='0',3000);
  setTimeout(()=>el.remove(),3500);
}
