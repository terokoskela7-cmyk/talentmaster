<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TalentMaster™ — Perhe v1</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --carbon:#1C1C1A; --bone:#F2EFE6;
  --teal:#1A7A5E; --teal-d:#28B090;
  --slate:#585751; --gold:#B8860B; --fire:#B85C38;
  --font-d:'Cormorant Garamond',Georgia,serif;
  --font-b:'DM Sans',system-ui,sans-serif;
  --font-m:'DM Mono',Menlo,monospace;
  --bg:#111110; --bg2:#161614; --surface:#1E1E1C; --surface2:#1A1A18;
  --border:rgba(242,239,230,.06); --border2:rgba(242,239,230,.12);
  --text:#F2EFE6; --ink2:#A8A79F; --ink3:#8BA0BC;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-b);background:#0a0a08;color:var(--text);min-height:100dvh;overflow-x:hidden;font-size:14px;line-height:1.7}
button{font-family:var(--font-b);cursor:pointer}

.wrap{max-width:100%;margin:0 auto;padding:14px 8px 40px;text-align:center}

/* Switcher */
.age-bar{display:inline-flex;gap:3px;background:rgba(242,239,230,.04);padding:3px;border-radius:20px;margin-bottom:10px}
.age-btn{background:transparent;color:var(--ink3);border:none;padding:6px 14px;font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;border-radius:18px;cursor:pointer;transition:all .15s}
.age-btn.on{background:var(--teal);color:var(--text)}

.scene-bar{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-bottom:10px}
.sp{background:rgba(242,239,230,.04);color:var(--ink3);border:.5px solid rgba(242,239,230,.1);padding:4px 9px;font-size:9px;letter-spacing:.16em;text-transform:uppercase;font-weight:500;border-radius:14px;cursor:pointer;transition:all .12s}
.sp.on{background:var(--teal);color:var(--text);border-color:var(--teal)}

.hint{font-size:10px;color:var(--ink3);margin-bottom:10px;letter-spacing:.04em;max-width:540px;margin-left:auto;margin-right:auto;line-height:1.55}

/* Phone */
.phone{width:min(390px,100vw);margin:0 auto;background:var(--bg);border-radius:36px;border:1px solid #222;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 8px #1a1a1a;position:relative;overflow:hidden;text-align:left}
.ph-status{height:42px;padding:14px 24px 0;display:flex;justify-content:space-between;font-family:var(--font-m);font-size:12px;font-weight:500}
.ph-body{height:700px;overflow-y:auto;position:relative}
.scroll{padding:10px 18px 90px}

.tabs{position:sticky;bottom:0;background:var(--bg2);border-top:.5px solid var(--border2);display:flex;justify-content:space-around;padding:8px 0 14px}
.tb{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 12px;color:var(--ink3)}
.tb.on{color:var(--text)}
.tb svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tb.on svg{stroke:var(--teal-d);stroke-width:1.8}
.tb-lbl{font-size:9px;font-weight:500;letter-spacing:.12em;text-transform:uppercase}

.ey{font-size:9px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--ink3)}
.ey.ac{color:var(--teal-d)}

.card{background:var(--surface);border:.5px solid var(--border);border-radius:10px;padding:14px}
.card2{background:var(--surface2);border:.5px solid var(--border);border-radius:10px;padding:14px}
.card-warm{background:linear-gradient(180deg,rgba(184,134,11,.1),rgba(184,134,11,.02));border:.5px solid rgba(184,134,11,.28);border-radius:14px}
.card-teal{background:linear-gradient(180deg,rgba(26,122,94,.12),rgba(26,122,94,.02));border:.5px solid rgba(26,122,94,.3);border-radius:14px}

@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes heartbeat{0%,20%{transform:scale(1)}10%{transform:scale(1.15)}}
.scene{animation:fadeUp .28s ease}

/* Week dots */
.week-dots{display:flex;gap:4px}
.wd{flex:1;height:26px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;letter-spacing:.08em;color:var(--ink3);background:var(--surface2);border:.5px solid var(--border)}
.wd.done{background:rgba(26,122,94,.12);border-color:rgba(26,122,94,.35);color:#28B090}
.wd.miss{opacity:.45}
.wd.today{border-color:var(--teal-d)}

/* Streak flame */
.flame-dot{width:8px;height:8px;border-radius:50%;background:#B85C38;animation:heartbeat 2s ease infinite}

.divider{height:.5px;background:var(--border);margin:18px -2px}

/* Live-tila */
.live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#28B090;animation:heartbeat 2s ease infinite;margin-right:6px}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:9999;padding:11px 18px;background:rgba(26,122,94,.95);color:#fff;border-radius:22px;font-size:12px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:fadeUp .3s ease}
</style>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
<script src="tm-bus.js?v=3"></script>
<script src="tm-demo.js?v=3"></script>
</head>
<body>

<div class="wrap">

  <div style="margin-bottom:12px;padding-top:4px">
    <div style="font-family:var(--font-d);font-weight:500;font-size:22px;color:var(--text)">TalentMaster — Perhe <span style="color:var(--teal-d)">v1</span></div>
    <div class="hint">Vanhemman näkymä omatoimiseen harjoitteluun. Ikä-tila vaikuttaa sisällön tonaliteettiin ja mitä saa tehdä.</div>
  </div>

  <!-- Age switcher -->
  <div class="age-bar">
    <button class="age-btn on" data-age="u12" onclick="setAge('u12')">U10–U12 · Agentti</button>
    <button class="age-btn" data-age="u15" onclick="setAge('u15')">U13–U15 · Tuki</button>
    <button class="age-btn" data-age="u19" onclick="setAge('u19')">U16–U19 · Vieras</button>
  </div>

  <div class="scene-bar" id="sBar">
    <button class="sp on" data-s="koti" onclick="go('koti')">Koti</button>
    <button class="sp" data-s="viikko" onclick="go('viikko')">Viikko</button>
    <button class="sp" data-s="kirjaa" onclick="go('kirjaa')">Kirjaa (vain U12)</button>
    <button class="sp" data-s="valmentaja" onclick="go('valmentaja')">Valmentajan viesti</button>
    <button class="sp" data-s="kortti" onclick="go('kortti')">Kausikortti</button>
    <button class="sp" data-s="asetukset" onclick="go('asetukset')">Asetukset</button>
  </div>

  <div class="phone">
    <div class="ph-status">
      <span id="clock">9:41</span>
      <span>● ● ● ▪</span>
    </div>
    <div class="ph-body" id="phBody"></div>
  </div>

</div>

<script>
/* ════════════════════════════════════════════════
   IKÄ-ADAPTIIVISUUS
   U12: Agentti — voi kirjata, lämmin tone, pallopelit
   U15: Tuki     — näkee, rohkaisee, ei kirjaa
   U19: Vieras   — viikkokooste, kepeä kieli
════════════════════════════════════════════════ */
const IKA = {
  u12: {
    nimi:'Eemeli', ika:11, ryhma:'KPV U12 · Sininen',
    otsikko:(e)=>`${e}:n viikko`,
    hero: { t:'Eemeli treenasi eilen 45 min', s:'Pihalla Jaakon ja Lauran kanssa. Hyvä fiilis.' },
    vinkki: 'Pikkuiselle on tänään hyvä päivä levätä. Katso lempeästi, että hän ei treenaa kolmatta päivää putkeen.',
    kirjaaNakyva: true,
    valmentaja: 'Hyvä kun Eemeli oli pihalla! Ei välttämätöntä kirjata kaikkea — rentous on tärkeintä tässä iässä.',
  },
  u15: {
    nimi:'Aino', ika:14, ryhma:'KPV U15 · Tytöt',
    otsikko:(e)=>`${e}:n viikko`,
    hero: { t:'Aino on ollut aktiivinen', s:'4 treeniä tällä viikolla · kaikki omasta aloitteesta.' },
    vinkki: 'Nuori alkaa ottaa vastuuta itse. Ei tarvitse kysyä joka päivä — viesti kannattaa säästää viikon lopuksi.',
    kirjaaNakyva: false,
    valmentaja: 'Aino teki tällä viikolla vahvaa työtä kaikilla osa-alueilla. Vanhemmalle vinkki: anna hänen hengittää, hän tietää mitä tekee.',
  },
  u19: {
    nimi:'Joonas', ika:17, ryhma:'KPV U19 · Mustat',
    otsikko:(e)=>`${e}:n kooste`,
    hero: { t:'Joonas on kehittynyt 6 kk ajan', s:'Stage-matka: 2 → 3. Ammattilaisuuden rakennuttamisen vaihe.' },
    vinkki: 'Hän on lähes aikuinen pelaaja. Rooli muuttuu: olet läsnä, mutta et ohjaaja. Kuukausikooste riittää — älä häiritse arkea.',
    kirjaaNakyva: false,
    valmentaja: 'Joonas on kilpa-uraan kypsymässä. Kommunikoidaan suoraan pelaajan kanssa. Kuukausikooste tulee automaattisesti.',
  },
};

let _age='u12';
let _sc='login';  // Avataan aina login-näkymästä

// Firebase
let _db = null;
let _auth = null;

// Lapsen viimeisin kirjaus (Firestoresta)
let _viimeisinKirjaus = null;   // { tyyppi, kesto_min, fiilis, aika, pvm }
let _viikkoKirjaukset = [];     // koko viikon kirjaukset tarina-generaattorille
let _kehuLahetetty = false;     // nappi harmaa lähetyksen jälkeen

function setAge(a){
  _age=a;
  document.querySelectorAll('.age-btn').forEach(b=>b.classList.toggle('on',b.dataset.age===a));
  // kirjaa-tab piilotetaan paitsi u12:lla
  const kBtn = document.querySelector('[data-s="kirjaa"]');
  if(kBtn) kBtn.style.display = a==='u12' ? '' : 'none';
  if(_sc==='kirjaa' && a!=='u12') _sc='koti';
  draw();
}

function go(s){
  if(s==='kirjaa' && _age!=='u12') return;
  _sc=s;
  document.querySelectorAll('.sp').forEach(b=>b.classList.toggle('on',b.dataset.s===s));
  draw();
}

function ic(name,sz=18,col='currentColor',sw=1.5){
  const s=`width:${sz}px;height:${sz}px;stroke:${col};stroke-width:${sw};fill:none;stroke-linecap:round;stroke-linejoin:round`;
  const P={
    home:`<path d="M3 10L12 3L21 10V20a1 1 0 01-1 1H4a1 1 0 01-1-1Z"/><path d="M9 21V13H15V21"/>`,
    calendar:`<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 11h18"/>`,
    users:`<circle cx="9" cy="8" r="3.5"/><path d="M3 21v-1a6 6 0 0112 0v1"/><path d="M16 4a3.5 3.5 0 010 7"/><path d="M21 21v-1a6 6 0 00-4-5.65"/>`,
    heart:`<path d="M12 21s-7-4.5-7-11a4 4 0 017-2.5A4 4 0 0119 10c0 6.5-7 11-7 11z"/>`,
    msg:`<path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>`,
    star:`<path d="M12 2L15 9L22 9.5L17 14.5L18.5 21.5L12 17.8L5.5 21.5L7 14.5L2 9.5L9 9Z"/>`,
    user:`<circle cx="12" cy="8" r="4"/><path d="M4 21v-1a7 7 0 0116 0v1"/>`,
    cog:`<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 01-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 01-4 0v-.1a1.7 1.7 0 00-1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 01-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 010-4h.1a1.7 1.7 0 001.5-1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 012.8-2.8l.1.1a1.7 1.7 0 001.8.3 1.7 1.7 0 001-1.5V3a2 2 0 014 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 012.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8 1.7 1.7 0 001.5 1H21a2 2 0 010 4h-.1a1.7 1.7 0 00-1.5 1z"/>`,
    flame:`<path d="M12 3c2 3 5 5 5 9a5 5 0 01-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-8z"/>`,
    check:`<path d="M4 12L10 18L20 6"/>`,
    edit:`<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 113 3L7 19l-4 1 1-4z"/>`,
    back:`<path d="M15 5L8 12L15 19"/>`,
    plus:`<path d="M12 5v14M5 12h14"/>`,
    bell:`<path d="M6 8a6 6 0 1112 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21a2 2 0 004 0"/>`,
  };
  return `<svg viewBox="0 0 24 24" style="${s}">${P[name]||''}</svg>`;
}

function draw(){
  const pb=document.getElementById('phBody');
  let html='';
  if(_sc==='login') html=rLogin();
  else if(_sc==='koti') html=rKoti();
  else if(_sc==='viikko') html=rViikko();
  else if(_sc==='kirjaa') html=rKirjaa();
  else if(_sc==='valmentaja') html=rValmentaja();
  else if(_sc==='kortti') html=rKortti();
  else if(_sc==='asetukset') html=rAsetukset();
  pb.innerHTML=`<div class="scene">${html}${rTabs()}</div>`;
}


/* ══ LOGIN — sähköpostikirjautuminen vanhemmalle ════════════════════ */
let _loginEmail = '';
let _loginPass  = '';
let _loginErr   = '';
let _loginLng   = false; // loading

function rLogin() {
  return `
<div class="scroll" style="display:flex;flex-direction:column;min-height:100%;justify-content:center;padding:0 24px 40px">

  <!-- Logo + otsikko -->
  <div style="text-align:center;margin-bottom:32px;padding-top:40px">
    <div style="font-family:var(--font-d);font-weight:300;font-size:32px;color:var(--text);letter-spacing:-.5px;line-height:1.1">
      TalentMaster
    </div>
    <div style="font-size:11px;letter-spacing:.22em;color:var(--ink3);margin-top:6px;text-transform:uppercase">
      Perhe · Huoltajan sisäänkirjautuminen
    </div>
  </div>

  <!-- Lomake -->
  <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:20px">
    <input
      id="loginEmail"
      type="email"
      placeholder="Sähköposti"
      autocomplete="username"
      value="${_loginEmail}"
      oninput="_loginEmail=this.value"
      style="width:100%;padding:13px 14px;background:var(--surface);border:.5px solid ${_loginErr?'rgba(184,92,56,.6)':'var(--border2)'};
             border-radius:10px;color:var(--text);font-family:var(--font-b);font-size:14px;
             box-sizing:border-box;outline:none;transition:border .15s"
    />
    <input
      id="loginPass"
      type="password"
      placeholder="Salasana"
      autocomplete="current-password"
      oninput="_loginPass=this.value"
      onkeydown="if(event.key==='Enter')_teeSisaankirjautuminen()"
      style="width:100%;padding:13px 14px;background:var(--surface);border:.5px solid ${_loginErr?'rgba(184,92,56,.6)':'var(--border2)'};
             border-radius:10px;color:var(--text);font-family:var(--font-b);font-size:14px;
             box-sizing:border-box;outline:none;transition:border .15s"
    />
    ${_loginErr ? `<div style="font-size:11px;color:#E05C38;text-align:center;padding:4px 0">${_loginErr}</div>` : ''}
  </div>

  <!-- Kirjaudu-nappi -->
  <button
    onclick="_teeSisaankirjautuminen()"
    ${_loginLng ? 'disabled' : ''}
    style="width:100%;padding:14px;background:${_loginLng?'rgba(26,122,94,.4)':'var(--teal)'};
           color:var(--text);border:none;border-radius:10px;font-size:12px;
           font-weight:600;letter-spacing:.18em;text-transform:uppercase;
           cursor:${_loginLng?'default':'pointer'};transition:background .2s"
  >
    ${_loginLng ? 'Kirjaudutaan...' : 'KIRJAUDU SISÄÄN'}
  </button>

  <!-- Apuviesti -->
  <div style="text-align:center;margin-top:20px;font-size:11px;color:var(--ink3);line-height:1.6">
    Tunnukset saat seuran toimistosta.<br>
    Ensimmäisellä kerralla tarkista sähköpostisi kutsulinkkiä varten.
  </div>

  <!-- Salasana unohtunut -->
  <button
    onclick="_lahetaSalasananpalautus()"
    style="margin-top:12px;background:transparent;border:none;
           color:rgba(26,122,94,.7);font-size:11px;letter-spacing:.1em;
           cursor:pointer;text-decoration:underline;text-underline-offset:3px"
  >
    Unohtuiko salasana?
  </button>

</div>`;
}

async function _teeSisaankirjautuminen() {
  const email = _loginEmail.trim();
  const pass  = _loginPass;

  if (!email || !pass) {
    _loginErr = 'Syötä sähköposti ja salasana.';
    draw(); return;
  }

  _loginLng = true;
  _loginErr = '';
  draw();

  try {
    await firebase.auth().signInWithEmailAndPassword(email, pass);
    // onAuthStateChanged hoitaa loput — siirtyy kotiin automaattisesti
    _loginPass = '';  // älä säilytä salasanaa muistissa
  } catch(e) {
    _loginLng = false;
    _loginErr =
      e.code === 'auth/wrong-password'    ? 'Väärä salasana.' :
      e.code === 'auth/user-not-found'    ? 'Sähköpostia ei löydy.' :
      e.code === 'auth/invalid-email'     ? 'Tarkista sähköpostiosoite.' :
      e.code === 'auth/too-many-requests' ? 'Liian monta yritystä — odota hetki.' :
      e.code === 'auth/invalid-credential'? 'Väärä sähköposti tai salasana.' :
      'Kirjautuminen epäonnistui. Tarkista yhteys.';
    draw();
  }
}

async function _lahetaSalasananpalautus() {
  const email = _loginEmail.trim();
  if (!email) {
    _loginErr = 'Kirjoita ensin sähköpostiosoite ylös.';
    draw(); return;
  }
  try {
    await firebase.auth().sendPasswordResetEmail(email);
    _loginErr = '';
    _toast('Palautuslinkki lähetetty sähköpostiisi!');
  } catch(e) {
    _loginErr = 'Sähköpostia ei löydy järjestelmästä.';
    draw();
  }
}

/* ══ KOTI ══ */
function _renderLiveFeed(){
  if(!window.TMBus) return '';
  const evts=TMBus.getEventsFor(_childId).slice(-5).reverse();
  if(!evts.length) return '';
  const fmtTime=(ts)=>{
    const diff=Date.now()-ts;
    if(diff<60000) return 'juuri nyt';
    if(diff<3600000) return Math.floor(diff/60000)+' min sitten';
    if(diff<86400000) return Math.floor(diff/3600000)+' h sitten';
    return Math.floor(diff/86400000)+' pv sitten';
  };
  return `
  <div style="margin:14px 0 18px">
    <div class="ey" style="margin-bottom:10px;display:flex;align-items:center;gap:6px"><span class="live-dot"></span>Viimeisimmät tapahtumat</div>
    <div style="display:flex;flex-direction:column;gap:8px">
      ${evts.map(e=>{
        if(e.type==='coach_message'){
          return `<div style="padding:11px 13px;background:rgba(26,122,94,.08);border-left:2px solid var(--teal);border-radius:6px">
            <div style="font-size:10px;color:#28B090;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px">Valmentajalta · ${fmtTime(e.at)}</div>
            <div style="font-size:12px;color:var(--text);line-height:1.55">${e.text||''}</div>
          </div>`;
        }
        if(e.type==='training'){
          const src=e.source==='parent'?'Kirjasit':(e.source==='coach'?'Joukkue':'Omatoimi');
          return `<div style="padding:11px 13px;background:var(--surface);border:.5px solid var(--border2);border-radius:6px;display:flex;justify-content:space-between;align-items:center">
            <div>
              <div style="font-size:11px;color:var(--text);font-weight:500">${src} · ${e.tyyppi||'treeni'}</div>
              <div style="font-size:10px;color:var(--ink3);margin-top:2px">${fmtTime(e.at)}${e.minutes?' · '+e.minutes+' min':''}</div>
            </div>
            ${e.fiilis?`<div style="font-size:18px">${['','🤕','😴','😐','😊','💪'][e.fiilis]||'😊'}</div>`:''}
          </div>`;
        }
        if(e.type==='coach_react'){
          return `<div style="padding:9px 13px;background:rgba(242,239,230,.03);border-radius:6px;font-size:11px;color:var(--ink2)">
            Valmentaja ${e.emoji||'❤️'} reagoi kirjaukseen · ${fmtTime(e.at)}
          </div>`;
        }
        return '';
      }).join('')}
    </div>
  </div>`;
}

function rKoti(){
  const d=IKA[_age];
  // U12: agentti, voi kirjata. U15: tuki. U19: vieras.
  return `
<div class="scroll">
  <!-- Tervehdys -->

/* ── Hae lapsen viimeisin T-kirjaus Firestoresta ── */
async function _haeViimeisinKirjaus() {
  if (!_db) return;
  // Haetaan kaikista pilottiseuroista — käytetään URL-parametria tai u12-oletusta
  const urlSeura = new URLSearchParams(location.search).get('seura') || 'kpv';
  const urlUid   = new URLSearchParams(location.search).get('uid');
  if (!urlUid) return; // Ei UID:tä — demo-moodi, ei haeta

  try {
    // Viimeisin kirjaus
    const snap = await _db.collection('seurat').doc(urlSeura)
      .collection('pelaajat').doc(urlUid)
      .collection('kirjaukset')
      .orderBy('luotu', 'desc')
      .limit(1)
      .get();

    if (!snap.empty) {
      const d = snap.docs[0].data();
      _viimeisinKirjaus = {
        id:       snap.docs[0].id,
        tyyppi:   d.tyyppi || 'T',
        konteksti: d.konteksti || '',
        kesto_min: d.kesto_min || 0,
        fiilis:   d.fiilis || null,
        luotu:    d.luotu?.toDate() || new Date(),
        pvm:      snap.docs[0].id,
        uid:      urlUid,
        seura:    urlSeura,
      };
    }

    // Viikon kirjaukset tarina-generaattorille
    const viikkoSitten = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000);
    const viikkoSnap = await _db.collection('seurat').doc(urlSeura)
      .collection('pelaajat').doc(urlUid)
      .collection('kirjaukset')
      .where('luotu', '>=', firebase.firestore.Timestamp.fromDate(viikkoSitten))
      .orderBy('luotu', 'desc')
      .limit(14)
      .get();

    _viikkoKirjaukset = viikkoSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    _kehuLahetetty = false;
    draw();
  } catch(e) {
    console.warn('[haeKirjaus]', e.message);
  }
}

/* ── Tarina-generaattori — muuntaa kirjauksen kertomukseksi ── */
function _tarinaOtsikko(k) {
  const nimi = IKA[_age].nimi;
  const minSitten = Math.round((Date.now() - k.luotu.getTime()) / 60000);
  const aikaStr = minSitten < 5 ? 'juuri nyt' :
                  minSitten < 60 ? `${minSitten} min sitten` :
                  minSitten < 120 ? 'tunnin sitten' : 'tänään';

  // Kontekstikohtainen otsikko
  const kontekstiOtsikot = {
    pihapeli: `${nimi} pelasi pihalla ${aikaStr}`,
    kaveri:   `${nimi} harjoitteli kaverin kanssa ${aikaStr}`,
    aamu:     `${nimi} teki aamuharjoitteen ${aikaStr}`,
    valitunti:`${nimi} treenasi välitunnilla ${aikaStr}`,
    ilta:     `${nimi} teki iltatreenin ${aikaStr}`,
    oma:      `${nimi} harjoitteli itsekseen ${aikaStr}`,
  };
  if (k.konteksti && kontekstiOtsikot[k.konteksti]) return kontekstiOtsikot[k.konteksti];

  const tyypit = {
    T: `${nimi} harjoitteli palloa ${aikaStr}`,
    D: `${nimi} teki kehonhuollon ${aikaStr}`,
    S: `${nimi} teki lihaskuntoharjoitteen ${aikaStr}`,
  };
  return tyypit[k.tyyppi] || `${nimi} treenasi ${aikaStr}`;
}

function _tarinaKuvaus(k) {
  const nimi = IKA[_age].nimi;
  const osat = [];

  // Kesto
  if (k.kesto_min >= 30) osat.push(`${k.kesto_min} minuuttia — pisin tänä viikkona`);
  else if (k.kesto_min > 0) osat.push(`${k.kesto_min} minuuttia`);

  // Konteksti — kasvutarina-sävy
  const kontekstiKuvaukset = {
    pihapeli: 'Oma-aloitteinen ulkoilu — ei pyyntiä.',
    kaveri:   'Sosiaalinen treeni kavereiden kanssa. Tärkeintä tässä iässä.',
    aamu:     'Bola Sempre: aamuharjoite ennen koulua. Bellinghamin tapa.',
    valitunti:'Välituntimikrosykli — yksi kosketushetki päivän keskellä.',
  };
  if (k.konteksti && kontekstiKuvaukset[k.konteksti]) osat.push(kontekstiKuvaukset[k.konteksti]);

  // Viikon tilanne
  const tehdytPvt = _viikkoKirjaukset.filter(p => p.tyyppi === 'T' || p.tyyppi === 'vapaa').length;
  if (tehdytPvt >= 5) osat.push(`Tämä on jo ${tehdytPvt}. kirjaus tällä viikolla.`);
  else if (tehdytPvt === 1) osat.push('Ensimmäinen kirjaus tänä viikkona.');

  return osat.join(' ') || 'Hyvää työtä tänään.';
}


/* ── Kirjaudu ulos ── */
function _kirjauduUlos() {
  try {
    Object.keys(localStorage).filter(k => /^tm_|^tm-/.test(k))
      .forEach(k => localStorage.removeItem(k));
  } catch(e) {}
  try {
    if (window.firebase && firebase.auth) {
      firebase.auth().signOut().then(() => {
        // onAuthStateChanged hoitaa siirtymisen login-näkymään
      }).catch(() => {});
    }
  } catch(e) {}
  _viimeisinKirjaus = null;
  _viikkoKirjaukset = [];
  _sc = 'login';
  draw();
  _toast('Kirjauduttu ulos');
}

// ── TMBus-yhteensopivuus: varmista että kaikki metodit ovat olemassa ──
// tm-bus.js:n eri versioilla on eri API — suojataan kaatumiselta
if (window.TMBus) {
  if (!TMBus.getEventsFor) TMBus.getEventsFor = function() { return []; };
  if (!TMBus.getPlayer)    TMBus.getPlayer    = function() { return null; };
  if (!TMBus.getTeam)      TMBus.getTeam      = function() { return { name:'KPV', id:'kpv' }; };
  if (!TMBus.publish)      TMBus.publish      = function() {};
  if (!TMBus.subscribe)    TMBus.subscribe    = function() {};
}

draw();

// TMBus subscribe — valmentajan viestit ja reagoinnit
if(window.TMBus){
  TMBus.subscribe((msg)=>{
    if(!msg || msg.kind!=='event' || !msg.evt) return;
    const evt=msg.evt;
    if(evt.playerId!==_childId) return;
    if(evt.type==='coach_message' && (evt.channel==='family'||evt.channel==='player')){
      _toast('Valmentajalta uusi viesti');
    } else if(evt.type==='coach_react'){
      _toast(`Valmentaja ${evt.emoji||'❤️'} reagoi`);
    } else if(evt.type==='training' && evt.source!=='parent'){
      _toast(`${IKA[_age].nimi} kirjasi treenin`);
    }
    // Uudelleenrenderöi aktiivinen näkymä
    draw();
  });
}

function _toast(text){
  const el=document.createElement('div');
  el.className='toast';
  el.textContent=text;
  document.body.appendChild(el);
  setTimeout(()=>el.style.opacity='0',3000);
  setTimeout(()=>el.remove(),3500);
}

// Clock
setInterval(()=>{
  const d=new Date();
  const h=String(d.getHours()).padStart(2,'0');
  const m=String(d.getMinutes()).padStart(2,'0');
  const el=document.getElementById('clock');
  if(el) el.textContent=`${h}:${m}`;
}, 1000);
</script>
