<style>
:root {
  --carbon:#1C1C1A; --bone:#F2EFE6;
  --teal:#1A7A5E; --teal-d:#28B090;
  --slate:#585751; --gold:#B8860B; --fire:#B85C38;
  --font-d:'Cormorant Garamond',Georgia,serif;
  --font-b:'DM Sans',system-ui,sans-serif;
  --font-m:'DM Mono',Menlo,monospace;
  --bg:#111110; --bg2:#161614; --surface:#1E1E1C; --surface2:#1A1A18;
  --border:rgba(242,239,230,.06); --border2:rgba(242,239,230,.12);
  --text:#F2EFE6; --ink2:#A8A79F; --ink3:#8BA0BC;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-b);background:#0a0a08;color:var(--text);min-height:100dvh;overflow-x:hidden;font-size:14px;line-height:1.7}
button{font-family:var(--font-b);cursor:pointer}

.wrap{max-width:100%;margin:0 auto;padding:14px 8px 40px;text-align:center}

/* Switcher */
.age-bar{display:inline-flex;gap:3px;background:rgba(242,239,230,.04);padding:3px;border-radius:20px;margin-bottom:10px}
.age-btn{background:transparent;color:var(--ink3);border:none;padding:6px 14px;font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;border-radius:18px;cursor:pointer;transition:all .15s}
.age-btn.on{background:var(--teal);color:var(--text)}

.scene-bar{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-bottom:10px}
.sp{background:rgba(242,239,230,.04);color:var(--ink3);border:.5px solid rgba(242,239,230,.1);padding:4px 9px;font-size:9px;letter-spacing:.16em;text-transform:uppercase;font-weight:500;border-radius:14px;cursor:pointer;transition:all .12s}
.sp.on{background:var(--teal);color:var(--text);border-color:var(--teal)}

.hint{font-size:10px;color:var(--ink3);margin-bottom:10px;letter-spacing:.04em;max-width:540px;margin-left:auto;margin-right:auto;line-height:1.55}
/* Dev-chrome (otsikko/hint/ikä-bar/scene-bar) — piilossa tuotannossa, näkyy vain ?demo=1 */
#devChrome{display:none}
body.demo-mode #devChrome{display:block}

/* Phone */
.phone{width:min(390px,100vw);margin:0 auto;background:var(--bg);border-radius:36px;border:1px solid #222;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 8px #1a1a1a;position:relative;overflow:hidden;text-align:left}
.ph-status{height:42px;padding:14px 24px 0;display:flex;justify-content:space-between;font-family:var(--font-m);font-size:12px;font-weight:500}
.ph-body{height:700px;overflow-y:auto;position:relative}
.scroll{padding:10px 18px 90px}

.tabs{position:sticky;bottom:0;background:var(--bg2);border-top:.5px solid var(--border2);display:flex;justify-content:space-around;padding:8px 0 14px}
.tb{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 12px;color:var(--ink3)}
.tb.on{color:var(--text)}
.tb svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tb.on svg{stroke:var(--teal-d);stroke-width:1.8}
.tb-lbl{font-size:9px;font-weight:500;letter-spacing:.12em;text-transform:uppercase}

.ey{font-size:9px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--ink3)}
.ey.ac{color:var(--teal-d)}

.card{background:var(--surface);border:.5px solid var(--border);border-radius:10px;padding:14px}
.card2{background:var(--surface2);border:.5px solid var(--border);border-radius:10px;padding:14px}
.card-warm{background:linear-gradient(180deg,rgba(184,134,11,.1),rgba(184,134,11,.02));border:.5px solid rgba(184,134,11,.28);border-radius:14px}
.card-teal{background:linear-gradient(180deg,rgba(26,122,94,.12),rgba(26,122,94,.02));border:.5px solid rgba(26,122,94,.3);border-radius:14px}

@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes heartbeat{0%,20%{transform:scale(1)}10%{transform:scale(1.15)}}
.scene{animation:fadeUp .28s ease}

/* Week dots */
.week-dots{display:flex;gap:4px}
.wd{flex:1;height:26px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;letter-spacing:.08em;color:var(--ink3);background:var(--surface2);border:.5px solid var(--border)}
.wd.done{background:rgba(26,122,94,.12);border-color:rgba(26,122,94,.35);color:#28B090}
.wd.miss{opacity:.45}
.wd.today{border-color:var(--teal-d)}

/* Streak flame */
.flame-dot{width:8px;height:8px;border-radius:50%;background:#B85C38;animation:heartbeat 2s ease infinite}

.divider{height:.5px;background:var(--border);margin:18px -2px}

/* Live-tila */
.live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#28B090;animation:heartbeat 2s ease infinite;margin-right:6px}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:9999;padding:11px 18px;background:rgba(26,122,94,.95);color:#fff;border-radius:22px;font-size:12px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:fadeUp .3s ease}

/* ── Tervetulo-overlay (Aloita tästä, Vaihe 2) — slide-in transformilla (§6: ei display:none-bugia) ── */
.vth-ov{position:fixed;inset:0;z-index:9500;background:rgba(6,9,15,.78);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .3s ease}
.vth-ov.vth-auki{opacity:1}
.vth-panel{background:var(--bg2);border:1px solid rgba(40,176,144,.35);border-radius:18px 18px 0 0;width:100%;max-width:480px;padding:22px 20px 26px;transform:translateY(100%);transition:transform .34s cubic-bezier(.34,1.4,.5,1);max-height:92vh;overflow-y:auto}
.vth-ov.vth-auki .vth-panel{transform:translateY(0)}
.vth-otsikko{font-family:'Cormorant Garamond',serif;font-size:25px;color:var(--text);margin-bottom:8px}
.vth-johdanto{font-size:14px;color:var(--text);line-height:1.5;margin-bottom:14px}
.vth-kultainen{background:rgba(224,160,64,.1);border:.5px solid rgba(224,160,64,.4);border-radius:12px;padding:13px 15px;font-size:13px;color:var(--text);line-height:1.5;margin-bottom:16px}
.vth-kultainen b{color:#E0A040}
.vth-listaots{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);margin-bottom:8px}
.vth-rivi{display:flex;align-items:center;gap:12px;width:100%;background:var(--surface);border:.5px solid var(--border2);border-radius:10px;padding:13px 14px;margin-bottom:8px;cursor:pointer;text-align:left;color:var(--text)}
.vth-tick{flex-shrink:0;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ink3);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--ink3)}
.vth-tick.vth-on{background:var(--teal-d);border-color:var(--teal-d);color:#fff}
.vth-rivi-txt{flex:1;font-size:13.5px;line-height:1.35}
.vth-arrow{color:var(--ink3);font-size:18px}
.vth-napit{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.vth-selva{width:100%;background:var(--teal-d);color:#fff;border:none;border-radius:10px;padding:14px;font-size:15px;font-weight:600;cursor:pointer;min-height:44px}
.vth-ohita{width:100%;background:transparent;color:var(--ink2);border:none;padding:8px;font-size:13px;cursor:pointer;min-height:44px}
@media(max-width:768px){
  .vth-panel{max-width:100%;border-radius:16px 16px 0 0}
  .vth-otsikko{font-size:23px}
}
</style>

// pelaajadatalla _kasitteleLapsi():ssä. valmentaja ei käytössä (haetaan Firestoresta).

const IKA = {

};

// Suomen genetiivi etunimelle (esim. -s → -ksen, vokaali → -n, konsonantti → -in)
function _genetiivi(nimi) {
  if (!nimi) return '';
  const n = nimi.trim();
  const viim = n[n.length-1].toLowerCase();
  if (viim === 's') return n.slice(0,-1) + 'ksen';     // päättyy s:ään → -ksen
  if ('aeiouäöy'.includes(viim)) return n + 'n';        // päättyy vokaaliin → -n
  return n + 'in';                                       // konsonantti → -in
}

let _age='u12';
let _sc='login';  // Avataan aina login-näkymästä

// Firebase
let _db = null;
let _auth = null;

function setAge(a){
  _age=a;
  document.querySelectorAll('.age-btn').forEach(b=>b.classList.toggle('on',b.dataset.age===a));
  // kirjaa-tab piilotetaan paitsi u12:lla
  const kBtn = document.querySelector('[data-s="kirjaa"]');
  if(kBtn) kBtn.style.display = a==='u12' ? '' : 'none';
  if(_sc==='kirjaa' && a!=='u12') _sc='koti';
  draw();
}

function go(s){
  if(s==='kirjaa' && _age!=='u12') return;
  _sc=s;
  document.querySelectorAll('.sp').forEach(b=>b.classList.toggle('on',b.dataset.s===s));
  draw();
}

// V1-B i18n — kielivalitsin (fi/sv/en). Näkyy kirjautumisessa (rLogin) + asetuksissa (rAsetukset). Klikkaus →

function _vanhKieliValitsinHTML(){
  if (typeof tmNykyinenKieli !== 'function') return '';
  var akt = tmNykyinenKieli();
  var nappi = function(k, lbl){
    var on = (k === akt);
    return '<button onclick="_vanhVaihdaKieli(\'' + k + '\')" aria-pressed="' + on + '" style="padding:5px 12px;border-radius:14px;border:.5px solid var(--teal,#28B090);cursor:pointer;font-size:11px;font-family:inherit;background:' + (on ? 'var(--teal,#28B090)' : 'transparent') + ';color:' + (on ? '#fff' : 'var(--teal,#28B090)') + ';opacity:' + (on ? '1' : '.6') + '">' + lbl + '</button>';
  };
  return '<div style="display:flex;gap:6px;justify-content:center">' + nappi('fi','FI') + nappi('sv','SV') + nappi('en','EN') + '</div>';

window._vanhVaihdaKieli = function(k){

};

function draw(){
  const pb=document.getElementById('phBody');
  let html='';
  if(_sc==='login') html=rLogin();
  else if(_sc==='koti') html=rKoti();
  else if(_sc==='viikko') html=rViikko();
  else if(_sc==='kirjaa') html=rKirjaa();
  else if(_sc==='valmentaja') html=rValmentaja();
  else if(_sc==='kortti') html=rKortti();
  else if(_sc==='asetukset') html=rAsetukset();
  pb.innerHTML=`<div class="scene">${html}${rTabs()}</div>`;
}

async function _teeSisaankirjautuminen() {
  const email = _loginEmail.trim();
  const pass  = _loginPass;

  if (!email || !pass) {
    _loginErr = t('vanhempi.login_syota');
    draw(); return;
  }

  _loginLng = true;
  _loginErr = '';
  draw();

  try {
    await firebase.auth().signInWithEmailAndPassword(email, pass);
    // onAuthStateChanged hoitaa loput — siirtyy kotiin automaattisesti
    _loginPass = '';  // älä säilytä salasanaa muistissa
  } catch(e) {
    _loginLng = false;
    _loginErr =
      e.code === 'auth/wrong-password'    ? t('vanhempi.login_vaara_salasana') :
      e.code === 'auth/user-not-found'    ? t('vanhempi.login_ei_sahkopostia') :
      e.code === 'auth/invalid-email'     ? t('vanhempi.login_tarkista_sahkoposti') :
      e.code === 'auth/too-many-requests' ? t('vanhempi.login_liikaa') :
      e.code === 'auth/invalid-credential'? t('vanhempi.login_vaara_tunnus') :
      t('vanhempi.login_epaonnistui');
    draw();
  }
}

async function _lahetaSalasananpalautus() {
  const email = _loginEmail.trim();
  if (!email) {
    _loginErr = t('vanhempi.login_kirjoita_email');
    draw(); return;
  }
  try {
    await firebase.auth().sendPasswordResetEmail(email);
    _loginErr = '';
    _toast(t('vanhempi.toast_reset_linkki'));
  } catch(e) {
    _loginErr = t('vanhempi.login_ei_jarjestelmassa');
    draw();
  }
}

/* Toggle monivalinnassa — lisää tai poista tyyppi */
function _toggleTyyppi(k) {
  if (_pTyypit.has(k)) {
    _pTyypit.delete(k);
  } else {
    _pTyypit.add(k);
  }
  draw();
}

async function _perheKirjaa(){
  if(_pTyypit.size===0 || !_pFiilis || !_pMinuutit) return;

  const fiilisMap = {vasynyt:2, iloinen:4, innoissaan:5, loukkasi:1};
  const tyypit    = [..._pTyypit];
  // Onko pallokosketusta mukana — pihapeli tai leikkiä pallolla
  const onT       = tyypit.some(t => t==='pihapeli' || t==='pallo');
  const paatyyppi = onT ? 'T' : 'vapaa';   // T = tallentuu streakiin

  // Pvm tänään muodossa YYYY-MM-DD
  const nyt = new Date();
  const pvm = nyt.toISOString().slice(0,10);

  // ── TMBus: demo-moodi & valmentajan live-feed ──────────────────────
  if (window.TMBus) {
    TMBus.publish('training', {
      playerId:  _childId,
      source:    'parent',
      tyyppi:    paatyyppi,
      tyypit:    tyypit,            // kaikki valitut aktiviteetit
      minutes:   _pMinuutit,        // oikea aika
      fiilis:    fiilisMap[_pFiilis] || 4,
      note:      _pTeksti || ''
    });
  }

  // ── Firestore: tallenna oikea kirjaus pelaajan kokoelmaan ──────────
  // Hyväksy molemmat param-nimet (reset-linkki: pelaajaId/seuraId; legacy: uid/seura).
  const _qs = new URLSearchParams(location.search);
  const urlSeura = _qs.get('seura') || _qs.get('seuraId');
  const urlUid   = _qs.get('uid')   || _qs.get('pelaajaId');

  if (_db && urlSeura && urlUid) {
    // Reaalitila: tallenna Firestoreen. Epäonnistuminen EI saa näkyä hiljaa (oli aiemmin
    // pelkkä console.warn → "treeni kirjattu" -toast valehteli vaikka mitään ei tallentunut).
    try {
      await _db.collection('seurat').doc(urlSeura)
        .collection('pelaajat').doc(urlUid)
        .collection('kirjaukset').doc(pvm)
        .set({
          tyyppi:     paatyyppi,        // 'T' tai 'vapaa'
          tyypit:     tyypit,           // ['pihapeli','pallo'] jne.
          kesto_min:  _pMinuutit,       // kesto minuutteina (nappivalinta 15–120)
          fiilis:     fiilisMap[_pFiilis] || 4,
          lahde:      'vanhempi',       // kuka kirjasi
          teksti:     _pTeksti || null,
          luotu:      firebase.firestore.FieldValue.serverTimestamp(),
          tehty:      true,
        }, { merge: true });
    } catch(e) {
      console.warn('[perheKirjaa Firestore]', e.code, e.message);
      _toast(e.code === 'permission-denied'
        ? t('vanhempi.kirjaa_virhe_oikeus')
        : t('vanhempi.kirjaa_virhe_verkko'));
      return;   // ÄLÄ tyhjennä lomaketta — vanhempi voi yrittää uudelleen
    }
  } else if (_db && (!urlSeura || !urlUid)) {
    // Firestore käytössä mutta linkin parametrit puuttuvat → ei voida tallentaa
    _toast(t('vanhempi.kirjaa_toast_virhe'));
    return;   // ÄLÄ tyhjennä lomaketta
  }
  // else: demo-tila (ei _db) → TMBus-julkaisu hoiti, jatketaan vahvistukseen

  // Onnistui (tai demo) — tyhjennä tila + vahvista
  _pTyypit   = new Set();
  _pFiilis   = null;
  _pTeksti   = '';
  _pMinuutit = null;
  _viimeisinKirjaus = null; // pakottaa uuden haun KOTI:ssa
  _kehuLahetetty    = false;

  _sc = 'koti';
  document.querySelectorAll('.sp').forEach(b=>b.classList.toggle('on',b.dataset.s==='koti'));
  draw();
  _toast(t('vanhempi.toast_treeni_kirjattu') + (onT ? t('vanhempi.toast_pallo_ok') : '') + '!');
}

/* ══ KAUSIKORTTI ══ */
/* ══ TEKNIIKKAPROFIILI + "MITEN TUKEA" (perheviestinnän §7.22) ══
   Sama positiivinen kehys kuin Pelaaja_v7:llä (commit 0ec7cab / lajipalkkikorjaus d17c528),
   + vanhemmalle suunnattu tukikerros. EI tasolukuja, EI vertailua, EI TKI-laskua/punaisia deltoja.
   Data pelaajadokumentin pikakentistä (window._lapsi, §26). tkLajiViite/tkSekuntibudjetti window.TM_TESTIT:stä. */
// V4-B: arvot = tm_lang-avaimet (module-const → arvot evaluoituvat kerran latauksessa; kieli valitaan käyttöhetkellä t():llä)
const _VANH_LAJINIMI = { ponnauttelu:'vanhempi.laji_ponnauttelu', syotto:'vanhempi.laji_syotto', pujottelu:'vanhempi.laji_pujottelu', kuljetus_laukaus:'vanhempi.laji_kuljetus_laukaus', pituuspotku_bonus:'vanhempi.laji_pituuspotku' };
// V4-B: arvot = tm_lang-avaimet (module-const → käännös käyttöhetkellä t():llä)
const TUKIVINKIT = {
  syotto: 'vanhempi.tuki_syotto',
  pujottelu: 'vanhempi.tuki_pujottelu',
  ponnauttelu: 'vanhempi.tuki_ponnauttelu',
  kuljetus_laukaus: 'vanhempi.tuki_kuljetus',
  pituuspotku: 'vanhempi.tuki_potku'
};
// Saavutettava välitavoite (sama logiikka kuin Pelaaja_v7 _minaValitavoite).
function _vanhValitavoite(arvo, viite, kaant) {
  const gap = kaant ? (viite.hyva - arvo) : (arvo - viite.hyva);
  let t = (gap <= 3) ? viite.hyva : (kaant ? (arvo + 3) : (arvo - 3));
  return Math.round(t * 2) / 2;
}
function rVanhempiTekniikka(){
  const L = window._lapsi || {};
  const nimi = (IKA[_age] && IKA[_age].nimi) || L.etunimi || 'lapsesi';
  const lajit = L.tk_lajit_viimeisin;
  const box = (inner) => `<div class="card2" style="padding:16px;margin-bottom:12px">
    <div class="ey ac" style="margin-bottom:10px">${t('vanhempi.tek_profiili')}</div>${inner}</div>`;
  // Tyhjätila (positiivinen, §7.22) — ei TK-dataa
  if (!lajit || L.tki_viimeisin == null) {
    return box(`<div style="font-size:12px;color:var(--ink2);line-height:1.6">${t('vanhempi.tek_mittaukset_tulossa').replace('{gen}', _genetiivi(nimi))}</div>`);
  }
  const T = window.TM_TESTIT;
  const sp = (String(L.sukupuoli || '').toUpperCase() === 'N') ? 'T' : 'P';
  const ika = L.syntymaVuosi ? (new Date().getFullYear() - L.syntymaVuosi) : null;
  const viiteOf = (laji) => (T && T.tkLajiViite && ika != null) ? T.tkLajiViite(laji, ika, sp) : null;
  const arvoOf = (id) => { const x = lajit[id + '_s']; return (x == null || isNaN(x)) ? null : Number(x); };
  const merkkiVari = { kulta:'#D4AF37', hopea:'#9AA0A6', pronssi:'#B87333' };
  let inner = '';
  // 1. TKI + merkki + mitattu pvm
  inner += `<div style="display:flex;align-items:baseline;gap:10px;margin-bottom:4px">
    <div style="font-family:var(--font-d);font-weight:300;font-size:40px;color:#28B090;line-height:1">${L.tki_viimeisin != null ? L.tki_viimeisin : '—'}</div>
    <div style="font-size:11px;color:var(--ink3)">TKI</div>
    ${L.tki_merkki ? `<div style="margin-left:auto;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;background:${(merkkiVari[L.tki_merkki]||'#8C8B86')}22;color:${merkkiVari[L.tki_merkki]||'#8C8B86'};text-transform:capitalize">${L.tki_merkki}</div>` : ''}</div>`;
  if (L.tk_lajit_pvm) inner += `<div style="font-size:10px;color:var(--ink3);margin-bottom:6px">${t('vanhempi.tek_mitattu').replace('{pvm}', L.tk_lajit_pvm)}</div>`;
  // 2. Vahvuus ensin (prosessikehu)
  if (L.tki_vahvuus && _VANH_LAJINIMI[L.tki_vahvuus]) {
    inner += `<div style="font-size:13px;color:var(--text);margin-top:10px">⭐ <b>${t('vanhempi.tek_vahvuus')}</b> ${t(_VANH_LAJINIMI[L.tki_vahvuus])}
      <div style="font-size:12px;color:var(--ink2);margin-top:2px">${t('vanhempi.tek_vahvin_laji').replace('{gen}', _genetiivi(nimi))}</div></div>`;
  }
  // 3. Seuraava askel — yksi kehityskohde + saavutettava välitavoite
  if (L.tki_kehityskohde && _VANH_LAJINIMI[L.tki_kehityskohde]) {
    const kk = L.tki_kehityskohde, arvo = arvoOf(kk), kv = viiteOf(kk);
    inner += `<div style="font-size:13px;color:var(--text);margin-top:10px">🎯 <b>${t('vanhempi.tek_seuraava_askel')}</b> ${t(_VANH_LAJINIMI[kk])}`;
    if (arvo != null && kv) {
      const kaant = (kk === 'pituuspotku_bonus');
      inner += `<div style="font-size:12px;color:var(--ink2);margin-top:2px">${t('vanhempi.tek_nyt_tavoite').replace('{x}', Math.round(arvo*10)/10).replace('{y}', _vanhValitavoite(arvo, kv, kaant))}</div>
        <div style="font-size:12px;color:var(--ink2)">${t('vanhempi.tek_pieni_parannus')}</div>`;
    }
    inner += `</div>`;
  }
  // 4. Mitalimatka — vain ≤15 s, positiivisesti
  if (T && T.tkSekuntibudjetti && L.tk_kokonaistulos_viimeisin != null && ika != null) {
    const budj = T.tkSekuntibudjetti(L.tk_kokonaistulos_viimeisin, ika, sp);
    const MM = { kulta:'vanhempi.mm_kulta', hopea:'vanhempi.mm_hopea', pronssi:'vanhempi.mm_pronssi' };
    if (budj && budj.gap_s > 0 && budj.gap_s <= 15) {
      inner += `<div style="font-size:12px;color:var(--text);margin-top:6px">${t('vanhempi.tek_matka').replace('{mitali}', MM[budj.tavoite] ? t(MM[budj.tavoite]) : '').replace('{gap}', budj.gap_s)}</div>`;
    }
  }
  // 5. Lajipalkit — täyttö = HYVYYS (clamp(100×erinomainen/arvo,10,100)); fallback käännetty suhteutus
  const PALKIT = ['ponnauttelu','syotto','pujottelu','kuljetus_laukaus'];
  const vals = PALKIT.map(id => ({ id, val: arvoOf(id) })).filter(x => x.val != null);
  if (vals.length) {
    const max = Math.max.apply(null, vals.map(x => x.val));
    inner += `<div style="margin-top:12px;display:flex;flex-direction:column;gap:6px">`;
    vals.forEach(x => {
      const viite = viiteOf(x.id);
      const pct = (viite && viite.erinomainen && x.val > 0)
        ? Math.round(Math.max(10, Math.min(100, 100 * viite.erinomainen / x.val)))
        : Math.round(Math.max(10, Math.min(100, ((max - x.val) / max) * 100)));
      const onV = (x.id === L.tki_vahvuus), onK = (x.id === L.tki_kehityskohde);
      const vari = onV ? '#28B090' : onK ? '#E0A040' : '#8C8B86';
      const mark = onV ? ' ★' : onK ? ' 🎯' : '';
      inner += `<div style="display:flex;align-items:center;gap:8px">
        <div style="width:96px;font-size:11px;color:var(--ink3);text-align:right">${_VANH_LAJINIMI[x.id]?t(_VANH_LAJINIMI[x.id]):x.id}${mark}</div>
        <div style="flex:1;background:rgba(242,239,230,.06);border-radius:3px;height:14px;overflow:hidden"><div style="width:${pct}%;height:100%;background:${vari}"></div></div>
        <div style="width:42px;font-size:10px;color:var(--text);text-align:right">${x.val.toFixed(1)}s</div></div>`;
    });
    inner += `</div>`;
  }
  // 6. 💛 Miten tukea kotona — näkymän ydin (kehityskohteen mukaan) + pysyvä periaaterivi
  const tukiKey = (L.tki_kehityskohde || '').replace('_bonus','');
  const tuki = TUKIVINKIT[tukiKey];
  inner += `<div style="margin-top:14px;padding:12px;background:rgba(184,134,11,.06);border:.5px solid rgba(184,134,11,.25);border-radius:8px">
    <div style="font-size:12px;font-weight:600;color:var(--gold);margin-bottom:6px">💛 ${t('vanhempi.tek_miten_tukea')}</div>`;
  if (tuki) inner += `<div style="font-size:12px;color:var(--ink2);line-height:1.6">${t(tuki)}</div>`;
  inner += `<div style="font-size:11px;color:var(--ink3);line-height:1.6;margin-top:${tuki?'8px':'0'}">${t('vanhempi.tek_tarkeinta')}</div></div>`;
  return box(inner);
}

/* ══════════════════════════════════════════════════════════
   Tervetulo-overlay (Aloita tästä, Vaihe 2/Vanhempi) — lämmin sävy (§7.22/§34).
   Sisältö: johdanto + kultainen sääntö + kevyt "Näin olet mukana" -lista (klikattava → vie näkymään).
   EI tasoja/lukuja/vertailua. Gating: localStorage tm_vanhempi_aloitettu_<pelaajaId>. String concat §7.1.
══════════════════════════════════════════════════════════ */
function _vthEsc(s){ return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function _vthAvain(){
  var L = window._lapsi || {};
  var qs = new URLSearchParams(location.search);
  var pid = L.uid || L.id || qs.get('pelaajaId') || qs.get('uid') || L.pin || '';
  return pid ? ('tm_vanhempi_aloitettu_' + pid) : '';
}
function _naytaVanhTervetulo(){
  var L = window._lapsi; if (!L) return;
  var avain = _vthAvain(); if (!avain) return;
  try { if (localStorage.getItem(avain)) return; } catch (e) { return; }
  if (document.getElementById('vanhTervetuloOv')) return;
  var nimi = _vthEsc(L.etunimi || '');
  var gen = (nimi && typeof _genetiivi === 'function') ? _vthEsc(_genetiivi(L.etunimi)) : (nimi || 'lapsesi');
  var alle13 = (_age === 'u12');   // Kirjaa-kohta vain alle 13-vuotiaan vanhemmalle
  var kehuTehty = (typeof _kehuLahetetty !== 'undefined' && _kehuLahetetty === true);
  var kirjausTehty = (typeof _viimeisinKirjaus !== 'undefined' && !!_viimeisinKirjaus);
  function tick(done){ return done ? '<span class="vth-tick vth-on">✓</span>' : '<span class="vth-tick">○</span>'; }
  function rivi(done, txt, nakyma){ return '<button class="vth-rivi" onclick="_vthMene(\'' + nakyma + '\')">' + tick(done) + '<span class="vth-rivi-txt">' + txt + '</span><span class="vth-arrow">›</span></button>'; }
  // V1-B2 i18n: nimen taivutus poistettu — toimintorivit ilman nimen taivutusta (robusti, kestää mielivaltaiset nimet; ei suomen taivutushelperiä).
  var lista = rivi(kehuTehty, t('vanhempi.tervetulo_kehu'), 'koti')
    + rivi(false, t('vanhempi.tervetulo_kortti'), 'kortti')
    + rivi(false, t('vanhempi.tervetulo_viestit'), 'valmentaja')
    + (alle13 ? rivi(kirjausTehty, t('vanhempi.tervetulo_kirjaa'), 'kirjaa') : '');
  var ov = document.createElement('div');
  ov.id = 'vanhTervetuloOv'; ov.className = 'vth-ov';
  ov.onclick = function (e){ if (e.target === ov) window._suljeVanhTervetulo(); };
  // V1-B2 i18n: johdanto ilman nimen taivutusta ("lapsesi" / "ditt barns" / "your child's") → ei {gen}-substituutiota.
  ov.innerHTML = '<div class="vth-panel" role="dialog" aria-label="Tervetuloa">'
    + '<div class="vth-otsikko">' + t('vanhempi.tervetulo_hei') + '</div>'
    + '<div class="vth-johdanto">' + t('vanhempi.tervetulo_johdanto') + '</div>'
    + '<div class="vth-kultainen">⭐ <b>' + t('vanhempi.kultainen_otsikko') + '</b> ' + t('vanhempi.kultainen_teksti') + '</div>'
    + '<div class="vth-listaots">' + t('vanhempi.nain_mukana') + '</div>'
    + lista
    + '<div class="vth-napit"><button class="vth-selva" onclick="_suljeVanhTervetulo()">' + t('vanhempi.selva') + '</button><button class="vth-ohita" onclick="_suljeVanhTervetulo()">' + t('vanhempi.ohita') + '</button></div>'
    + '</div>';
  document.body.appendChild(ov);
  requestAnimationFrame(function (){ ov.classList.add('vth-auki'); });   // slide-in (ei display:none-bugi §6)
}
window._vthMene = function (nakyma){ window._suljeVanhTervetulo(); if (typeof go === 'function') go(nakyma); };
window._suljeVanhTervetulo = function (){
  var avain = _vthAvain(); try { if (avain) localStorage.setItem(avain, '1'); } catch (e) {}
  var ov = document.getElementById('vanhTervetuloOv');
  if (ov){ ov.classList.remove('vth-auki'); setTimeout(function (){ if (ov.parentNode) ov.remove(); }, 320); }
};
window._naytaVanhOpasUudelleen = function (){
  var avain = _vthAvain(); try { if (avain) localStorage.removeItem(avain); } catch (e) {}
  var ov = document.getElementById('vanhTervetuloOv'); if (ov && ov.parentNode) ov.remove();
  _naytaVanhTervetulo();
};

/* ── P3/Bug2: käsittele ladattu pelaajadokumentti (nimi/ryhmä/hero + synttäri) ──
   Ajetaan AINA kun lapsi on ladattu — sekä suoralla uid-reitillä että huoltajaEmail-haulla. */
function _kasitteleLapsi(lapsi) {
  if (!lapsi) return;
  window._lapsi = lapsi;
  // V4-A3 Osa B: sovella seuran oletuskieli lapsen pelaajadokin kieli-kentästä (denormalisoitu, reitti 1).
  // tmKieliInitSeura: käyttäjän manuaalivalinta (localStorage['tm_kieli']) VOITTAA yhä seura-oletuksen.
  if (typeof tmKieliInitSeura === 'function') tmKieliInitSeura(lapsi && lapsi.kieli ? lapsi.kieli : null);
  if (typeof draw === 'function') draw();
  // P7-c-fix (A): kalenterilataus saattoi bailata ennen _lapsi/auth-valmiutta (ei latchattu) → yritä nyt.
  window._vanhKalLadattu = false; if (typeof _vanhLataaKalenteri === 'function') _vanhLataaKalenteri();
  // P7-c.4a: sama uudelleenyritys notifeille.
  window._vanhNotifLadattu = false; if (typeof _vanhLataaNotif === 'function') _vanhLataaNotif();
  const ika = new Date().getFullYear() - (lapsi.syntymaVuosi || 2012);
  _age = ika <= 12 ? 'u12' : ika <= 15 ? 'u15' : 'u19';
  const _realNimi = lapsi.etunimi || IKA[_age].nimi;
  IKA[_age].nimi  = _realNimi;
  IKA[_age].ika   = ika;
  IKA[_age].ryhma = lapsi.joukkue || lapsi.joukkueNimi || IKA[_age].ryhma;
  // Hero-fallback (näkyy vain kun ei vielä kirjausta): neutraali tervetuloa — EI keksittyä aktiviteettia.
  IKA[_age].hero = {
    t: t('vanhempi.hero_tervetuloa_app').replace('{nimi}', _realNimi),
    s: t('vanhempi.hero_tyhja').replace('{gen}', _genetiivi(_realNimi))
  };
  setAge(_age);
  draw();
  // Vaihe 2 — tervetulo-overlay ensimmäisellä kirjautumisella (localStorage-gating, §7.22/§34-turvallinen).
  setTimeout(function () { _naytaVanhTervetulo(); }, 500);
  // ── Syntymäpäiväviesti vanhemmalle — synttäri TÄLLÄ VIIKOLLA (ma–su) ──
  if (lapsi.syntymaaika) {
    const syn = lapsi.syntymaaika.toDate ? lapsi.syntymaaika.toDate() : new Date(lapsi.syntymaaika);
    const nyt = new Date();
    const synTanaVuonna = new Date(nyt.getFullYear(), syn.getMonth(), syn.getDate());
    const _viikonAlku = function(d) {
      const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      x.setDate(x.getDate() - ((x.getDay() + 6) % 7));  // ma = viikon alku
      x.setHours(0, 0, 0, 0);
      return x;
    };
    const onTanaan        = synTanaVuonna.getMonth() === nyt.getMonth() && synTanaVuonna.getDate() === nyt.getDate();
    const onTallaViikolla = _viikonAlku(synTanaVuonna).getTime() === _viikonAlku(nyt).getTime();
    if (onTanaan || onTallaViikolla) {
      const ikaluku = nyt.getFullYear() - syn.getFullYear();
      _toast(onTanaan
        ? (t('vanhempi.synttari_tanaan').replace('{gen}', _genetiivi(_realNimi)).replace('{n}', ikaluku))
        : (t('vanhempi.synttari_viikolla').replace('{gen}', _genetiivi(_realNimi)).replace('{n}', ikaluku)),
        6000);
    }
  }
}

async function _haeViimeisinKirjaus() {
  if (!_db) return;
  // Bug 1: hyväksy molemmat param-nimet — reset-linkki emittoi pelaajaId/seuraId, legacy uid/seura.
  const _qs = new URLSearchParams(location.search);
  let urlSeura = _qs.get('seura') || _qs.get('seuraId') || 'kpv';
  let urlUid   = _qs.get('uid')   || _qs.get('pelaajaId') || null;

  // Bug 2: lataa pelaajadokumentti AINA kun uid+seura tiedossa — riippumatta reitistä.
  if (urlUid && urlSeura) {
    // Suora linkki: lue pelaajadoc suoraan (huoltaja-lukuoikeus sallii, onLapsenHuoltaja).
    try {
      const pd = await _db.collection('seurat').doc(urlSeura)
        .collection('pelaajat').doc(urlUid).get();
      if (pd.exists) _kasitteleLapsi(pd.data());
    } catch(e) {
      console.warn('[Perhe] suora pelaajalataus epäonnistui:', e.message);
    }
  } else {
    // Fallback: ei uid:ia URL:ssa → resolvoi lapsi autentikoidusta emailista Cloud Functionilla.
    // Client EI voi tehdä tätä: Rules estävät seurat-listauksen + cross-seura-haun, eikä
    // huoltajalla ole seuraId-claimia. CF (Admin SDK) ohittaa Rulesit ja palauttaa VAIN ne
    // lapset joiden huoltajaEmail == kutsujan autentikoitu email. (Linkin kautta tultaessa
    // uid+seura on jo URL:ssa eikä tätä tarvita.)
    const user = _auth.currentUser;
    if (!user || !user.email) return;
    try {
      const haeLapsi = firebase.app().functions('europe-west1').httpsCallable('haeLapsiHuoltajalle');
      const res = await haeLapsi();
      const lapset = (res.data && res.data.lapset) || [];
      if (!lapset.length) {
        console.warn('[Perhe] Ei löydy pelaajaa huoltajaEmail:lla', user.email);
        _toast(t('vanhempi.toast_ei_lasta'));
        return;
      }
      const lapsi = lapset[0];   // useampi lapsi → oletuksena ensimmäinen
      urlSeura = lapsi.seura;
      urlUid   = lapsi.uid;
      const pSnap = await _db.collection('seurat').doc(urlSeura)
        .collection('pelaajat').doc(urlUid).get();
      if (pSnap.exists) _kasitteleLapsi(pSnap.data());
    } catch(e) {
      console.warn('[Perhe] lapsi-haku epäonnistui:', e.code || '', e.message);
      _toast(t('vanhempi.toast_lapsi_haku_virhe'));
      return;
    }
  }

  try {
    // Viimeisin kirjaus
    const snap = await _db.collection('seurat').doc(urlSeura)
      .collection('pelaajat').doc(urlUid)
      .collection('kirjaukset')
      .orderBy('luotu', 'desc')
      .limit(1)
      .get();

    if (!snap.empty) {
      const d = snap.docs[0].data();
      _viimeisinKirjaus = {
        id:       snap.docs[0].id,
        tyyppi:   d.tyyppi || 'T',
        konteksti: d.konteksti || '',
        kesto_min: d.kesto_min || 0,
        fiilis:   d.fiilis || null,
        luotu:    d.luotu?.toDate() || new Date(),
        pvm:      snap.docs[0].id,
        uid:      urlUid,
        seura:    urlSeura,
      };
    }

    // Viikon kirjaukset tarina-generaattorille
    const viikkoSitten = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000);
    const viikkoSnap = await _db.collection('seurat').doc(urlSeura)
      .collection('pelaajat').doc(urlUid)
      .collection('kirjaukset')
      .where('luotu', '>=', firebase.firestore.Timestamp.fromDate(viikkoSitten))
      .orderBy('luotu', 'desc')
      .limit(14)
      .get();

    _viikkoKirjaukset = viikkoSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    _kehuLahetetty = false;

    // Valmentajan viestit (havainnot, tyyppi:'valmentaja_viesti'). Suodatus client-puolella
    // (ei vaadi composite-indeksiä); järjestys luotu desc.
    try {
      const vSnap = await _db.collection('seurat').doc(urlSeura)
        .collection('pelaajat').doc(urlUid).collection('havainnot')
        .where('tyyppi', '==', 'valmentaja_viesti').limit(20).get();
      _valmentajaViestit = vSnap.docs.map(d => ({ id: d.id, ...d.data() }))
        .sort(function(a, b){
          const ta = (a.luotu && a.luotu.toDate) ? a.luotu.toDate().getTime() : 0;
          const tb = (b.luotu && b.luotu.toDate) ? b.luotu.toDate().getTime() : 0;
          return tb - ta;
        });
    } catch(e) { console.warn('[valmentajaViestit]', e.message); _valmentajaViestit = []; }

    draw();
  } catch(e) {
    console.warn('[haeKirjaus]', e.message);
  }
}

/* ── Lähetä kehu pelaajalle → Firestore ── */
async function _lahetaKehu(emoji, teksti) {
  if (_kehuLahetetty || !_db || !_viimeisinKirjaus) return;
  const { seura, uid } = _viimeisinKirjaus;
  const d = IKA[_age];

  try {
    await _db.collection('seurat').doc(seura)
      .collection('pelaajat').doc(uid)
      .collection('kehut')
      .add({
        emoji,
        teksti,
        lahettaja: 'Vanhempi',        // myöhemmin: oikea huoltajan nimi
        luotu: firebase.firestore.FieldValue.serverTimestamp(),
        nahty: false,
        kirjausId: _viimeisinKirjaus.id,
      });
    _kehuLahetetty = true;
    _toast(emoji + ' ' + t('vanhempi.toast_kehu_lahetetty'));
    draw();
  } catch(e) {
    console.warn('[lahetaKehu]', e.message);
    _toast(t('vanhempi.toast_kehu_virhe'));
  }
}

/* ── Tarina-generaattori — muuntaa kirjauksen kertomukseksi ── */
function _tarinaOtsikko(k) {
  const nimi = IKA[_age].nimi;
  const minSitten = Math.round((Date.now() - k.luotu.getTime()) / 60000);
  const aikaStr = minSitten < 5 ? t('vanhempi.aika_juuri_nyt') :
                  minSitten < 60 ? t('vanhempi.aika_min_sitten').replace('{n}', minSitten) :
                  minSitten < 120 ? t('vanhempi.aika_tunnin_sitten') : t('vanhempi.aika_tanaan');

  // Kontekstikohtainen otsikko
  const kontekstiOtsikot = {
    pihapeli: `${nimi} pelasi pihalla ${aikaStr}`,
    kaveri:   `${nimi} harjoitteli kaverin kanssa ${aikaStr}`,
    aamu:     `${nimi} teki aamuharjoitteen ${aikaStr}`,
    valitunti:`${nimi} treenasi välitunnilla ${aikaStr}`,
    ilta:     `${nimi} teki iltatreenin ${aikaStr}`,
    oma:      `${nimi} harjoitteli itsekseen ${aikaStr}`,
  };
  if (k.konteksti && kontekstiOtsikot[k.konteksti]) return kontekstiOtsikot[k.konteksti];

  const tyypit = {
    T: `${nimi} treenasi ${aikaStr}`,
    D: `${nimi} teki kehonhuollon ${aikaStr}`,
    S: `${nimi} teki lihaskuntoharjoitteen ${aikaStr}`,
    P: `${nimi} pelasi ${aikaStr}`,
    jalkapallo: `${nimi} treenasi jalkapalloa ${aikaStr}`,
    muu_urheilu: `${nimi} urheili ${aikaStr}`,
    lepo: `${nimi} piti lepopäivän ${aikaStr}`,
  };
  return tyypit[k.tyyppi] || `${nimi} treenasi ${aikaStr}`;
}

function _tarinaKuvaus(k) {
  const nimi = IKA[_age].nimi;
  const osat = [];

  // Kesto
  if (k.kesto_min >= 30) osat.push(t('vanhempi.osat_pisin').replace('{n}', k.kesto_min));
  else if (k.kesto_min > 0) osat.push(t('vanhempi.osat_minuuttia').replace('{n}', k.kesto_min));

  // Konteksti — kasvutarina-sävy
  const kontekstiKuvaukset = {
    pihapeli: 'vanhempi.mikro_ulkoilu',
    kaveri:   'vanhempi.mikro_sosiaalinen',
    aamu:     'vanhempi.mikro_bola',
    valitunti:'vanhempi.mikro_valitunti',
  };
  if (k.konteksti && kontekstiKuvaukset[k.konteksti]) osat.push(t(kontekstiKuvaukset[k.konteksti]));

  // Viikon tilanne
  const tehdytPvt = _viikkoKirjaukset.filter(p => p.tyyppi === 'T' || p.tyyppi === 'vapaa').length;
  if (tehdytPvt >= 5) osat.push(t('vanhempi.osat_kirjaus_n').replace('{n}', tehdytPvt));
  else if (tehdytPvt === 1) osat.push(t('vanhempi.osat_ensimmainen'));

  return osat.join(' ') || t('vanhempi.osat_hyvaa_tyota');
}


/* ── Kopioi pelaajan PIN leikepöydälle ── */
function _kopioiPin(pin) {
  if (!pin) return;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(String(pin))
      .then(function(){ _toast(t('vanhempi.toast_pin_kopioitu')); })
      .catch(function(){ _toast(t('vanhempi.toast_kopioi_pin')); });
  } else { _toast(t('vanhempi.toast_kopioi_pin')); }
}

/* ── Kirjaudu ulos ── */
function _kirjauduUlos() {
  try {
    Object.keys(localStorage).filter(k => /^tm_|^tm-/.test(k))
      .forEach(k => localStorage.removeItem(k));
  } catch(e) {}
  try {
    if (window.firebase && firebase.auth) {
      firebase.auth().signOut().then(() => {
        // onAuthStateChanged hoitaa siirtymisen login-näkymään
      }).catch(() => {});
    }
  } catch(e) {}
  _viimeisinKirjaus = null;
  _viikkoKirjaukset = [];
  _sc = 'login';
  draw();
  _toast(t('vanhempi.toast_kirjauduttu_ulos'));
}

// ── TMBus-yhteensopivuus: varmista että kaikki metodit ovat olemassa ──
// tm-bus.js:n eri versioilla on eri API — suojataan kaatumiselta
if (window.TMBus) {
  if (!TMBus.getEventsFor) TMBus.getEventsFor = function() { return []; };
  if (!TMBus.getPlayer)    TMBus.getPlayer    = function() { return null; };
  if (!TMBus.getTeam)      TMBus.getTeam      = function() { return { name:'KPV', id:'kpv' }; };
  if (!TMBus.publish)      TMBus.publish      = function() {};
  if (!TMBus.subscribe)    TMBus.subscribe    = function() {};
}

draw();

// TMBus subscribe — valmentajan viestit ja reagoinnit
if(window.TMBus){
  TMBus.subscribe((msg)=>{
    if(!msg || msg.kind!=='event' || !msg.evt) return;
    const evt=msg.evt;
    if(evt.playerId!==_childId) return;
    if(evt.type==='coach_message' && (evt.channel==='family'||evt.channel==='player')){
      _toast(t('vanhempi.toast_uusi_viesti'));
    } else if(evt.type==='coach_react'){
      _toast(t('vanhempi.toast_valmentaja_reagoi').replace('{emoji}', evt.emoji||'❤️'));
    } else if(evt.type==='training' && evt.source!=='parent'){
      _toast(t('vanhempi.toast_kirjasi_treenin').replace('{nimi}', IKA[_age].nimi));
    }
    // Uudelleenrenderöi aktiivinen näkymä
    draw();
  });
}

function _toast(text){
  const el=document.createElement('div');
  el.className='toast';
  el.textContent=text;
  document.body.appendChild(el);
  setTimeout(()=>el.style.opacity='0',3000);
  setTimeout(()=>el.remove(),3500);
}

// Clock
setInterval(()=>{
  const d=new Date();
  const h=String(d.getHours()).padStart(2,'0');
  const m=String(d.getMinutes()).padStart(2,'0');
  const el=document.getElementById('clock');
  if(el) el.textContent=`${h}:${m}`;
}, 1000);
