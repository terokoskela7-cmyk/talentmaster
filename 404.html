<!DOCTYPE html>
<html lang="fi" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sivua ei löytynyt — TalentMaster™</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
/* Sama brändilukko kuin index.html. Puhdas staattinen — Firebase tarjoilee tämän
   jokaiselle tuntemattomalle polulle, joten sivu ei saa riippua mistään SDK:sta. */
:root[data-theme="dark"] {
  --bg: #111110; --bg2: #161614; --teal: #28B090;
  --ink: #E8EEF8; --ink2: #9AAAC4; --ink3: #6B82A8;
  --border: rgba(255,255,255,.08); --ov-1: rgba(255,255,255,.04);
  --teal-tint: rgba(40,176,144,.10);
}
:root[data-theme="light"] {
  --bg: #F2EFE6; --bg2: #FAF9F4; --teal: #1A7A5E;
  --ink: rgba(28,28,26,.95); --ink2: rgba(28,28,26,.62); --ink3: rgba(28,28,26,.55);
  --border: rgba(28,28,26,.12); --ov-1: rgba(28,28,26,.03);
  --teal-tint: rgba(26,122,94,.08);
}
:root {
  --font-serif: 'Cormorant Garamond', Georgia, serif;
  --font-sans: 'DM Sans', system-ui, -apple-system, sans-serif;
  --font-mono: 'DM Mono', ui-monospace, Menlo, monospace;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-sans);
  font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased;
  min-height: 100vh; display: flex; flex-direction: column;
}
.tb {
  display: flex; align-items: center; gap: 10px; padding: 0 24px; height: 56px;
  border-bottom: .5px solid var(--border); background: var(--bg2);
}
.tb-mark { width: 22px; height: 22px; color: var(--ink); }
.tb-nimi { font-family: var(--font-serif); font-size: 19px; font-weight: 400; }
.tb-nimi sup { font-size: 9px; vertical-align: super; color: var(--ink3); font-family: var(--font-sans); }
main {
  flex: 1; display: flex; align-items: center;
  width: 100%; max-width: 980px; margin: 0 auto; padding: 0 24px;
}
.sisus { padding: 48px 0; max-width: 46ch; }
.eyebrow {
  font-family: var(--font-mono); font-size: 10px; letter-spacing: .16em;
  text-transform: uppercase; color: var(--teal); margin-bottom: 18px;
}
h1 {
  font-family: var(--font-serif); font-weight: 300; font-size: 42px;
  line-height: 1.14; letter-spacing: -.01em;
}
p { margin-top: 16px; color: var(--ink2); font-size: 15px; font-weight: 300; }
.napit { margin-top: 28px; display: flex; gap: 10px; flex-wrap: wrap; }
.cta {
  display: inline-block; text-decoration: none; font-size: 13px; font-weight: 500;
  padding: 11px 18px; border: .5px solid var(--teal); color: var(--teal); background: var(--teal-tint);
}
.cta:hover { background: var(--teal); color: var(--bg); }
.cta--hiljainen { border-color: var(--border); color: var(--ink2); background: transparent; }
.cta--hiljainen:hover { background: var(--ov-1); color: var(--ink); }
footer {
  padding: 30px 24px 38px; color: var(--ink3); font-size: 11.5px;
  font-family: var(--font-mono); letter-spacing: .04em;
  max-width: 980px; margin: 0 auto; width: 100%;
}
@media (max-width: 720px) {
  h1 { font-size: 32px; }
  main, footer { padding-left: 18px; padding-right: 18px; }
  .tb { padding: 0 18px; }
}
</style>
</head>
<body>

<div class="tb">
  <svg class="tb-mark" viewBox="0 0 64 64" fill="none" aria-hidden="true">
    <circle cx="32" cy="32" r="28" stroke="currentColor" stroke-width="1"></circle>
    <circle cx="32" cy="32" r="20" stroke="currentColor" stroke-width="1" stroke-opacity=".6"></circle>
    <circle cx="32" cy="32" r="12" stroke="currentColor" stroke-width="1" stroke-opacity=".35"></circle>
    <circle cx="32" cy="32" r="4" fill="var(--teal)"></circle>
  </svg>
  <span class="tb-nimi">TalentMaster<sup>™</sup></span>
</div>

<main>
  <div class="sisus">
    <div class="eyebrow">404</div>
    <h1>Sivua ei löytynyt</h1>
    <p>Osoite on voinut muuttua, tai linkki on vanhentunut. Etusivulta pääset kaikkiin sisäänkäynteihin.</p>
    <div class="napit">
      <a class="cta" href="/">Etusivulle</a>
      <a class="cta cta--hiljainen" href="/TalentMaster_Seura.html">Seurahallinta</a>
    </div>
  </div>
</main>

<footer>TalentMaster™ · Pelaaja ensin, hallinto vahvistaa</footer>

<script>
/* Kunnioittaa etuovella valittua teemaa. Ei muuta logiikkaa, ei verkkopyyntöjä. */
(function () {
  try {
    var t = localStorage.getItem('tm_etuovi_teema');
    if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
  } catch (e) {}
})();
</script>

</body>
</html>
