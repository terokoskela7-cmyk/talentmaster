<!DOCTYPE html>
<html lang="fi"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>TalentMaster™ — Pelihavainto</title>
<!-- Brandifontit (CLAUDE.md §5). CSP sallii fonts.googleapis.com (style-src) + fonts.gstatic.com (font-src). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@300;400;500&display=swap">

<style>
/* ══ TOKENIT — ainoa paikka jossa hex-arvoja on (B6-vartija) ══════════════════
   Kenttätyökalu avataan ulkona: vaalea on oletus, tumma valittavissa. Molemmat teemat
   määritellään tässä, eikä muualla CSS:ssä saa olla hex-arvoja. */
:root{
  --font-serif:'Cormorant Garamond',Georgia,serif;
  --font-sans:'DM Sans',system-ui,-apple-system,sans-serif;
  --font-mono:'DM Mono',ui-monospace,Menlo,monospace;
  /* VAALEA (bone) — oletus kenttäkäytössä */
  --bg:#F2EFE6; --surface:#FBFAF6; --surface2:#EDEAE0;
  --ink:#1C1C1A; --ink2:#3E3C37; --ink3:#6F6C63;
  --border:rgba(28,28,26,.16); --border2:rgba(28,28,26,.08);
  --acc:#1A7A5E; --acc-dim:rgba(26,122,94,.10); --acc-brd:rgba(26,122,94,.38); --acc-ink:#FBFAF6;
  --acc-fill:#1A7A5E; --acc-fill-ink:#FBFAF6;   /* täytetyt ensisijaiset painikkeet: brändilukko (täyttö #1A7A5E, ei kirkas #28B090) */
  --amber:#9A6A1C; --amber-dim:rgba(224,160,64,.16); --amber-brd:rgba(224,160,64,.45);
  --red:#A5483A; --red-dim:rgba(208,106,90,.12); --red-brd:rgba(208,106,90,.38);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111110; --surface:#1A1A18; --surface2:#23231F;
    --ink:#F2EFE6; --ink2:#C9C6BC; --ink3:#8F8C83;
    --border:rgba(242,239,230,.14); --border2:rgba(242,239,230,.07);
    --acc:#28B090; --acc-dim:rgba(40,176,144,.10); --acc-brd:rgba(40,176,144,.34); --acc-ink:#111110;
    --acc-fill:#1A7A5E; --acc-fill-ink:#FBFAF6;
    --amber:#E0A040; --amber-dim:rgba(224,160,64,.10); --amber-brd:rgba(224,160,64,.32);
    --red:#D06A5A; --red-dim:rgba(208,106,90,.10); --red-brd:rgba(208,106,90,.32);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111110; --surface:#1A1A18; --surface2:#23231F;
  --ink:#F2EFE6; --ink2:#C9C6BC; --ink3:#8F8C83;
  --border:rgba(242,239,230,.14); --border2:rgba(242,239,230,.07);
  --acc:#28B090; --acc-dim:rgba(40,176,144,.10); --acc-brd:rgba(40,176,144,.34); --acc-ink:#111110;
  --acc-fill:#1A7A5E; --acc-fill-ink:#FBFAF6;
  --amber:#E0A040; --amber-dim:rgba(224,160,64,.10); --amber-brd:rgba(224,160,64,.32);
  --red:#D06A5A; --red-dim:rgba(208,106,90,.10); --red-brd:rgba(208,106,90,.32);
}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:14px;line-height:1.5;margin:0;-webkit-text-size-adjust:100%}

/* ══ RUNKO — yksi sarake, puhelin ensin ══════════════════════════════════════ */
.app{max-width:460px;margin:0 auto;height:100%;height:100dvh;display:flex;flex-direction:column;background:var(--bg)}   /* yksi näyttö: sarake = näkyvä alue, vieritys vain sisällön sisällä */
#ph-app{flex:1;min-height:0;display:flex;flex-direction:column}
.topbar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;border-bottom:.5px solid var(--border)}
.tb-logo{font-family:var(--font-serif);font-size:17px;letter-spacing:.01em}
.tb-tools{display:flex;gap:6px;align-items:center}
.ikoni{width:32px;height:32px;border:.5px solid var(--border);background:transparent;color:var(--ink2);border-radius:2px;cursor:pointer;font-size:14px;font-family:var(--font-sans)}

.ph-bar{flex:none;display:flex;align-items:center;gap:10px;padding:14px 16px 12px;border-bottom:.5px solid var(--border)}
.ph-pl{flex:none;display:flex;align-items:center;gap:10px;padding:0 16px;min-height:50px;border-bottom:.5px solid var(--border)}   /* pelaajarivi 50 px: ← [nimi / ikä · aika] Vaihda */
.ph-pl-t{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:1px}
.ph-pl.flash{animation:nimiflash .6s ease-out}
@keyframes nimiflash{from{background:var(--acc-dim)}to{background:transparent}}
.ph-linkki{background:none;border:0;padding:0;color:var(--acc);font-size:12px;cursor:pointer;text-decoration:underline;font-family:var(--font-sans)}
.ph-pl .ph-linkki{flex:none;min-height:44px;padding:0 2px}
.ph-back{width:30px;height:30px;border:.5px solid var(--border);background:transparent;color:var(--ink2);border-radius:2px;cursor:pointer;font-size:14px;flex:none}
.ph-title{flex:1;min-width:0}
.ph-name,.dn,.fb-q,.ok .big{font-variant-numeric:lining-nums}   /* Cormorantin vanhanmalliset numerot: 1 näyttää I:ltä */
.ph-name{font-family:var(--font-serif);font-size:22px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph-pl .ph-name{font-size:20px;min-width:0}
.ph-meta{font-family:var(--font-mono);font-size:10.5px;color:var(--ink3);letter-spacing:.04em}
.pt-rivi{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;height:36px;min-height:36px;padding:0;background:transparent;border:0;border-bottom:.5px solid var(--border2);border-radius:0;color:var(--ink2);font-family:var(--font-sans);font-size:12.5px;text-align:left;cursor:pointer}   /* matala linkkirivi, ei laatikko */
.missa+.pt-rivi{margin-top:calc(4px - clamp(4px,1vh,10px))}   /* Missä ja Pelitilanne 4 px:n välein */
.pt-r{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--acc)}
.pt-rivi::after{content:"";position:absolute;left:0;right:0;top:50%;height:44px;transform:translateY(-50%)}   /* tap-alue 44 px, vaikka rivi on 36 px */
.pt-rivi .pt-l{flex:none;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.ph-pl .ph-meta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.ph-body{scrollbar-width:none;flex:1;min-height:0;overflow:auto;padding:clamp(4px,1vh,10px) 16px clamp(4px,1vh,10px);display:flex;flex-direction:column;gap:clamp(4px,1vh,10px)}
.ph-body::-webkit-scrollbar{display:none}
.eyebrow{font-size:10px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--acc)}
.offl-merkki{color:var(--amber)}

.seg{display:flex;border:.5px solid var(--border);border-radius:2px}
.seg button{flex:1;min-height:44px;font-family:var(--font-sans);font-size:12.5px;padding:0 6px;background:transparent;border:0;color:var(--ink2);cursor:pointer}
.seg button+button{border-left:.5px solid var(--border)}
.seg button[aria-pressed="true"]{background:var(--acc-dim);color:var(--acc);font-weight:600}
.lbl{font-size:9.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lbl button.link{font-size:10px;letter-spacing:.04em;text-transform:none;font-weight:500;color:var(--acc);background:none;border:0;cursor:pointer;padding:0;font-family:var(--font-sans)}
.lbl .vapaa{text-transform:none;letter-spacing:0;font-weight:400}

/* Ulottuvuusrivit: nimi vasemmalla (napautus = kysymys + kuvaus palauteruutuun), pisteet 1–3 oikealla */
.rows{flex:none;display:flex;flex-direction:column}
.drow{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:46px;border-top:.5px solid var(--border2)}
.drow:first-child{border-top:.5px solid var(--border)}
.dn{flex:1;min-width:0;min-height:44px;text-align:left;background:none;border:0;padding:0;cursor:pointer;font-family:var(--font-serif);font-size:19px;line-height:1.1;color:var(--ink)}
.dn[aria-pressed="true"]{color:var(--acc)}
.uusi{font-family:var(--font-sans);font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;padding:2px 6px;border:.5px solid var(--acc-brd);background:var(--acc-dim);color:var(--acc);margin-left:8px;vertical-align:middle}
.scores{flex:none;display:flex;gap:6px}
.sc{width:44px;height:44px;border:.5px solid var(--border);background:var(--surface);border-radius:0;cursor:pointer;color:var(--ink);font-family:var(--font-sans);font-variant-numeric:lining-nums tabular-nums;font-weight:500;font-size:20px;line-height:1;padding:0}   /* DM Sans: ykkönen ei saa näyttää I:ltä */
.sc[aria-pressed="true"]{background:var(--acc-fill);border-color:var(--acc-fill);color:var(--acc-fill-ink)}

/* Palauteruutu: yksi yhteinen, vie jäljelle jäävän tilan (min 96), sisältö vierittyy sen sisällä */
.fb{flex:1 1 auto;min-height:96px;min-height:clamp(72px,calc(100dvh - 520px),96px);overflow-y:auto;padding:6px 10px;background:var(--surface2);border-left:2px solid var(--acc);border-radius:0 2px 2px 0}
/* Huomautusrivi (luonnos/epäonnistunut) vie 44 px → palauteruutu ja välit tiivistyvät, ettei lomake vieritä 390 × 656 -alueella */
.ph-body.vikaa{gap:4px}
.ph-body.vikaa .fb{min-height:72px}
.fb.vain-kys{border-left-color:var(--border)}
.fb.laaja{flex:none;overflow:visible}   /* avattu harjoitusvinkki saa kasvattaa sivua */
.fb-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.fb-t{font-size:12.5px;font-weight:600;color:var(--ink)}
.fb-q{font-family:var(--font-serif);font-style:italic;font-size:14.5px;line-height:1.3;color:var(--ink2);margin:0}
.fb-q.dim{color:var(--ink3)}
.fb-d{font-size:12.5px;line-height:1.4;color:var(--ink2);margin-top:2px}
.fb-tip{display:block;margin-top:4px;color:var(--ink3);font-size:11.5px}
.fb-tip b{color:var(--acc);font-weight:600}
.fb-m{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;margin-top:4px}
.fb-ml{font-size:9.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--ink3);margin-right:2px}
.more{font-size:11.5px;color:var(--acc);background:none;border:0;padding:0;line-height:1.3;cursor:pointer;font-family:var(--font-sans);white-space:nowrap}
.chip{font-family:var(--font-sans);font-size:11.5px;min-height:34px;padding:0 9px;border:.5px solid var(--border);background:transparent;color:var(--ink2);border-radius:2px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--acc-brd);background:var(--acc-dim);color:var(--acc)}
.chip.warn[aria-pressed="true"]{border-color:var(--amber-brd);background:var(--amber-dim);color:var(--amber)}

/* Porrasrivi: PORRAS n / 4 · neljän lohkon palkki · Muuta */
.porras{flex:none;display:flex;align-items:center;gap:10px;min-height:36px}
.porras .lbl{margin:0;flex:none}
.porras .link{margin-left:auto;font-size:12px;letter-spacing:.02em;text-transform:none;font-weight:500;color:var(--acc);background:none;border:0;cursor:pointer;padding:0 2px;min-height:36px;font-family:var(--font-sans)}
.pbar{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.pbar i{display:block;height:3px;background:var(--border)}
.pbar i.on{background:var(--acc)}
.missa{flex:none;display:flex;align-items:center;gap:10px}
.missa .lbl{margin:0;flex:none}
.missa .seg{flex:1}
.suggest{flex:none;padding:8px 10px;border:.5px solid var(--acc-brd);background:var(--acc-dim);border-radius:2px;font-size:12px;line-height:1.35;color:var(--ink2);display:flex;align-items:center;gap:10px}
.suggest>div:first-child{flex:1;min-width:0}
.suggest b{color:var(--ink)}
.sg-b{display:flex;flex-direction:column;gap:4px;flex:none}
.suggest .btn{padding:6px 10px;min-height:34px}
.btn{font-family:var(--font-sans);font-size:12px;font-weight:500;padding:8px 12px;border-radius:2px;border:.5px solid var(--border);background:transparent;color:var(--ink2);cursor:pointer}
.btn[aria-pressed="true"]{border-color:var(--acc-brd);background:var(--acc-dim);color:var(--acc)}
.banner{padding:10px 12px;border:.5px solid var(--amber-brd);background:var(--amber-dim);font-size:12.5px;color:var(--ink2);border-radius:2px}
.banner b{color:var(--ink)}
.ohje{font-size:11.5px;color:var(--ink3);margin:0}
.ohje.varo{color:var(--amber)}

/* Alapalkki: [viestikenttä] · + Viesti pelaajalle ... Pelaaja näkee ⏻ · Tallenna */
.foot{flex:none;border-top:.5px solid var(--border);padding:6px 16px 10px;padding-bottom:max(10px,env(safe-area-inset-bottom));background:var(--bg)}
.foot-r{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:40px}
.foot-r .link{background:none;border:0;padding:0 2px;min-height:40px;color:var(--acc);font-family:var(--font-sans);font-size:12.5px;font-weight:500;cursor:pointer;text-align:left}
.vis{display:flex;align-items:center;gap:10px}
.vis-t{font-size:12.5px;color:var(--ink2)}
.sw{position:relative;width:40px;height:22px;border-radius:11px;border:.5px solid var(--border);background:var(--surface2);cursor:pointer;flex:none;padding:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--ink3);transition:transform .15s}
.sw[aria-checked="true"]{background:var(--acc-dim);border-color:var(--acc-brd)}
.sw[aria-checked="true"]::after{transform:translateX(18px);background:var(--acc)}
.viesti{padding:4px 0 2px}
.viesti textarea{width:100%;min-height:64px;max-height:120px;resize:vertical;display:block;font-family:var(--font-sans);font-size:13px;color:var(--ink);background:var(--surface);border:.5px solid var(--border);border-radius:2px;padding:8px 10px}
.viesti .vis-h{font-size:11px;color:var(--ink3);margin-top:3px}
.sum{font-family:var(--font-mono);font-size:10.5px;color:var(--ink3);margin-bottom:8px;min-height:15px;letter-spacing:.02em}
.save{width:100%;min-height:48px;padding:0 14px;border-radius:2px;border:0;background:var(--acc-fill);color:var(--acc-fill-ink);font-family:var(--font-sans);font-size:14px;font-weight:600;cursor:pointer}
.save:disabled{background:var(--surface2);color:var(--ink3);cursor:default}

/* Tallennuksen ilmoitus (ei _showToast: tarvitsee Kumoa-painikkeen) */
.ilm{position:fixed;left:0;right:0;bottom:120px;max-width:460px;margin:0 auto;padding:0 16px;z-index:110;pointer-events:none}
.ilm[hidden]{display:none}
.ilm-i{pointer-events:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);color:var(--ink);border:.5px solid var(--acc-brd);border-radius:2px;padding:6px 6px 6px 12px;font-size:12.5px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.ilm-i button{flex:none;min-height:36px;padding:0 12px;background:none;border:.5px solid var(--border);border-radius:2px;color:var(--acc);font-family:var(--font-sans);font-size:12.5px;font-weight:600;cursor:pointer}

.search{width:100%;font-family:var(--font-sans);font-size:13px;padding:10px;border:.5px solid var(--border);background:var(--surface);color:var(--ink);border-radius:2px}
.plist{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pl{text-align:left;padding:11px 10px;border:.5px solid var(--border);background:var(--surface);border-radius:2px;cursor:pointer;color:var(--ink);font-family:var(--font-sans)}
.pl .n{font-size:13.5px;display:block}
.pl .m{font-family:var(--font-mono);font-size:10px;color:var(--ink3)}
.pl .done{color:var(--acc)}
.pl-w{display:flex;flex-direction:column}
.pl-w .pl{flex:1}
.pl-kumoa{align-self:flex-start;min-height:34px;padding:0 4px;background:none;border:0;color:var(--acc);font-family:var(--font-sans);font-size:12px;text-decoration:underline;cursor:pointer}
/* Pysyvä palkki yläpalkin alla: epäonnistunut / tallentamaton havainto (data ei katoa hiljaa) */
.vika{flex:none;display:flex;align-items:center;gap:8px;padding:0 16px;height:44px;background:var(--amber-dim);border-bottom:.5px solid var(--amber-brd);font-size:12px;color:var(--ink2)}   /* yksi rivi, enintään 44 px */
.vika b{color:var(--ink);font-weight:600}
.vika .vika-t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vika button{flex:none;min-height:36px;padding:0 6px;background:none;border:0;color:var(--ink);font-family:var(--font-sans);font-size:12px;text-decoration:underline;cursor:pointer}   /* ink, ei acc: kontrasti ≥ 4,5 varoitustaustalla */
.vika-lista{flex:none;max-height:132px;overflow-y:auto;scrollbar-width:none}
.vika-lista::-webkit-scrollbar{display:none}
.vika .vika-x{text-decoration:none;font-size:15px;color:var(--ink3)}

.ok{padding:22px 4px 6px;text-align:left}
.ok .big{font-family:var(--font-serif);font-size:30px;line-height:1.1;margin:6px 0}
.vis-b{display:inline-block;font-size:9.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;padding:4px 9px;border:.5px solid var(--acc-brd);background:var(--acc-dim);color:var(--acc)}
.vis-b.pr{border-color:var(--border);background:var(--surface2);color:var(--ink2)}
.undo{font-size:12px;color:var(--ink3);margin-top:12px}
.undo button{color:var(--acc);background:none;border:0;cursor:pointer;font-family:var(--font-sans);font-size:12px;padding:0}
.ok-teksti{color:var(--ink2);font-size:13px}
.ok-porras{color:var(--acc);font-size:12.5px}

.sheet{position:fixed;inset:auto 0 0 0;max-width:460px;margin:0 auto;background:var(--bg);border-top:.5px solid var(--border);padding:14px 16px 18px;z-index:120;box-shadow:0 -12px 30px rgba(0,0,0,.18)}
.sheet .opt{display:block;width:100%;text-align:left;padding:12px 10px;border:.5px solid var(--border);background:var(--surface);color:var(--ink);border-radius:2px;margin-top:6px;cursor:pointer;font-family:var(--font-sans)}
.sheet .opt small{display:block;color:var(--ink3);font-size:11px}
.sheet .opt[aria-pressed="true"]{border-color:var(--acc-brd);background:var(--acc-dim)}

#tm-toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:9600;background:var(--surface);color:var(--ink);border:.5px solid var(--border);border-radius:2px;padding:10px 16px;font-size:13px;max-width:90vw;text-align:center;display:none}

/* Kirjautumisbanneri — peittää näkymän vasta kun tila on ASETTUNUT (armonaika). */
#tm-login-banner{display:none;align-items:center;justify-content:center;position:fixed;inset:0;z-index:9000;background:var(--bg);flex-direction:column;gap:16px;padding:32px;text-align:center}
#tm-login-banner .lb-t{font-family:var(--font-serif);font-size:22px}
#tm-login-banner .lb-s{font-size:13px;color:var(--ink2);max-width:320px;line-height:1.6}
#tm-login-banner .lb-f{display:flex;flex-direction:column;gap:10px;width:100%;max-width:280px;margin-top:8px}
#tm-login-banner input{background:var(--surface);border:.5px solid var(--border);border-radius:2px;padding:12px 14px;color:var(--ink);font-size:14px;font-family:var(--font-sans)}
#tm-login-err{font-size:12px;color:var(--red);min-height:16px}

.sa-modal{position:fixed;inset:0;z-index:9500;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
.sa-modal .kortti{background:var(--surface);border:.5px solid var(--border);border-radius:3px;padding:28px;width:100%;max-width:320px;text-align:center}
.sa-modal h2{font-family:var(--font-serif);font-weight:400;font-size:20px;margin:0 0 6px}
.sa-modal p{font-size:12px;color:var(--ink3);margin:0 0 18px}
.sa-modal select{width:100%;background:var(--surface2);border:.5px solid var(--border);border-radius:2px;padding:10px;font-size:14px;color:var(--ink);margin-bottom:14px;font-family:var(--font-sans)}

button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.sw::after{transition:none}.ph-pl.flash{animation:none;background:var(--acc-dim)}}
/* Yksi mobiililohko per tiedosto (§6) — ÄLÄ lisää toista. */
@media (max-width:768px){

   skipWaiting/clients.claim -> uusi deploy syrjayttaa vanhan valittomasti. */
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw_adar.js?v=1').then(function (reg) {
      reg.addEventListener('updatefound', function () {
        var uusi = reg.installing;
        if (uusi) uusi.addEventListener('statechange', function () {
          if (uusi.state === 'activated') console.log('[ADAR] SW paivitetty');
        });
      });
    }).catch(function (e) { console.warn('[ADAR] SW-rekisterointi epaonnistui:', e && e.message); });
  });
}
</script>

<script>
// ══════════════════════════════════════════════════════════════════════════════
// FIREBASE-ALUSTUS
//
// ⚠ REALM-INVARIANTTI — ÄLÄ KÄYTÄ ISÄIKKUNAN INSTANSSIA (juurisyy 2026-09-28):
// Upotettuna (Masterin iframe) tämä sivu rakentaa havaintodokumentin OMASSA
// JavaScript-realmissaan. Jos kirjoitus tehdään isäikkunan Firestore-instanssilla,
// SDK vertaa objektin prototyyppiä OMAN ikkunansa `Object.prototype`:een — iframen
// objektilla se on eri, joten kirjoitus hylätään:
//     "Data must be an object, but it was: a custom Object object"
// Sama koskee `FieldValue.serverTimestamp()`-sentinelliä: eri SDK-kopion olio.
// Tämä kaatoi JOKAISEN upotetun kirjoituksen (havainto, pikakentät, kumoaminen)
// siitä asti kun Master alkoi injektoida instanssit (64f01b5, 12.7.2026).
//
// Siksi: `_PH_DB` ja `_PH_AUTH` ovat TÄMÄN sivun omat instanssit, ja niitä käytetään
// kaikissa luvuissa ja kirjoituksissa. Injektoituja `_tmDB`/`_tmAuth`-arvoja EI lueta.
// Auth toimii iframessa ilman injektiota: sama origin + LOCAL-persistenssi (IndexedDB)
// → oma `onAuthStateChanged` saa saman käyttäjän.
//
// Injektio jatkuu muilta osin: _tmSeuraId, _tmPelaajaId, _tmRooli, _tmEmbedded.
// ══════════════════════════════════════════════════════════════════════════════
var _PH_DB = null, _PH_AUTH = null;

(function _initFirebase() {
  var cfg = {
    apiKey:            "AIzaSyAp471lOIntzP33p9bIW3y4KbeEyBt5kIo",
    authDomain:        "talentmaster-pilot.firebaseapp.com",
    projectId:         "talentmaster-pilot",
    storageBucket:     "talentmaster-pilot.firebasestorage.app",
    messagingSenderId: "872561784446",
    appId:             "1:872561784446:web:05c4c7996dfd46ddd14a2f"
  };
  if (!firebase.apps.length) firebase.initializeApp(cfg);
  // App Check ENNEN ensimmaista Firestore/Auth-kutsua (§38): se ei liity jalkikateen jo
  // luotuun palveluinstanssiin. Guard: puuttuva lib ei saa kaataa kenttatyokalua.
  try { if (typeof tmAppCheckAktivoi === 'function') tmAppCheckAktivoi(); }
  catch (e) { console.warn('[ADAR] App Check ei aktivoitunut:', e && e.message); }
  _PH_DB   = firebase.firestore();
  _PH_AUTH = firebase.auth();
  /* §15 OFFLINE-ENSIN: IndexedDB-persistenssi -> luvut toimivat verkotta ja havainnon
     tallennus JONOTTUU, synkaten kun verkko palaa. Tämä on B4:n koko perusta: erillistä
     omaa offline-jonoa EI enää ole. Epaonnistuu odotetusti jos sama origin on auki
     toisessa valilehdessa (failed-precondition) -> appi jatkaa online-tilassa. */
  try {
    firebase.firestore().enablePersistence({ synchronizeTabs: true }).catch(function (e) {
      console.warn('[ADAR] offline-persistenssi ei kaytossa:', e && e.code);
    });
  } catch (e) { console.warn('[ADAR] offline-persistenssi heitti:', e && e.message); }
})();

// ══════════════════════════════════════════════════════════════════════════════
// PELAAJAPOIMINTA — ROOLIPEILI + HAKU
//
// JUURISYY: poimin näytti KAIKKI seuran pelaajat, mutta create-sääntö sallii
// pelkälle valmentajalle vain OMAN JOUKKUEEN pelaajat. Väärän joukkueen pelaaja
// → permission-denied → raaka "Tallennusvirhe". UI lupasi enemmän kuin sääntö sallii.
//
// PEILI tm_admin/firestore.rules `onOmanJoukkueenValmentaja`:
//   onOmanSeuranValmentaja(sid) && ( onJohtoRooli() || 'talenttivalmentaja'
//                                    || pelaaja.joukkueet ∩ valmentaja.joukkueet )
// HUOM LEIKKAUS: `onOmanSeuranValmentaja` vaatii `onValmentajaRooli()`, joka EI
// sisällä seurasihteeriä — vaikka `onJohtoRooli()` sisältää. Siksi seurasihteeri
// ei pääse tähän lainkaan, ja joukkuerajauksen ohittavat ovat:
//   super_admin · vp · urheilutoimenjohtaja · talenttivalmentaja
// Tämä joukko on LUKITTU vartijalla (tests/adar_pelaajapoiminta.test.js), joka
// johtaa sen säännöistä — client ja rules eivät voi ajautua erilleen hiljaa.
// ══════════════════════════════════════════════════════════════════════════════
const ADAR_JOUKKUERAJAUS_OHITTAVAT = ['super_admin', 'superadmin', 'vp', 'urheilutoimenjohtaja', 'talenttivalmentaja'];

/** true = näkee koko seuran pelaajat; false = vain oma joukkue. */
function _adarNakeeKaikki(rooli) {
  var r = rooli || window._tmRooli || null;
  return ADAR_JOUKKUERAJAUS_OHITTAVAT.indexOf(r) >= 0;
}

/** Valmentajan omat joukkueet (ID-lista) + näyttönimi. */
window._omatJoukkueet = null;
window._tmKayttajaNimi = null;
async function _adarLataaOmatJoukkueet(seuraId, uid) {
  var nakeeKaikki = _adarNakeeKaikki();
  /* Joukkuerajausta ohittava rooli ei tarvitse joukkuelistaa — mutta dokumentti luetaan silti,
     koska siitä saadaan NÄYTTÖNIMI havaintoon (ks. _adarTekijaNimi). SA:lla ei ole tätä
     dokumenttia (§3) → lukuyritys ei löydä mitään, ja nimi jää oletukseen. */
  if (nakeeKaikki) window._omatJoukkueet = null;
  try {
    if (!_PH_DB || !seuraId || !uid) { if (!nakeeKaikki) window._omatJoukkueet = []; return; }
    var d = await _PH_DB.collection('seurat').doc(seuraId).collection('kayttajat').doc(uid).get();
    var data = d && d.exists ? d.data() : {};
    if (!nakeeKaikki) window._omatJoukkueet = Array.isArray(data.joukkueet) ? data.joukkueet : [];
    var nimi = ((data.etunimi || '') + ' ' + (data.sukunimi || '')).trim();
    window._tmKayttajaNimi = nimi || null;
    /* Dokumentin rooli EI ohjaa oikeuspäättelyä (se tulee claimista) — se talletetaan vain,
       jotta virheilmoitus osaa kertoa, jos lähteet ovat ristiriidassa. */
    window._tmDokRooli = data.rooli || null;
  } catch (e) {
    /* FAIL-CLOSED kuten sääntö: lukuvirhe → ei oleteta pääsyä. */
    if (!nakeeKaikki) window._omatJoukkueet = [];
  }
}

/* Havainnon tekijän nimi. LAPSI NÄKEE TÄMÄN kortissaan, joten sähköposti ei kelpaa:
   Topiaksen appissa luki "talentmasterid@gmail.com". Järjestys on
   displayName → kayttajat/{uid} etunimi+sukunimi → null. Sähköpostia ei käytetä
   missään haarassa, ei edes viimeisenä oljenkortena. Puuttuva nimi tallentuu nullina, EI
   suomenkielisenä 'Valmentaja'-tekstinä (se jäisi sv-lapselle kääntämättä): lukija
   (pelaajakortti) näyttää neutraalin oletuksen omalla kielellään. */
function _adarTekijaNimi(user) {
  /* Jaettu sääntö (lib/tm_tekija_nimi.js): `displayName` voi itsekin olla sähköposti → @-merkin sisältävä arvo hylätään;
     kumpikaan ei kelpaa → null. */
  return window.tmTekijaNimiTalletus([user && user.displayName, window._tmKayttajaNimi]);
}

/** Miksi kirjoitus estyi? Palauttaa käyttäjälle näytettävän syyn. */
function _adarEstonSyy() {
  if (!_adarNakeeKaikki() && !(window._omatJoukkueet || []).length) {
    return tmHT('Käyttäjätunnuksesi joukkuetieto puuttuu — ota yhteys seuran pääkäyttäjään');
  }
  return tmHT('Voit havainnoida vain oman joukkueesi pelaajia');
}
window._adarEstonSyy = _adarEstonSyy;

/** Saako kirjautunut havainnoida tätä pelaajaa? Sama logiikka kuin sääntö. */
function _adarSaaHavainnoida(pelaajaId) {
  if (_adarNakeeKaikki()) return true;
  var p = (window._pelaajaMap || {})[pelaajaId];
  var omat = window._omatJoukkueet || [];
  if (!p || !omat.length) return false;                      // fail-closed
  var pj = p.joukkueet || [];
  for (var i = 0; i < pj.length; i++) { if (omat.indexOf(pj[i]) >= 0) return true; }
  return false;
}

/** Näkyvät pelaajat: roolisuodatus + vapaa nimihaku. AINOA lista-lähde (yksi poimin). */
function _adarNakyvatPelaajat(haku) {
  var map = window._pelaajaMap || {};
  var hk = (haku || '').trim().toLowerCase();
  return Object.keys(map)
    .filter(function (id) { return _adarSaaHavainnoida(id); })
    .filter(function (id) {
      if (!hk) return true;
      var p = map[id];
      return ((p.nimi || '') + ' ' + (p.joukkue || '')).toLowerCase().indexOf(hk) >= 0;
    })
    .sort(function (a, b) { return (map[a].nimi || '').localeCompare(map[b].nimi || '', 'fi'); });
}

/* Ohjeteksti kun rajattu rooli on ilman omaa joukkuetta — ei hiljaista tyhjää. */
function _adarPoiminOhje() {
  if (!_adarNakeeKaikki() && !(window._omatJoukkueet || []).length) {
    return tmHT('Sinulla ei ole omaa joukkuetta merkittynä — ota yhteys valmennuspäällikköön.');
  }
  return '';
}

// ══════════════════════════════════════════════════════════════════
// AUTH — persistenssi, bannerin armonaika, seura ja pelaajat
// ══════════════════════════════════════════════════════════════════
/* Eksplisiittinen LOCAL-persistenssi ENNEN kuuntelijaa (sama kuin Seura/Admin).
   Ilman tätä istunto nojaa oletukseen, joka in-app-selaimessa / partitioidussa
   storagessa ei aina palaudu → käyttäjä jää login-bannerille kesken kenttätyön. */
try { _PH_AUTH.setPersistence(window.firebase.auth.Auth.Persistence.LOCAL); } catch (e) { /* ei tuettu → oletus */ }

/* BANNERIN ARMONAIKA: `onAuthStateChanged` laukeaa sivunlatauksessa ENSIN
   null:lla, ennen kuin persistoitu istunto on palautettu. Bannerin slammaaminen
   heti näyttää uloskirjautumiselta. Näytetään banneri vasta kun null on ASETTUNUT. */
window._adarAuthArmo = null;
function _adarNaytaBanneri(nayta) {
  const b = document.getElementById('tm-login-banner');
  if (!b) return;
  if (window._adarAuthArmo) { clearTimeout(window._adarAuthArmo); window._adarAuthArmo = null; }
  if (!nayta) { b.style.display = 'none'; return; }
  window._adarAuthArmo = setTimeout(function () {
    /* Vielä kirjautumaton armonajan jälkeen → aito kirjautumaton tila. */
    if (!(_PH_AUTH && _PH_AUTH.currentUser)) b.style.display = 'flex';
    window._adarAuthArmo = null;
  }, 1500);
}

async function _tmKirjaudu() {
  const em = document.getElementById('tm-login-email');
  const pw = document.getElementById('tm-login-pass');
  const err = document.getElementById('tm-login-err');
  if (err) err.textContent = '';
  try {
    await _PH_AUTH.signInWithEmailAndPassword((em && em.value) || '', (pw && pw.value) || '');
  } catch (e) {
    if (err) err.textContent = tmHT('Kirjautuminen ei onnistunut — tarkista tunnus ja salasana.');
  }
}
window._tmKirjaudu = _tmKirjaudu;

function _showToast(msg) {
  let t = document.getElementById('tm-toast');
  if (!t) return;
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(window._tmToastAjastin);
  window._tmToastAjastin = setTimeout(function () { t.style.display = 'none'; }, 3200);
}
window._showToast = _showToast;

// ── SUPER ADMIN: seuranvalitsin (SA:lla ei ole seuraId-claimia, §3) ──────────
async function _naytaSuperAdminSeuraValitsin() {
  let seurat = [];
  try {
    const snap = await _PH_DB.collection('seurat').orderBy('nimi').get();
    seurat = snap.docs.map(d => ({ id: d.id, nimi: d.data().nimi || d.id }));
  } catch (e) { console.error('[ADAR] Seurat:', e); }

  let modal = document.getElementById('tm-seura-modal');
  if (!modal) {
    modal = document.createElement('div');
    modal.id = 'tm-seura-modal';
    modal.className = 'sa-modal';
    document.body.appendChild(modal);
  }
  const opts = seurat.map(s => '<option value="' + s.id + '">' + _phEsc(s.nimi) + '</option>').join('');
  modal.innerHTML =
    '<div class="kortti"><h2>' + tmHT('Valitse seura') + '</h2><p>' + tmHT('Super admin — valitse seura') + '</p>'
    + '<select id="tm-seura-valinta"><option value="">' + tmHT('— Valitse seura —') + '</option>' + opts + '</select>'
    + '<button class="save" onclick="_vahvistaSeuraValinta()">' + tmHT('Jatka →') + '</button></div>';
  modal.style.display = 'flex';
}
window._naytaSuperAdminSeuraValitsin = _naytaSuperAdminSeuraValitsin;

/* Kieli seuran kielestä (sv-läpiajo PR 4): tmKieliInitSeura(seura.kieli) — käyttäjän oma valinta (tm_kieli) voittaa — ja staattisen markupin lokalisointi. Best-effort: virhe → fi. */
async function _adarKieliAlusta(seuraId) {
  try {
    if (typeof tmKieliInitSeura === 'function') {
      const sd = (seuraId && seuraId !== 'demo') ? await _PH_DB.collection('seurat').doc(seuraId).get() : null;
      tmKieliInitSeura(sd && sd.exists ? (sd.data().kieli || null) : null);
    }
    if (typeof tmHTL === 'function') tmHTL(document);
  } catch (e) { /* kieli jää suomeksi */ }
}
window._adarKieliAlusta = _adarKieliAlusta;
if (typeof tmHTL === 'function') tmHTL(document);   // tallennettu kieli (tm_kieli) heti: kirjautumisbanneri ennen seuran lukua

async function _vahvistaSeuraValinta() {
  const sel = document.getElementById('tm-seura-valinta');
  const seuraId = sel ? sel.value : '';
  if (!seuraId) return;
  window._tmSeuraId = seuraId;
  await _adarKieliAlusta(seuraId);
  const modal = document.getElementById('tm-seura-modal');
  if (modal) modal.style.display = 'none';
  await _adarLataaPelaajat(seuraId);
}
window._vahvistaSeuraValinta = _vahvistaSeuraValinta;

/** Lataa seuran pelaajat `_pelaajaMap`:iin ja renderöi poimimen uudelleen. */
async function _adarLataaPelaajat(seuraId) {
  try {
    const snap = await _PH_DB
      .collection('seurat').doc(seuraId).collection('pelaajat').orderBy('sukunimi').get();
    window._pelaajaMap = window._pelaajaMap || {};
    snap.docs.forEach(function (d) {
      const p = d.data();
      window._pelaajaMap[d.id] = {
        tunniste: p.tunniste || p.palloId || null,       // PalloID — null jos ei asetettu
        nimi: ((p.etunimi || '') + ' ' + (p.sukunimi || '')).trim(),
        joukkue: p.joukkue || p.joukkueNimi || '',
        // Roolisuodatusta varten: sääntö täsmää ID-listalla, ei joukkueen nimellä (§7.18)
        joukkueet: Array.isArray(p.joukkueet) ? p.joukkueet : [],
        syntymaVuosi: (typeof p.syntymaVuosi === 'number') ? p.syntymaVuosi : null,
        // Porras ja ehdotus pikakentistä (§26) — ei alikokoelmakyselyjä renderöinnissä
        havainto_porras: (typeof p.havainto_porras === 'number') ? p.havainto_porras : null,
        havainto_porras_ehdotus: p.havainto_porras_ehdotus || null,
        adar_pvm: p.adar_pvm || null,
        // adar_edellinen-kaappaus (§29 pvm-vahti) tarvitsee edellisen arvon
        adar_viimeisin: p.adar_viimeisin || null
      };
    });
    console.log('[ADAR] ' + snap.docs.length + ' pelaajaa ladattu seuralle ' + seuraId);
  } catch (e) {
    console.error('[ADAR] Pelaajien haku epäonnistui:', e.message);
  }
  /* URL:n pelaaja (Masterin upotus) avataan vasta kun map on ladattu. */
  if (typeof window._phAvaaAloitusPelaaja === 'function') window._phAvaaAloitusPelaaja();
  _phRender();
}

_PH_AUTH.onAuthStateChanged(async function (user) {
  if (!user) { _adarNaytaBanneri(true); return; }
  _adarNaytaBanneri(false);

  try {
    const token = await user.getIdTokenResult(true);
    /* ROOLIN YKSI LÄHDE = CLAIM. Rules lukee request.auth.token.rooli:n, joten klientin on
       päätettävä samasta lähteestä tai ne ajautuvat erilleen: poimin näyttäisi enemmän kuin
       Rules sallii, ja tallennus kaatuisi vasta kentällä. Jos Master on jo injektoinut arvon
       (upotettu tila), sitä kunnioitetaan — Master injektoi nykyään myös claimin roolin. */
    if (!window._tmRooli) window._tmRooli = token.claims.rooli || null;
    window._tmClaimRooli = token.claims.rooli || null;
    const seuraId = token.claims.seuraId;
    const isSuperAdmin = token.claims.rooli === 'super_admin'
      || token.claims.rooli === 'superadmin'
      || token.claims.super_admin === true;

    if (!seuraId) {
      if (isSuperAdmin) { _naytaSuperAdminSeuraValitsin(); }
      else { console.warn('[ADAR] Ei seuraId'); }
      return;
    }
    window._tmSeuraId = window._tmSeuraId || seuraId;

    /* Kirjautumisaikaleima omaan kayttajat-dokkiin (§0) — VAI+ n4 lukee tätä.
       SA ohitetaan: ei kayttajat-dokkia seuran alla (§3). Best-effort. */
    if (!isSuperAdmin && typeof tmMerkitseKirjautuminen === 'function') {
      tmMerkitseKirjautuminen(_PH_DB, seuraId, user.uid);
    }

    /* Omat joukkueet ENNEN poimimen täyttöä — muuten rajattu rooli näkisi
       hetken koko seuran (ja voisi ehtiä valita pelaajan jota ei saa kirjata). */
    await _adarKieliAlusta(window._tmSeuraId);   // kieli ennen ensimmäistä renderiä
    await _adarLataaOmatJoukkueet(window._tmSeuraId, user.uid);
    await _adarLataaPelaajat(window._tmSeuraId);

    /* Vanhan pikatilan IDB-jono: tyhjennetään kerran. POISTA 2026-11 jälkeen. */
    _synkronoiOfflineJono();
  } catch (e) {
    console.error('[ADAR] Alustus epäonnistui:', e.message);
  }
});

// ══ TEEMAKYTKIN ══════════════════════════════════════════════════════════════
// Upotettuna teema tulee isännältä (Master: <html data-theme>, avain tm-theme) ja seuraa sen vaihtoa.
// Itsenäisenä: tm_teema → tm-theme (Masterin avain) → prefers-color-scheme → vaalea. Kytkin tallentaa molempiin avaimiin.
function _teemaLue(k) { try { var v = localStorage.getItem(k); return (v === 'light' || v === 'dark') ? v : null; } catch (e) { return null; } }
function _teemaUpotettu() {
  try { var q = new URLSearchParams(location.search); return q.get('embedded') === '1' || q.get('context') === 'master'; } catch (e) { return false; }
}
function _teemaIsanta() {
  try { var v = window.parent && window.parent !== window ? window.parent.document.documentElement.getAttribute('data-theme') : null; return (v === 'light' || v === 'dark') ? v : null; } catch (e) { return null; }
}
function _teemaAlku() {
  if (_teemaUpotettu()) return _teemaIsanta() || _teemaLue('tm-theme') || _teemaLue('tm_teema') || 'light';
  var tumma = false;
  try { tumma = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches); } catch (e) { /* ei */ }
  return _teemaLue('tm_teema') || _teemaLue('tm-theme') || (tumma ? 'dark' : 'light');
}
(function _initTeema() {
  const tallennettu = _teemaAlku();
  document.documentElement.setAttribute('data-theme', tallennettu);
  _paivitaTeemaIcon(tallennettu);
  if (_teemaUpotettu()) {
    try {
      var isanta = window.parent.document.documentElement;
      new MutationObserver(function () {
        var v = isanta.getAttribute('data-theme');
        if (v === 'light' || v === 'dark') { document.documentElement.setAttribute('data-theme', v); _paivitaTeemaIcon(v); }
      }).observe(isanta, { attributes: true, attributeFilter: ['data-theme'] });
    } catch (e) { /* eri origin tai ei isäntää: teema jää alkuarvoon */ }
  }
})();

function _vaihdaTeema() {
  const nykyinen = document.documentElement.getAttribute('data-theme') || 'light';
  const uusi = nykyinen === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', uusi);
  try { localStorage.setItem('tm_teema', uusi); localStorage.setItem('tm-theme', uusi); } catch (e) { /* ei */ }
  _paivitaTeemaIcon(uusi);
}
window._vaihdaTeema = _vaihdaTeema;

function _paivitaTeemaIcon(teema) {
  const btn = document.getElementById('theme-toggle-btn');
  if (btn) btn.textContent = teema === 'light' ? '☾' : '☀';
}
</script>

<script>
// ══════════════════════════════════════════════════════════════════════════════
// PELIHAVAINTO — YKSI NÄKYMÄ, PORRAS KERRALLAAN
//
// Tasovälilehdet ja erillinen pikatila poistuivat: porras määrää ulottuvuudet, ja

// tulee kokonaan `lib/tm_pelialy_yksilo.js`:stä — tässä tiedostossa ei ole omaa

// ══════════════════════════════════════════════════════════════════════════════

/* Ulottuvuusavain (lib) → havainnon `pisteet`-avain. Peilaa libin sisäistä
   ADAR_KENTTA_MAP:ia, jota ei viedä ulos. Vartija lukee molemmat lähteestä. */
const PH_KENTTA = { a: 'A', d: 'D', ac: 'Act', r: 'R' };

/* KAIKKI näytettävät ulottuvuustekstit ovat lib/tm_adar_tekstit.js:n FI-kartassa (avain = polku, esim. adar_A_q, adar_A_d1) — sv-läpiajo PR 4. sv tulee jaetusta kirjastokartasta
   (tm_lib_i18n.js, tmLibT; Gemini); puuttuva → suomi. Teksti haetaan RENDERÖINTIHETKELLÄ (kieli selviää vasta seuran luvun jälkeen → ei latausaikaisia vakioita).
   Nimet (Havainnointi · Päätöksenteko · Toteutus · Reagointi) tulevat libin nimikanonista tmAdarNimet('valmentaja', tmLibT) — yksi nimikanoni, ei kopiota. */
function _phTr() { return (typeof tmLibT === 'function') ? tmLibT : null; }
function _phT(avain) { return TM_ADAR_TEKSTIT.tmAdarT(avain, _phTr()); }
function _phTekstit(k) { return TM_ADAR_TEKSTIT.tmAdarKortti(k, _phTr()); }
function _phNimet() { return (typeof tmAdarNimet === 'function') ? tmAdarNimet('valmentaja', _phTr()) : (typeof TM_ADAR_NIMET !== 'undefined' ? TM_ADAR_NIMET.valmentaja : {}); }

const PH_KUMOA_MS = 10 * 60 * 1000;   // Kumoa näkyy 10 min

/* ── TILA ────────────────────────────────────────────────────────────────────
   Yksi objekti, joka myös persistoidaan luonnokseksi (reload kentällä). */
window._phTila = {
  naytto: 'valitse',
  pelaajaId: null, haku: '',
  porras: 1, porrasTallennettu: null, ehdotusOhitettu: false, porrasNostettu: false,
  konteksti: 'harjoitus',
  ptAuki: false,   // Pelitilanne-rivin auki/kiinni: kiinni oletuksena, säilyy istunnon ajan; EI luonnokseen
  pelitilanne: { vaihe: [], paine: null, otos: null },   // säilyy pelaajalta toiselle kuten konteksti (Vaihe 1); tallennus vain portaalla näkyvistä kentistä
  pisteet: {}, havaitut: {}, vinkki: {}, teksti: '', nakyvyys: false,
  fb: null, fbKys: false, viestiAuki: false, viestiFokus: false, flash: false, vikaSuljettu: {},   // pelkkiä näyttöasetuksia, eivät luonnokseen
  tehdyt: {}, sheet: false, peruttu: false,

function _phEsc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}
window._phEsc = _phEsc;

function _phPelaaja(pid) { return (window._pelaajaMap || {})[pid || window._phTila.pelaajaId] || null; }

/** Ikä = kuluva vuosi − syntymävuosi (ikäluokkakonventio, §26/IKAKONVENTIO_SPEC). */
function _phIka(pid) {
  var p = _phPelaaja(pid);
  if (!p || p.syntymaVuosi == null) return null;
  return new Date().getFullYear() - p.syntymaVuosi;
}

function _phIkavaihe(ika) {
  if (ika == null) return tmHT('Pelihavainto');
  return TM_ADAR_TEKSTIT.tmAdarIkavaihe(ika, _phTr());
}

/** Portaan ulottuvuudet havainnon pisteet-avaimina (lib on ainoa lähde). */
function _phDimit(porras) {
  var band = (typeof tmAdarBand === 'function') ? tmAdarBand(null, porras) : ['a'];
  return band.map(function (k) { return PH_KENTTA[k]; });
}

/** Ikäsuositus portaaksi — lib, ei omaa ikälogiikkaa. */
function _phIkaPorras(ika) {
  return (typeof tmAdarIkaPorras === 'function') ? tmAdarIkaPorras(ika) : 4;
}

/* ── JÄRJESTYS: pisimpään havainnoimatta ensin ────────────────────────────────
   null (ei havaintoja) ensin, sitten vanhin → uusin, ja tänään havainnoidut viimeisenä.
   Lähde on pikakenttä `adar_pvm` (§26) — ei alikokoelmakyselyä renderöinnissä. */
function _phOnTanaan(pid) {
  if (window._phTila.tehdyt[pid]) return true;
  var p = _phPelaaja(pid);
  if (!p || !p.adar_pvm) return false;
  var d = new Date(p.adar_pvm);
  if (isNaN(d.getTime())) return false;
  var n = new Date();
  return d.getFullYear() === n.getFullYear() && d.getMonth() === n.getMonth() && d.getDate() === n.getDate();
}

function _phJarjestysAvain(pid) {
  if (_phOnTanaan(pid)) return Infinity;                 // viimeisenä
  var p = _phPelaaja(pid);
  if (!p || !p.adar_pvm) return -Infinity;               // ei havaintoja → ensin
  var t = new Date(p.adar_pvm).getTime();
  return isNaN(t) ? -Infinity : t;
}

function _phJarjesta(idt) {
  return idt.slice().sort(function (a, b) { return _phJarjestysAvain(a) - _phJarjestysAvain(b); });
}

/** Meta-teksti listassa: "ei havaintoja" / "eilen" / "N pv sitten" / "✓ tänään". */
function _phViimeksi(pid) {
  if (_phOnTanaan(pid)) return { teksti: tmHT('✓ tänään'), tanaan: true };
  var p = _phPelaaja(pid);
  if (!p || !p.adar_pvm) return { teksti: tmHT('ei havaintoja'), tanaan: false };
  var t = new Date(p.adar_pvm).getTime();
  if (isNaN(t)) return { teksti: tmHT('ei havaintoja'), tanaan: false };
  var pv = Math.floor((Date.now() - t) / 86400000);
  if (pv <= 1) return { teksti: tmHT('eilen'), tanaan: false };
  return { teksti: tmHT('{n} pv sitten').replace('{n}', pv), tanaan: false };
}

/* ── PELITILANNE (Vaihe 1) ───────────────────────────────────────────────────
   Chip-rivit konteksti-rivin alla. PORRAS ratkaisee mitä näkyy (ei ikä): 1 → otos · 2 → + vaihe · 3–4 → + paine.
   Kaikki valinnaista, ei estoa eikä huomautusta. Tallennettavat arvot ovat ASCII-avaimia (lib/tm_adar_pelitilanne.js), näyttö adar_pt_*-teksteistä. */

}
function _phPelitilanneHtml() {
  var S = window._phTila, nak = window.tmPelitilanneKentat(S.porras), pt = S.pelitilanne;
  /* Yksi avattava rivi, kiinni oletuksena; suljettuna näyttää valinnat tiiviinä tekstinä. Avattuna porrassäännön mukaiset chip-rivit sellaisinaan. */
  var otsikko = window.tmPelitilanneTiivis(pt, S.porras, _phTr());
  /* Vasemmalla otsikko + nuoli (ink2), oikealla valinnat tiivistettyinä (acc): "3–5 · Puolustus". Tiiviste on muotoa "Otsikko: valinnat" → otsikko pois. */
  var otsikkoT = _phT('adar_pt_otsikko'), valinnat = '';
  if (!S.ptAuki && otsikko.indexOf(otsikkoT + ': ') === 0) valinnat = otsikko.slice(otsikkoT.length + 2);
  var kansi = '<button type="button" class="pt-rivi" id="ph-pt-kansi" aria-expanded="' + !!S.ptAuki + '"><span class="pt-l">' + _phEsc(otsikkoT) + ' <span aria-hidden="true">' + (S.ptAuki ? '▴' : '▾') + '</span></span>'
    + (valinnat ? '<span class="pt-r">' + _phEsc(valinnat) + '</span>' : '') + '</button>';
  if (!S.ptAuki) return kansi;
  var rivi = function (kentta, avaimet, onValittu) {
    return '<div><div class="lbl"><span>' + _phEsc(_phT('adar_pt_otsikko_' + kentta)) + '</span></div><div class="chips" role="group" aria-label="' + _phEsc(_phT('adar_pt_otsikko_' + kentta)) + '">'
      + avaimet.map(function (a) {
        return '<button class="chip" data-pt="' + kentta + '" data-v="' + a + '" aria-pressed="' + onValittu(a) + '">' + _phEsc(_phT('adar_pt_' + kentta + '_' + a)) + '</button>';
      }).join('') + '</div></div>';
  };
  var h = kansi + rivi('otos', window.TM_ADAR_PELITILANNE.OTOKSET, function (a) { return pt.otos === a; });
  if (nak.vaihe) h += rivi('vaihe', window.TM_ADAR_PELITILANNE.VAIHEET, function (a) { return pt.vaihe.indexOf(a) >= 0; });
  if (nak.paine) h += rivi('paine', window.TM_ADAR_PELITILANNE.PAINEET, function (a) { return pt.paine === a; });
  return h;
}

/* ── PELAAJAN AVAUS ──────────────────────────────────────────────────────────
   Nollaa pisteet, valinnat, tekstin ja näkyvyyden (oletus iästä), mutta säilyttää
   kontekstin JA pelitilanteen — sama harjoitus jatkuu seuraavalle pelaajalle. */
function _phAvaaPelaaja(pid, korosta) {
  var S = window._phTila, p = _phPelaaja(pid);

  S.flash = !!korosta;   // nimirivin lyhyt korostus, kun lomake vaihtuu tallennuksen jälkeen
  /* Saman pelaajan keskeneräinen/epäonnistunut luonnos palautetaan; toisen pelaajan luonnos EI ylikirjoitu (huomautus). */
  if (typeof _luonnosLueKaikki === 'function') {
    var _l = _luonnosLueKaikki()[pid];
    if (_l && (_l.laheteys === 'luonnos' || _l.laheteys === 'epaonnistui' || !_l.laheteys) && _luonnosAvaa(pid, true)) return;
  }
  S.virhe = null;
  var ika = _phIka(pid);
  S.pelaajaId = pid;
  S.porrasTallennettu = p.havainto_porras || null;
  S.porras = S.porrasTallennettu || _phIkaPorras(ika);
  S.porrasNostettu = false;
  S.ehdotusOhitettu = false;
  S.pisteet = {}; S.havaitut = {}; S.vinkki = {};
  S.fb = null; S.fbKys = false; S.viestiAuki = false; S.viestiFokus = false;
  S.teksti = '';
  S.nakyvyys = _nakOletus(pid);

  S.sheet = false; S.peruttu = false;
  _phRender();
}
window._phAvaaPelaaja = _phAvaaPelaaja;

/* ── NÄKYVYYS — kenelle muistiinpano menee ═══════════════════════════════════
   MIKSI (vaihe 1): tallennus kirjoitti aina `nakyvyys:'pelaaja'`, ja Pelaaja_v7 näytti
   jokaisen valmiin havainnon narratiivin. Valmentajan muistiinpano meni siis sellaisenaan
   8–12-vuotiaalle, vaikka se on valmentajan työkalu eikä viesti lapselle.

   0b (Tero 19.10.2026): yhtenäinen kytkin "Näytä myös pelaajalle" (lib/tm_nakyvyys_kytkin.js), OLETUS POIS iästä riippumatta. Tila EI jää muistiin havaintojen välillä.
   Kun kytkin on päällä: pelaajan luettavaan havaintodokumenttiin (tyyppi 'havainto_pelaajalle') tallentuu VAIN pelaajalle tarkoitettu teksti — pisteet, havaitut ja tekijän nimi

function _nakPelaajanIka(pid) { return _phIka(pid); }

function _nakOletus() {

function _nakArvo() { return window._phTila.nakyvyys ? 'pelaaja' : 'valmentajat'; }   // pyyntö (kytkin) — ks. _phJaaPelaajalle: sisäinen dokumentti saa AINA 'valmentajat'

/* ── RENDER ──────────────────────────────────────────────────────────────── */
function _phJuuri() { return document.getElementById('ph-app'); }

function _phVerkkoMerkki() {

    ? ' · <span class="offl-merkki">' + tmHT('● ei verkkoa') + '</span>' : '';
}

function _phRender() {
  var juuri = _phJuuri();
  if (!juuri) return;
  var S = window._phTila;
  if (S.naytto === 'valitse' || !S.pelaajaId) _phRenderValitse();
  else if (S.naytto === 'ok') _phRenderOk();

window._phRender = _phRender;

/** 1 · PELAAJAN VALINTA — ainoa poimin, ainoa lista-lähde on _adarNakyvatPelaajat. */
function _phRenderValitse() {
  var S = window._phTila, juuri = _phJuuri();
  var idt = _phJarjesta(_adarNakyvatPelaajat(S.haku));
  var map = window._pelaajaMap || {};
  var ohje = _adarPoiminOhje();

  var h = (typeof _phHuomautusHtml === 'function') ? _phHuomautusHtml() : '';
  h += '<div class="ph-bar"><div class="ph-title"><div class="eyebrow">' + tmHT('Pelihavainto') + '</div>'
    + '<div class="ph-name">' + tmHT('Valitse pelaaja') + '</div>'
    + '<div class="ph-meta">' + tmHT('Oma joukkue · {n} pelaajaa').replace('{n}', idt.length) + _phVerkkoMerkki() + '</div></div></div>';

  if (ohje) h += '<p class="ohje varo">' + _phEsc(ohje) + '</p>';

    + idt.map(function (id) {
      var v = _phViimeksi(id);
      var kumoa = (_phKumoaNakyy() && S.viimeisin.pelaajaId === id)   // viimeksi tallennetun rivillä Kumoa 10 min
        ? '<button type="button" class="pl-kumoa" data-kumoa="' + _phEsc(id) + '">' + tmHT('Kumoa') + '</button>' : '';
      return '<div class="pl-w"><button class="pl" data-pl="' + _phEsc(id) + '"><span class="n">' + _phEsc((map[id] || {}).nimi)
        + '</span><span class="m' + (v.tanaan ? ' done' : '') + '">' + _phEsc(v.teksti) + '</span></button>' + kumoa + '</div>';
    }).join('') + '</div></div>';

/** Luku suomalaiseen muotoon (desimaalipilkku) — sekä fi- että sv-tilassa ("2.5" → "2,5"). */
function _phLuku(v) { return String(v).replace('.', ','); }

function _phPorrasTeksti(n) { return tmHT('Porras {n} / 4').replace('{n}', n); }

/** Porraspalkki: neljä lohkoa, nykyiseen asti täytetty (nimet ovat riveillä, ei toistoa). */
function _phPalkki(porras) {
  var h = '<span class="pbar" role="img" aria-label="' + _phEsc(_phPorrasTeksti(porras)) + '">';
  for (var i = 1; i <= 4; i++) h += '<i' + (i <= porras ? ' class="on"' : '') + '></i>';
  return h + '</span>';
}

/** Ulottuvuuden näyttönimi pisteet-avaimesta (A/D/Act/R) — yksi nimikanoni libistä. */
function _phDimNimi(k) {
  var avain = Object.keys(PH_KENTTA).filter(function (a) { return PH_KENTTA[a] === k; })[0];
  return _phNimet()[avain] || k;
}

/** Yksi ulottuvuusrivi: nimi (napautus = kysymys + kuvaus palauteruutuun) ja pisteet 1–3. `uusi` = tällä havainnolla portaalle nostettu ulottuvuus. */
function _phDimHTML(k, uusi, fbK) {
  var S = window._phTila, v = S.pisteet[k], nimi = _phDimNimi(k);
  var h = '<div class="drow"><button class="dn" data-dn="' + k + '" aria-pressed="' + (k === fbK) + '">' + _phEsc(nimi)
    + (uusi ? '<span class="uusi">' + tmHT('uusi porras') + '</span>' : '') + '</button>';
  h += '<div class="scores" role="group" aria-label="' + _phEsc(nimi) + '">';
  [1, 2, 3].forEach(function (n) {
    h += '<button class="sc s' + n + '" data-sc="' + k + '" data-v="' + n + '" aria-pressed="' + (v === n)
      + '" aria-label="' + _phEsc(nimi + ' ' + n + ' ' + _phT('adar_piste_' + n)) + '">' + n + '</button>';
  });
  return h + '</div></div>';
}

/** Palauteruudun kohde: viimeksi painettu / napautettu ulottuvuus, muuten ensimmäinen pisteyttämätön (viimeinen, jos kaikki pisteytetty). */
function _phFbAvain(dims) {
  var S = window._phTila;
  if (S.fb && dims.indexOf(S.fb) >= 0) return S.fb;
  var eka = dims.filter(function (k) { return !S.pisteet[k]; })[0];
  return eka || dims[dims.length - 1];
}

/** Palauteruutu: yksi yhteinen ruutu rivien alla. Pisteytetty → taso + kuvaus + "Mitä näit?" -valinnat (aina näkyvissä) + harjoitusvinkki; muuten kysymys. */
function _phFbHTML(k) {
  var S = window._phTila, T = _phTekstit(k), v = S.pisteet[k], nimi = _phDimNimi(k);
  if (!v) {
    return '<div class="fb vain-kys" id="ph-fb" aria-live="polite"><p class="fb-q' + (S.fb ? '' : ' dim') + '">' + _phEsc(nimi + ': ' + T.q) + '</p></div>';
  }
  var sel = S.havaitut[k] || [], vinkki = !!S.vinkki[k];
  var h = '<div class="fb' + (vinkki ? ' laaja' : '') + '" id="ph-fb" aria-live="polite"><div class="fb-h"><span class="fb-t">'
    + _phEsc(nimi + ' · ' + v + ' ' + _phT('adar_piste_' + v)) + '</span>'
    + '<button class="more" data-vinkki="' + k + '" aria-expanded="' + vinkki + '">' + (vinkki ? tmHT('Piilota ▴') : tmHT('Harjoitusvinkki ▾')) + '</button></div>';
  if (S.fbKys) h += '<p class="fb-q">' + _phEsc(T.q) + '</p>';
  h += '<div class="fb-d">' + _phEsc(T.d[v]) + (vinkki ? '<span class="fb-tip"><b>' + tmHT('Harjoitusvinkki:') + '</b> ' + _phEsc(T.tip[v]) + '</span>' : '') + '</div>';
  h += '<div class="fb-m"><span class="fb-ml">' + tmHT('Mitä näit?') + '</span>' + T.valinnat.map(function (c) {
    var on = sel.indexOf(c[0]) >= 0;
    return '<button class="chip' + (c[1] ? ' warn' : '') + '" data-chip="' + k + '" data-t="' + _phEsc(c[0]) + '" aria-pressed="' + on + '">' + _phEsc(c[0]) + '</button>';
  }).join('') + '</div>';
  return h + '</div>';
}

/** 2 · HAVAINTO — koko lomake yhdelle puhelinnäytölle: pelaajarivi · Missä · porras · ulottuvuusrivit · palauteruutu · alapalkki. */
function _phRenderHavainto() {
  var S = window._phTila, juuri = _phJuuri(), p = _phPelaaja();
  if (!p) { S.naytto = 'valitse'; _phRenderValitse(); return; }
  var ika = _phIka();
  var dims = _phDimit(S.porras);
  var ikaEhd = _phIkaPorras(ika);
  var vm = _phViimeksi(S.pelaajaId);
  var fbK = _phFbAvain(dims);

  var h = (typeof _phHuomautusHtml === 'function') ? _phHuomautusHtml(true) : '';
  var flash = !!S.flash; S.flash = false;
  h += '<div class="ph-pl' + (flash ? ' flash' : '') + '"><button class="ph-back" id="ph-back" aria-label="' + _phEsc(tmHT('Takaisin pelaajalistaan')) + '">←</button>'

    + '<button type="button" class="ph-linkki" id="ph-vaihda" aria-label="' + _phEsc(tmHT('Vaihda pelaaja')) + '">' + tmHT('Vaihda') + '</button></div>';
  h += (typeof _phHuomautusListaHtml === 'function') ? _phHuomautusListaHtml() : '';   // 2+ luonnosta: lista pelaajarivin alla
  h += '<div class="ph-body' + (h.indexOf('class="vika"') >= 0 ? ' vikaa' : '') + '">';
  if (typeof navigator !== 'undefined' && navigator.onLine === false) h += '<p class="ohje varo offl-merkki">' + tmHT('● ei verkkoa') + '</p>';
  if (S.virhe != null && S.virhe !== false) {
    h += '<div class="banner" role="alert"><b>' + tmHT('Havaintoa ei tallennettu – yritä uudelleen.') + '</b>' + (S.virhe ? ' ' + _phEsc(S.virhe) : '') + ' ' + tmHT('Sisältö on tallessa lomakkeessa.') + '</div>';
  }
  if (S.peruttu) {
    h += '<div class="banner"><b>' + tmHT('Edellinen havainto peruttu.') + '</b> ' + tmHT('Se jää historiaan, mutta ei laske peliälyyn eikä näy pelaajalle. Korjaa ja tallenna uudelleen.') + '</div>';
  }

  h += '<div class="missa"><span class="lbl">' + tmHT('Missä') + '</span><div class="seg" role="group" aria-label="' + _phEsc(tmHT('Konteksti')) + '">'
    + PH_KONTEKSTI_AVAIMET.map(function (o) {
      return '<button data-kx="' + o + '" aria-pressed="' + (S.konteksti === o) + '">' + _phEsc(_phT('adar_konteksti_' + o)) + '</button>';
    }).join('') + '</div></div>';

  h += _phPelitilanneHtml();

  h += '<div class="porras"><span class="lbl">' + _phPorrasTeksti(S.porras) + '</span>' + _phPalkki(S.porras)
    + '<button class="link" id="ph-porras" aria-label="' + _phEsc(tmHT('Muuta porrasta')) + '">' + tmHT('Muuta') + '</button></div>';

  /* Ehdotus tulee pikakentästä (§26). Näytetään vain pelaajan omalla portaalla; yksi tiivis rivi porrasrivin alla. */
  var ehd = _phEhdotus();
  if (ehd) {
    var uusinAvain = (typeof tmAdarBand === 'function') ? tmAdarBand(null, S.porras)[S.porras - 1] : 'a';
    h += '<div class="suggest"><div><b>' + _phEsc(tmHT('{nimi} {verbi} jo hyvin.').replace('{nimi}', (p.nimi || '').split(' ')[0]).replace('{verbi}', _phT('adar_verbi_' + uusinAvain))) + '</b> '
      + _phEsc(tmHT('Viimeiset 3: {hist}. Arvioidaanko myös {partitiivi}?').replace('{hist}', ehd.hist.map(_phLuku).join(' · ')).replace('{partitiivi}', _phT('adar_partitiivi_' + ehd.seuraava))) + '</div><div class="sg-b">'
      + '<button class="btn" id="ph-nosta" aria-pressed="true">+ '
      + _phEsc(_phNimet()[ehd.seuraava] || '')
      + '</button><button class="btn" id="ph-eivielä">' + tmHT('Ei vielä') + '</button></div></div>';
  }

  h += '<div class="rows">' + dims.map(function (k, i) { return _phDimHTML(k, S.porrasNostettu && i === dims.length - 1, fbK); }).join('') + '</div>';
  h += _phFbHTML(fbK);
  h += '</div>';

  var on = S.nakyvyys;
  var annetut = dims.filter(function (k) { return S.pisteet[k]; });
  var onViesti = !!(S.teksti && S.teksti.trim());
  h += '<div class="foot" id="ph-foot">';
  if (S.viestiAuki) {
    h += '<div class="viesti"><textarea id="ph-teksti" aria-label="' + _phEsc(on ? tmHT('Viesti pelaajalle') : tmHT('Muistiinpano · vain valmentajille')) + '" placeholder="'
      + _phEsc(on ? tmHT('Kirjoita pelaajalle: mitä hän teki hyvin ja mihin seuraavaksi.')
                  : tmHT('Mitä näit? Vain valmentajat ja VP näkevät tämän.'))
      + '">' + _phEsc(S.teksti) + '</textarea><div class="vis-h">' + (on
        ? tmHT('Pelaaja näkee tekstin sovelluksessaan. Pisteitä hän ei näe.')
        : '') + '</div></div>';
  }
  h += '<div class="foot-r"><button type="button" class="link" id="ph-viesti" aria-expanded="' + (!!S.viestiAuki) + '">'
    + (S.viestiAuki ? tmHT('Piilota ▴') : (onViesti ? tmHT('Viesti ✓') : tmHT('+ Viesti pelaajalle'))) + '</button>'
    + '<div class="vis">' + window.TM_NAKYVYYS_KYTKIN.tmNakyvyysKytkinHTML(on, { esc: _phEsc, t: _phLibT, toggleFn: '_nakAseta', id: 'ph-nayta', kompakti: true }) + '</div></div>';
  h += '<button class="save" id="ph-save"' + (annetut.length ? '' : ' disabled') + '>' + (annetut.length ? tmHT('Tallenna havainto') : tmHT('Valitse vähintään yksi piste')) + '</button></div>';

  if (S.sheet) {
    h += '<div class="sheet" role="dialog" aria-label="' + _phEsc(tmHT('Muuta porrasta')) + '">'
      + '<div class="lbl"><span>' + tmHT('Arvioidaan askel kerrallaan') + '</span><button class="link" id="ph-sulje">' + tmHT('Sulje') + '</button></div>'
      + [1, 2, 3, 4].map(function (i) {
        var merk = [];
        if (i === ikaEhd) merk.push(tmHT('ikäsuositus'));
        if (i === S.porrasTallennettu) merk.push(tmHT('nykyinen'));
        var nimet = _phNimet();
        var lista = ((typeof tmAdarBand === 'function') ? tmAdarBand(null, i) : []).map(function (a) { return nimet[a]; }).join(' + ');
        return '<button class="opt" data-porras="' + i + '" aria-pressed="' + (S.porras === i) + '">' + _phEsc(tmHT('Porras {n} · {lista}').replace('{n}', i).replace('{lista}', lista))
          + (merk.length ? ('<small>' + merk.join(' · ') + '</small>') : '') + '</button>';
      }).join('')
      + '<p class="ohje" style="margin-top:10px">' + tmHT('Ikä on ohje, ei raja. Porras tallentuu pelaajalle, ja seuraava havainto alkaa siitä.') + '</p></div>';
  }

  juuri.innerHTML = h;
  _phSidoHavainto();
  if (flash) setTimeout(function () { var e = juuri.querySelector('.ph-pl.flash'); if (e) e.classList.remove('flash'); }, 650);   // prefers-reduced-motion: staattinen korostus poistuu myös
  _phIlmSijoita();
}

/** Ehdotuskortin ehdot yhdessä paikassa (pikakenttä + ohitus + oma porras). */
function _phEhdotus() {
  var S = window._phTila, p = _phPelaaja();
  if (!p || S.ehdotusOhitettu || S.porrasNostettu) return null;
  var oma = S.porrasTallennettu || _phIkaPorras(_phIka());
  if (S.porras !== oma) return null;
  var e = p.havainto_porras_ehdotus;
  if (!e || !e.valmis || !e.seuraava) return null;
  return e;
}

function _phSidoHavainto() {
  var juuri = _phJuuri(), S = window._phTila;
  var back = document.getElementById('ph-back');
  if (back) back.onclick = function () { S.naytto = 'valitse'; S.peruttu = false; _phRender(); };
  var vaihda = document.getElementById('ph-vaihda');
  if (vaihda) vaihda.onclick = function () { S.naytto = 'valitse'; S.peruttu = false; _phRender(); };
  juuri.querySelectorAll('[data-kx]').forEach(function (b) {
    b.onclick = function () { S.konteksti = b.getAttribute('data-kx'); _phRender(); _luonnosTallenna(); };
  });
  var ptk = document.getElementById('ph-pt-kansi');
  if (ptk) ptk.onclick = function () { S.ptAuki = !S.ptAuki; _phRender(); };
  juuri.querySelectorAll('[data-pt]').forEach(function (b) {
    b.onclick = function () {
      var kentta = b.getAttribute('data-pt'), arvo = b.getAttribute('data-v'), pt = S.pelitilanne;
      if (kentta === 'vaihe') pt.vaihe = window.tmPelitilanneVaihe(pt.vaihe, arvo);   // enintään 2; kolmas vaihtaa vanhimman pois
      else pt[kentta] = (pt[kentta] === arvo) ? null : arvo;                    // toinen napautus tyhjentää
      _phRender(); _luonnosTallenna();
    };
  });
  juuri.querySelectorAll('[data-sc]').forEach(function (b) {
    b.onclick = function () {
      var k = b.getAttribute('data-sc'), v = Number(b.getAttribute('data-v'));
      if (S.pisteet[k] === v) delete S.pisteet[k]; else S.pisteet[k] = v;   // toinen napautus tyhjentää
      S.fb = k; S.fbKys = false;                                              // palauteruutu näyttää painetun ulottuvuuden
      _phRender(); _luonnosTallenna();
    };
  });
  juuri.querySelectorAll('[data-dn]').forEach(function (b) {   // nimen napautus = kysymys + nykyinen kuvaus
    b.onclick = function () { S.fb = b.getAttribute('data-dn'); S.fbKys = true; _phRender(); };
  });
  juuri.querySelectorAll('[data-vinkki]').forEach(function (b) {
    b.onclick = function () { var k = b.getAttribute('data-vinkki'); S.vinkki[k] = !S.vinkki[k]; _phRender(); };
  });
  juuri.querySelectorAll('[data-chip]').forEach(function (b) {
    b.onclick = function () {
      var k = b.getAttribute('data-chip'), t = b.getAttribute('data-t');
      var a = S.havaitut[k] = S.havaitut[k] || [];
      var i = a.indexOf(t);
      if (i >= 0) a.splice(i, 1); else a.push(t);
      _phRender(); _luonnosTallenna();
    };
  });
  var ta = document.getElementById('ph-teksti');
  if (ta) {
    ta.oninput = function () { S.teksti = ta.value; _luonnosTallenna(); };
    if (S.viestiFokus) {   // avattu linkistä: kenttä näkyviin ja kohdistus
      S.viestiFokus = false;
      try { ta.focus(); ta.scrollIntoView({ block: 'nearest' }); } catch (e) { /* ei tuettu */ }
    }
  }
  var vi = document.getElementById('ph-viesti');
  if (vi) vi.onclick = function () { S.viestiAuki = !S.viestiAuki; S.viestiFokus = S.viestiAuki; _phRender(); };
  var pr = document.getElementById('ph-porras');
  if (pr) pr.onclick = function () { S.sheet = true; _phRender(); };
  var sulje = document.getElementById('ph-sulje');
  if (sulje) sulje.onclick = function () { S.sheet = false; _phRender(); };
  var nosta = document.getElementById('ph-nosta');
  if (nosta) nosta.onclick = function () { S.porras = Math.min(4, S.porras + 1); S.porrasNostettu = true; _phRender(); };
  var ei = document.getElementById('ph-eivielä');
  if (ei) ei.onclick = function () { S.ehdotusOhitettu = true; _phRender(); };
  juuri.querySelectorAll('[data-porras]').forEach(function (b) {
    b.onclick = function () {
      var uusi = Number(b.getAttribute('data-porras'));
      S.porras = uusi;
      S.porrasNostettu = uusi > (S.porrasTallennettu || _phIkaPorras(_phIka()));
      /* Portaan ulkopuolelle jäävät pisteet pois — muuten tallentuisi ulottuvuus jota ei arvioida. */
      var salli = _phDimit(uusi);
      Object.keys(S.pisteet).forEach(function (k) { if (salli.indexOf(k) < 0) delete S.pisteet[k]; });
      S.sheet = false;
      _phRender(); _luonnosTallenna();
    };
  });
  var save = document.getElementById('ph-save');
  if (save) save.onclick = function () { _phTallenna(); };
}

/** 3 · TALLENNETTU */
function _phRenderOk() {
  var S = window._phTila, juuri = _phJuuri(), p = _phPelaaja();
  if (!p) { S.naytto = 'valitse'; _phRenderValitse(); return; }
  var map = window._pelaajaMap || {};
  var idt = _phJarjesta(_adarNakyvatPelaajat(''));
  var seuraava = idt.filter(function (id) { return !S.tehdyt[id]; })[0] || null;
  var nimet = _phNimet();
  var on = (S.viimeisin && S.viimeisin.nakyvyys === 'pelaaja');
  var odottaa = S.odottaa;

  var h = (typeof _phHuomautusHtml === 'function') ? _phHuomautusHtml() : '';
  h += '<div class="ph-bar"><div class="ph-title"><div class="eyebrow">' + tmHT('Pelihavainto') + '</div>'
    + '<div class="ph-name">' + (odottaa ? tmHT('Tallessa laitteella') : tmHT('Tallennettu')) + '</div>'
    + '<div class="ph-meta">' + _phEsc(p.nimi) + _phVerkkoMerkki() + '</div></div></div>';
  h += '<div class="ph-body"><div class="ok">';
  h += '<span class="vis-b' + (on ? '' : ' pr') + '">' + (on ? tmHT('Pelaaja näkee viestin') : tmHT('Vain valmentajille')) + '</span>';
  var osat = (S.viimeisin && S.viimeisin.pisteet) || {};
  h += '<div class="big">' + _phEsc((p.nimi || '').split(' ')[0]) + ' · '
    + Object.keys(osat).map(function (k) {
      var avain = Object.keys(PH_KENTTA).filter(function (a) { return PH_KENTTA[a] === k; })[0];
      return (nimet[avain] || k).toLowerCase() + ' ' + osat[k];
    }).join(', ') + '</div>';
  var _ptRivi = S.viimeisin ? window.tmPelitilanneYhteenveto(S.viimeisin.konteksti, S.viimeisin.pelitilanne, _phTr()) : '';
  if (_ptRivi) h += '<p class="ok-teksti">' + _phEsc(_ptRivi) + '</p>';
  if (odottaa) {
    h += '<p class="ohje varo">' + tmHT('Ei verkkoa. Havainto lähtee automaattisesti, kun yhteys palaa.') + ' '
      + '' + tmHT('Voit jatkaa havainnointia normaalisti.') + '</p>';
  } else {
    h += '<p class="ok-teksti">' + tmHT('Havainto päivitti pelaajakortin peliälyn.') + ' '
      + (on ? tmHT('Pelaaja saa viestin sovellukseensa.') : tmHT('Pelaajalle ei näy mitään.')) + '</p>';
  }
  if (S.viimeisin && S.viimeisin.porrasNostettu) {
    h += '<p class="ok-porras">' + _phEsc(tmHT('Porras {n} tallentui pelaajalle. Seuraava havainto alkaa siitä.').replace('{n}', S.viimeisin.porras)) + '</p>';
  }
  if (_phKumoaNakyy()) {
    h += '<div class="undo">' + tmHT('Väärä pelaaja tai piste?') + ' <button id="ph-undo">' + tmHT('Kumoa') + '</button> <span>' + tmHT('· 10 min ajan') + '</span></div>';
  }
  h += '</div>';
  h += '<div><div class="lbl"><span>' + tmHT('Samasta harjoituksesta · pisimpään havainnoimatta ensin') + '</span></div><div class="plist">'
    + idt.map(function (id) {
      var v = _phViimeksi(id);
      return '<button class="pl" data-pl="' + _phEsc(id) + '"><span class="n">' + _phEsc((map[id] || {}).nimi)
        + '</span><span class="m' + (v.tanaan ? ' done' : '') + '">' + _phEsc(v.teksti) + '</span></button>';
    }).join('') + '</div></div></div>';
  h += '<div class="foot"><div class="sum">'
    + (seuraava ? _phEsc(tmHT('Seuraavana: {nimi} · {aika}').replace('{nimi}', (map[seuraava] || {}).nimi || '').replace('{aika}', _phViimeksi(seuraava).teksti))
                : tmHT('Kaikki havainnoitu tänään'))
    + '</div><button class="save" id="ph-next"' + (seuraava ? '' : ' disabled') + '>'
    + (seuraava ? tmHT('Seuraava pelaaja →') : tmHT('Valmis')) + '</button></div>';

  juuri.innerHTML = h;
  var u = document.getElementById('ph-undo');
  if (u) u.onclick = function () { _phKumoa(); };
  var n = document.getElementById('ph-next');
  if (n && seuraava) n.onclick = function () { _phAvaaPelaaja(seuraava); };
  juuri.querySelectorAll('[data-pl]').forEach(function (b) {
    b.onclick = function () { _phAvaaPelaaja(b.getAttribute('data-pl')); };
  });
}

function _phKumoaNakyy() {
  var v = window._phTila.viimeisin;
  return !!(v && v.ref && !v.kumottu && (Date.now() - v.ms) < PH_KUMOA_MS);
}

/* ── TALLENNUKSEN ILMOITUS ───────────────────────────────────────────────────
   Tallennus avaa heti seuraavan pelaajan (ei Tallennettu-näkymää). Ilmoitus kertoo mitä tallentui ja
   antaa 8 s Kumoa-mahdollisuuden. Oma elementti #ph-ilm (ei _showToast: se ei ota painiketta), ja se
   elää renderöinnin ulkopuolella, joten pisteen napautus ei hävitä sitä. Kumoa toimii kokonaisuudessaan
   PH_KUMOA_MS (10 min): ilmoituksen jälkeen pelaajalistan rivin linkki. */
const PH_ILM_MS = 8000;
var _phIlm = null, _phIlmAjastin = null;

function _phIlmTeksti(i) {
  var t;
  if (i.odottaa && i.offline) t = tmHT('{nimi} tallessa laitteella · lähtee, kun yhteys palaa').replace('{nimi}', i.nimi);
  else {
    t = tmHT('{nimi} tallennettu').replace('{nimi}', i.nimi);
    if (i.porrasNostettu) t += ' · ' + tmHT('porras {n}').replace('{n}', i.porras);
    t += ' · ' + (i.nakyvyys === 'pelaaja' ? tmHT('pelaaja näkee') : tmHT('vain valmentajille'));
  }
  return t;
}

function _phIlmoita(tiedot) {
  _phIlm = tiedot;
  if (_phIlmAjastin) clearTimeout(_phIlmAjastin);
  _phIlmAjastin = setTimeout(_phIlmSulje, PH_ILM_MS);
  _phIlmPiirra();
}

function _phIlmSulje() {
  if (_phIlmAjastin) { clearTimeout(_phIlmAjastin); _phIlmAjastin = null; }
  _phIlm = null;
  var el = document.getElementById('ph-ilm');
  if (el) { el.hidden = true; el.innerHTML = ''; }
}
window._phIlmSulje = _phIlmSulje;

function _phIlmPiirra() {
  var el = document.getElementById('ph-ilm');
  if (!el) return;
  if (!_phIlm) { el.hidden = true; el.innerHTML = ''; return; }
  el.innerHTML = '<div class="ilm-i" id="ph-ilm-i"><span>' + _phEsc(_phIlmTeksti(_phIlm)) + '</span>'
    + (_phKumoaNakyy() ? '<button type="button" id="ph-ilm-kumoa">' + tmHT('Kumoa') + '</button>' : '') + '</div>';
  el.hidden = false;
  var i = document.getElementById('ph-ilm-i');
  if (i) i.onclick = function () { _phIlmSulje(); };               // napautus sulkee
  var k = document.getElementById('ph-ilm-kumoa');
  if (k) k.onclick = function (e) { if (e && e.stopPropagation) e.stopPropagation(); _phIlmSulje(); _phKumoa(); };
  _phIlmSijoita();
}

/** Ilmoitus alapalkin yläpuolelle (alapalkin korkeus vaihtelee: viestikenttä auki/kiinni). */
function _phIlmSijoita() {
  var el = document.getElementById('ph-ilm');
  if (!el || el.hidden) return;
  var foot = document.getElementById('ph-foot');
  el.style.bottom = (((foot && foot.offsetHeight) || 0) + 8) + 'px';
}
</script>

<script>
// ══════════════════════════════════════════════════════════════════════════════
// TALLENNUS — yksi polku, ei omaa offline-jonoa
//
// Firestoren `enablePersistence` hoitaa offline-kirjoituksen: `set()` menee paikalliseen
// välimuistiin heti ja lähtee kun verkko palaa. Siksi tallennusta EI awaitata UI:n
// etenemiselle — odottaminen jumittaisi kentällä juuri silloin kun verkkoa ei ole.
// Tila luetaan `onSnapshot({includeMetadataChanges:true})`-kuuntelijan `hasPendingWrites`:sta.
// ══════════════════════════════════════════════════════════════════════════════

function _phPelaajaRef(seuraId, pelaajaId) {
