n class=\"sbd\">Laatu vaihtelee — ei vielä luotettavaa paineessa<\u002Fspan>\n        <\u002Fbutton>\n        <button class=\"score-btn s3\" onclick=\"setScore('t3','Act',3,this)\">\n          <span class=\"sbn\">3<\u002Fspan><span class=\"sbl\">Hallitsee<\u002Fspan>\n          <span class=\"sbd\">Tekninen ja taktinen laatu säilyy myös paineessa<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- RE-ASSESS -->\n  <div class=\"phase-block\">\n    <div class=\"phase-header\">\n      <div class=\"phase-letter ph-r\" style=\"background:rgba(26,122,94,.22);color:#28B090\">R<\u002Fdiv>\n      <div class=\"phase-info\">\n        <div class=\"phase-name\">Re-assess — Virheestä palautuminen<\u002Fdiv>\n        <div class=\"phase-q\">\"Palautuuko vai jähmettyykö virheen jälkeen? &lt;15s = normaali\"<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"score-area\">\n      <div class=\"score-label\">Pisteytys — Resilience · TalentMaster-innovaatio (Duckworth 2007)<\u002Fdiv>\n      <div class=\"score-buttons\">\n        <button class=\"score-btn s1\" onclick=\"setScore('t3','R',1,this)\">\n          <span class=\"sbn\">1<\u002Fspan><span class=\"sbl\">Kehitettävää<\u002Fspan>\n          <span class=\"sbd\">Jähmettyy yli 15s virheen jälkeen — vaikuttaa pelin kulkuun<\u002Fspan>\n        <\u002Fbutton>\n        <button class=\"score-btn s2\" onclick=\"setScore('t3','R',2,this)\">\n          <span class=\"sbn\">2<\u002Fspan><span class=\"sbl\">Kehittyvä<\u002Fspan>\n          <span class=\"sbd\">Palautuu 10–15s, joskus jähmettymistä isoissa virheissä<\u002Fspan>\n        <\u002Fbutton>\n        <button class=\"score-btn s3\" onclick=\"setScore('t3','R',3,this)\">\n          <span class=\"sbn\">3<\u002Fspan><span class=\"sbl\">Hallitsee<\u002Fspan>\n          <span class=\"sbd\">Palautuu alle 10s — virhe ei vaikuta seuraavaan suoritukseen<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"signal-hint\">\n        <div class=\"sh-label\">Signaali<\u002Fdiv>\n        <div class=\"sh-item\"><span class=\"sh-dot\">●<\u002Fspan>Jähmettyminen on usein kognitiivinen kuormituskynnys — ei pelko<\u002Fdiv>\n        <div class=\"sh-item\"><span class=\"sh-dot\">●<\u002Fspan>Psyk-yhteys: Matala Re-assess → Resilience-kehitystarve, ei taktiikkakoulutus<\u002Fdiv>\n        <div class=\"sh-item\"><span class=\"sh-dot\">●<\u002Fspan>Error Recovery Protocol: tuo pelaaja takaisin peliin kysymällä — älä kommentoi virhettä<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div id=\"t3-psyk-R\" class=\"psyk-link visible\">\n      <strong>Psyk-kytkös:<\u002Fstrong> Re-assess-pisteet heijastavat suoraan <strong>Resilience<\u002Fstrong>-ominaisuutta. Matala Re-assess + matala D3 Resilience = vahvistus. Oikea interventio: Error Recovery -harjoite, ei lisää taktiikkaa.\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- PELAAJAN REFLEKTIO -->\n  <div class=\"narratiivi-block\">\n    <div class=\"narr-label\">Pelaajan reflektio — pakollinen Taso 3:ssa ★<\u002Fdiv>\n    <textarea class=\"narr-ta\" placeholder=\"Mitä pelaaja itse sanoi tilanteesta? Tunnistiko saman mitä valmentaja näki? Mitä tekisi toisin?\" id=\"t3-reflektio\" style=\"min-height:90px;\"><\u002Ftextarea>\n  <\u002Fdiv>\n\n  <div class=\"narratiivi-block\">\n    <div class=\"narr-label\">Valmentajan narratiivi<\u002Fdiv>\n    <textarea class=\"narr-ta\" placeholder=\"Kuvaa 1–2 tilannetta. Pelipaikkakohtainen avaintilanne erityisesti.\" id=\"t3-narr\" style=\"min-height:90px;\"><\u002Ftextarea>\n  <\u002Fdiv>\n\n  <div class=\"summary-block\">\n    <div class=\"sum-title\">Yhteenveto — Taso 3<\u002Fdiv>\n    <div class=\"sum-scores\">\n      <div class=\"sum-score-item\">\n        <div class=\"ssi-phase\">Assess<\u002Fdiv>\n        <div class=\"ssi-val\" id=\"t3-sum-A\">—<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"sum-score-item\">\n        <div class=\"ssi-phase\">Decide<\u002Fdiv>\n        <div class=\"ssi-val\" id=\"t3-sum-D\">—<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"sum-score-item\">\n        <div class=\"ssi-phase\">Act<\u002Fdiv>\n        <div class=\"ssi-val\" id=\"t3-sum-Act\">—<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"sum-score-item\">\n        <div class=\"ssi-phase\">Re-assess<\u002Fdiv>\n        <div class=\"ssi-val\" id=\"t3-sum-R\">—<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"sum-total\">\n      <span class=\"st-label\">Yhteispisteet<\u002Fspan>\n      <span><span class=\"st-val\" id=\"t3-total\">—<\u002Fspan><span class=\"st-max\"> / 12<\u002Fspan><\u002Fspan>\n    <\u002Fdiv>\n    <!-- ADAR Vision — Lisää kuva havaintoon (Taso t3) -->\n<div class=\"kuva-alue\" id=\"t3-kuva-alue\">\n  <input type=\"file\" id=\"t3-kuva-input\" accept=\"image/*\" capture=\"environment\" style=\"display:none\" onchange=\"_kuvaValittu('t3', this)\">\n  <div class=\"kuva-esikatselu-wrap\" id=\"t3-kuva-wrap\">\n    <img class=\"kuva-esikatselu\" id=\"t3-kuva-img\" alt=\"Havainnon kuva\">\n    <button class=\"kuva-poista\" onclick=\"_kuvaPoista('t3')\">×<\u002Fbutton>\n    <div class=\"kuva-ai-merkki\">AI analysoi<\u002Fdiv>\n  <\u002Fdiv>\n  <button class=\"kuva-nappi\" id=\"t3-kuva-nappi\" onclick=\"document.getElementById('t3-kuva-input').click()\">\n    <span style=\"font-size:16px\">📸<\u002Fspan> Lisää kuva havaintoon\n  <\u002Fbutton>\n  <div class=\"ai-lataa\" id=\"t3-ai-lataa\">\n    <span class=\"ai-lataa-piste\"><\u002Fspan> AI kirjoittaa narratiivia...\n  <\u002Fdiv>\n  <div class=\"ai-narratiivi-tulos\" id=\"t3-ai-narr\">\n    <div class=\"ai-narratiivi-label\">AI — NARRATIIVI<\u002Fdiv>\n    <span id=\"t3-ai-narr-teksti\"><\u002Fspan>\n  <\u002Fdiv>\n<\u002Fdiv>\n<button class=\"save-btn\" id=\"t3-save\" onclick=\"saveCard(3)\">Tallenna havainto → Firestoreen<\u002Fbutton>\n\n<!-- Analyysitulos Taso 3 -->\n<div class=\"result-box\" id=\"t3-result\">\n  <div class=\"res-header\">ADAR-analyysi tallennettu<\u002Fdiv>\n  <div class=\"res-block\">\n    <div class=\"res-label\">Pelipaikka · Assess<\u002Fdiv>\n    <div class=\"res-val\" id=\"t3-r-assess\">—<\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"res-block\">\n    <div class=\"res-label\">Decide → Ratkaisu · Nopeus<\u002Fdiv>\n    <div class=\"res-val\" id=\"t3-r-decide\">—<\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"res-block\">\n    <div class=\"res-label\">Act · Re-assess → Oppiminen<\u002Fdiv>\n    <div class=\"res-val\" id=\"t3-r-act\">—<\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"res-block\">\n    <div class=\"res-label\">Narratiivi<\u002Fdiv>\n    <div class=\"narr-box\" id=\"t3-r-narr\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"res-btn-row\">\n    <button class=\"res-btn\" onclick=\"_kopioiAnalyysi('t3')\">⧉ Kopioi analyysi<\u002Fbutton>\n    <button class=\"res-btn\" onclick=\"_uusiArviointi('t3')\">↺ Uusi arviointi<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"scroll-hint\">↑ Vaihda tasoa yläpalkista · Tallenna → havainnot-kokoelma Firestoreen<\u002Fdiv>\n\n<script>\n// ══════════════════════════════════════════════════════════════════\n// FIREBASE-ALUSTUS — Porras 1 (P6)\n// ══════════════════════════════════════════════════════════════════\n(function _fbInit() {\n  const cfg = {\n    apiKey:            \"AIzaSyAp471lOIntzP33p9bIW3y4KbeEyBt5kIo\",\n    authDomain:        \"talentmaster-pilot.firebaseapp.com\",\n    projectId:         \"talentmaster-pilot\",\n    storageBucket:     \"talentmaster-pilot.firebasestorage.app\",\n    messagingSenderId: \"872561784446\",\n    appId:             \"1:872561784446:web:05c4c7996dfd46ddd14a2f\"\n  };\n  if (!firebase.apps.length) firebase.initializeApp(cfg);\n  window._tmDB   = firebase.firestore();\n  window._tmAuth = firebase.auth();\n})();\n\n// ══════════════════════════════════════════════════════════════════\n// AUTH-KUUNTELU — hakee valmentajan seuran ja pelaajat kirjautuessa\n// ══════════════════════════════════════════════════════════════════\nwindow._tmAuth.onAuthStateChanged(async (user) => {\n  const loginBanner = document.getElementById('tm-login-banner');\n  if (!user) {\n    // Ei kirjautunut — näytä kirjautumisinfo\n    if (loginBanner) loginBanner.style.display = 'flex';\n    return;\n  }\n  if (loginBanner) loginBanner.style.display = 'none';\n\n  // Hae valmentajan seura Custom Claims -tokenista\n  try {\n    const token = await user.getIdTokenResult(true);\n    const seuraId = token.claims.seuraId;\n    if (!seuraId) {\n      console.warn('[ADAR] Ei seuraId Custom Claimsissä');\n      return;\n    }\n    window._tmSeuraId = seuraId;\n\n    // Hae seuran pelaajat — täytä kaikki kolme select-kentät\n    const snap = await window._tmDB\n      .collection('seurat').doc(seuraId)\n      .collection('pelaajat')\n      .orderBy('sukunimi')\n      .get();\n\n    // Rakennetaan pelaajat-map jossa avaimena Firebase-ID ja arvona tunniste (PalloID).\n    // Tätä käytetään saveCard():ssa, jotta jokainen havainto saa palloId-kentän.\n    // PalloID on Palloliiton pysyvä tunniste — seurasta ja Firebase-ID:stä riippumaton.\n    window._pelaajaMap = window._pelaajaMap || {};\n    snap.docs.forEach(d => {\n      const p = d.data();\n      window._pelaajaMap[d.id] = {\n        tunniste: p.tunniste || p.palloId || null,  // PalloID — null jos ei asetettu\n        nimi:     (p.etunimi || '') + ' ' + (p.sukunimi || ''),\n        joukkue:  p.joukkue || p.joukkueNimi || ''\n      };\n    });\n\n    const options = snap.docs.map(d => {\n      const p = window._pelaajaMap[d.id];\n      return `<option value=\"${d.id}\">${p.nimi.trim()}${p.joukkue ? ' · ' + p.joukkue : ''}<\u002Foption>`;\n    }).join('');\n\n    // Päivitä kaikki kolme tasoa\n    ['t1','t2','t3'].forEach(tier => {\n      const el = document.getElementById(tier + '-pelaaja-id');\n      if (el) el.innerHTML = '<option value=\"\">— Valitse pelaaja —<\u002Foption>' + options;\n    });\n\n    console.log(`[ADAR] ${snap.docs.length} pelaajaa ladattu seuralle ${seuraId}`);\n\n    // Jos master-kontekstissa on esivalittu pelaaja, valitaan se automaattisesti\n    if (window._masterPelaajaId) {\n      const pid = window._masterPelaajaId;\n      // Pikasyötön select-lista\n      ['t1','t2','t3'].forEach(tier => {\n        const sel = document.getElementById(tier + '-pelaaja-id');\n        if (sel) sel.value = pid;\n      });\n      // Pikasyöttö-grid (jos ollaan pikasyöttö-tilassa)\n      window._tmSeuraId = window._masterSeuraId || seuraId;\n      window._masterPelaajaId = null;  // käytetty kerran\n    }\n\n    // Päivitä myös pikasyöttö-pelaajagrid\n    _paivitaPikaPelaajat(snap, seuraId);\n  } catch (e) {\n    console.error('[ADAR] Pelaajien haku epäonnistui:', e.message);\n  }\n});\n\n// ══════════════════════════════════════════════════════════════════\n// TOAST-VIESTI\n// ══════════════════════════════════════════════════════════════════\nfunction _showToast(msg) {\n  let t = document.getElementById('tm-toast');\n  if (!t) {\n    t = document.createElement('div');\n    t.id = 'tm-toast';\n    t.style.cssText = [\n      'position:fixed', 'bottom:24px', 'left:50%', 'transform:translateX(-50%)',\n      'background:#1A7A5E', 'color:#F2EFE6', 'padding:12px 24px',\n      'border-radius:8px', 'font-size:13px', 'font-weight:500',\n      'z-index:9999', 'opacity:0', 'transition:opacity .3s',\n      'max-width:90vw', 'text-align:center'\n    ].join(';');\n    document.body.appendChild(t);\n  }\n  t.textContent = msg;\n  t.style.opacity = '1';\n  setTimeout(() => { t.style.opacity = '0'; }, 3000);\n}\n\n// ══════════════════════════════════════════════════════════════════\n// KIRJAUTUMINEN\n// ══════════════════════════════════════════════════════════════════\nasync function _tmKirjaudu() {\n  const email = document.getElementById('tm-login-email').value.trim();\n  const pass  = document.getElementById('tm-login-pass').value;\n  const errEl = document.getElementById('tm-login-err');\n  errEl.textContent = '';\n  if (!email || !pass) { errEl.textContent = 'Täytä sähköposti ja salasana'; return; }\n  try {\n    await window._tmAuth.signInWithEmailAndPassword(email, pass);\n    // onAuthStateChanged hoitaa loput\n  } catch (e) {\n    errEl.textContent = 'Kirjautuminen epäonnistui — tarkista tiedot';\n    console.error('[ADAR] Kirjautumisvirhe:', e.code);\n  }\n}\n\n// ── TILA ──\nconst scores = {\n  t1: { A: null },\n  t2: { A: null, D: null, Act: null },\n  t3: { A: null, D: null, Act: null, R: null }\n};\n\nconst maxScores = { t1: 3, t2: 9, t3: 12 };\n\n// ── PÄIVÄMÄÄRÄ ──\nfunction setDates() {\n  const d = new Date();\n  const str = d.toLocaleDateString('fi-FI');\n  const iso = d.toISOString().split('T')[0];\n  ['1','2','3'].forEach(n => {\n    const el = document.getElementById('date' + n);\n    if (el) el.textContent = str;\n    const pvm = document.getElementById('t' + n + '-pvm');\n    if (pvm) pvm.value = iso;\n  });\n}\nsetDates();\n\n// ── TASO VAIHTO ──\nfunction setLevel(n) {\n  document.querySelectorAll('.level-tab').forEach((t, i) => {\n    t.classList.toggle('active', i === n - 1);\n  });\n  document.querySelectorAll('.level-view').forEach((v, i) => {\n    v.classList.toggle('active', i === n - 1);\n  });\n}\n\n// ── PISTEET ──\nfunction setScore(tier, phase, val, btn) {\n  scores[tier][phase] = val;\n\n  // Poista muiden valinta\n  const parent = btn.closest('.score-buttons');\n  parent.querySelectorAll('.score-btn').forEach(b => b.classList.remove('selected'));\n  btn.classList.add('selected');\n\n  // Psyk-linkit Taso 2\n  if (tier === 't2' && val === 1) {\n    const el = document.getElementById('t2-psyk-' + phase);\n    if (el) el.classList.add('visible');\n  }\n\n  updateTotal(tier);\n}\n\nfunction updateTotal(tier) {\n  const s = scores[tier];\n  const vals = Object.values(s).filter(v => v !== null);\n  if (vals.length === 0) return;\n\n  const total = vals.reduce((a, b) => a + b, 0);\n\n  if (tier === 't1') {\n    document.getElementById('t1-total').textContent = total;\n  } else if (tier === 't2') {\n    ['A','D','Act'].forEach(p => {\n      const el = document.getElementById('t2-sum-' + p);\n      if (!el) return;\n      const v = s[p];\n      el.textContent = v !== null ? v : '—';\n      el.className = 'ssi-val' + (v ? ' scored-' + v : '');\n    });\n    const allDone = s.A !== null && s.D !== null && s.Act !== null;\n    if (allDone) document.getElementById('t2-total').textContent = total;\n  } else if (tier === 't3') {\n    ['A','D','Act','R'].forEach(p => {\n      const el = document.getElementById('t3-sum-' + p);\n      if (!el) return;\n      const v = s[p];\n      el.textContent = v !== null ? v : '—';\n      el.className = 'ssi-val' + (v ? ' scored-' + v : '');\n    });\n    const allDone = s.A !== null && s.D !== null && s.Act !== null && s.R !== null;\n    if (allDone) document.getElementById('t3-total').textContent = total;\n  }\n}\n\n// ── CHECKBOX Taso 1 — tukee .t1-cb-btn (uusi 2×2-rakenne) ja .t1-cb (vanha) ──\nfunction toggleCb(el) {\n  el.classList.toggle('checked');\n  // Päivitä progressipalkki kun checkbox muuttuu\n  _updateProg();\n}\n\n// ── KONTEKSTI ──\nfunction toggleCtx(btn) {\n  btn.classList.toggle('active');\n}\n\n// ── PELIVAIHE + KPI-RIVIT (kanoniset SPL Valmennuslinja 2023 -rivit) ──\n// N = ikäluokka U13–U15, E = ikäluokka U16–U19\n// Tasolla 2 näytetään vain N-tagatut, tasolla 3 sekä N että E\nconst KPI_ROWS = {\n  hyokkays: [\n    { name: 'Avaaminen — pallot ensimmäisen linjan ohi', age: ['N','E'] },\n    { name: 'Rakentelu — eteneminen linjojen välissä',   age: ['N','E'] },\n    { name: 'Murtautuminen — viimeisen linjan ohittaminen', age: ['E'] },\n    { name: 'Viimeistely — maalin tekeminen',            age: ['N','E'] },\n    { name: 'Tilan laajentaminen — syvyys ja leveys',    age: ['N','E'] },\n    { name: 'Pallon kierrätys — peliasento',             age: ['N','E'] },\n  ],\n  puolustus: [\n    { name: 'Avaamisen estäminen — aktiivinen paine',    age: ['N','E'] },\n    { name: 'Rakentelun estäminen — kompakti lohko',     age: ['N','E'] },\n    { name: 'Murtautumisen estäminen — puolustuslinja',  age: ['N','E'] },\n    { name: 'Viimeistelyn estäminen — maalinsuojaus',    age: ['N','E'] },\n    { name: '1v1-puolustus — etäisyys ja vartalo',       age: ['N','E'] },\n  ],\n  hyokkayssiirtyma: [\n    { name: 'Riiston jälkeinen ensimmäinen syöttö',      age: ['N','E'] },\n    { name: 'Nopea murtautuminen — vastaisku',           age: ['E'] },\n    { name: 'Tilan löytäminen riiston jälkeen',          age: ['N','E'] },\n  ],\n  puolustussiirtyma: [\n    { name: 'Counter-pressing — paine 5 sekunnissa',     age: ['E'] },\n    { name: 'Vetäytyminen ja muoto',                     age: ['N','E'] },\n    { name: 'Tilan sulkeminen menetyksen jälkeen',       age: ['N','E'] },\n  ],\n  erikoistilanne: [\n    { name: 'Vapaapotku — hyökkäys',                     age: ['N','E'] },\n    { name: 'Vapaapotku — puolustus',                    age: ['N','E'] },\n    { name: 'Kulmapotku — hyökkäys',                     age: ['N','E'] },\n    { name: 'Kulmapotku — puolustus',                    age: ['N','E'] },\n    { name: 'Rangaistuspotku',                           age: ['N','E'] },\n    { name: 'Sisäänheitto',                              age: ['N','E'] },\n  ],\n};\n\n// Pidetään kirjaa per-tier valinnoista, jotta save-logiikka voi lukea ne\nconst _phaseState = { t2: { phase: '', kpi: '' }, t3: { phase: '', kpi: '' } };\n\nfunction togglePhase(btn, tier) {\n  const grid = btn.parentElement;\n  const wasActive = btn.classList.contains('active');\n  // pois muut\n  grid.querySelectorAll('.phase-pill').forEach(b => b.classList.remove('active'));\n  // toggle: jos sama oli aktiivinen, jää pois (deselectable)\n  if (!wasActive) btn.classList.add('active');\n  const phase = wasActive ? '' : btn.dataset.phase;\n  _phaseState[tier].phase = phase;\n  // KPI-valinta nollataan kun pelivaihe vaihtuu\n  _phaseState[tier].kpi = '';\n  _renderKpiRows(tier);\n}\n\nfunction toggleKpiRows(tier) {\n  const tog  = document.getElementById(tier + '-kpi-toggle');\n  const rows = document.getElementById(tier + '-kpi-rows');\n  if (!tog || !rows) return;\n  const open = !rows.classList.contains('open');\n  rows.classList.toggle('open', open);\n  tog.classList.toggle('open', open);\n  if (open) _renderKpiRows(tier);\n}\n\nfunction _renderKpiRows(tier) {\n  const list = document.getElementById(tier + '-kpi-list');\n  if (!list) return;\n  const phase = _phaseState[tier].phase;\n  if (!phase) {\n    list.innerHTML = '<span class=\"kpi-row-empty\">Valitse ensin pelivaihe yltä…<\u002Fspan>';\n    return;\n  }\n  const ageFilter = (tier === 't2') ? 'N' : null; // t2 = vain N, t3 = molemmat\n  const rows = (KPI_ROWS[phase] || []).filter(r =>\n    !ageFilter || r.age.includes(ageFilter)\n  );\n  if (!rows.length) {\n    list.innerHTML = '<span class=\"kpi-row-empty\">Ei rivejä tälle pelivaiheelle ja ikäluokalle.<\u002Fspan>';\n    return;\n  }\n  list.innerHTML = rows.map(r => {\n    const sel = (_phaseState[tier].kpi === r.name) ? ' active' : '';\n    const safe = r.name.replace(/'/g, \"\\\\'\");\n    return '<button class=\"kpi-row-btn' + sel + '\" type=\"button\" onclick=\"selectKpiRow(\\'' + tier + '\\',\\'' + safe + '\\',this)\">' + r.name + '<\u002Fbutton>';\n  }).join('');\n}\n\nfunction selectKpiRow(tier, name, btn) {\n  const wasActive = btn.classList.contains('active');\n  btn.parentElement.querySelectorAll('.kpi-row-btn').forEach(b => b.classList.remove('active'));\n  if (!wasActive) btn.classList.add('active');\n  _phaseState[tier].kpi = wasActive ? '' : name;\n}\n\n// julkinen lukija save-logiikkaa varten\nwindow.getPhaseState = (tier) => ({ ..._phaseState[tier] });\n\n// ── PELIPAIKKA INFO Taso 3 ──\nconst ppTargets = {\n  'CD': 'CD: Tavoite Assess ≥2p · Re-assess ≥2p. Skannausharjoitteet + Error Recovery.',\n  'FB/WB': 'FB/WB: Tavoite Assess ≥2p · Act ≥2p. Dual-Task reaktio + 1v1 laidalla.',\n  'CDM': 'CDM: Tavoite Decide ≥2p · Assess ≥2p. Honey Trap + paineistettu syöttö.',\n  'CAM': 'CAM: Tavoite täysi ADAR ≥9p/12p. Dual-Task Rondo progressio Taso 2–3.',\n  'W': 'W: Tavoite Act ≥2p (nopeus ratkaisee). 1v1 laidalla + harhautus-laukaus.',\n  'ST': 'ST: Tavoite Act ≥2p + Re-assess ≥2p. Kiihdytys + viimeistely + Error Recovery.'\n};\ndocument.getElementById('t3-pelipaikka').addEventListener('change', function() {\n  const pp = this.value.split('—')[0].trim();\n  const info = document.getElementById('t3-pp-info');\n  const match = Object.keys(ppTargets).find(k => pp.startsWith(k));\n  info.textContent = match ? ppTargets[match] : 'Valitse pelipaikka nähdäksesi tavoitetasot.';\n});\n\n// ── TALLENNA ──\nasync function saveCard(level) {\n  const tier = 't' + level;\n  const btn = document.getElementById(tier + '-save');\n\n  // Kerää data\n  const data = {\n    tyyppi: 'adar',\n    adar_taso: level,\n    pelaaja: document.getElementById(tier + '-pelaaja')?.value || '',\n    ika: document.getElementById(tier + '-ikä')?.value || '',\n    tilanne: document.getElementById(tier + '-tilanne')?.value || '',\n    pelivaihe: (window.getPhaseState && window.getPhaseState(tier)?.phase) || '',\n    kpi: (window.getPhaseState && window.getPhaseState(tier)?.kpi) || '',\n    pvm: document.getElementById(tier + '-pvm')?.value || new Date().toISOString().split('T')[0],\n    pisteet: { ...scores[tier] },\n    narratiivi: document.getElementById(tier + '-narr')?.value || '',\n    tehty: true,\n    timestamp: new Date().toISOString()\n  };\n\n  if (level === 3) {\n    data.pelipaikka = document.getElementById('t3-pelipaikka')?.value || '';\n    data.reflektio = document.getElementById('t3-reflektio')?.value || '';\n  }\n\n  // Tarkistus\n  const vals = Object.values(scores[tier]).filter(v => v !== null);\n  const required = { 1: 1, 2: 3, 3: 4 };\n  if (vals.length < required[level]) {\n    btn.textContent = '⚠ Täytä kaikki pisteet ensin';\n    btn.style.background = 'rgba(138,43,43,.4)';\n    setTimeout(() => {\n      btn.textContent = 'Tallenna havainto → Firestoreen';\n      btn.style.background = '';\n      btn.classList.remove('saved');\n    }, 2000);\n    return;\n  }\n\n  // ── FIREBASE TALLENNUSLOGIIKKA (Porras 1) ──────────────────────────────\n  // Polku: seurat/{seuraId}/pelaajat/{pelaajaId}/havainnot/{havaintoId}\n  // tila: 'valmis' — pelaaja voi lukea heti (ei Vision Analyysista)\n  // pelaaja_lukenut: false — päivittyy kun pelaaja avaa havainnon Pelaaja v7:ssä\n\n  const db   = window._tmDB;\n  const auth = window._tmAuth;\n\n  if (!db || !auth) {\n    btn.textContent = '⚠ Firebase ei ole alustettu';\n    btn.style.background = 'rgba(138,43,43,.4)';\n    setTimeout(() => { btn.textContent = 'Tallenna havainto → Firestoreen'; btn.style.background = ''; }, 3000);\n    return;\n  }\n\n  const user = auth.currentUser;\n  if (!user) {\n    btn.textContent = '⚠ Kirjaudu ensin sisään';\n    btn.style.background = 'rgba(138,43,43,.4)';\n    setTimeout(() => { btn.textContent = 'Tallenna havainto → Firestoreen'; btn.style.background = ''; }, 3000);\n    return;\n  }\n\n  // Hae valittu pelaaja-dokumentti\n  const pelaajaEl  = document.getElementById(tier + '-pelaaja-id');\n  const pelaajaId  = pelaajaEl?.value || '';\n  const seuraId    = window._tmSeuraId || '';\n\n  if (!pelaajaId || !seuraId) {\n    btn.textContent = '⚠ Valitse pelaaja ensin';\n    btn.style.background = 'rgba(138,43,43,.4)';\n    setTimeout(() => { btn.textContent = 'Tallenna havainto → Firestoreen'; btn.style.background = ''; }, 3000);\n    return;\n  }\n\n  // Validoi narratiivi Taso 2 ja 3\n  if (level >= 2 && (!data.narratiivi || data.narratiivi.trim().length < 20)) {\n    btn.textContent = '⚠ Narratiivi vaaditaan (min. 20 merkkiä)';\n    btn.style.background = 'rgba(138,43,43,.4)';\n    setTimeout(() => { btn.textContent = 'Tallenna havainto → Firestoreen'; btn.style.background = ''; }, 3000);\n    return;\n  }\n\n  btn.disabled = true;\n  btn.textContent = '⏳ Tallennetaan...';\n\n  // Rakenna Firestore-dokumentti suunnitellun scheman mukaan\n  const havaintoData = {\n    // Perusmetatiedot\n    tyyppi:           'adar_pikakortti',\n    adar_taso:        level,\n    tekija_uid:       user.uid,\n    tekija_nimi:      user.displayName || user.email,\n    luotu:            window.firebase.firestore.FieldValue.serverTimestamp(),\n    pelaaja_lukenut:  false,\n    tila:             'valmis',  // Suora tallennnus = valmis (ei Vision Analyysi -vaihetta)\n\n    // Pelaajan tunnisteet\n    // Firebase-dokumentin ID (tekninen, seurakohtainen)\n    pelaaja_id:  pelaajaId,\n    seura_id:    seuraId,\n    pvm:         data.pvm,\n    // PalloID — Palloliiton pysyvä tunniste, seurasta riippumaton ankkuri\n    // Haetaan _pelaajaMap:ista joka täytetään pelaajien latauksen yhteydessä\n    palloId:     (window._pelaajaMap && window._pelaajaMap[pelaajaId])\n                   ? (window._pelaajaMap[pelaajaId].tunniste || null)\n                   : null,\n\n    // ADAR-pisteet\n    pisteet: data.pisteet,\n\n    // Narratiivi ja oppimisnäkökohta (nämä näytetään pelaajalle)\n    narratiivi:       data.narratiivi || '',\n    oppimisnakokohta: data.reflektio  || '',\n    nakyvyys:         'pelaaja',  // default: pelaaja näkee\n\n    // Tilannekonteksti\n    tilanne: data.tilanne || '',\n    // Pelivaihe (kanoninen 4 universaalia + erikoistilanne) + valittu KPI-rivi (SPL Valmennuslinja 2023)\n    pelivaihe: data.pelivaihe || '',\n    kpi: data.kpi || '',\n  };\n\n  // Taso 3 -lisäkentät\n  if (level === 3) {\n    havaintoData.pelipaikka  = data.pelipaikka  || '';\n    havaintoData.reflektio   = data.reflektio   || '';\n  }\n\n  try {\n    // ── ADAR Vision: lataa kuva Storageen ennen Firestore-kirjoitusta ──────\n    const _mediaObj = await _lataaKuvaStorageen(tier, 'pre_' + Date.now(), seuraId);\n    if (_mediaObj) havaintoData.media = [_mediaObj];\n\n    const ref = await db\n      .collection('seurat').doc(seuraId)\n      .collection('pelaajat').doc(pelaajaId)\n      .collection('havainnot')\n      .add(havaintoData);\n\n    // ── ADAR Vision: pyydä AI-narratiivi asynkronisesti ──────────────────\n    // Kutsutaan tallennuksen JÄLKEEN — ei estä tallennusta.\n    // _pyydaAINarratiivi() lataa kuvan base64:ksi, kutsuu aiProxy:a,\n    // ja tallentaa narratiivin erillisellä .update()-kutsulla.\n    if (window._kuvaFiles && window._kuvaFiles[tier]) {\n      _pyydaAINarratiivi(tier, ref.id, seuraId, pelaajaId, havaintoData);\n    }\n\n    console.log('[ADAR Pikakortti] Tallennettu:', ref.id);\n\n    btn.textContent = '✓ Tallennettu pelaajalle';\n    btn.classList.add('saved');\n    btn.disabled = false;\n\n    // Näytä analyysitulos-osio\n    _naytaAnalyysi(level);\n\n    // Näytä vahvistustoast\n    _showToast('✓ Havainto tallennettu — pelaaja voi nyt lukea sen');\n\n    // Ilmoita isänikkunalle (Master-näkymä) että tallennus onnistui.\n    // Master kuuntelee tätä viestiä ja sulkee drill-paneelin automaattisesti.\n    if (window.parent && window.parent !== window) {\n      window.parent.postMessage('tm:adar:saved', '*');\n    }\n\n    setTimeout(() => {\n      btn.textContent = 'Tallenna havainto → Firestoreen';\n      btn.classList.remove('saved');\n    }, 4000);\n\n  } catch (err) {\n    console.error('[ADAR Pikakortti] Tallennusvirhe:', err.message || err);\n    // Debug permission-denied — tulostaa tarkan Firestore-polun ja käyttäjän roolin\n    if (err.code === 'permission-denied' || err.message?.includes('permissions')) {\n      const seuraIdDbg  = window._tmSeuraId || 'EI ASETETTU';\n      const pelaajaDbg  = document.getElementById(tier + '-pelaaja-id')?.value || 'EI ASETETTU';\n      const emailDbg    = window._tmAuth?.currentUser?.email || 'EI KIRJAUTUNUT';\n      const rooliDbg    = window._tmRooli || 'EI TIEDOSSA';\n      console.warn('[ADAR Debug] Polku: seurat/' + seuraIdDbg + '/pelaajat/' + pelaajaDbg + '/havainnot');\n      console.warn('[ADAR Debug] Käyttäjä:', emailDbg, '| Rooli:', rooliDbg);\n      btn.textContent = '⚠ Oikeusvirhe — katso konsoli';\n    } else {\n      btn.textContent = '⚠ Tallennusvirhe — yritä uudelleen';\n    }\n    btn.style.background = 'rgba(138,43,43,.4)';\n    btn.disabled = false;\n    setTimeout(() => { btn.textContent = 'Tallenna havainto → Firestoreen'; btn.style.background = ''; }, 4000);\n  }\n}\n\n// ══════════════════════════════════════════════════════════════\n// PARANNUS 1: Progressipalkki — päivittyy reaaliajassa\n// ══════════════════════════════════════════════════════════════\nfunction _updateProg() {\n  const tier = 't' + _currentLevel();\n  const fields = {\n    t1: ['t1-pelaaja-id'],\n    t2: ['t2-pelaaja-id', 't2-pvm'],\n    t3: ['t3-pelaaja-id', 't3-pelipaikka', 't3-pvm']\n  };\n  const required = fields[tier] || [];\n  let filled = 0;\n    required.forEach(id => {\n    const el = document.getElementById(id);\n    if (el && el.value) filled++;\n  });\n  filled += Object.values(scores[tier] || {}).filter(v=>v!==null).length;\n  const narr = document.getElementById(tier + '-narr');\n  if (narr && narr.value.trim().length >= 20) filled++;\n  const maxFill = required.length + Object.keys(scores[tier] || {}).length + 1;\n  const pct = maxFill > 0 ? Math.min(100, Math.round((filled / maxFill) * 100)) : 0;\n  const fill = document.getElementById('tm-prog-fill');\n  if (fill) fill.style.width = Math.max(3, pct) + '%';\n}\n\nfunction _currentLevel() {\n  const active = document.querySelector('.level-tab.active');\n  if (!active) return 2;\n  const idx = Array.from(document.querySelectorAll('.level-tab')).indexOf(active);\n  return idx + 1;\n}\n\n// Kytke progressipalkki kaikkiin select-muutoksiin\ndocument.addEventListener('change', function(e) {\n  if (e.target.tagName === 'SELECT') _updateProg();\n});\n\n// ══════════════════════════════════════════════════════════════\n// PARANNUS 3: Päätösnopeus-napit (hidden input kautta)\n// ══════════════════════════════════════════════════════════════\nfunction _setNopeus(val, btn) {\n  document.getElementById('t2-nopeus').value = val;\n  document.querySelectorAll('[data-nopeus]').forEach(b => b.classList.remove('sel'));\n  btn.classList.add('sel');\n  _updateProg();\n}\n\n// ══════════════════════════════════════════════════════════════\n// PARANNUS 4: Täytä analyysitulos-osio tallennuksen yhteydessä\n// ══════════════════════════════════════════════════════════════\nfunction _naytaAnalyysi(level) {\n  const tier = 't' + level;\n\n  // Pisteet scores-objektista (A/D/Act/R = 1–3)\n  const pisteLabels = { 1: 'Kehitettävää (1p)', 2: 'Kehittyvä (2p)', 3: 'Hallitsee (3p)' };\n  const nopeusLabel = { nopea: 'Nopea (<1s)', normaali: 'Normaali (1–2s)', hidas: 'Hidas (>2s)' };\n\n  if (level === 2) {\n    const tilanne  = document.getElementById('t2-tilanne')?.value || '—';\n    const nopeus   = document.getElementById('t2-nopeus')?.value  || '';\n    const narr     = document.getElementById('t2-narr')?.value    || '';\n    const s        = scores.t2;\n\n    // Assess: tilanne + A-pisteet\n    const assessPiste = s.A ? pisteLabels[s.A] : '';\n    document.getElementById('t2-r-assess').innerHTML =\n      '<strong>' + tilanne + '<\u002Fstrong>' +\n      (assessPiste ? '<br><span style=\"color:rgba(242,239,230,.5);font-size:11px\">Assess: ' + assessPiste + '<\u002Fspan>' : '');\n\n    // Decide: D-pisteet + nopeus\n    const decidePiste = s.D ? pisteLabels[s.D] : '—';\n    document.getElementById('t2-r-decide').innerHTML =\n      '<strong>' + decidePiste + '<\u002Fstrong>' +\n      (nopeus ? '<br><span style=\"color:rgba(242,239,230,.5);font-size:11px\">' + (nopeusLabel[nopeus] || nopeus) + '<\u002Fspan>' : '');\n\n    // Act: Act-pisteet\n    const actPiste = s.Act ? pisteLabels[s.Act] : '—';\n    document.getElementById('t2-r-act').innerHTML = '<strong>' + actPiste + '<\u002Fstrong>';\n\n    document.getElementById('t2-r-narr').textContent = narr;\n  }\n\n  if (level === 3) {\n    const pelipaikka = document.getElementById('t3-pelipaikka')?.value?.split('—')[0]?.trim() || '—';\n    const tilanne    = document.getElementById('t3-tilanne')?.value  || '';\n    const reflektio  = document.getElementById('t3-reflektio')?.value || '—';\n    const narr       = document.getElementById('t3-narr')?.value     || '';\n    const s          = scores.t3;\n\n    // Assess: pelipaikka + tilanne + A-pisteet\n    const assessPiste = s.A ? pisteLabels[s.A] : '';\n    document.getElementById('t3-r-assess').innerHTML =\n      '<strong>' + pelipaikka + '<\u002Fstrong>' +\n      (tilanne ? ' · ' + tilanne : '') +\n      (assessPiste ? '<br><span style=\"color:rgba(242,239,230,.5);font-size:11px\">Assess: ' + assessPiste + '<\u002Fspan>' : '');\n\n    // Decide: D-pisteet + Act-pisteet\n    const decidePiste = s.D   ? pisteLabels[s.D]   : '—';\n    const actPiste    = s.Act ? pisteLabels[s.Act]  : '—';\n    document.getElementById('t3-r-decide').innerHTML =\n      '<strong>Decide: ' + decidePiste + '<\u002Fstrong>' +\n      '<br><span style=\"color:rgba(242,239,230,.5);font-size:11px\">Act: ' + actPiste + '<\u002Fspan>';\n\n    // Re-assess: R-pisteet + reflektio\n    const rPiste = s.R ? pisteLabels[s.R] : '—';\n    document.getElementById('t3-r-act').innerHTML =\n      '<strong>' + rPiste + '<\u002Fstrong>' +\n      (reflektio && reflektio !== '—' ? '<br><span style=\"color:rgba(242,239,230,.5);font-size:11px\">' + reflektio.slice(0,80) + (reflektio.length>80?'…':'') + '<\u002Fspan>' : '');\n\n    document.getElementById('t3-r-narr').textContent = narr;\n  }\n\n  const box = document.getElementById(tier + '-result');\n  if (box) {\n    box.classList.add('show');\n    setTimeout(() => box.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);\n  }\n}\n\n// ══════════════════════════════════════════════════════════════\n// PARANNUS 4: Kopioi analyysi leikepöydälle\n// ══════════════════════════════════════════════════════════════\nfunction _kopioiAnalyysi(tier) {\n  const level = parseInt(tier.replace('t',''));\n  const assess = document.getElementById(tier + '-r-assess')?.innerText || '';\n  const decide = document.getElementById(tier + '-r-decide')?.innerText || '';\n  const act    = document.getElementById(tier + '-r-act')?.innerText || '';\n  const narr   = document.getElementById(tier + '-r-narr')?.textContent || '';\n  const pvm    = new Date().toLocaleDateString('fi-FI');\n\n  const teksti = [\n    'ADAR-havainto · TalentMaster™',\n    'Päivämäärä: ' + pvm,\n    '',\n    'Assess → ' + assess,\n    'Decide → ' + decide,\n    'Act / Oppiminen → ' + act,\n    '',\n    'Narratiivi:',\n    narr,\n  ].join(String.fromCharCode(10));\n\n  if (navigator.clipboard) {\n    navigator.clipboard.writeText(teksti).then(() => {\n      _showToast('✓ Analyysi kopioitu leikepöydälle');\n    }).catch(() => _showToast('⚠ Kopioiminen epäonnistui'));\n  } else {\n    _showToast('⚠ Clipboard ei tuettu tässä selaimessa');\n  }\n}\n\n// ══════════════════════════════════════════════════════════════\n// PARANNUS 4: Uusi arviointi — piilottaa tulokset\n// ══════════════════════════════════════════════════════════════\nfunction _uusiArviointi(tier) {\n  const box = document.getElementById(tier + '-result');\n  if (box) box.classList.remove('show');\n  window.scrollTo({ top: 0, behavior: 'smooth' });\n}\n\n\n// ══════════════════════════════════════════════════════════════\n// PIKASYÖTTÖ — tila ja logiikka\n// Kolme vaihetta: pelaaja → ADAR → pisteet → tallenna luonnos\n// ══════════════════════════════════════════════════════════════\nconst _pikaState = {\n  pelaajaId:   null,\n  pelaajaNimi: null,\n  seuraId:     null,\n  adar:        null,  // 'A'|'D'|'Act'|'R'\n  piste:       null,  // 1|2|3\n};\n\n// Avaa/sulje pikasyöttö-overlay\nfunction _togglePika() {\n  const view = document.getElementById('pika-view');\n  const btn  = document.getElementById('pika-toggle-btn');\n  const isOpen = view.classList.contains('show');\n  if (isOpen) {\n    view.classList.remove('show');\n    btn.classList.remove('active');\n  } else {\n    // Nollaa tila\n    Object.assign(_pikaState, { pelaajaId:null, pelaajaNimi:null, adar:null, piste:null });\n    _pikaStep(1);\n    view.classList.add('show');\n    btn.classList.add('active');\n  }\n}\n\n// Vaihda askelta (1/2/3)\nfunction _pikaStep(step) {\n  [1,2,3].forEach(n => {\n    const el = document.getElementById('pika-step-' + n);\n    if (el) el.style.display = n === step ? 'block' : 'none';\n    const dot = document.getElementById('ps-dot-' + n);\n    if (dot) {\n      dot.classList.remove('active', 'done');\n      if (n < step) dot.classList.add('done');\n      else if (n === step) dot.classList.add('active');\n    }\n  });\n}\n\n// Pelaajan valinta\nfunction _pikaValitsePelaaja(id, nimi, seuraId, btn) {\n  _pikaState.pelaajaId   = id;\n  _pikaState.pelaajaNimi = nimi;\n  _pikaState.seuraId     = seuraId;\n\n  document.querySelectorAll('.pika-pelaaja-btn').forEach(b => b.classList.remove('sel'));\n  btn.classList.add('sel');\n\n  const jatkaBtn = document.getElementById('pika-btn-1');\n  if (jatkaBtn) jatkaBtn.disabled = false;\n}\n\n// ADAR-vaiheen valinta\nfunction _pikaAdar(adar, btn) {\n  _pikaState.adar = adar;\n  document.querySelectorAll('.pika-adar-btn').forEach(b => b.classList.remove('sel'));\n  btn.classList.add('sel');\n\n  // Päivitä piste-ohjeteksti vaiheen mukaan\n  const ohjeet = {\n    A:   'Assess — Tilanteen arviointi ja skannaus',\n    D:   'Decide — Päätöksenteon nopeus ja laatu',\n    Act: 'Act — Toteutus ja tekninen suoritus',\n    R:   'Re-assess — Tilanteiden uudelleenarviointi',\n  };\n  const ohjeEl = document.getElementById('pika-piste-ohje');\n  if (ohjeEl) ohjeEl.textContent = ohjeet[adar] || '';\n\n  const jatkaBtn = document.getElementById('pika-btn-2');\n  if (jatkaBtn) jatkaBtn.disabled = false;\n}\n\n// Pisteen valinta\nfunction _pikaPiste(piste, btn) {\n  _pikaState.piste = piste;\n  document.querySelectorAll('.pika-piste-btn').forEach(b => b.classList.remove('sel'));\n  btn.classList.add('sel');\n\n  const tallBtn = document.getElementById('pika-btn-3');\n  if (tallBtn) tallBtn.disabled = false;\n\n  // Näytä offline-varoitus jos ei verkkoyhteyttä\n  const offlineNote = document.getElementById('pika-offline-note');\n  if (offlineNote) {\n    offlineNote.classList.toggle('show', !navigator.onLine);\n  }\n}\n\n// ══════════════════════════════════════════════════════════════\n// OFFLINE-TUKI — IndexedDB-pohjainen jono\n// Tallentaa merkinnät paikallisesti kun verkko ei ole saatavilla\n// Synkronoi Firestoreen kun yhteys palaa\n// ══════════════════════════════════════════════════════════════\nlet _idb = null;\n\nfunction _initIDB() {\n  return new Promise((resolve, reject) => {\n    if (_idb) { resolve(_idb); return; }\n    const req = indexedDB.open('tm_offline_queue', 1);\n    req.onupgradeneeded = e => {\n      const db = e.target.result;\n      if (!db.objectStoreNames.contains('queue')) {\n        db.createObjectStore('queue', { keyPath: 'localId', autoIncrement: true });\n      }\n    };\n    req.onsuccess = e => { _idb = e.target.result; resolve(_idb); };\n    req.onerror   = e => reject(e.target.error);\n  });\n}\n\nasync function _idbLisaa(data) {\n  const db = await _initIDB();\n  return new Promise((resolve, reject) => {\n    const tx  = db.transaction('queue', 'readwrite');\n    const req = tx.objectStore('queue').add({ ...data, offlineTimestamp: Date.now() });\n    req.onsuccess = () => resolve(req.result);\n    req.onerror   = e => reject(e.target.error);\n  });\n}\n\nasync function _idbHaeKaikki() {\n  const db = await _initIDB();\n  return new Promise((resolve, reject) => {\n    const tx  = db.transaction('queue', 'readonly');\n    const req = tx.objectStore('queue').getAll();\n    req.onsuccess = () => resolve(req.result || []);\n    req.onerror   = e => reject(e.target.error);\n  });\n}\n\nasync function _idbPoista(localId) {\n  const db = await _initIDB();\n  return new Promise((resolve, reject) => {\n    const tx  = db.transaction('queue', 'readwrite');\n    const req = tx.objectStore('queue').delete(localId);\n    req.onsuccess = () => resolve();\n    req.onerror   = e => reject(e.target.error);\n  });\n}\n\n// Synkronoi offline-jono Firestoreen kun yhteys palaa\nasync function _synkronoiOfflineJono() {\n  const db   = window._tmDB;\n  const auth = window._tmAuth;\n  if (!db || !auth?.currentUser) return;\n\n  let merkinnät;\n  try { merkinnät = await _idbHaeKaikki(); } catch { return; }\n  if (!merkinnät.length) return;\n\n  console.log(`[Pika] Synkronoidaan ${merkinnät.length} offline-merkintää`);\n\n  for (const m of merkinnät) {\n    try {\n      await db\n        .collection('seurat').doc(m.seura_id)\n        .collection('pelaajat').doc(m.pelaaja_id)\n        .collection('havainnot')\n        .add({ ...m, synkronoitu: window.firebase.firestore.FieldValue.serverTimestamp() });\n      await _idbPoista(m.localId);\n    } catch (e) {\n      console.warn('[Pika] Synkronointi epäonnistui:', e.message);\n      break; // Yritetään uudelleen seuraavalla kerralla\n    }\n  }\n\n  // Päivitä offline-badge\n  _paivitaOfflineBadge();\n  _showToast('✓ Offline-merkinnät synkronoitu');\n}\n\nasync function _paivitaOfflineBadge() {\n  try {\n    const jono = await _idbHaeKaikki();\n    const badge = document.getElementById('offline-badge');\n    if (badge) badge.classList.toggle('show', jono.length > 0);\n  } catch { /* ei kriittinen */ }\n}\n\n// Verkkostatuksen kuuntelu\nwindow.addEventListener('online',  () => { _synkronoiOfflineJono(); });\nwindow.addEventListener('offline', () => { _paivitaOfflineBadge(); });\n\n// ══════════════════════════════════════════════════════════════\n// PIKATALLENNUS — tallentaa luonnoksen tai offline-jonoon\n// ══════════════════════════════════════════════════════════════\nasync function _pikaTallenna() {\n  const { pelaajaId, pelaajaNimi, seuraId, adar, piste } = _pikaState;\n  if (!pelaajaId || !adar || !piste) return;\n\n  const btn = document.getElementById('pika-btn-3');\n  if (btn) { btn.disabled = true; btn.textContent = '⏳ Tallennetaan...'; }\n\n  const auth = window._tmAuth;\n  const user = auth?.currentUser;\n\n  const havaintoData = {\n    tyyppi:           'adar_pikakirjaus',\n    adar_taso:        null,          // ei taso-valintaa pikasyötössä\n    tekija_uid:       user?.uid     || 'tuntematon',\n    tekija_nimi:      user?.displayName || user?.email || 'Valmentaja',\n    luotu:            new Date().toISOString(),\n    pelaaja_lukenut:  false,\n    tila:             'luonnos',     // TÄRKEÄ: luonnos, ei valmis\n    pelaaja_id:       pelaajaId,\n    seura_id:         seuraId || window._tmSeuraId || '',\n    pvm:              new Date().toISOString().split('T')[0],\n    pisteet:          { [adar]: piste },\n    narratiivi:       '',            // täytetään myöhemmin Pikakortissa\n    oppimisnakokohta: '',\n    nakyvyys:         'vp',          // luonnos näkyy vain VP:lle ensin\n    lahde:            'pikakirjaus',\n  };\n\n  const onlineNyt = navigator.onLine && window._tmDB;\n\n  if (onlineNyt && user) {\n    // Online-tallennus Firestoreen\n    try {\n      havaintoData.luotu = window.firebase.firestore.FieldValue.serverTimestamp();\n      const ref = await window._tmDB\n        .collection('seurat').doc(havaintoData.seura_id)\n        .collection('pelaajat').doc(pelaajaId)\n        .collection('havainnot')\n        .add(havaintoData);\n      console.log('[Pika] Tallennettu Firestoreen:', ref.id);\n      _showToast('✓ Pikakirjaus tallennettu — täydennä narratiivi myöhemmin');\n    } catch (e) {\n      console.error('[Pika] Firestore-virhe, tallennetaan offline:', e.message);\n      await _idbLisaa(havaintoData);\n      _showToast('📱 Tallennettu offline-jonoon');\n    }\n  } else {\n    // Offline-tallennus IndexedDB:hen\n    await _idbLisaa(havaintoData);\n    _showToast('📱 Tallennettu offline — synkronoidaan kun yhteys palaa');\n  }\n\n  await _paivitaOfflineBadge();\n\n  // Sulje overlay\n  setTimeout(() => {\n    _togglePika();\n    if (btn) { btn.disabled = false; btn.textContent = 'Tallenna luonnos'; }\n  }, 800);\n}\n\n// ══════════════════════════════════════════════════════════════\n// PELAAJIEN LATAUS PIKASYÖTTÖÖN\n// Kytketään olemassa olevan onAuthStateChanged-kuuntelijan\n// pelaajalistaan — kutsutaan kun snap on ladattu\n// ══════════════════════════════════════════════════════════════\nfunction _paivitaPikaPelaajat(snap, seuraId) {\n  const grid = document.getElementById('pika-pelaaja-grid');\n  if (!grid) return;\n\n  if (!snap || snap.empty) {\n    grid.innerHTML = '<div style=\"color:rgba(242,239,230,.3);font-size:12px;padding:12px;grid-column:1/-1;\">Ei pelaajia<\u002Fdiv>';\n    return;\n  }\n\n  grid.innerHTML = snap.docs.map(d => {\n    const p = d.data();\n    const nimi = ((p.etunimi || '') + ' ' + (p.sukunimi || '')).trim();\n    const joukkue = p.joukkue || p.joukkueNimi || '';\n    // Välitetään seuraId sulkeutumana onclick-funktioon\n    return `<button class=\"pika-pelaaja-btn\"\n      onclick=\"_pikaValitsePelaaja('${d.id}', '${nimi.replace(/'/g,\"\\\\'\")}', '${seuraId}', this)\">\n      ${nimi}\n      ${joukkue ? '<span class=\"pp-joukkue\">' + joukkue + '<\u002Fspan>' : ''}\n    <\u002Fbutton>`;\n  }).join('');\n}\n\n// Alustuksen yhteydessä käynnistetään offline-tarkistus\n_initIDB().then(() => _paivitaOfflineBadge()).catch(() => {});\n\n// ── MASTER-KONTEKSTI: Kun Pikakortti on iframe Master-näkymässä ──────────────\n(function _masterKonteksti() {\n  const params = new URLSearchParams(window.location.search);\n  const ctx = params.get('context');\n  if (ctx !== 'master') return;  // Ei iframe-tila — toimitaan normaalisti\n\n  // Piilota topbar ja progressipalkki (tilaa on vähemmän iframessa)\n  const topbar = document.querySelector('.topbar');\n  if (topbar) topbar.style.display = 'none';\n  const prog = document.querySelector('.prog-bar');\n  if (prog) prog.style.display = 'none';\n\n  // Piilota kirjautumisbanneri — Master on jo kirjautunut,\n  // onAuthStateChanged hoitaa Firebase-session jakamisen\n  const banner = document.getElementById('tm-login-banner');\n  if (banner) banner.style.display = 'none';\n\n  // Esivalitse pelaaja URL-parametrista kun pelaajalistat on ladattu.\n  // Tallennetaan parametri — _paivitaPikaPelaajat() kutsuu tätä kun snap on valmis.\n  const pelaajaIdParam = params.get('pelaajaId');\n  if (pelaajaIdParam) {\n    window._masterPelaajaId = pelaajaIdParam;\n    window._masterSeuraId   = params.get('seuraId') || '';\n  }\n})();\n\n\n// ══ TEEMAKYTKIN ══════════════════════════════════════════════════════════════\n// Tallentaa valinnan localStorage:een. Oletuksena vaalea kenttäkäyttöä varten.\n(function _initTeema() {\n  const tallennettu = localStorage.getItem('tm_teema') || 'light';\n  document.documentElement.setAttribute('data-theme', tallennettu);\n  _paivitaTeemaIcon(tallennettu);\n})();\n\nfunction _vaihdaTeema() {\n  const nykyinen = document.documentElement.getAttribute('data-theme') || 'light';\n  const uusi = nykyinen === 'light' ? 'dark' : 'light';\n  document.documentElement.setAttribute('data-theme', uusi);\n  localStorage.setItem('tm_teema', uusi);\n  _paivitaTeemaIcon(uusi);\n}\n\nfunction _paivitaTeemaIcon(teema) {\n  const btn = document.getElementById('theme-toggle-btn');\n  if (btn) btn.textContent = teema === 'light' ? '☾' : '☀';\n}\n\n// ══ toggleCb PÄIVITYS ════════════════════════════════════════════════════════\n// Tukee sekä vanhat .t1-cb-item-elementit että uudet .t1-cb-btn-napit.\n// Vanha: toggles .checked luokan + muuttaa .t1-cb-box väriä.\n// Uusi:  toggles .checked luokan napissa itsessään.\n\n\n// ══════════════════════════════════════════════════════════════════════════════\n// ADAR VISION — KUVA HAVAINTOON\n// Arkkitehtuuri (Vaihtoehto 1, integroitu):\n//   1. Valmentaja valitsee kuvan → esikatselu näkyy\n//   2. saveCard() lataa kuvan Firebase Storageen ennen Firestore-kirjoitusta\n//   3. storage_url tallennetaan Firestoreen media[]-taulukkoon\n//   4. Cloud Function (pyydettäessä) kutsuu GPT-4o Vision → ai_narratiivi\n//\n// Tulevaisuuspolku (muuttamatta tätä rakennetta):\n//   - media.tyyppi: 'kuva' → 'video'\n//   - media.segmentit[] lisätään ilman rakennemuutosta\n//   - ai_video_analyysi-kenttä tulee rinnalle, ei korvaa\n//\n// Periaate: Pikakortti on totuus. Kuva on todiste. AI on apuri. Ihminen vastaa.\n// ══════════════════════════════════════════════════════════════════════════════\n\n// Tallennetaan valitut kuvat per taso — { t1: File|null, t2: File|null, t3: File|null }\nwindow._kuvaFiles = { t1: null, t2: null, t3: null };\n\n// Kutsutaan kun valmentaja valitsee kuvan file-inputista\nfunction _kuvaValittu(tier, input) {\n  const file = input.files[0];\n  if (!file) return;\n\n  // Tiedostokokorajoitus: max 5 MB (Firebase Storage ilmainen kiintiö)\n  if (file.size > 5 * 1024 * 1024) {\n    _showToast('⚠ Kuva on liian iso — max 5 MB');\n    return;\n  }\n\n  window._kuvaFiles[tier] = file;\n\n  // Näytä esikatselu\n  const reader = new FileReader();\n  reader.onload = function(e) {\n    const img  = document.getElementById(tier + '-kuva-img');\n    const wrap = document.getElementById(tier + '-kuva-wrap');\n    const nappi = document.getElementById(tier + '-kuva-nappi');\n    if (img)   img.src = e.target.result;\n    if (wrap)  wrap.classList.add('nakyy');\n    if (nappi) nappi.style.display = 'none';\n  };\n  reader.readAsDataURL(file);\n}\n\n// Poistaa valitun kuvan\nfunction _kuvaPoista(tier) {\n  window._kuvaFiles[tier] = null;\n  const wrap  = document.getElementById(tier + '-kuva-wrap');\n  const nappi = document.getElementById(tier + '-kuva-nappi');\n  const input = document.getElementById(tier + '-kuva-input');\n  const aiNarr = document.getElementById(tier + '-ai-narr');\n  const aiLataa = document.getElementById(tier + '-ai-lataa');\n  if (wrap)   wrap.classList.remove('nakyy');\n  if (nappi)  nappi.style.display = '';\n  if (input)  input.value = '';\n  if (aiNarr) aiNarr.classList.remove('nakyy');\n  if (aiLataa) aiLataa.classList.remove('nakyy');\n}\n\n// Lataa kuvan Firebase Storageen — kutsutaan saveCard():sta tallennuksen yhteydessä.\n// Palauttaa { storage_url, download_url } tai null jos ei kuvaa.\nasync function _lataaKuvaStorageen(tier, havaintoId, seuraId) {\n  const file = window._kuvaFiles[tier];\n  if (!file) return null;\n\n  // Firebase Storage — alustetaan turvallisesti try/catchilla\n  // Syy: firebase.app().storage() heittää virheen jos Storage SDK ei ole ladattu,\n  // ja optional chaining ei pyydystä kaikkia virhetapauksia\n  let storage;\n  try {\n    storage = firebase.app().storage();\n    if (!storage) throw new Error('storage() palautti null');\n  } catch(storageErr) {\n    console.warn('[ADAR Vision] Firebase Storage ei ole käytettävissä:', storageErr.message);\n    console.warn('[ADAR Vision] Tarkista että firebase-storage-compat.js on ladattu');\n    return null;\n  }\n\n  // Polku: seurat/{seuraId}/havainnot/{havaintoId}/media_0.jpg\n  // Sama hierarkia kuin Firestore — oikeudet johdonmukaiset\n  const ext  = file.type.includes('png') ? 'png' : 'jpg';\n  const polku = 'seurat/' + seuraId + '/havainnot/' + havaintoId + '/media_0.' + ext;\n  const ref   = storage.ref(polku);\n\n  try {\n    const snapshot = await ref.put(file, {\n      contentType: file.type,\n      customMetadata: {\n        tier:    tier,\n        lahde:   'adar_pikakortti',\n        version: '1'\n      }\n    });\n    const download_url = await snapshot.ref.getDownloadURL();\n    return {\n      tyyppi:       'kuva',\n      storage_url:  'gs://' + snapshot.ref.bucket + '/' + polku,\n      download_url: download_url,\n      // HUOM: serverTimestamp() ei toimi taulukon sisällä (Firebase-rajoitus).\n      // Käytetään ISO-string aikaleimaa media[]-taulukon sisällä.\n      // Dokumentin ylätason 'luotu'-kenttä käyttää serverTimestamp():ä normaalisti.\n      otettu:       new Date().toISOString(),\n      // Tulevaisuudessa lisätään: kesto_ms, segmentit[] videon yhteydessä\n    };\n  } catch(e) {\n    console.error('[ADAR Vision] Storage-lataus epäonnistui:', e.message);\n    // Ei keskeytä tallennusta — kuva vain jää pois\n    _showToast('⚠ Kuvan lataus epäonnistui — havainto tallennettu ilman kuvaa');\n    return null;\n  }\n}\n\n// Pyytää AI-narratiivin Cloud Functionilta kuvan ja kenttien perusteella.\n// Tätä kutsutaan tallennuksen JÄLKEEN — ei estä tallennusta.\n// Narratiivi tallennetaan erillisellä .update()-kutsulla.\nasync function _pyydaAINarratiivi(tier, havaintoId, seuraId, pelaajaId, havaintoData) {\n  const file = window._kuvaFiles[tier];\n  if (!file) return; // Ei kuvaa — ei AI-narratiivia\n\n  // Näytä latausindikattori\n  const aiLataa = document.getElementById(tier + '-ai-lataa');\n  if (aiLataa) aiLataa.classList.add('nakyy');\n\n  try {\n    // Lue kuva base64:ksi AI-pyyntöä varten\n    const base64 = await new Promise(function(resolve, reject) {\n      const reader = new FileReader();\n      reader.onload  = function(e) { resolve(e.target.result.split(',')[1]); };\n      reader.onerror = reject;\n      reader.readAsDataURL(file);\n    });\n\n    // Rakennetaan konteksti AI:lle valmentajan täyttämistä kentistä\n    const konteksti = [\n      havaintoData.pelipaikka ? 'Pelipaikka: ' + havaintoData.pelipaikka : '',\n      havaintoData.tilanne    ? 'Tilanne: '    + havaintoData.tilanne    : '',\n      havaintoData.narratiivi ? 'Valmentajan muistiinpano: ' + havaintoData.narratiivi : '',\n      tier === 't1' ? 'Taso: U8-U12 (Havainnoija — arvioidaan vain Assess)' :\n      tier === 't2' ? 'Taso: U13-U15 (Arvioija — Assess, Decide, Act)' :\n                     'Taso: U16-U19 (Täysi ADAR)'\n    ].filter(Boolean).join('\\n');\n\n    // Kutsutaan aiProxy Cloud Functionia (jo olemassa)\n    const auth  = window._tmAuth;\n    const token = auth?.currentUser ? await auth.currentUser.getIdToken() : null;\n\n    const vastaus = await fetch(\n      'https://europe-west1-talentmaster-pilot.cloudfunctions.net/aiProxy',\n      {\n        method: 'POST',\n        headers: {\n          'Content-Type': 'application/json',\n          ...(token ? { 'Authorization': 'Bearer ' + token } : {})\n        },\n        body: JSON.stringify({\n          tyyppi:  'adar_vision_narratiivi',\n          kuva:    { base64: base64, mime: file.type },\n          konteksti: konteksti,\n          // AI:n ohje: analysoi kuva, kirjoita narratiivi valmentajan äänellä\n          // ÄLÄ anna pisteitä — kirjoita havainto, ei arvosana\n          ohje: 'Olet jalkapallovalmentajan apuri. Analysoi kuva ja valmentajan muistiinpanot. ' +\n                'Kirjoita lyhyt (2-3 lausetta) havaintonarratiiivi suomeksi valmentajan äänellä. ' +\n                'Älä anna numeroarvosanoja. Keskity siihen mitä pelaaja tekee ja miksi se on merkityksellistä kehitykselle. ' +\n                'Jos kuvasta ei voi tehdä ADAR-arviota, kirjoita se rehellisesti.'\n        })\n      }\n    );\n\n    if (vastaus.ok) {\n      const data = await vastaus.json();\n      const narratiivi = data.narratiivi || data.content || '';\n\n      if (narratiivi) {\n        // Tallenna narratiivi Firestoreen (erillinen update)\n        const db = window._tmDB;\n        if (db && seuraId && pelaajaId && havaintoId) {\n          await db\n            .collection('seurat').doc(seuraId)\n            .collection('pelaajat').doc(pelaajaId)\n            .collection('havainnot').doc(havaintoId)\n            .update({\n              ai_narratiivi:  narratiivi,\n              ai_malli:       'gpt-4o-vision',\n              ai_analysoitu:  window.firebase.firestore.FieldValue.serverTimestamp(),\n              // Luottamustaso asetetaan matalaksi oletuksena — ihminen arvioi\n              ai_luottamus:   'matala'\n            });\n        }\n\n        // Näytä narratiivi UI:ssa\n        const narrEl  = document.getElementById(tier + '-ai-narr');\n        const tekstiEl = document.getElementById(tier + '-ai-narr-teksti');\n        if (narrEl && tekstiEl) {\n          tekstiEl.textContent = narratiivi;\n          narrEl.classList.add('nakyy');\n        }\n      }\n    }\n  } catch(e) {\n    console.warn('[ADAR Vision] AI-narratiivi epäonnistui:', e.message);\n    // Ei häiritä valmentajaa — AI-narratiivi on valinnainen lisä\n  } finally {\n    // Piilota latausindikattori aina\n    if (aiLataa) aiLataa.classList.remove('nakyy');\n    // Nollaa kuva tallennuksen jälkeen\n    window._kuvaFiles[tier] = null;\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
