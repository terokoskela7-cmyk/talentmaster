<!DOCTYPE html>
<html lang="fi"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>TalentMaster™ — Pelihavainto</title>
<!-- Brandifontit (CLAUDE.md §5). CSP sallii fonts.googleapis.com (style-src) + fonts.gstatic.com (font-src). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@300;400;500&display=swap">

<style>
/* ══ TOKENIT — ainoa paikka jossa hex-arvoja on (B6-vartija) ══════════════════
   Kenttätyökalu avataan ulkona: vaalea on oletus, tumma valittavissa. Molemmat teemat
   määritellään tässä, eikä muualla CSS:ssä saa olla hex-arvoja. */
:root{
  --font-serif:'Cormorant Garamond',Georgia,serif;
  --font-sans:'DM Sans',system-ui,-apple-system,sans-serif;
  --font-mono:'DM Mono',ui-monospace,Menlo,monospace;
  /* VAALEA (bone) — oletus kenttäkäytössä */
  --bg:#F2EFE6; --surface:#FBFAF6; --surface2:#EDEAE0;
  --ink:#1C1C1A; --ink2:#3E3C37; --ink3:#6F6C63;
  --border:rgba(28,28,26,.16); --border2:rgba(28,28,26,.08);
  --acc:#1A7A5E; --acc-dim:rgba(26,122,94,.10); --acc-brd:rgba(26,122,94,.38); --acc-ink:#FBFAF6;
  --amber:#9A6A1C; --amber-dim:rgba(224,160,64,.16); --amber-brd:rgba(224,160,64,.45);
  --red:#A5483A; --red-dim:rgba(208,106,90,.12); --red-brd:rgba(208,106,90,.38);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111110; --surface:#1A1A18; --surface2:#23231F;
    --ink:#F2EFE6; --ink2:#C9C6BC; --ink3:#8F8C83;
    --border:rgba(242,239,230,.14); --border2:rgba(242,239,230,.07);
    --acc:#28B090; --acc-dim:rgba(40,176,144,.10); --acc-brd:rgba(40,176,144,.34); --acc-ink:#111110;
    --amber:#E0A040; --amber-dim:rgba(224,160,64,.10); --amber-brd:rgba(224,160,64,.32);
    --red:#D06A5A; --red-dim:rgba(208,106,90,.10); --red-brd:rgba(208,106,90,.32);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111110; --surface:#1A1A18; --surface2:#23231F;
  --ink:#F2EFE6; --ink2:#C9C6BC; --ink3:#8F8C83;
  --border:rgba(242,239,230,.14); --border2:rgba(242,239,230,.07);
  --acc:#28B090; --acc-dim:rgba(40,176,144,.10); --acc-brd:rgba(40,176,144,.34); --acc-ink:#111110;
  --amber:#E0A040; --amber-dim:rgba(224,160,64,.10); --amber-brd:rgba(224,160,64,.32);
  --red:#D06A5A; --red-dim:rgba(208,106,90,.10); --red-brd:rgba(208,106,90,.32);
}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:14px;line-height:1.5;margin:0;-webkit-text-size-adjust:100%}

/* ══ RUNKO — yksi sarake, puhelin ensin ══════════════════════════════════════ */
.app{max-width:460px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--bg)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;border-bottom:.5px solid var(--border)}
.tb-logo{font-family:var(--font-serif);font-size:17px;letter-spacing:.01em}
.tb-tools{display:flex;gap:6px;align-items:center}
.ikoni{width:32px;height:32px;border:.5px solid var(--border);background:transparent;color:var(--ink2);border-radius:2px;cursor:pointer;font-size:14px;font-family:var(--font-sans)}

.ph-bar{display:flex;align-items:center;gap:10px;padding:14px 16px 12px;border-bottom:.5px solid var(--border)}
.ph-linkki{background:none;border:0;padding:0;color:var(--teal);font-size:12px;cursor:pointer;text-decoration:underline}
.ph-back{width:30px;height:30px;border:.5px solid var(--border);background:transparent;color:var(--ink2);border-radius:2px;cursor:pointer;font-size:14px;flex:none}
.ph-title{flex:1;min-width:0}
.ph-name{font-family:var(--font-serif);font-size:22px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph-meta{font-family:var(--font-mono);font-size:10.5px;color:var(--ink3);letter-spacing:.04em}
.ph-body{flex:1;overflow:auto;padding:14px 16px 20px;display:flex;flex-direction:column;gap:16px}
.eyebrow{font-size:10px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--acc)}
.offl-merkki{color:var(--amber)}

.seg{display:flex;border:.5px solid var(--border);border-radius:2px}
.seg button{flex:1;font-family:var(--font-sans);font-size:12px;padding:9px 6px;background:transparent;border:0;color:var(--ink2);cursor:pointer}
.seg button+button{border-left:.5px solid var(--border)}
.seg button[aria-pressed="true"]{background:var(--acc-dim);color:var(--acc);font-weight:600}
.lbl{font-size:9.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lbl button.link{font-size:10px;letter-spacing:.04em;text-transform:none;font-weight:500;color:var(--acc);background:none;border:0;cursor:pointer;padding:0;font-family:var(--font-sans)}
.lbl .vapaa{text-transform:none;letter-spacing:0;font-weight:400}

.dim{border-top:.5px solid var(--border);padding-top:12px}
.dim-h{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}
.dim-n{font-family:var(--font-serif);font-size:20px;line-height:1.1}
.dim-k{font-family:var(--font-mono);font-size:10px;color:var(--ink3);letter-spacing:.08em}
.dim-q{font-family:var(--font-serif);font-style:italic;font-size:14.5px;color:var(--ink2);margin-bottom:9px}
.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sc{min-height:56px;border:.5px solid var(--border);background:var(--surface);border-radius:2px;cursor:pointer;color:var(--ink2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:6px 4px;font-family:var(--font-sans)}
.sc b{font-family:var(--font-serif);font-weight:400;font-size:24px;line-height:1;color:var(--ink)}
.sc span{font-size:10.5px;letter-spacing:.02em}
.sc[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-dim);color:var(--acc)}
.sc[aria-pressed="true"] b{color:var(--acc)}
.sc.s1[aria-pressed="true"]{border-color:var(--amber-brd);background:var(--amber-dim);color:var(--amber)}
.sc.s1[aria-pressed="true"] b{color:var(--amber)}
.desc{font-size:12.5px;color:var(--ink2);margin-top:8px;padding:8px 10px;background:var(--surface2);border-left:2px solid var(--acc);border-radius:0 2px 2px 0}
.desc .tip{display:block;margin-top:4px;color:var(--ink3);font-size:11.5px}
.desc .tip b{color:var(--acc);font-weight:600}
.more{margin-top:8px;font-size:11.5px;color:var(--acc);background:none;border:0;padding:4px 0;cursor:pointer;font-family:var(--font-sans)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-family:var(--font-sans);font-size:11.5px;padding:6px 10px;border:.5px solid var(--border);background:transparent;color:var(--ink2);border-radius:2px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--acc-brd);background:var(--acc-dim);color:var(--acc)}
.chip.warn[aria-pressed="true"]{border-color:var(--amber-brd);background:var(--amber-dim);color:var(--amber)}

.ladder{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:4px}
.rung{font-size:10px;color:var(--ink3);display:flex;flex-direction:column;gap:4px;letter-spacing:.02em}
.rung i{display:block;height:3px;background:var(--border)}
.rung.on i{background:var(--acc)}
.rung.cur{color:var(--acc);font-weight:600}
.uusi{font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;padding:2px 6px;border:.5px solid var(--acc-brd);background:var(--acc-dim);color:var(--acc);margin-left:auto}
.suggest{margin-top:10px;padding:10px 12px;border:.5px solid var(--acc-brd);background:var(--acc-dim);border-radius:2px;font-size:12.5px;color:var(--ink2);display:flex;flex-direction:column;gap:8px}
.suggest b{color:var(--ink)}
.sg-b{display:flex;gap:6px}
.btn{font-family:var(--font-sans);font-size:12px;font-weight:500;padding:8px 12px;border-radius:2px;border:.5px solid var(--border);background:transparent;color:var(--ink2);cursor:pointer}
.btn[aria-pressed="true"]{border-color:var(--acc-brd);background:var(--acc-dim);color:var(--acc)}
.banner{padding:10px 12px;border:.5px solid var(--amber-brd);background:var(--amber-dim);font-size:12.5px;color:var(--ink2);border-radius:2px}
.banner b{color:var(--ink)}
.ohje{font-size:11.5px;color:var(--ink3);margin:0}
.ohje.varo{color:var(--amber)}

.note{border-top:.5px solid var(--border);padding-top:12px}
.note textarea{width:100%;min-height:74px;resize:vertical;font-family:var(--font-sans);font-size:13px;color:var(--ink);background:var(--surface);border:.5px solid var(--border);border-radius:2px;padding:9px 10px}
.vis{display:flex;align-items:center;gap:10px;margin-top:9px}
.sw{position:relative;width:40px;height:22px;border-radius:11px;border:.5px solid var(--border);background:var(--surface2);cursor:pointer;flex:none;padding:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--ink3);transition:transform .15s}
.sw[aria-checked="true"]{background:var(--acc-dim);border-color:var(--acc-brd)}
.sw[aria-checked="true"]::after{transform:translateX(18px);background:var(--acc)}
.vis-t{font-size:12.5px;color:var(--ink2)}
.vis-t b{color:var(--ink);font-weight:600}
.vis-h{font-size:11px;color:var(--ink3);margin-top:4px}

.foot{border-top:.5px solid var(--border);padding:10px 16px 14px;background:var(--bg);position:sticky;bottom:0}
.sum{font-family:var(--font-mono);font-size:10.5px;color:var(--ink3);margin-bottom:8px;min-height:15px;letter-spacing:.02em}
.save{width:100%;padding:14px;border-radius:2px;border:0;background:var(--acc);color:var(--acc-ink);font-family:var(--font-sans);font-size:14px;font-weight:600;cursor:pointer}
.save:disabled{background:var(--surface2);color:var(--ink3);cursor:default}

.search{width:100%;font-family:var(--font-sans);font-size:13px;padding:10px;border:.5px solid var(--border);background:var(--surface);color:var(--ink);border-radius:2px}
.plist{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pl{text-align:left;padding:11px 10px;border:.5px solid var(--border);background:var(--surface);border-radius:2px;cursor:pointer;color:var(--ink);font-family:var(--font-sans)}
.pl .n{font-size:13.5px;display:block}
.pl .m{font-family:var(--font-mono);font-size:10px;color:var(--ink3)}
.pl .done{color:var(--acc)}

.ok{padding:22px 4px 6px;text-align:left}
.ok .big{font-family:var(--font-serif);font-size:30px;line-height:1.1;margin:6px 0}
.vis-b{display:inline-block;font-size:9.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;padding:4px 9px;border:.5px solid var(--acc-brd);background:var(--acc-dim);color:var(--acc)}
.vis-b.pr{border-color:var(--border);background:var(--surface2);color:var(--ink2)}
.undo{font-size:12px;color:var(--ink3);margin-top:12px}
.undo button{color:var(--acc);background:none;border:0;cursor:pointer;font-family:var(--font-sans);font-size:12px;padding:0}
.ok-teksti{color:var(--ink2);font-size:13px}
.ok-porras{color:var(--acc);font-size:12.5px}

.sheet{position:fixed;inset:auto 0 0 0;max-width:460px;margin:0 auto;background:var(--bg);border-top:.5px solid var(--border);padding:14px 16px 18px;z-index:120;box-shadow:0 -12px 30px rgba(0,0,0,.18)}
.sheet .opt{display:block;width:100%;text-align:left;padding:12px 10px;border:.5px solid var(--border);background:var(--surface);color:var(--ink);border-radius:2px;margin-top:6px;cursor:pointer;font-family:var(--font-sans)}
.sheet .opt small{display:block;color:var(--ink3);font-size:11px}
.sheet .opt[aria-pressed="true"]{border-color:var(--acc-brd);background:var(--acc-dim)}

#tm-toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:9600;background:var(--surface);color:var(--ink);border:.5px solid var(--border);border-radius:2px;padding:10px 16px;font-size:13px;max-width:90vw;text-align:center;display:none}

/* Kirjautumisbanneri — peittää näkymän vasta kun tila on ASETTUNUT (armonaika). */
#tm-login-banner{display:none;align-items:center;justify-content:center;position:fixed;inset:0;z-index:9000;background:var(--bg);flex-direction:column;gap:16px;padding:32px;text-align:center}
#tm-login-banner .lb-t{font-family:var(--font-serif);font-size:22px}
#tm-login-banner .lb-s{font-size:13px;color:var(--ink2);max-width:320px;line-height:1.6}
#tm-login-banner .lb-f{display:flex;flex-direction:column;gap:10px;width:100%;max-width:280px;margin-top:8px}
#tm-login-banner input{background:var(--surface);border:.5px solid var(--border);border-radius:2px;padding:12px 14px;color:var(--ink);font-size:14px;font-family:var(--font-sans)}
#tm-login-err{font-size:12px;color:var(--red);min-height:16px}

.sa-modal{position:fixed;inset:0;z-index:9500;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
.sa-modal .kortti{background:var(--surface);border:.5px solid var(--border);border-radius:3px;padding:28px;width:100%;max-width:320px;text-align:center}
.sa-modal h2{font-family:var(--font-serif);font-weight:400;font-size:20px;margin:0 0 6px}
.sa-modal p{font-size:12px;color:var(--ink3);margin:0 0 18px}
.sa-modal select{width:100%;background:var(--surface2);border:.5px solid var(--border);border-radius:2px;padding:10px;font-size:14px;color:var(--ink);margin-bottom:14px;font-family:var(--font-sans)}

button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.sw::after{transition:none}}
/* Yksi mobiililohko per tiedosto (§6) — ÄLÄ lisää toista. */
@media (max-width:768px){
  .app{max-width:none}
  .sheet{max-width:none}
}
</style>

</head>
<body>

<!-- Kirjautumisbanneri. Näkyviin vasta kun auth-tila on ASETTUNUT (_adarNaytaBanneri). -->
<div id="tm-login-banner">
  <div class="lb-t">TalentMaster™</div>
  <div class="lb-s"><span data-i18n="Kirjaudu sisään tallentaaksesi havaintoja.">Kirjaudu sisään tallentaaksesi havaintoja.</span><br><span data-i18n="Lomaketta voi täyttää ilman kirjautumista.">Lomaketta voi täyttää ilman kirjautumista.</span></div>
  <div class="lb-f">
    <input id="tm-login-email" type="email" placeholder="Sähköposti" data-i18n-ph="Sähköposti" autocomplete="username">
    <input id="tm-login-pass" type="password" placeholder="Salasana" data-i18n-ph="Salasana" autocomplete="current-password">
    <button class="save" onclick="_tmKirjaudu()" data-i18n="Kirjaudu sisään">Kirjaudu sisään</button>
  </div>
  <div id="tm-login-err"></div>
</div>

<div class="app">
  <!-- Upotettuna (embedded=1) tämä piilotetaan: Masterin modaalilla on oma otsikkonsa. -->
  <div class="topbar" id="tm-topbar">
    <div class="tb-logo">TalentMaster™</div>
    <div class="tb-tools">
      <button class="ikoni" id="theme-toggle-btn" onclick="_vaihdaTeema()" title="Vaihda teema" data-i18n-title="Vaihda teema">☀</button>
    </div>
  </div>
  <!-- Koko sovellus renderöidään tähän (_phRender). -->
  <div id="ph-app" aria-live="polite"></div>
</div>

<div id="tm-toast"></div>

/* §15 offline-ensin: SW precachettaa appin shellin + SDK:t + fontit. Versioidut cachet +
   skipWaiting/clients.claim -> uusi deploy syrjayttaa vanhan valittomasti. */
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw_adar.js?v=1').then(function (reg) {
      reg.addEventListener('updatefound', function () {
        var uusi = reg.installing;
        if (uusi) uusi.addEventListener('statechange', function () {
          if (uusi.state === 'activated') console.log('[ADAR] SW paivitetty');
        });
      });
    }).catch(function (e) { console.warn('[ADAR] SW-rekisterointi epaonnistui:', e && e.message); });
  });
}
</script>

  _PH_DB   = firebase.firestore();

     toisessa valilehdessa (failed-precondition) -> appi jatkaa online-tilassa. */
  try {
    firebase.firestore().enablePersistence({ synchronizeTabs: true }).catch(function (e) {
      console.warn('[ADAR] offline-persistenssi ei kaytossa:', e && e.code);
    });
  } catch (e) { console.warn('[ADAR] offline-persistenssi heitti:', e && e.message); }
})();

// ══════════════════════════════════════════════════════════════════════════════
// PELAAJAPOIMINTA — ROOLIPEILI + HAKU
//
// JUURISYY: poimin näytti KAIKKI seuran pelaajat, mutta create-sääntö sallii
// pelkälle valmentajalle vain OMAN JOUKKUEEN pelaajat. Väärän joukkueen pelaaja
// → permission-denied → raaka "Tallennusvirhe". UI lupasi enemmän kuin sääntö sallii.
//
// PEILI tm_admin/firestore.rules `onOmanJoukkueenValmentaja`:
//   onOmanSeuranValmentaja(sid) && ( onJohtoRooli() || 'talenttivalmentaja'
//                                    || pelaaja.joukkueet ∩ valmentaja.joukkueet )
// HUOM LEIKKAUS: `onOmanSeuranValmentaja` vaatii `onValmentajaRooli()`, joka EI
// sisällä seurasihteeriä — vaikka `onJohtoRooli()` sisältää. Siksi seurasihteeri
// ei pääse tähän lainkaan, ja joukkuerajauksen ohittavat ovat:
//   super_admin · vp · urheilutoimenjohtaja · talenttivalmentaja
// Tämä joukko on LUKITTU vartijalla (tests/adar_pelaajapoiminta.test.js), joka
// johtaa sen säännöistä — client ja rules eivät voi ajautua erilleen hiljaa.
// ══════════════════════════════════════════════════════════════════════════════
const ADAR_JOUKKUERAJAUS_OHITTAVAT = ['super_admin', 'superadmin', 'vp', 'urheilutoimenjohtaja', 'talenttivalmentaja'];

/** true = näkee koko seuran pelaajat; false = vain oma joukkue. */
function _adarNakeeKaikki(rooli) {
  var r = rooli || window._tmRooli || null;
  return ADAR_JOUKKUERAJAUS_OHITTAVAT.indexOf(r) >= 0;
}

/** Valmentajan omat joukkueet (ID-lista) + näyttönimi. */
window._omatJoukkueet = null;
window._tmKayttajaNimi = null;
async function _adarLataaOmatJoukkueet(seuraId, uid) {
  var nakeeKaikki = _adarNakeeKaikki();
  /* Joukkuerajausta ohittava rooli ei tarvitse joukkuelistaa — mutta dokumentti luetaan silti,
     koska siitä saadaan NÄYTTÖNIMI havaintoon (ks. _adarTekijaNimi). SA:lla ei ole tätä
     dokumenttia (§3) → lukuyritys ei löydä mitään, ja nimi jää oletukseen. */
  if (nakeeKaikki) window._omatJoukkueet = null;
  try {
    if (!_PH_DB || !seuraId || !uid) { if (!nakeeKaikki) window._omatJoukkueet = []; return; }
    var d = await _PH_DB.collection('seurat').doc(seuraId).collection('kayttajat').doc(uid).get();
    var data = d && d.exists ? d.data() : {};
    if (!nakeeKaikki) window._omatJoukkueet = Array.isArray(data.joukkueet) ? data.joukkueet : [];
    var nimi = ((data.etunimi || '') + ' ' + (data.sukunimi || '')).trim();
    window._tmKayttajaNimi = nimi || null;
    /* Dokumentin rooli EI ohjaa oikeuspäättelyä (se tulee claimista) — se talletetaan vain,
       jotta virheilmoitus osaa kertoa, jos lähteet ovat ristiriidassa. */
    window._tmDokRooli = data.rooli || null;
  } catch (e) {
    /* FAIL-CLOSED kuten sääntö: lukuvirhe → ei oleteta pääsyä. */
    if (!nakeeKaikki) window._omatJoukkueet = [];
  }
}

/* Havainnon tekijän nimi. LAPSI NÄKEE TÄMÄN kortissaan, joten sähköposti ei kelpaa:
   Topiaksen appissa luki "talentmasterid@gmail.com". Järjestys on
   displayName → kayttajat/{uid} etunimi+sukunimi → 'Valmentaja'. Sähköpostia ei käytetä
   missään haarassa, ei edes viimeisenä oljenkortena. */
function _adarTekijaNimi(user) {
  /* `displayName` voi itsekin olla sähköposti (osa tunnuksista on luotu niin), joten
     @-merkin sisältävä arvo hylätään — muuten invariantti olisi vain aikomus. */
  var kelpaa = function (v) {
    var s = (v == null) ? '' : String(v).trim();
    return (s && s.indexOf('@') < 0) ? s : '';
  };
  return kelpaa(user && user.displayName)
      || kelpaa(window._tmKayttajaNimi)
      || 'Valmentaja';
}

/** Miksi kirjoitus estyi? Palauttaa käyttäjälle näytettävän syyn. */
function _adarEstonSyy() {
  if (!_adarNakeeKaikki() && !(window._omatJoukkueet || []).length) {
    return tmHT('Käyttäjätunnuksesi joukkuetieto puuttuu — ota yhteys seuran pääkäyttäjään');
  }
  return tmHT('Voit havainnoida vain oman joukkueesi pelaajia');
}
window._adarEstonSyy = _adarEstonSyy;

/** Saako kirjautunut havainnoida tätä pelaajaa? Sama logiikka kuin sääntö. */
function _adarSaaHavainnoida(pelaajaId) {
  if (_adarNakeeKaikki()) return true;
  var p = (window._pelaajaMap || {})[pelaajaId];
  var omat = window._omatJoukkueet || [];
  if (!p || !omat.length) return false;                      // fail-closed
  var pj = p.joukkueet || [];
  for (var i = 0; i < pj.length; i++) { if (omat.indexOf(pj[i]) >= 0) return true; }
  return false;
}

/** Näkyvät pelaajat: roolisuodatus + vapaa nimihaku. AINOA lista-lähde (yksi poimin). */
function _adarNakyvatPelaajat(haku) {
  var map = window._pelaajaMap || {};
  var hk = (haku || '').trim().toLowerCase();
  return Object.keys(map)
    .filter(function (id) { return _adarSaaHavainnoida(id); })
    .filter(function (id) {
      if (!hk) return true;
      var p = map[id];
      return ((p.nimi || '') + ' ' + (p.joukkue || '')).toLowerCase().indexOf(hk) >= 0;
    })
    .sort(function (a, b) { return (map[a].nimi || '').localeCompare(map[b].nimi || '', 'fi'); });
}

/* Ohjeteksti kun rajattu rooli on ilman omaa joukkuetta — ei hiljaista tyhjää. */
function _adarPoiminOhje() {
  if (!_adarNakeeKaikki() && !(window._omatJoukkueet || []).length) {
    return tmHT('Sinulla ei ole omaa joukkuetta merkittynä — ota yhteys valmennuspäällikköön.');
  }
  return '';
}

// ══════════════════════════════════════════════════════════════════
// AUTH — persistenssi, bannerin armonaika, seura ja pelaajat
// ══════════════════════════════════════════════════════════════════
/* Eksplisiittinen LOCAL-persistenssi ENNEN kuuntelijaa (sama kuin Seura/Admin).
   Ilman tätä istunto nojaa oletukseen, joka in-app-selaimessa / partitioidussa
   storagessa ei aina palaudu → käyttäjä jää login-bannerille kesken kenttätyön. */
try { _PH_AUTH.setPersistence(window.firebase.auth.Auth.Persistence.LOCAL); } catch (e) { /* ei tuettu → oletus */ }

/* BANNERIN ARMONAIKA: `onAuthStateChanged` laukeaa sivunlatauksessa ENSIN
   null:lla, ennen kuin persistoitu istunto on palautettu. Bannerin slammaaminen
   heti näyttää uloskirjautumiselta. Näytetään banneri vasta kun null on ASETTUNUT. */
window._adarAuthArmo = null;
function _adarNaytaBanneri(nayta) {
  const b = document.getElementById('tm-login-banner');
  if (!b) return;
  if (window._adarAuthArmo) { clearTimeout(window._adarAuthArmo); window._adarAuthArmo = null; }
  if (!nayta) { b.style.display = 'none'; return; }
  window._adarAuthArmo = setTimeout(function () {
    /* Vielä kirjautumaton armonajan jälkeen → aito kirjautumaton tila. */
    if (!(_PH_AUTH && _PH_AUTH.currentUser)) b.style.display = 'flex';
    window._adarAuthArmo = null;
  }, 1500);
}

async function _tmKirjaudu() {
  const em = document.getElementById('tm-login-email');
  const pw = document.getElementById('tm-login-pass');
  const err = document.getElementById('tm-login-err');
  if (err) err.textContent = '';
  try {
    await _PH_AUTH.signInWithEmailAndPassword((em && em.value) || '', (pw && pw.value) || '');
  } catch (e) {
    if (err) err.textContent = tmHT('Kirjautuminen ei onnistunut — tarkista tunnus ja salasana.');
  }
}
window._tmKirjaudu = _tmKirjaudu;

function _showToast(msg) {
  let t = document.getElementById('tm-toast');
  if (!t) return;
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(window._tmToastAjastin);
  window._tmToastAjastin = setTimeout(function () { t.style.display = 'none'; }, 3200);
}
window._showToast = _showToast;

// ── SUPER ADMIN: seuranvalitsin (SA:lla ei ole seuraId-claimia, §3) ──────────
async function _naytaSuperAdminSeuraValitsin() {
  let seurat = [];
  try {
    const snap = await _PH_DB.collection('seurat').orderBy('nimi').get();
    seurat = snap.docs.map(d => ({ id: d.id, nimi: d.data().nimi || d.id }));
  } catch (e) { console.error('[ADAR] Seurat:', e); }

  let modal = document.getElementById('tm-seura-modal');
  if (!modal) {
    modal = document.createElement('div');
    modal.id = 'tm-seura-modal';
    modal.className = 'sa-modal';
    document.body.appendChild(modal);
  }
  const opts = seurat.map(s => '<option value="' + s.id + '">' + _phEsc(s.nimi) + '</option>').join('');
  modal.innerHTML =
    '<div class="kortti"><h2>' + tmHT('Valitse seura') + '</h2><p>' + tmHT('Super admin — valitse seura') + '</p>'
    + '<select id="tm-seura-valinta"><option value="">' + tmHT('— Valitse seura —') + '</option>' + opts + '</select>'
    + '<button class="save" onclick="_vahvistaSeuraValinta()">' + tmHT('Jatka →') + '</button></div>';
  modal.style.display = 'flex';
}
window._naytaSuperAdminSeuraValitsin = _naytaSuperAdminSeuraValitsin;

/* Kieli seuran kielestä (sv-läpiajo PR 4): tmKieliInitSeura(seura.kieli) — käyttäjän oma valinta (tm_kieli) voittaa — ja staattisen markupin lokalisointi. Best-effort: virhe → fi. */
async function _adarKieliAlusta(seuraId) {
  try {
    if (typeof tmKieliInitSeura === 'function') {
      const sd = (seuraId && seuraId !== 'demo') ? await _PH_DB.collection('seurat').doc(seuraId).get() : null;
      tmKieliInitSeura(sd && sd.exists ? (sd.data().kieli || null) : null);
    }
    if (typeof tmHTL === 'function') tmHTL(document);
  } catch (e) { /* kieli jää suomeksi */ }
}
window._adarKieliAlusta = _adarKieliAlusta;
if (typeof tmHTL === 'function') tmHTL(document);   // tallennettu kieli (tm_kieli) heti: kirjautumisbanneri ennen seuran lukua

async function _vahvistaSeuraValinta() {
  const sel = document.getElementById('tm-seura-valinta');
  const seuraId = sel ? sel.value : '';
  if (!seuraId) return;
  window._tmSeuraId = seuraId;
  await _adarKieliAlusta(seuraId);
  const modal = document.getElementById('tm-seura-modal');
  if (modal) modal.style.display = 'none';
  await _adarLataaPelaajat(seuraId);
}
window._vahvistaSeuraValinta = _vahvistaSeuraValinta;

/** Lataa seuran pelaajat `_pelaajaMap`:iin ja renderöi poimimen uudelleen. */
async function _adarLataaPelaajat(seuraId) {
  try {
    const snap = await _PH_DB
      .collection('seurat').doc(seuraId).collection('pelaajat').orderBy('sukunimi').get();
    window._pelaajaMap = window._pelaajaMap || {};
    snap.docs.forEach(function (d) {
      const p = d.data();
      window._pelaajaMap[d.id] = {
        tunniste: p.tunniste || p.palloId || null,       // PalloID — null jos ei asetettu
        nimi: ((p.etunimi || '') + ' ' + (p.sukunimi || '')).trim(),
        joukkue: p.joukkue || p.joukkueNimi || '',
        // Roolisuodatusta varten: sääntö täsmää ID-listalla, ei joukkueen nimellä (§7.18)
        joukkueet: Array.isArray(p.joukkueet) ? p.joukkueet : [],
        syntymaVuosi: (typeof p.syntymaVuosi === 'number') ? p.syntymaVuosi : null,
        // Porras ja ehdotus pikakentistä (§26) — ei alikokoelmakyselyjä renderöinnissä
        havainto_porras: (typeof p.havainto_porras === 'number') ? p.havainto_porras : null,
        havainto_porras_ehdotus: p.havainto_porras_ehdotus || null,
        adar_pvm: p.adar_pvm || null,
        // adar_edellinen-kaappaus (§29 pvm-vahti) tarvitsee edellisen arvon
        adar_viimeisin: p.adar_viimeisin || null
      };
    });
    console.log('[ADAR] ' + snap.docs.length + ' pelaajaa ladattu seuralle ' + seuraId);
  } catch (e) {
    console.error('[ADAR] Pelaajien haku epäonnistui:', e.message);
  }
  /* URL:n pelaaja (Masterin upotus) avataan vasta kun map on ladattu. */
  if (typeof window._phAvaaAloitusPelaaja === 'function') window._phAvaaAloitusPelaaja();
  _phRender();
}

_PH_AUTH.onAuthStateChanged(async function (user) {
  if (!user) { _adarNaytaBanneri(true); return; }
  _adarNaytaBanneri(false);

  try {
    const token = await user.getIdTokenResult(true);
    /* ROOLIN YKSI LÄHDE = CLAIM. Rules lukee request.auth.token.rooli:n, joten klientin on
       päätettävä samasta lähteestä tai ne ajautuvat erilleen: poimin näyttäisi enemmän kuin
       Rules sallii, ja tallennus kaatuisi vasta kentällä. Jos Master on jo injektoinut arvon
       (upotettu tila), sitä kunnioitetaan — Master injektoi nykyään myös claimin roolin. */
    if (!window._tmRooli) window._tmRooli = token.claims.rooli || null;
    window._tmClaimRooli = token.claims.rooli || null;
    const seuraId = token.claims.seuraId;
    const isSuperAdmin = token.claims.rooli === 'super_admin'
      || token.claims.rooli === 'superadmin'
      || token.claims.super_admin === true;

    if (!seuraId) {
      if (isSuperAdmin) { _naytaSuperAdminSeuraValitsin(); }
      else { console.warn('[ADAR] Ei seuraId'); }
      return;
    }
    window._tmSeuraId = window._tmSeuraId || seuraId;

    /* Kirjautumisaikaleima omaan kayttajat-dokkiin (§0) — VAI+ n4 lukee tätä.
       SA ohitetaan: ei kayttajat-dokkia seuran alla (§3). Best-effort. */
    if (!isSuperAdmin && typeof tmMerkitseKirjautuminen === 'function') {
      tmMerkitseKirjautuminen(_PH_DB, seuraId, user.uid);
    }

    /* Omat joukkueet ENNEN poimimen täyttöä — muuten rajattu rooli näkisi
       hetken koko seuran (ja voisi ehtiä valita pelaajan jota ei saa kirjata). */
    await _adarKieliAlusta(window._tmSeuraId);   // kieli ennen ensimmäistä renderiä
    await _adarLataaOmatJoukkueet(window._tmSeuraId, user.uid);
    await _adarLataaPelaajat(window._tmSeuraId);

    /* Vanhan pikatilan IDB-jono: tyhjennetään kerran. POISTA 2026-11 jälkeen. */
    _synkronoiOfflineJono();
  } catch (e) {
    console.error('[ADAR] Alustus epäonnistui:', e.message);
  }
});

// ══ TEEMAKYTKIN ══════════════════════════════════════════════════════════════
// Oletuksena vaalea: kenttätyökalu avataan ulkona kirkkaassa valossa.
(function _initTeema() {
  const tallennettu = localStorage.getItem('tm_teema') || 'light';
  document.documentElement.setAttribute('data-theme', tallennettu);
  _paivitaTeemaIcon(tallennettu);
})();

function _vaihdaTeema() {
  const nykyinen = document.documentElement.getAttribute('data-theme') || 'light';
  const uusi = nykyinen === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', uusi);
  localStorage.setItem('tm_teema', uusi);
  _paivitaTeemaIcon(uusi);
}
window._vaihdaTeema = _vaihdaTeema;

function _paivitaTeemaIcon(teema) {
  const btn = document.getElementById('theme-toggle-btn');
  if (btn) btn.textContent = teema === 'light' ? '☾' : '☀';
}
</script>

<script>
// ══════════════════════════════════════════════════════════════════════════════
// PELIHAVAINTO — YKSI NÄKYMÄ, PORRAS KERRALLAAN
//
// Tasovälilehdet ja erillinen pikatila poistuivat: porras määrää ulottuvuudet, ja
// ikä on vain ehdotus aloitusportaaksi. Laskenta (portaat, konsensus, pikakentät)
// tulee kokonaan `lib/tm_pelialy_yksilo.js`:stä — tässä tiedostossa ei ole omaa
// konsensuslaskentaa, jotta Master ja pikakortti eivät voi ajautua erilleen.
// ══════════════════════════════════════════════════════════════════════════════

/* Ulottuvuusavain (lib) → havainnon `pisteet`-avain. Peilaa libin sisäistä
   ADAR_KENTTA_MAP:ia, jota ei viedä ulos. Vartija lukee molemmat lähteestä. */
const PH_KENTTA = { a: 'A', d: 'D', ac: 'Act', r: 'R' };

/* KAIKKI näytettävät ulottuvuustekstit ovat lib/tm_adar_tekstit.js:n FI-kartassa (avain = polku, esim. adar_A_q, adar_A_d1) — sv-läpiajo PR 4. sv tulee jaetusta kirjastokartasta
   (tm_lib_i18n.js, tmLibT; Gemini); puuttuva → suomi. Teksti haetaan RENDERÖINTIHETKELLÄ (kieli selviää vasta seuran luvun jälkeen → ei latausaikaisia vakioita).
   Nimet (Havainnointi · Päätös · Toteutus · Palautuminen) tulevat libin nimikanonista tmAdarNimet('valmentaja', tmLibT) — yksi nimikanoni, ei kopiota. */
function _phTr() { return (typeof tmLibT === 'function') ? tmLibT : null; }
function _phT(avain) { return TM_ADAR_TEKSTIT.tmAdarT(avain, _phTr()); }
function _phTekstit(k) { return TM_ADAR_TEKSTIT.tmAdarKortti(k, _phTr()); }
function _phNimet() { return (typeof tmAdarNimet === 'function') ? tmAdarNimet('valmentaja', _phTr()) : (typeof TM_ADAR_NIMET !== 'undefined' ? TM_ADAR_NIMET.valmentaja : {}); }
const PH_KONTEKSTI_AVAIMET = ['harjoitus', 'pienpeli', 'ottelu'];   // tallennettavat arvot (EI käännetä); näyttöteksti adar_konteksti_<avain>
const PH_KUMOA_MS = 10 * 60 * 1000;   // Kumoa näkyy 10 min

/* ── TILA ────────────────────────────────────────────────────────────────────
   Yksi objekti, joka myös persistoidaan luonnokseksi (reload kentällä). */
window._phTila = {
  naytto: 'valitse',
  pelaajaId: null, haku: '',
  porras: 1, porrasTallennettu: null, ehdotusOhitettu: false, porrasNostettu: false,
  konteksti: 'harjoitus',
  pisteet: {}, havaitut: {}, auki: {}, teksti: '', nakyvyys: false,
  tehdyt: {}, sheet: false, peruttu: false,
  viimeisin: null, odottaa: false, virhe: null
};

function _phEsc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}
window._phEsc = _phEsc;

function _phPelaaja(pid) { return (window._pelaajaMap || {})[pid || window._phTila.pelaajaId] || null; }

/** Ikä = kuluva vuosi − syntymävuosi (ikäluokkakonventio, §26/IKAKONVENTIO_SPEC). */
function _phIka(pid) {
  var p = _phPelaaja(pid);
  if (!p || p.syntymaVuosi == null) return null;
  return new Date().getFullYear() - p.syntymaVuosi;
}

function _phIkavaihe(ika) {
  if (ika == null) return tmHT('Pelihavainto');
  return TM_ADAR_TEKSTIT.tmAdarIkavaihe(ika, _phTr());
}

/** Portaan ulottuvuudet havainnon pisteet-avaimina (lib on ainoa lähde). */
function _phDimit(porras) {
  var band = (typeof tmAdarBand === 'function') ? tmAdarBand(null, porras) : ['a'];
  return band.map(function (k) { return PH_KENTTA[k]; });
}

/** Ikäsuositus portaaksi — lib, ei omaa ikälogiikkaa. */
function _phIkaPorras(ika) {
  return (typeof tmAdarIkaPorras === 'function') ? tmAdarIkaPorras(ika) : 4;
}

/* ── JÄRJESTYS: pisimpään havainnoimatta ensin ────────────────────────────────
   null (ei havaintoja) ensin, sitten vanhin → uusin, ja tänään havainnoidut viimeisenä.
   Lähde on pikakenttä `adar_pvm` (§26) — ei alikokoelmakyselyä renderöinnissä. */
function _phOnTanaan(pid) {
  if (window._phTila.tehdyt[pid]) return true;
  var p = _phPelaaja(pid);
  if (!p || !p.adar_pvm) return false;
  var d = new Date(p.adar_pvm);
  if (isNaN(d.getTime())) return false;
  var n = new Date();
  return d.getFullYear() === n.getFullYear() && d.getMonth() === n.getMonth() && d.getDate() === n.getDate();
}

function _phJarjestysAvain(pid) {
  if (_phOnTanaan(pid)) return Infinity;                 // viimeisenä
  var p = _phPelaaja(pid);
  if (!p || !p.adar_pvm) return -Infinity;               // ei havaintoja → ensin
  var t = new Date(p.adar_pvm).getTime();
  return isNaN(t) ? -Infinity : t;
}

function _phJarjesta(idt) {
  return idt.slice().sort(function (a, b) { return _phJarjestysAvain(a) - _phJarjestysAvain(b); });
}

/** Meta-teksti listassa: "ei havaintoja" / "eilen" / "N pv sitten" / "✓ tänään". */
function _phViimeksi(pid) {
  if (_phOnTanaan(pid)) return { teksti: tmHT('✓ tänään'), tanaan: true };
  var p = _phPelaaja(pid);
  if (!p || !p.adar_pvm) return { teksti: tmHT('ei havaintoja'), tanaan: false };
  var t = new Date(p.adar_pvm).getTime();
  if (isNaN(t)) return { teksti: tmHT('ei havaintoja'), tanaan: false };
  var pv = Math.floor((Date.now() - t) / 86400000);
  if (pv <= 1) return { teksti: 'eilen', tanaan: false };

}

/** Ehdotuskortin ehdot yhdessä paikassa (pikakenttä + ohitus + oma porras). */

  var S = window._phTila, p = _phPelaaja();
  if (!p || S.ehdotusOhitettu || S.porrasNostettu) return null;
  var oma = S.porrasTallennettu || _phIkaPorras(_phIka());
  if (S.porras !== oma) return null;
  var e = p.havainto_porras_ehdotus;
  if (!e || !e.valmis || !e.seuraava) return null;
  return e;
}

function _phSidoHavainto() {
  var juuri = _phJuuri(), S = window._phTila;

  if (back) back.onclick = function () { S.naytto = 'valitse'; S.peruttu = false; _phRender(); };

  if (vaihda) vaihda.onclick = function () { S.naytto = 'valitse'; S.peruttu = false; _phRender(); };

    b.onclick = function () { S.konteksti = b.getAttribute('data-kx'); _phRender(); _luonnosTallenna(); };

  juuri.querySelectorAll('[data-sc]').forEach(function (b) {

      if (S.pisteet[k] === v) delete S.pisteet[k]; else S.pisteet[k] = v;   // toinen napautus tyhjentää
      _phRender(); _luonnosTallenna();
    };
  });
  juuri.querySelectorAll('[data-more]').forEach(function (b) {
    b.onclick = function () { var k = b.getAttribute('data-more'); S.auki[k] = !S.auki[k]; _phRender(); };
  });
  juuri.querySelectorAll('[data-chip]').forEach(function (b) {
    b.onclick = function () {
      var k = b.getAttribute('data-chip'), t = b.getAttribute('data-t');
      var a = S.havaitut[k] = S.havaitut[k] || [];
      var i = a.indexOf(t);

  if (ta) ta.oninput = function () { S.teksti = ta.value; _luonnosTallenna(); };

  var pr = document.getElementById('ph-porras');
  if (pr) pr.onclick = function () { S.sheet = true; _phRender(); };
  var sulje = document.getElementById('ph-sulje');
  if (sulje) sulje.onclick = function () { S.sheet = false; _phRender(); };
  var nosta = document.getElementById('ph-nosta');
  if (nosta) nosta.onclick = function () { S.porras = Math.min(4, S.porras + 1); S.porrasNostettu = true; _phRender(); };
  var ei = document.getElementById('ph-eivielä');
  if (ei) ei.onclick = function () { S.ehdotusOhitettu = true; _phRender(); };
  juuri.querySelectorAll('[data-porras]').forEach(function (b) {
    b.onclick = function () {
      var uusi = Number(b.getAttribute('data-porras'));
      S.porras = uusi;
      S.porrasNostettu = uusi > (S.porrasTallennettu || _phIkaPorras(_phIka()));
      /* Portaan ulkopuolelle jäävät pisteet pois — muuten tallentuisi ulottuvuus jota ei arvioida. */
      var salli = _phDimit(uusi);
      Object.keys(S.pisteet).forEach(function (k) { if (salli.indexOf(k) < 0) delete S.pisteet[k]; });
      S.sheet = false;
      _phRender(); _luonnosTallenna();
    };
  });
  var save = document.getElementById('ph-save');
  if (save) save.onclick = function () { _phTallenna(); };
}

    + (seuraava ? tmHT('Seuraava pelaaja →') : 'Valmis') + '</button></div>';

  juuri.innerHTML = h;
  var u = document.getElementById('ph-undo');
  if (u) u.onclick = function () { _phKumoa(); };
  var n = document.getElementById('ph-next');
  if (n && seuraava) n.onclick = function () { _phAvaaPelaaja(seuraava); };
  juuri.querySelectorAll('[data-pl]').forEach(function (b) {
    b.onclick = function () { _phAvaaPelaaja(b.getAttribute('data-pl')); };
  });
}

function _phKumoaNakyy() {
  var v = window._phTila.viimeisin;
  return !!(v && v.ref && !v.kumottu && (Date.now() - v.ms) < PH_KUMOA_MS);
}
</script>

<script>
// ══════════════════════════════════════════════════════════════════════════════
// TALLENNUS — yksi polku, ei omaa offline-jonoa
//
// Firestoren `enablePersistence` hoitaa offline-kirjoituksen: `set()` menee paikalliseen
// välimuistiin heti ja lähtee kun verkko palaa. Siksi tallennusta EI awaitata UI:n
// etenemiselle — odottaminen jumittaisi kentällä juuri silloin kun verkkoa ei ole.
// Tila luetaan `onSnapshot({includeMetadataChanges:true})`-kuuntelijan `hasPendingWrites`:sta.
// ══════════════════════════════════════════════════════════════════════════════

function _phPelaajaRef(seuraId, pelaajaId) {
  return _PH_DB.collection('seurat').doc(seuraId).collection('pelaajat').doc(pelaajaId);
}

/** Pikakentät (§26) libin kanonisella funktiolla — tässä tiedostossa ei ole omaa laskentaa. */
async function _phPaivitaPikakentat(seuraId, pelaajaId, porras, kirjoitaPorras) {
  try {
    var pRef = _phPelaajaRef(seuraId, pelaajaId);
    var snap = await pRef.collection('havainnot').get();
    var havainnot = snap.docs.map(function (d) { return d.data(); });
    /* Edellinen arvo luetaan DOKUMENTISTA, ei paikallisesta mapista: toinen valmentaja on
       voinut tallentaa välissä, ja §29 pvm-vahti vertaa juuri tähän arvoon. */
    var _oldAvDoc = await pRef.get().catch(function () { return null; });
    var _oldAv = (_oldAvDoc && _oldAvDoc.exists && _oldAvDoc.data().adar_viimeisin) || null;
    var ika = _phIka(pelaajaId);
    /* PORRAS ON UUSI, kun se nostettiin tässä havainnossa. Jos pikakentät laskettaisiin
       vanhalla portaalla, `havainto_porras_ehdotus.hist` kuvaisi edellistä ulottuvuutta
       (jolla on jo 3 havaintoa) ja Pelaaja_v7 näyttäisi uuden taidon heti vakiintuneena. */
    var kentat = (typeof tmAdarPikakentat === 'function')
      ? tmAdarPikakentat(havainnot, ika, porras, { edellinen: _oldAv })
      : null;
    if (!kentat) return;
    if (kirjoitaPorras) kentat.havainto_porras = porras;
    await pRef.set(kentat, { merge: true });
    /* Paikallinen map ajan tasalle: järjestys ja ehdotuskortti lukevat sitä (§26). */
    if (window._pelaajaMap && window._pelaajaMap[pelaajaId]) {
      var m = window._pelaajaMap[pelaajaId];
      m.adar_pvm = kentat.adar_pvm || m.adar_pvm;
      m.adar_viimeisin = kentat.adar_viimeisin || m.adar_viimeisin;
      m.havainto_porras_ehdotus = kentat.havainto_porras_ehdotus || null;
      if (kirjoitaPorras) m.havainto_porras = porras;
    }
  } catch (e) {
    console.warn('[ADAR pikakentat]', e && (e.code || e.message));
  }
}

/* §26 ATOMISESTI: havainto + adar_*-pikakentät SAMASSA batchissa (kaikki tai ei mitään). Pikakentät lasketaan
   libin kanonisella tmAdarPikakentat-funktiolla nykyisistä havainnoista + UUSI havainto (ei vielä kannassa), jolloin
   laskenta vastaa entistä "tallenna → lue → laske" -järjestystä. Uuden havainnon luotu = new Date() (arvio; kannassa
   serverTimestamp). Laskennan epäonnistuessa havainto kirjoitetaan silti (data ei katoa), pikakentät seuraavalla.
   Käyttö: online-tallennus (_phTallenna) JA offline-jonon synkka (_synkronoiOfflineJono). Palauttaa commit-lupauksen;
   onLahetetty() kutsutaan heti kun batch on annettu Firestorelle (persistence: jonottuu laitteelle). */
async function _phKirjoitaHavaintoJaPikakentat(havRef, data, seuraId, pelaajaId, porras, kirjoitaPorras, onLahetetty) {
  var pRef = _phPelaajaRef(seuraId, pelaajaId), kentat = null, havVanha = null;
  try {
    var snap = await pRef.collection('havainnot').get();
    var havainnot = snap.docs.filter(function (d) { return d.id !== havRef.id; }).map(function (d) { return d.data(); });
    havainnot.push(Object.assign({}, data, { luotu: new Date() }));
    var _oldAvDoc = await pRef.get().catch(function () { return null; });
    var _oldAv = (_oldAvDoc && _oldAvDoc.exists && _oldAvDoc.data().adar_viimeisin) || null;
    havVanha = (_oldAvDoc && _oldAvDoc.exists && _oldAvDoc.data().havainto_viimeisin_pvm) || null;
    kentat = (typeof tmAdarPikakentat === 'function')
      ? tmAdarPikakentat(havainnot, _phIka(pelaajaId), porras, { edellinen: _oldAv }) : null;
    if (kentat && kirjoitaPorras) kentat.havainto_porras = porras;
  } catch (e) { console.warn('[ADAR pikakentat]', e && (e.code || e.message)); kentat = null; }
  /* HAVAINTO + havainto_viimeisin_pvm SAMASSA BATCHISSA (§26): jokainen havainto päivittää havaintorytmin pikakentän atomisesti — ei "havainto tehty mutta rytmi
     ei nollautunut" -väärää hälytystä (pilotti). Rules: havainnot.create = SA | onOmanJoukkueenValmentaja, pelaajadokin update sallii täsmälleen samat roolit →
     kenttä sallittu samoille rooleille, batch ei hylkäydy oikeuksien takia (testit: tests/rules). Havainto hylätään vain jos oikeasti ei saa kirjoittaa.
     Johdetut adar_*-pikakentät pysyvät ERIKSEEN (laskettu, lasketaan uudelleen seuraavalla havainnolla; niiden epäonnistuminen ei saa hävittää havaintoa).
     Batch jonottuu offline-tilassa atomisena; adar_*-set annetaan heti perään (järjestys säilyy). Vain batchin epäonnistuminen palautetaan kutsujalle. */
  /* havainto_viimeisin_pvm: KAIKKI henkilökunnan havainnot (myös ilman pisteitä), ei vain pisteelliset kuten adar_pvm. Havainnon päivä (paikallinen, §7.26);
     myöhempi päivämäärä säilyy (offline-synkka tuo vanhan päivän: max). */
  var havPvm = (typeof data.pvm === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(data.pvm)) ? data.pvm : null;
  if (havPvm && typeof havVanha === 'string' && havVanha > havPvm) havPvm = havVanha;
  var batch = _PH_DB.batch();
  batch.set(havRef, data);
  if (havPvm) batch.set(pRef, { havainto_viimeisin_pvm: havPvm }, { merge: true });
  var commit = batch.commit();
  /* commit.pikakentat = lupaus joka AINA resolvaa {ok, code}: kutsuja (Master) tietää onnistuiko adar-yhteenveto. Aiemmin vain
     console.warn → pikakenttien epäonnistuminen oli täysin näkymätön ja Masterin kortti jäi "ei havaintoja". */
  var pikakentat = kentat
    ? pRef.set(kentat, { merge: true }).then(function () { return { ok: true }; }, function (e) {
        console.warn('[ADAR pikakentat kirjoitus]', e && (e.code || e.message));
        return { ok: false, code: (e && e.code) || 'virhe' };
      })
    : Promise.resolve({ ok: false, code: 'laskenta' });
  /* Palautettava lupaus resolvaa kun batch (havainto + havainto_viimeisin_pvm) on kuitattu, arvona adar-pikakenttien tulos {ok, code}; hylkää jos batch hylätään. */
  commit = commit.then(function () { return pikakentat; });
  if (typeof onLahetetty === 'function') onLahetetty();
  if (kentat && window._pelaajaMap && window._pelaajaMap[pelaajaId]) {   // paikallinen map (§26), kuten _phPaivitaPikakentat
    var m = window._pelaajaMap[pelaajaId];
    m.adar_pvm = kentat.adar_pvm || m.adar_pvm;
    m.adar_viimeisin = kentat.adar_viimeisin || m.adar_viimeisin;
    m.havainto_porras_ehdotus = kentat.havainto_porras_ehdotus || null;
    if (kirjoitaPorras) m.havainto_porras = porras;
  }
  if (havPvm && window._pelaajaMap && window._pelaajaMap[pelaajaId]) window._pelaajaMap[pelaajaId].havainto_viimeisin_pvm = havPvm;
  return commit;
}

async function _phTallenna() {
  var S = window._phTila;
  var dims = _phDimit(S.porras);
  var pisteet = {};
  dims.forEach(function (k) { if (S.pisteet[k]) pisteet[k] = S.pisteet[k]; });
  if (!Object.keys(pisteet).length) return;                 // Tallenna on disabled, mutta fail-closed

  var db = _PH_DB, auth = _PH_AUTH;
  var seuraId = window._tmSeuraId || '', pelaajaId = S.pelaajaId;
  if (!db || !auth || !auth.currentUser) { _showToast(tmHT('⚠ Kirjaudu ensin sisään')); return; }
  if (!seuraId || !pelaajaId) { _showToast(tmHT('⚠ Valitse pelaaja ensin')); return; }

  /* Tuore token vain verkossa: offline-tilassa getIdToken(true) heittää eikä
     kirjoitusta tarvitse estää — se jonottuu joka tapauksessa. */
  if (!(typeof navigator !== 'undefined' && navigator.onLine === false)) {
    try { await auth.currentUser.getIdToken(true); } catch (e) { /* ei estä kirjausta */ }
  }

  var havaitut = [];
  Object.keys(S.havaitut).forEach(function (k) {
    (S.havaitut[k] || []).forEach(function (t) { havaitut.push(k + ':' + t); });
  });

  var user = auth.currentUser;
  var map = window._pelaajaMap || {};
  var data = {
    tyyppi: 'adar_pikakortti',
    porras: S.porras,
    ulottuvuudet: (typeof tmAdarBand === 'function') ? tmAdarBand(null, S.porras) : [],
    pisteet: pisteet,
    havaitut: havaitut,                       // "Mitä näit?" -valinnat tallentuvat nyt oikeasti
    konteksti: S.konteksti,
    narratiivi: S.teksti || '',
    /* VALMENTAJAN VALINTA, ei oletus: 'pelaaja' = lapsi näkee tekstin, 'valmentajat' = ei näe. */
    nakyvyys: _nakArvo(),
    tila: 'valmis',
    pelaaja_lukenut: false,
    tekija_uid: user.uid,
    tekija_nimi: _adarTekijaNimi(user),   // EI sähköpostia — lapsi näkee tämän kortissaan
    tekija_rooli: window._tmRooli || null,
    pelaaja_id: pelaajaId,
    seura_id: seuraId,
    // PalloID — Palloliiton pysyvä tunniste, seurasta riippumaton ankkuri
    palloId: (map[pelaajaId] && map[pelaajaId].tunniste) || null,
    pvm: tmPaivaIso(new Date()),   // havainnon päivä: paikallinen (ei UTC)
    luotu: window.firebase.firestore.FieldValue.serverTimestamp()
  };

  var ref = _phPelaajaRef(seuraId, pelaajaId).collection('havainnot').doc();
  var porrasTallennetaan = S.porrasNostettu || S.porrasTallennettu !== S.porras;

  /* EI AWAITIA: UI etenee heti, kirjoitus jonottuu tarvittaessa. Havainto + pikakentät yhdessä batchissa (§26).
     Luonnos tyhjennetään vasta kun batch on annettu Firestorelle (onLahetetty), ei ennen. */
  var luonnosTila = _luonnosKeraa();
  var _lahetetty = function () { _luonnosMerkitse(pelaajaId, 'lahetetty', null, luonnosTila); };
  var _kirjoitus = _phKirjoitaHavaintoJaPikakentat(ref, data, seuraId, pelaajaId, S.porras, porrasTallennetaan, _lahetetty);
  /* ISÄNNÄLLE VIESTI VASTA KUN KIRJOITUS ON KUITATTU (ei ennen): Master sulkee iframen viestistä → ennen kuittausta
     lähetetty viesti tuhosi sivun ennen kuin virhekäsittelijä ehti näkyä (virhe jäi näkymättömäksi) ja jätti
     pikakenttien tuloksen kertomatta. Offline: kuittausta ei tule → ilmoitetaan heti ("jonossa"). */
  var _ilmoitaIsannalle = function (viesti) {
    try { if (window.parent && window.parent !== window) window.parent.postMessage(viesti, '*'); } catch (e) { /* ei isäntää */ }
  };
  var _offline = (typeof navigator !== 'undefined' && navigator.onLine === false);
  if (_offline) _ilmoitaIsannalle({ type: 'tm:adar:saved', pelaajaId: pelaajaId, jonossa: true });
  _kirjoitus.then(function (pk) {
    _luonnosTyhjenna(pelaajaId);   // KUITATTU palvelimelta → luonnos pois (ei ennen)
    return pk;
  }).then(function (pk) {
    if (!_offline) _ilmoitaIsannalle({ type: 'tm:adar:saved', pelaajaId: pelaajaId,
      pikakentat: !!(pk && pk.ok), pikakenttaVirhe: (pk && pk.code) || null });
  }).catch(function (err) {
    if (!_offline) _ilmoitaIsannalle({ type: 'tm:adar:failed', pelaajaId: pelaajaId, koodi: (err && err.code) || 'virhe' });
    console.error('[ADAR] Tallennusvirhe:', err && (err.message || err));
    var syy = (err && (err.code === 'permission-denied' || (err.message || '').indexOf('permissions') >= 0))
      ? _adarEstonSyy() : '';
    /* EI HILJAISTA KATOAMISTA: luonnos säilyy 'epaonnistui'-tilassa, lomake palautetaan ruudulle ja virhe näkyy pysyvänä
       bannerina (toast katoaa; kentällä konsolia ei ole). */
    _luonnosMerkitse(pelaajaId, 'epaonnistui', { virhe: syy }, luonnosTila);
    var N = window._phTila;
    if (N.pelaajaId === pelaajaId && N.naytto === 'ok') _luonnosAvaa(pelaajaId, true);
    else _phRender();
    _showToast(tmHT('⚠ Havaintoa ei tallennettu – yritä uudelleen'));
  });

  S.viimeisin = {
    ref: ref, pelaajaId: pelaajaId, pisteet: pisteet, havaitut: S.havaitut, teksti: S.teksti,
    konteksti: S.konteksti, nakyvyys: data.nakyvyys, porras: S.porras,
    porrasNostettu: S.porrasNostettu, porrasEnnen: S.porrasTallennettu,
    porrasKirjoitettu: porrasTallennetaan, ms: Date.now(), kumottu: false
  };
  S.tehdyt[pelaajaId] = true;
  S.odottaa = true;
  S.naytto = 'ok';
  /* Luonnos merkitään 'lahetetty' heti ja poistetaan vasta palvelimen kuittauksella; epäonnistuessa lomake palautetaan. */
  _phRender();

  _phSeuraaKirjoitusta(ref);

  /* Isännälle ilmoitetaan yllä kuittauksen jälkeen (tm:adar:saved / tm:adar:failed). */
}
window._phTallenna = _phTallenna;

/** "Tallessa laitteella" vs "Tallennettu" — metadata, ei arvailu navigator.onLinesta. */
function _phSeuraaKirjoitusta(ref) {
  try {
    var unsub = ref.onSnapshot({ includeMetadataChanges: true }, function (d) {
      if (d && d.metadata && d.metadata.hasPendingWrites) return;
      window._phTila.odottaa = false;
      if (window._phTila.naytto === 'ok') _phRender();
      if (unsub) unsub();
    }, function () { if (unsub) unsub(); });
  } catch (e) { window._phTila.odottaa = false; }
}

/* ── KUMOA ───────────────────────────────────────────────────────────────────
   Havaintoa EI poisteta: valmentajalla ei ole poisto-oikeutta, ja jälki jää historiaan.
   `tila:'peruttu'` → libin konsensus ohittaa sen, joten pikakentät palautuvat itsestään
   kun ne lasketaan uudelleen. Rules (v3.21) sallii perumisen vain tekijälle. */
async function _phKumoa() {
  var S = window._phTila, v = S.viimeisin;
  if (!v || !v.ref || v.kumottu) return;
  var uid = (_PH_AUTH && _PH_AUTH.currentUser) ? _PH_AUTH.currentUser.uid : null;
  try {
    await v.ref.update({
      tila: 'peruttu',
      peruttu: window.firebase.firestore.FieldValue.serverTimestamp(),
      peruttu_uid: uid
    });
  } catch (e) {
    _showToast(tmHT('⚠ Kumoaminen ei onnistunut'));
    return;
  }
  v.kumottu = true;
  delete S.tehdyt[v.pelaajaId];

  /* Portaan nosto perutaan myös: muuten pelaaja jäisi portaalle, jonka ainoa havainto kumottiin. */
  if (v.porrasKirjoitettu) {
    try {
      var pRef = _phPelaajaRef(window._tmSeuraId, v.pelaajaId);
      await pRef.set({
        havainto_porras: (v.porrasEnnen == null)
          ? window.firebase.firestore.FieldValue.delete()
          : v.porrasEnnen
      }, { merge: true });
      if (window._pelaajaMap && window._pelaajaMap[v.pelaajaId]) {
        window._pelaajaMap[v.pelaajaId].havainto_porras = v.porrasEnnen;
      }
    } catch (e) { console.warn('[ADAR] portaan palautus', e && e.message); }
  }

  // Lomake palaa samoilla arvoilla → valmentaja korjaa ja tallentaa uudelleen.
  S.pelaajaId = v.pelaajaId;
  S.pisteet = Object.assign({}, v.pisteet);
  S.havaitut = v.havaitut || {};
  S.teksti = v.teksti || '';
  S.konteksti = v.konteksti;
  S.nakyvyys = (v.nakyvyys === 'pelaaja');
  S.porras = v.porras;
  S.porrasTallennettu = v.porrasEnnen;
  S.porrasNostettu = v.porrasNostettu;
  S.naytto = 'havainto';
  S.peruttu = true;
  S.viimeisin = null;
  _phRender();

  _phPaivitaPikakentat(window._tmSeuraId, v.pelaajaId, v.porrasEnnen || _phIkaPorras(_phIka(v.pelaajaId)), false);
}
window._phKumoa = _phKumoa;

// ══════════════════════════════════════════════════════════════════════════════
// LUONNOS — havainto ei saa hukkua sivunlatauksessa
//
// Kenttäkäytössä selain voi ladata sivun uudelleen (muistipaine, taustoitus). Vain muistissa
// ollut havainto katosi. Luonnos on localStoragessa, koska se on synkroninen ja selviää
// reloadista; IndexedDB on mukana vain vanhan kuvavaraston tyhjentämistä varten.
// ══════════════════════════════════════════════════════════════════════════════
const ADAR_IDB_NIMI = 'tm_adar_luonnos';
const ADAR_IDB_STORE = 'kuvat';

function _luonnosAvain() {
  return 'tm_adar_luonnos_' + (window._tmSeuraId || 'tuntematon');
}

function _idbAvaa() {
  return new Promise(function (resolve, reject) {
    var req = indexedDB.open(ADAR_IDB_NIMI, 1);
    req.onupgradeneeded = function () {
      var db = req.result;
      if (!db.objectStoreNames.contains(ADAR_IDB_STORE)) db.createObjectStore(ADAR_IDB_STORE);
    };
    req.onsuccess = function () { resolve(req.result); };
    req.onerror = function () { reject(req.error); };
  });
}

function _idbToimi(tila, fn) {
  return _idbAvaa().then(function (db) {
    return new Promise(function (resolve, reject) {
      var tx = db.transaction(ADAR_IDB_STORE, tila);
      var tulos = fn(tx.objectStore(ADAR_IDB_STORE));
      tx.oncomplete = function () { db.close(); resolve(tulos && tulos.result); };
      tx.onerror = function () { db.close(); reject(tx.error); };
    });
  });
}

/* TIETOSUOJA (vaihe 1): laitteille on voinut jäädä kuvia lapsista vanhasta kuvatoiminnosta.
   Koodin poisto ei riitä — object store on TYHJENNETTÄVÄ. */
function _luonnosTyhjennaKuvaStore() {
  return _idbToimi('readwrite', function (s) { return s.clear(); }).catch(function () { /* ei tuettu */ });
}

/** Luonnokseen menee koko havaintotila — ei DOM-kenttiä, joten se kestää näkymän uudelleenrakennuksen. */
function _luonnosKeraa() {
  var S = window._phTila;
  return {
    pelaajaId: S.pelaajaId, naytto: S.naytto,
    porras: S.porras, porrasTallennettu: S.porrasTallennettu, porrasNostettu: S.porrasNostettu,
    ehdotusOhitettu: S.ehdotusOhitettu, konteksti: S.konteksti,
    pisteet: S.pisteet, havaitut: S.havaitut, teksti: S.teksti, nakyvyys: S.nakyvyys
  };
}

/* LUONNOKSET — YKSI PER PELAAJA (samassa avaimessa), jotta toisen pelaajan valinta ei ylikirjoita keskeneräistä havaintoa.
   Tallennettu muoto: { v: 2, luonnokset: { <pelaajaId>: { tila: <_luonnosKeraa()>, aika, laheteys, virhe?, havaintoId? } } }.
   laheteys: 'luonnos' (keskeneräinen) · 'lahetetty' (batch annettu Firestorelle, kuittausta odotetaan — EI huomautusta) ·
   'epaonnistui' (Rules/verkko hylkäsi — sisältö säilyy, huomautus + yritä uudelleen). Vanha muoto (yksi objekti, pelaajaId kentässä)
   luetaan siirtymänä. Avain poistetaan kun viimeinenkin luonnos poistuu. */
function _luonnosLueKaikki() {
  var raaka = null;
  try { raaka = localStorage.getItem(_luonnosAvain()); } catch (e) { return {}; }
  if (!raaka) return {};
  var t = null;
  try { t = JSON.parse(raaka); } catch (e) { return {}; }
  if (t && t.luonnokset && typeof t.luonnokset === 'object') return t.luonnokset;
  if (t && t.pelaajaId) { var m = {}; m[t.pelaajaId] = { tila: t, aika: Date.now(), laheteys: 'luonnos' }; return m; }
  return {};
}
function _luonnosKirjoitaKaikki(m) {
  try {
    if (!Object.keys(m).length) localStorage.removeItem(_luonnosAvain());
    else localStorage.setItem(_luonnosAvain(), JSON.stringify({ v: 2, luonnokset: m }));
  } catch (e) { /* kiintiö täynnä */ }
}

let _luonnosAjastin = null;
function _luonnosTallenna() {
  /* Debounce: kirjoitusta ei jauheta joka näppäimenpainalluksella. */
  if (_luonnosAjastin) clearTimeout(_luonnosAjastin);
  _luonnosAjastin = setTimeout(function () {
    var S = window._phTila;
    if (!S.pelaajaId) return;
    var m = _luonnosLueKaikki();
    m[S.pelaajaId] = { tila: _luonnosKeraa(), aika: Date.now(), laheteys: 'luonnos' };
    _luonnosKirjoitaKaikki(m);
  }, 400);
}

/** Poistaa pelaajan luonnoksen (oletus: nykyinen pelaaja). Kutsutaan kun tallennus on KUITATTU (tai käyttäjä hylkää). */
function _luonnosTyhjenna(pid) {
  if (_luonnosAjastin) { clearTimeout(_luonnosAjastin); _luonnosAjastin = null; }
  var id = (typeof pid === 'string' && pid) ? pid : window._phTila.pelaajaId;
  var m = _luonnosLueKaikki();
  if (id && m[id]) { delete m[id]; _luonnosKirjoitaKaikki(m); }
  _luonnosTyhjennaKuvaStore();
}

/** Merkitsee pelaajan luonnoksen tilan synkronisesti (lahetetty / epaonnistui) nykyisestä havaintotilasta TAI annetusta tilasta. */
function _luonnosMerkitse(pid, laheteys, lisa, tila) {
  if (_luonnosAjastin) { clearTimeout(_luonnosAjastin); _luonnosAjastin = null; }
  var m = _luonnosLueKaikki();
  var vanha = m[pid] || {};
  m[pid] = Object.assign({ tila: tila || vanha.tila || _luonnosKeraa(), aika: Date.now() }, lisa || {}, { laheteys: laheteys });
  _luonnosKirjoitaKaikki(m);
}

/** Palauttaa pelaajan luonnoksen lomakkeeseen (käyttäjä valitsi "Avaa" tai avaa saman pelaajan). */
function _luonnosAvaa(pid, hiljainen) {
  var m = _luonnosLueKaikki();
  var e = m[pid]; var t = e && e.tila;
  if (!t || !t.pelaajaId) return false;
  var S = window._phTila;
  S.pelaajaId = t.pelaajaId;
  S.porras = t.porras || 1;
  S.porrasTallennettu = (t.porrasTallennettu == null) ? null : t.porrasTallennettu;
  S.porrasNostettu = !!t.porrasNostettu;
  S.ehdotusOhitettu = !!t.ehdotusOhitettu;
  S.konteksti = t.konteksti || 'harjoitus';
  S.pisteet = t.pisteet || {};
  S.havaitut = t.havaitut || {};
  S.teksti = t.teksti || '';
  S.nakyvyys = !!t.nakyvyys;
  S.naytto = 'havainto';
  S.virhe = (e.laheteys === 'epaonnistui') ? (e.virhe || '') : null;
  S.sheet = false; S.peruttu = false;
  if (e.laheteys === 'epaonnistui' || e.laheteys === 'lahetetty') { m[pid].laheteys = 'luonnos'; delete m[pid].virhe; _luonnosKirjoitaKaikki(m); }
  if (!hiljainen) _showToast(tmHT('Palautettiin keskeneräinen havainto'));
  _phRender();
  return true;
}
window._luonnosAvaa = _luonnosAvaa;

function _luonnosHylkaa(pid) {
  _luonnosTyhjenna(pid);
  _phRender();
}
window._luonnosHylkaa = _luonnosHylkaa;

/** Muiden kuin nykyisen pelaajan keskeneräiset/epäonnistuneet luonnokset (uusin ensin) — huomautukset. 'lahetetty' ei ilmoiteta. */
function _luonnosHuomautukset() {
  var S = window._phTila, m = _luonnosLueKaikki();
  return Object.keys(m).filter(function (p) {
    return p !== S.pelaajaId && (m[p].laheteys === 'luonnos' || m[p].laheteys === 'epaonnistui' || !m[p].laheteys);
  }).sort(function (a, b) { return (m[b].aika || 0) - (m[a].aika || 0); })
    .map(function (p) { return { pid: p, laheteys: m[p].laheteys || 'luonnos', virhe: m[p].virhe || '' }; });
}
function _phHuomautusHtml() {
  var lista = _luonnosHuomautukset();
  if (!lista.length) return '';
  var map = window._pelaajaMap || {};
  return lista.map(function (x) {
    var nimi = (map[x.pid] || {}).nimi || tmHT('pelaaja');
    var teksti = x.laheteys === 'epaonnistui'
      ? tmHT('Havaintoa ei tallennettu pelaajalle {nimi} – yritä uudelleen.').replace('{nimi}', nimi)
      : tmHT('Tallentamaton havainto pelaajalle {nimi}.').replace('{nimi}', nimi);
    var id = _phEsc(x.pid);
    return '<div class="banner" role="status" data-luonnos="' + id + '"><b>' + _phEsc(teksti) + '</b>'
      + (x.virhe ? ' <span>' + _phEsc(x.virhe) + '</span>' : '')
      + ' <button type="button" class="ph-linkki" onclick="_luonnosAvaa(\'' + id + '\')">' + tmHT('Avaa') + '</button>'
      + ' · <button type="button" class="ph-linkki" onclick="_luonnosHylkaa(\'' + id + '\')">' + tmHT('Hylkää') + '</button></div>';
  }).join('');
}

/** Reload / avaus: palautetaan automaattisesti VAIN jos luonnos on pyydetyn pelaajan (kortilta avaus) TAI avaus on itsenäinen reload
    ilman pyyntöä. Yleinen avaus Masterin upotuksesta (pelaajalista) EI hyppää luonnoksen pelaajaan — se ilmoitetaan huomautuksella. */
async function _luonnosPalauta() {
  var m = _luonnosLueKaikki();
  /* 'lahetetty' = edellinen istunto antoi kirjoituksen Firestorelle (persistence/jono hoitaa) → ei palauteta. */
  Object.keys(m).forEach(function (p) { if (m[p].laheteys === 'lahetetty') delete m[p]; });
  _luonnosKirjoitaKaikki(m);
  var pidit = Object.keys(m);
  if (!pidit.length) { _phRender(); return; }
  var pyydetty = window._phAloitusPelaaja || window._tmPelaajaId || null;
  var upotettu = !!window._tmEmbedded;
  var palautettavat = pidit.filter(function (p) { return (m[p].laheteys || 'luonnos') === 'luonnos'; });
  var valittu = null;
  if (pyydetty) { if (palautettavat.indexOf(pyydetty) >= 0) valittu = pyydetty; }
  else if (!upotettu && palautettavat.length) {
    valittu = palautettavat.sort(function (a, b) { return (m[b].aika || 0) - (m[a].aika || 0); })[0];
  }
  if (valittu) { _luonnosAvaa(valittu); return; }
  _phRender();   // huomautus(huomautukset) näkyviin
}
window._luonnosPalauta = _luonnosPalauta;

// ══════════════════════════════════════════════════════════════════════════════
// VANHAN PIKATILAN OFFLINE-JONO — kertatyhjennys
// POISTA 2026-11 jälkeen. Pikatila on poistettu eikä mikään enää lisää jonoon, mutta
// laitteille on voinut jäädä merkintöjä. Ne lähetetään kerran, jottei kenttätyö katoa.
// ══════════════════════════════════════════════════════════════════════════════
let _idb = null;

function _initIDB() {
  return new Promise(function (resolve, reject) {
    if (_idb) { resolve(_idb); return; }
    var req = indexedDB.open('tm_offline_queue', 1);
    req.onupgradeneeded = function (e) {
      var db = e.target.result;
      if (!db.objectStoreNames.contains('queue')) db.createObjectStore('queue', { keyPath: 'localId', autoIncrement: true });
    };
    req.onsuccess = function (e) { _idb = e.target.result; resolve(_idb); };
    req.onerror = function (e) { reject(e.target.error); };
  });
}

async function _idbHaeKaikki() {
  var db = await _initIDB();
  return new Promise(function (resolve, reject) {
    var tx = db.transaction('queue', 'readonly');
    var req = tx.objectStore('queue').getAll();
    req.onsuccess = function () { resolve(req.result || []); };
    req.onerror = function (e) { reject(e.target.error); };
  });
}

async function _idbPoista(localId) {
  var db = await _initIDB();
  return new Promise(function (resolve, reject) {
    var tx = db.transaction('queue', 'readwrite');
    var req = tx.objectStore('queue').delete(localId);
    req.onsuccess = function () { resolve(); };
    req.onerror = function (e) { reject(e.target.error); };
  });
}

async function _synkronoiOfflineJono() {
  var db = _PH_DB, auth = _PH_AUTH;
  if (!db || !auth || !auth.currentUser) return;

  var merkinnat;
  try { merkinnat = await _idbHaeKaikki(); } catch (e) { return; }
  if (!merkinnat.length) return;

  /* `luotu` ON RAKENNETTAVA UUDELLEEN. Jonoon se päätyi joko ISO-merkkijonona tai
     serverTimestamp-sentinelinä, joka ei serialisoidu IndexedDB:hen kelvollisesti. Rules
     vaatii `luotu is timestamp` (A5), joten jonon merkintä hylättiin AINA. */
  var synkattu = 0, ohitettu = 0;
  for (var i = 0; i < merkinnat.length; i++) {
    var m = merkinnat[i];
    var localId = m.localId, luotu = m.luotu;
    var data = Object.assign({}, m);
    delete data.localId; delete data.luotu;
    try {
      /* §26: synkka kirjoittaa havainnon JA adar_*-pikakentät samassa batchissa, kuten online-tallennus
         (ennen vain havainto → synkatut havainnot eivät päivittäneet pelaajan ADAR-pikakenttiä). */
      var havRef = _phPelaajaRef(m.seura_id, m.pelaaja_id).collection('havainnot').doc();
      await _phKirjoitaHavaintoJaPikakentat(havRef, Object.assign({}, data, {
          luotu: window.firebase.firestore.FieldValue.serverTimestamp(),
          luotu_laitteella: (typeof luotu === 'string') ? luotu : null,
          synkronoitu: window.firebase.firestore.FieldValue.serverTimestamp()
        }), m.seura_id, m.pelaaja_id, data.porras || null, false);
      await _idbPoista(localId);
      synkattu++;
    } catch (e) {
      /* Verkko-ongelma on ohimenevä → lopeta ja yritä myöhemmin. Muu virhe ei korjaannu
         odottamalla, joten se ohitetaan — muuten YKSI kelvoton merkintä jumittaisi jonon. */
      if (e && (e.code === 'unavailable' || e.code === 'deadline-exceeded')) break;
      ohitettu++;
    }
  }
  if (synkattu) {
    _showToast(ohitettu ? tmHT('✓ {n} synkronoitu · {m} ei kelvannut').replace('{n}', synkattu).replace('{m}', ohitettu)
                        : '✓ Offline-merkinnät synkronoitu');
  } else if (ohitettu) {
    _showToast(tmHT('⚠ {n} offline-merkintää ei kelvannut — ota yhteys pääkäyttäjään').replace('{n}', ohitettu));
  }
}

// ══════════════════════════════════════════════════════════════════════════════
// KÄYNNISTYS — URL-parametrit ja upotus
// ══════════════════════════════════════════════════════════════════════════════
(function _phKaynnista() {
  var params = new URLSearchParams(window.location.search);
  var sid = params.get('seuraId');
  if (sid) window._tmSeuraId = window._tmSeuraId || sid;
  var pid = params.get('pelaajaId');
  if (pid) window._phAloitusPelaaja = pid;

  /* Upotettuna Masterin modaalilla on oma otsikkonsa → ei tuplaotsikkoa.
     `context=master` on vanha muoto, joka jää tueksi vanhoille linkeille. */
  window._tmEmbedded = window._tmEmbedded || params.get('embedded') === '1' || params.get('context') === 'master';
  if (window._tmEmbedded) {
    var tb = document.getElementById('tm-topbar');
    if (tb) tb.style.display = 'none';
    var lb = document.getElementById('tm-login-banner');
    if (lb) lb.style.display = 'none';   // Master on jo kirjautunut
  }

  document.addEventListener('DOMContentLoaded', function () {
    _phRender();
    _luonnosPalauta();
  });
  if (document.readyState !== 'loading') { _phRender(); _luonnosPalauta(); }

  /* Verkon tilan vaihtuessa ylärivin merkki päivittyy ja vanha jono yritetään uudelleen. */
  window.addEventListener('online', function () { _phRender(); _synkronoiOfflineJono(); });
  window.addEventListener('offline', function () { _phRender(); });
})();

/* Pelaajat ladattu → avataan URL:n pelaaja suoraan (Masterin upotus antaa sen). */
window._phAvaaAloitusPelaaja = function () {
  /* Kaksi lähdettä, sama sopimus: URL-parametri (itsenäinen avaus ja Masterin iframe-src) sekä
     `window._tmPelaajaId`, jonka Master injektoi iframen latauduttua. Kumpi tahansa riittää. */
  var pid = window._phAloitusPelaaja || window._tmPelaajaId || null;
  if (!pid) return;
  window._phAloitusPelaaja = null;
  window._tmPelaajaId = null;
  if ((window._pelaajaMap || {})[pid]) _phAvaaPelaaja(pid);
};
</script>
