  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

6B;   /* Re-assess — violetti */\n  --score1:   #8A2B2B;\n  --score2:   #7A5A10;\n  --score3:   #1A7A5E;\n}\n\n*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }\nhtml { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }\n\nbody {\n  background: var(--carbon);\n  color: var(--bone);\n  font-family: 'DM Sans', sans-serif;\n  font-size: 14px;\n  line-height: 1.6;\n  font-weight: 300;\n  min-height: 100vh;\n}\n\n/* ── TOP BAR ── */\n.topbar {\n  background: rgba(255,255,255,.04);\n  border-bottom: .5px solid rgba(255,255,255,.08);\n  padding: 12px 20px;\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  position: sticky;\n  top: 0;\n  z-index: 100;\n  backdrop-filter: blur(12px);\n}\n.tb-logo {\n  font-family: 'Cormorant Garamond', serif;\n  font-size: 13px;\n  font-weight: 400;\n  letter-spacing: .08em;\n  color: rgba(242,239,230,.5);\n}\n.tb-title {\n  font-size: 10px;\n  font-weight: 500;\n  letter-spacing: .2em;\n  text-transform: uppercase;\n  color: rgba(242,239,230,.35);\n}\n\n/* ── TASO SELECTOR ── */\n.level-tabs {\n  display: grid;\n  grid-template-columns: 1fr 1fr 1fr;\n  gap: 1px;\n  background: rgba(255,255,255,.06);\n  margin: 0;\n}\n.level-tab {\n  padding: 14px 8px;\n  text-align: center;\n  cursor: pointer;\n  transition: background .15s;\n  border: none;\n  background: rgba(255,255,255,.03);\n  color: rgba(242,239,230,.35);\n}\n.level-tab:hover { background: rgba(255,255,255,.07); }\n.level-tab.active {\n  background: rgba(26,122,94,.2);\n  color: var(--bone);\n}\n.lt-num {\n  font-family: 'Cormorant Garamond', serif;\n  font-size: 28px;\n  font-weight: 300;\n  line-height: 1;\n  display: block;\n  margin-bottom: 4px;\n}\n.lt-label {\n  font-size: 9px;\n  font-weight: 500;\n  letter-spacing: .16em;\n  text-transform: uppercase;\n  display: block;\n  margin-bottom: 2px;\n}\n.lt-age {\n  font-size: 9px;\n  opacity: .6;\n  font-family: 'DM Mono', monospace;\n  display: block;\n}\n.level-tab.active .lt-num { color: var(--teal-d); }\n.level-tab.active .lt-label { color: var(--bone); }\n\n/* ── TASO VIEW ── */\n.level-view { display: none; }\n.level-view.active { display: block; }\n\n/* ── HEADER STRIP ── */\n.card-header {\n  padding: 20px 20px 16px;\n  border-bottom: .5px solid rgba(255,255,255,.08);\n}\n.card-header-top {\n  display: flex;\n  align-items: flex-start;\n  justify-content: space-between;\n  margin-bottom: 12px;\n}\n.ch-badge {\n  font-size: 9px;\n  font-weight: 500;\n  letter-spacing: .2em;\n  text-transform: uppercase;\n  color: var(--teal-d);\n  background: rgba(26,122,94,.15);\n  border: .5px solid rgba(40,176,144,.25);\n  padding: 4px 10px;\n  border-radius: 2px;\n}\n.ch-date {\n  font-family: 'DM Mono', monospace;\n  font-size: 10px;\n  color: rgba(242,239,230,.3);\n  padding-top: 3px;\n}\n.card-header h2 {\n  font-family: 'Cormorant Garamond', serif;\n  font-size: 26px;\n  font-weight: 300;\n  line-height: 1.1;\n  color: var(--bone);\n  margin-bottom: 6px;\n}\n.card-header p {\n  font-size: 12px;\n  color: rgba(242,239,230,.45);\n  line-height: 1.6;\n}\n\n/* ── META FIELDS ── */\n.meta-fields {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 1px;\n  background: rgba(255,255,255,.06);\n  margin: 0 0 1px;\n}\n.meta-field {\n  background: var(--carbon);\n  padding: 12px 16px;\n}\n.mf-label {\n  font-size: 9px;\n  font-weight: 500;\n  letter-spacing: .18em;\n  text-transform: uppercase;\n  color: rgba(242,239,230,.3);\n  margin-bottom: 6px;\n}\n.mf-input {\n  width: 100%;\n  background: rgba(255,255,255,.05);\n  border: .5px solid rgba(255,255,255,.1);\n  border-radius: 2px;\n  padding: 8px 10px;\n  font-family: 'DM Sans', sans-serif;\n  font-size: 13px;\n  font-weight: 300;\n  color: var(--bone);\n  outline: none;\n  transition: border-color .15s;\n  -webkit-appearance: none;\n}\n.mf-input:focus { border-color: rgba(40,176,144,.5); }\n.mf-input::placeholder { color: rgba(242,239,230,.2); }\nselect.mf-input option { background: #2a2a28; color: var(--bone); }\n\n/* ── PELIVAIHE — kanoninen 4 universaalia + erikoistilanne ── */\n.phase-strip {\n  padding: 14px 16px 12px;\n  background: rgba(255,255,255,.04);\n  border-bottom: .5px solid rgba(255,255,255,.06);\n}\n.phase-strip-label {\n  font-size: 9px;\n  letter-spacing: .14em;\n  text-transform: uppercase;\n  color: rgba(242,239,230,.55);\n  margin-bottom: 8px;\n  font-weight: 500;\n}\n.phase-strip-grid {\n  display: grid;\n  grid-template-columns: repeat(5, 1fr);\n  gap: 6px;\n}\n.phase-pill {\n  padding: 10px 8px;\n  border: .5px solid rgba(255,255,255,.10);\n  background: rgba(255,255,255,.02);\n  color: rgba(242,239,230,.85);\n  border-radius: 3px;\n  cursor: pointer;\n  font-family: inherit;\n  font-size: 11.5px;\n  font-weight: 500;\n  letter-spacing: .02em;\n  text-align: center;\n  transition: all .12s ease;\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  gap: 3px;\n  line-height: 1.2;\n}\n.phase-pill .pp-en {\n  font-size: 9px;\n  letter-spacing: .12em;\n  text-transform: uppercase;\n  color: rgba(242,239,230,.4);\n  font-weight: 400;\n}\n.phase-pill:hover {\n  background: rgba(255,255,255,.06);\n  border-color: rgba(255,255,255,.18);\n}\n.phase-pill.active {\n  background: rgba(40,176,144,.18);\n  border-color: rgba(40,176,144,.55);\n  color: var(--bone);\n}\n.phase-pill.active .pp-en { color: rgba(94,201,168,.85); }\n\n/* KPI-tarkennusrivi — taittuva, vapaaehtoinen */\n.kpi-detail {\n  margin-top: 10px;\n  padding: 0;\n  background: transparent;\n}\n.kpi-toggle {\n  display: flex;\n  align-items: center;\n  gap: 6px;\n  padding: 6px 0;\n  background: none;\n  border: none;\n  color: rgba(242,239,230,.55);\n  font-family: inherit;\n  font-size: 10.5px;\n  letter-spacing: .08em;\n  text-transform: uppercase;\n  cursor: pointer;\n}\n.kpi-toggle:hover { color: rgba(242,239,230,.85); }\n.kpi-toggle .kt-chev { transition: transform .15s; font-size: 9px; opacity: .55; }\n.kpi-toggle.open .kt-chev { transform: ro 3);\n  color: var(--teal-d);\n  cursor: default;\n}\n\n/* ── TASO 1 erityinen — yksinkertaisempi ── */\n.t1-observe {\n  padding: 16px 20px;\n}\n.t1-obs-label {\n  font-size: 9px;\n  font-weight: 500;\n  letter-spacing: .18em;\n  text-transform: uppercase;\n  color: rgba(242,239,230,.3);\n  margin-bottom: 10px;\n}\n.t1-checkboxes { display: flex; flex-direction: column; gap: 8px; }\n.t1-cb {\n  display: flex;\n  align-items: flex-start;\n  gap: 12px;\n  padding: 10px 14px;\n  background: rgba(255,255,255,.03);\n  border: .5px solid rgba(255,255,255,.07);\n  border-radius: 3px;\n  cursor: pointer;\n  transition: all .15s;\n  -webkit-tap-highlight-color: transparent;\n}\n.t1-cb:hover { background: rgba(255,255,255,.06); }\n.t1-cb.checked {\n  background: rgba(0,47,108,.2);\n  border-color: rgba(0,47,108,.4);\n}\n.t1-cb-box {\n  width: 20px;\n  height: 20px;\n  border: 1.5px solid rgba(255,255,255,.15);\n  border-radius: 3px;\n  flex-shrink: 0;\n  margin-top: 1px;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  font-size: 12px;\n  transition: all .15s;\n}\n.t1-cb.checked .t1-cb-box {\n  background: rgba(0,47,108,.5);\n  border-color: #7BA8E0;\n  color: #7BA8E0;\n}\n.t1-cb-text { font-size: 12px; color: rgba(242,239,230,.6); line-height: 1.5; }\n.t1-cb.checked .t1-cb-text { color: var(--bone); }\n\n/* ── INFO TOOLTIPS ── */\n.info-bar {\n  background: rgba(26,122,94,.08);\n  border-top: .5px solid rgba(26,122,94,.15);\n  padding: 12px 20px;\n  font-size: 11px;\n  color: rgba(94,201,168,.6);\n  line-height: 1.6;\n  font-style: italic;\n}\n\n/* ── PROGRESS DOTS ── */\n.progress-dots {\n  display: flex;\n  gap: 4px;\n  padding: 10px 20px;\n  justify-content: center;\n  border-bottom: .5px solid rgba(255,255,255,.05);\n}\n.pd { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.1); transition: background .2s; }\n.pd.done { background: var(--teal-d); }\n.pd.current { background: rgba(40,176,144,.5); }\n\n/* ── SCROLL hint ── */\n.scroll-hint {\n  text-align: center;\n  padding: 8px;\n  font-size: 10px;\n  color: rgba(242,239,230,.2);\n  font-family: 'DM Mono', monospace;\n}\n\n/* ── TULOSTUS ── */\n@media print {\n  body { background: white; color: black; }\n  .topbar, .level-tabs { display: none; }\n  .level-view { display: block !important; }\n  .phase-block { page-break-inside: avoid; }\n}\n\n/* ── PROGRESSIPALKKI ── */\n.prog-bar {\n  height: 4px;\n  background: rgba(255,255,255,.10);\n  overflow: hidden;\n}\n.prog-fill {\n  height: 100%;\n  width: 0%;\n  background: linear-gradient(90deg, #002F6C, #1A7A5E);\n  border-radius: 0 2px 2px 0;\n  transition: width .35s ease;\n}\n\n/* ── PARANNUS 3: TASO-NAPIT (Decide-osioon) ── */\n.lvl-row { display: flex; gap: 8px; }\n.lvl-btn {\n  flex: 1;\n  padding: 10px 6px;\n  border-radius: 8px;\n  border: 1px solid rgba(255,255,255,.12);\n  background: transparent;\n  color: rgba(242,239,230,.45);\n  font-family: 'DM Sans', sans-serif;\n  font-size: 11px;\n  cursor: pointer;\n  transition: all .2s;\n  text-align: center;\n  line-height: 1.4;\n}\n.lvl-btn b {\n  display: block;\n  font-size: 13px;\n  font-weight: 500;\n  color: rgba(242,239,230,.6);\n}\n.lvl-btn.sel {\n  border-color: #1A7A5E;\n  background: rgba(26,122,94,.15);\n  color: #28B090;\n}\n.lvl-btn.sel b { color: #28B090; }\n\n/* ── PARANNUS 4: ANALYYSITULOS ── */\n.result-box {\n  display: none;\n  background: rgba(26,122,94,.07);\n  border: 1px solid rgba(26,122,94,.25);\n  border-radius: 12px;\n  padding: 20px;\n  margin-top: 16px;\n}\n.result-box.show { display: block; }\n.res-header {\n  font-family: 'Cormorant Garamond', serif;\n  font-size: 15px;\n  font-weight: 500;\n  color: #28B090;\n  margin-bottom: 16px;\n  display: flex;\n  align-items: center;\n  gap: 8px;\n}\n.res-header::before {\n  content: '';\n  display: block;\n  width: 3px;\n  height: 18px;\n  background: #1A7A5E;\n  border-radius: 2px;\n  flex-shrink: 0;\n}\n.res-block {\n  margin-bottom: 12px;\n  padding-bottom: 12px;\n  border-bottom: .5px solid rgba(255,255,255,.07);\n}\n.res-block:last-of-type { border-bottom: none; margin-bottom: 0; }\n.res-label {\n  font-size: 9px;\n  font-family: 'DM Mono', monospace;\n  color: rgba(242,239,230,.35);\n  letter-spacing: .18em;\n  text-transform: uppercase;\n  margin-bottom: 4px;\n}\n.res-val {\n  font-size: 13px;\n  color: rgba(242,239,230,.8);\n  line-height: 1.6;\n}\n.res-val strong { color: #28B090; }\n.narr-box {\n  background: rgba(9,12,18,.35);\n  border-radius: 8px;\n  padding: 12px;\n  font-size: 12px;\n  line-height: 1.7;\n  color: rgba(242,239,230,.7);\n  font-style: italic;\n  border-left: 3px solid #1A7A5E;\n}\n.res-btn-row {\n  display: flex;\n  gap: 10px;\n  margin-top: 16px;\n}\n.res-btn {\n  flex: 1;\n  padding: 11px;\n  border-radius: 8px;\n  border: 1px solid rgba(255,255,255,.12);\n  background: transparent;\n  color: rgba(242,239,230,.5);\n  font-family: 'DM Sans', sans-serif;\n  font-size: 12px;\n  font-weight: 500;\n  cursor: pointer;\n  transition: all .2s;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: 6px;\n}\n.res-btn:hover {\n  border-color: #1A7A5E;\n  color: #28B090;\n}\n\n/* ── PARANNUS 6: ADAR-VÄRIKOODAUS (kirjaimet) ── */\n.ph-a  { background: rgba(0,47,108,.25) !important; color: #4A7ED9 !important; }\n.ph-d  { background: rgba(138,90,16,.25) !important; color: #C8882A !important; }\n.ph-ac { background: rgba(138,43,43,.22) !important; color: #E07070 !important; }\n.ph-r  { background: rgba(26,122,94,.22) !important; color: #28B090 !important; }\n\n\n/* ══ PIKASYÖTTÖ-TILA ══════════════════════════════════════════ */\n.pika-toggle {\n  display: flex;\n  align-items: center;\n  gap: 6px;\n  padding: 6px 14px;\n  border-radius: 20px;\n  border: 1px solid rgba(26,122,94,.4);\n  background: transparent;\n  color: #28B090;\n  font-family: 'DM Mono', monospace;\n  font-size: 10px;\n  font-weight: 500;\n  letter-spacing: .12em;\n  cursor: pointer;\n  transition: all .2s;\n}\n.pi .04);\n  color: rgba(242,239,230,.7);\n  font-family: 'DM Sans', sans-serif;\n  font-size: 12px;\n  font-weight: 500;\n  cursor: pointer;\n  text-align: left;\n  line-height: 1.35;\n  transition: all .15s;\n  min-height: 52px; /* 48px+ kosketusalue */\n}\n.pika-pelaaja-btn .pp-joukkue {\n  display: block;\n  font-size: 10px;\n  color: rgba(242,239,230,.35);\n  margin-top: 2px;\n  font-weight: 400;\n}\n.pika-pelaaja-btn.sel {\n  border-color: #1A7A5E;\n  background: rgba(26,122,94,.15);\n  color: rgba(242,239,230,.95);\n}\n\n/* ADAR-napit — isot, helppokäyttöiset */\n.pika-adar-grid {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 10px;\n}\n.pika-adar-btn {\n  padding: 18px 12px;\n  border-radius: 12px;\n  border: 2px solid transparent;\n  cursor: pointer;\n  text-align: center;\n  transition: all .18s;\n  font-family: 'DM Sans', sans-serif;\n  min-height: 72px; /* hyvä kosketusalue */\n}\n.pika-adar-btn .pa-kirjain {\n  font-family: 'Cormorant Garamond', serif;\n  font-size: 28px;\n  font-weight: 400;\n  line-height: 1;\n  display: block;\n  margin-bottom: 4px;\n}\n.pika-adar-btn .pa-nimi {\n  font-size: 10px;\n  letter-spacing: .08em;\n  font-family: 'DM Mono', monospace;\n}\n.pika-adar-btn.pa-a  { border-color: rgba(74,126,217,.3);  background: rgba(74,126,217,.08);  color: #4A7ED9; }\n.pika-adar-btn.pa-d  { border-color: rgba(200,136,42,.3);  background: rgba(200,136,42,.08);  color: #C8882A; }\n.pika-adar-btn.pa-ac { border-color: rgba(224,112,112,.3); background: rgba(224,112,112,.08); color: #E07070; }\n.pika-adar-btn.pa-r  { border-color: rgba(40,176,144,.3);  background: rgba(40,176,144,.08);  color: #28B090; }\n.pika-adar-btn.sel.pa-a  { background: rgba(74,126,217,.22);  border-color: #4A7ED9; }\n.pika-adar-btn.sel.pa-d  { background: rgba(200,136,42,.22);  border-color: #C8882A; }\n.pika-adar-btn.sel.pa-ac { background: rgba(224,112,112,.22); border-color: #E07070; }\n.pika-adar-btn.sel.pa-r  { background: rgba(40,176,144,.22);  border-color: #28B090; }\n\n/* Piste-napit — isot */\n.pika-piste-grid {\n  display: grid;\n  grid-template-columns: 1fr 1fr 1fr;\n  gap: 10px;\n}\n.pika-piste-btn {\n  padding: 20px 8px;\n  border-radius: 12px;\n  border: 2px solid rgba(255,255,255,.12);\n  background: transparent;\n  cursor: pointer;\n  text-align: center;\n  transition: all .18s;\n  font-family: 'DM Mono', monospace;\n  min-height: 72px;\n}\n.pika-piste-btn .pp-num {\n  display: block;\n  font-size: 24px;\n  font-weight: 500;\n  color: rgba(242,239,230,.8);\n  line-height: 1;\n  margin-bottom: 4px;\n}\n.pika-piste-btn .pp-label {\n  font-size: 9px;\n  letter-spacing: .1em;\n  color: rgba(242,239,230,.35);\n}\n.pika-piste-btn.sel {\n  border-color: #28B090;\n  background: rgba(26,122,94,.18);\n}\n.pika-piste-btn.sel .pp-num { color: #28B090; }\n.pika-piste-btn.sel .pp-label { color: rgba(40,176,144,.7); }\n\n/* Pikatallennusnappi */\n.pika-submit {\n  width: 100%;\n  padding: 18px;\n  border-radius: 14px;\n  border: none;\n  background: #1A7A5E;\n  color: rgba(242,239,230,.95);\n  font-family: 'DM Sans', sans-serif;\n  font-size: 15px;\n  font-weight: 500;\n  cursor: pointer;\n  transition: all .2s;\n  margin-top: 6px;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: 8px;\n}\n.pika-submit:hover { background: #28B090; }\n.pika-submit:disabled {\n  background: rgba(255,255,255,.08);\n  color: rgba(242,239,230,.3);\n  cursor: not-allowed;\n}\n\n/* ══ OFFLINE-MERKINNÄT ════════════════════════════════════════ */\n.offline-badge {\n  display: none;\n  align-items: center;\n  gap: 5px;\n  padding: 3px 10px;\n  border-radius: 20px;\n  background: rgba(138,90,16,.2);\n  border: 1px solid rgba(200,136,42,.3);\n  color: #C8882A;\n  font-size: 9px;\n  font-family: 'DM Mono', monospace;\n  letter-spacing: .1em;\n}\n.offline-badge.show { display: flex; }\n.offline-badge .ob-dot {\n  width: 5px;\n  height: 5px;\n  border-radius: 50%;\n  background: #C8882A;\n}\n\n/* Offline-jono-indikaattori */\n.offline-queue {\n  display: none;\n  background: rgba(138,90,16,.12);\n  border: 1px solid rgba(200,136,42,.2);\n  border-radius: 10px;\n  padding: 12px 16px;\n  margin: 10px 0;\n  font-size: 12px;\n  color: rgba(242,239,230,.6);\n  font-family: 'DM Sans', sans-serif;\n}\n.offline-queue.show { display: block; }\n.offline-queue strong { color: #C8882A; }\n\n/* ══ MOBIILIOPTIMOINTIA ─────────────────────────────────────── */\n/* Varmistetaan riittävät kosketusalueet (min 48px) */\n.score-btn {\n  min-height: 52px !important;\n  padding: 12px 8px !important;\n}\n.lvl-btn {\n  min-height: 52px !important;\n}\n.save-btn {\n  min-height: 52px !important;\n  padding: 15px !important;\n}\n\n\n/* ══ TEEMAKYTKIN ═══════════════════════════════════════════════ */\n/* Oletus: tumma. data-theme=\"light\" vaihtaa vaaleaksi. */\n:root[data-theme=\"light\"] {\n  --bg-page:     #F7F6F2;\n  --bg-card:     #FFFFFF;\n  --bg-card2:    #EFEDE8;\n  --ink:         #1C1C1A;\n  --ink2:        rgba(28,28,26,.65);\n  --ink3:        rgba(28,28,26,.38);\n  --border:      rgba(28,28,26,.10);\n  --border2:     rgba(28,28,26,.18);\n  --teal:        #0F6E56;\n  --teal-d:      #1D9E75;\n  --score1:      #712B13;\n  --score2:      #633806;\n  --score3:      #085041;\n  /* Ylikirjoitetaan tumman teeman muuttujat */\n  --carbon:      #F7F6F2;  /* tumma tausta → vaalea tausta */\n  --bone:        #1C1C1A;  /* vaalea teksti → tumma teksti */\n  --surface:     #FFFFFF;\n  --slate:       rgba(28,28,26,.55);\n  --border-dark: rgba(28,28,26,.10);\n}\n\n:root[data-theme=\"light\"] body {\n  background: var(--bg-page);\n  color: var(--ink);\n}\n\n:root[data-theme=\"light\"] .topbar {\n  background: var(--bg-page);\n  border-bottom: .5px solid var(--border2);\n}\n\n:root[data-theme=\"light\"] .tb-logo { color: var(--ink3); }\n\n:root[data-theme=\"light\"] .level-tabs {\n  background: var(--border);\n}\n\n:root[data-theme=\"light\"] .level-tab {\n  background: var(--bg-card2);\n  color: var(--ink3);\n}\n\n:roo ant;\n    font-size: 15px !important;\n  }\n\n  .level-tab {\n    padding: 10px 4px !important;\n  }\n\n  .lt-label {\n    font-size: 9px !important;\n  }\n}\n\n/* ══ CHECKBOXIT → 2×2 NAPPIRUUDUKKO ════════════════════════════ */\n.t1-cb-grid {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 8px;\n  padding: 4px 0;\n}\n\n.t1-cb-btn {\n  border-radius: 12px;\n  border: 1.5px solid rgba(255,255,255,.10);\n  background: rgba(255,255,255,.04);\n  padding: 12px 10px;\n  cursor: pointer;\n  text-align: left;\n  transition: all .15s;\n  min-height: 68px;\n  display: flex;\n  flex-direction: column;\n  justify-content: center;\n}\n\n.t1-cb-btn.checked {\n  border-color: #1A7A5E;\n  background: rgba(26,122,94,.15);\n}\n\n/* Kehityskohde (nappi 4) — amber */\n.t1-cb-btn.warn-style {\n  border-color: rgba(200,136,42,.30);\n  background: rgba(200,136,42,.08);\n}\n\n.t1-cb-btn.warn-style.checked {\n  border-color: #C8882A;\n  background: rgba(200,136,42,.22);\n}\n\n:root[data-theme=\"light\"] .t1-cb-btn {\n  background: #FFFFFF;\n  border-color: rgba(28,28,26,.10);\n}\n\n:root[data-theme=\"light\"] .t1-cb-btn.checked {\n  background: #E1F5EE;\n  border-color: #0F6E56;\n}\n\n:root[data-theme=\"light\"] .t1-cb-btn.warn-style {\n  background: #FAEEDA;\n  border-color: rgba(99,56,6,.25);\n}\n\n:root[data-theme=\"light\"] .t1-cb-btn.warn-style.checked {\n  background: #FAC775;\n  border-color: #854F0B;\n}\n\n.t1-btn-title {\n  font-size: 12px;\n  font-weight: 500;\n  color: rgba(242,239,230,.85);\n  display: block;\n  line-height: 1.3;\n  margin-bottom: 3px;\n}\n\n.t1-btn-desc {\n  font-size: 10px;\n  color: rgba(242,239,230,.4);\n  display: block;\n  line-height: 1.4;\n}\n\n:root[data-theme=\"light\"] .t1-btn-title { color: rgba(28,28,26,.85); }\n:root[data-theme=\"light\"] .t1-btn-desc  { color: rgba(28,28,26,.45); }\n\n.t1-cb-btn.checked .t1-btn-title { color: #28B090; }\n.t1-cb-btn.checked .t1-btn-desc  { color: rgba(40,176,144,.6); }\n.t1-cb-btn.warn-style .t1-btn-title { color: #C8882A; }\n.t1-cb-btn.warn-style .t1-btn-desc  { color: rgba(200,136,42,.6); }\n\n:root[data-theme=\"light\"] .t1-cb-btn.checked .t1-btn-title { color: #085041; }\n:root[data-theme=\"light\"] .t1-cb-btn.warn-style .t1-btn-title { color: #633806; }\n\n\n/* ── VAALEA TEEMA: meta-field korjaus ── */\n:root[data-theme=\"light\"] .meta-field {\n  background: var(--bg-page, #F7F6F2) !important;\n}\n\n:root[data-theme=\"light\"] .meta-fields {\n  background: var(--bg-page, #F7F6F2) !important;\n}\n\n:root[data-theme=\"light\"] .mf-label {\n  color: rgba(28,28,26,.5) !important;\n  font-size: 10px !important;\n}\n\n/* ── VAALEA TEEMA: card-content, section-block taustat ── */\n:root[data-theme=\"light\"] .level-view {\n  background: #F7F6F2;\n}\n\n:root[data-theme=\"light\"] .card-section {\n  background: #F7F6F2;\n}\n\n/* ── VAALEA TEEMA: teal-tekstit tummemmiksi ── */\n:root[data-theme=\"light\"] .ch-badge {\n  color: #085041 !important;\n  background: rgba(8,80,65,.1) !important;\n  border-color: rgba(8,80,65,.25) !important;\n}\n\n:root[data-theme=\"light\"] .ch-date {\n  color: rgba(28,28,26,.45) !important;\n}\n\n:root[data-theme=\"light\"] .card-header-top .sect-link {\n  color: #085041 !important;\n}\n\n/* ── ONGELMA 2: score-buttons ylivuoto mobiilissa ── */\n/* score-buttons on flex-row, mutta flex-itemit eivät skaalaudu kapealla */\n@media (max-width: 480px) {\n  .score-buttons {\n    flex-direction: column !important;\n    gap: 6px !important;\n  }\n\n  .score-btn {\n    min-height: 60px !important;\n    display: flex !important;\n    align-items: center !important;\n    gap: 12px !important;\n    text-align: left !important;\n  }\n\n  /* Piste-numero vasemmalle, teksti oikealle */\n  .score-btn .sbn {\n    font-size: 22px !important;\n    min-width: 32px !important;\n    flex-shrink: 0;\n  }\n\n  .score-btn .sbl {\n    font-size: 13px !important;\n  }\n\n  .score-btn .sbd {\n    font-size: 11px !important;\n  }\n}\n\n/* ── ONGELMA 3: vaalea teema FFFFF !important;\n  border-color: rgba(28,28,26,.12) !important;\n  color: rgba(28,28,26,.5) !important;\n}\n\n:root[data-theme=\"light\"] .lvl-btn b { color: rgba(28,28,26,.7) !important; }\n\n:root[data-theme=\"light\"] .lvl-btn.sel {\n  background: #E1F5EE !important;\n  border-color: #0F6E56 !important;\n  color: #0F6E56 !important;\n}\n\n:root[data-theme=\"light\"] .lvl-btn.sel b { color: #085041 !important; }\n\n/* ── VAALEA TEEMA: ctx-btn kontekstinapit ── */\n:root[data-theme=\"light\"] .ctx-btn {\n  background: #FFFFFF !important;\n  border-color: rgba(28,28,26,.12) !important;\n  color: rgba(28,28,26,.55) !important;\n}\n\n:root[data-theme=\"light\"] .ctx-btn.active {\n  background: #E1F5EE !important;\n  border-color: #0F6E56 !important;\n  color: #085041 !important;\n}\n\n/* ── VAALEA TEEMA: phase-letter värit ── */\n:root[data-theme=\"light\"] .phase-letter { opacity: 1 !important; }\n\n/* ── VAALEA TEEMA: level-tab inactive ── */\n:root[data-theme=\"light\"] .level-tab .lt-num {\n  color: rgba(28,28,26,.35) !important;\n}\n\n:root[data-theme=\"light\"] .level-tab.active .lt-num {\n  color: #0F6E56 !important;\n}\n\n:root[data-theme=\"light\"] .level-tab .lt-label {\n  color: rgba(28,28,26,.45) !important;\n}\n\n:root[data-theme=\"light\"] .level-tab.active .lt-label {\n  color: #085041 !important;\n  font-weight: 500;\n}\n\n:root[data-theme=\"light\"] .level-tab .lt-age {\n  color: rgba(28,28,26,.3) !important;\n}\n\n\n/* ══ ADAR VISION — KUVA HAVAINTOON ══════════════════════════════════════════ */\n\n/* Kuvalatausalue joka ilmestyy Tallenna-napin yläpuolelle */\n.kuva-alue {\n  margin-bottom: 12px;\n}\n\n.kuva-nappi {\n  width: 100%;\n  padding: 13px;\n  border-radius: 10px;\n  border: 1.5px dashed rgba(26,122,94,.35);\n  background: rgba(26,122,94,.04);\n  color: rgba(242,239,230,.55);\n  font-family: 'DM Sans', sans-serif;\n  font-size: 13px;\n  cursor: pointer;\n  transition: all .2s;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: 8px;\n}\n\n.kuva-nappi:hover {\n  border-color: rgba(26,122,94,.6);\n  background: rgba(26,122,94,.09);\n  color: rgba(242,239,230,.8);\n}\n\n:root[data-theme=\"light\"] .kuva-nappi {\n  border-color: rgba(15,110,86,.3);\n  background: rgba(15,110,86,.04);\n  color: rgba(28,28,26,.5);\n}\n\n:root[data-theme=\"light\"] .kuva-nappi:hover {\n  border-color: rgba(15,110,86,.6);\n  background: rgba(15,110,86,.08);\n  color: rgba(28,28,26,.8);\n}\n\n/* Esikatselukuva kun kuva on valittu */\n.kuva-esikatselu-wrap {\n  position: relative;\n  border-radius: 10px;\n  overflow: hidden;\n  margin-bottom: 8px;\n  display: none;\n}\n\n.kuva-esikatselu-wrap.nakyy { display: block; }\n\n.kuva-esikatselu {\n  width: 100%;\n  max-height: 180px;\n  object-fit: cover;\n  border-radius: 10px;\n  display: block;\n}\n\n.kuva-poista {\n  position: absolute;\n  top: 8px; right: 8px;\n  width: 28px; height: 28px;\n  border-radius: 50%;\n  background: rgba(9,12,18,.75);\n  border: 1px solid rgba(255,255,255,.2);\n  color: rgba(242,239,230,.7);\n  font-size: 14px;\n  cursor: pointer;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  line-height: 1;\n}\n\n.kuva-poista:hover { background: rgba(9,12,18,.9); }\n\n.kuva-ai-merkki {\n  position: absolute;\n  bottom: 8px; left: 8px;\n  background: rgba(9,12,18,.75);\n  border: 1px solid rgba(26,122,94,.4);\n  color: #28B090;\n  font-size: 9px;\n  font-family: 'DM Mono', monospace;\n  letter-spacing: .1em;\n  padding: 3px 8px;\n  border-radius: 20px;\n}\n\n/* AI-narratiivin latausmerkki */\n.ai-lataa {\n  display: none;\n  align-items: center;\n  gap: 8px;\n  padding: 10px 12px;\n  background: rgba(26,122,94,.07);\n  border: 1px solid rgba(26,122,94,.2);\n  border-radius: 8px;\n  font-size: 11px;\n  color: rgba(242,239,230,.55);\n  font-family: 'DM Mono', monospace;\n  margin-top: 8px;\n}\n\n.ai-lataa.nakyy { display: flex; }\n\n.ai-lataa-piste {\n  width: 6px; height: 6px;\n  border-radius: 50%;\n  background: #1A7A5E;\n  animation: ai-pulssi 1.2s ease-in-out infinite;\n}\n\n@keyframes ai-pulssi {\n  0%, 100% { opacity: .3; transform: scale(.8); }\n  50%       { opacity: 1;  transform: scale(1.2); }\n}\n\n/* AI-narratiivin tulos */\n.ai-narratiivi-tulos {\n  display: none;\n  background: rgba(26,122,94,.08);\n  border: 1px solid rgba(26,122,94,.2);\n  border-left: 3px solid #1A7A5E;\n  border-radius: 8px;\n  padding: 12px 14px;\n  margin-top: 8px;\n  font-size: 12px;\n  color: rgba(242,239,230,.75);\n  line-height: 1.65;\n  font-style: italic;\n}\n\n.ai-narratiivi-tulos.nakyy { display: block; }\n\n.ai-narratiivi-label {\n  font-size: 9px;\n  font-family: 'DM Mono', monospace;\n  color: #1A7A5E;\n  letter-spacing: .12em;\n  margin-bottom: 6px;\n  font-style: normal;\n}\n\n/* ════════════════════════════════════════════════════════════════════\n   AUDIT FIX — kontrasti & ulkokäyttö (kenttätestin korjaukset)\n   Päivämäärä: 04/2026 · Audit: ADAR Pikakortti — Visuaalinen audit.html\n\n   Ratkaisee 23 WCAG-rajojen alle jäänyttä teksti–tausta-paria.\n   Strategia:\n     1) rgba-alpha-tekstit → opaakit hex-tokenit\n     2) Body 300 → 400 (kentällä luettavuus)\n     3) Score-numero värittyy valittuna (1=red, 2=amber, 3=green)\n     4) Vaalean teeman kirjainnapit solid fill\n     5) Save-button #0F6E56 myös darkissa (parempi kontrastimaa)\n\n   Tämä blokki on tarkoituksella loppupuolella: voitetaan\n   spesifisyyskilpailu identtisillä selektoreilla.\n   ════════════════════════════════════════════════════════════════════ */\n\n/* ── 1. OPAAKIT TEKSTI-TOKENIT — DARK TEEMA ──────────────────────── */\n:root {\n  /* Tekstihierarkia darkissa — kaikki vähintään AA carbon-taustalla */\n  --ink-1: #F2EFE6;   /* primary — bone (AAA 14.84:1) */\n  --ink-2: #B8B5AE;   /* secondary — AA 7.62:1 (oli rgba .65) */\n  --ink-3: #8E8B83;   /* tertiary — AA 4.55:1 (oli rgba .35–.45) */\n  --ink-4: #6B6962;   /* dim — AA-large 3.04:1 (oli rgba .2–.3) — vain ikoneille */\n  --teal-deep: #0F6E56;  /* save-button kohdeväri — AA 5.97:1 valkoisella */\n}\n\n/* ── 2. BODY-PAINO ────────────────────────────────────────────────── */\nbody {\n  font-weight: 400 !important;   /* 300 → 400, ulkokäyttö */\n}\n.mf-input,\n.narr-ta {\n  font-weight: 400 !important;\n}\n\n/* ── 3. DARK TEEMA — kaikki rgba-tekstit opaakeiksi ──────────────── */\n.tb-logo                    { color: var(--ink-2) !important; }\n.tb-title                   { color: var(--ink-3) !important; }\n\n.lt-num                     { color: var(--ink-3) !important; }\n.lt-label                   { color: var(--ink-3) !important; }\n.lt-age                     { color: var(--ink-4) !important; }\n.level-tab.active .lt-num,\n.level-tab.active .lt-label { color: var(--bone) !important; }\n\n.ch-date                    { color: var(--ink-3) !important; }\n.card-header h2 em          { color: var(--ink-3) !important; font-style: normal; opacity: 1; }\n.card-header p              { color: var(--ink-2) !important; opacity: 1; }\n\n.mf-label                   { color: var(--ink-3) !important; }\n.mf-input::placeholder      { color: var(--ink-3) !important; opacity: 1; }   /* AA 4.20:1 input-bg:llä */\n\n.phase-q                    { color: var(--ink-3) !important; opacity: 1; }\n\n.signal-hint .sh-label      { color: var(--ink-3) !important; }\n.signal-hint .sh-item       { color: var(--ink-2) !important; opacity: 1; }\n\n.sum-title                  { color: var(--ink-3) !important; }\n.ssi-phase                  { color: var(--ink-2) !important; }\n.ssi-val                    { color: var(--ink-3) !important; }   /* — placeholder näkyväksi */\n.st-label                   { color: var(--ink-2) !important; }\n\n.scroll-hint                { color: var(--ink-3) !important; }\n.narr-label                 { color: var(--ink-2) !important; }\n.narr-ta::placeholder       { color: var(--ink-4) !important; opacity: 1; }\n\n.psyk-link                  { color: var(--ink-2) !important; opacity: 1; }\n.psyk-link strong           { color: var(--ink-1) !important; }\n\n.res-label                  { color: var(--ink-3) !important; }\n.res-val                    { color: var(--ink-1) !important; }\n\n/* ── 4. SCORE-PAINIKKEET — DARK ──────────────────────────────────── */\n/* Unselected: numero outline-väri, sbl ja sbd luettavat */\n.score-btn .sbl             { color: var(--ink-2) !important; opacity: 1; }\n.score-btn .sbd             { color: var(--ink-3) !important; opacity: 1; }\n\n/* Numero-laatikko: pyöreä tile myös unselected-tilassa, väri 1/2/3:n mukaan */\n.score-btn .sbn {\n  display: inline-flex !important;\n  align-items: center;\n  justify-content: center;\n  width: 36px;\n  height: 36px;\n  border-radius: 50%;\n  margin: 0 auto 6px !important;\n  font-weight: 400 !important;\n  border: 1.5px solid;\n  background: transparent;\n  transition: background .12s, color .12s, border-color .12s;\n}\n.score-btn.s1 .sbn          { color: #E07070 !important; border-color: rgba(224,112,112,.4); }\n.score-btn.s2 .sbn          { color: #D4B060 !important; border-color: rgba(212,176,96,.4); }\n.score-btn.s3 .sbn          { color: #5EC9A8 !important; border-color: rgba(94,201,168,.4); }\n\n/* Selected: numero täyttyy, kortin pohja-tausta vain hieman tinted */\n.score-btn.s1.selected .sbn { background: #E07070 !important; color: #1C0F0F !important; border-color: #E07070 !important; }\n.score-btn.s2.selected .sbn { background: #D4B060 !important; color: #1F180A !important; border-color: #D4B060 !important; }\n.score-btn.s3.selected .sbn { background: #5EC9A8 !important; color: #0A1F19 !important; border-color: #5EC9A8 !important; }\n\n.score-btn.s1.selected      { background: rgba(138,43,43,.18) !important; border-color: rgba(224,112,112,.45) !important; }\n.score-btn.s2.selected      { background: rgba(122,90,16,.18) !important; border-color: rgba(212,176,96,.45) !important; }\n.score-btn.s3.selected      { background: rgba(26,122,94,.18) !important; border-color: rgba(94,201,168,.45) !important; }\n\n.score-btn.selected .sbl    { color: var(--ink-1) !important; font-weight: 600 !important; }\n.score-btn.selected .sbd    { color: var(--ink-2) !important; }\n\n/* ── 5. SAVE-BUTTON — DARK ──────────────────────────────────────── */\n.save-btn {\n  background: #0F6E56 !important;   /* tummempi teal → 6.20:1 */\n  font-weight: 600 !important;\n}\n.save-btn:hover  { background: #128464 !important; }\n.save-btn:active { background: #0B5947 !important; }\n\n/* ── 6. PIKA OVERLAY ─────────────────────────────────────────────── */\n.pika-label                 { color: var(--ink-3) !important; }\n.pika-pelaaja-btn .pp-joukkue { color: var(--ink-3) !important; }\n.pika-piste-btn .pps-label  { color: var(--ink-3) !important; }\n.pika-adar-btn .pa-label    { color: var(--ink-3) !important; }\n\n/* ── 7. VAALEA TEEMA — opaakit ink-tokenit ─────────────────────── */\n:root[data-theme=\"light\"] {\n  --ink-1: #1C1C1A;          /* AAA 17.07:1 valkoisella */\n  --ink-2: #4F4D48;          /* AA 7.50:1 valkoisella (oli rgba .65) */\n  --ink-3: #6B6962;          /* AA 4.62:1 valkoisella (oli rgba .38) */\n  --ink-4: #8E8B83;          /* AA-large 3.05:1 — ikoneille (oli rgba .35) */\n}\n\n:root[data-theme=\"light\"] .tb-logo,\n:root[data-theme=\"light\"] .tb-title         { color: var(--ink-3) !important; }\n:root[data-theme=\"light\"] .lt-num           { color: var(--ink-3) !important; }\n:root[data-theme=\"light\"] .lt-label         { color: var(--ink-2) !important; }\n:root[data-theme=\"light\"] .lt-age           { color: var(--ink-3) !important; }\n:root[data-theme=\"light\"] .mf-label         { color: var(--ink-3) !important; }\n:root[data-theme=\"light\"] .mf-input::placeholder,\n:root[data-theme=\"light\"] .narr-ta::placeholder { color: var(--ink-3) !important; opacity: 1; }\n:root[data-theme=\"light\"] .phase-q          { color: var(--ink-3) !important; }\n:root[data-theme=\"light\"] .sh-label         { color: var(--ink-3) !important; }\n:root[data-theme=\"light\"] .sh-item          { color: var(--ink-2) !important; }\n:root[data-theme=\"light\"] .ch-date          { color: var(--ink-3) !important; }\n:root[data-theme=\"light\"] .scroll-hint      { color: var(--ink-3) !important; }\n:root[data-theme=\"light\"] .pika-label       { color: var(--ink-3) !important; }\n:root[data-theme=\"light\"] .ssi-phase        { color: var(--ink-2) !important; }\n:root[data-theme=\"light\"] .ssi-val          { color: var(--ink-3) !important; }\n:root[data-theme=\"light\"] .st-label         { color: var(--ink-2) !important; }\n\n/* ── 8. VAALEA TEEMA — kirjainnapit solid fill ──────────────────── */\n/* Korjaa A/D/Act/R -palikat: tinted bg → solid fill, valkoinen teksti */\n:root[data-theme=\"light\"] .phase-letter {\n  color: #FFFFFF !important;\n  border-color: transparent !important;\n}\n:root[data-theme=\"light\"] .phase-letter.ph-a  { background: #002F6C !important; }  /* AA 11.5:1 */\n:root[data-theme=\"light\"] .phase-letter.ph-d  { background: #7A4010 !important; }  /* AA 8.4:1 */\n:root[data-theme=\"light\"] .phase-letter.ph-ac { background: #8A2B2B !important; }  /* AA 8.1:1 */\n:root[data-theme=\"light\"] .phase-letter.ph-r  { background: #1A7A5E !important; }  /* AA 5.26:1 */\n\n/* Sama linja darkissa — varmistetaan että kaikki neljä menevät AA */\n.phase-letter {\n  font-weight: 600 !important;\n}\n\n/* ── 9. VAALEA TEEMA — score-painikkeet samaan kaavaan kuin dark ─ */\n:root[data-theme=\"light\"] .score-btn .sbn {\n  background: transparent;\n  border: 1.5px solid;\n}\n:root[data-theme=\"light\"] .score-btn.s1 .sbn { color: #8A2B2B !important; border-color: rgba(138,43,43,.35) !important; }\n:root[data-theme=\"light\"] .score-btn.s2 .sbn { color: #7A5A10 !important; border-color: rgba(122,90,16,.35) !important; }\n:root[data-theme=\"light\"] .score-btn.s3 .sbn { color: #0F6E56 !important; border-color: rgba(15,110,86,.35) !important; }\n\n:root[data-theme=\"light\"] .score-btn.s1.selected .sbn { background: #8A2B2B !important; color: #FFFFFF !important; border-color: #8A2B2B !important; }\n:root[data-theme=\"light\"] .score-btn.s2.selected .sbn { background: #7A5A10 !important; color: #FFFFFF !important; border-color: #7A5A10 !important; }\n:root[data-theme=\"light\"] .score-btn.s3.selected .sbn { background: #0F6E56 !important; color: #FFFFFF !important; border-color: #0F6E56 !important; }\n\n:root[data-theme=\"light\"] .score-btn.s1.selected { background: rgba(138,43,43,.06) !important; border-color: #8A2B2B !important; }\n:root[data-theme=\"light\"] .score-btn.s2.selected { background: rgba(122,90,16,.06) !important; border-color: #7A5A10 !important; }\n:root[data-theme=\"light\"] .score-btn.s3.selected { background: rgba(15,110,86,.06) !important; border-color: #0F6E56 !important; }\n\n:root[data-theme=\"light\"] .score-btn .sbl { color: var(--ink-2) !important; font-weight: 500 !important; }\n:root[data-theme=\"light\"] .score-btn .sbd { color: var(--ink-3) !important; }\n\n:root[data-theme=\"light\"] .score-btn.selected .sbl { color: var(--ink-1) !important; font-weight: 600 !important; }\n:root[data-theme=\"light\"] .score-btn.selected .sbd { color: var(--ink-2) !important; }\n\n/* ── 10. KOSKETUSALUEET — vahvempi rajaus ulkokäyttöön ─────────── */\n.score-btn,\n.t1-cb-btn,\n.lvl-btn,\n.ctx-btn,\n.pika-pelaaja-btn,\n.pika-piste-btn {\n  border-width: 1.5px !important;   /* 0.5–1px → 1.5px, näkyy auringossa */\n}\n\n/* ── 11. ITALIC-KURSIVOINTI POIS — luettavuus ulkona ───────────── */\n.phase-q,\n.card-header h2 em,\n.narr-label {\n  font-style: normal !important;\n}\n<\u002Fstyle>\n\n<!-- Firebase SDK — lisätty Porras 1 (P6) -->\n<script src=\"6cd5de1f-b45d-4303-95eb-b5c6be033b55\"><\u002Fscript>\n<script src=\"cf07eaff-3a42-4821-b0ed-7b2f4d47c288\"><\u002Fscript>\n<script src=\"c175c7ca-65fc-4fca-b42f-b4fed966c4eb\"><\u002Fscript>\n<script src=\"b0dac5e9-d9f0-410c-8183-3480aaf409fd\"><\u002Fscript>\n<\u002Fhead>\n<body>\n\n<!-- ══ PIKASYÖTTÖ-OVERLAY ══════════════════════════════════════\n     Kolme vaihetta: 1) Valitse pelaaja 2) Valitse ADAR 3) Pisteet\n     Tallentaa tila:'luonnos' — valmentaja voi täydentää myöhemmin\n     ═══════════════════════════════════════════════════════════ -->\n<div id=\"pika-view\">\n\n  <div class=\"pika-header\">\n    <div class=\"pika-title\">Pikakirjaus<\u002Fdiv>\n    <button class=\"pika-close\" onclick=\"_togglePika()\">×<\u002Fbutton>\n  <\u002Fdiv>\n\n  <!-- Vaihe-indikaattori: 3 palloa -->\n  <div class=\"pika-steps\">\n    <div class=\"pika-step-dot active\" id=\"ps-dot-1\"><\u002Fdiv>\n    <div class=\"pika-step-dot\" id=\"ps-dot-2\"><\u002Fdiv>\n    <div class=\"pika-step-dot\" id=\"ps-dot-3\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Vaihe 1: Pelaajan valinta -->\n  <div id=\"pika-step-1\">\n    <div class=\"pika-card\">\n      <div class=\"pika-label\">VAIHE 1 / 3 — VALITSE PELAAJA<\u002Fdiv>\n      <div class=\"pika-pelaaja-grid\" id=\"pika-pelaaja-grid\">\n        <!-- Täytetään dynaamisesti onAuthStateChanged:ssä -->\n        <div style=\"color:rgba(242,239,230,.3);font-size:12px;padding:12px;grid-column:1/-1;\">\n          Ladataan pelaajia...\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <button class=\"pika-submit\" id=\"pika-btn-1\" disabled=\"\" onclick=\"_pikaStep(2)\">\n      Jatka →\n    <\u002Fbutton>\n  <\u002Fdiv>\n\n  <!-- Vaihe 2: ADAR-valinta -->\n  <div id=\"pika-step-2\" style=\"display:none\">\n    <div class=\"pika-card\">\n      <div class=\"pika-label\">VAIHE 2 / 3 — MITÄ HAVAINNOITIIN?<\u002Fdiv>\n      <div class=\"pika-adar-grid\">\n        <button class=\"pika-adar-btn pa-a\" data-adar=\"A\" onclick=\"_pikaAdar('A',this)\">\n          <span class=\"pa-kirjain\">A<\u002Fspan>\n          <span class=\"pa-nimi\">ASSESS<\u002Fspan>\n        <\u002Fbutton>\n        <button class=\"pika-adar-btn pa-d\" data-adar=\"D\" onclick=\"_pikaAdar('D',this)\">\n          <span class=\"pa-kirjain\">D<\u002Fspan>\n          <span class=\"pa-nimi\">DECIDE<\u002Fspan>\n        <\u002Fbutton>\n        <button class=\"pika-adar-btn pa-ac\" data-adar=\"Act\" onclick=\"_pikaAdar('Act',this)\">\n          <span class=\"pa-kirjain\">A<\u002Fspan>\n          <span class=\"pa-nimi\">ACT<\u002Fspan>\n        <\u002Fbutton>\n        <button class=\"pika-adar-btn pa-r\" data-adar=\"R\" onclick=\"_pikaAdar('R',this)\">\n          <span class=\"pa-kirjain\">R<\u002Fspan>\n          <span class=\"pa-nimi\">RE-ASSESS<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:8px;margin-top:6px;\">\n      <button class=\"pika-submit\" style=\"flex:0 0 48px;padding:0;background:rgba(255,255,255,.06);font-size:18px;\" onclick=\"_pikaStep(1)\">←<\u002Fbutton>\n      <button class=\"pika-submit\" id=\"pika-btn-2\" disabled=\"\" onclick=\"_pikaStep(3)\" style=\"flex:1;\">\n        Jatka →\n      <\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Vaihe 3: Pisteet + tallenna -->\n  <div id=\"pika-step-3\" style=\"display:none\">\n    <div class=\"pika-card\">\n      <div class=\"pika-label\">VAIHE 3 / 3 — PISTEET<\u002Fdiv>\n      <div id=\"pika-piste-ohje\" style=\"font-size:11px;color:rgba(242,239,230,.4);margin-bottom:12px;font-family:'DM Mono',monospace;\"><\u002Fdiv>\n      <div class=\"pika-piste-grid\">\n        <button class=\"pika-piste-btn\" data-piste=\"1\" onclick=\"_pikaPiste(1,this)\">\n          <span class=\"pp-num\">1<\u002Fspan>\n          <span class=\"pp-label\">KEHITETTÄVÄÄ<\u002Fspan>\n        <\u002Fbutton>\n        <button class=\"pika-piste-btn\" data-piste=\"2\" onclick=\"_pikaPiste(2,this)\">\n          <span class=\"pp-num\">2<\u002Fspan>\n          <span class=\"pp-label\">KEHITTYVÄ<\u002Fspan>\n        <\u002Fbutton>\n        <button class=\"pika-piste-btn\" data-piste=\"3\" onclick=\"_pikaPiste(3,this)\">\n          <span class=\"pp-num\">3<\u002Fspan>\n          <span class=\"pp-label\">HALLITSEE<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Offline-jono-indikaattori -->\n    <div class=\"offline-queue\" id=\"pika-offline-note\">\n      <strong>Offline-tila<\u002Fstrong> — merkintä tallennetaan paikallisesti\n      ja synkronoidaan kun yhteys palaa.\n    <\u002Fdiv>\n\n    <div style=\"display:flex;gap:8px;margin-top:6px;\">\n      <button class=\"pika-submit\" style=\"flex:0 0 48px;padding:0;background:rgba(255,255,255,.06);font-size:18px;\" onclick=\"_pikaStep(2)\">←<\u002Fbutton>\n      <button class=\"pika-submit\" id=\"pika-btn-3\" disabled=\"\" onclick=\"_pikaTallenna()\" style=\"flex:1;\">\n        Tallenna luonnos\n      <\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n<!-- ══ /PIKASYÖTTÖ-OVERLAY ══════════════════════════════════ -->\n\n<!-- Progressipalkki -->\n<div class=\"prog-bar\"><div class=\"prog-fill\" id=\"tm-prog-fill\"><\u002Fdiv><\u002Fdiv>\n\n<!-- Kirjautumisbanneri — näkyy kun ei ole kirjautunut -->\n<div id=\"tm-login-banner\" style=\"\n  display:flex; align-items:center; justify-content:center;\n  position:fixed; inset:0; z-index:9000;\n  background:rgba(28,28,26,.92); backdrop-filter:blur(8px);\n  flex-direction:column; gap:16px; padding:32px; text-align:center;\">\n  <div style=\"font-family:'Cormorant Garamond',serif;font-size:22px;color:#F2EFE6;\">\n    TalentMaster™\n  <\u002Fdiv>\n  <div style=\"font-size:13px;color:rgba(242,239,230,.6);max-width:320px;line-height:1.6;\">\n    Kirjaudu sisään tallentaaksesi havaintoja Firestoreen.<br>\n    Lomaketta voi täyttää ilman kirjautumista.\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:10px;width:100%;max-width:280px;margin-top:8px;\">\n    <input id=\"tm-login-email\" type=\"email\" placeholder=\"Sähköposti\" style=\"background:rgba(255,255,255,.08);border:.5px solid rgba(255,255,255,.15);\n      border-radius:6px;padding:12px 16px;color:#F2EFE6;font-size:14px;outline:none;\">\n    <input id=\"tm-login-pass\" type=\"password\" placeholder=\"Salasana\" style=\"background:rgba(255,255,255,.08);bo
