<!doctype html>
<html lang="fi" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TalentMaster™ — VP + TD v20</title>
<link rel="stylesheet" href="colors_and_type.css">

<!-- TalentMaster Bus + VP Adapter -->
<script src="tm-bus.js?v=3"></script>
<script src="tm-demo.js?v=3"></script>
<script src="vp-bus-adapter.js?v=1"></script>

<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:14px; line-height:1.55; }

  /* ═ APP SHELL ═ */
  .app { display:grid; grid-template-rows:auto auto 1fr; min-height:100vh; }

  /* ─ Top bar: brand + context switcher + user */
  .topbar { display:flex; align-items:center; justify-content:space-between; padding:14px 28px; border-bottom:.5px solid var(--border); background:var(--bg2); }
  .brand { display:flex; align-items:baseline; gap:12px; }
  .brand-mark { font-family:var(--font-display); font-size:22px; font-weight:300; letter-spacing:.01em; }
  .brand-mark em { font-style:italic; color:var(--teal); }
  .brand-sub { font-family:var(--font-mono); font-size:10px; color:var(--ink3); text-transform:uppercase; letter-spacing:.2em; }

  /* ─ Context switcher (dev-only) */
  .ctx { display:flex; gap:8px; align-items:center; font-size:11px; color:var(--ink3); font-family:var(--font-mono); }
  .ctx select { font-family:var(--font-mono); font-size:11px; padding:4px 8px; border:.5px solid var(--border2); background:var(--bg2); color:var(--ink); }

  /* ─ User chip */
  .user { display:flex; align-items:center; gap:10px; }
  .user-avatar { width:28px; height:28px; background:var(--teal); color:white; font-size:11px; font-weight:600; display:flex; align-items:center; justify-content:center; }
  .user-name { font-size:12px; }
  .user-role { font-size:9px; color:var(--ink3); text-transform:uppercase; letter-spacing:.15em; font-family:var(--font-mono); }

  /* ─ Role banner — shows what "mode" we're in */
  .mode-banner { padding:8px 28px; font-size:11px; font-family:var(--font-mono); letter-spacing:.1em; text-transform:uppercase; display:flex; align-items:center; gap:12px; border-bottom:.5px solid var(--border); }
  .mode-banner.vp { background:rgba(26,122,94,.06); color:var(--green); }
  .mode-banner.td { background:rgba(107,63,160,.06); color:var(--purple); }
  .mode-banner.both { background:rgba(184,134,11,.08); color:var(--gold); }

  /* ═ TAB BAR ═ */
  .tabbar { display:flex; gap:2px; padding:0 28px; background:var(--bg2); border-bottom:.5px solid var(--border); overflow-x:auto; }
  .tab { background:transparent; border:none; padding:14px 18px; font-family:var(--font-body); font-size:12px; color:var(--ink3); cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap; position:relative; transition:all var(--tm-dur-med) var(--tm-ease); }
  .tab:hover { color:var(--ink2); }
  .tab.active { color:var(--ink); border-bottom-color:var(--teal); }
  .tab.td { color:var(--purple); opacity:.75; }
  .tab.td:hover { opacity:1; }
  .tab.td.active { color:var(--purple); border-bottom-color:var(--purple); opacity:1; }
  .tab .dot { display:inline-block; width:6px; height:6px; border-radius:50%; margin-left:6px; vertical-align:middle; }
  .tab .dot.new { background:var(--gold); }
  .tab .dot.count { width:auto; height:auto; border-radius:0; padding:1px 5px; font-size:9px; color:white; background:var(--red); font-family:var(--font-mono); vertical-align:baseline; }

  /* ═ CONTENT ═ */
  .content { padding:28px; background:var(--bg); max-width:1400px; width:100%; margin:0 auto; }

  .section-title { font-family:var(--font-display); font-size:28px; font-weight:300; margin-bottom:4px; }
  .section-sub { font-size:12px; color:var(--ink3); margin-bottom:24px; }

  /* ─ Card */
  .card { background:var(--bg2); border:.5px solid var(--border); padding:20px; margin-bottom:16px; }
  .card-title { font-family:var(--font-display); font-size:18px; font-weight:400; margin-bottom:4px; }
  .card-sub { font-size:11px; color:var(--ink3); text-transform:uppercase; letter-spacing:.15em; font-family:var(--font-mono); margin-bottom:14px; }

  /* ─ KPI grid */
  .kpi-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:14px; margin-bottom:24px; }
  .kpi { background:var(--bg2); border:.5px solid var(--border); padding:16px 18px; }
  .kpi-label { font-size:10px; color:var(--ink3); text-transform:uppercase; letter-spacing:.15em; font-family:var(--font-mono); margin-bottom:6px; }
  .kpi-value { font-family:var(--font-display); font-size:32px; font-weight:300; line-height:1; }
  .kpi-trend { font-size:11px; color:var(--green); margin-top:4px; }

  /* ─ IDP queue row */
  .idp-row { display:grid; grid-template-columns:1fr 1fr 1fr auto; gap:14px; padding:12px 14px; align-items:center; border:.5px solid var(--border); background:var(--bg2); margin-bottom:6px; font-size:12px; }
  .idp-row.pending { border-left:3px solid var(--gold); }
  .idp-row.approved { border-left:3px solid var(--green); opacity:.65; }
  .idp-row.rejected { border-left:3px solid var(--red); opacity:.55; }
  .idp-player { font-weight:500; }
  .idp-meta { font-size:10px; color:var(--ink3); font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.1em; }
  .idp-goal { color:var(--ink2); }
  .idp-btns { display:flex; gap:6px; }
  .btn { background:transparent; border:.5px solid var(--border2); padding:6px 12px; font-size:11px; cursor:pointer; color:var(--ink2); font-family:var(--font-body); }
  .btn:hover { background:var(--bg3); color:var(--ink); }
  .btn.primary { background:var(--teal); color:white; border-color:var(--teal); }
  .btn.primary:hover { background:#145c47; }
  .btn.danger:hover { background:var(--red-dim); color:var(--red); border-color:var(--red); }
  .btn.purple { background:var(--purple); color:white; border-color:var(--purple); }

  /* ─ Placeholder block */
  .placeholder { padding:32px 20px; background:var(--bg3); border:.5px dashed var(--border2); text-align:center; color:var(--ink3); font-size:12px; font-family:var(--font-mono); letter-spacing:.05em; }

  /* ─ Methodology editor */
  .method-section { margin-bottom:18px; padding:16px 18px; border-left:3px solid var(--purple); background:rgba(107,63,160,.04); border:.5px solid rgba(107,63,160,.18); border-left:3px solid var(--purple); }
  .method-section h4 { font-family:var(--font-display); font-size:16px; font-weight:400; color:var(--purple); margin-bottom:6px; }
  .method-section .hint { font-size:10px; color:var(--ink3); font-family:var(--font-mono); margin-bottom:10px; }
  .principle-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; }
  .principle { background:var(--bg2); border:.5px solid var(--border); padding:10px; font-size:11px; }
  .principle strong { display:block; color:var(--purple); margin-bottom:3px; font-size:10px; text-transform:uppercase; letter-spacing:.1em; font-family:var(--font-mono); }

  /* ─ Calibration */
  .calib-row { display:grid; grid-template-columns:140px repeat(4, 50px) 1fr; gap:8px; padding:6px 10px; font-family:var(--font-mono); font-size:11px; align-items:center; border-bottom:.5px solid var(--border); }
  .calib-row.header { color:var(--ink3); font-size:9px; text-transform:uppercase; letter-spacing:.1em; border-bottom:.5px solid var(--border2); }
  .calib-score { text-align:center; }
  .calib-score.good { color:var(--green); }
  .calib-score.warn { color:var(--amber); }
  .calib-score.bad { color:var(--red); }
  .calib-drift { font-size:10px; color:var(--ink3); padding-left:10px; }

  /* ─ Report block */
  .report-block { display:grid; grid-template-columns:2fr 1fr 3fr; gap:12px; padding:8px 12px; border-top:.5px solid var(--border); font-size:11px; align-items:baseline; }
  .report-block:first-child { border-top:none; }
  .report-tag { font-size:9px; color:var(--gold); text-transform:uppercase; letter-spacing:.1em; font-family:var(--font-mono); }

  /* ─ TD link banner (for VP in large club) */
  .td-link { background:rgba(107,63,160,.05); border:.5px solid rgba(107,63,160,.22); border-left:3px solid var(--purple); padding:12px 14px; font-size:11px; color:var(--ink2); display:flex; align-items:center; gap:12px; margin-bottom:16px; }
  .td-link strong { color:var(--purple); }

  /* ─ Loader */
  .loader { display:flex; align-items:center; justify-content:center; padding:60px; color:var(--ink3); font-family:var(--font-mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; }
</style>
</head>
<body>
<div id="app" class="app"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel">
const { useState, useEffect, useMemo } = React;

// ═════════════════════════════════════════════════════════════════
// KONTEKSTILOGIIKKA — sama koodi, eri käyttäytyminen
// ═════════════════════════════════════════════════════════════════
// Kolme seura-arkkityyppiä + kolme käyttäjäroolia → resolvoidaan tila
const CLUBS = {
  kpv: { id:'kpv', name:'KPV',  archetype:'GRASSROOTS',    hasTD:false, users:{ head_of_coaching:'Mika Laine' } },
  hjk: { id:'hjk', name:'HJK',  archetype:'PROFESSIONAL',  hasTD:true,  users:{ head_of_coaching:'Mika Laine', technical_director:'Teemu Karhu' } },
  ajx: { id:'ajx', name:'Ajax', archetype:'ELITE_GLOBAL',  hasTD:true,  users:{ head_of_coaching_lower:'J. van Dam', head_of_coaching_upper:'S. Wijlaars', technical_director:'M. Beuker' } },
};

function resolveView(clubId, userRole) {
  const club = CLUBS[clubId];
  if (!club) return { mode:'UNCONFIGURED', tabs:[] };

  // Grassroots — VP tekee kaiken (TD-tabit näkyvät)
  if (!club.hasTD && userRole === 'head_of_coaching') {
    return { mode:'VP+TD_YHDISTETTY', label:'VP + TD · yhdistetty rooli', tone:'both', showTD:true, showVP:true, clubName:club.name };
  }
  // Iso seura — VP on vain VP
  if (club.hasTD && userRole === 'head_of_coaching') {
    return { mode:'VP_RAJATTU', label:'Valmennuspäällikkö · operatiivinen', tone:'vp', showTD:false, showVP:true, clubName:club.name };
  }
  // Iso seura — TD
  if (club.hasTD && userRole === 'technical_director') {
    return { mode:'TD_VAIN', label:'Tekninen johtaja · metodologia', tone:'td', showTD:true, showVP:false, clubName:club.name };
  }
  return { mode:'UNCONFIGURED', label:'—', tabs:[] };
}

// ═════════════════════════════════════════════════════════════════
// TABIT — pidämme v19:n VP-tabit + lisäämme TD-tabit + uudet v20:n VP-tabit
// ═════════════════════════════════════════════════════════════════
const TABS = [
  // VP-alue (v19-perintö)
  { id:'tilanne',    label:'Tilanne',          scope:'vp' },
  { id:'valmentajat', label:'Valmentajat',     scope:'vp' },
  { id:'pelaajapolut', label:'Pelaajapolut',   scope:'vp' },
  { id:'kalenteri',  label:'Kalenteri',        scope:'vp' },
  { id:'tavoitteet', label:'Tavoitteet',       scope:'vp' },
  // TD-alue (v20 uusi)
  { id:'metodologia', label:'Metodologia',     scope:'td', isNew:true },
  { id:'kalibraatio', label:'Kalibraatio',     scope:'td', isNew:true },
  { id:'kriteeristo', label:'Kriteeristö',     scope:'td', isNew:true },
  // Jaettu (v20 uusi)
  { id:'benchmark',  label:'Benchmark',        scope:'shared', isNew:true },
  { id:'raportointi', label:'Raportointi',     scope:'vp', isNew:true },
];

// ═════════════════════════════════════════════════════════════════
// DEMODATA — IDP-jono
// ═════════════════════════════════════════════════════════════════
const SEED_IDPS = [
  { id:'idp_001', player:'Aleksi V.', age:'U15', coach:'Anna K.', goal:'Vertikaalinen syöttö alta ulos', rationale:'Pelitavan periaate 3 · FLEI: harjoitettava', status:'proposed', proposedAt:Date.now() - 86400000 },
  { id:'idp_002', player:'Nooa L.', age:'U13', coach:'Mikko L.', goal:'1v1-puolustus matalalla', rationale:'TKI-tekn. 5.8 → tavoite 7.0 jakson loppuun', status:'proposed', proposedAt:Date.now() - 172800000 },
  { id:'idp_003', player:'Emma S.', age:'U17', coach:'Jari T.', goal:'Johtaminen kentällä — kapteenin rooli', rationale:'X-Factor: johtajuus · valmentajan havainto 3 ottelussa', status:'approved', approvedAt:Date.now() - 432000000 },
  { id:'idp_004', player:'Joonas R.', age:'U13', coach:'Heli S.', goal:'Sijoittautuminen pallottomana', rationale:'Pelitavan periaate 4 (kompakti tila)', status:'proposed', proposedAt:Date.now() - 43200000 },
];

// ═════════════════════════════════════════════════════════════════
// APP
// ═════════════════════════════════════════════════════════════════
function App() {
  const [clubId, setClubId] = useState('kpv');
  const [userRole, setUserRole] = useState('head_of_coaching');
  const [activeTab, setActiveTab] = useState('tilanne');

  const view = useMemo(() => resolveView(clubId, userRole), [clubId, userRole]);

  // Jos TD-käyttäjä, avaa metodologia-tabi oletuksena
  useEffect(() => {
    if (view.mode === 'TD_VAIN' && !['metodologia','kalibraatio','kriteeristo','benchmark'].includes(activeTab)) {
      setActiveTab('metodologia');
    } else if (view.mode !== 'TD_VAIN' && activeTab === 'metodologia' && !view.showTD) {
      setActiveTab('tilanne');
    }
  }, [view.mode]);

  // Suodata näkyvät tabit
  const visibleTabs = TABS.filter(t => {
    if (t.scope === 'vp') return view.showVP;
    if (t.scope === 'td') return view.showTD;
    if (t.scope === 'shared') return true;
    return false;
  });

  const userName = view.mode === 'TD_VAIN'
    ? (CLUBS[clubId].users.technical_director || CLUBS[clubId].users.head_of_coaching_upper)
    : CLUBS[clubId].users.head_of_coaching || CLUBS[clubId].users.head_of_coaching_upper;

  return (
    <>
      <TopBar
        clubId={clubId} setClubId={setClubId}
        userRole={userRole} setUserRole={setUserRole}
        view={view} userName={userName}
      />
      <ModeBanner view={view} />
      <TabBar tabs={visibleTabs} active={activeTab} onSelect={setActiveTab} />
      <main className="content">
        <TabContent tab={activeTab} view={view} clubId={clubId} />
      </main>
    </>
  );
}

// ─────────────────────────────────────────────────────────────
// TOP BAR
// ─────────────────────────────────────────────────────────────
function TopBar({ clubId, setClubId, userRole, setUserRole, view, userName }) {
  return (
    <div className="topbar">
      <div className="brand">
        <div className="brand-mark">Talent<em>Master</em></div>
        <div className="brand-sub">VP + TD · v20</div>
      </div>
      <div className="ctx">
        <span>DEV:</span>
        <select value={clubId} onChange={e => setClubId(e.target.value)}>
          <option value="kpv">KPV (grassroots · pieni)</option>
          <option value="hjk">HJK (professional · iso)</option>
          <option value="ajx">Ajax (elite · global)</option>
        </select>
        <select value={userRole} onChange={e => setUserRole(e.target.value)}>
          <option value="head_of_coaching">head_of_coaching</option>
          <option value="technical_director">technical_director</option>
        </select>
      </div>
      <div className="user">
        <div>
          <div className="user-role">{view.label}</div>
          <div className="user-name">{userName || '—'} · {view.clubName}</div>
        </div>
        <div className="user-avatar">{(userName||'?').split(' ').map(w=>w[0]).join('').slice(0,2)}</div>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// MODE BANNER
// ─────────────────────────────────────────────────────────────
function ModeBanner({ view }) {
  const msgs = {
    'VP+TD_YHDISTETTY': 'Yhdistetty VP + TD — seurassa ei ole erillistä teknistä johtajaa. Metodologia-tabit näkyvät sinulle.',
    'VP_RAJATTU':       'VP-näkymä — seuran TD vastaa metodologiasta. Näet hänen julkaisemansa linjan Metodologia-bannerissa.',
    'TD_VAIN':          'TD-näkymä — metodologian omistaja. VP jalkauttaa linjaasi. Näet operatiiviset tabit read-only.',
  };
  return <div className={`mode-banner ${view.tone}`}>→ {msgs[view.mode] || view.mode}</div>;
}

// ─────────────────────────────────────────────────────────────
// TAB BAR
// ─────────────────────────────────────────────────────────────
function TabBar({ tabs, active, onSelect }) {
  return (
    <nav className="tabbar">
      {tabs.map(t => (
        <button key={t.id}
          className={`tab ${t.scope === 'td' ? 'td' : ''} ${active === t.id ? 'active' : ''}`}
          onClick={() => onSelect(t.id)}>
          {t.label}
          {t.isNew && <span className="dot new" title="Uusi v20"></span>}
        </button>
      ))}
    </nav>
  );
}

// ─────────────────────────────────────────────────────────────
// TAB CONTENT — router
// ─────────────────────────────────────────────────────────────
function TabContent({ tab, view, clubId }) {
  switch (tab) {
    case 'tilanne':     return <TilanneTab view={view} />;
    case 'valmentajat': return <PlaceholderTab title="Valmentajat" sub="Siirretty v19:stä · jatkokehitys v21:ssä" />;
    case 'pelaajapolut':return <PlaceholderTab title="Pelaajapolut" sub="Siirretty v19:stä · Hidden Gem / X-Factor -logiikka" />;
    case 'kalenteri':   return <PlaceholderTab title="Kalenteri" sub="Siirretty v19:stä" />;
    case 'tavoitteet':  return <PlaceholderTab title="Tavoitteet" sub="Kausitavoitteet · TD:n linja" />;
    case 'metodologia': return <MetodologiaTab view={view} />;
    case 'kalibraatio': return <KalibraatioTab />;
    case 'kriteeristo': return <KriteeristoTab />;
    case 'benchmark':   return <BenchmarkTab />;
    case 'raportointi': return <RaportointiTab />;
    default:            return <PlaceholderTab title={tab} sub="" />;
  }
}

// ═════════════════════════════════════════════════════════════════
// TILANNE — nyt sisältää IDP-hyväksyntäjonon (uutta v20:ssä)
// ═════════════════════════════════════════════════════════════════
function TilanneTab({ view }) {
  const [idps, setIdps] = useState(SEED_IDPS);

  function approve(id) {
    setIdps(list => list.map(i => i.id === id ? { ...i, status:'approved', approvedAt:Date.now() } : i));
    // Bus-integraatio (VP v21 adapter)
    if (window.VPBus) {
      window.VPBus.approveIDP({ idpId:id, note:'Hyväksytty VP+TD v20 -näkymästä' })
        .catch(err => console.warn('[v20] IDP approve err', err));
    }
  }
  function reject(id) {
    setIdps(list => list.map(i => i.id === id ? { ...i, status:'rejected' } : i));
    if (window.VPBus) {
      window.VPBus.rejectIDP({ idpId:id, reason:'Ei linjassa pelitavan kanssa' })
        .catch(err => console.warn('[v20] IDP reject err', err));
    }
  }

  const pending = idps.filter(i => i.status === 'proposed');

  return (
    <>
      <h1 className="section-title">Tilanne</h1>
      <div className="section-sub">{view.clubName} · jakso 2/8 · päivitetty juuri nyt</div>

      {/* Jos iso seura, näytä TD-linja yläbannerissa */}
      {view.mode === 'VP_RAJATTU' && (
        <div className="td-link">
          <strong>TD · {CLUBS.hjk.users.technical_director}</strong>
          <span>Metodologia v3.1 julkaistu 5 pv sitten · 5 periaatetta · FLEI-painot H35 L25 E20 I20</span>
          <a href="#" style={{marginLeft:'auto', color:'var(--purple)', fontSize:11, textDecoration:'none'}}>Näytä linja →</a>
        </div>
      )}

      <div className="kpi-grid">
        <div className="kpi"><div className="kpi-label">Pelaajia</div><div className="kpi-value">127</div><div className="kpi-trend">+4 / jakso</div></div>
        <div className="kpi"><div className="kpi-label">Valmentajia</div><div className="kpi-value">14</div></div>
        <div className="kpi"><div className="kpi-label">FLEI ka.</div><div className="kpi-value">6.8</div><div className="kpi-trend">+0.2</div></div>
        <div className="kpi"><div className="kpi-label">IDP odottaa</div><div className="kpi-value" style={{color: pending.length ? 'var(--gold)' : 'var(--ink3)'}}>{pending.length}</div></div>
      </div>

      {/* UUSI v20 — IDP-hyväksyntäjono */}
      <div className="card">
        <div style={{display:'flex', justifyContent:'space-between', alignItems:'baseline'}}>
          <div>
            <div className="card-title">IDP-hyväksyntäjono</div>
            <div className="card-sub">Valmentaja ehdottaa · VP tarkistaa kriteeristöä vasten · bus: idp.approved</div>
          </div>
          <span style={{fontSize:9, color:'var(--gold)', textTransform:'uppercase', letterSpacing:'.2em', fontFamily:'var(--font-mono)'}}>Uusi v20</span>
        </div>
        {idps.length === 0 && <div className="placeholder">Ei IDP-ehdotuksia</div>}
        {idps.map(idp => (
          <div key={idp.id} className={`idp-row ${idp.status}`}>
            <div>
              <div className="idp-player">{idp.player} · {idp.age}</div>
              <div className="idp-meta">Valm: {idp.coach}</div>
            </div>
            <div>
              <div className="idp-goal">{idp.goal}</div>

        ))}
      </div>

      <div className="card">

      </div>
    </>
  );
}

// KALIBRAATIO — ADAR-hajontatyökalu
// ═════════════════════════════════════════════════════════════════
function KalibraatioTab() {
  const coaches = [
    { name:'Anna K.',    scores:[4,3,4,3] },
    { name:'Mikko L.',   scores:[3,2,3,3] },
    { name:'Jari T.',    scores:[5,4,4,4] },
    { name:'Heli S.',    scores:[3,3,3,2] },
    { name:'Aleksi V.',  scores:[4,4,5,4] },
  ];
  const avgs = [0,1,2,3].map(i => coaches.reduce((s,c)=>s+c.scores[i],0)/coaches.length);
  const drift = coaches.map(c => c.scores.map((v,i)=>Math.abs(v-avgs[i])).reduce((a,b)=>a+b,0)/4);

  return (
    <>
      <h1 className="section-title">Kalibraatiopaja</h1>
      <div className="section-sub">Pisteyttääkö tiimi samalla tavalla? · DFB- ja KNVB-benchmark</div>

      <div className="card">
        <div className="card-title">Aktiivinen sessio — Lasse V. · U15 · 2 min klippi</div>
        <div className="card-sub">Pallonriistotilanne 3v2 · valmentajien ADAR-arviot</div>

        <div className="calib-row header">
          <div>Valmentaja</div>
          <div className="calib-score">A</div>
          <div className="calib-score">D</div>
          <div className="calib-score">A</div>
          <div className="calib-score">R</div>
          <div className="calib-drift">Hajonta vs. ka.</div>
        </div>
        {coaches.map((c,i) => (
          <div key={c.name} className="calib-row">
            <div>{c.name}</div>
            {c.scores.map((s,j) => (
              <div key={j} className={`calib-score ${s>=4?'good':s<=2?'bad':'warn'}`}>{s}</div>
            ))}
            <div className="calib-drift" style={{color: drift[i] > 0.8 ? 'var(--red)' : 'var(--ink3)'}}>
              Δ {drift[i].toFixed(2)} {drift[i] > 0.8 ? '⚠ kalibroi' : ''}
            </div>
          </div>
        ))}

        <div style={{marginTop:14, padding:12, background:'var(--amber-dim)', borderLeft:'3px solid var(--amber)', fontSize:11}}>
          <strong style={{color:'var(--amber)'}}>Suositus:</strong> 1:1-kalibraatiosessio Mikko L:n kanssa ennen Q3-arviointia.
        </div>
      </div>

      <div className="card">
        <div className="card-title">Historia</div>
        <div style={{fontSize:12, color:'var(--ink2)'}}>Q1/2026 hajonta 0.9 → Q2 0.7 → <b style={{color:'var(--green)'}}>tavoite Q3 · 0.5</b></div>
      </div>
    </>
  );
}
