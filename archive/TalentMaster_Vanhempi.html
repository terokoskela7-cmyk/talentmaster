<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>TalentMaster™ — Vanhemman sivu 👨‍👩‍👦</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0A0A0A; --bg2:#111111; --bg3:#1A1A1A; --card:#1E1E1E;
  --border:rgba(255,255,255,0.07); --teal:#00D4AA; --blue:#4A7ED9;
  --amber:#FFA502; --green:#2ED573; --red:#FF4757; --purple:#A855F7;
  --gold:#F5B700; --ink:#F0F0F0; --ink2:#AAAAAA; --ink3:#666666; --r:12px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif;min-height:100vh;}

/* LOGIN */
#sLogin{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 30% 20%,rgba(0,212,170,0.08) 0%,transparent 60%),var(--bg);}
.login-box{width:100%;max-width:400px;padding:40px 32px;background:var(--bg2);border:1px solid var(--border);border-radius:20px;margin:20px;}
.login-logo{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:900;color:var(--teal);margin-bottom:4px;}
.login-info{background:rgba(0,212,170,0.08);border:1px solid rgba(0,212,170,0.2);border-radius:8px;padding:12px 14px;font-size:13px;color:var(--ink2);margin-bottom:20px;line-height:1.5;}
.login-label{font-size:11px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px;}
.login-input{width:100%;padding:12px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--ink);font-family:'DM Sans',sans-serif;font-size:15px;margin-bottom:16px;transition:border-color .2s;}
.login-input:focus{outline:none;border-color:var(--teal);}
.login-btn{width:100%;padding:14px;background:var(--teal);color:#000;border:none;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:opacity .2s;}
.login-btn:hover{opacity:.9;}
.login-error{font-size:13px;color:var(--red);margin-top:10px;min-height:18px;}

/* APP */
#sApp{display:none;}
.topbar{position:sticky;top:0;z-index:100;background:rgba(10,10,10,0.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:12px 20px;}
.topbar-logo{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:900;color:var(--teal);}
.topbar-badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;background:rgba(0,212,170,0.15);color:var(--teal);text-transform:uppercase;letter-spacing:.5px;}
.topbar-spacer{flex:1;}
.topbar-nimi{font-size:13px;font-weight:600;}
.topbar-out{font-size:12px;color:var(--ink3);cursor:pointer;padding:6px 10px;border-radius:6px;border:1px solid var(--border);transition:all .2s;}
.topbar-out:hover{border-color:var(--red);color:var(--red);}
.main{max-width:780px;margin:0 auto;padding:24px 20px 120px;}
.banner{background:linear-gradient(135deg,rgba(0,212,170,0.06) 0%,rgba(74,126,217,0.04) 100%);border:1px solid rgba(0,212,170,0.15);border-radius:20px;padding:28px;margin-bottom:24px;}
.banner-badge{display:inline-block;font-size:11px;font-weight:700;color:var(--teal);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;}
.banner h1{font-family:'Barlow Condensed',sans-serif;font-size:34px;font-weight:700;line-height:1.1;margin-bottom:10px;}
.banner h1 span{color:var(--teal);}
.banner p{font-size:14px;color:var(--ink2);line-height:1.6;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
@media(max-width:600px){.grid2{grid-template-columns:1fr;}}
.kortti{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:20px;margin-bottom:16px;}
.kortti-otsikko{font-size:13px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.7px;margin-bottom:14px;}
.pelaaja-kortti{display:flex;gap:16px;align-items:flex-start;}
.fifa-mini{background:linear-gradient(155deg,#1a1400,#0d0d00);border:1px solid var(--gold);border-radius:10px;padding:12px 10px;text-align:center;min-width:80px;flex-shrink:0;}
.fifa-mini-num{font-family:'Barlow Condensed',sans-serif;font-size:38px;font-weight:900;color:var(--gold);line-height:1;}
.fifa-mini-label{font-size:8px;color:rgba(245,183,0,.7);font-weight:700;letter-spacing:1px;margin-top:2px;}
.fifa-mini-profiili{font-size:9px;color:var(--gold);font-weight:700;margin-top:4px;text-transform:uppercase;letter-spacing:.5px;}
.pelaaja-info{flex:1;}
.pelaaja-nimi{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:700;line-height:1;margin-bottom:4px;}
.pelaaja-meta{font-size:12px;color:var(--ink3);margin-bottom:10px;}
.pelaaja-kuvaus{font-size:13px;color:var(--ink2);line-height:1.6;}
.vahvuus-lista{list-style:none;}
.vahvuus-lista li{padding:7px 0;border-bottom:1px solid var(--border);font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:8px;}
.vahvuus-lista li:last-child{border-bottom:none;}
.kehitys-kohde{margin-top:12px;padding:10px 14px;background:rgba(255,165,2,0.08);border-left:3px solid var(--amber);border-radius:0 6px 6px 0;font-size:13px;color:var(--ink2);line-height:1.5;}
.kehitys-kohde strong{color:var(--amber);}
.flei-numero{font-family:'Barlow Condensed',sans-serif;font-size:52px;font-weight:900;line-height:1;}
.flei-taso{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;display:inline-block;margin-top:4px;}
.flei-selitys{font-size:13px;color:var(--ink2);line-height:1.6;margin-top:12px;}
.flei-bar-bg{height:8px;background:var(--bg3);border-radius:4px;overflow:hidden;margin:10px 0;}
.flei-bar-fill{height:100%;border-radius:4px;transition:width 1.2s ease;}
.phv-info{background:rgba(255,165,2,0.06);border:1px solid rgba(255,165,2,0.2);border-radius:8px;padding:12px 14px;font-size:13px;color:var(--ink2);line-height:1.5;margin-top:12px;}
.phv-info strong{color:var(--amber);}
.tehtava{background:var(--bg3);border-radius:8px;padding:14px;margin-bottom:10px;}
.tehtava-otsikko{font-size:13px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:8px;}
.tehtava-kuvaus{font-size:13px;color:var(--ink2);line-height:1.6;}
.tuki-banneri{background:linear-gradient(135deg,rgba(74,126,217,0.08) 0%,rgba(0,212,170,0.05) 100%);border:1px solid rgba(74,126,217,0.2);border-radius:var(--r);padding:18px;margin-top:16px;}
.tuki-otsikko{font-size:14px;font-weight:700;color:var(--blue);margin-bottom:8px;}
.tuki-teksti{font-size:13px;color:var(--ink2);line-height:1.7;}
.tuki-teksti em{color:var(--ink);font-style:normal;font-weight:600;}
.havainto-card{background:var(--bg3);border-radius:8px;padding:16px;}
.havainto-meta{font-size:12px;color:var(--ink3);margin-bottom:8px;}
.havainto-lainaus{font-size:14px;color:var(--ink);line-height:1.6;font-style:italic;border-left:3px solid var(--teal);padding-left:12px;margin-bottom:12px;}
.havainto-selitys{font-size:13px;color:var(--ink2);line-height:1.6;}
.kalenteri-item{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--border);align-items:flex-start;}
.kalenteri-item:last-child{border-bottom:none;}
.kalenteri-kk{font-size:11px;font-weight:700;color:var(--teal);text-transform:uppercase;letter-spacing:.5px;min-width:70px;padding-top:2px;}
.kalenteri-nimi{font-size:14px;font-weight:600;margin-bottom:3px;}
.kalenteri-kuvaus{font-size:12px;color:var(--ink2);line-height:1.5;}
.tallennusohje{background:rgba(0,212,170,0.06);border:1px solid rgba(0,212,170,0.15);border-radius:8px;padding:14px;margin-bottom:20px;font-size:13px;color:var(--ink2);line-height:1.6;}
.tallennusohje strong{color:var(--teal);display:block;margin-bottom:4px;}
.pelaaja-sivu-linkki{max-width:780px;margin:8px auto 40px;padding:0 20px;}
.pelaaja-sivu-linkki a{display:flex;align-items:center;justify-content:center;gap:10px;background:#1A2235;border:1px solid var(--teal);color:var(--teal);padding:16px 24px;border-radius:12px;text-decoration:none;font-weight:700;font-size:15px;font-family:'DM Sans',sans-serif;transition:background .2s;}
.pelaaja-sivu-linkki a:hover{background:rgba(0,212,170,0.08);}
.bar-bg{height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;}
.bar-fill{height:100%;border-radius:3px;background:var(--teal);transition:width 1s ease;}
.bar-item{flex:1;}

/* ── VANHEMMAN OPAS — AIHENAPPIT ── */
.opas-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px;}
@media(max-width:500px){.opas-grid{grid-template-columns:1fr;}}
.opas-nappi{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;cursor:pointer;text-align:left;width:100%;transition:border-color .15s;font-family:'DM Sans',sans-serif;}
.opas-nappi:hover{border-color:rgba(0,212,170,.4);}
.opas-ikon{font-size:18px;flex-shrink:0;}
.opas-nimi{font-size:13px;font-weight:600;color:var(--ink);display:block;}
.opas-kuvaus{font-size:11px;color:var(--ink3);display:block;margin-top:2px;}

/* Kielenvalinta */
.kieli-rivi{display:flex;gap:6px;margin-bottom:14px;}
.kieli-nappi{padding:4px 12px;border:1px solid var(--border);border-radius:20px;font-size:11px;font-weight:700;font-family:'DM Sans',sans-serif;cursor:pointer;background:none;color:var(--ink3);transition:all .15s;}
.kieli-nappi.aktiv{background:rgba(0,212,170,.15);border-color:rgba(0,212,170,.4);color:var(--teal);}

/* ── KELLUVA CHAT-IKKUNA ── */
.chat-ikkuna{
  position:fixed;bottom:0;left:0;right:0;z-index:200;
  background:var(--bg2);border-top:1px solid rgba(0,212,170,.3);
  border-radius:20px 20px 0 0;
  display:none;flex-direction:column;
  max-height:78vh;
  box-shadow:0 -4px 40px rgba(0,212,170,.1);
  transition:transform .25s cubic-bezier(.16,1,.3,1);
}
.chat-ikkuna.auki{display:flex;}
@media(min-width:680px){
  .chat-ikkuna{
    position:fixed;bottom:24px;right:24px;left:auto;
    width:420px;max-height:560px;
    border-radius:16px;border:1px solid rgba(0,212,170,.3);
    box-shadow:0 8px 40px rgba(0,0,0,.5);
  }
}
.chat-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:rgba(0,212,170,.05);border-radius:20px 20px 0 0;flex-shrink:0;}
@media(min-width:680px){.chat-header{border-radius:16px 16px 0 0;}}
.chat-header-vasen{display:flex;align-items:center;gap:10px;}
.chat-avatar{width:32px;height:32px;border-radius:50%;background:rgba(0,212,170,.2);border:1px solid rgba(0,212,170,.4);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.chat-otsikko{font-size:13px;font-weight:700;color:var(--ink);}
.chat-alaotsikko{font-size:10px;color:var(--teal);margin-top:1px;}
.chat-sulje{background:none;border:none;cursor:pointer;color:var(--ink3);font-size:22px;padding:0;line-height:1;transition:color .15s;}
.chat-sulje:hover{color:var(--ink);}
.chat-viestit{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth;}
.viesti{max-width:88%;}
.viesti.ai{align-self:flex-start;}
.viesti.user{align-self:flex-end;}
.viesti-bubble{padding:10px 14px;border-radius:16px;font-size:13px;line-height:1.65;color:var(--ink);}
.viesti.ai .viesti-bubble{background:var(--bg3);border:1px solid var(--border);border-bottom-left-radius:4px;}
.viesti.user .viesti-bubble{background:var(--teal);color:#000;font-weight:500;border-bottom-right-radius:4px;}
.kirjoittaa-wrap{align-self:flex-start;}
.kirjoittaa-pisteet{display:flex;gap:4px;align-items:center;padding:10px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:16px;border-bottom-left-radius:4px;}
.piste{width:6px;height:6px;background:var(--ink3);border-radius:50%;animation:pomppaa 1.2s infinite;}
.piste:nth-child(2){animation-delay:.2s;}
.piste:nth-child(3){animation-delay:.4s;}
@keyframes pomppaa{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}
.chat-syote-alue{padding:12px 14px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:flex-end;flex-shrink:0;}
.chat-syote-alue textarea{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:9px 12px;color:var(--ink);font-family:'DM Sans',sans-serif;font-size:13px;resize:none;min-height:38px;max-height:90px;outline:none;transition:border-color .2s;line-height:1.4;}
.chat-syote-alue textarea:focus{border-color:rgba(0,212,170,.5);}
.chat-laheta{padding:9px 16px;background:var(--teal);color:#000;border:none;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;height:38px;transition:opacity .15s;flex-shrink:0;}
.chat-laheta:hover{opacity:.85;}
.chat-laheta:disabled{opacity:.35;cursor:not-allowed;}

/* Kelluva avaa-nappi */
.chat-fab{
  position:fixed;bottom:24px;right:24px;z-index:190;
  background:var(--teal);color:#000;border:none;border-radius:50px;
  padding:12px 20px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;
  cursor:pointer;display:none;align-items:center;gap:8px;
  box-shadow:0 4px 20px rgba(0,212,170,.35);transition:opacity .2s;
}
.chat-fab.nakyvilla{display:flex;}
.chat-fab:hover{opacity:.9;}

.spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--teal);border-radius:50%;animation:pyori .8s linear infinite;margin:40px auto;}
@keyframes pyori{to{transform:rotate(360deg);}}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--teal);color:#000;font-weight:700;font-size:13px;padding:10px 20px;border-radius:20px;transition:transform .3s ease;z-index:1000;pointer-events:none;}
#toast.vis{transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="sLogin">
  <div class="login-box">
    <div class="login-logo">TalentMaster™</div>
    <div style="font-size:14px;font-weight:700;color:var(--teal);margin-bottom:16px">👨‍👩‍👦 Tämä on vanhemman sivu</div>
    <div class="login-info" id="loginInfo">Kirjaudu sähköpostillasi nähdäksesi lapsesi kehitystiedot.</div>
    <div class="login-label">Sähköposti tai PalloID</div>
    <input class="login-input" type="email" id="loginEmail" placeholder="sähköposti tai PalloID (esim. 34650191)" autocapitalize="none">
    <div class="login-label">Salasana</div>
    <input class="login-input" type="password" id="loginPass" placeholder="••••••••" onkeydown="if(event.key==='Enter')kirjauduSisaan()">
    <button class="login-btn" onclick="kirjauduSisaan()">Kirjaudu sisään</button>
    <div class="login-error" id="loginVirhe"></div>
    <div style="margin-top:14px;text-align:center">
      <span style="font-size:12px;color:var(--ink3);cursor:pointer" onclick="lahetaSalasana()">Unohtuiko salasana? →</span>
    </div>
  </div>
</div>

<!-- SOVELLUS -->
<div id="sApp">
  <div class="topbar">
    <div class="topbar-logo">TM™</div>
    <div class="topbar-badge" id="topbarSeura">—</div>
    <div style="font-size:10px;font-weight:700;color:var(--teal);text-transform:uppercase;letter-spacing:.8px;padding:2px 8px;background:rgba(0,212,170,.08);border-radius:10px;border:1px solid rgba(0,212,170,.25)">👨‍👩‍👦 Vanhemman sivu</div>
    <div class="topbar-spacer"></div>
    <div class="topbar-nimi" id="topbarNimi">—</div>
    <div class="topbar-out" onclick="kirjauduUlos()">Kirjaudu ulos</div>
  </div>
  <div class="main" id="mainSisalto"><div class="spinner"></div></div>
  <div class="pelaaja-sivu-linkki" id="pelaajaSivuLinkki" style="display:none">
    <a id="pelaajaSivuNappi" href="#">⚽ Siirry pelaajan omalle sivulle →</a>
  </div>
</div>

<!-- KELLUVA CHAT -->
<div class="chat-ikkuna" id="chatIkkuna">
  <div class="chat-header">
    <div class="chat-header-vasen">
      <div class="chat-avatar">🤖</div>
      <div>
        <div class="chat-otsikko" id="chatOtsikko">Vanhemman opas</div>
        <div class="chat-alaotsikko">TalentMaster AI</div>
      </div>
    </div>
    <button class="chat-sulje" onclick="suljeChat()">×</button>
  </div>
  <div class="chat-viestit" id="chatViestit"></div>
  <div class="chat-syote-alue">
    <textarea id="chatSyote" rows="1"
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();lahetaChat();}"
      oninput="this.style.height='38px';this.style.height=Math.min(this.scrollHeight,90)+'px'"></textarea>
    <button class="chat-laheta" id="chatLahetaNappi" onclick="lahetaChat()">—</button>
  </div>
</div>

<!-- FAB -->
<button class="chat-fab" id="chatFab" onclick="avaaChat()">
  🤖 <span id="chatFabTeksti">Vanhemman opas</span>
</button>

<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey:'AIzaSyAp471lOIntzP33p9bIW3y4KbeEyBt5kIo',
  authDomain:'talentmaster-pilot.firebaseapp.com',
  projectId:'talentmaster-pilot',
  storageBucket:'talentmaster-pilot.firebasestorage.app',
  messagingSenderId:'872561784446',
  appId:'1:872561784446:web:05c4c7996dfd46ddd14a2f',
});
var _auth=firebase.auth(), _db=firebase.firestore();
var _user=null,_pelaaja=null,_seuraId=null,_pelaajaId=null;
var _kirjautuminenKesken=false;
var _params=new URLSearchParams(location.search);
var _urlPelId=_params.get('pelaajaId');
var _urlSeura=_params.get('seuraId')||'kpv';
var _urlEtu=_params.get('etunimi')||'';
var _urlSuku=_params.get('sukunimi')||'';

// ── Kieli ─────────────────────────────────────────────────────────
var _kieli='fi';
var RUOTSINKIELISET=['grifk'];
function _maaritaKieli(sid){ return RUOTSINKIELISET.includes(sid)?'sv':'fi'; }
function _t(fi,sv,en){ if(_kieli==='sv')return sv; if(_kieli==='en')return en; return fi; }

// ── Näkymät ──────────────────────────────────────────────────────
function nayta(id){
  document.getElementById('sLogin').style.display=id==='sLogin'?'flex':'none';
  document.getElementById('sApp').style.display=id==='sApp'?'block':'none';
}

// ── Auth ──────────────────────────────────────────────────────────
_auth.onAuthStateChanged(async function(user){
  if(_kirjautuminenKesken)return;
  if(!user){_esitaytaLogin();nayta('sLogin');return;}
  _user=user; await _lataaData(user);
});
function _esitaytaLogin(){
  var el=document.getElementById('loginInfo');
  if(_urlEtu&&el) el.innerHTML='Kirjaudu nähdäksesi <strong style="color:var(--teal)">'+_urlEtu+' '+_urlSuku+'</strong> kehitystiedot.';
}

// ── Datan lataus ──────────────────────────────────────────────────
async function _lataaData(user){
  try{
    var token=await user.getIdTokenResult(true);
    var claims=token.claims||{};
    var isSA=claims.super_admin||claims.superAdmin;
    if(_urlPelId&&_urlSeura){
      try{
        var snap=await _db.collection('seurat').doc(_urlSeura).collection('pelaajat').doc(_urlPelId).get();
        if(snap.exists){
          var d=snap.data();
          if(isSA||(d.huoltajaEmail&&d.huoltajaEmail.toLowerCase()===user.email.toLowerCase())){
            _pelaaja=Object.assign({id:snap.id},d);
            _seuraId=_urlSeura;_pelaajaId=_urlPelId;
            _kieli=_maaritaKieli(_seuraId);
            _renderSivu();return;
          }
        }
      }catch(e){}
    }
    var seurat=['kpv','fcl','palloiirot','yvies','sjk','grifk'];
    for(var i=0;i<seurat.length;i++){
      try{

function _rakennaSysteemiohje(){
  var k=window._ctx||{};
  var tiedot='';
  if(k.etunimi){
    tiedot+='\n\nPelaajan tiedot:\n';
    tiedot+='- Nimi: '+k.etunimi+(k.ika?', '+k.ika+' vuotta':'')+'\n';
    if(k.joukkue)tiedot+='- Joukkue: '+k.joukkue+(k.seura?' ('+k.seura+')':'')+'\n';
    if(k.phvTila&&k.phvTila!=='AN')tiedot+='- Kasvupyrähdystila: '+(k.phvTila==='PH'?'Kasvupyrähdysvaiheessa nyt':'Kasvu kiihtymässä')+'\n';
    if(k.profiili)tiedot+='- Pelaajaprofiili: '+k.profiili+'\n';
    if(k.fleiPct!==null&&k.fleiPct!==undefined)tiedot+='- Harjoitteluvalmius (FLEI): '+k.fleiPct+'%\n';
  }
  var kieliohje=_kieli==='sv'
    ?'Svara alltid på svenska. Var varm, kort och praktisk — max 3 stycken. Inga tekniska termer.'
    :_kieli==='en'
    ?'Always answer in English. Be warm, concise and practical — max 3 paragraphs. No technical jargon.'
    :'Vastaa aina suomeksi. Ole lämminhenkinen, käytännönläheinen ja lyhyt — max 3 kappaletta. Ei teknistä jargonia.';

  return 'Olet TalentMaster-järjestelmän vanhemman opas -assistentti. Autat jalkapalloilijoiden vanhempia tukemaan nuorta urheilijaa kotona.'
    +tiedot
    +'\n\nErikoisosaamistasi:\n'
    +'- Nuorten urheilijoiden motivaatio — sisäinen vs. ulkoinen\n'
    +'- Kasvupyrähdys (PHV) ja sen vaikutus harjoitteluun\n'
    +'- Ravitsemus ja uni palautumisessa\n'
    +'- Vanhemman rooli — tukeva aikuinen, ei valmentaja\n'
    +'- Pettymysten käsittely ja henkinen kasvu\n'
    +'\n'+kieliohje+'\n'
    +'Et ole lääkäri — suosittele ammattilaista vakavissa asioissa.';

  var el=document.getElementById('chatViestit');
  var div=document.createElement('div');
  div.className='viesti '+rooli;
  var bub=document.createElement('div');
  bub.className='viesti-bubble';
  bub.textContent=teksti;
  div.appendChild(bub);
  el.appendChild(div);
  el.scrollTop=el.scrollHeight;
  return bub;
}

function _naytaKirjoittaa(){
  var el=document.getElementById('chatViestit');
  var div=document.createElement('div');
  div.className='kirjoittaa-wrap';div.id='kirjoittaaDiv';
  div.innerHTML='<div class="kirjoittaa-pisteet"><div class="piste"></div><div class="piste"></div><div class="piste"></div></div>';
  el.appendChild(div);el.scrollTop=el.scrollHeight;
}
function _poistaKirjoittaa(){var e=document.getElementById('kirjoittaaDiv');if(e)e.remove();}

async function _lahetaAPIlla(teksti){
  var n=document.getElementById('chatLahetaNappi');
  if(n){n.disabled=true;n.textContent=_t('Lähetetään...','Skickar...','Sending...');}
  _lisaaViesti('user',teksti);
  _chatHistoria.push({role:'user',content:teksti});
  // Rajaa historia max 12 viestiin
  if(_chatHistoria.length>12)_chatHistoria=_chatHistoria.slice(_chatHistoria.length-12);
  _naytaKirjoittaa();

  try{
    var vastaus=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:1000,
        system:_rakennaSysteemiohje(),
        messages:_chatHistoria
      })
    });
    var data=await vastaus.json();
    _poistaKirjoittaa();
    var aiTxt=(data.content&&data.content[0]&&data.content[0].text)||_t('Pahoittelen, vastausta ei saatu. Kokeile uudelleen.','Tyvärr, inget svar. Försök igen.','Sorry, no response received. Please try again.');
    _chatHistoria.push({role:'assistant',content:aiTxt});
    _lisaaViesti('ai',aiTxt);
    // Tallenna sessio localStorage:iin (24h)
    _tallennaHistoriaLocalStorage();
  }catch(e){
    _poistaKirjoittaa();
    _lisaaViesti('ai',_t('Yhteysongelma. Tarkista verkko ja kokeile uudelleen.','Anslutningsfel. Kontrollera nätet och försök igen.','Connection error. Check your network and try again.'));
  }

  if(n){n.disabled=false;n.textContent=_t('Kysy','Fråga','Ask');}
  var ta=document.getElementById('chatSyote');
  if(ta)ta.focus();
}

// LocalStorage-sessio (24h TTL)
function _tallennaHistoriaLocalStorage(){
  if(!_pelaajaId)return;
  try{
    localStorage.setItem('tm_chat_'+_pelaajaId,JSON.stringify({ts:Date.now(),hist:_chatHistoria}));
  }catch(e){}
}
function _lataaHistoriaLocalStorage(){
  if(!_pelaajaId)return;
  try{
    var raw=localStorage.getItem('tm_chat_'+_pelaajaId);
    if(!raw)return;
    var obj=JSON.parse(raw);
    // Vanhenee 24h
    if(Date.now()-obj.ts>86400000){localStorage.removeItem('tm_chat_'+_pelaajaId);return;}
    _chatHistoria=obj.hist||[];
    // Palauta viestit näkyviin
    if(_chatHistoria.length>0){
      var el=document.getElementById('chatViestit');
      el.innerHTML='';
      _chatHistoria.forEach(function(m){_lisaaViesti(m.role,m.content);});
    }
  }catch(e){}
}

// ── APUFUNKTIOT ───────────────────────────────────────────────────
function _pct(arvo){if(!arvo&&arvo!==0)return null;var v=parseFloat(arvo);return Math.round(v>1?v:v*100);}
function _kehitysLause(flei){if(!flei)return _t('hyvässä vauhdissa.','i bra takt.','making great progress.');if(flei>=70)return _t('hienosti.','jättebra.','fantastically.');if(flei>=50)return _t('kovaa töissä.','hårt.','working hard.');return _t('oikeaan suuntaan.','i rätt riktning.','in the right direction.');}
function _profiiliEmoji(p){return{Railgun:'⚡',Maestro:'🎭',Shadowstep:'👁️',Titan:'🏗️'}[p]||'⚽';}
function _profiiliKuvaus(p){return{Railgun:'Nopea, räjähtävä pelaaja jolla on hyvä pelinlukutaito.',Maestro:'Teknisesti lahjakas pelaaja joka hallitsee palloa erinomaisesti.',Shadowstep:'Ketterä ja ovela pelaaja. Löytää tilaa sieltä missä muut eivät näe.',Titan:'Fyysisesti vahva ja kestävä pelaaja. Pitää alueen hallinnassa.'}[p]||'Monipuolinen pelaaja joka kehittyy tasaisesti kaikilla osa-alueilla.';}
function _fleiSelitys(pct){if(!pct)return _t('Harjoitettavuuskartoitus tehdään pian. Valmentaja ottaa yhteyttä.','Träningsutvärdering görs snart. Tränaren tar kontakt.','Training assessment coming soon. The coach will be in touch.');if(pct>=70)return _t('Keho on hyvin valmis harjoitteluun. Harjoittelu tuottaa tulosta ja loukkaantumisriski on pieni.','Kroppen är väl redo för träning. Träningen ger resultat och skaderisken är liten.','The body is well-prepared for training. Results are coming and injury risk is low.');if(pct>=50)return _t('Kehossa on parannettavaa. Valmentaja on antanut kohdennettuja harjoitteita.','Det finns förbättringspotential. Tränaren har gett riktade övningar.','There is room for improvement. The coach has given targeted exercises.');return _t('Harjoittelemme ensin kehon kuntoon ennen täyttä ohjelmaa. Täysin normaalia kasvavalla urheilijalla.','Vi tränar kroppen i form först. Helt normalt för en växande idrottare.','Building body readiness first. Completely normal for a growing athlete.');}
function _phvInfo(tila,nimi){if(tila==='PH'||tila==='KV')return '<div class="phv-info"><strong>📏 '+_t('Tiedoksi:','Info:','Note:')+'</strong> '+nimi+' '+_t('on juuri nyt kasvupyrähdysvaiheessa. Harjoittelukuormaa on pienennetty hieman — tämä on tärkeää loukkaantumisten ehkäisemiseksi.','är just nu i tillväxtspurt. Träningsbelastningen har minskats något — viktigt för att förebygga skador.','is currently in a growth spurt. Training load has been reduced — important for injury prevention.')+'</div>';return '<div class="phv-info" style="border-color:rgba(46,213,115,.2);background:rgba(46,213,115,.04)">'+_t('Hyvä tietää: '+nimi+' ei tällä hetkellä ole kasvupyrähdyksessä, joten harjoittelu voi jatkua normaalisti.','Bra att veta: '+nimi+' är för närvarande inte i tillväxtspurt, träningen kan fortsätta normalt.','Good to know: '+nimi+' is not currently in a growth spurt, training can continue normally.')+'</div>';}
function _vahvuudetHtml(k,profiili,nimi){if(!k)return '<li>⚽ '+_t('Vahvuudet kartoitetaan pian.','Styrkor kartläggs snart.','Strengths will be mapped soon.')+'</li>';var kp=k.ketjupisteet||{};var KT={sbl:'⚡ Vauhti',ll:'↔️ Suunnanmuutos',sfl:'🦵 Lähtövoima',dfl:'🏗️ Kehonhallinta',sl:'🔄 Kierto'};var arvot=Object.entries(KT).map(function(e){return{key:e[0],label:e[1],arvo:parseFloat(kp[e[0]]||0)};}).filter(function(x){return x.arvo>0;}).sort(function(a,b){return b.arvo-a.arvo;});if(arvot.length===0)return '<li>⚽ '+_t('Vahvuudet kartoitetaan pian.','Styrkor kartläggs snart.','Strengths will be mapped soon.')+'</li>';return arvot.slice(0,3).map(function(v){return '<li>'+v.label+' — '+_tasoSana(v.arvo)+'</li>';}).join('');}
function _tasoSana(arvo){if(arvo>=2.5)return _t('erinomainen','utmärkt','excellent');if(arvo>=2.0)return _t('hyvä','bra','good');if(arvo>=1.5)return _t('kehittyvä','under utveckling','developing');return _t('harjoitellaan','tränas','training');}
function _ketjuSelitys(ketju){return{sbl:'juoksuvauhti ja liikkuvuus',ll:'suunnanmuutos pallon kanssa',sfl:'lähtönopeus ja räjähtävyys',dfl:'kehonhallinta ja tasapaino',sl:'kiertovoima ja löyntivoima',fl:'pallon käsittely'}[ketju]||ketju;}
function _oletusKotitehtavat(profiili){return[{ikoni:'⚽',nimi:'Pallollinen',aika:'10 min',kuvaus:'Kolme merkkiä kotipihalla. Kuljeta palloa niiden välistä mahdollisimman nopeasti — viisi kierrosta, laske aika.'},{ikoni:'💪',nimi:'Kehoa vahvistava',aika:'5 min',kuvaus:'Yhden jalan seisonta: seiso yhdellä jalalla 30 sekuntia, sitten vaihda. 3 kertaa kummallakin.'}];}
function _pvmStr(ts){if(!ts)return '—';var d=ts.toDate?ts.toDate():new Date(ts);var diff=Math.floor((Date.now()-d.getTime())/86400000);if(diff===0)return _t('tänään','idag','today');if(diff===1)return _t('eilen','igår','yesterday');if(diff<7)return diff+' '+_t('päivää sitten','dagar sedan','days ago');return d.toLocaleDateString('fi');}

// ── Kirjautuminen ─────────────────────────────────────────────────
function kirjauduSisaan(){
  var syote=(document.getElementById('loginEmail').value||'').trim();
  var pass=document.getElementById('loginPass').value||'';
  var virheEl=document.getElementById('loginVirhe');
  if(!syote||!pass){virheEl.textContent='Syötä sähköposti tai PalloID ja salasana.';return;}
  virheEl.textContent='';
  var onPalloID=/^\d{5,10}$/.test(syote);
  if(onPalloID){
    virheEl.textContent='Haetaan PalloID:llä...';
    var seurat=['kpv','fcl','palloiirot','yvies','sjk','grifk'];
    var loydetty=false;
    (async function(){
      for(var i=0;i<seurat.length;i++){
        try{
          var s=await _db.collection('seurat').doc(seurat[i]).collection('pelaajat').where('palloID','==',syote).limit(1).get();
          if(!s.empty){var email=s.docs[0].data().huoltajaEmail;if(email){virheEl.textContent='';loydetty=true;_kirjautuminenKesken=true;_auth.signInWithEmailAndPassword(email,pass).then(function(c){_kirjautuminenKesken=false;_lataaData(c.user);}).catch(function(e){_kirjautuminenKesken=false;virheEl.textContent=(e.code==='auth/wrong-password'||e.code==='auth/user-not-found')?'Väärä salasana.':'Virhe: '+e.message;});return;}}
        }catch(e2){}
      }
      if(!loydetty)virheEl.textContent='PalloID:tä ei löydy. Tarkista numero tai käytä sähköpostia.';
    })();
    return;
  }
  _kirjautuminenKesken=true;
  _auth.signInWithEmailAndPassword(syote,pass).then(function(c){_kirjautuminenKesken=false;_lataaData(c.user);}).catch(function(e){_kirjautuminenKesken=false;virheEl.textContent=(e.code==='auth/wrong-password'||e.code==='auth/user-not-found')?'Väärä sähköposti tai salasana.':'Virhe: '+e.message;});
}
function kirjauduUlos(){
  _chatHistoria=[];
  _auth.signOut().then(function(){
    _user=null;_pelaaja=null;_esitaytaLogin();nayta('sLogin');
    var ld=document.getElementById('pelaajaSivuLinkki');if(ld)ld.style.display='none';
    document.getElementById('chatFab').classList.remove('nakyvilla');
    suljeChat();
  });
}
function lahetaSalasana(){
  var email=(document.getElementById('loginEmail').value||'').trim();
  if(!email){toast('Syötä ensin sähköpostiosoite');return;}
  _auth.sendPasswordResetEmail(email).then(function(){toast('Salasanalinkki lähetetty: '+email);}).catch(function(e){toast('Virhe: '+e.message,false);});
}
function toast(msg,ok){
  var el=document.getElementById('toast');
  el.textContent=msg;el.style.background=ok===false?'var(--red)':'var(--teal)';
  el.classList.add('vis');setTimeout(function(){el.classList.remove('vis');},3200);
}
